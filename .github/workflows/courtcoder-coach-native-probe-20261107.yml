# Reviewed original-source-only workflow: private NBA pilot publication, aggregate-only public status. Git blob SHA uses a single NUL byte.
name: CourtCoder Coach private original NBA event diagnostics
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/courtcoder-coach-native-probe-20261107.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: coach-native-probe-20261107
  cancel-in-progress: false
jobs:
  private-native-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PROBE_SHA: 004d84ff6d8c31899a6fa3a4d305f0e7fcf2e7e9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify private 60Hz-derived NBA event windows
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api repos/$PRIVATE_REPO --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse \
            -b research/gamepulse-clock-boundary-integrity-20261025 \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/native"
          git -C "$RUNNER_TEMP/native" sparse-checkout set \
            gamepulse/fusion/materialized/igp_all_original_xyz/0022600167 \
            gamepulse/fusion/official_pbp_timing/games \
            gamepulse/fusion/evidence/companion_sdk_original_0022600167
          git clone -q --filter=blob:none --depth=1 --sparse \
            -b feature/courtcoder-coach-web-20261106 \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/coach"
          git -C "$RUNNER_TEMP/coach" fetch -q --depth=1 origin "$PROBE_SHA"
          git -C "$RUNNER_TEMP/coach" checkout -q --detach "$PROBE_SHA"
          git -C "$RUNNER_TEMP/coach" sparse-checkout set courtcoder/coach
          test "$(git -C "$RUNNER_TEMP/coach" rev-parse HEAD)" = "$PROBE_SHA"
          set +e
          python3 "$RUNNER_TEMP/coach/courtcoder/coach/qa/private_native_probe_v1.py" \
            --source-root "$RUNNER_TEMP/native" \
            --roster-file "$RUNNER_TEMP/coach/courtcoder/coach/game_player_directory_full121_v1.json" \
            --private-output "$RUNNER_TEMP/native-probe.json" \
            >"$RUNNER_TEMP/private-diagnostics.log" 2>&1
          rc=$?
          set -e
          export COACH_RC="$rc"
          # Never export original XYZ, actor identities or per-frame observations
          # from the private runner. Public console receives counts only.
          if [ "$rc" -ne 0 ]; then
            echo COACH_PRIVATE_ORIGINAL_PROBE_RUNTIME_FAIL
            exit 1
          fi
          python3 - <<'PY'
          import json,os,pathlib
          data=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"native-probe.json").read_text())
          fields=("native_window_frames","shot_event_candidates",
                  "events_with_native_five_plus_ball","events_with_native_ten_plus_ball",
                  "events_with_contiguous_five_ball_700ms","events_with_contiguous_ten_ball_700ms")
          print("COACH_ORIGINAL_NATIVE_SAFE_COUNTS "+json.dumps({k:data[k] for k in fields},sort_keys=True))
          # Coarsened whole-game coordinate envelopes, not an individual player
          # position or trajectory. Needed to choose the correct native unit scale.
          import math
          ext={}
          for k in ("native_player_x","native_player_y","native_ball_x","native_ball_y"):
              d=data.get(k) or {}
              ext[k]={z:(round(d[z]/5)*5 if isinstance(d.get(z),(float,int)) else None)
                      for z in ("min","p10","median","p90","max")}
          print("COACH_NATIVE_SOURCE_COARSE_AXIS_ENVELOPES "+json.dumps(ext,sort_keys=True))
          for field in ("sample_event_313","sample_event_7"):
              e=data.get(field) or {}
              print("COACH_EVENT_SAFE_COVERAGE "+json.dumps({"which":field,
                  "frame_count":e.get("frame_count",0),
                  "full5_plus_ball_frames":e.get("full5_plus_ball_frames",0),
                  "full10_plus_ball_frames":e.get("full10_plus_ball_frames",0),
                  "original_ball_frames":e.get("original_ball_frames",0),
                  "contiguous_five_ball_max_ms":e.get("contiguous_five_ball_max_ms",0),
                  "contiguous_ten_ball_max_ms":e.get("contiguous_ten_ball_max_ms",0)},sort_keys=True))
          PY
          # Native private pilot materialization: original SDK is never printed,
          # uploaded to public artifacts or exposed in public runner content.
          set +e
          python3 "$RUNNER_TEMP/coach/courtcoder/coach/qa/build_private_event_pilot_v1.py" \
            --source-root "$RUNNER_TEMP/native" \
            --roster-file "$RUNNER_TEMP/coach/courtcoder/coach/game_player_directory_full121_v1.json" \
            --out "$RUNNER_TEMP/coach-native-pilot" \
            >"$RUNNER_TEMP/native-pilot-diagnostics-private.log" 2>&1
          pilot_rc=$?
          set -e
          if [ "$pilot_rc" -ne 0 ]; then
            echo COACH_NATIVE_PILOT_SOURCE_BUILD_FAIL
            grep -Eo "(ValueError|KeyError|TypeError): [A-Z][A-Z0-9_]+" "$RUNNER_TEMP/native-pilot-diagnostics-private.log" | tail -1 || true
            # Print only exception class and PRIVATE PUBLISHER source line number;
            # never print NBA JSON payloads, source frames or player coordinates.
            python3 - <<'PY'
          import os,pathlib,re
          data=(pathlib.Path(os.environ["RUNNER_TEMP"])/"native-pilot-diagnostics-private.log").read_text(errors="replace")
          matches=re.findall(r'File "[^"]*build_private_event_pilot_v1[.]py", line ([0-9]+), in ([A-Za-z0-9_]+)',data)
          print("COACH_PRIVATE_PUBLISHER_FAILURE_LINE",matches[-1] if matches else "UNKNOWN")
          exception=(data.strip().splitlines() or ["UnknownError"])[-1].split(":",1)[0]
          print("COACH_PRIVATE_PUBLISHER_EXCEPTION_CLASS",exception if re.fullmatch(r"[A-Za-z][A-Za-z0-9_]{1,60}",exception) else "UNKNOWN")
          PY
            exit 1
          fi
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"coach-native-pilot"
          cat=json.loads((p/"catalog.json").read_bytes())
          qa=json.loads((p/"catalog.qa.json").read_bytes())
          game=cat["games"]["0022600167"]
          assert 1<=game["event_count"]<=100
          assert qa["original_nba_sdk_sha_checked"] is True
          assert qa["source_geometry_calibrated"] is False
          assert qa["original_source_frames"]>=game["event_count"]*5
          print("COACH_PILOT_PRIVATE_GENERATION_SAFE_COUNTS "+
                json.dumps({"real_plays":game["event_count"],
                            "native_frames":qa["original_source_frames"],
                            "complete_ten_plus_ball_frames":qa["full_ten_plus_direct_ball_frames"]},
                           sort_keys=True))
          PY
          # Publish only to the authenticated PRIVATE 104 feature branch.
          # GitHub contents API enforces branch permissions, and existing bytes
          # must match exactly. Never print original NBA licensed coordinates.
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"coach-native-pilot"
          repo=os.environ["PRIVATE_REPO"]
          branch="feature/courtcoder-coach-web-20261106"
          prefix="gamepulse/coach_pilot_release_20261107_v2"
          names=("catalog.json","catalog.qa.json",
                 "plays/0022600167.json","manifest.json")
          for relative in names:
              data=(root/relative).read_bytes()
              blob=hashlib.sha1(b"blob "+str(len(data)).encode()+bytes([0])+data).hexdigest()
              remote="repos/"+repo+"/contents/"+prefix+"/"+relative
              old=subprocess.run(["gh","api",remote+"?ref="+branch],
                                 capture_output=True,text=True)
              if old.returncode==0:
                  if json.loads(old.stdout)["sha"]!=blob:
                      raise ValueError("PRIVATE_NATIVE_PILOT_EXISTING_BLOB_IMMUTABILITY_DRIFT")
                  continue
              if "404" not in old.stderr and "Not Found" not in old.stderr:
                  raise ValueError("PRIVATE_NATIVE_PILOT_REMOTE_READ_REJECTED")
              packet={"branch":branch,"message":"coach(native): original NBA 12-play private pilot SHA source release",
                      "content":base64.b64encode(data).decode("ascii")}
              saved=subprocess.run(["gh","api","--method","PUT",remote,"--input","-"],
                     input=json.dumps(packet),capture_output=True,text=True)
              if saved.returncode!=0:
                  raise ValueError("PRIVATE_NATIVE_PILOT_WRITE_PERMISSION_OR_CONFLICT")
              if json.loads(saved.stdout)["content"]["sha"]!=blob:
                  raise ValueError("PRIVATE_NATIVE_PILOT_PRIVATE_GIT_SHA_READBACK_DRIFT")
          print("COACH_NATIVE_PILOT_PRIVATE_FEATURE_ASSETS_PUBLISHED")
          PY
          echo COACH_PRIVATE_NATIVE_PILOT_BUILD_PASS
          echo COACH_PRIVATE_NATIVE_SOURCE_PROBE_PASS
