# Reviewed original-source-only workflow: private repositories and PR receipts, aggregate-only public status.
name: CourtCoder Coach private original NBA event diagnostics
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/courtcoder-coach-native-probe-20261107.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: coach-native-probe-20261107
  cancel-in-progress: false
jobs:
  private-native-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PROBE_SHA: 84326d2a69efbfaa299b1235b7a78f1469876f3c
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify private 60Hz-derived NBA event windows
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api repos/$PRIVATE_REPO --jq .private)" = true
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse \
            -b research/gamepulse-clock-boundary-integrity-20261025 \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/native"
          git -C "$RUNNER_TEMP/native" sparse-checkout set \
            gamepulse/fusion/materialized/igp_all_original_xyz/0022600167 \
            gamepulse/fusion/official_pbp_timing/games \
            gamepulse/fusion/evidence/companion_sdk_original_0022600167
          git clone -q --filter=blob:none --depth=1 --sparse \
            -b feature/courtcoder-coach-web-20261106 \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/coach"
          git -C "$RUNNER_TEMP/coach" fetch -q --depth=1 origin "$PROBE_SHA"
          git -C "$RUNNER_TEMP/coach" checkout -q --detach "$PROBE_SHA"
          git -C "$RUNNER_TEMP/coach" sparse-checkout set courtcoder/coach
          test "$(git -C "$RUNNER_TEMP/coach" rev-parse HEAD)" = "$PROBE_SHA"
          set +e
          python3 "$RUNNER_TEMP/coach/courtcoder/coach/qa/private_native_probe_v1.py" \
            --source-root "$RUNNER_TEMP/native" \
            --roster-file "$RUNNER_TEMP/coach/courtcoder/coach/game_player_directory_full121_v1.json" \
            --private-output "$RUNNER_TEMP/native-probe.json" \
            >"$RUNNER_TEMP/private-diagnostics.log" 2>&1
          rc=$?
          set -e
          export COACH_RC="$rc"
          # Never export original XYZ, actor identities or per-frame observations
          # from the private runner. Public console receives counts only.
          if [ "$rc" -ne 0 ]; then
            echo COACH_PRIVATE_ORIGINAL_PROBE_RUNTIME_FAIL
            exit 1
          fi
          python3 - <<'PY'
          import json,os,pathlib
          data=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"native-probe.json").read_text())
          fields=("native_window_frames","shot_event_candidates",
                  "events_with_native_five_plus_ball","events_with_native_ten_plus_ball")
          print("COACH_ORIGINAL_NATIVE_SAFE_COUNTS "+json.dumps({k:data[k] for k in fields},sort_keys=True))
          # Coarsened whole-game coordinate envelopes, not an individual player
          # position or trajectory. Needed to choose the correct native unit scale.
          import math
          ext={}
          for k in ("native_player_x","native_player_y","native_ball_x","native_ball_y"):
              d=data.get(k) or {}
              ext[k]={z:(round(d[z]/5)*5 if isinstance(d.get(z),(float,int)) else None)
                      for z in ("min","p10","median","p90","max")}
          print("COACH_NATIVE_SOURCE_COARSE_AXIS_ENVELOPES "+json.dumps(ext,sort_keys=True))
          for field in ("sample_event_313","sample_event_7"):
              e=data.get(field) or {}
              print("COACH_EVENT_SAFE_COVERAGE "+json.dumps({"which":field,
                  "frame_count":e.get("frame_count",0),
                  "full5_plus_ball_frames":e.get("full5_plus_ball_frames",0),
                  "full10_plus_ball_frames":e.get("full10_plus_ball_frames",0),
                  "original_ball_frames":e.get("original_ball_frames",0)},sort_keys=True))
          PY
          echo COACH_PRIVATE_NATIVE_SOURCE_PROBE_PASS
