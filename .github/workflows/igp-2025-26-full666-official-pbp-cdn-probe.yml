name: IGP 2025-26 original NBA official PBP exact game ID and possession schema probe
'on':
  push:
    branches: [main]
    paths: [.github/workflows/igp-2025-26-full666-official-pbp-cdn-probe.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Test 2025-26 official NBA PBP source availability, action key identity and possession-field semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          python3 - <<'PY'
          import collections,json,urllib.request,urllib.error,urllib.parse
          for gid in ('0022501132','0042500205','0052500211'):
            url='https://cdn.nba.com/static/json/liveData/playbyplay/playbyplay_'+gid+'.json'
            try:
              request=urllib.request.Request(url,headers={
                'User-Agent':'Mozilla/5.0 (compatible; IGP-Source-Reference-QA/1.0)',
                'Accept':'application/json'})
              with urllib.request.urlopen(request,timeout=15) as resp:
                data=json.load(resp)
              game=data.get('game') or {}
              actions=game.get('actions') or []
              keys=collections.Counter(k for a in actions if isinstance(a,dict) for k in a)
              fields={f:{'present':keys[f], 'nonnull':sum(a.get(f) is not None for a in actions),
                'unique_nonnull':len(set(str(a.get(f)) for a in actions if a.get(f) is not None))}
                for f in ('actionNumber','period','clock','timeActual','personId','teamId','possession','actionType','subType','scoreHome','scoreAway')}
              types=collections.Counter(str(a.get('actionType')) for a in actions)
              print('HISTORICAL_2025_OFFICIAL_PBP_SCHEMA',json.dumps({
                'game_id':gid,'source':'NBA_CDN_LIVE_DATA','nba_game_id':game.get('gameId'),
                'actions':len(actions),'keys_count':len(keys),'fields':fields,
                'event_type_counts':dict(types),'duplicate_action_numbers':
                  len(actions)-len(set((a.get('period'),a.get('actionNumber')) for a in actions))},
                sort_keys=True),flush=True)
            except Exception as e:
              print('HISTORICAL_2025_OFFICIAL_PBP_UNAVAILABLE',gid,type(e).__name__,str(e)[:120],flush=True)
          PY
