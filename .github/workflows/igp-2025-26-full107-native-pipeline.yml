# Source-only private Full107 native scene/XYZ processing, all outputs in private 104.
# Revision: source-masked short-segment holdout result is fully keyed; no discarded frames.
name: IGP FULL107-native 2025-26 666-game historical reconstruction
'on':
  push:
    branches: [main]
    paths: [.github/workflows/igp-2025-26-full107-native-pipeline.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-full107-historical-native-all
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
  PRIVATE_BRANCH: research/gamepulse-clock-boundary-integrity-20261025
  RELEASE: igp-2025-26-full107-native-20261105
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify source isolation and fetch Full107 native engine modules
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set --no-cone \
            gamepulse/fusion/igp_full107_native_historical_2025_26_v1.py \
            gamepulse/fusion/igp_native_scene_model_v2.py \
            gamepulse/fusion/igp_historical_defender_proxy_v1.py \
            gamepulse/fusion/igp_tracking_model_a_holdout_2026.py \
            gamepulse/fusion/igp_tracking_model_b_holdout_2026.py \
            gamepulse/fusion/igp_tracking_model_c0_endpoint_velocity_bridge_2026.py \
            gamepulse/fusion/tests/test_igp_full107_native_historical_2025_26_v1.py
      - name: Independently execute Full107 native scene synthetic source-masking regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH="$PWD:$PWD/gamepulse/fusion"
          python3 -m py_compile gamepulse/fusion/igp_full107_native_historical_2025_26_v1.py
          python3 -m unittest -q gamepulse.fusion.tests.test_igp_full107_native_historical_2025_26_v1
          echo FULL107_NATIVE_HISTORICAL_ENGINE_TEST_PASS
      - name: Prepare protected historical Full107 output and retrieve first immutable shard
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE" --repo timeedmonds-maker/104 >/dev/null 2>&1; then
            gh release create "$RELEASE" --repo timeedmonds-maker/104 \
              --target "$PRIVATE_BRANCH" --draft \
              --title '2025-26 Full107-native reconstructed XYZ candidate' \
              --notes 'Uses the actual Full107-era igp_native_scene_model_v2 on historical source with exact source lineups provisionally graded, not Full88/Full92 default. SHA-pinned original 2025-26 tracking archive unchanged. Original observed XYZ separately retained; reconstruction research pending independent source and shot-level holdouts.'
          fi
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/derived"
          gh release download igp-public-gamepulse-2025-26-20261105 \
            --repo timeedmonds-maker/104 --pattern nba-2025-26-source-index.json \
            --pattern nba-2025-26-shard-001.zip --dir "$RUNNER_TEMP/source"
      - name: Run Full107 native scene engine against first historical shard, preserve original XYZ
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/private/gamepulse/fusion"
          python3 "$RUNNER_TEMP/private/gamepulse/fusion/igp_full107_native_historical_2025_26_v1.py" \
            --index "$RUNNER_TEMP/source/nba-2025-26-source-index.json" \
            --shard "$RUNNER_TEMP/source/nba-2025-26-shard-001.zip" \
            --out "$RUNNER_TEMP/derived"
          gh release upload "$RELEASE" "$RUNNER_TEMP/derived/"* \
            --repo timeedmonds-maker/104 --clobber
          echo FULL107_NATIVE_HISTORICAL_SHARD_001_PRIVATE_OK
  full_archive:
    needs: pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ['002','003','004','005','006','007','008','009','010','011','012','013','014','015']
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Private Full107 native source engine and original SHA archive
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set --no-cone \
            gamepulse/fusion/igp_full107_native_historical_2025_26_v1.py \
            gamepulse/fusion/igp_native_scene_model_v2.py \
            gamepulse/fusion/igp_historical_defender_proxy_v1.py \
            gamepulse/fusion/igp_tracking_model_a_holdout_2026.py \
            gamepulse/fusion/igp_tracking_model_b_holdout_2026.py \
            gamepulse/fusion/igp_tracking_model_c0_endpoint_velocity_bridge_2026.py
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/derived"
          gh release download igp-public-gamepulse-2025-26-20261105 \
            --repo timeedmonds-maker/104 --pattern nba-2025-26-source-index.json \
            --pattern "nba-2025-26-shard-$SHARD.zip" --dir "$RUNNER_TEMP/source"
      - name: Full107 native scene XYZ reconstruction and private immutable sidecar
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/private/gamepulse/fusion"
          python3 "$RUNNER_TEMP/private/gamepulse/fusion/igp_full107_native_historical_2025_26_v1.py" \
            --index "$RUNNER_TEMP/source/nba-2025-26-source-index.json" \
            --shard "$RUNNER_TEMP/source/nba-2025-26-shard-$SHARD.zip" \
            --out "$RUNNER_TEMP/derived"
          gh release upload "$RELEASE" "$RUNNER_TEMP/derived/"* \
            --repo timeedmonds-maker/104 --clobber
          echo FULL107_NATIVE_HISTORICAL_PRIVATE_SHARD_OK_"$SHARD"
  reduce:
    if: always()
    needs: [pilot,full_archive]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Source-only 666-game Full107 native-model final tally
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          mkdir -p "$RUNNER_TEMP/qa"
          gh release download "$RELEASE" --repo timeedmonds-maker/104 \
            --pattern 'full107-native-*-qa.json' --dir "$RUNNER_TEMP/qa"
          python3 - <<'PY'
          import collections,json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"qa"
          files=sorted(root.glob("full107-native-*-qa.json"))
          counts=collections.Counter();games=set()
          for file in files:
              r=json.loads(file.read_text())
              assert r["schema"]=="igp.full107-native-scene-historical-2025-26.v1"
              assert r["original_source_immutable"] is True
              assert r["not_full88_or_full92_dataset_or_default"] is True
              assert not games.intersection(r["per_game"])
              games.update(r["per_game"])
              counts.update(r["counts"])
          complete=len(files)==15 and len(games)==666 and counts["source_native_frames"]==19440900
          receipt={"schema":"igp.historical-full107-native-666game-run-receipt.v1",
            "status":"SOURCE_POPULATION_COMPLETE" if complete else "PARTIAL_NOT_PROMOTED",
            "games":len(games),"shards":len(files),"counts":dict(counts),
            "native_source_denominator":counts["source_native_frames"],
            "full107_native_xyz_complete":counts["native_engine_complete_ten_ball"],
            "full107_native_complete_fraction":counts["native_engine_complete_ten_ball"]/counts["source_native_frames"] if counts["source_native_frames"] else None,
            "source_lineup_grade":"PROVISIONAL_NOT_INDEPENDENTLY_VERIFIED",
            "original_source_unchanged":True}
          path=root/"full107-native-2025-26-all666-qa.json"
          path.write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          print("FULL107_NATIVE_HISTORICAL_ALL666_RESULT",json.dumps(receipt,sort_keys=True))
          PY
          gh release upload "$RELEASE" "$RUNNER_TEMP/qa/full107-native-2025-26-all666-qa.json" \
            --repo timeedmonds-maker/104 --clobber
