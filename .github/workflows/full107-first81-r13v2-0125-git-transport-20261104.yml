# Isolated exact original Full81 game; SHA-original source via git, not private REST.
name: Full107 first81 0125 R13v2 source-label double replay
on:
  push:
    branches: [main]
    paths: ['.github/workflows/full107-first81-r13v2-0125-git-transport-20261104.yml', 'tools/public_content_guard.py']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  private-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      REPO: timeedmonds-maker/104
      BRANCH: analysis/full107-first81-r13v2-touchjoin-20261104
      PIN: 9fe4f4f7a09cd10fe78d46cb1cebb9b5f44f0840
      LABEL_REF: research/r13-github-official-touch-snapshots-20261104
      GID: '0022600125'
      LABEL_SHA: d930b26551c140499cb4723c23dc5071d99d0d61
      DEST: gamepulse/fusion/qa/analysis/igp_first81_r13v2_frontcourt_ever_double_pilot_20261104/game_0022600125.json
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 tools/public_content_guard.py
      - name: Read exact native and touch source via Git; no raw public results
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$BRANCH" "https://github.com/$REPO.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PIN"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PIN"
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PIN"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$LABEL_REF"
          git -C "$RUNNER_TEMP/private" show "FETCH_HEAD:gamepulse/fusion/qa/r13_github_official_touch_20261104/0022600125_native_labels.json.gz" > "$RUNNER_TEMP/labels.gz"
          test "$(git hash-object "$RUNNER_TEMP/labels.gz")" = "$LABEL_SHA"
          echo FULL81_0125_PRIVATE_SOURCE_SHA_VERIFIED
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion/analysis:gamepulse/fusion
          script=gamepulse/fusion/analysis/r17_first81_r13v2_frontcourt_ever_double_source_pilot_20261104.py
          python3 -B "$script" --selftest
          python3 -B "$script" --root . --game-id "$GID" --labels "$RUNNER_TEMP/labels.gz" --out "$RUNNER_TEMP/result.json" > "$RUNNER_TEMP/private-log"
          python3 - <<'PY'
          import json,os,pathlib
          x=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"result.json").read_bytes())
          assert x["game_id"]=="0022600125" and x["original_source_modified"] is False
          assert x["promotion_allowed"] is False and x["independent_precision"] is None
          print("R13V2_ORIGINAL_0125_REPLAY_PASS",x["r13_v2_touch_count"])
          PY
          git fetch -q origin "$BRANCH"
          git checkout -q -B qa-publish "origin/$BRANCH"
          mkdir -p "$(dirname "$DEST")"
          cp "$RUNNER_TEMP/result.json" "$DEST"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$DEST"
          git diff --cached --check
          if git diff --cached --quiet; then echo SOURCE_RESULT_ALREADY_PERSISTED; exit 0; fi
          git commit -q -m "qa(private): original 0125 R13v2 double results [skip ci]"
          for n in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo R13V2_ORIGINAL_0125_RESULT_PERSISTED
              exit 0
            fi
            sleep "$n"
          done
          exit 1
