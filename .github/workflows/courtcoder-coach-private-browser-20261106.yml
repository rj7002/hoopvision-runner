# Public control plane only: private CourtCoder source and browser screenshots
# Reviewed and explicitly allowlisted in tools/public_content_guard.py.
# are never uploaded to this public repository, Actions logs, or artifacts.
name: CourtCoder Coach protected Chromium and CPU acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/courtcoder-coach-private-browser-20261106.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: courtcoder-coach-private-browser-source-free-20261106
  cancel-in-progress: false
jobs:
  private-coach-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: feature/courtcoder-coach-web-20261106
      PRIVATE_SHA: 34b571d7e297082bdaf3f581a5d628186f8b7340
      PRIVATE_REPO: timeedmonds-maker/104
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate public-to-private confidentiality boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api repos/$PRIVATE_REPO --jq .private)" = true
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test exact private Coach commit without public logs or screenshots
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone --quiet --depth=1 --filter=blob:none --sparse \
            -b "$PRIVATE_BRANCH" "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PRIVATE_SHA"
          git -C "$RUNNER_TEMP/private" sparse-checkout set \
            courtcoder config contracts hoopvision/scouting
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PRIVATE_SHA"
          test -f "$RUNNER_TEMP/private/courtcoder/coach/index.html"
          test -f "$RUNNER_TEMP/private/courtcoder/qa/coach_ui_visual_contract.test.cjs"
          test -f "$RUNNER_TEMP/private/courtcoder/qa/coach_ui_browser_acceptance.cjs"
          echo COACH_PINNED_PRIVATE_SOURCE_READY
          cd "$RUNNER_TEMP/private"
          mkdir -p "$RUNNER_TEMP/coach-private-qa"
          summary="$RUNNER_TEMP/coach-private-qa/summary.txt"
          : > "$summary"
          failed=0
          check() {
            title="$1"; shift
            if "$@" > "$RUNNER_TEMP/coach-private-qa/$title.log" 2>&1; then
              echo "$title PASS" >> "$summary"
              echo "$title PASS"
            else
              rc=$?
              echo "$title FAIL rc=$rc" >> "$summary"
              echo "$title FAIL_DIAGNOSTICS_PRIVATE_ONLY"
              if [ "$title" = node_21_contract_tests ]; then
                awk '/^not ok [0-9]+ - / {sub(/^not ok [0-9]+ - /,""); gsub(/[^A-Za-z0-9 _-]/,""); print "COACH_NODE_TEST_FAILURE " substr($0,1,105)}' "$RUNNER_TEMP/coach-private-qa/$title.log" | head -25 || true
              fi
              if [ "$title" = chromium_real_browser ]; then
                sed -nE 's/.*AssertionError \[ERR_ASSERTION\]: (.{1,110}).*/COACH_BROWSER_ASSERTION \1/p' "$RUNNER_TEMP/coach-private-qa/$title.log" | head -3 || true
              fi
              if [ "$title" = python_coach_source_free ]; then
                awk '/^(FAIL|ERROR): test_/ {print "COACH_SOURCE_FREE_CASE_" $2}' "$RUNNER_TEMP/coach-private-qa/$title.log" | head -12 || true
              fi
              failed=1
            fi
          }
          check node_syntax bash -ceu 'node --check courtcoder/qa/coach_ui_visual_contract.test.cjs && node --check courtcoder/qa/coach_ui_browser_acceptance.cjs'
          check node_21_contract_tests node --test courtcoder/qa/coach_ui_visual_contract.test.cjs
          if ! npm install --no-save --no-package-lock --ignore-scripts \
              --prefix "$RUNNER_TEMP/private" playwright-core@1.56.0 \
              > "$RUNNER_TEMP/coach-private-qa/browser-install.log" 2>&1; then
            echo chromium_install FAIL >> "$summary"
            echo chromium_install FAIL_DIAGNOSTICS_PRIVATE_ONLY
            failed=1
          else
            echo chromium_install PASS >> "$summary"
            if ! (command -v google-chrome || command -v chromium || command -v chromium-browser) >/dev/null 2>&1; then
              npx playwright-core install chromium > "$RUNNER_TEMP/coach-private-qa/browser-download.log" 2>&1 || true
            fi
            check chromium_real_browser env \
              COURTCODER_BROWSER_QA_OUTPUT="$RUNNER_TEMP/coach-private-qa/screenshots" \
              node courtcoder/qa/coach_ui_browser_acceptance.cjs
          fi
          export PYTHONPATH="$RUNNER_TEMP/private"
          export COURTCODER_FIXTURE_REGISTRY="$RUNNER_TEMP/private/config/fixture-registry.json"
          export COURTCODER_RENDER_SPEC="$RUNNER_TEMP/private/contracts/render-spec.json"
          export COURTCODER_MODULE_REGISTRY="$RUNNER_TEMP/private/config/module-registry.json"
          check python_dependencies python3 -m pip install --quiet -r courtcoder/requirements.txt
          if grep -q '^python_dependencies PASS$' "$summary"; then
            check python_coach_source_free python3 -m unittest -v \
              courtcoder.qa.test_igp_coach_web_v1 \
              courtcoder.coach.test_shot_quality_ruler_v1 \
              courtcoder.coach.test_action_pps_v2 \
              courtcoder.coach.test_catalog_release_gate \
              courtcoder.coach.test_action_source_fga_ledger_v2 \
              courtcoder.coach.test_game_directory_v1 \
              courtcoder.coach.test_official_clips_v1
            check python_original_routes python3 -c "import sys;sys.path.insert(0,'courtcoder');from app import app;c=app.test_client();assert c.get('/api/health').status_code==200;assert c.get('/api/bootstrap').status_code==200;assert c.get('/').status_code==200;assert c.get('/coach/').status_code==404"
          fi
          # Persist synthetic screenshots only in an independent PRIVATE QA branch.
          # The public runner never uploads them as public GitHub Actions artifacts.
          if [ "$failed" -eq 0 ] && test -s "$RUNNER_TEMP/coach-private-qa/screenshots/coach-desktop.png" && test -s "$RUNNER_TEMP/coach-private-qa/screenshots/coach-mobile.png"; then
            python3 - <<'PY'
          import base64,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"coach-private-qa"/"screenshots"
          repo=os.environ["PRIVATE_REPO"]
          branch="qa/courtcoder-coach-browser-20261106"
          prefix="courtcoder/coach/qa/browser-20261106"
          ok=True
          for name in ("coach-desktop.png","coach-mobile.png"):
              source=root/name
              if not source.is_file() or source.stat().st_size<100:
                  ok=False;continue
              dest=f"repos/{repo}/contents/{prefix}/{name}"
              packet={"branch":branch,"message":"qa(coach): private synthetic Chromium acceptance screenshot",
                      "content":base64.b64encode(source.read_bytes()).decode("ascii")}
              before=subprocess.run(["gh","api",dest+"?ref="+branch],capture_output=True,text=True)
              if before.returncode==0:
                  packet["sha"]=json.loads(before.stdout)["sha"]
              saved=subprocess.run(["gh","api","--method","PUT",dest,"--input","-"],
                                   input=json.dumps(packet),capture_output=True,text=True)
              ok=ok and saved.returncode==0
          print("COACH_PRIVATE_SYNTHETIC_SCREENSHOTS_WRITTEN" if ok else
                "COACH_PRIVATE_SYNTHETIC_SCREENSHOTS_UNAVAILABLE_NONBLOCKING")
          PY
          fi
          # Private PR comment contains detailed source-free diagnostics;
          # never send those logs to the public repo or its artifacts.
          python3 - <<'PY'
          import os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"coach-private-qa"
          summary=(root/"summary.txt").read_text()
          sections=["### Private Coach Chromium/Node acceptance",
                    "Source SHA: "+os.environ["PRIVATE_SHA"],"",
                    "```",summary,"```"]
          for f in sorted(root.glob("*.log")):
              if "FAIL" in summary and f.stem in [r.split()[0] for r in summary.splitlines() if "FAIL" in r]:
                  sections.extend(["#### "+f.stem,"<details><summary>Private diagnostics</summary>","","```",f.read_text(errors="replace")[-8000:],"```","</details>"])
          (root/"private-comment.txt").write_text("\n".join(sections)+"\n")
          PY
          if gh api --method POST "repos/$PRIVATE_REPO/issues/1052/comments" \
              -F body=@"$RUNNER_TEMP/coach-private-qa/private-comment.txt" \
              > "$RUNNER_TEMP/coach-private-qa/private-comment-receipt.json" \
              2> "$RUNNER_TEMP/coach-private-qa/private-comment-error.txt"; then
            echo COACH_PRIVATE_PR_QA_RECEIPT_WRITTEN
          else
            echo COACH_PRIVATE_PR_QA_RECEIPT_UNAVAILABLE_NONBLOCKING
          fi
          if [ "$failed" -eq 0 ]; then
            echo COACH_NODE_AND_CHROMIUM_SOURCE_FREE_ACCEPTANCE_PASS
          else
            echo COACH_NODE_OR_CHROMIUM_SOURCE_FREE_ACCEPTANCE_FAIL
            exit 1
          fi
