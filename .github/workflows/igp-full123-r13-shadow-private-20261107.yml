# Public control plane; all licensed original NBA source stays in private 104.
name: IGP Full123 R13 frontcourt source-only nine-game shadow (private)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full123-r13-shadow-private-20261107.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: igp-full123-r13-frontcourt-shadow-private-20261107
  cancel-in-progress: false
jobs:
  private-original-nba-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: feature/igp-full123-r13-touch-integration-20261107
      PYTHONPATH: .:gamepulse/fusion:gamepulse/fusion/analysis
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm public repository privacy and authenticated private bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || { echo PRIVATE_GITHUB_BRIDGE_UNAVAILABLE; exit 20; }
          gh auth setup-git
      - name: Clone private R13 source-free code and frozen Full123 receipts
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" \
             "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          git sparse-checkout set --no-cone \
            '/gamepulse/fusion/*.py' \
            '/gamepulse/fusion/analysis/*.py' \
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/index.json' \
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/post56_additive_20261028/index.json' \
            '/gamepulse/fusion/qa/igp_progress_20261030/igp_full121_default_source_release_v1.json' \
            '/gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/full123_123_game_execution_decision.json'
      - name: Execute source-free shadow tests privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          if ! python3 -m unittest discover -s gamepulse/fusion/analysis \
                  -p test_igp_full123_r13_frontcourt_shadow_v1.py -v \
                  > "$RUNNER_TEMP/r13-shadow-unit.log" 2>&1; then
            echo R13_SOURCE_FREE_SHADOW_REGRESSION_FAILED
            exit 21
          fi
          echo R13_SOURCE_FREE_SHADOW_REGRESSION_PASSED
      - name: Verify source-free native 10Hz XYZ velocity and heading dribble model
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          if ! python3 -m unittest discover -s gamepulse/fusion/analysis \
                  -p test_igp_r13_ballxyz_10hz_dribble_shadow_v1.py -v \
                  > "$RUNNER_TEMP/r13-10hz-tests.log" 2>&1; then
            echo R13_10HZ_DRIBBLE_SOURCE_FREE_REGRESSIONS_FAILED
            exit 23
          fi
          echo R13_10HZ_DRIBBLE_SOURCE_FREE_REGRESSIONS_PASSED
      - name: Validate live clock and same SDK token 10Hz dribble v2
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          if ! python3 -m unittest discover -s gamepulse/fusion/analysis \
                    -p test_igp_r13_ballxyz_10hz_dribble_shadow_v2.py -v \
                    > "$RUNNER_TEMP/r13-10hz-v2-tests.log" 2>&1; then
            echo R13_10HZ_SOURCE_CLOCK_TOKEN_TESTS_FAILED
            exit 25
          fi
          echo R13_10HZ_SOURCE_CLOCK_TOKEN_TESTS_PASSED
      - name: Sparse materialize nine original NBA SDK games in private
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 - <<'PY' > "$RUNNER_TEMP/shadow-paths"
          from pathlib import Path
          from gamepulse.fusion.analysis.igp_full123_r13_frontcourt_shadow_v1 import HOUSTON_NINE
          from gamepulse.fusion import igp_full123_r13_touch_overlay_v1 as model
          _,_,add = model.source_catalog('.')
          for gid in HOUSTON_NINE:
              for path in (
                  f'/gamepulse/fusion/materialized/igp_all_original_xyz/{gid}/**',
                  f'/gamepulse/fusion/qa/r13_full123_original_labels_20261107/{gid}.*',
                  f'/gamepulse/fusion/qa/r13_full123_original_boxes_20261107/{gid}.*',
                  f'/gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/{gid}.json',
                  f'/gamepulse/fusion/official_pbp_timing/games/{gid}.json',
                  f'/gamepulse/fusion/official_pbp_timing/original_nba_*/{gid}/boxscore.json',
                  f'/gamepulse/fusion/evidence/companion_sdk_original_{gid}/sdk_observed_original.json',
              ): print(path)
              row=add['games'].get(gid)
              if row:
                  for key in ('original_xyz_manifest','official_pbp_path'):
                      if row.get(key): print('/'+str(row[key]).lstrip('/'))
                  for p in row.get('official_pbp_original_paths', []):
                      print('/'+str(p).lstrip('/'))
                  if row.get('original_companion_shot_crosswalk'):
                      print('/'+str(Path(row['original_companion_shot_crosswalk']).parent /
                                         'sdk_observed_original.json').lstrip('/'))
          PY
          mapfile -t paths < "$RUNNER_TEMP/shadow-paths"
          git sparse-checkout add "${paths[@]}"
          test -f gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/0022600181.json
          echo R13_NINE_GAME_PRIVATE_SHA_SOURCE_LOADED
      - name: Test nine-game SDK crossing hypothesis without modifying baseline
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          if ! python3 -m gamepulse.fusion.analysis.igp_full123_r13_frontcourt_shadow_v1 \
                  --root . --private-persist \
                  > "$RUNNER_TEMP/r13-shadow.log" 2>&1; then
            # Detailed failures, potentially containing source paths or player
            # identity, stay in the private repository, never public logs.
            python3 - <<'PY'
          import base64,json,os,subprocess,time
          from pathlib import Path
          raw=Path(os.environ['RUNNER_TEMP'],'r13-shadow.log').read_text()[-18000:]
          rel='gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/houston9_shadow_private_failure_20261107.json'
          endpoint=f"repos/{os.environ['PRIVATE_REPO']}/contents/{rel}"
          body={'branch':os.environ['PRIVATE_BRANCH'],
                'message':'qa(private): R13 frontcourt shadow failure [skip ci]',
                'content':base64.b64encode(json.dumps({'status':'FAILED','stderr_tail':raw,
                              'original_xyz_not_exported':True},sort_keys=True).encode()).decode()}
          for retry in range(6):
              prior=subprocess.run(['gh','api',endpoint+'?ref='+body['branch']],capture_output=True,text=True)
              if prior.returncode==0:body['sha']=json.loads(prior.stdout)['sha']
              x=subprocess.run(['gh','api','-X','PUT',endpoint,'--input','-'],
                               input=json.dumps(body),capture_output=True,text=True)
              if x.returncode==0:break
              time.sleep(1+retry)
          PY
            echo R13_ORIGINAL_SOURCE_SHADOW_NEEDS_PRIVATE_DIAGNOSTIC_REVIEW
            exit 22
          fi
          grep '^HOUSTON9_R13_SHADOW_' "$RUNNER_TEMP/r13-shadow.log"
          echo R13_FROZEN_123_GAME_COUNTS_AND_DEFAULTS_UNCHANGED

      - name: Independently evaluate raw 10Hz ball-speed direction and floor rebounds in Houston9
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          if ! python3 -m gamepulse.fusion.analysis.igp_r13_ballxyz_10hz_dribble_shadow_v1 \
                --root . --private-persist \
                > "$RUNNER_TEMP/r13-10hz-model.log" 2>&1; then
            echo R13_10HZ_PRIVATE_MODEL_REPLAY_FAILED
            exit 24
          fi
          echo R13_10HZ_NINE_GAME_MODEL_COMPLETED_AND_RESULTS_PRIVATE
          echo R13_ORIGINAL_TOUCH_LEDGER_AND_SDK_SHA_SOURCE_UNCHANGED

      - name: Compare stricter live-clock same-token 10Hz dribble v2 against nine-game NBA source
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          if ! python3 -m gamepulse.fusion.analysis.igp_r13_ballxyz_10hz_dribble_shadow_v2 \
                  --root . --private-persist \
                  > "$RUNNER_TEMP/r13-10hz-v2-model.log" 2>&1; then
            echo R13_10HZ_V2_PRIVATE_SHA_SOURCE_REPLAY_FAILED
            exit 26
          fi
          echo R13_10HZ_V2_9_GAMES_COMPLETED_PRIVATE_REPORT
          echo R13_10HZ_V1_AND_FROZEN_R13_PRESERVED

      - name: Run V3 source-free physics and handler identity tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          if ! python3 -m unittest discover -s gamepulse/fusion/analysis \
                  -p test_igp_r13_ballxyz_10hz_dribble_shadow_v3.py -v \
                  > "$RUNNER_TEMP/r13-v3-tests.log" 2>&1; then
            echo R13_V3_SOURCE_FREE_TESTS_FAILED
            exit 27
          fi
          echo R13_V3_SOURCE_FREE_REGRESSIONS_PASSED
      - name: Independently adjudicate BOTH original and newly identified ball bounces V3
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          if ! python3 -m gamepulse.fusion.analysis.igp_r13_ballxyz_10hz_dribble_shadow_v3 \
                  --root . --private-persist \
                  > "$RUNNER_TEMP/r13-v3-model.log" 2>&1; then
            echo R13_V3_ORIGINAL_SDK_SOURCE_ADJUDICATION_FAILED
            exit 28
          fi
          echo R13_V3_NINE_GAME_SHA_VERIFIED_PRIVATE_RESULTS_SAVED
          echo R13_V3_FROZEN_R13_AND_V2_RESULT_UNCHANGED

      - name: Validate V4 10Hz gravity-constrained source-free ball rebound model
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          if ! python3 -m unittest discover -s gamepulse/fusion/analysis \
                  -p test_r13_ballistics_v4.py -v \
                  > "$RUNNER_TEMP/r13-v4-physics-tests.log" 2>&1; then
            echo R13_V4_BALLISTIC_SOURCE_FREE_TESTS_FAILED
            exit 29
          fi
          echo R13_V4_SOURCE_FREE_PHYSICS_REGRESSIONS_PASSED
      - name: Evaluate V4 inferred 10Hz floor rebound against nine NBA original-source games
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          if ! python3 -m gamepulse.fusion.analysis.igp_r13_ballxyz_dribble_shadow_v4 \
                  --root . --private-persist \
                  > "$RUNNER_TEMP/r13-v4-model.log" 2>&1; then
            python3 - <<'PY'
          import base64,json,os,subprocess,time
          from pathlib import Path
          raw=Path(os.environ['RUNNER_TEMP'],'r13-v4-model.log').read_text()[-20000:]
          path='gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/houston9_ballxyz_v4_private_failure_20261107.json'
          api=f"repos/{os.environ['PRIVATE_REPO']}/contents/{path}"
          body={'branch':os.environ['PRIVATE_BRANCH'],
                'message':'qa(private): preserve V4 source replay exception [skip ci]',
                'content':base64.b64encode(json.dumps(
                  {'status':'FAILED','private_error_log':raw,'source_tracking_not_exported':True},
                  sort_keys=True).encode()).decode()}
          for attempt in range(8):
              prior=subprocess.run(['gh','api',api+'?ref='+body['branch']],capture_output=True,text=True)
              if prior.returncode==0:body['sha']=json.loads(prior.stdout)['sha']
              done=subprocess.run(['gh','api','-X','PUT',api,'--input','-'],
                                  input=json.dumps(body),capture_output=True,text=True)
              if done.returncode==0:break
              time.sleep(attempt+1)
          PY
            echo R13_V4_SOURCE_FIRST_NINE_GAME_REPLAY_FAILED_PRIVATE_TRACE_CAPTURED
            exit 30
          fi
          echo R13_V4_SOURCE_FIRST_NINE_GAME_PRIVATE_REPORT_SAVED
          echo R13_V4_NO_ORIGINAL_NBA_SOURCE_OR_R13_METRIC_OVERWRITE

      - name: Compare V4b unthinned NBA SDK native frames with the 10Hz ballistic fit
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          if ! python3 -m gamepulse.fusion.analysis.igp_r13_ballxyz_dribble_shadow_v4b \
                  --root . --private-persist \
                  > "$RUNNER_TEMP/r13-v4b-model.log" 2>&1; then
            python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          path='gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/houston9_ballxyz_v4b_private_failure_20261107.json'
          api=f"repos/{os.environ['PRIVATE_REPO']}/contents/{path}"
          body={'branch':os.environ['PRIVATE_BRANCH'],'message':'qa(private): V4b original SDK replay exception [skip ci]',
             'content':base64.b64encode(json.dumps({'error_log':Path(os.environ['RUNNER_TEMP'],'r13-v4b-model.log').read_text()[-18000:]},sort_keys=True).encode()).decode()}
          prior=subprocess.run(['gh','api',api+'?ref='+body['branch']],capture_output=True,text=True)
          if prior.returncode==0:body['sha']=json.loads(prior.stdout)['sha']
          subprocess.run(['gh','api','-X','PUT',api,'--input','-'],input=json.dumps(body),check=True)
          PY
            echo R13_V4B_UNTHINNED_NATIVE_SOURCE_REPLAY_FAILED_PRIVATE_TRACE_SAVED
            exit 31
          fi
          echo R13_V4B_UNTHINNED_ORIGINAL_SOURCE_NINE_GAME_RESULTS_PRIVATE
          echo R13_V4B_FROZEN_R13_AND_V2_COUNTS_UNMODIFIED

      - name: Validate V5 3-sample 10Hz physical bounce solver
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          if ! python3 -m unittest discover -s gamepulse/fusion/analysis \
                  -p test_r13_ballistics_3point_v5.py -v \
                  > "$RUNNER_TEMP/r13-v5-threepoint-tests.log" 2>&1; then
            echo R13_V5_THREE_POINT_PHYSICS_REGRESSION_FAILED
            exit 32
          fi
          echo R13_V5_THREE_POINT_PHYSICS_REGRESSIONS_PASSED
      - name: Validate V5 10Hz ball-gravity impact across nine verified NBA original source games
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          if ! python3 -m gamepulse.fusion.analysis.igp_r13_ballxyz_dribble_shadow_v5 \
                  --root . --private-persist \
                  > "$RUNNER_TEMP/r13-v5-model.log" 2>&1; then
            python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          path='gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/houston9_ballxyz_v5_private_failure_20261107.json'
          api=f"repos/{os.environ['PRIVATE_REPO']}/contents/{path}"
          body={'branch':os.environ['PRIVATE_BRANCH'],'message':'qa(private): V5 3pt source replay exception [skip ci]',
             'content':base64.b64encode(json.dumps({'error_log':Path(os.environ['RUNNER_TEMP'],'r13-v5-model.log').read_text()[-18000:]},sort_keys=True).encode()).decode()}
          prior=subprocess.run(['gh','api',api+'?ref='+body['branch']],capture_output=True,text=True)
          if prior.returncode==0:body['sha']=json.loads(prior.stdout)['sha']
          subprocess.run(['gh','api','-X','PUT',api,'--input','-'],input=json.dumps(body),check=True)
          PY
            echo R13_V5_THREE_POINT_NBA_SOURCE_REPLAY_FAILED_PRIVATE_TRACE_SAVED
            exit 33
          fi
          echo R13_V5_THREE_POINT_SOURCE_SHA_NINE_GAME_RESULTS_PRIVATE
          echo R13_V5_ORIGINAL_IGP_R13_AND_V2_DEFAULTS_UNMODIFIED

      - name: V6 source-free symmetric baseline and new-bounce dedup regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          if ! python3 -m unittest discover -s gamepulse/fusion/analysis \
               -p test_igp_r13_ballxyz_symmetric_adjudication_v6.py -v \
               > "$RUNNER_TEMP/r13-v6-source-free-tests.log" 2>&1; then
            echo R13_V6_SYMMETRIC_SOURCE_FREE_TESTS_FAILED
            exit 34
          fi
          echo R13_V6_SYMMETRIC_SOURCE_FREE_TESTS_PASSED
      - name: V6 independently audit old and new NBA original ball XYZ dribbles across nine games
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          if ! python3 -m gamepulse.fusion.analysis.igp_r13_ballxyz_symmetric_adjudication_v6 \
                --root . --private-persist \
                > "$RUNNER_TEMP/r13-v6-replay.log" 2>&1; then
            python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          rel='gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/houston9_ballxyz_v6_private_failure_20261107.json'
          api=f"repos/{os.environ['PRIVATE_REPO']}/contents/{rel}"
          body={'branch':os.environ['PRIVATE_BRANCH'],
                'message':'qa(private): V6 source replay diagnostic [skip ci]',
                'content':base64.b64encode(json.dumps({'private_error_log':
                   Path(os.environ['RUNNER_TEMP'],'r13-v6-replay.log').read_text()[-18000:],
                   'source_tracking_data_excluded':True},sort_keys=True).encode()).decode()}
          p=subprocess.run(['gh','api',api+'?ref='+body['branch']],capture_output=True,text=True)
          if p.returncode==0:body['sha']=json.loads(p.stdout)['sha']
          subprocess.run(['gh','api','-X','PUT',api,'--input','-'],
                         input=json.dumps(body),text=True,capture_output=True,check=True)
          PY
            echo R13_V6_SYMMETRIC_ORIGINAL_SOURCE_REPLAY_FAILED_PRIVATE_TRACE
            exit 35
          fi
          echo R13_V6_NINE_ORIGINAL_SDK_SOURCE_GAMES_AND_FROZEN_SHA_REPLAYED
          echo R13_V6_BOTH_OLD_AND_NEW_EVENT_COLLISIONS_AUDITED_PRIVATE
          echo R13_V6_FULL123_AND_R13_PRODUCTION_UNCHANGED

      - name: V7 source-free same-handler ball return vs bounce pass negative controls
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          if ! python3 -m unittest discover -s gamepulse/fusion/analysis \
                  -p test_igp_r13_ballxyz_postbounce_custody_v7.py -v \
                  > "$RUNNER_TEMP/r13-v7-unit.log" 2>&1; then
            python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          rel='gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/houston9_ballxyz_v7_unit_private_failure_20261107.json'
          ep=f"repos/{os.environ['PRIVATE_REPO']}/contents/{rel}"
          body={'branch':os.environ['PRIVATE_BRANCH'],'message':'qa(private): V7 unit failure [skip ci]',
          'content':base64.b64encode(json.dumps({'trace':Path(os.environ['RUNNER_TEMP'],'r13-v7-unit.log').read_text()[-15000:]}).encode()).decode()}
          p=subprocess.run(['gh','api',ep+'?ref='+body['branch']],capture_output=True,text=True)
          if p.returncode==0:body['sha']=json.loads(p.stdout)['sha']
          subprocess.run(['gh','api','-X','PUT',ep,'--input','-'],input=json.dumps(body),text=True,check=True,capture_output=True)
          PY
            echo R13_V7_POSTFLOOR_CONTROL_REGRESSIONS_FAILED_PRIVATE_TRACE
            exit 36
          fi
          echo R13_V7_POSTFLOOR_CONTROL_NEGATIVE_REGRESSIONS_PASSED
      - name: V7 validate original NBA post-impact same-handler return versus bounce-pass movement
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          if ! python3 -m gamepulse.fusion.analysis.igp_r13_ballxyz_postbounce_custody_v7 \
                  --root . --private-persist \
                  > "$RUNNER_TEMP/r13-v7-replay.log" 2>&1; then
            python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          rel='gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/houston9_ballxyz_v7_private_failure_20261107.json'
          ep=f"repos/{os.environ['PRIVATE_REPO']}/contents/{rel}"
          body={'branch':os.environ['PRIVATE_BRANCH'],'message':'qa(private): V7 real source replay failure [skip ci]',
          'content':base64.b64encode(json.dumps({'trace':Path(os.environ['RUNNER_TEMP'],'r13-v7-replay.log').read_text()[-18000:]}).encode()).decode()}
          p=subprocess.run(['gh','api',ep+'?ref='+body['branch']],capture_output=True,text=True)
          if p.returncode==0:body['sha']=json.loads(p.stdout)['sha']
          subprocess.run(['gh','api','-X','PUT',ep,'--input','-'],input=json.dumps(body),text=True,check=True,capture_output=True)
          PY
            echo R13_V7_ORIGINAL_SDK_NINE_GAME_CUSTODY_REPLAY_FAILED_PRIVATE_TRACE
            exit 37
          fi
          echo R13_V7_ORIGINAL_NBA_NINE_GAME_POSTFLOOR_CUSTODY_VALIDATION_SUCCEEDED
          echo R13_V7_ORIGINAL_NBA_SOURCE_AND_R13_COUNTS_UNCHANGED

      - name: Validate V8 source-free original PBP anchors and blinded video-case selection
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          if ! python3 -m unittest discover -s gamepulse/fusion/analysis \
                  -p test_igp_r13_dribble_video_review_queue_v8.py -v \
                  > "$RUNNER_TEMP/r13-v8-unit.log" 2>&1; then
            python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          rel='gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/houston9_v8_test_failure_20261107.json'
          ep=f"repos/{os.environ['PRIVATE_REPO']}/contents/{rel}"
          data={'branch':os.environ['PRIVATE_BRANCH'],'message':'qa(private): V8 regression trace [skip ci]',
                'content':base64.b64encode(json.dumps({'trace':
                 Path(os.environ['RUNNER_TEMP'],'r13-v8-unit.log').read_text()[-17000:]}).encode()).decode()}
          p=subprocess.run(['gh','api',ep+'?ref='+data['branch']],capture_output=True,text=True)
          if p.returncode==0:data['sha']=json.loads(p.stdout)['sha']
          subprocess.run(['gh','api','-X','PUT',ep,'--input','-'],
                         input=json.dumps(data),text=True,capture_output=True,check=True)
          PY
            echo R13_V8_INDEPENDENT_REVIEW_REGRESSIONS_FAILED_PRIVATE_TRACE
            exit 38
          fi
          echo R13_V8_BLINDED_PACKET_AND_PROVISIONAL_PBP_REGRESSIONS_PASSED
      - name: Create V8 event-level original NBA SDK review set privately without invented video labels
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          if ! python3 -m gamepulse.fusion.analysis.igp_r13_dribble_video_review_queue_v8 \
                  --root . --private-persist \
                  > "$RUNNER_TEMP/r13-v8-replay.log" 2>&1; then
            python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
