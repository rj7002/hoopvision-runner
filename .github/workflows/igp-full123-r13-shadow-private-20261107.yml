# Public control plane; all licensed original NBA source stays in private 104.
name: IGP Full123 R13 frontcourt source-only nine-game shadow (private)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full123-r13-shadow-private-20261107.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: igp-full123-r13-frontcourt-shadow-private-20261107
  cancel-in-progress: false
jobs:
  private-original-nba-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: feature/igp-full123-r13-touch-integration-20261107
      PYTHONPATH: .:gamepulse/fusion:gamepulse/fusion/analysis
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm public repository privacy and authenticated private bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || { echo PRIVATE_GITHUB_BRIDGE_UNAVAILABLE; exit 20; }
          gh auth setup-git
      - name: Clone private R13 source-free code and frozen Full123 receipts
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" \
             "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          git sparse-checkout set --no-cone \
            '/gamepulse/fusion/*.py' \
            '/gamepulse/fusion/analysis/*.py' \
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/index.json' \
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/post56_additive_20261028/index.json' \
            '/gamepulse/fusion/qa/igp_progress_20261030/igp_full121_default_source_release_v1.json' \
            '/gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/full123_123_game_execution_decision.json'
      - name: Execute source-free shadow tests privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          if ! python3 -m unittest discover -s gamepulse/fusion/analysis \
                  -p test_igp_full123_r13_frontcourt_shadow_v1.py -v \
                  > "$RUNNER_TEMP/r13-shadow-unit.log" 2>&1; then
            echo R13_SOURCE_FREE_SHADOW_REGRESSION_FAILED
            exit 21
          fi
          echo R13_SOURCE_FREE_SHADOW_REGRESSION_PASSED
      - name: Verify source-free native 10Hz XYZ velocity and heading dribble model
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          if ! python3 -m unittest discover -s gamepulse/fusion/analysis \
                  -p test_igp_r13_ballxyz_10hz_dribble_shadow_v1.py -v \
                  > "$RUNNER_TEMP/r13-10hz-tests.log" 2>&1; then
            echo R13_10HZ_DRIBBLE_SOURCE_FREE_REGRESSIONS_FAILED
            exit 23
          fi
          echo R13_10HZ_DRIBBLE_SOURCE_FREE_REGRESSIONS_PASSED
      - name: Sparse materialize nine original NBA SDK games in private
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 - <<'PY' > "$RUNNER_TEMP/shadow-paths"
          from pathlib import Path
          from gamepulse.fusion.analysis.igp_full123_r13_frontcourt_shadow_v1 import HOUSTON_NINE
          from gamepulse.fusion import igp_full123_r13_touch_overlay_v1 as model
          _,_,add = model.source_catalog('.')
          for gid in HOUSTON_NINE:
              for path in (
                  f'/gamepulse/fusion/materialized/igp_all_original_xyz/{gid}/**',
                  f'/gamepulse/fusion/qa/r13_full123_original_labels_20261107/{gid}.*',
                  f'/gamepulse/fusion/qa/r13_full123_original_boxes_20261107/{gid}.*',
                  f'/gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/{gid}.json',
                  f'/gamepulse/fusion/official_pbp_timing/games/{gid}.json',
                  f'/gamepulse/fusion/official_pbp_timing/original_nba_*/{gid}/boxscore.json',
                  f'/gamepulse/fusion/evidence/companion_sdk_original_{gid}/sdk_observed_original.json',
              ): print(path)
              row=add['games'].get(gid)
              if row:
                  for key in ('original_xyz_manifest','official_pbp_path'):
                      if row.get(key): print('/'+str(row[key]).lstrip('/'))
                  for p in row.get('official_pbp_original_paths', []):
                      print('/'+str(p).lstrip('/'))
                  if row.get('original_companion_shot_crosswalk'):
                      print('/'+str(Path(row['original_companion_shot_crosswalk']).parent /
                                         'sdk_observed_original.json').lstrip('/'))
          PY
          mapfile -t paths < "$RUNNER_TEMP/shadow-paths"
          git sparse-checkout add "${paths[@]}"
          test -f gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/0022600181.json
          echo R13_NINE_GAME_PRIVATE_SHA_SOURCE_LOADED
      - name: Test nine-game SDK crossing hypothesis without modifying baseline
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          if ! python3 -m gamepulse.fusion.analysis.igp_full123_r13_frontcourt_shadow_v1 \
                  --root . --private-persist \
                  > "$RUNNER_TEMP/r13-shadow.log" 2>&1; then
            # Detailed failures, potentially containing source paths or player
            # identity, stay in the private repository, never public logs.
            python3 - <<'PY'
          import base64,json,os,subprocess,time
          from pathlib import Path
          raw=Path(os.environ['RUNNER_TEMP'],'r13-shadow.log').read_text()[-18000:]
          rel='gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/houston9_shadow_private_failure_20261107.json'
          endpoint=f"repos/{os.environ['PRIVATE_REPO']}/contents/{rel}"
          body={'branch':os.environ['PRIVATE_BRANCH'],
                'message':'qa(private): R13 frontcourt shadow failure [skip ci]',
                'content':base64.b64encode(json.dumps({'status':'FAILED','stderr_tail':raw,
                              'original_xyz_not_exported':True},sort_keys=True).encode()).decode()}
          for retry in range(6):
              prior=subprocess.run(['gh','api',endpoint+'?ref='+body['branch']],capture_output=True,text=True)
              if prior.returncode==0:body['sha']=json.loads(prior.stdout)['sha']
              x=subprocess.run(['gh','api','-X','PUT',endpoint,'--input','-'],
                               input=json.dumps(body),capture_output=True,text=True)
              if x.returncode==0:break
              time.sleep(1+retry)
          PY
            echo R13_ORIGINAL_SOURCE_SHADOW_NEEDS_PRIVATE_DIAGNOSTIC_REVIEW
            exit 22
          fi
          grep '^HOUSTON9_R13_SHADOW_' "$RUNNER_TEMP/r13-shadow.log"
          echo R13_FROZEN_123_GAME_COUNTS_AND_DEFAULTS_UNCHANGED

      - name: Independently evaluate raw 10Hz ball-speed direction and floor rebounds in Houston9
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          if ! python3 -m gamepulse.fusion.analysis.igp_r13_ballxyz_10hz_dribble_shadow_v1 \
                --root . --private-persist \
                > "$RUNNER_TEMP/r13-10hz-model.log" 2>&1; then
            echo R13_10HZ_PRIVATE_MODEL_REPLAY_FAILED
            exit 24
          fi
          echo R13_10HZ_NINE_GAME_MODEL_COMPLETED_AND_RESULTS_PRIVATE
          echo R13_ORIGINAL_TOUCH_LEDGER_AND_SDK_SHA_SOURCE_UNCHANGED

# Reviewed confidentiality allowlist activation 2026-11-07; private output only.

# Second private original source replay: frozen rejected-brief/geometry-only frontcourt uncertainty census.
