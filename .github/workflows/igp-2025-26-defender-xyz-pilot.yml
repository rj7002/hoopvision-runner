name: IGP 2025-26 defender XYZ proxy one-game real-source pilot
'on':
  push:
    branches: [main]
    paths: [.github/workflows/igp-2025-26-defender-xyz-pilot.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-historical-defender-xyz-pilot
  cancel-in-progress: false
jobs:
  source-private-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Enforce public-to-private source separation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
      - name: Checkout private implementation and execute deterministic tests
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth=1 --filter=blob:none --sparse -b "$BRANCH" \
            https://x-access-token:$GH_TOKEN@github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          python3 -m py_compile gamepulse/fusion/igp_historical_defender_proxy_v1.py
          PYTHONPATH="$PWD" python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p 'test_igp_historical_defender_proxy_v1.py'
          PYTHONPATH="$PWD" python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p 'test_igp_historical_defender_client_db_v1.py'
          echo IGP_HISTORICAL_DEFENDER_SOURCE_FREE_TESTS_PASS
      - name: Recover SHA-preserved historical shard and verified NBA xFG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/shots" "$RUNNER_TEMP/derived"
          gh release download igp-public-gamepulse-2025-26-20261105 \
            --repo timeedmonds-maker/104 \
            --pattern nba-2025-26-source-index.json \
            --pattern nba-2025-26-shard-001.zip --dir "$RUNNER_TEMP/source"
          python3 tools/igp_2025_26_public_xfg_backfill.py \
            --index "$RUNNER_TEMP/source/nba-2025-26-source-index.json" \
            --shard "$RUNNER_TEMP/source/nba-2025-26-shard-001.zip" \
            --out "$RUNNER_TEMP/shots" --workers 2 --max-games 1
          python3 "$RUNNER_TEMP/private/gamepulse/fusion/igp_historical_defender_proxy_v1.py" \
            --index "$RUNNER_TEMP/source/nba-2025-26-source-index.json" \
            --shard "$RUNNER_TEMP/source/nba-2025-26-shard-001.zip" \
            --shots "$RUNNER_TEMP/shots/nba-xfg-nba-2025-26-shard-001.jsonl.gz" \
            --shot-qa "$RUNNER_TEMP/shots/nba-xfg-nba-2025-26-shard-001-qa.json" \
            --out "$RUNNER_TEMP/derived"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"derived"/"defender-xyz-nba-2025-26-shard-001-qa.json"
          q=json.loads(p.read_text())
          assert q["games"]>0 and q["counts"]["shot_rows"]>0
          assert q["counts"]["exact_pbp"]>0
          assert q["counts"]["tracking_frame"]<=q["counts"]["shot_rows"]
          assert q["counts"]["primary_proxy"]<=q["counts"]["source_nearest_defender"]
          print("IGP_HISTORICAL_DEFENDER_REAL_SOURCE_PILOT",json.dumps({
            "games":q["games"],"counts":q["counts"],
            "source_direct_vs_reconstructed":q["source_direct_vs_reconstructed"]},sort_keys=True))
          PY
      - name: Build private client shot explorer and inspect source schema only
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/private/gamepulse/fusion/igp_historical_defender_client_db_v1.py" \
            --ledgers "$RUNNER_TEMP/derived/defender-xyz-nba-2025-26-shard-001.jsonl.gz" \
            --out "$RUNNER_TEMP/derived/igp-historical-defender-client-pilot.sqlite"
          python3 - <<'PY'
          import gzip,json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          with gzip.open(root/"derived/defender-xyz-nba-2025-26-shard-001.jsonl.gz","rt") as f:
              row=json.loads(next(f))
          qa=json.loads((root/"derived/igp-historical-defender-client-pilot.qa.json").read_text())
          print("IGP_HISTORICAL_DEFENDER_SHOT_SOURCE_FIELD_KEYS",
                sorted(row["source_nba_shot_record"].keys()))
          print("IGP_HISTORICAL_DEFENDER_CLIENT_PILOT_COUNTS",qa["counts"])
          PY
      - name: Preserve all shot-level output in private release only
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view igp-2025-26-defender-xyz-proxy-20261105 \
            --repo timeedmonds-maker/104 >/dev/null 2>&1; then
            gh release create igp-2025-26-defender-xyz-proxy-20261105 \
              --repo timeedmonds-maker/104 --target "$BRANCH" --draft \
              --title '2025-26 historical XYZ defender shot proxy, source graded' \
              --notes 'Not Blueprint measurements. Historical source XYZ and official xFG, shot-level private output, no causal defender attribution. SHA, release timing and coverage QA retained.'
          fi
          gh release upload igp-2025-26-defender-xyz-proxy-20261105 \
            "$RUNNER_TEMP/derived/"* \
            --repo timeedmonds-maker/104 --clobber
          echo IGP_HISTORICAL_DEFENDER_PROXY_PRIVATE_RELEASE_PILOT_PRESERVED

# Pilot v1.0 guarded source execution

# Client summary SQL validation retry v1.1
