# Opaque public runner; private SDK actor XYZ, shot and PBP stay private.
name: Full88 natural source anchor gap qualification on exact 29521 scenes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full88-natural-gap-qualified-private-20261102.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-full88-natural-gap-qualification-20261102
  cancel-in-progress: false
jobs:
  partition:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/igp-p2b-natural-gap-20261102
      PRIVATE_SHA: 5eb3293677f18f86cfca21d755fd5beeda5c28d5
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify safe bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Private original-source executable tests and exact 22-game classifier
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          test "$(git rev-parse HEAD)" = "$PRIVATE_SHA" || { echo NATURAL_GAP_PRIVATE_SOURCE_HEAD_DRIFT; exit 20; }
          git sparse-checkout set gamepulse/fusion
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_full88_p2b_natural_gap_tier_v1.py gamepulse/fusion/igp_full88_p2b_natural_gap_88audit_v1.py gamepulse/fusion/igp_full88_default_engine_v3.py
          if [ "$SHARD" = "0" ]; then
            for suite in test_igp_full88_p2b_natural_gap_tier_v1.py test_igp_full88_unguarded_p2b_research_v1.py test_igp_full88_default_engine_v3.py; do
              python3 -m unittest discover -s gamepulse/fusion/tests -p "$suite" -q > "$RUNNER_TEMP/$suite.log" 2>&1 || {
                echo FULL88_NATURAL_GAP_SOURCE_FREE_QA_FAILURE
                exit 21
              }
            done
          fi
          dest="gamepulse/fusion/qa/igp_fullx/full88_natural_gap_marginal_private_shard_20261102_${SHARD}.json"
          python3 gamepulse/fusion/igp_full88_p2b_natural_gap_88audit_v1.py --root . --shard "$SHARD" --out "$dest" > "$RUNNER_TEMP/natural-gap-private.log" 2>&1 || {
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'natural-gap-private.log').read_text(errors='replace').splitlines()
          error=next((line for line in reversed(lines) if re.match(r'^(ValueError|TypeError|KeyError|FileNotFoundError|AssertionError|AttributeError):',line)),None)
          print('NATURAL_GAP_PRIVATE_REASON',re.sub(r'[0-9]{4,}','[ID]',error or 'UNKNOWN')[:180])
          PY
            exit 22
          }
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          i=int(os.environ["SHARD"])
          d=json.loads(Path(f"gamepulse/fusion/qa/igp_fullx/full88_natural_gap_marginal_private_shard_20261102_{i}.json").read_text())
          assert d["partition"]==i and len(d["games"])==22
          assert d["original_source_unmodified"]
          assert d["independent_physical_accuracy_certified"] is False
          print('FULL88_NATURAL_GAP_22GAME_SOURCE_VERIFIED',i)
          PY
      - name: Commit detailed timestamps to private repository only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          dest="gamepulse/fusion/qa/igp_fullx/full88_natural_gap_marginal_private_shard_20261102_${SHARD}.json"
          git add -f "$dest"
          git diff --cached --check
          git commit -qm "qa(private): immutable NBA source natural-gap shard ${SHARD} [skip ci]"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH" || exit 27
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo NATURAL_GAP_22GAME_PRIVATE_QA_COMMITTED "$SHARD"
              exit 0
            fi
            sleep "$attempt"
          done
          exit 28
  reduce:
    needs: partition
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/igp-p2b-natural-gap-20261102
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Original source exact marginal source-gap 88game aggregation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          git sparse-checkout set gamepulse/fusion
          export PYTHONPATH=gamepulse/fusion
          dest="gamepulse/fusion/qa/igp_fullx/full88_natural_gap_marginal_reconciled_20261102.json"
          python3 gamepulse/fusion/igp_full88_p2b_natural_gap_88audit_v1.py --root . --reduce --out "$dest" > "$RUNNER_TEMP/natural-final-private.log" 2>&1 || {
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'natural-final-private.log').read_text(errors='replace').splitlines()
          error=next((line for line in reversed(lines) if re.match(r'^(ValueError|TypeError|KeyError|FileNotFoundError|AssertionError):',line)),None)
          print('NATURAL_GAP_REDUCER_ERROR',re.sub(r'[0-9]{4,}','[ID]',error or 'UNKNOWN')[:180])
          PY
            exit 31
          }
          python3 - <<'PY'
          from pathlib import Path
          import json
          x=json.loads(Path('gamepulse/fusion/qa/igp_fullx/full88_natural_gap_marginal_reconciled_20261102.json').read_text())
          assert x['games']==88
          assert x['counts']['exact_unguarded_only']==29521
          assert x['counts']['guarded_complete']==1280963
          assert x['new_guarded_default_accepted_scenes']==0
          assert x['original_NBA_XYZ_PBP_POSS_unchanged'] is True
          print('FULL88_NATURAL_GAP_EXACT_SOURCE_RECONCILED_88',x['counts'].get('conservative_qualified_source_research',0))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dest"
          git commit -qm 'qa(private): all88 original source natural gap 29521 marginal scenes final [skip ci]'
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH" || exit 37
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo FULL88_NATURAL_GAP_SOURCE_REPORT_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 38
