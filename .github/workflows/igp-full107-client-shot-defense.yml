name: IGP FULL107 canonical Blueprint defender coaching database
'on':
  push:
    branches: [main]
    paths: [.github/workflows/igp-full107-client-shot-defense.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-full107-client-shot-defense
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify protected full107 source boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Read only 107 original Blueprint shot files and their native XYZ indexes
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth=1 --filter=blob:none --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set --no-cone \
            '/gamepulse/fusion/igp_full107_client_shot_defense_v1.py' \
            '/gamepulse/fusion/tests/test_igp_full107_client_shot_defense_v1.py' \
            '/gamepulse/fusion/igp_full107_coach_portal_v1.py' \
            '/gamepulse/fusion/tests/test_igp_full107_coach_portal_v1.py' \
            '/gamepulse/fusion/qa/igp_fullx/LATEST.json' \
            '/data/extensions/nba_blueprint_2026_27/games/**/shot_tracking_32_fields.csv' \
            '/gamepulse/fusion/materialized/igp_all_original_xyz/**/index.json'
          cd "$RUNNER_TEMP/private"
          test "$(find data/extensions/nba_blueprint_2026_27/games -name shot_tracking_32_fields.csv | wc -l)" -eq 107
          test "$(find gamepulse/fusion/materialized/igp_all_original_xyz -name index.json | wc -l)" -eq 107
          echo IGP_FULL107_107_BLUEPRINT_AND_107_NATIVE_XYZ_SOURCE_INDEXES_FOUND
      - name: Execute synthetic acceptance and real FULL107 database build
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 -m py_compile gamepulse/fusion/igp_full107_client_shot_defense_v1.py
          PYTHONPATH="$PWD" python3 -m unittest discover -q \
            -s gamepulse/fusion/tests -p 'test_igp_full107_client_shot_defense_v1.py'
          PYTHONPATH="$PWD" python3 -m unittest discover -q \
            -s gamepulse/fusion/tests -p 'test_igp_full107_coach_portal_v1.py'
          python3 -m py_compile gamepulse/fusion/igp_full107_coach_portal_v1.py
          python3 gamepulse/fusion/igp_full107_client_shot_defense_v1.py \
            --root . \
            --out gamepulse/fusion/materialized/igp_full107_client_shot_defense_v1/full107_shots.sqlite
          python3 gamepulse/fusion/igp_full107_coach_portal_v1.py --smoke \
            --db gamepulse/fusion/materialized/igp_full107_client_shot_defense_v1/full107_shots.sqlite
          python3 - <<'PY'
          import json,sqlite3,pathlib
          p=pathlib.Path('gamepulse/fusion/materialized/igp_full107_client_shot_defense_v1')
          q=json.loads((p/'full107_shots.qa.json').read_text())
          assert q['cohort']=='FULL107' and q['2025_26_separate_archive_included'] is False
          assert q['counts']['unique_games']==107
          assert q['counts']['shots']>=15000
          assert q['counts']['with_official_defender']>0
          assert q['counts']['with_published_xfg']>0
          assert q['counts']['with_outcome']>0
          assert len(q['source_details'])==107
          with sqlite3.connect(p/'full107_shots.sqlite') as c:
              assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
              assert c.execute('SELECT COUNT(*) FROM shots').fetchone()[0]==q['counts']['shots']
          print('FULL107_COACH_CLIENT_SOURCE_QA_ACCEPTED',
                json.dumps(q['counts'],sort_keys=True))
          PY
      - name: Commit private Full107 query product and source-hash receipt
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f \
            gamepulse/fusion/materialized/igp_full107_client_shot_defense_v1/full107_shots.sqlite \
            gamepulse/fusion/materialized/igp_full107_client_shot_defense_v1/full107_shots.qa.json
          git diff --cached --check
          if git diff --cached --quiet; then
              echo FULL107_CLIENT_PRODUCT_ALREADY_IDENTICAL
              exit 0
          fi
          git commit -q -m 'data(full107): materialize official Blueprint defender coaching query with provenance'
          for n in 1 2 3 4 5 6; do
              git fetch -q origin "$BRANCH"
              git rebase -q "origin/$BRANCH"
              if git push -q origin "HEAD:refs/heads/$BRANCH"; then
                  echo FULL107_CLIENT_DEFENSE_SOURCE_GRADED_PRODUCT_COMMITTED
                  exit 0
              fi
              sleep "$n"
          done
          exit 43
