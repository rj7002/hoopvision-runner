name: Sengun37 native ball flight geography (private-only)
# Opaque public-to-private GitHub Actions bridge; no per-event coordinates in logs/artifacts.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-sengun37-native-ball-20261102.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: sengun37-private-native-ball-20261102
  cancel-in-progress: false
jobs:
  source-private:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: analysis/full88-sengun-deterministic-assist-origins-20261102
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public privacy guard
        run: python3 tools/public_content_guard.py
      - name: Private frozen XYZ analysis and Matplotlib rendering
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          python3 -m pip install --quiet matplotlib==3.10.8
          python3 gamepulse/fusion/igp_sengun37_observed_ball_routes_v1.py
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('gamepulse/fusion/qa/igp_fullx/sengun37_observed_ball_routes_v1')
          qa=json.loads((root/'sengun37_ball_informed_QA.json').read_bytes())
          assert qa['events']==37 and qa['ordered_pairs']==35 and qa['unpaired_pairs']==2
          assert qa['no_interpolated_positions_added'] and qa['no_ball_path_assumed_from_endpoints']
          assert qa['counts']['origins']==37 and qa['counts']['receivers']==37 and qa['counts']['shots']==37
          assert qa['counts']['ordered_endpoint_chords']==35 and qa['counts']['unpaired_endpoint_chords']==2
          assert (root/'sengun37_ball_informed_assist_geography.png').read_bytes().startswith(b'\x89PNG')
          assert b'<svg' in (root/'sengun37_ball_informed_assist_geography.svg').read_bytes()[:600]
          print('SENGUN37_SOURCE_BALL_PASS',{'events':qa['events'],
              'coherent_trace_events':qa['coherent_ball_trace_events'],
              'counts':qa['counts']})
          PY
      - name: Commit original ball traces and PNG/SVG only to PRIVATE 104
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_fullx/sengun37_observed_ball_routes_v1
          git -c core.whitespace=-trailing-space diff --cached --check
          if git diff --cached --quiet; then echo PRIVATE_RESULT_UNCHANGED; exit 0; fi
          git commit -q -m 'qa(igp): retain private source XYZ ball traces, plots and evidence'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo SENGUN37_PRIVATE_BALL_ARTIFACTS_COMMITTED
              exit 0
            fi
            sleep "$i"
          done
          exit 24
