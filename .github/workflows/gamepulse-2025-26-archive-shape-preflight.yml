name: IGP 2025-26 archived source shape preflight
on:
  push:
    branches: [main]
    paths: [.github/workflows/gamepulse-2025-26-archive-shape-preflight.yml, tools/public_content_guard.py]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-historical-source-shape-readonly
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 tools/public_content_guard.py
      - name: Read existing SHA-preserved private release index only
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          mkdir -p "$RUNNER_TEMP/historical-index"
          gh release download igp-public-gamepulse-2025-26-20261105 \
            --repo timeedmonds-maker/104 \
            --pattern nba-2025-26-source-index.json \
            --dir "$RUNNER_TEMP/historical-index"
          python3 - <<'PY'
          import collections,json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"historical-index/nba-2025-26-source-index.json"
          d=json.loads(p.read_text())
          assert d["schema"]=="igp.public-source-historical-gamepulse-archive.v1"
          assert d["season"]=="2025-26" and d["total_tracking_games_verified"]>=600
          assert len(d["shards"])==15
          kinds=collections.Counter()
          availability=collections.Counter()
          for game,entry in d["games"].items():
              found=set()
              for member in entry["members"]:
                  path=member["path"]
                  name=path.rsplit("/",1)[-1]
                  kinds[name]+=1
                  found.add(name)
              for name in found:availability[name]+=1
          print("HISTORICAL_SOURCE_INDEX_COUNTS",json.dumps({
            "tracking_games":d["total_tracking_games_verified"],
            "indexed_games":d["total_games_indexed"],
            "native_rows":d["total_normalized_rows"],
            "members":d["total_original_members_copied"],
            "provider_ten_ball_rows":d["total_provider_ten_ball_rows"],
            "member_basename_counts":dict(sorted(kinds.items())),
            "games_by_member_basename":dict(sorted(availability.items())),
            "collection_members":len(d["collection_members"]),
            "shards":len(d["shards"])
          },sort_keys=True))
          PY
      - name: Validate one archive shard and inspect public-source field structure
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          shard=$(python3 - <<'PY'
          import json,os,pathlib
          d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"historical-index/nba-2025-26-source-index.json").read_text())
          print(d["shards"][0]["name"])
          PY
          )
          gh release download igp-public-gamepulse-2025-26-20261105 \
            --repo timeedmonds-maker/104 --pattern "$shard" --dir "$RUNNER_TEMP/historical-index"
          python3 - <<'PY'
          import collections,gzip,hashlib,io,json,os,pathlib,zipfile
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"historical-index"
          d=json.loads((root/"nba-2025-26-source-index.json").read_text())
          entry=d["shards"][0];p=root/entry["name"]
          assert p.stat().st_size==entry["bytes"]
          assert hashlib.sha256(p.read_bytes()).hexdigest()==entry["sha256"]
          with zipfile.ZipFile(p) as z:
              game=next((g for g in sorted(d["games"]) if d["games"][g]["shard"]==entry["name"] and d["games"][g]["tracking"]),None)
              assert game
              for member in d["games"][game]["members"]:
                  raw=z.read(member["path"])
                  assert hashlib.sha256(raw).hexdigest()==member["sha256"]
                  name=member["path"].rsplit("/",1)[-1]
                  if name.endswith(".jsonl.gz"):
                      with gzip.GzipFile(fileobj=io.BytesIO(raw)) as fp:
                          sample=[json.loads(next(fp)) for _ in range(1)]
                      fields={k:type(v).__name__ for k,v in sample[0].items()}
                      nested={k:sorted(v.keys()) for k,v in sample[0].items() if isinstance(v,dict)}
                      print("HISTORICAL_PUBLIC_SOURCE_STRUCTURE",name, json.dumps({"fields":fields,"nested_keys":nested},sort_keys=True))
                  elif name.endswith(".json"):
                      obj=json.loads(raw)
                      print("HISTORICAL_PUBLIC_SOURCE_STRUCTURE",name,json.dumps({"fields":{k:type(v).__name__ for k,v in obj.items()} if isinstance(obj,dict) else {"top_type":type(obj).__name__}},sort_keys=True))
          for name in ("companion.jsonl.gz","stats.jsonl.gz","positions.jsonl.gz"):
              member=next(m for m in d["games"][game]["members"] if m["path"].endswith("/"+name))
              counts=collections.Counter()
              per_event_fields={}
              per_event_metadata={}
              with zipfile.ZipFile(p) as z, z.open(member["path"]) as outer, gzip.GzipFile(fileobj=outer) as fp:
                  for raw in fp:
                      if not raw.strip():continue
                      row=json.loads(raw)
                      event=str(row.get("event"))
                      counts[event]+=1
                      if event not in per_event_fields:
                          per_event_fields[event]=sorted(row.keys())
                          md=row.get("metadata")
                          per_event_metadata[event]=sorted(md.keys()) if isinstance(md,dict) else []
              print("HISTORICAL_EVENT_CENSUS",name,json.dumps({"counts":dict(counts.most_common()),"metadata_keys":per_event_metadata},sort_keys=True))
          print("HISTORICAL_ONE_GAME_MEMBER_SHA_PASS")
          PY
