# v2: fix companion original source path resolution
name: CPU Animate Amen Wemby last-second original source gap CPU forensic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cpu-animate-amen732-lastsecond-native-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-animate-amen732-original-lastsecond-recovery
  cancel-in-progress: false

jobs:
  lastsecond-original-gaps:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      CUDA_VISIBLE_DEVICES: '-1'
      NVIDIA_VISIBLE_DEVICES: none
      OPENCV_OPENCL_RUNTIME: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public content guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from tools.public_content_guard import scan
          assert not scan(['.github/workflows/cpu-animate-amen732-lastsecond-native-recovery.yml'])
          print('ORIGINAL_LATEGAME_NBA_SOURCE_PUBLIC_GUARD_OK')
          PY
      - name: Pin original NBA source, inspect native source-gap and companion
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || exit 4
          if compgen -G '/dev/nvidia*' >/dev/null; then
            echo GPU_DISABLED_REQUIRED; exit 5
          fi
          gh auth setup-git
          ROOT="$(mktemp -d)"; chmod 700 "$ROOT"
          trap 'rm -rf "$ROOT"' EXIT
          URL='https://github.com/timeedmonds-maker/104.git'
          git clone -q --filter=blob:none --depth=1 --sparse \
            -b 'research/gamepulse-clock-boundary-integrity-20261025' \
            "$URL" "$ROOT/private"
          test "$(git -C "$ROOT/private" rev-parse HEAD)" = \
            'e457df5aa4c421a2cf61afa6f1c1624939d377d2' || exit 6
          git -C "$ROOT/private" sparse-checkout set --no-cone \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600009/ \
            /gamepulse/fusion/evidence/companion_sdk_original_0022600009/ \
            /gamepulse/fusion/evidence/companion_0022600009/easelive_positions_event_index_user_capture_20261029.json \
            /gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/companion_app_packages_all56_v1/0022600009/
          git clone -q --filter=blob:none --depth=1 --sparse \
            -b 'cpu-animate/m0-m1-validation-core-20261107' \
            "$URL" "$ROOT/engine"
          git -C "$ROOT/engine" sparse-checkout set --no-cone \
            /cpu_animate/amen732_lategame_source_gap_cpu.py \
            /docs/cpu_animate/qa/
          python3 "$ROOT/engine/cpu_animate/amen732_lategame_source_gap_cpu.py" \
            --root "$ROOT/private" \
            --out "$ROOT/engine/docs/cpu_animate/qa/amen732_original_source_gap_forensic.json"
          cd "$ROOT/engine"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f docs/cpu_animate/qa/amen732_original_source_gap_forensic.json
          git diff --cached --check
          git commit -qm 'evidence(cpu-animate): Amen/Wemby last-second original 3D source-gap and alternate companion inspection'
          for retry in 1 2 3 4 5 6; do
            git fetch -q origin cpu-animate/m0-m1-validation-core-20261107
            git rebase -q origin/cpu-animate/m0-m1-validation-core-20261107
            if git push -q origin 'HEAD:refs/heads/cpu-animate/m0-m1-validation-core-20261107'; then
              echo 'CPU_AMEN732_ORIGINAL_LATEGAME_SOURCE_FORENSIC_COMMITTED_PRIVATE'
              exit 0
            fi
            sleep "$retry"
          done
          exit 7
      - name: Source boundary
        if: always()
        run: |
          echo 'Original NBA player-ball coordinates never leave private Git checkout.'
          echo 'Only CPU-computed aggregate coverage and source field names in public logs.'
          echo 'No GPU or manufactured tracking allowed.'
