name: Cancel duplicate commit workflows
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cancel-duplicate-commit-runs.yml']
permissions:
  actions: write
  contents: read
jobs:
  cancel-duplicates:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel unrelated runs from the specific orchestration edit
        run: |
          python3 - <<'PY'
          import json,subprocess
          repo="timeedmonds-maker/hoopvision-runner"
          keep={"Protected private source statistics","Public Content Guard","Validate Public Bridge Boundary","Validate Public Bridge Boundary"}
          for page in range(1,12):
              d=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/actions/runs?head_sha=6dcb84d4225930e5445d48373d6dda88557d67b8&per_page=100&page={page}"]))
              runs=d.get("workflow_runs",[])
              for r in runs:
                  if r["status"]!="completed" and r["name"] not in keep:
                      subprocess.run(["gh","api","-X","POST",f"repos/{repo}/actions/runs/{r['id']}/cancel"],capture_output=True)
              if len(runs)<100:break
          print("DUPLICATE_COMMIT_RUNS_CANCEL_REQUESTED")
          PY
