name: Rockets Fred on-court made-three next-FGA exact comparison (2026-11-09)
# Source-reviewed allowlist entry approved; public NBA PBP and boxscore only.
'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/rockets-fred-heatcheck-next-fga-20261109.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  next-fga:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Reconcile official Houston game roster, substitutions and next shot
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          python3 - <<'PY'
          import collections, datetime, hashlib, json, re, time, urllib.request
          FRED=1627832
          HOU='HOU'
          FIXTURES=[
            ('2026-10-21','DAL'),
            ('2026-10-23','SAS'),
            ('2026-10-26','ATL'),
            ('2026-10-28','MIL'),
            ('2026-10-30','DAL'),
            ('2026-11-02','BOS'),
            ('2026-11-04','MIN'),
            ('2026-11-07','PHX')]
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          def source(url,maxbytes=6500000):
            for i in range(3):
              try:
                r=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json,text/plain,*/*','Referer':'https://www.nba.com/'})
                with urllib.request.urlopen(r,timeout=23) as f:
                  raw=f.read(maxbytes+1)
                if len(raw)>maxbytes: raise ValueError('source too large')
                return json.loads(raw),hashlib.sha256(raw).hexdigest()
              except Exception as e:
                if i==2: raise
                time.sleep(i+1)
          def date_key(s):
            s=str(s or '')
            m=re.search(r'20\d\d-\d\d-\d\d',s)
            if m:return m.group(0)
            m=re.search(r'(\d{1,2})/(\d{1,2})/(20\d\d)',s)
            if m:return f'{m[3]}-{int(m[1]):02d}-{int(m[2]):02d}'
            return None
          schedule_url='https://cdn.nba.com/static/json/staticData/scheduleLeagueV2_1.json'
          s,ssha=source(schedule_url,maxbytes=13000000)
          dates=s.get('leagueSchedule',{}).get('gameDates',[])
          fixtures={}
          allhou=[]
          for day in dates:
            for g in day.get('games',[]):
              teams=[(g.get(z) or {}).get('teamTricode') for z in ('homeTeam','awayTeam')]
              if HOU not in teams:continue
              opponent=next((t for t in teams if t and t!=HOU),None)
              daykey=date_key(g.get('gameDateEst')) or date_key(day.get('gameDate')) or date_key(g.get('gameDate'))
              gid=str(g.get('gameId') or '')
              allhou.append((daykey,opponent,gid))
              if (daykey,opponent) in FIXTURES:
                fixtures[(daykey,opponent)]=gid
          print('SCHEDULE_SOURCE',schedule_url,'SHA',ssha,'HOU_CANDIDATES',json.dumps(allhou[:15]))
          missing=[x for x in FIXTURES if x not in fixtures]
          if missing:
            print('MISSING_FIXTURES',json.dumps(missing))
            raise RuntimeError('Source schedule fails exact eight requested matchup-date requirements')
          totals=collections.Counter()
          people=collections.defaultdict(collections.Counter)
          receipts=[]
          names={}
          for date,opp in FIXTURES:
            gid=fixtures[(date,opp)]
            base='https://cdn.nba.com/static/json/liveData/'
            bp,boxsha=source(base+'boxscore/boxscore_'+gid+'.json')
            pb,psha=source(base+'playbyplay/playbyplay_'+gid+'.json')
            b=bp.get('game') or {}
            p=pb.get('game') or {}
            assert b.get('gameId')==gid and p.get('gameId')==gid,(gid,'game identity')
            sides={x:(b.get(x) or {}) for x in ('homeTeam','awayTeam')}
            hou=next(v for v in sides.values() if v.get('teamTricode')=='HOU')
            assert set(v.get('teamTricode') for v in sides.values())=={HOU,opp}
            starters=set()
            for player in hou.get('players',[]):
              pid=int(player.get('personId') or 0)
              if not pid: continue
              names[pid]=player.get('name') or (str(player.get('firstName') or '')+' '+str(player.get('familyName') or '')).strip()
              start=str(player.get('starter') or '').lower()
              if start in ('1','true','yes'):starters.add(pid)
            assert len(starters)==5,(gid,'starters unverified',sorted(starters),[(r.get('name'),r.get('starter')) for r in hou.get('players',[])])
            actions=sorted(p.get('actions') or [],key=lambda a:(
                int(a.get('period') or 0),-clock(a.get('clock')) if False else 0,
                int(a.get('orderNumber') or a.get('actionNumber') or 0)))
            # PBP orderNumber is the exact chronological action insertion order.
            # Preserve supplied order when already monotone. Clock is validation only.
            if len(actions)<300:raise AssertionError((gid,'short PBP',len(actions)))
            court=set(starters)
            state={}
            shooting=[]
            anomalies=[]
            previous_period=1
            for a in actions:
              t=str(a.get('actionType') or '').lower()
              st=str(a.get('subType') or '').lower()
              team=a.get('teamTricode')
              pid=int(a.get('personId') or 0)
              if t=='substitution' and team==HOU:
                if st=='out':court.discard(pid)
                elif st=='in':court.add(pid)
                else:anomalies.append(('subtype',a.get('actionNumber'),st))
              if t in ('2pt','3pt') and team==HOU and str(a.get('shotResult') or '').lower() in ('made','missed'):
                entry={'a':int(a.get('actionNumber') or 0),'player':pid,
                       'three':t=='3pt','made':str(a.get('shotResult')).lower()=='made',
                       'fred_on':FRED in court,'court_count':len(court),
                       'period':a.get('period'),'clock':a.get('clock')}
                shooting.append(entry)
                if len(court)!=5:anomalies.append(('courtcount',a.get('actionNumber'),len(court)))
            if anomalies:
              print('SUBSTITUTION_AUDIT',gid,'COUNT',len(anomalies),'EXAMPLES',json.dumps(anomalies[:15]))
            # Reconcile official HOU shot attempts and made triples to independently reported boxscore counts.
            stats=hou.get('statistics') or {}
            fga=stats.get('fieldGoalsAttempted')
            tpm=stats.get('threePointersMade')
            if fga is not None: assert len(shooting)==int(fga),(gid,'FGA mismatch',len(shooting),fga)
            if tpm is not None: assert sum(z['three'] and z['made'] for z in shooting)==int(tpm),(gid,'3PM mismatch',tpm)
            madefred=0
            frednext=0
            good=0
            inconclusive=0
            for idx,a in enumerate(shooting):
              if not a['three'] or not a['made']:continue
              if a['court_count']!=5:
                inconclusive+=1
                continue
              if not a['fred_on']:continue
              nextshot=shooting[idx+1] if idx+1<len(shooting) else None
              if nextshot is None:
                totals['no_followup']+=1
                continue
              pid=a['player']
              matched=int(nextshot['player']==pid)
              people[pid]['denom']+=1
              people[pid]['same']+=matched
              people[pid]['make_3']+=1
              totals['n']+=1
              totals['same']+=matched
              if pid==FRED:
                madefred+=1
                frednext+=matched
                totals['fred_n']+=1
                totals['fred_same']+=matched
                if matched:
                  totals['fred_next_made']+=int(nextshot['made'])
                  totals['fred_next_2_made']+=int(not nextshot['three'] and nextshot['made'])
                  totals['fred_next_2_attempt']+=int(not nextshot['three'])
                  totals['fred_next_3_made']+=int(nextshot['three'] and nextshot['made'])
                  totals['fred_next_3_attempt']+=int(nextshot['three'])
              else:
                totals['others_n']+=1
                totals['others_same']+=matched
            receipts.append({'date':date,'opponent':opp,'gid':gid,'official_fga':fga,'official_3pm':tpm,
                'shots':len(shooting),'fred_trigger':madefred,'fred_next':frednext,
                'no_followup':inconclusive,'on_floor_last':len(court),'pbp_sha':psha,'box_sha':boxsha,
                'starter_names':[names.get(x,str(x)) for x in sorted(starters)]})
            print('GAME_RECONCILED',json.dumps(receipts[-1],sort_keys=True))
          summary={'games':len(receipts),'triggers':totals['n'],'same':totals['same'],
            'pct':round(100*totals['same']/totals['n'],4) if totals['n'] else None,
            'fred':{'triggers':totals['fred_n'],'same':totals['fred_same'],
                    'pct':round(100*totals['fred_same']/totals['fred_n'],4) if totals['fred_n'] else None,
                    'next_two':(totals['fred_next_2_made'],totals['fred_next_2_attempt']),
                    'next_three':(totals['fred_next_3_made'],totals['fred_next_3_attempt'])},
            'teammates':{'triggers':totals['others_n'],'same':totals['others_same'],
                    'pct':round(100*totals['others_same']/totals['others_n'],4) if totals['others_n'] else None},
            'without_next_fga':totals['no_followup'],
            'by_shooter':[{'player_id':pid,'name':names.get(pid,'UNKNOWN'),'made_threes':c['make_3'],
                'next_fga_by_same_player':c['same'],'opportunities':c['denom'],
                'pct':round(100*c['same']/c['denom'],4)}
                for pid,c in sorted(people.items(),key=lambda x:(-x[1]['denom'],x[0]))]}
          print('FRED_ON_COURT_SAME_PLAYER_NEXT_ROCKETS_FGA_FINAL',json.dumps(summary,sort_keys=True))
          assert summary['fred']['triggers']==22 and summary['fred']['same']==11, 'Prior reconciled Fred 22 and 11 calibration mismatch: investigate before accepting teammate result'
          assert sum(c['denom'] for c in people.values())==totals['n']
          print('FRED_HEATCHECK_COMPARISON_EIGHT_GAME_CALIBRATION_PASSED')
          PY
