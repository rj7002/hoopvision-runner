name: Rockets Fred made-three next-FGA official source and cross-source diagnostic (2026-11-09)
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/rockets-fred-heatcheck-next-fga-20261109.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  next-fga:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Test independent public source endpoints for exact eight-game event and substitution reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          python3 - <<'PY'
          import urllib.request, json, urllib.error
          urls=[
           "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=20261107",
           "https://site.web.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=20261107",
           "https://www.nba.com/game/hou-vs-phx-0022600194/play-by-play",
           "https://cdn.nba.com/static/json/liveData/playbyplay/playbyplay_0022600194.json",
           "https://stats.gleague.nba.com/stats/playbyplayv3?GameID=0022600194&StartPeriod=0&EndPeriod=0"
          ]
          for url in urls:
           for mode in ('default','browser'):
            try:
             headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36'} if mode=='browser' else {}
             r=urllib.request.Request(url,headers=headers)
             with urllib.request.urlopen(r,timeout=10) as z:
              b=z.read(2500000)
              typ=z.headers.get('Content-Type')
              code=z.status
             out={'url_host':url.split('/')[2],'path':url.split('/')[3][:60],'mode':mode,'http':code,'bytes':len(b),'type':typ}
             if 'json' in str(typ):
              data=json.loads(b)
              out['keys']=list(data)[:15]
              if 'events' in data:
               out['events_count']=len(data['events'])
               out['hou']= [(e.get('id'),[(c.get('team') or {}).get('abbreviation') for v in e.get('competitions',[]) for c in v.get('competitors',[])]) for e in data['events'] if any((c.get('team') or {}).get('abbreviation')=='HOU' for v in e.get('competitions',[]) for c in v.get('competitors',[]))]
             print('PROBE',json.dumps(out),flush=True)
             break
            except Exception as e:print('PROBE_FAIL',url.split('/')[2],mode,type(e).__name__,str(e)[:80],flush=True)
          PY
