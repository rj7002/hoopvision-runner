# Reviewed public guard registration: private source files and event rows remain in 104.
name: Full88 official assist source census private
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full88-all-official-assists-private.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-full88-all-official-assists-private
  cancel-in-progress: false
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: analysis/full88-sengun-deterministic-assist-origins-20261102
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify public content boundary
        run: python3 tools/public_content_guard.py
      - name: Capture original NBA PBP and box privately
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          python3 -m unittest discover -s gamepulse/fusion/tests -p 'test_igp_full88_official_assist_census_v1.py' -v
          python3 gamepulse/fusion/igp_full88_official_assist_census_v1.py
      - name: Commit raw source and event QA only to private 104
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_fullx/official_assist_source_full88_v1 gamepulse/fusion/qa/igp_fullx/official_assist_census_full88_v1.json gamepulse/fusion/qa/igp_fullx/official_assist_events_full88_v1.jsonl
          git diff --cached --check
          if git diff --cached --quiet; then echo FULL88_ASSIST_SOURCE_RESULT_UNCHANGED; exit 0; fi
          git commit -q -m "qa(igp): pin original official assist sources and reconcile all Full88 games"
          for n in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then echo FULL88_ASSIST_SOURCE_QA_PRIVATE_ONLY; exit 0; fi
            sleep "$n"
          done
          exit 24
      - name: Require complete official assist reconciliation
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('gamepulse/fusion/qa/igp_fullx/official_assist_census_full88_v1.json').read_bytes())
          c=d['counts']
          print('IGP_FULL88_ASSIST_CENSUS_FINAL_AGGREGATE_ONLY',c)
          assert c['games_in_release']==88
          assert c['games_reconciled']==88
          assert c['player_box_mismatches']==0
          assert c['all88_assist_census_reconciled']==1
          assert c['unique_event_rows']==c['assists_with_raw_identity']
          PY
      - name: Verify frozen all-player query privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'gamepulse/fusion')
          from igp_full88_assist_query_v1 import query
          all_rows=query('.')
          sengun=query('.',assister_id=1630578)
          assert all_rows['count']==4616
          assert sengun['count']==37
          assert sum(bool(e['pass_origin'] and e['reception']) for e in all_rows['events'])==2223
          assert sum(bool(e['shot_release']) for e in all_rows['events'])==2145
          assert sum(bool(e['pass_origin'] and e['reception'] and e['shot_release']) for e in all_rows['events'])==1244
          assert len({e['key'] for e in all_rows['events']})==4616
          assert len({e['game_id'] for e in all_rows['events']})==88
          assert all(e['pass_origin'] is None or e['pass_origin']['source_pointer'] for e in all_rows['events'])
          print('FULL88_ASSIST_QUERY_AGGREGATE_ONLY', all_rows['all_games'],all_rows['count'],sengun['count'])
          PY
      - name: Exercise private linked app filters and exports
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 -m pip install --quiet matplotlib==3.10.8
          python3 - <<'PY'
          import csv,io,json,sys,threading,urllib.request
          from http.server import ThreadingHTTPServer
          sys.path.insert(0,'gamepulse/fusion')
          from igp_full88_assist_query_v1 import query
          from igp_assist_explorer_app import app,select,summarize
          data=query('.')
          server=ThreadingHTTPServer(('127.0.0.1',0),app(data))
          threading.Thread(target=server.serve_forever,daemon=True).start()
          base='http://127.0.0.1:'+str(server.server_port)
          def get(path):
              with urllib.request.urlopen(base+path,timeout=60) as response:return response.read()
          try:
              opts=json.loads(get('/api/options'))
              assert len(opts['assisters'])>1 and any(k=='1630578' for k,v in opts['assisters'])
              uri='assister=1630578&shotType=3pt&passerMin=0&passerMax=5&catchMin=12&catchMax=50&includeMissing=false'
              rows=select(data['events'],{k:[v] for k,v in [p.split('=') for p in uri.split('&')]})
              api=json.loads(get('/api/events?'+uri))
              assert api['count']==len(rows)==api['analysis']['event_count']
              assert len(list(csv.DictReader(io.StringIO(get('/api/export?format=csv&'+uri).decode()))))==len(rows)
              assert json.loads(get('/api/export?format=json&'+uri))['count']==len(rows)
              assert get('/api/export?format=png&'+uri).startswith(bytes.fromhex('89504e47'))
              svg=get('/api/chart?format=svg&assister=1630578').decode()
              assert '<svg' in svg and 'id="assist_' in svg
              assert json.loads(get('/api/events?assister=1630578'))['count']==37
              assert json.loads(get('/api/events'))['count']==4616
              print('FULL88_ASSIST_APP_LINKED_PRIVATE_SMOKE_OK',api['count'],37,4616)
          finally:
              server.shutdown()
          PY
      - name: Save deterministic Sengun publication exports privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'gamepulse/fusion')
          from igp_full88_assist_query_v1 import query
          from igp_assist_explorer_app import render,summarize
          rows=query('.',assister_id=1630578)['events']
          assert len(rows)==37
          out=Path('gamepulse/fusion/qa/igp_fullx/assist_explorer_figures_v1')
          out.mkdir(parents=True,exist_ok=True)
          for full,name in ((False,'halfcourt'),(True,'fullcourt')):
              for fmt in ('png','svg'):
                  (out/('sengun_assist_geometry_'+name+'.'+fmt)).write_bytes(
                      render(rows,'geometry',full,fmt))
          (out/'sengun_assist_summary.json').write_text(
              json.dumps(summarize(rows),sort_keys=True,indent=2,allow_nan=False)+chr(10))
          print('FULL88_SENGUN_PRIVATE_PUBLICATION_EXPORT_COUNT',len(rows),5)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_fullx/assist_explorer_figures_v1
          git -c core.whitespace=-trailing-space diff --cached --check
          if git diff --cached --quiet; then echo FULL88_ASSIST_FIGURES_UNCHANGED; exit 0; fi
          git commit -q -m "qa(igp): private deterministic Sengun full and half court exports"
          for n in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then echo FULL88_ASSIST_FIGURES_PRIVATE_ONLY; exit 0; fi
            sleep "$n"
          done
          exit 24
      - name: Compute all-game source-graded assist physical candidates privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 -m unittest discover -s gamepulse/fusion/tests -p 'test_igp_full88_all_assist_physical_v1.py' -v
          python3 gamepulse/fusion/igp_full88_all_assist_physical_v1.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('gamepulse/fusion/qa/igp_fullx/official_assist_physical_full88_v1_qa.json')
          d=json.loads(p.read_bytes());c=d['counts']
          assert c['official_assists']==4616
          assert len(d['games'])==88
          print('FULL88_ALL_ASSIST_PHYSICAL_AGGREGATE_ONLY',c)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_fullx/official_assist_physical_full88_v1.jsonl gamepulse/fusion/qa/igp_fullx/official_assist_physical_full88_v1_qa.json
          git diff --cached --check
          if git diff --cached --quiet; then echo FULL88_ASSIST_PHYSICAL_UNCHANGED; exit 0; fi
          git commit -q -m "qa(igp): source-graded physical candidates for all Full88 official assists"
          for n in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then echo FULL88_ASSIST_PHYSICAL_PRIVATE_ONLY; exit 0; fi
            sleep "$n"
          done
          exit 24
