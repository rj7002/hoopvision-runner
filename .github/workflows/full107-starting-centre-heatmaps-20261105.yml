# Source-verified Full107 2ft density and PNG outputs remain in the private repository.
name: Full107 all30 defensive XY maps render private
on:
  push:
    branches: [main]
    paths: ['.github/workflows/full107-starting-centre-heatmaps-20261105.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: full107-30-xy-render-private
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: analysis/full107-center-defensive-paint-20261105
      RENDERER_PIN: 2f3faefb8edfe9160aebec5825a4bbc7b5846940
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public guard
        run: python3 -m py_compile tools/public_content_guard.py && python3 tools/public_content_guard.py
      - name: Source-derived deterministic PNG rendering in protected private clone
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion/analysis gamepulse/fusion/qa/analysis/full107_center_defensive_heatmaps_v1_20261105
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$RENDERER_PIN"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$RENDERER_PIN"
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$RENDERER_PIN"
          python3 -m pip -q install numpy matplotlib
          cd "$RUNNER_TEMP/private"
          base="gamepulse/fusion/qa/analysis/full107_center_defensive_heatmaps_v1_20261105"
          python3 -B gamepulse/fusion/analysis/igp_full107_center_xy_30map_render_v1.py --input "$base/starting_centres_30team_heatmaps.json" --output-dir "$base/visuals"
          test "$(find "$base/visuals/individual" -name '*.png' | wc -l)" -eq 30
          test -s "$base/visuals/full107_all30_starting_center_xy.png"
          test -s "$base/visuals/full107_clingan_bam_source_xy.png"
          sha256sum "$base/visuals/full107_all30_starting_center_xy.png" "$base/visuals/full107_clingan_bam_source_xy.png"
      - name: Publish all deterministic chart PNGs to protected private repository
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          base="gamepulse/fusion/qa/analysis/full107_center_defensive_heatmaps_v1_20261105"
          git fetch -q origin "$PRIVATE_BRANCH"
          git checkout -q -B release FETCH_HEAD
          git config user.name "Integrated Pulse Source QA"
          git config user.email "41882018272+source-qa@users.noreply.github.com"
          git add "$base/visuals"
          git commit -qm "viz: Full107 30 official starting centres original defensive-half position heatmaps"
          success=0
          for i in $(seq 1 16); do
            git fetch -q origin "$PRIVATE_BRANCH"
            if ! git rebase "origin/$PRIVATE_BRANCH"; then git rebase --abort || true;exit 3;fi
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then success=1;break;fi
            sleep $((2+i))
          done
          test "$success" = 1
          git fetch -q origin "$PRIVATE_BRANCH"
          for name in full107_all30_starting_center_xy.png full107_clingan_bam_source_xy.png; do
            file="$base/visuals/$name"
            sha="$(sha256sum "$file" | cut -d' ' -f1)"
            readback="$(git show "origin/$PRIVATE_BRANCH:$file" | sha256sum | cut -d' ' -f1)"
            test "$sha" = "$readback"
            echo "FULL107_PRIVATE_ORIGINAL_SOURCE_PNG_SHA_READBACK_OK $name $sha"
          done
