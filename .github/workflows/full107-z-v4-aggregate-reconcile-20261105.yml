# Security reviewed: v4 exclusively reconciles existing SHA-pinned PRIVATE QA, no direct tracking in public runner.
name: Full107 Z v4 corrected aggregation independent nine-game audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/full107-z-v4-aggregate-reconcile-20261105.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: full107-z-v4-independent-reconcile-20261105
  cancel-in-progress: false
jobs:
  source-independent-reconciliation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/full107-player-z-airtime-calibration-20261105
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Enforce public original-NBA data boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set --no-cone \
            /gamepulse/fusion/analysis/igp_full107_player_z_airtime_calibration_pilot_20261105.py \
            /gamepulse/fusion/analysis/igp_full107_player_z_airtime_9game_shadow_v2_20261105.py \
            /gamepulse/fusion/analysis/igp_full107_player_z_9game_reconcile_v4_20261105.py \
            /gamepulse/fusion/analysis/igp_full107_airtime_ground_contact_eval_v1_20261105.py \
            /gamepulse/fusion/analysis/test_igp_full107_airtime_ground_contact_eval_v1_20261105.py \
            /gamepulse/fusion/qa/analysis/full107_player_z_9game_shadow_v2_20261105.json \
            /gamepulse/fusion/qa/analysis/full107_player_z_sampling_alignment_v3_20261105.json
      - name: Independent foot-contact evaluator source-free regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private/gamepulse/fusion/analysis"
          python3 -B -m py_compile igp_full107_airtime_ground_contact_eval_v1_20261105.py
          python3 -B -m unittest -v test_igp_full107_airtime_ground_contact_eval_v1_20261105.py
          echo AIRTIME_INDEPENDENT_EVALUATOR_SYNTHETIC_TESTS_ONLY
      - name: Exact nine-game event conservation and hangTime crosscheck
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 -m py_compile gamepulse/fusion/analysis/igp_full107_player_z_9game_reconcile_v4_20261105.py
          python3 -B gamepulse/fusion/analysis/igp_full107_player_z_9game_reconcile_v4_20261105.py > "$RUNNER_TEMP/reconcile-v4-private.log" 2>&1 || {
            echo PRIVATE_V4_AGGREGATION_RECONCILIATION_FAILED
            exit 1
          }
          python3 - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('gamepulse/fusion/qa/analysis/full107_player_z_9game_reconciled_v4_20261105.json')
          q=json.loads(p.read_bytes())
          assert q['games']==9 and q['count_crosscheck']
          assert q['validated_source_event_anchor']['shooter']['all_direct_matched']==805
          assert q['validated_source_event_anchor']['defender']['all_direct_matched']==788
          assert not q['publishable_airtime_leaderboard']
          print("FULL107_Z_V4_RECONCILED_NINE_GAMES",json.dumps({
            "shooter":q['validated_source_event_anchor']['shooter'],
            "defender":q['validated_source_event_anchor']['defender'],
            "source_candidate_elevation":q['source_candidate_elevation'],
            "hangtime":q['source_hangtime_comparison'],
            "sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
            "physical_airtime_certified":False},sort_keys=True))
          PY
      - name: Commit research-only reconcile QA privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f gamepulse/fusion/qa/analysis/full107_player_z_9game_reconciled_v4_20261105.json
          git diff --cached --check
          if git diff --cached --quiet; then echo V4_RESEARCH_QA_ALREADY_PRESENT; exit 0; fi
          git commit -qm 'qa(private): nine game original player Z event aggregation reconciliation'
          gh auth setup-git
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo V4_RECONCILED_QA_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 26
