# Public bridge only. Private NBA source frames and player identity stay in private 104.
name: Full88 source-grade v4 limited single natural-gap private release acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full88-v4-single-p2b-promote-private-20261102.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: full88-v4-limited-single-source-grade-20261102
  cancel-in-progress: false
jobs:
  pinned-private-source-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/igp-p2b-natural-gap-20261102
      PRIVATE_SHA: c972e8fab196f5d134501ee45a2d5ff7ff6552a6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify private source boundary and pinned code
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          git fetch -q --depth=1 origin "$PRIVATE_SHA"
          git checkout -q --detach "$PRIVATE_SHA"
          test "$(git rev-parse HEAD)" = "$PRIVATE_SHA" || { echo FULL88_V4_PRIVATE_SHA_DRIFT; exit 20; }
          git sparse-checkout set gamepulse/fusion
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_full88_source_grade_single_default_v4.py gamepulse/fusion/igp_default_engine.py
          echo FULL88_V4_PINNED_PRIVATE_SOURCE_SHA_PASS
      - name: Test source-heldout promotion and prior sourcegraded v3/official event regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          for suite in test_igp_full88_source_grade_single_default_v4.py test_igp_full88_default_engine_v3.py test_igp_full88_p2b_natural_gap_entry_v1.py test_igp_full88_p2b_natural_gap_tier_v1.py; do
            python3 -m unittest discover -s gamepulse/fusion/tests -p "$suite" -q > "$RUNNER_TEMP/$suite.log" 2>&1 || {
              python3 - <<'PY'
          import os,re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          for p in root.glob("test_igp_full88*.py.log"):
              lines=p.read_text(errors="replace").splitlines()
              e=[s for s in lines if s.startswith(("AssertionError:","KeyError:","ValueError:","TypeError:","FAILED ("))]
              if e:
                  print("FULL88_V4_PRIVATE_TEST_FAILURE_TYPE",p.name, re.sub(r'[0-9]{4,}','[ID]',e[-1])[:180])
          PY
              echo FULL88_V4_CROSS_ENGINE_DEFAULT_REGRESSION_FAILED
              exit 21
            }
          done
          echo FULL88_V4_LIMITED_SOURCE_GRADE_ENGINE_V3_ROLLBACK_AND_NBA_ORIGINAL_QA_PASS
      - name: Verify no new official possessions or physical certification
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY' > "$RUNNER_TEMP/v4-verified-private.log" 2>&1
          from igp_full88_source_grade_single_default_v4 import _qa
          from pathlib import Path
          q=_qa(Path("."))
          assert q["single_source_candidate_research_qualified"]==5904
          assert q["two_player_and_multi_source_research_only"]==333
          assert q["hypothetical_source_grade_single_only_complete"]==1286867
          assert q["holdout"]["qualified_source_holdout_n"]==374
          assert q["independent_video_identity_or_ground_truth_position_certified"] is False
          assert q["original_source_PBP_team_POSS_mutated"] is False
          print("FULL88_V4_IMMUTABLE_QA_ACCEPTED")
          PY
          grep -q FULL88_V4_IMMUTABLE_QA_ACCEPTED "$RUNNER_TEMP/v4-verified-private.log"
          echo FULL88_V4_SOURCE_10HZ_SINGLE_5904_ACCEPTED_NO_PHYSICAL_VIDEO_CERT
