name: NBA zone defense endpoint discovery
'on':
  push:
    branches: [research/inside-game-zone-api-discovery-20261105]
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe discovered public resource with NBA Stats parameters
        shell: bash
        run: |
          python - <<'PY'
          import requests,concurrent.futures,re,json
          from bs4 import BeautifulSoup
          from urllib.parse import urlencode,urljoin
          session=requests.Session()
          session.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36',
            'Referer':'https://www.nba.com/',
            'Origin':'https://www.nba.com',
            'Accept':'application/json, text/plain, */*',
            'x-nba-stats-origin':'stats',
            'x-nba-stats-token':'true',
            'Accept-Language':'en-US,en;q=0.9'
          })
          base='https://stats.nba.com/stats/'
          cases=[
            ('zone_2627', 'zonedefenseteamleaders',{'LeagueID':'00','Season':'2026-27','SeasonType':'Regular Season'}),
            ('zone_2526', 'zonedefenseteamleaders',{'LeagueID':'00','Season':'2025-26','SeasonType':'Regular Season'}),
            ('zone_2425', 'zonedefenseteamleaders',{'LeagueID':'00','Season':'2024-25','SeasonType':'Regular Season'}),
            ('zone_no_params', 'zonedefenseteamleaders',{}),
            ('gravity_control', 'gravityleaders',{'LeagueID':'00','Season':'2026-27','SeasonType':'Regular Season'}),
          ]
          def probe(case):
            name,endpoint,params=case
            url=base+endpoint+('?' + urlencode(params) if params else '')
            try:
              r=session.get(url,timeout=20)
              print('STATS_PROBE',name,'STATUS',r.status_code,'FINAL',r.url,'SIZE',len(r.content),'TYPE',r.headers.get('Content-Type'),'PREVIEW',r.text[:400].replace(chr(10),' '),flush=True)
              if r.status_code==200:
                try:
                  d=r.json()
                  print('STATS_SCHEMA',name,'TOP',list(d)[:18] if isinstance(d,dict) else type(d).__name__,flush=True)
                  def scan(o,depth=0):
                    if depth>3:return
                    if isinstance(o,dict):
                      for k,v in list(o.items())[:10]:
                        if isinstance(v,list):
                          print('KEYARRAY',name,k,'COUNT',len(v),'FIRST',str(v[:1])[:1300],flush=True)
                        elif isinstance(v,dict):scan(v,depth+1)
                  scan(d)
                except Exception as e: print('PARSE_ERR',name,str(e)[:150],flush=True)
            except Exception as e:print('PROBE_ERR',name,type(e).__name__,str(e)[:200],flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:list(pool.map(probe,cases))
          print('=== NBA FIRST-PARTY CHUNK ===',flush=True)
          chunk='https://www.nba.com/_next/static/chunks/53866-dff38f3666182039.js'
          try:
            r=session.get(chunk,timeout=18);print('CHUNK_GET',r.status_code,len(r.content),flush=True)
            txt=r.text
            for term in ('zonedefenseteamleaders','teamZoneDefense','SeasonType','Zone Defense','Zone Poss','ZONE_POSS'):
              ms=list(re.finditer(re.escape(term),txt,re.I))
              print('CHUNK_TERM',term,len(ms),flush=True)
              for m in ms[:3]:
                print('CHUNK_CONTEXT',term,txt[max(0,m.start()-950):m.end()+1200][:2200],flush=True)
          except Exception as e:print('CHUNK_ERROR',str(e)[:200],flush=True)
          print('=== DATA CLIENT MODULE ===',flush=True)
          try:
            html=session.get('https://www.nba.com/inside-the-game/team/zonedefense',timeout=18).text
            soup=BeautifulSoup(html,'html.parser')
            srcs=[x.get('src') for x in soup.find_all('script',src=True)]
            for src in srcs:
              if src and ('_next/static/chunks/' in src):
                u=urljoin('https://www.nba.com/',src)
                try:
                  body=session.get(u,timeout=10).text
                  m=re.search(r'36843:function',body)
                  if m:
                    print('MODULE36843',u,'CONTEXT',body[m.start():m.start()+6000],flush=True)
                    break
                except Exception:pass
          except Exception as e:print('MODULE_SCAN_ERROR',str(e)[:170],flush=True)
          PY
