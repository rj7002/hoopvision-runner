name: NBA zone defense endpoint discovery
'on':
  push:
    branches: [research/inside-game-zone-api-discovery-20261105]
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight HTTP parser
        run: python -m pip install -q requests beautifulsoup4
      - name: Decode exact stats host, client parameters, public returned columns
        shell: bash
        run: |
          python - <<'PY'
          import requests,re,json
          h={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'}
          s=requests.Session();s.headers.update(h)
          urls=['https://www.nba.com/_next/static/chunks/pages/_app-74d68f314af7c145.js','https://www.nba.com/_next/static/chunks/53866-dff38f3666182039.js']
          for url in urls:
            try:
              r=s.get(url,timeout=15);txt=r.text
              print('SCRIPT',url,'HTTP',r.status_code,'LEN',len(txt),flush=True)
              if '53866-' in url:
                fields=list(dict.fromkeys(re.findall(r'field:"([^"]+)"',txt)))
                print('ZONE_FIELDS',fields,flush=True)
                for term in ['const P="zonedefenseteamleaders"','name:"type"','autoRun:']:
                  i=txt.find(term)
                  print('TOKEN',term,'AT',i,'CONTEXT',txt[max(i-100,0):i+950] if i>=0 else '',flush=True)
              else:
                for module in ['18744:function','3133:function','36843:function']:
                  m=re.search(re.escape(module),txt)
                  print('MODULE',module,'AT',m.start() if m else None,flush=True)
                  if m:print('MODULE_CONTENT',module,txt[m.start():m.start()+4600],flush=True)
                for term in ['https://stats.nba.com/stats/','bL:','stats.nba.com']:
                  indexes=[m.start() for m in re.finditer(re.escape(term),txt)]
                  print('API_BASE_TOKEN',term,'MATCHES',len(indexes),flush=True)
                  for i in indexes[:5]:print('API_BASE_CONTEXT',txt[max(0,i-400):i+520],flush=True)
            except Exception as e:print('ERROR',url,repr(e)[:300],flush=True)
          html=s.get('https://www.nba.com/inside-the-game/team/zonedefense',timeout=15).text
          m=re.search(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>',html)
          if m:
            d=json.loads(m.group(1));p=d['props']['pageProps'];print('PAGEPROPS_KEYS',list(p),flush=True)
            for k,v in p.items():
              if 'inside' in k.lower() or k.lower() in ('page','stats'):
                print('PROPS',k,'PREVIEW',str(v)[:1700],flush=True)
          PY
