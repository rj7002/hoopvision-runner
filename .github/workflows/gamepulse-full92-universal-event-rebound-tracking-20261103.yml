name: Full92 original NBA action-to-XYZ and rebound alignment
# PUBLIC ORCHESTRATION ONLY. Native NBA coordinates and PBP stay private in 104.
# Explicitly reviewed and listed in the public_content_guard allowlist.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-full92-universal-event-rebound-tracking-20261103.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-full92-all-pbp-event-original-xyz-20261103
  cancel-in-progress: false
jobs:
  private-original-source-92:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/full92-all-event-rebound-tracking-20261103
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Source guard, private authenticated clone
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Source-free tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_full92_all_event_rebound_tracking_v1.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p 'test_igp_full92_all_event_rebound_tracking_v1.py'
          echo FULL92_EVENT_SOURCEFREE_PASS
      - name: Real original-source one-game pilot
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_full92_all_event_rebound_tracking_v1.py \
            --root . --game-id 0022600001 --out-dir gamepulse/fusion/materialized/igp_full92_pbp_event_tracking_pilot_v1 \
            > "$RUNNER_TEMP/pilot.log" 2>&1 || {
              echo FULL92_EVENT_PILOT_FAILURE
              python3 - <<'PY'
          import os,re
          from pathlib import Path
          z=(Path(os.environ["RUNNER_TEMP"])/"pilot.log").read_text(errors="replace").splitlines()
          e=next((x for x in reversed(z) if re.match(r"^(?:ValueError|TypeError|KeyError|FileNotFoundError|ImportError|AssertionError):",x)),None)
          if e:
              typ,_,detail=e.partition(":");code=detail.strip().split(":",1)[0].split(" ",1)[0]
              print("PRIVATE_FAILURE",typ,code if re.fullmatch("[A-Z0-9_]{5,90}",code) else "REDACTED")
          else:print("PRIVATE_FAILURE UNCLASSIFIED")
          PY
              exit 41
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path("gamepulse/fusion/materialized/igp_full92_pbp_event_tracking_pilot_v1/index.json").read_bytes())
          c=d["counts"]
          assert d["games"]==1 and c["official_actions"]==593
          assert c["type:2pt"]+c["type:3pt"]==174
          assert c["rebound_all"]==c["rebound_player"]+c["rebound_team"]
          assert c["rebound_player_sustained_proximity"]<=c["rebound_player_coobserved"]
          assert c["native_250ms"]<=c["native_4100ms"]<=593
          assert d["physical_rebound_contacts_independently_certified"]==0
          print("FULL92_EVENT_REAL_PILOT_OK",c["official_actions"],c["rebound_all"],c["native_250ms"])
          PY
      - name: Run and verify complete source SHA-locked Full92
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_full92_all_event_rebound_tracking_v1.py \
            --root . > "$RUNNER_TEMP/full92.log" 2>&1 || {
              echo FULL92_EVENT_ALL92_FAILURE
              python3 - <<'PY'
          import os,re
          from pathlib import Path
          z=(Path(os.environ["RUNNER_TEMP"])/"full92.log").read_text(errors="replace").splitlines()
          e=next((x for x in reversed(z) if re.match(r"^(?:ValueError|TypeError|KeyError|FileNotFoundError|ImportError|AssertionError):",x)),None)
          if e:
              typ,_,detail=e.partition(":");code=detail.strip().split(":",1)[0].split(" ",1)[0]
              print("PRIVATE_FAILURE",typ,code if re.fullmatch("[A-Z0-9_]{5,90}",code) else "REDACTED")
          else:print("PRIVATE_FAILURE UNCLASSIFIED")
          PY
              exit 42
            }
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path("gamepulse/fusion/materialized/igp_full92_pbp_event_tracking_v1/index.json")
          d=json.loads(p.read_bytes()); c=d["counts"]
          assert d["games"]==92 and len(d["by_game"])==92
          assert c["official_actions"]==55956 and c["type:2pt"]+c["type:3pt"]==16254
          assert c["rebound_all"]==c["rebound_player"]+c["rebound_team"]
          assert c["rebound_player_sustained_proximity"]<=c["rebound_player_coobserved"]
          assert c["native_250ms"]<=c["native_4100ms"]<=55956
          assert d["physical_rebound_contacts_independently_certified"]==0
          print("FULL92_EVENT_TRACKING_QA_PASS",json.dumps({
            "events":c["official_actions"],"rebounds":c["rebound_all"],
            "player_rebounds":c["rebound_player"],"team_rebounds":c["rebound_team"],
            "coobserved":c["rebound_player_coobserved"],
            "sustained_proximity":c["rebound_player_sustained_proximity"],
            "event_direct_250ms":c["native_250ms"],
            "event_window_4100ms":c["native_4100ms"],
            "index_sha256":hashlib.sha256(p.read_bytes()).hexdigest()},sort_keys=True))
          PY
      - name: Commit proprietary event-to-source pointer index only to PRIVATE repo
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/materialized/igp_full92_pbp_event_tracking_v1/
          git diff --cached --check
          if git diff --cached --quiet; then echo FULL92_ALREADY_PRIVATE; exit 0; fi
          git commit -qm 'data(igp): private Full92 official event to original native SHA pointers'
          gh auth setup-git
          for n in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || exit 43
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo FULL92_EVENT_PRIVATE_RECEIPTS_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 44


  private-release-height-top20:
    name: Original XYZ trajectory-aligned shot release height full92
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/full92-all-event-rebound-tracking-20261103
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source boundary and authenticated private clone
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Compute original-ball trajectory-supported shot release Z at >12 ft
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_full92_shot_release_height_rank_v1.py
          python3 gamepulse/fusion/igp_full92_shot_release_height_rank_v1.py --root . \
            --out gamepulse/fusion/qa/igp_fullx/full92_release_height_12ft_v1.json \
            > "$RUNNER_TEMP/private-release-height.log" 2>&1 || {
              echo FULL92_PRIVATE_RELEASE_HEIGHT_FAILED
              python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'private-release-height.log').read_text(errors='replace').splitlines()
          err=next((x for x in reversed(lines) if re.match(r'^(ValueError|TypeError|KeyError|FileNotFoundError|AssertionError|AttributeError|ImportError):',x)),None)
          print('PRIVATE_FAILURE',err.split(':')[0] if err else 'UNCLASSIFIED')
          PY
              exit 42
            }
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('gamepulse/fusion/qa/igp_fullx/full92_release_height_12ft_v1.json').read_bytes())
          c=d['counts']
          assert d['schema']=='igp.full92.original-ball-shot-release-height-12ft.v1'
          assert c['total_fga']==16254
          assert c['distance_above_12ft']>=1000
          assert d['physical_hand_departure_video_certified'] is False
          assert len(d['by_game_counts'])==92
          assert len(d['top20'])<=20
          assert all(x['measured_shots']>=10 for x in d['top20'])
          print('FULL92_SHOT_RELEASE_HEIGHT_PRIVATE_AGGREGATE',json.dumps({
           'games':92,'official_fga':c['total_fga'],'over12':c['distance_above_12ft'],
           'ballistic':c.get('accepted_ORIGINAL_BALLISTIC_FIT',0),
           'original_direct_90ms':c.get('accepted_SOURCE_TIMESTAMP_DIRECT_90MS_NOT_FLIGHT_VALIDATED',0),
           'qualified_players':d['qualified_players']},sort_keys=True))
          PY
      - name: Commit only aggregate ranking and QA inside private 104
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_fullx/full92_release_height_12ft_v1.json
          git diff --cached --check
          if git diff --cached --quiet; then echo FULL92_SHOT_RELEASE_HEIGHT_ALREADY_PRIVATE; exit 0; fi
          git commit -qm 'analysis(igp): private source-backed Full92 shot-release height leaderboard'
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo FULL92_RELEASE_HEIGHT_SOURCE_GRADED_RESULTS_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$n"
          done
          exit 44


  private-release-height-feature-crosscheck:
    name: Full92 release height source feature vs ball-arc crosscheck
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/full92-all-event-rebound-tracking-20261103
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Original source privacy guard and private research clone
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Source derived biomechanics crosscheck and private source paired comparison
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_full92_release_height_feature_crosscheck_v1.py
          python3 gamepulse/fusion/igp_full92_release_height_feature_crosscheck_v1.py --root . \
           --out gamepulse/fusion/qa/igp_fullx/full92_release_height_feature_crosscheck_v1.json \
           > "$RUNNER_TEMP/feature-crosscheck-private.log" 2>&1 || {
             echo FULL92_FEATURE_HEIGHT_CROSSCHECK_FAILED
             python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'feature-crosscheck-private.log').read_text(errors='replace').splitlines()
          error=next((x for x in reversed(lines) if re.match(r'^(ValueError|TypeError|KeyError|FileNotFoundError|AssertionError|AttributeError|ImportError):',x)),None)
          print('PRIVATE_FAILURE',error.split(':')[0] if error else 'UNCLASSIFIED')
          PY
             exit 42
           }
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('gamepulse/fusion/qa/igp_fullx/full92_release_height_feature_crosscheck_v1.json')
          d=json.loads(p.read_bytes());c=d['counts']
          assert d['schema']=='igp.full92.derived-handheight-heightdiff-vs-ball-flight-crosscheck.v1'
          assert c['over12']==8055
          assert d['original_XYZ_unchanged']
          print('FULL92_FEATURE_HEIGHT_SOURCE_QA_PASS',json.dumps({
             'over12':c['over12'],'paired':c['paired_trajectory_feature'],
             'minus_abs_mean_ft':d['paired_differences']['minus']['absolute_delta_ft']['mean'],
             'plus_abs_mean_ft':d['paired_differences']['plus']['absolute_delta_ft']['mean'],
             'feature_ranked_players':d['source_feature_ranked_players']},sort_keys=True))
          PY
      - name: Commit reviewer crosscheck into private QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_fullx/full92_release_height_feature_crosscheck_v1.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -qm 'qa(igp): full92 source feature height vs ball-flight independent codepath crosscheck'
          for n in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo FULL92_PRIVATE_FEATURE_CROSSCHECK_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 44
