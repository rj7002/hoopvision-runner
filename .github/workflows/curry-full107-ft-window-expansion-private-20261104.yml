# Allowlisted private-only SHA-original Curry FT temporal window study with adjacent source-frame evidence. Public file is an opaque runner.
name: Curry Full107 52-shot earlier-later original frames study
on:
  push:
    branches: [main]
    paths: ['.github/workflows/curry-full107-ft-window-expansion-private-20261104.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: private-curry-full107-52-shot-window-extension
  cancel-in-progress: false
jobs:
  sha-native-window-expansion:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/full107-curry-free-throw-3d-20261104
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public protection and private checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set --no-cone \
            /gamepulse/fusion/curry_ft_full107_original_3d_v1.py \
            /gamepulse/fusion/curry_ft_original_window_extension_v3.py \
            /gamepulse/fusion/qa/curry_ft_full107/curry_free_throw_original_tracking_20261104.json \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600005/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600101/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600127/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600139/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600023/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600170/
      - name: Scan original archive frames before and after each selected shot
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 -m py_compile gamepulse/fusion/curry_ft_original_window_extension_v3.py
          python3 gamepulse/fusion/curry_ft_original_window_extension_v3.py > "$RUNNER_TEMP/private-window-extension.log" 2>&1 || {
            echo "PRIVATE_WINDOW_EXPANSION_FAILED; raw source logs withheld"
            exit 1
          }
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('gamepulse/fusion/qa/curry_ft_full107/curry_original_52_extended_window_audit_v3.json')
          q=json.loads(p.read_bytes())
          s=q['summary']
          assert s['total_shots']==52 and s['makes']==51 and s['misses']==1
          assert len(q['shots'])==52
          assert s['extended_observed_positions']>=s['original_tracking_frames']
          assert s['original_tracking_frames']>=200
          assert not s['release_hand_separation_verified']
          assert not s['rim_contact_verified']
          print('CURRY_FULL107_WINDOW_EXPANSION_PRIVATE_AGGREGATE',json.dumps({
              k:s[k] for k in (
              'total_shots','original_tracking_frames',
              'available_earlier_ball_frames_within_1600ms',
              'available_later_ball_frames_within_1200ms',
              'accepted_earlier_continuity_frames',
              'accepted_later_continuity_frames',
              'shots_with_more_early_flight','shots_with_more_late_flight',
              'extended_observed_positions')},sort_keys=True))
          print('PRIVATE_SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Commit private original extended-flight source evidence only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f gamepulse/fusion/qa/curry_ft_full107/curry_original_52_extended_window_audit_v3.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -qm 'qa(private): scan SHA-original Curry FT pre and post selected flight windows'
          gh auth setup-git
          for attempt in 1 2 3; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH"
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo 'PRIVATE_COHORT_EXPANDED_SOURCE_QA_COMMITTED'; exit 0
            fi
            sleep "$attempt"
          done
          exit 29
