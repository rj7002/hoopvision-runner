# Public orchestrator; NBA original XYZ, individual players and exact QA remain in private 104.
name: Full88 parallel exact guarded-versus-unguarded source overlap
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full88-parallel-exact-marginal-private-20261102.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: full88-parallel-exact-marginal-20261102
  cancel-in-progress: false
jobs:
  partition:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/igp-full88-unguarded-p2b-marginal-20261102
      PRIVATE_SHA: 33295c01a74465b9d86e8d6c03f333b21323e57f
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate confidential GitHub bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Run exact original NBA 22-game partition privately
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          test "$(git rev-parse HEAD)" = "$PRIVATE_SHA" || { echo FULL88_PARTITION_SOURCE_HEAD_DRIFT; exit 18; }
          git sparse-checkout set gamepulse/fusion
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_full88_p2b_exact_marginal88_partition_v1.py
          dest="gamepulse/fusion/qa/igp_fullx/full88_unguarded_marginal_exact_partition_20261102_${SHARD}.json"
          python3 gamepulse/fusion/igp_full88_p2b_exact_marginal88_partition_v1.py --root . --shard "$SHARD" --out "$dest" > "$RUNNER_TEMP/private-partition.log" 2>&1 || {
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'private-partition.log').read_text(errors='replace').splitlines()
          error=next((line for line in reversed(lines) if re.match(r'^(ValueError|TypeError|KeyError|FileNotFoundError|AssertionError|AttributeError):',line)),None)
          print('FULL88_PARTITION_FAILURE_TYPE',re.sub(r'[0-9]{4,}','[ID]',error or 'UNKNOWN')[:200])
          PY
            echo FULL88_EXACT_PARTITION_SOURCE_FAILURE
            exit 21
          }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          shard=int(os.environ["SHARD"])
          q=json.loads(Path("gamepulse/fusion/qa/igp_fullx/full88_unguarded_marginal_exact_partition_20261102_"+str(shard)+".json").read_text())
          assert q["shard_index"]==shard and q["num_games"]==22
          assert q["physical_truth_certified"] is False
          assert all(x["original_source_not_mutated"] is True for x in q["games"].values())
          print("FULL88_EXACT_PARTITION_PRIVATE_SHA_QA_OK",shard,len(q["games"]))
          PY
      - name: Save original-source per-game marginal counts privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          target="gamepulse/fusion/qa/igp_fullx/full88_unguarded_marginal_exact_partition_20261102_${SHARD}.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$target"
          git diff --cached --check
          git commit -qm "qa(private): exact 22game P2B guarded/unguarded shard ${SHARD} [skip ci]"
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH" || exit 27
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo FULL88_EXACT_PARTITION_PRIVATE_COMMITTED "$SHARD"
              exit 0
            fi
            sleep "$n"
          done
          exit 28
  reduce:
    needs: [partition]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/igp-full88-unguarded-p2b-marginal-20261102
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify public bridge and exact private four-way reduction
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          git sparse-checkout set gamepulse/fusion
          export PYTHONPATH=gamepulse/fusion
          dest=gamepulse/fusion/qa/igp_fullx/full88_exact_unguarded_marginal88_partitioned_source_20261102.json
          python3 gamepulse/fusion/igp_full88_p2b_exact_marginal88_partition_v1.py --root . --reduce --out "$dest" > "$RUNNER_TEMP/partitioned-private-reduce.log" 2>&1 || {
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'partitioned-private-reduce.log').read_text(errors='replace').splitlines()
          error=next((line for line in reversed(lines) if re.match(r'^(ValueError|TypeError|KeyError|FileNotFoundError|AssertionError|AttributeError):',line)),None)
          print('FULL88_PRIVATE_REDUCER_FAILURE_TYPE',re.sub(r'[0-9]{4,}','[ID]',error or 'UNKNOWN')[:200])
          PY
            echo FULL88_PRIVATE_EXACT_PARTITION_RECONCILIATION_FAILURE
            exit 32
          }
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('gamepulse/fusion/qa/igp_fullx/full88_exact_unguarded_marginal88_partitioned_source_20261102.json').read_text())
          assert q["games"]==88 and q["split_verification"]==4
          assert q["counts"]["strict_S1_10hz"]==1467234
          assert q["counts"]["accepted_guarded_complete"]==1280963
          assert q["bycohort"]["frozen71"]["unguarded_research_complete"]==1035995
          assert q["default_engine_changed"] is False
          print("FULL88_PRIVATE_EXACT_PARTITIONED_88_RECONCILED",
                q["counts"]["unguarded_only_exact"],
                q["counts"]["unguarded_research_complete"],
                q["counts"]["guarded_only"])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dest"
          git commit -qm 'qa(private): exact 88game 10Hz source-grade P2B matched four-shard reduction [skip ci]'
          for n in 1 2 3 4 5 6; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH" || exit 37
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo FULL88_EXACT_88_SCENE_MARGINAL_SOURCE_EVIDENCE_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 38
