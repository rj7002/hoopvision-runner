# No original XYZ or individual player traces leave the private repo.
# Read only already SHA-reconciled 666-game Full107 historical clock QA receipt.
name: IGP historical Full107 666-game verified 88 clock game-ID readback
'on':
  push:
    branches: [main]
    paths: [.github/workflows/igp-2025-26-full107-clock88-readback.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-2025-26-666-clock88-qa-gameid-readback
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
  BRANCH: research/gamepulse-clock-boundary-integrity-20261025
  RELEASE: igp-2025-26-full107-native-20261105
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Read only final already-source-reconciled 666-game QA receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          mkdir -p "$RUNNER_TEMP/private-qa"
          ok=0
          for n in $(seq 1 20); do
            if gh release download "$RELEASE" --repo timeedmonds-maker/104 \
               --pattern 'historical-clock-full107-all666-88-census.json' \
               --dir "$RUNNER_TEMP/private-qa" --clobber; then
              ok=1;break
            fi
            echo "HISTORICAL_CLOCK_FINAL_READBACK_RETRY attempt=$n"
            sleep 105
          done
          test "$ok" -eq 1
          test -s "$RUNNER_TEMP/private-qa/historical-clock-full107-all666-88-census.json"
      - name: Verify exact source population and print qualifying public game IDs with coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'private-qa'
          q=json.loads((root/'historical-clock-full107-all666-88-census.json').read_text())
          assert q['schema']=='igp.historical-2025-26-full107-666game-running-clock-88-result.v1'
          assert q['status']=='SOURCE_CLOCK_PROXY_NOT_2026_27_STRICT_OFFICIAL_TEN_S1_EQUIVALENT'
          assert q['games']==666 and q['shards']==15
          c=q['native_count_reconciliation']
          assert c['source_native_frames']==19440900
          assert c['native_engine_complete_ten_ball']==9392952
          assert c['source_direct_complete_ten_ball']==5895277
          assert len(q['per_game'])==666
          target={'source_gameclock_progress_1s':93,
                  'source_time_running_15s':116,
                  'clock_sources_intersection_15s':121}
          clean={}
          for selector,expected in target.items():
            data=q['methods'][selector]
            a=data['qualifying_88_games']
            assert data['count_at_least_88_pct']==expected and len(a)==expected,(selector,len(a))
            ids=[x['game_id'] for x in a]
            assert len(set(ids))==len(ids) and all(g in q['per_game'] for g in ids)
            assert all(x['complete']*100>=x['eligible']*88 for x in a)
            clean[selector]={
              'eligible_games':data['games_eligible'],
              'games_at_least_88_pct':len(a),
              'aggregate_coverage_pct':data['aggregate_coverage_pct'],
              'qualifying_88_games':a
            }
            print('FULL107_HISTORICAL_666_88_QUALIFYING_PUBLIC_GAME_IDS',selector,
              json.dumps([{'game_id':x['game_id'],'coverage_pct':x['coverage_pct'],
                'eligible':x['eligible'],'complete':x['complete']} for x in a],separators=(',',':')),flush=True)
          receipt={'schema':'igp.historical-666-full107-running-clock-88-gameid-census.v1',
            'source_status':q['status'],'games':666,
            'source_sha256':q['source_sha256'],
            'source_native_frames':c['source_native_frames'],
            'full107_complete':c['native_engine_complete_ten_ball'],
            'methods':clean,
            'historical_source_provisional_lineups':True,
            'strict_current_2026_27_10hz_s1_equivalence_certified':False}
          (root/'full107-666-running-clock-88-qualified-ids.json').write_text(
            json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('FULL107_HISTORICAL_666_88_ALL_GAMEIDS_RECONCILED',
            json.dumps({k:len(v['qualifying_88_games']) for k,v in clean.items()}),flush=True)
          PY
      - name: Commit only qualifying game IDs and coverage QA to protected canonical branch via git
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion/qa/historical
          cd "$RUNNER_TEMP/private"
          dest="gamepulse/fusion/qa/historical/full107_2025_26_666_running_clock_88_qualifying_games.json"
          mkdir -p "$(dirname "$dest")"
          cp "$RUNNER_TEMP/private-qa/full107-666-running-clock-88-qualified-ids.json" "$dest"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dest"
          git diff --cached --check
          git commit -qm "qa(igp): source-verified 666 historical >=88 clock game IDs with provenance"
          for n in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo HISTORICAL_666_88_SOURCE_VERIFIED_GAME_ID_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 44
