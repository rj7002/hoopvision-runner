# Opaque public shell for immutable NBA Advanced FULL88 team-POSS acceptance.
# All original NBA provider JSON, PBP, receipt rows and SHA values stay private in 104.
name: IGP FULL88 176-team-game official POSS release gate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full88-176team-official-poss-private-20261102.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-full88-176game-poss-20261102
  cancel-in-progress: false
jobs:
  verify-176-team-games:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: analysis/igp-full88-two-game-original-source-recheck-20261102
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify private source boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          gh auth setup-git
      - name: SHA-backed private cohort checkout and source-free checks
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          git sparse-checkout set --no-cone \
            /gamepulse/fusion/igp_full88_default_engine_v1.py \
            /gamepulse/fusion/igp_full88_team_offrtg_accepted_v1.py \
            /gamepulse/fusion/igp_full88_new7_official_team_poss_probe_v1.py \
            /gamepulse/fusion/igp81_default_team_offrtg.py \
            /gamepulse/fusion/qa/igp_fullx/shot_event_multiview_full88_v1.json \
            /gamepulse/fusion/qa/igp81_nba_team_offrtg_reporting_default_v1.json \
            /gamepulse/fusion/qa/igp_fullx/new7_nba_team_advanced_poss_probe_20261102/ \
            /gamepulse/fusion/official_pbp_timing/games/0022600147.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600148.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600149.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600150.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600151.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600152.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600153.json
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_full88_team_offrtg_accepted_v1.py
          python3 gamepulse/fusion/igp_full88_team_offrtg_accepted_v1.py --self-test
      - name: Independently validate 176 rows from each original NBA response
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY' > "$RUNNER_TEMP/private-176-qa" 2>&1
          import json,hashlib
          from pathlib import Path
          from igp_full88_team_offrtg_accepted_v1 import query,load_full88,EXPECTED_FULL
          rows=load_full88(".")
          assert len(rows)==176 and len(set((r['game_id'],r['team']) for r in rows))==176
          assert len({r['game_id'] for r in rows})==88
          v=query(".",include_rows=True)
          assert (v['games'],v['team_games'],v['team_possession_denominator'],v['team_offensive_points'])==(88,176,17914,20036)
          assert v['nba_style_team_OffRtg']==111.8
          assert v['physical_custody_possessions_independently_certified']==0
          assert v['does_not_certify_player_lineup_possessions'] is True
          q=query(".",game_id="0022600153",team="HOU")
          assert q['team_possession_denominator']==94 and q['team_offensive_points']==119
          assert q['nba_style_team_OffRtg']==126.6
          new=[r for r in rows if r['game_id'] in {f'0022600{i:03d}' for i in range(147,154)}]
          assert len(new)==14 and sum(r['nba_advanced_team_poss'] for r in new)==1406
          assert sum(r['official_points'] for r in new)==1572
          assert all(r['statistical_possession_grade']=='NBA_PROVIDER_PUBLISHED_TEAM_POSS' for r in rows)
          assert all(r['physical_control_boundaries_certified'] is False for r in rows)
          p=Path('gamepulse/fusion/qa/igp_fullx/full88_176_team_poss_release_gate_20261102.json')
          data={'schema':'igp.full88.176-team-statistical-offrtg-release-gate.v1',
                'decision':'SOURCE_VALIDATED_176_ROW_STATISTICAL_QUERY_CANDIDATE',
                'source_index_sha':'b3e3d1f52e0727fd549ef59fe4fbd78b012f8484',
                'games':v['games'],'team_games':v['team_games'],
                'official_points':v['team_offensive_points'],
                'published_nba_poss':v['team_possession_denominator'],
                'pooled_offrtg':v['nba_style_team_OffRtg'],
                'new7_team_games':len(new),
                'new7_official_points':sum(r['official_points'] for r in new),
                'new7_published_poss':sum(r['nba_advanced_team_poss'] for r in new),
                'old81_tracking_unchanged':True,
                'physical_boundaries_certified':0,
                'default_facade_not_modified':True,
                'team_game_rows':rows}
          b=(json.dumps(data,sort_keys=True,indent=2,allow_nan=False)+'\n').encode()
          p.parent.mkdir(parents=True,exist_ok=True)
          if p.exists():assert p.read_bytes()==b,'SOURCE_QA_DIFFERENT_REFUSE_OVERWRITE'
          else:p.write_bytes(b)
          print('FULL88_176_TEAM_ORIGINAL_ADVANCED_POSS_AND_SCORES_VERIFIED')
          PY
          test -s "$RUNNER_TEMP/private-176-qa"
          echo FULL88_176_OFFICIAL_NBA_TEAM_POSS_PASS
      - name: Publish private acceptance evidence without altering default
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f gamepulse/fusion/qa/igp_fullx/full88_176_team_poss_release_gate_20261102.json
          git diff --cached --check
          if git diff --cached --quiet; then echo FULL88_TEAM_QA_ALREADY_PRIVATE; exit 0; fi
          git commit -qm 'qa(igp): accept full88 source-only official 176 teamgame POSS readback'
          for retry in 1 2 3 4 5; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH"
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo FULL88_TEAM_SOURCE_QA_COMMITTED_PRIVATELY
              exit 0
            fi
            sleep "$retry"
          done
          echo FULL88_PRIVATE_TEAM_QA_PUSH_FAILED
          exit 24

  sourcegrade-v2-routing-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: release/igp-full88-advanced176-routing-candidate-20261102
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Enforce protected original NBA private checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          gh auth setup-git
      - name: Source-free dispatch regressions and original PBP/Advanced SHA readbacks
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          git sparse-checkout set --no-cone \
            /gamepulse/fusion/igp_full88_default_engine_v1.py \
            /gamepulse/fusion/igp_full88_published_team_poss176_routing_candidate_v2.py \
            /gamepulse/fusion/tests/test_igp_full88_published_team_poss176_routing_v2.py \
            /gamepulse/fusion/igp_full88_team_offrtg_accepted_v1.py \
            /gamepulse/fusion/igp_full88_new7_official_team_poss_probe_v1.py \
            /gamepulse/fusion/igp81_default_team_offrtg.py \
            /gamepulse/fusion/qa/igp_fullx/shot_event_multiview_full88_v1.json \
            /gamepulse/fusion/qa/igp81_nba_team_offrtg_reporting_default_v1.json \
            /gamepulse/fusion/qa/igp_fullx/new7_nba_team_advanced_poss_probe_20261102/ \
            /gamepulse/fusion/official_pbp_timing/games/0022600147.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600148.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600149.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600150.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600151.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600152.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600153.json \
            /gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/shot_event_multiview_full88_v1/shots/0022600153.jsonl.gz
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_full88_published_team_poss176_routing_candidate_v2.py
          python3 -m unittest discover -s gamepulse/fusion/tests -p 'test_igp_full88_published_team_poss176_routing_v2.py' -v
          python3 - <<'PY' > "$RUNNER_TEMP/private-v2-smoke-log" 2>&1
          from igp_full88_published_team_poss176_routing_candidate_v2 import query
          d=query(".",game_id="0022600153",team="HOU",kind="shots",limit=1,
                  include_game_grades=False)
          assert d['schema'].endswith('.v2')
          assert d['default'] is False
          assert d['promoted_versionless_default'] is False
          assert d['legacy_81_statistical_output_suppressed_because_unfiltered']
          assert d['frozen81_team_statistical_and_tracking'] is None
          assert d['accepted_guarded_P2B_10hz_games']==81
          assert d['new7_original_SDK_games_guarded_P2B_unadmitted']==7
          assert d['physical_possessions_certified']==0
          assert d['record_type']=='shots' and d['sha256_verified']
          assert len(d['records'])==1 and d['total_source_records']==175
          t=d['full88_official_published_team_game_reporting']
          assert t['games']==1 and t['team_games']==1
          assert t['team_possession_denominator']==94
          assert t['team_offensive_points']==119
          assert t['nba_style_team_OffRtg']==126.6
          print('FULL88_V2_ORIGINAL_SOURCE_AND_176_STATS_QUERY_PASSED')
          PY
          test -s "$RUNNER_TEMP/private-v2-smoke-log"
          echo FULL88_V2_ORIGINAL_SOURCE_STATISTICAL_ROUTING_PASSED
