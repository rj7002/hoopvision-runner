# Public runner executes private SHA-pinned source-free tests only.
# Security-reviewed allowlist in tools/public_content_guard.py.
# Never print / upload original NBA player/ball positions or original source files.
name: IGP Full139 ball screen source-free and frozen release gate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full139-ball-screen-sourcefree-20261109.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-full139-ball-screen-sourcefree-20261109
  cancel-in-progress: false
jobs:
  private-snapshot-read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Review public/private source boundary
        run: python3 tools/public_content_guard.py
      - name: Run PR1069 research adversarial tests and real Full139 SHA metadata gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse \
            -b research/igp-ball-screen-evidence-v1-20261109 \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          test "$(git rev-parse HEAD)" = "edfb76e739a4bc9f0a59e7b6f6e801c839f53253"
          git sparse-checkout set --no-cone \
            /gamepulse/fusion/analysis/igp_ball_screen_research_v1.py \
            /gamepulse/fusion/analysis/igp_four_actor_screen_motifs_v2.py \
            /gamepulse/fusion/analysis/test_igp_four_actor_screen_motifs_v2.py \
            /gamepulse/fusion/analysis/igp_screen_event_triad_v3.py \
            /gamepulse/fusion/analysis/test_igp_screen_event_triad_v3.py \
            gamepulse/fusion/analysis/igp_joint_defender_assignment_v4.py \
            gamepulse/fusion/analysis/test_igp_joint_defender_assignment_v4.py \
            /gamepulse/fusion/analysis/igp_joint_defender_assignment_v4.py \
            /gamepulse/fusion/analysis/test_igp_joint_defender_assignment_v4.py \
            /gamepulse/fusion/analysis/test_igp_ball_screen_research_v1.py \
            /gamepulse/fusion/analysis/igp_full139_ball_screen_validation_v1.py \
            /gamepulse/fusion/analysis/test_igp_full139_ball_screen_validation_v1.py \
            /gamepulse/fusion/analysis/igp_full139_ball_screen_source_pilot_v1.py \
            /gamepulse/fusion/analysis/igp_0194_screen_human_review_queue_v1.py \
            /gamepulse/fusion/igp_full139_sourcegraded_query_v1.py \
            /gamepulse/fusion/qa/igp_fullx/shot_event_multiview_FULL139_a428c641034d_v2.json \
            /gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/post56_additive_20261028/index.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600138.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600187.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600188.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600194.json \
            /gamepulse/fusion/official_pbp_timing/original_nba_20261029/0022600138/boxscore.json \
            /gamepulse/fusion/official_pbp_timing/original_nba_20261029/0022600187/boxscore.json \
            /gamepulse/fusion/official_pbp_timing/original_nba_20261029/0022600188/boxscore.json \
            /gamepulse/fusion/official_pbp_timing/original_nba_20261029/0022600194/boxscore.json \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600138/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600187/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600188/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600194/
          export PYTHONPATH=gamepulse/fusion/analysis:gamepulse/fusion
          python3 -B -m py_compile \
            gamepulse/fusion/analysis/igp_ball_screen_research_v1.py \
            gamepulse/fusion/analysis/igp_four_actor_screen_motifs_v2.py \
            gamepulse/fusion/analysis/test_igp_four_actor_screen_motifs_v2.py \
            gamepulse/fusion/analysis/igp_screen_event_triad_v3.py \
            gamepulse/fusion/analysis/test_igp_screen_event_triad_v3.py \
            gamepulse/fusion/analysis/test_igp_ball_screen_research_v1.py \
            gamepulse/fusion/analysis/igp_full139_ball_screen_validation_v1.py \
            gamepulse/fusion/analysis/test_igp_full139_ball_screen_validation_v1.py \
            gamepulse/fusion/analysis/igp_full139_ball_screen_source_pilot_v1.py \
            gamepulse/fusion/analysis/igp_0194_screen_human_review_queue_v1.py \
            gamepulse/fusion/igp_full139_sourcegraded_query_v1.py
          python3 -B -m unittest -v \
            test_igp_ball_screen_research_v1 \
            test_igp_four_actor_screen_motifs_v2 \
            test_igp_screen_event_triad_v3 \
            test_igp_joint_defender_assignment_v4 \
            test_igp_full139_ball_screen_validation_v1
          python3 -B - <<'PY'
          from igp_full139_ball_screen_validation_v1 import source_preflight
          result=source_preflight('.')
          assert result['full139_games']==139
          assert result['original_native_eligible_games']==138
          assert result['excluded_missing_native']==['0022600189']
          assert result['official_actions']==84192
          assert result['official_fga']==24526
          assert result['screen_accuracy'] is None and not result['promotion_allowed']
          print('FULL139_SHA_PINNED_SOURCE_PREFLIGHT_PASS',result['full139_games'],
                result['original_native_eligible_games'],result['official_actions'])
          PY
          echo FULL139_BALL_SCREEN_SOURCE_FREE_AND_SHA_SOURCE_GATE_PASS
          for gid in 0022600138 0022600187 0022600188 0022600194; do
            python3 -B gamepulse/fusion/analysis/igp_full139_ball_screen_source_pilot_v1.py --root . --game-id "$gid"
          done
          echo FULL139_SOURCE_NATIVE_FOUR_GAME_PILOT_COMPLETE
          python3 -B gamepulse/fusion/analysis/igp_0194_screen_human_review_queue_v1.py --root . --out "$RUNNER_TEMP/0194_review_queue.json"
          python3 - <<'PY'
          import os,json,hashlib,pathlib
          f=pathlib.Path(os.environ["RUNNER_TEMP"])/"0194_review_queue.json"
          data=f.read_bytes(); r=json.loads(data)
          assert r["game_id"]=="0022600194" and r["review_case_count"]==len(r["cases"])
          assert r["predicted_screen_proposal_count"]>0 and r["original_xyz_exported"] is False
          print("PRIVATE_0194_REVIEW_QUEUE_READ_ONLY_VALIDATED",r["review_case_count"],hashlib.sha256(data).hexdigest())
          PY
