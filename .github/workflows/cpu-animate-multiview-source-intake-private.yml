# CPU-only ingest: original NBA 616 newly missing independent-looking source views.
# Exact replay angle discovery uses the established 12-feed taxonomy;
# existing Broadcast / Other Broadcast / In Arena / Play by Play are reused.
# Never publish signed URLs, licensed frames, native NBA tracking or private assets.
name: CPU Animate missing-angle private CPU intake
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cpu-animate-multiview-source-intake-private.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-animate-private-multiview-ingest-616
  cancel-in-progress: false

jobs:
  ingest-new-source-view-families:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      CUDA_VISIBLE_DEVICES: '-1'
      HIP_VISIBLE_DEVICES: '-1'
      ROCR_VISIBLE_DEVICES: '-1'
      GPU_DEVICE_ORDINAL: '-1'
      OPENCL_VENDOR_PATH: '/nonexistent'
      OMP_NUM_THREADS: '4'
      CPU_ANIMATE_ANGLE_LIMIT: '4'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public bridge content and CPU-environment guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from tools.public_content_guard import scan
          issues=scan(['.github/workflows/cpu-animate-multiview-source-intake-private.yml'])
          if issues:
              print("CPU_ANIMATE_BRIDGE_POLICY_REJECTED")
              raise SystemExit(3)
          print("CPU_ANIMATE_PUBLIC_BRIDGE_GUARD_PASS")
          PY
          test "$(uname -s)" = Linux
          test ! -e /dev/nvidia0
          test ! -e /dev/nvidiactl
          test ! -e /dev/kfd
          echo CPU_ONLY_RUNNER_NO_GPU_DEVICE_NODES
      - name: Pull approved private CPU intake and test historical angle taxonomy
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo PRIVATE_RELEASE_AUTH_MISSING; exit 3; }
          if ! gh api repos/timeedmonds-maker/104 --jq .private | grep -qx true; then
              echo PRIVATE_RELEASE_AUTH_REJECTED
              exit 3
          fi
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          if ! python3 -c 'import numpy,cv2' 2>/dev/null; then
              python3 -m pip install -q --disable-pip-version-check numpy opencv-python-headless
          fi
          ROOT="$(mktemp -d)"
          chmod 700 "$ROOT"
          trap 'rm -rf "$ROOT"' EXIT
          mkdir -p "$ROOT/cpu_animate" "$ROOT/tests"
          BRANCH='cpu-animate%2Fm0-m1-validation-core-20261107'
          for spec in \
              cpu_animate/angle_registry.py \
              cpu_animate/camera_feed_taxonomy.py \
              cpu_animate/multi_angle_cpu_ingest.py \
              tests/test_cpu_animate_angle_taxonomy.py; do
            gh api "repos/timeedmonds-maker/104/contents/$spec?ref=$BRANCH" \
              --jq .content | base64 -d > "$ROOT/$spec"
          done
          mkdir -p "$ROOT/historical"
          # These two original historical source artifacts are SHA-pinned in
          # the private engine, preventing re-discovery or guessed labels.
          gh api 'repos/timeedmonds-maker/44/contents/freeze_spin/adams_jazz_game_camera_registry_v6.json?ref=codex%2Fmulti-angle-freeze-spin-poc' \
            --jq .content | base64 -d > "$ROOT/historical/camera_registry_v6.json"
          gh api 'repos/timeedmonds-maker/44/contents/freeze_spin/frame_c_camera_chooser/options.json?ref=codex%2Fmulti-angle-freeze-spin-poc' \
            --jq .content | base64 -d > "$ROOT/historical/options.json"
          export CPU_ANIMATE_HISTORICAL_REGISTRY_JSON="$ROOT/historical/camera_registry_v6.json"
          export CPU_ANIMATE_HISTORICAL_CHOOSER_JSON="$ROOT/historical/options.json"
          cd "$ROOT"
          python3 -m unittest discover -s tests -p test_cpu_animate_angle_taxonomy.py -v
          python3 -m py_compile cpu_animate/angle_registry.py cpu_animate/camera_feed_taxonomy.py cpu_animate/multi_angle_cpu_ingest.py
          python3 -m cpu_animate.multi_angle_cpu_ingest
      - name: Record privacy-preserving completion
        run: |
          echo 'Only aggregate camera counts are written to public logs.'
          echo 'All authentic NBA video, exact PTS arrays, SHA manifests and provider media metadata remain private.'
          echo 'Independent optical centres and video-to-NBA XYZ time alignment require separate certification.'
