name: Full92 Houston Rockets release profiles (private)
on:
  push:
    paths:
      - ".github/workflows/full92-rockets-release-profile.yml"
  workflow_dispatch:
jobs:
  private-rockets:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/full92-all-event-rebound-tracking-20261103
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Protect private NBA source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Compute Rockets same-shot release height/jump and verify original SHA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_full92_rockets_release_components_v1.py
          python3 gamepulse/fusion/igp_full92_rockets_release_components_v1.py > "$RUNNER_TEMP/rockets_private.log" 2>&1
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("gamepulse/fusion/qa/igp_fullx/full92_rockets_release_components_v1.json").read_bytes())
          assert d['games_in_cohort']==92
          assert d['team_name']=='Houston Rockets'
          assert len(d['players'])>=6
          print("FULL92_ROCKETS_AGGREGATE_PASS",json.dumps({
           "count":len(d['players']),"named":[x["player"] for x in d["players"]] }))
          PY
      - name: Commit verified Rockets aggregate only into private repo
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_fullx/full92_rockets_release_components_v1.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -qm "qa(igp): full92 Rockets-only verified original shot release aggregates"
          for n in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo FULL92_ROCKETS_PRIVATE_QA_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 44
