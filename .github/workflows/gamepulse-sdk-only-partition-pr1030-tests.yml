name: Game Pulse SDK-only source partition synthetic QA (PR1030)
# Free public CPU runner; private source code is ephemeral and never committed or uploaded.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-sdk-only-partition-pr1030-tests.yml'
      - 'tools/public_content_guard.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-source-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce public/private boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || { echo 'PRIVATE_READ_TOKEN_UNAVAILABLE'; exit 3; }
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Fetch only pinned private source blobs into ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/sdk-only-pr1030"
          mkdir -p "$work"
          fetch_pinned() {
            local sha="$1" name="$2"
            gh api "repos/timeedmonds-maker/104/git/blobs/$sha" --jq .content |
              base64 --decode > "$work/$name"
            test -s "$work/$name"
            test "$(git hash-object "$work/$name")" = "$sha" ||
              { echo 'PINNED_PRIVATE_BLOB_MISMATCH'; exit 4; }
          }
          fetch_pinned 8afd98a4f8d7c4e2a9fded8d62452814ca63d872 sdk_only_native_label_partition_2026.py
          fetch_pinned 47b7dfe7799cdc50390c90f4fe9ade7e7e01091f test_sdk_only_native_label_partition_2026.py
          fetch_pinned 9436ed5d7badc87645175182a261b411ed7c5b9c gamepulse_ball_dynamics.py
          fetch_pinned 52968cc4c1faa6389a9f3cda6b44ab0aa4f72245 gamepulse_ball_control.py
          echo 'PRIVATE_SOURCE_BLOBS_SHA_VERIFIED'
      - name: Execute synthetic provenance and negative controls
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sdk-only-pr1030"
          python3 -m py_compile sdk_only_native_label_partition_2026.py
          python3 -m unittest -v test_sdk_only_native_label_partition_2026
          echo 'PR1030_SYNTHETIC_SOURCE_QA_PASS_NOT_REAL_SDK_ACCEPTANCE'

      - name: Validate 12 private release-metadata pins against authenticated GitHub API (not SDK byte QA)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/sdk-only-pr1030"
          for n in $(seq 119 130); do
            game=$(printf '002260%04d' "$n")
            gh api "repos/timeedmonds-maker/104/contents/gamepulse/fusion/trusted_sdk_release_manifests_2026/${game}.json?ref=f6e422fa6c5ce2e01959826fbcaaaf678b73ee00" --jq .content |
              base64 --decode > "$work/${game}.json"
            gh api "repos/timeedmonds-maker/104/releases/tags/gamepulse-sdk-${game}" > "$work/${game}.release.json"
          done
          cd "$work"
          python3 - <<'PY'
          import json
          from pathlib import Path
          from sdk_only_native_label_partition_2026 import (
              PINNED_GAME_RELEASE_MANIFEST_SHA256, PARTS, verify_release_manifest,
          )
          assert len(PINNED_GAME_RELEASE_MANIFEST_SHA256) == 12
          for n in range(119, 131):
              game = f"002260{n:04d}"
              raw = Path(f"{game}.json").read_bytes()
              parts = verify_release_manifest(
                  game, raw, PINNED_GAME_RELEASE_MANIFEST_SHA256[game])
              manifest = json.loads(raw)
              release = json.loads(Path(f"{game}.release.json").read_text())
              meta = manifest["release_metadata_provenance"]
              assert meta["authority"] == "AUTHENTICATED_PRIVATE_GITHUB_RELEASE_API"
              assert release["id"] == meta["release_id"]
              assert release["tag_name"] == manifest["release_tag"]
              assets = {a["name"]: a for a in release["assets"]}
              assert len(parts) == len(PARTS) == 13
              for name in PARTS:
                  assert assets[name]["id"] == meta["sdk_part_asset_ids"][name]
                  assert assets[name]["digest"] == "sha256:" + parts[name]
              complete = assets["sdk-COMPLETE.json"]
              assert complete["id"] == meta["sdk_complete_asset_id"]
              assert complete["digest"] == (
                  "sha256:" + meta["sdk_complete_reported_sha256"])
          print("PRIVATE_RELEASE_METADATA_PIN_PARITY_12_OF_12")
          print("NOT_DOWNLOADED_ARCHIVE_BYTE_QA_NOT_GAMEPLAY_CERTIFICATION")
          PY


      - name: Verify downloaded original SDK bytes and native labels for all 12 games (source stays ephemeral)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/sdk-only-pr1030"
          cd "$work"
          for n in $(seq 119 130); do
            game=$(printf '002260%04d' "$n")
            mkdir -p "$work/sdk-$game"
            gh release download "gamepulse-sdk-$game" -R timeedmonds-maker/104 \
              -D "$work/sdk-$game" \
              -p 'sdk-part-*.tar.gz' -p 'sdk-COMPLETE.json'
            GAME_ID="$game" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from sdk_only_native_label_partition_2026 import (
              PINNED_GAME_RELEASE_MANIFEST_SHA256, PARTS,
              verify_release_manifest, verify_archives,
          )
          from gamepulse_ball_dynamics import native_touches
          game = os.environ["GAME_ID"]
          raw = Path(f"{game}.json").read_bytes()
          manifest = json.loads(raw)
          expected = verify_release_manifest(
              game, raw, PINNED_GAME_RELEASE_MANIFEST_SHA256[game])
          sdk = Path(f"sdk-{game}")
          actual = verify_archives(sdk, expected)
          assert len(actual) == 13
          complete_bytes = (sdk / "sdk-COMPLETE.json").read_bytes()
          assert hashlib.sha256(complete_bytes).hexdigest() == (
              manifest["release_metadata_provenance"]["sdk_complete_reported_sha256"])
          complete = json.loads(complete_bytes)
          assert isinstance(complete, dict) and str(complete.get("game_id")) == game
          native, diagnostics, spans = native_touches(
              [sdk / name for name in PARTS], with_frame_diagnostics=True)
          assert native and spans, "NO_NATIVE_TOUCH_OR_FRAME_EVIDENCE"
          print("SDK_ORIGINAL_BYTE_SHA_13_OF_13", game)
          print("SDK_COMPLETE_BYTE_SHA_AND_GAME_ID_VERIFIED", game)
          print("SDK_NATIVE_LABEL_AND_FRAME_SPAN_COUNTS", game, len(native), len(spans))
          print("NOT_LIVE_GAMEPLAY_NOT_PHYSICAL_POSSESSION_CERTIFICATION")
          PY
            gh api "repos/timeedmonds-maker/104/contents/gamepulse/fusion/index/games/$game.json?ref=main" --jq .content |
              base64 --decode > "$work/view-$game.json"
            python3 sdk_only_native_label_partition_2026.py \
              --game "$game" \
              --sdk-dir "$work/sdk-$game" \
              --expected-sdk-sha-json "$work/$game.json" \
              --view "$work/view-$game.json" \
              --out "$work/source-only-$game.json"
            GAME_ID="$game" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          game = os.environ["GAME_ID"]
          doc = json.loads(Path(f"source-only-{game}.json").read_text())
          assert doc["game_id"] == game
          assert doc["native_source_unique_touch_labels"] > 0
          assert doc["native_labels_with_frame_observations"] > 0
          assert doc["native_source_unique_touch_labels"] == len(doc["touches"])
          assert doc["physical_possessions_certified"] == 0
          assert doc["nba_pbp_action_tracking_utc_joins_certified"] == 0
          assert all(t["nba_action_number"] is None and
                     t["nba_team_possession_run"] is None and
                     t["physical_possession_certified"] is False
                     for t in doc["touches"])
          print("SDK_ONLY_SOURCE_PARTITION_RESEARCH_QA_PASS", game,
                doc["native_source_unique_touch_labels"],
                doc["native_labels_with_frame_observations"])
          PY
            rm -rf -- "$work/sdk-$game"
          done
          echo 'ALL_12_ORIGINAL_SDK_RELEASES_BYTE_SHA_AND_NATIVE_LABELS_VERIFIED'
          echo 'ALL_12_SOURCE_ONLY_PARTITIONS_BUILT_RESEARCH_ONLY_NOT_PUBLISHED'
