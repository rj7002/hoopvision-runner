name: IGP FULL88 default promotion private source acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full88-default-promotion-private-20261101.yml', 'tools/public_content_guard.py']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  full88-default-private-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: release/igp-full88-sourcegraded-default-20261101
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify safe opaque bridge
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Test real private FULL88 canonical default without public source disclosure
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          git sparse-checkout set --no-cone \
            /gamepulse/fusion/igp_full88_default_engine_v1.py \
            /gamepulse/fusion/igp_default_engine.py \
            /gamepulse/fusion/igp81_default_team_offrtg.py \
            /gamepulse/fusion/igp_native_scene_season_68_benchmark_v1.py \
            /gamepulse/fusion/igp_native_scene_model_v2.py \
            /gamepulse/fusion/igp_tracking_model_a_holdout_2026.py \
            /gamepulse/fusion/igp_tracking_model_b_holdout_2026.py \
            /gamepulse/fusion/igp_tracking_model_c0_endpoint_velocity_bridge_2026.py \
            /gamepulse/fusion/tests/test_igp_full88_default_engine_v1.py \
            /gamepulse/fusion/qa/igp_fullx/shot_event_multiview_full88_v1.json \
            /gamepulse/fusion/qa/igp81_nba_team_offrtg_reporting_default_v1.json \
            /gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/shot_event_multiview_full88_v1/events/0022600153.jsonl.gz \
            /gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/shot_event_multiview_full88_v1/shots/0022600153.jsonl.gz \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600153
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_full88_default_engine_v1.py gamepulse/fusion/igp_default_engine.py
          python3 -m unittest discover -s gamepulse/fusion/tests -p test_igp_full88_default_engine_v1.py -v
          python3 - <<'PY'
          from pathlib import Path
          from igp_full88_default_engine_v1 import _load_index, _cohorts, _read_rows
          root=Path(".")
          idx=_load_index(root)
          baseline, new=_cohorts(root,idx)
          assert len(baseline)==81 and len(new)==7
          row=idx["games"]["0022600153"]
          assert _read_rows(root,"0022600153",row,"shots",0,1)["sha256_verified"]
          assert _read_rows(root,"0022600153",row,"events",0,1)["sha256_verified"]
          print("IGP_FULL88_PRIVATE_SOURCE_DEFAULT_ACCEPTED",len(baseline),len(new),
                idx["counts"]["official_actions"],idx["counts"]["official_fga"])
          PY
          echo IGP_FULL88_DEFAULT_PRIVATE_RELEASE_GATE_PASSED
