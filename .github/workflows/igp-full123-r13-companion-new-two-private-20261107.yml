name: IGP Full123 two-game original NBA PBP and licensed companion SDK
on:
  push:
    branches: [feature/igp-full123-r13-public-cpu-20261107]
    paths: ['.github/workflows/igp-full123-r13-companion-new-two-private-20261107.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-full123-two-new-original-companion-20261107
  cancel-in-progress: false
jobs:
  capture-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        game: ['0022600187','0022600188']
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      GAME: ${{ matrix.game }}
      PRIVATE_BRANCH: feature/igp-full123-r13-touch-integration-20261107
      IGP_SDK_SOURCE_VARIANT: events
      IGP_SDK_INIT_TIMEOUT_MS: '22000'
      IGP_CAPTURE_ZERO_SHOT_FULL_EVENTS: 'true'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate public/private source boundary and retrieve exact official NBA JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          work="$RUNNER_TEMP/companion-$GAME"
          mkdir -p "$work/original" "$work/capture"
          python3 - <<'PY'
          import datetime as dt,json,os,time,urllib.request
          from pathlib import Path
          gid=os.environ['GAME']
          folder=Path(os.environ['RUNNER_TEMP'])/('companion-'+gid)/'original'
          for part in ('boxscore','playbyplay'):
            candidates=(
              f'https://cdn.nba.com/static/json/liveData/{part}/{part}_{gid}.json',
              f'https://api.nba.com/statscapture/games/{gid}/{part}?Format=json',
            )
            found=False
            for url in candidates:
              for attempt in range(3):
                try:
                  req=urllib.request.Request(url,headers={'Accept':'application/json','Referer':'https://www.nba.com/','User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=30) as response:
                    raw=response.read(3_000_001)
                  assert 200<len(raw)<=3_000_000
                  obj=json.loads(raw)
                  assert str(obj['game']['gameId'])==gid
                  assert part!='playbyplay' or isinstance(obj['game'].get('actions'),list)
                  (folder/(part+'.json')).write_bytes(raw)
                  found=True
                  print('NBA_OFFICIAL_SOURCE_ADMITTED',part,'cdn' if 'cdn.nba.com' in url else 'statscapture')
                  break
                except Exception:
                  time.sleep(attempt+1)
              if found:break
            assert found,'OFFICIAL_NBA_'+part.upper()+'_UNAVAILABLE_BOTH_OFFICIAL_ENDPOINTS'
          pbp=json.loads((folder/'playbyplay.json').read_bytes())['game']
          box=json.loads((folder/'boxscore.json').read_bytes())['game']
          stamp=box.get('gameTimeUTC') or pbp.get('gameTimeUTC')
          if not stamp:
            stamps=[a.get('timeActual') for a in pbp.get('actions',[]) if a.get('timeActual') and a.get('period')==1]
            assert stamps,'NO_FIRST_PERIOD_ORIGINAL_UTC'
            stamp=min(stamps)
          parsed=dt.datetime.fromisoformat(stamp.replace('Z','+00:00'))
          assert parsed.tzinfo is not None
          (folder/'tipoff.txt').write_text(parsed.isoformat().replace('+00:00','Z'))
          print('FULL123_ORIGINAL_NBA_BOX_PBP_ADMITTED',gid,len(pbp.get('actions',[])))
          PY
      - name: Initialize licensed SDK for game-specific original companion events
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/companion-$GAME"
          export NBA_GAME_ID="$GAME"
          export NBA_TIPOFF_UTC="$(cat "$work/original/tipoff.txt")"
          export IGP_PRIVATE_CAPTURE_DIR="$work/capture"
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          (cd tools/licensed_feed && npm install --ignore-scripts --no-audit --no-fund --silent)
          node tools/licensed_feed/companion_original_sdk_probe.mjs > "$work/licensed-sdk.private.log" 2>&1
          GAME="$GAME" WORK="$work" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          folder=Path(os.environ['WORK'])/'capture'
          receipt=json.loads((folder/'companion_probe_receipt.json').read_bytes())
          assert receipt['game_id']==os.environ['GAME']
          assert receipt['authentication_bypass_attempted'] is False
          assert receipt['app_program_variant']=='events'
          assert receipt['status']=='FULL_EVENT_RESPONSE_OBSERVED',receipt['status']
          raw=(folder/'companion_original_sdk_response.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==receipt['original_body_sha256']
          events=json.loads(raw)
          if isinstance(events,dict):events=events['events']
          clock=[e for e in events if e.get('event')=='Time#show' and isinstance(e.get('timestamp'),int)]
          live=sum((e.get('metadata') or {}).get('gameClockRunning') is True for e in clock)
          assert len(clock)>=100 and live>=30,(len(clock),live)
          print('FULL123_ORIGINAL_COMPANION_RUNNING_CLOCK_AVAILABLE',os.environ['GAME'],len(clock),live)
          PY
      - name: Retain exact original NBA and SDK response bytes in private GitHub only
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/companion-$GAME"
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$work/private"
          cd "$work/private"
          git sparse-checkout set --no-cone \
            '/gamepulse/fusion/*.py' \
            '/gamepulse/fusion/qa/r13_full123_new_two_official_20261107/*' \
            '/gamepulse/fusion/qa/r13_full123_original_companion_20261107/*' \
            '/gamepulse/fusion/materialized/igp_all_original_xyz/*/index.json' \
            '/gamepulse/fusion/qa/r13_full123_original_labels_20261107/*.receipt.json'
          pbp="gamepulse/fusion/qa/r13_full123_new_two_official_20261107/$GAME"
          companion="gamepulse/fusion/qa/r13_full123_original_companion_20261107/$GAME"
          mkdir -p "$pbp" "$companion"
          cp "$work/original/playbyplay.json" "$pbp/playbyplay.json"
          cp "$work/original/boxscore.json" "$pbp/boxscore.json"
          cp "$work/capture/companion_original_sdk_response.json" "$companion/sdk_observed_original.json"
          cp "$work/capture/companion_probe_receipt.json" "$companion/sdk_original_receipt.json"
          export PYTHONPATH="$PWD:$PWD/gamepulse/fusion"
          python3 gamepulse/fusion/igp_full123_new_two_official_companion_accept_v1.py --root . --game "$GAME"
          git config user.name 'IGP authorized original SDK'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f "$pbp" "$companion"
          git diff --cached --check
          git commit -q -m "data(private): Full123 NBA game $GAME original PBP box and authorized SDK companion [skip ci]"
          for attempt in $(seq 1 14); do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH"
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then echo FULL123_ORIGINAL_COMPANION_SAVED_PRIVATE; exit 0; fi
            sleep "$attempt"
          done
          exit 39
  accept-new-two:
    needs: capture-original
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: feature/igp-full123-r13-touch-integration-20261107
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: SHA-verify original source admission of both new games
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          git sparse-checkout set --no-cone \
            '/gamepulse/fusion/*.py' \
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/index.json' \
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/post56_additive_20261028/index.json' \
            '/gamepulse/fusion/qa/igp_progress_20261030/igp_full121_default_source_release_v1.json' \
            '/gamepulse/fusion/qa/r13_full123_new_two_official_20261107/*' \
            '/gamepulse/fusion/qa/r13_full123_original_companion_20261107/*' \
            '/gamepulse/fusion/materialized/igp_all_original_xyz/*/index.json' \
            '/gamepulse/fusion/qa/r13_full123_original_labels_20261107/*.receipt.json'
          export PYTHONPATH="$PWD:$PWD/gamepulse/fusion"
          python3 gamepulse/fusion/igp_full123_new_two_official_companion_accept_v1.py --root . --release
          git config user.name 'IGP full123 original acceptance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f gamepulse/fusion/qa/igp_progress_20261107/full123_post121_source_acceptance.json
          git add --sparse -f gamepulse/fusion/qa/r13_full123_new_two_official_20261107/*/pbp_normalized.json
          git diff --cached --check
          git commit -q -m 'data(private): SHA admit Full123 123 original SDK NBA events & clocks [skip ci]'
          for attempt in $(seq 1 14); do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH"
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then echo FULL123_NEW_TWO_ORIGINAL_SOURCE_ACCEPTED; exit 0; fi
            sleep "$attempt"
          done
          exit 39
