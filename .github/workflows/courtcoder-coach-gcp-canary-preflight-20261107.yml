# GCP identity only. Does not clone private data, build, deploy, or touch traffic.
name: CourtCoder Coach GCP private canary identity preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/courtcoder-coach-gcp-canary-preflight-20261107.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  verify-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GCP_PROJECT: project-d88c48c6-7f48-4c33-928
      GCP_REGION: asia-southeast1
      WIF_PROVIDER: projects/234135421963/locations/global/workloadIdentityPools/github-actions/providers/github-104
      CONTROL_SA: hoopvision-github@project-d88c48c6-7f48-4c33-928.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public repository confidentiality guard
        run: python3 tools/public_content_guard.py
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CONTROL_SA }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read-only Cloud Build trigger authorization
        shell: bash
        run: |
          set -euo pipefail
          if gcloud builds triggers list --project="$GCP_PROJECT" --region="$GCP_REGION" \
                --format='value(name)' --filter='name=integrated-pulse-coach-preview' \
                > "$RUNNER_TEMP/canary-triggers.txt" 2> "$RUNNER_TEMP/gcp-auth-error.txt"; then
            echo COACH_GCP_IDENTITY_AND_TRIGGER_LIST_AUTHORIZED
            if grep -Fxq integrated-pulse-coach-preview "$RUNNER_TEMP/canary-triggers.txt"; then
              echo COACH_EXACT_CLOUDBUILD_TRIGGER_FOUND
            else
              echo COACH_TRIGGER_NOT_FOUND_IN_REGIONAL_LIST
            fi
          else
            echo COACH_GCP_IDENTITY_OR_TRIGGER_LIST_UNAVAILABLE
            exit 3
          fi
