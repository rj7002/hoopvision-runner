# CPU Animate M0 source video timing proof; authentic NBA source bytes never enter public artifacts.
# Native-Pts camera cuts are reported separately from frame-level exposure flashes.
# Recheck exact CourtCoder v3.1.2 local-floor ring and green possession parity.
name: CPU Animate M0 private original-video PTS source check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cpu-animate-m0-video-pts-private.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-animate-m0-private-pts-v1
  cancel-in-progress: false

jobs:
  m0-cpu-source-pts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      CUDA_VISIBLE_DEVICES: '-1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enforce reviewed public workflow boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from tools.public_content_guard import scan
          path = '.github/workflows/cpu-animate-m0-video-pts-private.yml'
          violations = scan([path])
          if violations:
              for code, name in violations: print('PUBLIC_BRIDGE_REJECTED', code, name)
              raise SystemExit(3)
          print('CPU_ANIMATE_PUBLIC_BRIDGE_GUARD_OK')
          PY

      - name: Fetch only verified private test code and source material ephemerally
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo PRIVATE_RELEASE_TOKEN_MISSING; exit 3; }
          echo PRIVATE_TOKEN_PRESENT
          if ! gh api repos/timeedmonds-maker/104 --jq .private | grep -qx true; then
            echo PRIVATE_SOURCE_AUTH_REJECTED
            exit 3
          fi
          echo PRIVATE_SOURCE_AUTH_OK
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            echo INSTALL_CPU_FFMPEG
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          echo FFMPEG_CPU_READY
          ROOT="$(mktemp -d)"
          trap 'rm -rf "$ROOT"' EXIT
          export CPU_ANIMATE_ROOT="$ROOT"
          mkdir -p "$ROOT/cpu_animate" "$ROOT/tests" "$ROOT/tools" "$ROOT/private_media"
          BRANCH='cpu-animate%2Fm0-m1-validation-core-20261107'
          gh api "repos/timeedmonds-maker/104/contents/cpu_animate/core.py?ref=$BRANCH" --jq .content | base64 -d > "$ROOT/cpu_animate/core.py"
          gh api "repos/timeedmonds-maker/104/contents/cpu_animate/video_probe.py?ref=$BRANCH" --jq .content | base64 -d > "$ROOT/cpu_animate/video_probe.py"
          gh api "repos/timeedmonds-maker/104/contents/cpu_animate/m1_single_frame.py?ref=$BRANCH" --jq .content | base64 -d > "$ROOT/cpu_animate/m1_single_frame.py"
          gh api "repos/timeedmonds-maker/104/contents/tests/test_cpu_animate_core.py?ref=$BRANCH" --jq .content | base64 -d > "$ROOT/tests/test_cpu_animate_core.py"
          gh api "repos/timeedmonds-maker/104/contents/tests/test_cpu_animate_video_probe.py?ref=$BRANCH" --jq .content | base64 -d > "$ROOT/tests/test_cpu_animate_video_probe.py"
          gh api "repos/timeedmonds-maker/104/contents/tests/test_cpu_animate_production_ring.py?ref=$BRANCH" --jq .content | base64 -d > "$ROOT/tests/test_cpu_animate_production_ring.py"
          gh api "repos/timeedmonds-maker/104/contents/cpu_animate/camera_segment_scan.py?ref=$BRANCH" --jq .content | base64 -d > "$ROOT/cpu_animate/camera_segment_scan.py"
          gh api "repos/timeedmonds-maker/104/contents/tests/test_cpu_animate_camera_segment_scan.py?ref=$BRANCH" --jq .content | base64 -d > "$ROOT/tests/test_cpu_animate_camera_segment_scan.py"
          gh api "repos/timeedmonds-maker/104/contents/tools/locked_broadcast_screen_v5_rings.py?ref=courtcoder%2Fintegration" --jq .content | base64 -d > "$ROOT/tools/locked_broadcast_screen_v5_rings.py"
          (
            cd "$ROOT"
            python3 -m unittest discover -s tests -p 'test_cpu_animate_core.py' -v
            python3 -m unittest discover -s tests -p 'test_cpu_animate_video_probe.py' -v
            python3 -m unittest discover -s tests -p 'test_cpu_animate_production_ring.py' -v
            python3 -m py_compile cpu_animate/m1_single_frame.py
            python3 - <<'PY'
          from cpu_animate.m1_single_frame import validate_camera_game_match
          try:
              validate_camera_game_match(video_game_id='0022600091',
                                         calibration_game_id='0022500301',
                                         tracking_game_id='0022600091')
          except ValueError:
              print('HISTORICAL_CAMERA_CROSS_GAME_TRANSFER_REJECTED')
          else:
              raise RuntimeError('Historical camera incorrectly accepted')
          PY
          )
          gh release download 'clip-lab-hls-0022600091-616' \
            --repo timeedmonds-maker/104 --dir "$ROOT/private_media" \
            --pattern 'event616-broadcast.mp4'
          # CPU camera-shot candidate segmentation, including a flash rejector.
          if ! python3 -c 'import cv2,numpy' >/dev/null 2>&1; then
            python3 -m pip install -q --disable-pip-version-check opencv-python-headless numpy
          fi
          (
            cd "$ROOT"
            CPU_ANIMATE_ORIGINAL_VIDEO_PATH="$ROOT/private_media/event616-broadcast.mp4" \
              python3 -m unittest discover -s tests -p 'test_cpu_animate_camera_segment_scan.py' -v
            python3 -m cpu_animate.camera_segment_scan \
              --video "$ROOT/private_media/event616-broadcast.mp4" \
              --sha256 '9df90d9f76b3bf2f9698ac3d1c25016eb8adfab27dc65b12c3202e7b661e8aba' \
              --out "$ROOT/private_media/camera-cut-candidate-evidence.json"
          )
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          root = Path(os.environ['CPU_ANIMATE_ROOT'])
          sys.path.insert(0, str(root))
          from cpu_animate.video_probe import probe_video
          expected = '9df90d9f76b3bf2f9698ac3d1c25016eb8adfab27dc65b12c3202e7b661e8aba'
          result = probe_video(root/'private_media'/'event616-broadcast.mp4',
                               expected_sha256=expected)
          assert result['source_frame_count'] > 1
          assert result['original_media_unchanged']
          assert result['video_sha256_verified']
          print('PRIVATE_NBA_VIDEO_M0_SOURCE_PTS_PROBE_OK')
          print(json.dumps({
              'video_sha256_matched_private_release': True,
              'native_frame_count': result['source_frame_count'],
              'source_clip_pts_span_seconds': round(result['source_pts_seconds'][-1] - result['source_pts_seconds'][0], 6),
              'width': result['native_width'],
              'height': result['native_height'],
              'source_time_base': result['source_time_base'],
              'detected_pts_gap_count': len(result['suspicious_pts_gap_frame_indices']),
              'camera_cuts_certified': False,
              'tracking_to_video_sync_certified': False,
              'm1_accepted': False
          }, sort_keys=True))
          PY
          # Original 2026-27 NBA SDK tracking in the SAME game, independently
          # SHA-pinned. Do not emit source position arrays to public logs.
          SRC='gamepulse/fusion/materialized/igp_all_original_xyz/0022600091'
          REF='research%2Fgamepulse-clock-boundary-integrity-20261025'
          gh api "repos/timeedmonds-maker/104/contents/$SRC/index.json?ref=$REF" --jq .content | base64 -d > "$ROOT/private_media/xyz-index.json"
          gh api "repos/timeedmonds-maker/104/contents/$SRC/original-native-00013.jsonl.gz?ref=$REF" --jq .content | base64 -d > "$ROOT/private_media/xyz-chunk13.jsonl.gz"
          python3 - <<'PY'
          import gzip, hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['CPU_ANIMATE_ROOT']) / 'private_media'
          b = (root/'xyz-index.json').read_bytes()
          assert hashlib.sha256(b).hexdigest() == '3ce8100796631b4078293bce4f12a2aa0d6faef92502610b7daacd560f9e8b22'
          index = json.loads(b)
          assert index['game_id'] == '0022600091'
          chunk = next(x for x in index['chunks'] if x['path']=='original-native-00013.jsonl.gz')
          source = (root/'xyz-chunk13.jsonl.gz').read_bytes()
          assert hashlib.sha256(source).hexdigest() == chunk['sha256']
          rows = [json.loads(x) for x in gzip.decompress(source).splitlines() if x]
          ts = [int(row['source_frame_utc_ms']) for row in rows]
          assert len(rows) == chunk['original_native_timestamps'] == 2000
          assert all(a<b for a,b in zip(ts,ts[1:]))
          assert (ts[0],ts[-1]) == (chunk['first_source_frame_utc_ms'],
                                   chunk['last_source_frame_utc_ms'])
          official_pbp_utc_ms = 1792636866101
          nearest_delta_ms = min(abs(t-official_pbp_utc_ms) for t in ts)
          within_1s = sum(abs(t-official_pbp_utc_ms) <= 1000 for t in ts)
          within_5s = sum(abs(t-official_pbp_utc_ms) <= 5000 for t in ts)
          print('MATCHING_0091_ORIGINAL_NATIVE_SOURCE_SHA_AND_TIME_WINDOW_OK')
          print(json.dumps({
              'game_id': '0022600091',
              'source_game_manifest_sha256_matched': True,
              'source_chunk13_sha256_matched': True,
              'chunk13_native_timestamps': len(rows),
              'official_pbp_utc_inside_chunk': ts[0] <= official_pbp_utc_ms <= ts[-1],
              'nearest_native_timestamp_delta_ms': nearest_delta_ms,
              'native_timestamp_rows_within_pbp_utc_1s': within_1s,
              'native_timestamp_rows_within_pbp_utc_5s': within_5s,
              'original_player_records_at_pbp_utc_1s': sum(
                  1 for row in rows if abs(row['source_frame_utc_ms'] - official_pbp_utc_ms) <= 1000
                  and isinstance(row.get('positions_native_units'), dict) and len(row['positions_native_units']) > 0
              ),
              'shooter_source_id_present_in_1s': sum(
                  1 for row in rows if abs(row['source_frame_utc_ms'] - official_pbp_utc_ms) <= 1000
                  and '1631095' in (row.get('positions_native_units') or {})
              ),
              'player_identity_and_video_foot_alignment_certified': False,
              'pts_to_utc_certified': False
          }, sort_keys=True))
          PY
