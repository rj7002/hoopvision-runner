# Source-private, original-source-masked, Full107-native P0 tracking assessment.
# Source/coordinates never leave private worker or 104 draft release.
name: IGP 2025-26 Full107 historical interval-blackout P0 QA
'on':
  push:
    branches: [main]
    paths: [.github/workflows/igp-2025-26-full107-holdout-p0.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-2025-26-full107-multiduration-p0
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
  SOURCE_RELEASE: igp-public-gamepulse-2025-26-20261105
  QA_RELEASE: igp-2025-26-cross-season-audit-20261105
  BRANCH: research/gamepulse-clock-boundary-integrity-20261025
jobs:
  source_masked:
    runs-on: ubuntu-24.04
    timeout-minutes: 145
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ['001','002','003','004','005','006','007','008','009','010','011','012','013','014','015']
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Acquire original immutable source and private Full107 engine, source SHA guarded
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/qa"
          for attempt in {1..20}; do
            if gh release download "$SOURCE_RELEASE" --repo timeedmonds-maker/104 --clobber \
                --pattern nba-2025-26-source-index.json \
                --pattern "nba-2025-26-shard-$SHARD.zip" --dir "$RUNNER_TEMP/source"; then break; fi
            if [ "$attempt" -eq 20 ]; then exit 31; fi
            now=$(date +%s)
            reset=$(gh api rate_limit --jq '.resources.core.reset' 2>/dev/null || :)
            if [[ "$reset" =~ ^[0-9]+$ ]] && [ "$reset" -gt "$now" ]; then
              delay=$((reset-now+15))
              if [ "$delay" -gt 600 ]; then delay=600; fi
            else
              delay=$((attempt*45))
              if [ "$delay" -gt 450 ]; then delay=450; fi
            fi
            echo "SOURCE_PRIVATE_QUOTA_RETRY shard=$SHARD attempt=$attempt seconds=$delay"
            sleep "$delay"
          done
          test -s "$RUNNER_TEMP/source/nba-2025-26-source-index.json"
          test -s "$RUNNER_TEMP/source/nba-2025-26-shard-$SHARD.zip"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set --no-cone \
            gamepulse/fusion/igp_2025_26_full107_multiduration_holdout_v1.py \
            gamepulse/fusion/igp_full107_native_historical_2025_26_v1.py \
            gamepulse/fusion/igp_native_scene_model_v2.py \
            gamepulse/fusion/igp_historical_defender_proxy_v1.py \
            gamepulse/fusion/igp_tracking_model_a_holdout_2026.py \
            gamepulse/fusion/igp_tracking_model_b_holdout_2026.py \
            gamepulse/fusion/igp_tracking_model_c0_endpoint_velocity_bridge_2026.py \
            gamepulse/fusion/tests/test_igp_full107_native_historical_2025_26_v1.py
          export PYTHONPATH="$RUNNER_TEMP/private/gamepulse/fusion:$RUNNER_TEMP/private"
          python3 -m py_compile "$RUNNER_TEMP/private/gamepulse/fusion/igp_2025_26_full107_multiduration_holdout_v1.py"
          python3 -m unittest -q gamepulse.fusion.tests.test_igp_full107_native_historical_2025_26_v1
      - name: Remove held-out actor and ball source records, run native model and grade errors
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/private/gamepulse/fusion"
          python3 "$RUNNER_TEMP/private/gamepulse/fusion/igp_2025_26_full107_multiduration_holdout_v1.py" \
            --index "$RUNNER_TEMP/source/nba-2025-26-source-index.json" \
            --shard "$RUNNER_TEMP/source/nba-2025-26-shard-$SHARD.zip" \
            --out "$RUNNER_TEMP/qa"
          # Validate generated QA is only counters/aggregated positional errors and source hashes.
          python3 - <<'PY'
          import json,os,pathlib
          n=os.environ['SHARD']
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'qa'/f'full107-historical-p0-holdout-nba-2025-26-shard-{n}-qa.json'
          q=json.loads(p.read_text())
          assert q['schema']=='igp.historical-full107-native-interval-holdout-p0.v1'
          assert q['physical_accuracy_certified'] is False
          assert q['original_source_immutable'] is True
          assert q['all_masked_original_actor_ball_records_removed_before_reconstruction'] is True
          assert q['games'] >= 1
          assert not any('xyz_native' in str(g) or 'xyz_ft' in str(g) for g in q['per_game'])
          print('HISTORICAL_P0_SOURCE_ONLY_PRIVATE_QA_PASS',n,q['games'])
          PY
      - name: Save source-masked QA in PRIVATE research release, not public artifacts
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/qa/full107-historical-p0-holdout-nba-2025-26-shard-$SHARD-qa.json"
          for attempt in {1..20}; do
            if gh release upload "$QA_RELEASE" "$file" --repo timeedmonds-maker/104 --clobber; then
              echo "HISTORICAL_FULL107_P0_PRIVATE_SHARD_UPLOADED $SHARD"
              exit 0
            fi
            if [ "$attempt" -eq 20 ]; then exit 41; fi
            sleep 120
          done
  reduce:
    needs: source_masked
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Audit 15 private source-masked receipts and produce honest non-physical P0 summary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          mkdir -p "$RUNNER_TEMP/qa"
          for attempt in {1..20}; do
            if gh release download "$QA_RELEASE" --repo timeedmonds-maker/104 \
                --pattern 'full107-historical-p0-holdout-nba-2025-26-shard-*-qa.json' \
                --clobber --dir "$RUNNER_TEMP/qa"; then break; fi
            if [ "$attempt" -eq 20 ]; then exit 51; fi
            sleep 120
          done
          python3 - <<'PY'
          import collections,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'qa'
          files=sorted(root.glob('full107-historical-p0-holdout-nba-2025-26-shard-*-qa.json'))
          assert len(files)==15,('INCOMPLETE_SOURCE_MASKED_SHARDS',len(files))
          seen=set();seen_shards=set();aggregated={str(d):collections.Counter() for d in (200,1000,2000,5000,10000)}
          shard_p95={str(d):[] for d in (200,1000,2000,5000,10000)}
          sha=set()
          for f in files:
            q=json.loads(f.read_text())
            assert q['schema']=='igp.historical-full107-native-interval-holdout-p0.v1'
            assert q['physical_accuracy_certified'] is False
            assert q['original_source_immutable'] is True
            assert q['source_shard'] not in seen_shards
            seen_shards.add(q['source_shard']);sha.add(q['source_sha256'])
            for game in q['per_game']:
              assert game['game_id'] not in seen
              seen.add(game['game_id'])
            for d,v in q['cohort'].items():
              aggregated[d].update(v['counts'])
              if v['player_xy_ft']['p95'] is not None: shard_p95[d].append(v['player_xy_ft']['p95'])
          assert len(sha)==1 and len(seen_shards)==15
          summary={}
          for d,c in aggregated.items():
            pc=c['withheld_player_source_points'];pm=c['matched_player_source_points']
            bc=c['withheld_ball_source_points'];bm=c['matched_ball_source_points']
            summary[d]={'windows':c['evaluated_windows'],
              'withheld_player_source_points':pc,'matched_player_source_points':pm,
              'matched_player_fraction':pm/pc if pc else None,
              'matched_over_2ft':c['player_gt_2ft'],'matched_over_5ft':c['player_gt_5ft'],
              'withheld_ball_source_points':bc,'matched_ball_source_points':bm,
              'matched_ball_fraction':bm/bc if bc else None,
              'matched_ball_over_2ft':c['ball_gt_2ft'],'matched_ball_over_5ft':c['ball_gt_5ft'],
              'max_shard_player_p95_ft_NOT_GLOBAL_P95':max(shard_p95[d]) if shard_p95[d] else None}
            assert pm<=pc and bm<=bc
          result={'schema':'igp.historical-full107-native-interval-holdout-p0-summary.v1',
            'status':'RESEARCH_SOURCE_PROXY_ONLY','games_evaluated':len(seen),
            'shards':len(files),'source_sha256':next(iter(sha)),
            'physical_accuracy_certified':False,'official_ten_certified':False,
            'global_p95_from_pooled_errors':'NOT_AVAILABLE_AGGREGATE_ONLY',
            'duration_ms':summary}
          output=root/'full107-historical-p0-summary-20261105.json'
          output.write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          print('HISTORICAL_FULL107_SOURCE_MASKED_CROSS_SHARD_P0',json.dumps(result,sort_keys=True))
          PY
          gh release upload "$QA_RELEASE" "$RUNNER_TEMP/qa/full107-historical-p0-summary-20261105.json" \
            --repo timeedmonds-maker/104 --clobber
          echo HISTORICAL_FULL107_P0_AGGREGATE_PRIVATE_COMPLETE
