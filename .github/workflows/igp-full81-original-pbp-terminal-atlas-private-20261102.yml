# Public control-plane only. Every original NBA event and reconstructed chain stays private.
name: FULL81 original NBA PBP terminal versus published POSS atlas
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full81-original-pbp-terminal-atlas-private-20261102.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: full81-original-pbp-terminal-atlas-20261102
  cancel-in-progress: false
jobs:
  original-private-terminal-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: analysis/igp-full81-possession-terminal-rootcause-20261102
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify opaque public content guard
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Clone frozen NBA original PBP and private canonical chain grammar only
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          git sparse-checkout set --no-cone \
            /gamepulse/fusion/igp81_default_team_offrtg.py \
            /gamepulse/fusion/igp_full88_default_engine_v1.py \
            /gamepulse/fusion/qa/igp_fullx/shot_event_multiview_full88_v1.json \
            /gamepulse/fusion/universal_possession_alignment_2026.py \
            /gamepulse/fusion/igp_full81_possession_terminal_rootcause_v1.py \
            /gamepulse/fusion/qa/igp81_nba_team_offrtg_reporting_default_v1.json \
            /gamepulse/fusion/official_pbp_timing/games/
          python3 -m py_compile gamepulse/fusion/igp_full81_possession_terminal_rootcause_v1.py
          python3 gamepulse/fusion/igp_full81_possession_terminal_rootcause_v1.py --self-test
      - name: Rebuild source-defined original logical chains for all 81 games privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 gamepulse/fusion/igp_full81_possession_terminal_rootcause_v1.py > "$RUNNER_TEMP/private-p2-log" 2>&1 || {
            python3 - <<'PY'
          import os,json
          from pathlib import Path
          log=(Path(os.environ['RUNNER_TEMP'])/'private-p2-log').read_text()
          p=Path('gamepulse/fusion/qa/igp_fullx/full81_possession_terminal_private_failure_20261102.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({'status':'PRIVATE_ORIGINAL_PBP_REPLAY_FAILED',
              'private_traceback':log[-12000:]},sort_keys=True,indent=2)+'\\n')
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add --sparse -f gamepulse/fusion/qa/igp_fullx/full81_possession_terminal_private_failure_20261102.json
            git commit -qm 'qa(private): preserve NBA PBP terminal replay failure [skip ci]'
            git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH" || true
            echo "FULL81_PRIVATE_NBA_PBP_TERMINAL_AUDIT_FAILED_DETAILS_PRIVATE"
            exit 1
          }
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('gamepulse/fusion/qa/igp_fullx/full81_possession_terminal_rootcause_20261102.json')
          x=json.loads(p.read_bytes())
          assert x['games']==81 and x['team_games']==162
          assert x['totals']['nba']==16508 and x['totals']['candidate']==16484
          assert x['totals']['abs']==156 and x['totals']['exact']==54
          assert x['frozen81_original_sha_exact_game_count']==71
          assert x['new_full88_source_version_shadow_game_count']==10
          assert x['source_version_shadow_not_frozen81_reproduction']
          assert x['not_certified_physical_possessions']
          print('FULL81_P2_PRIVATE_TERMINAL_SOURCE_AUDIT',x['games'],
                x['source_replay_games_succeeded'],
                x['totals'].get('replayed_unverified_terminals',0))
          PY
      - name: Commit entire provenance audit privately, no source-public artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f gamepulse/fusion/qa/igp_fullx/full81_possession_terminal_rootcause_20261102.json
          git diff --cached --check
          if git diff --cached --quiet; then echo FULL81_PRIVATE_PBP_TERMINAL_QA_IDENTICAL; exit 0; fi
          git commit -qm 'qa(private): preserve original PBP terminal-vs-NBA POSS diagnostic [skip ci]'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH"
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo FULL81_ORIGINAL_PBP_TERMINAL_QA_COMMITTED_PRIVATE_ONLY
              exit 0
            fi
            sleep "$i"
          done
          exit 25
