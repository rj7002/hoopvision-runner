# User original NBA XYZ and masked labels remain in private 104 only.
name: Full88 new17 source gap withheld-position quality gate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full88-natural-gap-new17-masked-private-20261102.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-full88-new17-natural-source-mask-20261102
  cancel-in-progress: false
jobs:
  private-source-masked-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/igp-p2b-natural-gap-20261102
      PRIVATE_SHA: bdeb10461fd14a29e865eddeaf7bdbbe5be4feab
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Enforce confidentiality and pinned private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          # A distinct private QA workflow may advance the branch while we
          # run. Resolve the immutable evaluated code commit explicitly.
          git fetch -q --depth=1 origin "$PRIVATE_SHA"
          git checkout --detach -q "$PRIVATE_SHA"
          test "$(git rev-parse HEAD)" = "$PRIVATE_SHA" || { echo ORIGINAL_SOURCE_MASK_PRIVATE_COMMIT_DRIFT; exit 17; }
          git sparse-checkout set gamepulse/fusion
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_full88_p2b_natural_gap_new17_masked_v1.py
          python3 -m unittest discover -s gamepulse/fusion/tests -p 'test_igp_full88_p2b_natural_gap_tier_v1.py' -q > "$RUNNER_TEMP/source-test.log" 2>&1 || {
            echo NATURAL_GAP_MASKED_SOURCE_FREE_MODEL_QA_FAIL
            exit 18
          }
          echo NATURAL_GAP_ORIGINAL_SOURCE_AND_MODEL_SOURCE_FREE_QA_PASS
      - name: Reconstruct heldout native player positions source-first in 17 games
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          target=gamepulse/fusion/qa/igp_fullx/full88_new17_natural_gap_100_250_400_masked_source_20261102.json
          python3 gamepulse/fusion/igp_full88_p2b_natural_gap_new17_masked_v1.py --root . --out "$target" > "$RUNNER_TEMP/natural-mask-private.log" 2>&1 || {
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'natural-mask-private.log').read_text(errors='replace').splitlines()
          err=next((line for line in reversed(lines) if re.match(r'^(ValueError|TypeError|KeyError|FileNotFoundError|AssertionError|IndexError):',line)),None)
          print('NATURAL_MASKED_PRIVATE_FAILURE',re.sub(r'[0-9]{4,}','[ID]',err or 'UNKNOWN')[:170])
          PY
            exit 20
          }
          python3 - <<'PY'
          from pathlib import Path
          import json
          q=json.loads(Path('gamepulse/fusion/qa/igp_fullx/full88_new17_natural_gap_100_250_400_masked_source_20261102.json').read_text())
          assert q["new17_games"]==17
          assert q["NBA_source_target_omitted_before_prediction"] is True
          assert q["not_fresh_independent_video_ground_truth"] is True
          assert q["canonical_default_promoted"] is False
          assert q["withheld_samples_tested_by_class"]["one_r250"]==3264
          assert q["withheld_samples_tested_by_class"]["two_r250"]==1088
          print('NATURAL_GAP_SOURCE_MASKED_17_VALIDATION_COMPLETE',
                q['candidate_gate_source_proxy_pass'])
          PY
      - name: Store source-masked errors in private QA only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          target=gamepulse/fusion/qa/igp_fullx/full88_new17_natural_gap_100_250_400_masked_source_20261102.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$target"
          git diff --cached --check
          git commit -qm 'qa(private): source-masked natural anchor qualification new17 [skip ci]'
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH" || exit 27
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo NATURAL_GAP_ORIGINAL_SOURCE_MASKED_QA_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 28
