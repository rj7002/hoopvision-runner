# Opaque public runner: only authorized SDK client; never store raw source on public repo.
name: IGP81 five highest-risk companion gaps authorized recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp81-three-gap-companion-recovery.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp81-three-gap-companion-recovery
  cancel-in-progress: false
jobs:
  original-sdk-retry:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - id: '0022600006'
            tipoff: '2026-10-22T23:00:00Z'
          - id: '0022600086'
            tipoff: '2026-10-21T23:00:00Z'
          - id: '0022600142'
            tipoff: '2026-10-29T01:30:00Z'
          - id: '0022600111'
            tipoff: '2026-10-25T02:00:00Z'
          - id: '0022600143'
            tipoff: '2026-10-29T02:30:00Z'
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      NBA_GAME_ID: ${{ matrix.id }}
      NBA_TIPOFF_UTC: ${{ matrix.tipoff }}
      IGP_SDK_INIT_TIMEOUT_MS: '45000'
      TARGET_BRANCH: research/igp81-all-layers-source-grade-20261101
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify public source guard and install reviewed first-party SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          cd tools/licensed_feed
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Recheck exact original app program without bypass or guessed response
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recheck"
          export IGP_PRIVATE_CAPTURE_DIR="$RUNNER_TEMP/recheck"
          node tools/licensed_feed/companion_original_sdk_probe.mjs > "$RUNNER_TEMP/original-sdk-private.log"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          d=Path(os.environ["IGP_PRIVATE_CAPTURE_DIR"])
          p=json.loads((d/"companion_probe_receipt.json").read_bytes())
          assert p["game_id"]==os.environ["NBA_GAME_ID"]
          assert not p["authentication_bypass_attempted"]
          assert not p["raw_29joint_pose_60hz_observed"]
          if p["status"]=="FULL_EVENT_RESPONSE_OBSERVED":
              data=(d/"companion_original_sdk_response.json").read_bytes()
              assert hashlib.sha256(data).hexdigest()==p["original_body_sha256"]
              assert len(json.loads(data))==p["original_body_event_count"]
          print("IGP81_AUTHORIZED_RECOVERY_SOURCE_GRADE",p["game_id"],p["status"],p.get("original_body_shot_details_count",0))
          PY
      - name: Preserve every genuine source response privately; keep missing explicit
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$TARGET_BRANCH" \
             https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion/evidence gamepulse/fusion/qa/igp_v32 gamepulse/fusion/qa/igp_progress_20261029 gamepulse/fusion/qa/igp_progress_20261029
          cd "$RUNNER_TEMP/private"
          python3 - <<'PY'
          import json,hashlib,os,shutil
          from pathlib import Path
          gid=os.environ["NBA_GAME_ID"]
          root=Path(os.environ["RUNNER_TEMP"])
          new=json.loads((root/"recheck/companion_probe_receipt.json").read_bytes())
          out=Path("gamepulse/fusion/evidence")/("companion_sdk_original_"+gid)
          out.mkdir(parents=True,exist_ok=True)
          body=out/"sdk_observed_original.json"
          receipt=out/"sdk_original_receipt.json"
          if body.exists() and not receipt.exists():
              legacy=Path("gamepulse/fusion/qa/igp_progress_20261029")/("igp_companion_sdk_authorized_source_"+gid+"_20261029.json")
              assert legacy.is_file(),"PRIOR_ORIGINAL_WITHOUT_ANY_SHA_RECEIPT:"+gid
              prior=json.loads(legacy.read_bytes())
              assert prior["game_id"]==gid and prior["status"]=="FULL_EVENT_RESPONSE_OBSERVED"
              assert hashlib.sha256(body.read_bytes()).hexdigest()==prior["original_body_sha256"]
              assert len(body.read_bytes())==prior["original_body_bytes"]
              receipt.write_text(json.dumps(prior,sort_keys=True,indent=2)+"\n")
          if new["status"]=="FULL_EVENT_RESPONSE_OBSERVED":
              src=root/"recheck/companion_original_sdk_response.json"
              data=src.read_bytes()
              assert hashlib.sha256(data).hexdigest()==new["original_body_sha256"]
              if not body.exists():
                  shutil.copyfile(src,body)
                  receipt.write_text(json.dumps(new,sort_keys=True,indent=2)+"\n")
              else:
                  # Frozen accepted 56game responses may have their original SHA
                  # receipt only in the QA snapshot; do not manufacture a new one.
                  prior=Path("gamepulse/fusion/qa/igp_progress_20261029")/("igp_companion_sdk_authorized_source_"+gid+"_20261029.json")
                  old=json.loads(receipt.read_bytes()) if receipt.exists() else json.loads(prior.read_bytes())
                  assert hashlib.sha256(body.read_bytes()).hexdigest()==old["original_body_sha256"]
                  assert old["original_body_shot_details_count"]>=0
                  if new["original_body_shot_details_count"]>old["original_body_shot_details_count"]:
                      # Never overwrite immutable original, even when better
                      # source response is observed; preserve a SHA revision.
                      history=out/"source_revision_history"
                      history.mkdir(exist_ok=True)
                      revised=history/(new["original_body_sha256"]+".json")
                      revised_receipt=history/(new["original_body_sha256"]+".receipt.json")
                      if revised.exists():
                          assert revised.read_bytes()==data
                      else:
                          shutil.copyfile(src,revised)
                      revised_receipt.write_text(json.dumps(new,sort_keys=True,indent=2)+"\n")
                      print("IGP81_COMPANION_ADDITIVE_SOURCE_REVISION",gid,old["original_body_shot_details_count"],new["original_body_shot_details_count"])
                  elif not receipt.exists():
                      # Keep previously accepted QA receipt authoritative; do
                      # not duplicate it or alter original immutable records.
                      print("IGP81_COMPANION_FROZEN56_ACCEPTED_SOURCE_CONSERVED",gid)
          elif not receipt.exists():
              receipt.write_text(json.dumps(new,sort_keys=True,indent=2)+"\n")
          safe={k:new.get(k) for k in ("game_id","status","initialization_result",
                    "observed_200_event_responses","observed_200_slot_responses",
                    "original_body_shot_details_count","original_body_sha256",
                    "raw_29joint_pose_60hz_observed","authentication_bypass_attempted")}
          safe["schema"]="igp81.targeted-original-companion-retry.v1"
          qa=Path("gamepulse/fusion/qa/igp_v32")/("igp81_gap_retry_"+gid+".json")
          if qa.exists():
              prev=json.loads(qa.read_bytes())
              if prev.get("status")=="FULL_EVENT_RESPONSE_OBSERVED" and safe["status"]!="FULL_EVENT_RESPONSE_OBSERVED":
                  safe=prev
          qa.write_text(json.dumps(safe,sort_keys=True,indent=2)+"\n")
          print("IGP81_RETRY_PRIVATE_RESULT",gid,safe["status"],safe.get("original_body_shot_details_count",0))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "gamepulse/fusion/evidence/companion_sdk_original_$NBA_GAME_ID" \
            "gamepulse/fusion/qa/igp_v32/igp81_gap_retry_$NBA_GAME_ID.json"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo IGP81_SOURCE_RETRY_NO_IMPROVEMENT
            exit 0
          fi
          git commit -q -m "data(igp81): private original-source companion gap retry $NBA_GAME_ID"
          for n in $(seq 1 12); do
            git fetch -q origin "$TARGET_BRANCH"
            git rebase -q "origin/$TARGET_BRANCH"
            if git push -q origin "HEAD:refs/heads/$TARGET_BRANCH"; then
              echo IGP81_GAP_RETRY_PRIVATE_SHA_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 27

  reconcile-official-pbp-and-blueprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      TARGET_BRANCH: research/igp81-all-layers-source-grade-20261101
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Preserve canonical original NBA action semantics, never rewrite source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$TARGET_BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set \
            gamepulse/fusion/official_pbp_timing \
            gamepulse/fusion/qa/igp_v32 \
            gamepulse/fusion/qa/igp_progress_20261029 \
            gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/shot_biomechanics_all81_v1
          cd "$RUNNER_TEMP/private"
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          def h(b):return hashlib.sha256(b).hexdigest()
          def ld(p):return json.loads(p.read_bytes())
          base=Path("gamepulse/fusion")
          qa=base/"qa/igp_v32"
          idx=ld(qa/"igp81_unified_native_possession_tracking_registry_run_41231284682.json")
          d=ld(base/"materialized/igp_2026_27_unified_season_v3/shot_biomechanics_all81_v1/index.json")
          assert idx["counts"]["games"]==len(d["games"])==81
          out=[]
          for n in range(15,25):
              gid=f"00226000{n}"
              g=idx["games"][gid]
              src=base/"official_pbp_timing/pbp_only_oct21_10/games"/(gid+".json")
              cur=base/"official_pbp_timing/games"/(gid+".json")
              old=ld(src);new=ld(cur)
              assert h(src.read_bytes())==g["nba_official_PBP_SHA256"],"FROZEN81_CANONICAL_ORIGINAL_SHA_CHANGED:"+gid
              assert new["game_id"]==old["game_id"]==gid
              assert old["actions"]==new["actions"],"ORIGINAL_OFFICIAL_EVENT_CONTENT_CHANGED:"+gid
              assert old["official_final"]==new["official_final"],"ORIGINAL_FINAL_SCORE_CHANGED:"+gid
              assert not (old.get("timing_authority") and new.get("timing_authority")) or old["timing_authority"]==new["timing_authority"],"ORIGINAL_CLOCK_AUTHORITY_CHANGED:"+gid
              fga=sum(x["action_type"] in ("2pt","3pt") for x in old["actions"])
              assert fga==d["games"][gid]["official_FGA"]
              out.append({"game_id":gid,"accepted_81_sha256":h(src.read_bytes()),
                  "current_mirror_sha256":h(cur.read_bytes()),
                  "all_official_actions_identical":True,
                  "all_official_action_times_identical":True,
                  "timing_authority_identical_if_both_published":(old.get("timing_authority")==new.get("timing_authority") if old.get("timing_authority") and new.get("timing_authority") else None),
                  "final_score_identical":True,
                  "official_field_goal_attempts_identical":True,
                  "distinct_source_file_sha256":h(src.read_bytes())!=h(cur.read_bytes()),
                  "official_pbp_actions":len(old["actions"]),"official_fga":fga})
          observed=d["totals"]["frozen56_current_blueprint_revision_drift"]
          assert observed==13
          assert d["totals"]["frozen56_blueprint_shot_records_not_matching_current_version"]==0
          assert d["totals"]["frozen56_blueprint_shot_records_matching_current_version"]==9221
          receipt={"schema":"igp81-original-pbp-blueprint-versions-reconciled.v1",
            "official_81_games_unmodified":81,
            "ten_new_games_original_pbp_SHA_preserved":True,
            "ten_new_games_official_action_sequences_and_times_identical":True,
            "ten_new_games_official_final_scores_identical":True,
            "ten_new_games_version_diff_is_metadata_or_serialization_not_action_change":True,
            "thirteen_prior_blueprint_file_SHA_variants":observed,
            "prior_blueprint_9221_accepted_shot_records_match_current":True,
            "prior_blueprint_56_immutable_shot_ledgers":56,
            "source_raw_29joint_60hz_pose_not_certified":True,
            "rows":out}
          p=qa/"igp81_official_pbp_blueprint_semantic_reconciliation_v1.json"
          raw=(json.dumps(receipt,indent=2,sort_keys=True)+"\n").encode()
          if p.exists():
              assert p.read_bytes()==raw,"REFUSE_OVERWRITE_SAVED_PBP_AUDIT"
          else:p.write_bytes(raw)
          print("IGP81_CANONICAL_PBP_10_SOURCE_VERSIONS_SEMANTICALLY_IDENTICAL",len(out))
          print("IGP81_FROZEN_BLUEPRINT_9221_MATCH",observed)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_v32/igp81_official_pbp_blueprint_semantic_reconciliation_v1.json
          git diff --cached --check
          if git diff --cached --quiet; then echo IGP81_PBP_SEMANTIC_RECON_ALREADY_COMPLETE; exit 0; fi
          git commit -q -m 'qa(igp81): reconcile ten original PBP SHA versions and thirteen Blueprint variants'
          for n in $(seq 1 12); do
            git fetch -q origin "$TARGET_BRANCH"
            git rebase -q "origin/$TARGET_BRANCH"
            if git push -q origin "HEAD:refs/heads/$TARGET_BRANCH"; then
              echo IGP81_PRIVATE_ORIGINAL_PBP_SEMANTIC_RECONCILED
              exit 0
            fi
            sleep "$n"
          done
          exit 28
