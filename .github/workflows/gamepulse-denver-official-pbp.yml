name: Integrated Pulse player possession clip index
# Public CPU orchestrator. Per-player result data and full NBA event lists are
# stored only in the private repository's releases, never public artifacts.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-denver-official-pbp.yml']
  schedule:
    - cron: '23 17 * * *'
  workflow_run:
    workflows: ['Game Pulse complete season backlog', 'Game Pulse private team game player search refresh']
    types: [completed]
  workflow_dispatch:
    inputs:
      game_id:
        description: Official NBA game ID
        type: string
        required: true
        default: '0022600009'
      player_id:
        description: Official NBA player ID
        type: string
        required: true
        default: '203500'
permissions:
  contents: read
concurrency:
  group: pulse-player-clips-${{ inputs.game_id || '0022600009' }}-${{ inputs.player_id || '203500' }}
  cancel-in-progress: false
jobs:
  materialize:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      NBA_GAME_ID: ${{ inputs.game_id || '0022600194' }}
      NBA_PLAYER_ID: ${{ inputs.player_id || '1626164' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce private results and public workflow policy
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          [[ "$NBA_GAME_ID" =~ ^00[0-9]{8}$ ]]
          [[ "$NBA_PLAYER_ID" =~ ^[1-9][0-9]{0,11}$ ]]
      - name: Load trusted private-source read-only clip query
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/nba-official"
          mkdir -p "$ROOT"
          for mod in official_pbp_timestamps_2026.py player_possession_clips.py; do
            gh api "repos/timeedmonds-maker/104/contents/gamepulse/fusion/$mod?ref=main" --jq .content | base64 -d > "$ROOT/$mod"
          done
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/tests/test_player_possession_clips.py?ref=main' --jq .content | base64 -d > "$ROOT/test_player_possession_clips.py"
          python3 -m py_compile "$ROOT/"*.py
          cd "$ROOT"
          python3 -m unittest -q test_player_possession_clips
      - name: Audit Rockets possessions inside the two Phoenix runs
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/nba-official"
          python3 - <<'PY'
          from official_pbp_timestamps_2026 import official_json
          from player_possession_clips import ordered_actions, possession_team, is_gameplay
          import json
          game='0022600194'
          data,sha,url=official_json(game,'playbyplay')
          rows=ordered_actions(data)
          ids={'1610612745':'HOU','1610612756':'PHX'}
          def score(a):
              h,p=a.get('scoreAway'),a.get('scoreHome')
              if h is None or p is None or not str(h).isdigit() or not str(p).isdigit():return None
              return (int(h),int(p))
          markers={'34-14_start':(11,10),'14-2_start':(23,30),'both_end':(25,44)}
          found={}
          for label,target in markers.items():
              indices=[i for i,a in enumerate(rows) if score(a)==target and (i==0 or score(rows[i-1])!=target)]
              if not indices:raise ValueError('MISSING_SCORE_MARKER_'+label)
              found[label]=indices[0]
              a=rows[indices[0]]
              print('RUN_MARKER',label,'idx',indices[0],'period',a['period'],'clock',a['clock'],'event',a['actionNumber'],'type',a.get('actionType'),'description',a.get('description'),'score',score(a))
          # Consecutive official NBA possession-team action runs, segmented at period boundaries.
          episodes=[]
          active=None;begin=None;last=None
          for i,a in enumerate(rows):
              if active is not None and last is not None and a['period'] != rows[last]['period']:
                  episodes.append((active,begin,last,'PERIOD_BOUNDARY'))
                  active=begin=last=None
              team=possession_team(a,ids)
              if team is None:continue
              if team!=active:
                  if active is not None and last is not None:
                      episodes.append((active,begin,last,'POSSESSION_CHANGE'))
                  active=team
                  begin=i
              last=i
          if active is not None and last is not None:
              episodes.append((active,begin,last,'END_GAME'))
          for name,lo in [('34-14',found['34-14_start']),('14-2',found['14-2_start'])]:
              hi=found['both_end']
              hou=[(t,a,b,c) for t,a,b,c in episodes if t=='HOU' and a>lo and b<hi]
              partial=[(t,a,b,c) for t,a,b,c in episodes if t=='HOU' and a<=lo<b or t=='HOU' and a<=hi<b]
              print('RUN_RESULT',json.dumps({'run':name,'score_start':score(rows[lo]),'score_end':score(rows[hi]),'houston_offensive_possessions':len(hou),'boundary_crossings':len(partial),'pbp_sha256':sha,'source':url}))
              for k,(_,a,b,c) in enumerate(hou,1):
                  ea=rows[a];eb=rows[b]
                  play=[x for x in rows[a:b+1] if is_gameplay(x)]
                  last_play=play[-1] if play else eb
                  print('HOU_POSSESSION',name,k,'start',ea['period'],ea['clock'],'end',eb['period'],eb['clock'],'terminal_event',last_play['actionNumber'],'terminal_type',last_play.get('actionType'),'terminal_description',last_play.get('description'),'score',score(eb),'end_reason',c)
              for t,a,b,c in partial:
                  print('BOUNDARY_WARNING',name,t,rows[a]['period'],rows[a]['clock'],rows[b]['period'],rows[b]['clock'],c)
          PY
      - name: Build source-verified full-game player possessions and NBA clip references
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/nba-official"
          cd "$ROOT"
          python3 player_possession_clips.py --game "$NBA_GAME_ID" --player "$NBA_PLAYER_ID" --out "$ROOT/player-clips.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path('player-clips.json').read_text())
          assert data["game_id"]==os.environ["NBA_GAME_ID"]
          assert data["player_id"]==os.environ["NBA_PLAYER_ID"]
          assert data["clip_count"]==len(data["clips"])
          assert len({x["event_num"] for x in data["clips"]})==data["clip_count"]
          assert all("eventNum="+str(x["event_num"]) in x["clip_url"] for x in data["clips"])
          Path('release-notes.json').write_text(json.dumps(data,separators=(',',':')))
          print("PLAYER_SOURCE_EVENT_CLIPS_VERIFIED",data["game_id"],"event_urls",data["clip_count"],"stints",len(data["on_court_spans"]))
          PY
      - name: Publish result only to canonical private repository and SHA-readback
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/nba-official"
          TAG="gamepulse-player-possession-clips-$NBA_GAME_ID-$NBA_PLAYER_ID"
          REPO=timeedmonds-maker/104
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --notes-file "$ROOT/release-notes.json" >/dev/null
          else
            gh release create "$TAG" --repo "$REPO" --title "Private official NBA player possession clip references" --notes-file "$ROOT/release-notes.json" --latest=false >/dev/null
          fi
          gh release upload "$TAG" "$ROOT/player-clips.json" --repo "$REPO" --clobber >/dev/null
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          tag=f"gamepulse-player-possession-clips-{os.environ['NBA_GAME_ID']}-{os.environ['NBA_PLAYER_ID']}"
          raw=subprocess.check_output(["gh","api",f"repos/timeedmonds-maker/104/releases/tags/{tag}"])
          remote=json.loads(raw)
          local=Path(os.environ["RUNNER_TEMP"])/"nba-official/player-clips.json"
          assets={x["name"]:x for x in remote["assets"]}
          assert assets["player-clips.json"]["digest"]=="sha256:"+hashlib.sha256(local.read_bytes()).hexdigest()
          assert json.loads(remote["body"])["clip_count"]==json.loads(local.read_text())["clip_count"]
          print("PRIVATE_NBA_EVENT_LINKS_SHA256_READBACK_PASS")
          PY
  season-index:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Protect private player evidence and source inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Fetch trusted season-index source into temporary runner
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/nba-season-clips"
          mkdir -p "$ROOT"
          for mod in official_pbp_timestamps_2026.py player_possession_clips.py index_all_player_possession_clips.py; do
            gh api "repos/timeedmonds-maker/104/contents/gamepulse/fusion/$mod?ref=main" --jq .content |
              base64 -d > "$ROOT/$mod"
          done
          python3 -m py_compile "$ROOT/"*.py
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/tests/test_player_possession_clips.py?ref=main' --jq .content |
            base64 -d > "$ROOT/test_player_possession_clips.py"
          cd "$ROOT"
          python3 -m unittest -q test_player_possession_clips
      - name: Privately index every verified season game without repeat source downloads
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/nba-season-clips"
          cd "$ROOT"
          python3 -u index_all_player_possession_clips.py --limit 40
