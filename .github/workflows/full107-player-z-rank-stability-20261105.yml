# Original licensed XYZ not checked out; only QA on private derived player-game aggregates.
name: Full107 player Z candidate leaderboard stability audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/full107-player-z-rank-stability-20261105.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: full107-player-z-rank-stability-20261105
  cancel-in-progress: false
jobs:
  private-rank-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/full107-player-z-airtime-calibration-20261105
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: License boundary and private aggregate-only source checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set --no-cone \
            /gamepulse/fusion/analysis/igp_full107_player_z_candidate_rank_stability_v6_20261105.py \
            /gamepulse/fusion/qa/analysis/full107_player_z_live_elevation_atlas_v5_20261105.json
          echo "PRIVATE_RANK_SHA_$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)"
      - name: Bootstrap sampled player-game elevation rankings without source frame export
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 -B -m py_compile gamepulse/fusion/analysis/igp_full107_player_z_candidate_rank_stability_v6_20261105.py
          if test ! -f gamepulse/fusion/qa/analysis/full107_player_z_candidate_rank_stability_v6_20261105.json; then
            python3 -B gamepulse/fusion/analysis/igp_full107_player_z_candidate_rank_stability_v6_20261105.py > "$RUNNER_TEMP/private-rank.log" 2>&1 || {
              echo PRIVATE_RANK_BOOTSTRAP_FAILED
              python3 - <<'PY'
          import os,pathlib,re
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"private-rank.log"
          a=p.read_text().splitlines() if p.exists() else []
          s=next((x for x in reversed(a) if re.match(r"^[A-Za-z]+(?:Error|Exception|AssertionError):",x)),None)
          print("PRIVATE_FAILURE_CLASS",s.split(":",1)[0] if s else "UNKNOWN")
          PY
              exit 1
            }
          fi
          python3 - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('gamepulse/fusion/qa/analysis/full107_player_z_candidate_rank_stability_v6_20261105.json')
          x=json.loads(p.read_bytes())
          assert x['full107_games']==107 and x['bootstrap_replicates']==5000
          assert not x['true_airtime_leaderboard_publishable']
          print('SOURCE_GRADED_PLAYER_Z_RANK_STABILITY',json.dumps({
             'eligible':x['rank_eligible_players'],
             'winners':x['threshold_winners'],
             'all_threshold_leader_same':x['threshold_winner_invariant'],
             'top10_overlap':x['top10_overlap'],
             'top5_12unit':x['top15_12unit_bootstrap'][:5],
             'top_two_difference_95CI':x['top_two_12unit_bootstrap_difference_ci_95'],
             'five_games_12unit_top5':x['threshold_rankings']['12']['min5games_top10'][:5],
             'five_games_70pct_source_coverage_top5':x['threshold_rankings']['12']['min5games_and70pct_minutes_coverage_top10'][:5],
             'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
             'true_airborne_seconds_proven':False},sort_keys=True))
          PY
      - name: Commit bootstrap ranking audit only to private repository
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f gamepulse/fusion/qa/analysis/full107_player_z_candidate_rank_stability_v6_20261105.json
          git diff --cached --check
          if git diff --cached --quiet; then echo RANK_QA_ALREADY_PRESERVED; exit 0; fi
          git commit -qm 'qa(private): deterministic seeded Full107 player Z candidate rank bootstrap'
          gh auth setup-git
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then echo RANK_QA_PERSISTED_PRIVATELY; exit 0; fi
            sleep "$i"
          done
          exit 39
