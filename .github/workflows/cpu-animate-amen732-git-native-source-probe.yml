name: CPU Animate Amen732 pinned native Full131 sparse source probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cpu-animate-amen732-git-native-source-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-animate-amen732-native-git-probe
  cancel-in-progress: false

jobs:
  exact-native-git-source-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      CUDA_VISIBLE_DEVICES: '-1'
      NVIDIA_VISIBLE_DEVICES: none
      OPENCV_OPENCL_RUNTIME: disabled
      OMP_NUM_THREADS: '3'
      OPENBLAS_NUM_THREADS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard strictly private source scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from tools.public_content_guard import scan
          assert not scan(['.github/workflows/cpu-animate-amen732-git-native-source-probe.yml'])
          print('AMEN732_CPU_NATIVE_GIT_PRIVATE_SECURITY_PASS')
          PY
      - name: Use private sparse GIT transport not rate-limited release REST
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || exit 4
          if compgen -G '/dev/nvidia*' >/dev/null; then
            echo 'UNEXPECTED_GPU_DEVICE'; exit 3
          fi
          gh auth setup-git
          BRANCH='research/gamepulse-clock-boundary-integrity-20261025'
          ROOT="$(mktemp -d)"
          chmod 700 "$ROOT"
          trap 'rm -rf "$ROOT"' EXIT
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            'https://github.com/timeedmonds-maker/104.git' "$ROOT/private"
          cd "$ROOT/private"
          if test "$(git rev-parse HEAD)" != 'e457df5aa4c421a2cf61afa6f1c1624939d377d2'; then
            echo 'PINNED_ORIGINAL_SDK_SOURCE_COMMIT_CHANGED';exit 3
          fi
          git sparse-checkout set \
            gamepulse/fusion/materialized/igp_all_original_xyz/0022600009 \
            gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/companion_app_packages_all56_v1/0022600009 \
            gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/shot_biomechanics_all56_v2/0022600009.jsonl.gz \
            gamepulse/fusion/evidence/companion_0022600009 \
            gamepulse/fusion/event_tracking/games/0022600009.json \
            gamepulse/fusion/official_pbp_timing/games/0022600009.json \
            data/extensions/nba_blueprint_2026_27/games/0022600009/blueprint_report_raw.json
          python3 - <<'PY'
          import gzip,hashlib,json,pathlib
          root=pathlib.Path('.')
          base=root/'gamepulse/fusion/materialized/igp_all_original_xyz/0022600009'
          index=json.loads((base/'index.json').read_bytes())
          assert index['game_id']=='0022600009' and index['chunk_count']==18
          total=0; selected=[]
          event_utc=1792815556484
          for part in index['chunks']:
            path=base/part['path']
            h=hashlib.sha256(path.read_bytes()).hexdigest()
            if h!=part['sha256']: raise RuntimeError('ORIGINAL_NATIVE_SDK_CHUNK_SHA256_FAILED')
            total+=int(part['original_native_timestamps'])
            if part['first_source_frame_utc_ms']<=event_utc+20000 and part['last_source_frame_utc_ms']>=event_utc-20000:
              with gzip.open(path,'rt') as fp:
                rows=[json.loads(x) for x in fp if x.strip()]
              selected.append((part['path'],len(rows),sorted(rows[0].keys()) if rows else []))
          official=json.loads((root/'gamepulse/fusion/official_pbp_timing/games/0022600009.json').read_bytes())
          events=[x for x in official['actions'] if x['nba_action_number'] in (732,734)]
          assert len(events)==2 and {x['person_id'] for x in events}=={1641705,1641708}
          comp=root/'gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/companion_app_packages_all56_v1/0022600009'
          packages={}
          for fn in ('shotdetails.jsonl.gz','oncourt.jsonl.gz','event_catalog.jsonl.gz','time.jsonl.gz',
                     'highlightvideo.jsonl.gz','leverage.jsonl.gz'):
            with gzip.open(comp/fn,'rt') as fp:
              packages[fn]=sum(1 for line in fp if line.strip())
          print('AMEN732_SOURCE_COMMIT_SHA256_PATH_PIN_OK')
          print('AMEN732_ORIGINAL_NATIVE_CHUNKS_SHA256_VERIFIED',len(index['chunks']),
                'native_timestamps',total,'event_window_chunks',len(selected))
          print('AMEN732_PRIVATE_ORIGINAL_FRAME_SCHEMA_KEYS',selected[0][2] if selected else [])
          print('AMEN732_ORIGINAL_EVENT_WINDOW_RECORD_COUNTS',[(x[0],x[1]) for x in selected])
          print('AMEN732_COMPANION_PACKAGE_RECORD_COUNTS',packages)
          print('AMEN732_OFFICIAL_SOURCE_EVENT_IDS_AND_PLAYERS_VERIFIED',len(events))
          print('AMEN732_UTC_TO_ORIGINAL_VIDEO_PTS_CERTIFIED',False)
          PY
          echo 'AMEN732_FULL_NATIVE_CPU_SOURCE_GIT_TRANSPORT_PASS'
