# Original SDK XYZ and individual predictions never leave the private GitHub repo.
name: Full88 natural-gap sparse original source enriched holdout
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full88-natural-gap-enriched-private-20261102.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-enriched-mask:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/igp-p2b-natural-gap-20261102
      PRIVATE_SHA: 2800df5f82800fb9d76a69021353d095a63d4f25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify original source private SHA and executable
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          git fetch -q --depth=1 origin "$PRIVATE_SHA"
          git checkout -q --detach "$PRIVATE_SHA"
          test "$(git rev-parse HEAD)" = "$PRIVATE_SHA" || { echo ENRICHED_ORIGINAL_SOURCE_SHA_DRIFT; exit 17; }
          git sparse-checkout set gamepulse/fusion
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_full88_natural_gap_enriched_source_holdout_v1.py
          python3 -m unittest discover -s gamepulse/fusion/tests -p test_igp_full88_p2b_natural_gap_tier_v1.py -q > "$RUNNER_TEMP/qualified-source-unit.log" 2>&1 || { echo ENRICHED_SOURCE_GAP_QUALIFIER_UNIT_FAILED; exit 18; }
          echo ENRICHED_SOURCE_QA_PRIVATE_PINNED_RUN_START
      - name: Study rare neighbor-QA abstentions with source target fully masked
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          dest=gamepulse/fusion/qa/igp_fullx/full88_new17_natural_gap_sparse_source_masked_holdout_20261102.json
          python3 gamepulse/fusion/igp_full88_natural_gap_enriched_source_holdout_v1.py --root . --out "$dest" > "$RUNNER_TEMP/enriched-private.log" 2>&1 || {
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'enriched-private.log').read_text(errors='replace').splitlines()
          error=next((line for line in reversed(lines) if re.match(r'^(ValueError|TypeError|KeyError|FileNotFoundError|AssertionError|IndexError):',line)),None)
          print('ENRICHED_PRIVATE_GAP_SOURCE_ERROR',re.sub(r'[0-9]{4,}','[ID]',error or 'UNKNOWN')[:180])
          PY
            exit 20
          }
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('gamepulse/fusion/qa/igp_fullx/full88_new17_natural_gap_sparse_source_masked_holdout_20261102.json').read_text())
          assert q["games"]==17
          assert q["source_target_XYZ_masked_before_prediction_and_qualification"] is True
          assert q["accepted_default_engine_changed"] is False
          print("FULL88_ORIGINAL_SOURCE_ENRICHED_HOLDOUT_RECONCILED",
                q["candidate_count"]["qualified"],q["source_proxy_single_actor_pass"])
          PY
      - name: Commit source-only evidence into private repository
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          dest=gamepulse/fusion/qa/igp_fullx/full88_new17_natural_gap_sparse_source_masked_holdout_20261102.json
          git add -f "$dest"
          git diff --cached --check
          git commit -qm 'qa(private): sparse-source exact anchor gap blind original XYZ target validation [skip ci]'
          for i in 1 2 3 4 5 6; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH" || exit 27
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo FULL88_ENRICHED_NATURAL_GAP_SOURCE_QA_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$i"
          done
          exit 28
