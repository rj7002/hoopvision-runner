# Reviewed private-only SHA-pinned CPU QA; public logs contain summary counts only.
name: Full107 first81 double-team source-reference QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full107-first81-doubleteam-audit-private-20261104.yml'
      - 'tools/public_content_guard.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  private-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: analysis/full107-first81-doubleteam-validation-20261104
      PRIVATE_TASK_PIN: f6588f043480e683d0d42c034989e9f393a2ba11
      R13_SOURCE_BLOB: ff2c58ffb7078876de220f10ff3ba02afe764be6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Enforce public source protection
        run: python3 tools/public_content_guard.py
      - name: Source-hash and reference audit; outputs private only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          dir="$RUNNER_TEMP/private-full107-81"
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" "https://github.com/$PRIVATE_REPO.git" "$dir"
          test "$(git -C "$dir" rev-parse HEAD)" = "$PRIVATE_TASK_PIN"
          git -C "$dir" sparse-checkout set --no-cone \
            'gamepulse/fusion/analysis/full107_first81_double_team_reference_audit_v1.py' \
            'gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/index.json' \
            'gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/post56_additive_20261028/index.json' \
            'gamepulse/fusion/materialized/igp_all_original_xyz/*/index.json'
          cd "$dir"
          script="gamepulse/fusion/analysis/full107_first81_double_team_reference_audit_v1.py"
          python3 -B "$script" --self-test
          r13="gamepulse/fusion/qa/analysis/igp81_double_team_reboot_r13_oreb_boundary_20261102/all_league_players.json"
          mkdir -p "$(dirname "$r13")"
          gh api "repos/$PRIVATE_REPO/git/blobs/$R13_SOURCE_BLOB" --jq '.content' | tr -d '\n' | base64 --decode > "$r13"
          test "$(git hash-object "$r13")" = "$R13_SOURCE_BLOB"
          result="gamepulse/fusion/qa/analysis/full107_first81_doubleteam_validation_20261104/audit_v1.json"
          python3 -B "$script" --root . --r13 "$r13" --output "$result" > "$RUNNER_TEMP/private_summary.log"
          python3 - "$result" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['cohort_match_81_of_81'] and x['full107_total_games']==107
          assert len(x['original_manifest_crosswalk'])==81
          assert len(x['player_comparisons'])==10
          assert x['promotion_allowed'] is False
          d=x['original_manifest_grades']
          assert sum(d.values())==81
          print("FULL107_FIRST81_SOURCE_AUDIT_COMPLETE",
                "source_exact="+str(d['EXACT_SHA256_SAME_SOURCE']),
                "variants="+str(d['SOURCE_VARIANT_REQUIRES_REPLAY']),
                "missing="+str(d['MISSING_CURRENT_NATIVE_INDEX']))
          print("INDEPENDENT_EVENT_ACCURACY=UNMEASURED")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$result"
          git diff --cached --check
          git commit -q -m "qa(private): Full107 exact81 double-team reference audit [skip ci]"
          for n in 1 2 3 4 5 6; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH"
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo FULL107_FIRST81_PRIVATE_QA_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 1
