# Public opaque control only. Original NBA XYZ/PBP and per-event output NEVER leave private 104.
name: Full88 NCEA original native custody and heldout-control research
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ncea-full88-original-custody-private.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: ncea-full88-original-custody-readonly-20261102
  cancel-in-progress: false
jobs:
  source-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      SOURCE_REF: research/ncea-all88-custody-shadow-20261102
      SOURCE_SHA: 6cfe07ff905b9ecc3fbd702fef26606eb2e470d9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify protected execution boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Source-pinned authenticated private checkout
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$SOURCE_REF" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$SOURCE_SHA"
          test -s "$RUNNER_TEMP/private/gamepulse/fusion/analysis/ncea_full88_source_shadow_v1.py"
      - name: Execute source-free tests then immutable 4616-assist full-native shadow
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 -m py_compile gamepulse/fusion/analysis/ncea_full88_source_shadow_v1.py
          python3 gamepulse/fusion/analysis/ncea_full88_source_shadow_v1.py --self-test
          python3 gamepulse/fusion/analysis/ncea_full88_source_shadow_v1.py
      - name: Enforce exact source census and non-promotion gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("gamepulse/fusion/qa/igp_fullx/ncea_all88_custody_shadow_v1.json")
          z=json.loads(p.read_text())
          c=z["counts"]
          assert z["official_assists"]==4616 and z["games"]==88
          assert c["strict"]==2223 and c["official"]==4616
          assert z["expanded_union"]["n"]==2223+c["new_pairs"]
          assert c["mask_trials"]>0 and c["noncredited_control_trials"]>0
          assert z["new_source_anchors_have_measured_10player_accuracy_gain"] is False
          assert z["promotion"].startswith("RESEARCH_ONLY")
          d=Path("gamepulse/fusion/qa/igp_fullx/ncea_all88_custody_events_v1.jsonl")
          assert sum(1 for _ in d.open())==4616
          print("NCEA_PRIVATE_SOURCE_RECONCILED",z["expanded_union"]["n"],"of",4616,
                "added",c["new_pairs"],"controls",c["noncredited_control_trials"],
                "mask_trials",c["mask_trials"])
          PY
      - name: Persist QA and event-level evidence ONLY to private GitHub
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_fullx/ncea_all88_custody_shadow_v1.json gamepulse/fusion/qa/igp_fullx/ncea_all88_custody_events_v1.jsonl
          git diff --cached --check
          if git diff --cached --quiet; then echo NCEA_PRIVATE_OUTPUT_IDENTICAL; exit 0; fi
          git commit -q -m "qa(private): source-preserving 4616-assist native custody shadow, negative and mask tests"
          for retry in 1 2 3 4; do
            git fetch -q origin "$SOURCE_REF"
            git rebase -q "origin/$SOURCE_REF"
            if git push -q origin "HEAD:refs/heads/$SOURCE_REF"; then echo NCEA_PRIVATE_QA_COMMITTED; exit 0; fi
            sleep "$retry"
          done
          exit 17
