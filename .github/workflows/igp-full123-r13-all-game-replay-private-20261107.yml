name: IGP Full123 original-source R13 eight-game-shard replay
on:
  push:
    branches: [feature/igp-full123-r13-public-cpu-20261107]
    paths: ['.github/workflows/igp-full123-r13-all-game-replay-private-20261107.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-full123-r13-all-native-20261107
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: feature/igp-full123-r13-touch-integration-20261107
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate public content
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Execute original source game-touch R13 with SHA provenance
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/full123-r13-$SHARD"
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$work"
          cd "$work"
          git sparse-checkout set --no-cone \
            '/gamepulse/fusion/*.py' \
            '/gamepulse/fusion/analysis/*.py' \
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/index.json' \
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/post56_additive_20261028/index.json' \
            '/gamepulse/fusion/qa/igp_progress_20261030/igp_full121_default_source_release_v1.json' \
            '/gamepulse/fusion/qa/igp_progress_20261030/full121_original_native_sha_admission/*.json' \
            '/gamepulse/fusion/materialized/igp_all_original_xyz/*/index.json' \
            '/gamepulse/fusion/qa/r13_full123_original_labels_20261107/*.json.gz' \
            '/gamepulse/fusion/qa/r13_full123_original_boxes_20261107/*' \
            '/gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/*.json'
          export PYTHONPATH="$work:$work/gamepulse/fusion:$work/gamepulse/fusion/analysis"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from gamepulse.fusion import igp_full123_r13_touch_overlay_v1 as mod
          ids=mod.original_cohort('.')
          shard=int(os.environ['SHARD'])
          selected=[g for i,g in enumerate(ids) if i%8==shard]
          assert len(ids)==123 and len(selected) in (15,16)
          items=[]
          for gid in selected:
            items.extend((
              f'/gamepulse/fusion/materialized/igp_all_original_xyz/{gid}/*',
              f'/gamepulse/fusion/official_pbp_timing/games/{gid}.json',
              f'/gamepulse/fusion/official_pbp_timing/original_nba_*/{gid}/boxscore.json',
              f'/gamepulse/fusion/evidence/companion_sdk_original_{gid}/sdk_observed_original.json'))
          (Path(os.environ['RUNNER_TEMP'])/'r13-patterns.txt').write_text('\n'.join(items)+'\n')
          print('FULL123_R13_PRIVATE_SHARD_SOURCE_SELECTED',shard,len(selected))
          PY
          mapfile -t paths < "$RUNNER_TEMP/r13-patterns.txt"
          git sparse-checkout add "${paths[@]}"
          python3 -m py_compile gamepulse/fusion/igp_full123_r13_batch_source_v1.py
          python3 gamepulse/fusion/igp_full123_r13_batch_source_v1.py --root . --shard "$SHARD" --shards 8 \
            > "$RUNNER_TEMP/full123-source-$SHARD.private.log" 2>&1
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          shard=int(os.environ['SHARD'])
          p=Path('gamepulse/fusion/qa/r13_full123_touch_overlay_20261107')/f'original_replay_shard_{shard}.json'
          x=json.loads(p.read_text())
          assert x['source_original_modified'] is False
          assert len(x['results'])==len(x['selected_game_ids'])
          print('FULL123_R13_SOURCE_REPLAY_QA',shard,x['source_touch_game_rows_accepted_or_reused'],x['source_touch_game_rows_not_available'])
          PY
          git config user.name 'IGP R13 source-only'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/*.json
          if test -d gamepulse/fusion/qa/r13_full123_original_boxes_20261107; then
            git add --sparse -f gamepulse/fusion/qa/r13_full123_original_boxes_20261107/*.json
          fi
          git diff --cached --check
          if git diff --cached --quiet; then echo FULL123_R13_SHARD_EXISTS; exit 0; fi
          git commit -q -m "data(private): original Full123 R13 game replay shard $SHARD [skip ci]"
          for attempt in $(seq 1 16); do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH"
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then echo FULL123_R13_SHARD_PRIVATE_SAVED; exit 0; fi
            sleep "$attempt"
          done
          exit 39
