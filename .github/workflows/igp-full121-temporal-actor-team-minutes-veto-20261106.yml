# Original NBA XYZ remains in private 104; public logs emit veto counts only.
name: IGP Full121 original actor team/minutes identity veto
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full121-temporal-actor-team-minutes-veto-20261106.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-full121-temporal-actor-team-veto-20261106
  cancel-in-progress: false
jobs:
  safe-identity-veto:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        game: ['0022600160','0022600175']
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public licensed-source boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Source-only veto QA and immutable private receipt
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth=1 --filter=blob:none --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_full121_temporal_actor_team_minutes_veto_v1.py
          python3 gamepulse/fusion/igp_full121_temporal_actor_team_minutes_veto_v1.py --self-test
          path="gamepulse/fusion/qa/igp_progress_20261030/full121_actor_team_minutes_veto_${{ matrix.game }}_20261106.json"
          python3 gamepulse/fusion/igp_full121_temporal_actor_team_minutes_veto_v1.py --root . --game-id "${{ matrix.game }}" --out "$path"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$path"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo FULL121_ACTOR_VETO_QA_ALREADY_VERIFIED
            exit 0
          fi
          git commit -q -m "qa(igp): source-backed team/minutes veto ${{ matrix.game }}"
          for n in $(seq 1 12); do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo FULL121_ACTOR_VETO_QA_PRIVATE_COMMITTED game=${{ matrix.game }}
              exit 0
            fi
            sleep "$((n*2))"
          done
          exit 35
