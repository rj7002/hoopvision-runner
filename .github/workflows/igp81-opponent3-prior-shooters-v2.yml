name: IGP81 opponent 3PT previous season shooter quality vs shooting variance V2
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/igp81-opponent3-prior-shooters-v2.yml
      - tools/public_content_guard.py
      - tools/licensed_feed/igp81_opponent3_prior_shooters_v2.py
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp81-opponent3-shooter-prior-v2
  cancel-in-progress: false
jobs:
  nba-historical-2025-and-original-81-private:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      SOURCE: research/igp81-all-layers-source-grade-20261101
      QA_BRANCH: analysis/igp81-opponent3-luck-v1-20261101
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public security, CPU and source-free regression gate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          python3 -m py_compile tools/licensed_feed/igp81_opponent3_luck_source_audit_v1.py tools/licensed_feed/igp81_opponent3_prior_shooters_v2.py
          python3 tools/licensed_feed/igp81_opponent3_prior_shooters_v2.py --self-test
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          gh auth setup-git
      - name: Fetch and lock public historical NBA API 2025-26 player regular-season data
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth=1 --filter=blob:none --sparse             https://github.com/EasySportsApps/nba_api_25_26_data.git "$RUNNER_TEMP/previous-public"
          git -C "$RUNNER_TEMP/previous-public" fetch -q --depth=1 origin f785bb34415b2bf4c80614dcfa4a305cc9969ee5
          git -C "$RUNNER_TEMP/previous-public" checkout -q f785bb34415b2bf4c80614dcfa4a305cc9969ee5
          git -C "$RUNNER_TEMP/previous-public" sparse-checkout set --no-cone nba_players_regular_season_25_26_wide_data.csv
          test "$(git -C "$RUNNER_TEMP/previous-public" hash-object nba_players_regular_season_25_26_wide_data.csv)" = 2981602d588393a26bdd8f6321a2da91c016283a
          echo FULL81_PREVIOUS_2025_26_SHOOTING_PUBLIC_SOURCE_BLOB_PINNED
      - name: Load full81 original private official PBP and original Blueprint source manifests
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth=1 --filter=blob:none --sparse -b "$SOURCE"             https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set             data/extensions/nba_blueprint_2026_27/games             gamepulse/fusion/official_pbp_timing/games             gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/shot_biomechanics_all81_v1
      - name: Historical expected three-point rate and good shooter / low shooter selection audit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/licensed_feed/igp81_opponent3_prior_shooters_v2.py             --root "$RUNNER_TEMP/private"             --prior "$RUNNER_TEMP/previous-public/nba_players_regular_season_25_26_wide_data.csv"             --output "$RUNNER_TEMP/igp81_opponent3_historical_v2.json"
      - name: Immutable private aggregate QA receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess
          raw=(pathlib.Path(os.environ["RUNNER_TEMP"])/"igp81_opponent3_historical_v2.json").read_bytes()
          d=json.loads(raw)
          assert d["original_FULL81_3pa"]==6094 and d["original_FULL81_games"]==81
          assert d["original_FULL81_teams"]==30
          addr="repos/timeedmonds-maker/104/contents/gamepulse/fusion/qa/analysis/igp81_opponent3_historical_shooter_prior_v2.json"
          branch=os.environ["QA_BRANCH"]
          old=subprocess.run(["gh","api",addr+"?ref="+branch],text=True,capture_output=True)
          if old.returncode==0:
              if base64.b64decode(json.loads(old.stdout)["content"])==raw:
                  print("V2_PRIVATE_QA_ALREADY_IDENTICAL")
                  raise SystemExit(0)
              raise RuntimeError("DO_NOT_MUTATE_EXISTING_VERSION_QA")
          body={"branch":branch,"content":base64.b64encode(raw).decode(),
                "message":"qa(private): original FULL81 and pre-season 2025-26 shooter-quality V2 audit [skip ci]"}
          res=subprocess.run(["gh","api","-X","PUT",addr,"--input","-"],text=True,capture_output=True,input=json.dumps(body))
          if res.returncode:raise RuntimeError("V2_PRIVATE_QA_COMMIT_FAILED")
          print("V2_PRIVATE_QA_COMMIT",json.loads(res.stdout)["commit"]["sha"])
          PY
