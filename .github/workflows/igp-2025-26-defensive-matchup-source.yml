name: IGP 2025-26 archived NBA defensive matchup source
on:
  push:
    branches: [main]
    paths: [.github/workflows/igp-2025-26-defensive-matchup-source.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-historical-2025-26-public-defensive-matchups
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Reuse immutable archive game inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          if gh api repos/timeedmonds-maker/104 --jq .full_name >/dev/null 2>&1; then echo HISTORICAL_PRIVATE_REPO_TOKEN_VISIBLE; else echo HISTORICAL_PRIVATE_REPO_TOKEN_DENIED; exit 39; fi
          if gh api repos/timeedmonds-maker/104/releases/tags/igp-public-gamepulse-2025-26-20261105 --jq .id >/dev/null 2>&1; then echo HISTORICAL_PRIVATE_RELEASE_TOKEN_VISIBLE; else echo HISTORICAL_PRIVATE_RELEASE_TOKEN_DENIED; exit 40; fi
          mkdir -p "$RUNNER_TEMP/historical"
          for attempt in 1 2 3 4; do
            if gh release download igp-public-gamepulse-2025-26-20261105 --repo timeedmonds-maker/104 \
              --pattern nba-2025-26-source-index.json --dir "$RUNNER_TEMP/historical"; then break; fi
            sleep "$attempt"
          done
          test -s "$RUNNER_TEMP/historical/nba-2025-26-source-index.json"
      - name: Recover original NBA historical shooter-defender matchup counts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections,concurrent.futures,gzip,hashlib,json,os,pathlib,time,urllib.error,urllib.parse,urllib.request
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"historical"
          index=json.loads((root/"nba-2025-26-source-index.json").read_text())
          assert index["source_zip_sha256"]=="2450b2fafb66698b39a89592c6ac3767c7ba0c3e4581b1a65042041e0f7ea0b0"
          games=sorted(gid for gid,g in index["games"].items() if g["tracking"])
          assert len(games)==666
          headers={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36","Referer":"https://www.nba.com/","Origin":"https://www.nba.com","Accept":"application/json"}
          def fetch(gid):
              url="https://stats.gleague.nba.com/stats/defensiveboxscore?"+urllib.parse.urlencode({"GameID":gid})
              last=None
              for trial in range(5):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=35) as f:
                          payload=json.load(f)
                      rows=(payload.get("payload") or {}).get("defensiveBoxScore")
                      if not isinstance(rows,list):raise ValueError("MATCHUP_LIST_MISSING")
                      return gid,rows,None
                  except urllib.error.HTTPError as e:last="HTTP_"+str(e.code)
                  except (urllib.error.URLError,TimeoutError):last="NETWORK_TIMEOUT"
                  except (ValueError,json.JSONDecodeError) as e:last=type(e).__name__
                  time.sleep(min(8,0.7*2**trial))
              return gid,None,last
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              results=list(pool.map(fetch,games))
          counts=collections.Counter();failures=[];pergame={}
          path=root/"nba-2025-26-defensive-matchups.jsonl.gz"
          with path.open("wb") as f,gzip.GzipFile(fileobj=f,mode="wb",mtime=0,filename="") as out:
              for gid,rows,error in results:
                  if error:failures.append({"game_id":gid,"error_class":error});continue
                  counts["games_with_response"]+=1
                  counts["matchup_rows"]+=len(rows)
                  counts["games_with_matchups"]+=int(bool(rows))
                  counts["matched_shooter_defender_fga"]+=sum(int(x.get("fieldGoalAttempts") or 0) for x in rows if isinstance(x,dict))
                  pergame[gid]={"matchup_rows":len(rows),"fga":sum(int(x.get("fieldGoalAttempts") or 0) for x in rows if isinstance(x,dict))}
                  out.write((json.dumps({"game_id":gid,"source_rows":rows},sort_keys=True,separators=(",",":"))+"\n").encode())
          qa={"schema":"igp.2025-26.public-defensive-matchup-source.v1",
              "source":"https://stats.gleague.nba.com/stats/defensiveboxscore",
              "tracking_games":len(games),"counts":dict(counts),"per_game":pergame,
              "failures":failures,"source_rows_sha256":hashlib.sha256(path.read_bytes()).hexdigest(),
              "game_level_matchup_not_per_shot_defender":True}
          (root/"nba-2025-26-defensive-matchups-qa.json").write_text(json.dumps(qa,sort_keys=True,indent=2)+"\n")
          print("HISTORICAL_DEFENDER_MATCHUP_SOURCE_ALL_GAMES",json.dumps({"tracking_games":len(games),"counts":dict(counts),"failed_games":len(failures),"error_classes":dict(collections.Counter(x["error_class"] for x in failures))},sort_keys=True))
          PY
      - name: Preserve matchup source and QA exclusively in private 104
        shell: bash
        run: |
          set -euo pipefail
          TAG=igp-2025-26-defensive-matchup-source-20261105
          REPO=timeedmonds-maker/104
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --target main --draft \
              --title '2025-26 NBA defensive shooter-matchup source for archived games' \
              --notes 'Original public NBA defensiveboxscore game-level shooter-defender matchup records. Not an observed per-shot defender ID or a causal xFG effect.'
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/historical/nba-2025-26-defensive-matchups.jsonl.gz" \
            "$RUNNER_TEMP/historical/nba-2025-26-defensive-matchups-qa.json" --repo "$REPO" --clobber
          gh release edit "$TAG" --repo "$REPO" --draft=false
          echo HISTORICAL_DEFENSIVE_MATCHUP_SOURCE_PRIVATE_RECEIPT
