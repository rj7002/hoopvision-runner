name: R13 official NBA GitHub snapshot count QA (private)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r13-official-snapshot-qa-private-20261104.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: research/r13-github-official-touch-snapshots-20261104
      PRIVATE_PIN: 32834ef65cd4a4426182d6e91164f88dff001cbe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve public/private confidentiality guard
        run: python3 tools/public_content_guard.py
      - name: SHA-pinned private R13 official NBA per-game reference QA
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, sys
          repo=os.environ["PRIVATE_REPO"]
          ref=os.environ["PRIVATE_PIN"]
          branch=os.environ["PRIVATE_BRANCH"]
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"r13_official_nba"
          root.mkdir()
          def get(path):
              url=f"repos/{repo}/contents/{path}?ref={ref}"
              d=json.loads(subprocess.check_output(["gh","api",url],stderr=subprocess.DEVNULL))
              if d.get("content"):
                  raw=base64.b64decode(d["content"])
              else:
                  blob=json.loads(subprocess.check_output(
                      ["gh","api",f"repos/{repo}/git/blobs/{d['sha']}"],stderr=subprocess.DEVNULL))
                  raw=base64.b64decode(blob["content"])
              gitsha=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
              assert gitsha==d["sha"],"PRIVATE_BLOB_SHA_MISMATCH"
              return raw
          script=root/"qa.py"
          script.write_bytes(get("gamepulse/fusion/analysis/nba_github_snapshot_touch_qa_v1.py"))
          data=root/"nba_touch.json"
          data.write_bytes(get("gamepulse/fusion/benchmarks/nba_2026_27_github_snapshot_touch_game_deltas_v1.json"))
          importer=root/"importer.py"
          importer.write_bytes(get("gamepulse/fusion/analysis/nba_github_snapshot_touch_import_v1.py"))
          reproduced=root/"reproduced.json"
          rep=subprocess.run([sys.executable,str(importer),"--output",str(reproduced)],
                             capture_output=True,text=True)
          if rep.returncode:
              print("NBA_GITHUB_REPRODUCTION_FAILED")
              sys.exit(1)
          original=json.loads(data.read_text())
          rebuilt=json.loads(reproduced.read_text())
          assert rebuilt["released_game_count"]==original["released_game_count"]==107
          assert rebuilt["qualified_both_teams_games"]==original["qualified_both_teams_games"]==68
          assert rebuilt["exact_team_game_references"]==original["exact_team_game_references"]==151
          assert original["schedule_git_blob_sha"]==rebuilt["schedule_git_blob_sha"]
          for gid,g in original["games"].items():
              compare=rebuilt["games"].get(gid)
              assert compare and set(g["teams"])==set(compare["teams"]),"GAME_TEAM_DRIFT"
              for tid,t in g["teams"].items():
                  rec=compare["teams"][tid]
                  assert rec["status"]==t["status"],"GAME_SOURCE_GRADE_DRIFT"
                  if t["status"]=="EXACT_SINGLE_GAME_COUNT_DIFF":
                      assert rec["players"]==t["players"],"PLAYER_GAME_COUNTS_DRIFT"
                      assert rec["team_totals"]==t["team_totals"],"TEAM_GAME_COUNTS_DRIFT"
          print("NBA_GITHUB_HISTORICAL_SNAPSHOT_REPRODUCTION_PASSED")
          output=root/"qa_result.json"
          p=subprocess.run([sys.executable,str(script),"--ledger",str(data),"--output",str(output)],
                           capture_output=True,text=True)
          if p.returncode:
              print("PRIVATE_R13_REFERENCE_QA_FAILED")
              sys.exit(1)
          result=json.loads(output.read_text())
          assert result["validated_source_games"]==107
          assert result["qualified_both_team_games"]==68
          assert result["exact_team_game_references"]==151
          assert result["bucks_seven_player_independent_reference"]=="PASSED"
          assert result["global_r13_promotion_allowed"] is False
          out={
            "qa":result,"private_pin":ref,
            "reference_source_git_blob_sha":hashlib.sha1(
              b"blob "+str(data.stat().st_size).encode()+b"\0"+data.read_bytes()).hexdigest(),
            "does_not_modify_r13":True,
            "runner": "OPAQUE_PUBLIC_BRIDGE_PRIVATE_RESULT"
          }
          endpoint=f"repos/{repo}/contents/gamepulse/fusion/qa/r13_github_official_touch_20261104/qa_run_v1.json"
          old=subprocess.run(["gh","api",endpoint+"?ref="+branch],capture_output=True,text=True)
          body={"branch":branch,"message":"qa(r13): pinned GitHub official NBA count reference validation [skip ci]",
                "content":base64.b64encode((json.dumps(out,indent=2,sort_keys=True)+"\n").encode()).decode()}
          if old.returncode==0: body["sha"]=json.loads(old.stdout)["sha"]
          subprocess.run(["gh","api","-X","PUT",endpoint,"--input","-"],input=json.dumps(body),
                         capture_output=True,text=True,check=True)
          print("R13_OFFICIAL_GITHUB_COUNTS_QA_PASSED games=107 two_sided=68 team_games=151")
          PY
