# SHA-pinned four-game native-player/ball and archived original lastTouch replay.
# Source and output remain in authenticated private 104; public logs are aggregate only.
name: Full107 first81 R13v2 frontcourt-ever double replay (private)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full107-first81-r13v2-double-touchjoin-private-20261104.yml'
      - 'tools/public_content_guard.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  pilot:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {gid: '0022600021', sha: '5a8f5332a96b9b748539cf863aefb2dd03ff9abf'}
          - {gid: '0022600091', sha: 'a8d07901d90bae453f020ed5d5bb09431ce306f7'}
          - {gid: '0022600125', sha: 'd930b26551c140499cb4723c23dc5071d99d61'}
          - {gid: '0022600138', sha: '4510ed020705a4bf9d425faf02d78b29a52354a8'}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PIN: 9fe4f4f7a09cd10fe78d46cb1cebb9b5f44f0840
      BRANCH: analysis/full107-first81-r13v2-touchjoin-20261104
      REPO: timeedmonds-maker/104
      GID: ${{ matrix.gid }}
      LABEL_BLOB: ${{ matrix.sha }}
      OUTDIR: gamepulse/fusion/qa/analysis/igp_first81_r13v2_frontcourt_ever_double_pilot_20261104
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public content guard
        run: python3 tools/public_content_guard.py
      - name: Original source plus newer touch replay; private evidence only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$BRANCH" \
            "https://github.com/$REPO.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PIN"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PIN"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PIN"
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion/analysis:gamepulse/fusion
          script="gamepulse/fusion/analysis/r17_first81_r13v2_frontcourt_ever_double_source_pilot_20261104.py"
          python3 -B "$script" --selftest
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess
          path=f'gamepulse/fusion/qa/r13_github_official_touch_20261104/{os.environ["GID"]}_native_labels.json.gz'
          url=f'repos/{os.environ["REPO"]}/contents/{path}?ref=research/r13-github-official-touch-snapshots-20261104'
          item=json.loads(subprocess.check_output(['gh','api',url],stderr=subprocess.DEVNULL))
          assert item['sha']==os.environ['LABEL_BLOB'], 'SOURCE_ORIGINAL_LABEL_SHA_CHANGED'
          raw=base64.b64decode(item['content'])
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'original_native_labels.json.gz'
          p.write_bytes(raw)
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()==os.environ['LABEL_BLOB']
          print('ORIGINAL_LASTTOUCH_SHA_VERIFIED',os.environ['GID'])
          PY
          out="$RUNNER_TEMP/result.json"
          if python3 -B "$script" --root . --game-id "$GID" \
              --labels "$RUNNER_TEMP/original_native_labels.json.gz" \
              --out "$out" > "$RUNNER_TEMP/qa-stdout" 2> "$RUNNER_TEMP/qa-stderr"; then
            python3 - "$out" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['original_source_modified'] is False
          assert r['game_id'] in ("0022600021","0022600091","0022600125","0022600138")
          assert r['promotion_allowed'] is False and r['independent_precision'] is None
          assert r['r13_v2_touch_count'] >= 0
          print('R13_V2_ORIGINAL_FC_EVER_REPLAY_PASS',r['game_id'],r['r13_v2_touch_count'])
          PY
          else
            python3 - <<'PY'
          import base64,json,os,subprocess,time,pathlib
          path=f'repos/{os.environ["REPO"]}/contents/{os.environ["OUTDIR"]}/private_diagnostic_{os.environ["GID"]}.json'
          data={"game_id":os.environ['GID'],"status":"PRIVATE_SOURCE_REPLAY_FAILED",
                "stderr_private":(pathlib.Path(os.environ['RUNNER_TEMP'])/'qa-stderr').read_text()[-14000:]}
          body={"branch":os.environ['BRANCH'],"message":"qa(private): original touch-join diagnostic [skip ci]",
                "content":base64.b64encode(json.dumps(data).encode()).decode()}
          old=subprocess.run(['gh','api',path+'?ref='+os.environ['BRANCH']],capture_output=True,text=True)
          if old.returncode==0:body['sha']=json.loads(old.stdout)['sha']
          saved=subprocess.run(['gh','api','-X','PUT',path,'--input','-'],input=json.dumps(body),capture_output=True,text=True)
          assert saved.returncode==0,"PRIVATE_DIAGNOSTIC_WRITE_FAILED"
          PY
            echo R13_V2_PRIVATE_DIAGNOSTIC_SAVED
            exit 1
          fi
          python3 - "$out" <<'PY'
          import base64,json,os,subprocess,time,sys
          data=open(sys.argv[1],'rb').read()
          path=f'repos/{os.environ["REPO"]}/contents/{os.environ["OUTDIR"]}/game_{os.environ["GID"]}.json'
          body={"branch":os.environ['BRANCH'],"message":"qa(private): matched R13v2 FC-ever source and doubles [skip ci]",
                "content":base64.b64encode(data).decode()}
          for attempt in range(10):
              old=subprocess.run(['gh','api',path+'?ref='+os.environ['BRANCH']],capture_output=True,text=True)
              req=dict(body)
              if old.returncode==0:req['sha']=json.loads(old.stdout)['sha']
              res=subprocess.run(['gh','api','-X','PUT',path,'--input','-'],
                                 input=json.dumps(req),capture_output=True,text=True)
              if res.returncode==0:
                  print('R13_V2_NATIVE_SOURCE_DOUBLE_PRIVATE_RESULT_PERSISTED',os.environ['GID'])
                  break
              time.sleep(1+attempt)
          else:raise RuntimeError('PRIVATE_RESULT_WRITE_FAILED')
          PY
