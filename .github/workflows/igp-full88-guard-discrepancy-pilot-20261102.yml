# Opaque public bridge. Private source only; first run after exact path guard review.
name: Full88 guard discrepancy complete private source audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full88-guard-discrepancy-pilot-20261102.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-full88-guard-forensic-pilot-20261102
  cancel-in-progress: false
jobs:
  private-source-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/igp-full92-guard-source-forensic-20261102
      PRIVATE_SHA: e59fb014dd64be69230872ca35b3453bc21aea22
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate public boundary and private source pin
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          test "$(git rev-parse HEAD)" = "$PRIVATE_SHA" || { echo IGP_FORENSIC_PRIVATE_SHA_DRIFT; exit 20; }
          git sparse-checkout set gamepulse/fusion
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_full88_guard_discrepancy_forensic_v1.py
          echo IGP_FORENSIC_PRIVATE_SOURCE_PIN_PASS
      - name: Replay all 88 original NBA games in four serial partitions
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          for part in 0 1 2 3; do
            target="gamepulse/fusion/qa/igp_fullx/full88_guard_forensic_shard_${part}.json"
            python3 gamepulse/fusion/igp_full88_guard_discrepancy_forensic_v1.py --root . --shard "$part" --out "$target" > "$RUNNER_TEMP/forensic-private-${part}.log" 2>&1 || {
              echo IGP_FORENSIC_PRIVATE_SHARD_FAILED "$part"
              exit 21
            }
            echo IGP_FORENSIC_PRIVATE_SHARD_PASS "$part"
          done
          target=gamepulse/fusion/qa/igp_fullx/full88_guard_forensic_all88.json
          python3 gamepulse/fusion/igp_full88_guard_discrepancy_forensic_v1.py --root . --reduce --out "$target" > "$RUNNER_TEMP/forensic-private-reduce.log" 2>&1 || {
            echo IGP_FORENSIC_PRIVATE_REDUCTION_FAILED
            exit 22
          }
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('gamepulse/fusion/qa/igp_fullx/full88_guard_forensic_all88.json').read_text())
          assert q['scope']=='full88' and q['discrepancy_scenes']==2448
          assert len(q['games'])==88 and q['default_changed'] is False
          assert sum(q['root_cause_classes'].values())==2448
          print('IGP_FORENSIC_PRIVATE_FULL88_PASS',json.dumps(q['root_cause_classes'],sort_keys=True))
          PY
      - name: Commit detailed evidence to private isolated branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          target=gamepulse/fusion/qa/igp_fullx/full88_guard_forensic_all88.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$target" gamepulse/fusion/qa/igp_fullx/full88_guard_forensic_shard_*.json
          git diff --cached --check
          git commit -qm 'qa(private): SHA original 88 game guard discrepancy root causes [skip ci]'
          git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"
          echo IGP_FORENSIC_PRIVATE_EVIDENCE_COMMITTED
