# Public GitHub runner orchestrates opaque private source; no NBA source XYZ leaves 104.
name: Full88 P2B source-qualified single official player exact gated acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full88-single-source-qualified-private-20261102.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  private-source-grade:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/igp-p2b-natural-gap-20261102
      PRIVATE_SHA: c3aad8053ff1c32c80cafeef8e8e8b32d73a0596
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify safe original-source private SHA and holdout gates
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          git fetch -q --depth=1 origin "$PRIVATE_SHA"
          git checkout -q --detach "$PRIVATE_SHA"
          test "$(git rev-parse HEAD)" = "$PRIVATE_SHA" || { echo SINGLE_SOURCE_PRIVATE_SHA_NOT_PINNED; exit 17; }
          git sparse-checkout set gamepulse/fusion
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_full88_p2b_source_grade_single_acceptance_v1.py
          for suite in test_igp_full88_p2b_natural_gap_tier_v1.py test_igp_full88_p2b_natural_gap_entry_v1.py test_igp_full88_default_engine_v3.py; do
            python3 -m unittest discover -s gamepulse/fusion/tests -p "$suite" -q > "$RUNNER_TEMP/$suite.log" 2>&1 || {
              echo SINGLE_SOURCE_ORIGINAL_MODEL_REGRESSION_FAILED
              exit 18
            }
          done
          echo SINGLE_PLAYER_SOURCE_GRADE_GATE_PINNED_PRIVATE_UNIT_OK
      - name: Replay full88 original source and disjoint validated one-player marginal set
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          dest=gamepulse/fusion/qa/igp_fullx/full88_source_grade_limited_single_20261102.json
          python3 gamepulse/fusion/igp_full88_p2b_source_grade_single_acceptance_v1.py --root . --out "$dest" > "$RUNNER_TEMP/single-source-private.log" 2>&1 || {
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'single-source-private.log').read_text(errors='replace').splitlines()
          error=next((line for line in reversed(lines) if re.match(r'^(ValueError|TypeError|KeyError|FileNotFoundError|AssertionError|IndexError|AttributeError):',line)),None)
          print('SOURCE_SINGLE_ACCEPTANCE_ERROR',re.sub(r'[0-9]{4,}','[ID]',error or 'UNKNOWN')[:170])
          PY
            exit 20
          }
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('gamepulse/fusion/qa/igp_fullx/full88_source_grade_limited_single_20261102.json').read_text())
          assert q['games']==88
          assert q['frozen_default_source_grade_complete']==1280963
          assert q['single_source_candidate_research_qualified']>0
          assert q['independent_video_identity_or_ground_truth_position_certified'] is False
          assert q['original_source_PBP_team_POSS_mutated'] is False
          print('FULL88_ORIGINAL_SOURCE_SINGLE_GRADE_VALIDATED',q['single_source_candidate_research_qualified'],
                q['hypothetical_source_grade_single_only_pct'])
          PY
      - name: Commit only exact source grade QA privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          dest=gamepulse/fusion/qa/igp_fullx/full88_source_grade_limited_single_20261102.json
          git add -f "$dest"
          git diff --cached --check
          git commit -qm 'qa(private): source-qualified single actor natural P2B full88 gate [skip ci]'
          for n in 1 2 3 4 5 6; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH" || exit 27
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo FULL88_SINGLE_SOURCE_ACCEPTANCE_QA_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$n"
          done
          exit 28
