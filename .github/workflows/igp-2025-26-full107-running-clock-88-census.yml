# Licensed XYZ never exposed; only source-hash-verified counts and private per-game receipts.
name: IGP historical 666game Full107 running-clock >=88 census
'on':
  push:
    branches: [main]
    paths: [.github/workflows/igp-2025-26-full107-running-clock-88-census.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-historical-666-running-clock
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
  SOURCE_RELEASE: igp-public-gamepulse-2025-26-20261105
  DERIVED_RELEASE: igp-2025-26-full107-native-20261105
  PRIVATE_BRANCH: research/gamepulse-clock-boundary-integrity-20261025
jobs:
  shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ['001','002','003','004','005','006','007','008','009','010','011','012','013','014','015']
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Assert public privacy guard and private clock script SHA
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set --no-cone \
            gamepulse/fusion/igp_2025_26_full107_running_clock_census_v1.py \
            gamepulse/fusion/igp_full107_native_historical_2025_26_v1.py \
            gamepulse/fusion/igp_native_scene_model_v2.py \
            gamepulse/fusion/igp_historical_defender_proxy_v1.py \
            gamepulse/fusion/igp_tracking_model_a_holdout_2026.py \
            gamepulse/fusion/igp_tracking_model_b_holdout_2026.py \
            gamepulse/fusion/igp_tracking_model_c0_endpoint_velocity_bridge_2026.py
          test "$(git -C "$RUNNER_TEMP/private" hash-object gamepulse/fusion/igp_2025_26_full107_running_clock_census_v1.py)" = ecf28a75d41ca3dc8384ee216d47f164c1d0bd03
          python3 -m py_compile "$RUNNER_TEMP/private/gamepulse/fusion/igp_2025_26_full107_running_clock_census_v1.py"
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/derived" "$RUNNER_TEMP/qa"
      - name: Download immutable historical archive shard and already-computed Full107 overlay
        run: |
          set -euo pipefail
          retry() {
            local label="$1"; shift
            local n=0 reset now delay
            until "$@"; do
              n=$((n+1))
              if test "$n" -ge 28; then echo "CLOCK_666_RELEASE_READ_EXHAUSTED asset=$label"; return 43; fi
              now=$(date +%s)
              reset=$(gh api rate_limit --jq '.resources.core.reset' 2>/dev/null || :)
              if [[ "$reset" =~ ^[0-9]+$ ]] && test "$reset" -gt "$now"; then
                delay=$((reset-now+20))
                if test "$delay" -gt 600; then delay=600; fi
              else
                delay=$((n*65))
                if test "$delay" -gt 450; then delay=450; fi
              fi
              echo "CLOCK_666_PRIVATE_ASSET_RETRY label=$label attempt=$n sleep_seconds=$delay"
              sleep "$delay"
            done
          }
          retry "source_$SHARD" gh release download "$SOURCE_RELEASE" --repo timeedmonds-maker/104 --pattern nba-2025-26-source-index.json --pattern "nba-2025-26-shard-$SHARD.zip" --dir "$RUNNER_TEMP/source" --clobber
          retry "native_$SHARD" gh release download "$DERIVED_RELEASE" --repo timeedmonds-maker/104 --pattern "full107-native-nba-2025-26-shard-$SHARD-qa.json" --pattern "full107-native-nba-2025-26-shard-$SHARD.jsonl.gz" --dir "$RUNNER_TEMP/derived" --clobber
          for f in "$RUNNER_TEMP/source/nba-2025-26-source-index.json" "$RUNNER_TEMP/source/nba-2025-26-shard-$SHARD.zip" "$RUNNER_TEMP/derived/full107-native-nba-2025-26-shard-$SHARD-qa.json" "$RUNNER_TEMP/derived/full107-native-nba-2025-26-shard-$SHARD.jsonl.gz"; do test -s "$f"; done
      - name: Source-hash-verified Full107 scene completion for original clock-running timestamps
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/private/gamepulse/fusion"
          python3 "$RUNNER_TEMP/private/gamepulse/fusion/igp_2025_26_full107_running_clock_census_v1.py" \
            --index "$RUNNER_TEMP/source/nba-2025-26-source-index.json" \
            --shard "$RUNNER_TEMP/source/nba-2025-26-shard-$SHARD.zip" \
            --overlay "$RUNNER_TEMP/derived/full107-native-nba-2025-26-shard-$SHARD.jsonl.gz" \
            --qa "$RUNNER_TEMP/derived/full107-native-nba-2025-26-shard-$SHARD-qa.json" \
            --out "$RUNNER_TEMP/qa/historical-clock-full107-shard-$SHARD.json"
          echo HISTORICAL_CLOCK_RECONCILED_SHARD_"$SHARD"
      - name: Upload game-by-game clock result to private source repo only
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 24); do
            if gh release upload "$DERIVED_RELEASE" "$RUNNER_TEMP/qa/historical-clock-full107-shard-$SHARD.json" --repo timeedmonds-maker/104 --clobber; then ok=1;break; fi
            echo "CLOCK_666_PRIVATE_UPLOAD_RETRY shard=$SHARD attempt=$n"
            sleep 180
          done
          test "$ok" -eq 1
          echo HISTORICAL_CLOCK_PRIVATE_RECEIPT_"$SHARD"
  reduce:
    needs: shard
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Retrieve all 15 source-verified per-game clock receipts
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          mkdir -p "$RUNNER_TEMP/qa"
          ok=0
          for n in $(seq 1 24); do
            if gh release download "$DERIVED_RELEASE" --repo timeedmonds-maker/104 --pattern 'historical-clock-full107-shard-*.json' --dir "$RUNNER_TEMP/qa" --clobber &&
                 test "$(find "$RUNNER_TEMP/qa" -name 'historical-clock-full107-shard-*.json' | wc -l)" -eq 15; then ok=1;break;fi
            echo "CLOCK_666_REDUCE_PRIVATE_READ_RETRY attempt=$n"
            sleep 240
          done
          test "$ok" -eq 1
      - name: Sum 666-game running-clock coverage by explicit selector and exact 88 threshold
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections,json,os,pathlib
          d=pathlib.Path(os.environ['RUNNER_TEMP'])/'qa'
          files=sorted(d.glob('historical-clock-full107-shard-*.json'))
          assert len(files)==15
          totals=collections.Counter();methods=collections.defaultdict(collections.Counter)
          games={};shards=set();source_sha=None
          for f in files:
            r=json.loads(f.read_text())
            assert r['schema']=='igp.historical-full107-running-clock-completeness-2025-26.v1'
            assert r['physical_position_accuracy_certified'] is False
            assert r['shard'] not in shards
            shards.add(r['shard'])
            if source_sha is None:source_sha=r['source_sha256']
            assert source_sha==r['source_sha256']
            assert not (games.keys() & r['per_game'].keys())
            games.update(r['per_game'])
            totals.update(r['counts'])
            for k,v in r['selection_totals'].items():methods[k].update(v)
          assert len(games)==666 and len(shards)==15
          assert totals['source_native_frames']==19440900
          assert totals['native_engine_complete_ten_ball']==9392952
          assert totals['source_direct_complete_ten_ball']==5895277
          summary={}
          for selector,v in methods.items():
            if v['eligible']:
              assert v['eligible']==sum(g['selection'][selector].get('eligible',0) for g in games.values())
              assert v['complete']==sum(g['selection'][selector].get('complete',0) for g in games.values())
            ranking=[]; no_clock=0
            for gid,g in games.items():
              q=g['selection'][selector]
              den=q.get('eligible',0);num=q.get('complete',0)
              assert 0<=num<=den
              if den==0:no_clock+=1;continue
              ranking.append({'game_id':gid,'eligible':den,'complete':num,'coverage_pct':round(100*num/den,5)})
            ranking.sort(key=lambda x:(-x['coverage_pct'],x['game_id']))
            qualifying=[x for x in ranking if x['complete']*100>=88*x['eligible']]
            summary[selector]={
              'games_eligible':len(ranking),'games_no_eligible_clock':no_clock,
              'eligible_frames':v['eligible'],'complete_frames':v['complete'],
              'direct_complete_frames':v['direct_complete'],
              'aggregate_coverage_pct':round(100*v['complete']/v['eligible'],6) if v['eligible'] else None,
              'count_at_least_88_pct':len(qualifying),
              'count_at_least_88_3273_pct':sum(x['complete']*1000000>=883273*x['eligible'] for x in ranking),
              'count_at_least_90_pct':sum(x['complete']*10>=9*x['eligible'] for x in ranking),
              'qualifying_88_games':qualifying,'highest_coverage_games':ranking[:15]}
          receipt={'schema':'igp.historical-2025-26-full107-666game-running-clock-88-result.v1',
            'status':'SOURCE_CLOCK_PROXY_NOT_2026_27_STRICT_OFFICIAL_TEN_S1_EQUIVALENT',
            'source_sha256':source_sha,'shards':len(shards),'games':len(games),
            'native_count_reconciliation':dict(totals),
            'physical_position_accuracy_certified':False,
            'official_lineup_grade':'SOURCE_PROVISIONAL_NOT_OFFICIALLY_VERIFIED',
            'methods':summary,
            'per_game':{g:x['selection'] for g,x in sorted(games.items())}}
          out=d/'historical-clock-full107-all666-88-census.json'
          out.write_text(json.dumps(receipt,sort_keys=True,separators=(',',':'))+'\n')
          print('HISTORICAL_FULL107_666_GAME_RUNNING_CLOCK_THRESHOLD_RESULT',
            json.dumps({'games':len(games),'clock_source_nonnul':totals['original_game_clock_nonnull'],
              'methods':{k:{q:value for q,value in x.items() if q not in ('qualifying_88_games','highest_coverage_games')}
              for k,x in summary.items()}},sort_keys=True))
          PY
      - name: Save exact 666-game report in protected Full107 release
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 24); do
            if gh release upload "$DERIVED_RELEASE" "$RUNNER_TEMP/qa/historical-clock-full107-all666-88-census.json" --repo timeedmonds-maker/104 --clobber; then ok=1;break;fi
            echo "CLOCK_666_AGGREGATE_PRIVATE_UPLOAD_RETRY attempt=$n"
            sleep 180
          done
          test "$ok" -eq 1
          echo HISTORICAL_FULL107_RUNNING_CLOCK_666_GAME_88_CENSUS_PRIVATE_SUCCESS
