# User-labeled Wembanyama screen: source-only 4.5s predrive screen feature audit.
# Exact clips.nba source event audit for candidate possessions.
# Temporal event run after HMM-informed source-first implementation; no coordinates in public logs.
# CPU pilot tests original official ten-plus-ball sensitivity at gap bounds 350/500/800/1200ms.
# Bounded 350ms direct-source sampling: official ten+ball, extra NBA actors ignored.
# Fail closed if NBA logical possession owners are not mapped to their official team IDs.
# Pilot source fix: exclude roster IDs lacking original official two-team assignment.
# Re-run after guarded public-to-private workflow allowlist approval (2026-11-06).
name: IGP isolation blowby private NBA pilot CPU
on:
  push:
    branches: [research/igp-strict-isolation-blowby-cpu-20261106]
    paths: ['.github/workflows/igp-isolation-blowby-private-cpu.yml']
permissions:
  contents: read
jobs:
  run-source-graded:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/igp-blowby-full121-full666-20261106
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify confidentiality
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Private 5v5 source-free tests and real Rockets source pilot
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          git sparse-checkout set --no-cone \
            '/gamepulse/fusion/*.py' \
            '/gamepulse/fusion/tests/test_igp_halfcourt_isolation_blowby_v1.py' \
            '/gamepulse/fusion/tests/test_igp_halfcourt_isolation_blowby_temporal_v2.py' \
            '/gamepulse/fusion/qa/igp_progress_20261030/igp_68_official_ten_scene_possession_ab_v3.json' \
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/official_ten_scene_possession_68_v3/0022600009.json.gz' \
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/official_ten_scene_possession_68_v3/0022600001.json.gz' \
            '/gamepulse/fusion/materialized/igp_all_original_xyz/0022600001/' \
            '/gamepulse/fusion/official_pbp_timing/games/0022600001.json' \
            '/gamepulse/fusion/index/games/0022600001.json' \
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/official_ten_scene_possession_68_v3/0022600002.json.gz' \
            '/gamepulse/fusion/materialized/igp_all_original_xyz/0022600002/' \
            '/gamepulse/fusion/official_pbp_timing/games/0022600002.json' \
            '/gamepulse/fusion/index/games/0022600002.json' \
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/official_ten_scene_possession_68_v3/0022600003.json.gz' \
            '/gamepulse/fusion/materialized/igp_all_original_xyz/0022600003/' \
            '/gamepulse/fusion/official_pbp_timing/games/0022600003.json' \
            '/gamepulse/fusion/index/games/0022600003.json' \
            '/gamepulse/fusion/materialized/igp_all_original_xyz/0022600009/' \
            '/gamepulse/fusion/official_pbp_timing/games/0022600009.json' \
            '/gamepulse/fusion/index/games/0022600009.json'
          export PYTHONPATH=gamepulse/fusion:gamepulse/fusion/tests
          python3 -m py_compile gamepulse/fusion/igp_halfcourt_isolation_blowby_v1.py gamepulse/fusion/igp_halfcourt_isolation_blowby_source_adapter_v1.py gamepulse/fusion/igp_halfcourt_isolation_blowby_pilot_v1.py gamepulse/fusion/igp_halfcourt_isolation_blowby_temporal_v2.py
          python3 -m unittest -v gamepulse/fusion/tests/test_igp_halfcourt_isolation_blowby_v1.py gamepulse/fusion/tests/test_igp_halfcourt_isolation_blowby_temporal_v2.py
          if python3 -B gamepulse/fusion/igp_halfcourt_isolation_blowby_pilot_v1.py \
               --root . --games 0022600009 --output "$RUNNER_TEMP/igp_blowby_0009_qa.json" \
               > "$RUNNER_TEMP/igp_private_pilot.log" 2> "$RUNNER_TEMP/igp_private_error.log"; then
            python3 - <<'PY'
          import json,os,pathlib
          r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"igp_blowby_0009_qa.json").read_text())
          print("IGP_BLOWBY_PRIVATE_REAL_SOURCE",json.dumps({"games":r["game_count"],"events":r["qualifying_blowby_events"],"chains":r["qualifying_official_chain_ids"],"v2_events":r["temporal_v2_research_event_count"],"source_qa":r["per_game_qa"]["0022600009"]["source_snapshot_counts"]},sort_keys=True))
          PY
          else
            python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])
          d={"status":"PRIVATE_NBA_SOURCE_RUN_FAILED","private_error":(p/"igp_private_error.log").read_text()[-9000:]}
          (p/"igp_blowby_0009_qa.json").write_text(json.dumps(d)+"\n")
          print("IGP_BLOWBY_PRIVATE_SOURCE_PILOT_FAILURE_RECORDED")
          PY
            FAILED=1
          fi
          git config user.name 'Integrated Pulse Research QA'
          git config user.email '41898282+igp-source@users.noreply.github.com'
          mkdir -p gamepulse/fusion/qa/analysis/igp_isolation_blowby
          cp "$RUNNER_TEMP/igp_blowby_0009_qa.json" gamepulse/fusion/qa/analysis/igp_isolation_blowby/rockets_0009_pilot_v1.json
          git add --sparse -f gamepulse/fusion/qa/analysis/igp_isolation_blowby/rockets_0009_pilot_v1.json
          if ! git diff --cached --quiet; then
            git commit -qm 'qa(private): real NBA Rockets isolation blowby detector pilot [skip ci]'
            for retry in 1 2 3 4 5; do
              git fetch -q origin "$PRIVATE_BRANCH"
              git rebase -q "origin/$PRIVATE_BRANCH"
              if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
                echo IGP_BLOWBY_PRIVATE_QA_COMMITTED
                break
              fi
              sleep "$retry"
            done
          fi
          test "${FAILED:-0}" = 0
