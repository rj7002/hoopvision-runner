# Full121 completed: follow-up direct-native audit of Houston (game 0022600181).
# Source-only screened/unscreened defender-beaten vs original strict isolation.
name: IGP isolation blowby private NBA pilot CPU
on:
  push:
    branches: [research/igp-strict-isolation-blowby-cpu-20261106]
    paths: ['.github/workflows/igp-isolation-blowby-private-cpu.yml']
permissions:
  contents: read
jobs:
  houston-defender-beaten-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/igp-blowby-full121-full666-20261106
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify confidentiality
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Houston-Minnesota source-only full-game defender-beaten sensitivity
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          git sparse-checkout set --no-cone \
            '/gamepulse/fusion/*.py' \
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/index.json' \
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/post56_additive_20261028/index.json' \
            '/gamepulse/fusion/qa/igp_progress_20261030/igp_68_official_ten_scene_possession_ab_v3.json' \
            '/gamepulse/fusion/official_pbp_timing/index-2026-27-post36-additive.json' \
            '/gamepulse/fusion/materialized/igp_all_original_xyz/0022600181/' \
            '/gamepulse/fusion/official_pbp_timing/games/0022600181.json' \
            '/gamepulse/fusion/official_pbp_timing/original_nba_20261029/0022600181/boxscore.json'
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_halfcourt_blowby_general_v3.py gamepulse/fusion/igp_halfcourt_isolation_blowby_full121_v1.py
          python3 -B gamepulse/fusion/igp_halfcourt_isolation_blowby_full121_v1.py --root . --shard 115 --shards 121 --include-general --output "$RUNNER_TEMP/igp_hou_defender_beaten_full_game.json"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"igp_hou_defender_beaten_full_game.json"
          j=json.loads(p.read_bytes())
          g=j["per_game"]["0022600181"]
          broad=g["general_defender_beaten"]["events"]
          by_hou=[e for e in broad if e["defense_team"]=="HOU"]
          iso=[e for e in g["accepted"] if e["defense_team"]=="HOU"]
          print("HOUSTON_NATIVE_BLOWBY_AUDIT",json.dumps({
            "game":"0022600181","native_frames":g["native_frames"],
            "isolation_against_HOU":len(iso),
            "general_beaten_against_HOU":len(by_hou),
            "general_beaten_total_both_teams":len(broad),
            "candidate_front_starts":g["general_defender_beaten"]["qa"]["front_candidates"],
            "unique_hou_defenders":len(set(e["defender_id"] for e in by_hou))},sort_keys=True))
          PY
          git config user.name 'Integrated Pulse Research QA'
          git config user.email '41898282+igp-source@users.noreply.github.com'
          DEST='gamepulse/fusion/qa/analysis/igp_isolation_blowby/houston_0022600181_general_defender_beaten_v3.json'
          mkdir -p "$(dirname "$DEST")"
          cp "$RUNNER_TEMP/igp_hou_defender_beaten_full_game.json" "$DEST"
          git add --sparse -f "$DEST"
          if ! git diff --cached --quiet; then
            git commit -qm 'qa(private): full-game Houston original source defender-beat vs strict isolation [skip ci]'
            SUCCESS=0
            for retry in 1 2 3 4 5; do
              git fetch -q origin "$PRIVATE_BRANCH"
              git rebase -q "origin/$PRIVATE_BRANCH"
              if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then SUCCESS=1;break;fi
              sleep "$retry"
            done
            test "$SUCCESS" -eq 1
          fi
