# Onset-specific NBA screen flags need independent source evidence, not a pre-imposed Houston six.
# All five Full121 conservative native NBA source shards have committed.
# This workflow produces ONLY a compact private team-game leaderboard.
name: IGP isolation blowby private NBA pilot CPU
on:
  push:
    branches: [research/igp-strict-isolation-blowby-cpu-20261106]
    paths: ['.github/workflows/igp-isolation-blowby-private-cpu.yml']
permissions:
  contents: read
jobs:
  full121-conservative-leaderboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/igp-blowby-full121-full666-20261106
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify confidentiality
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Merge all completed 121 NBA conservative defender-beaten game counts
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          git sparse-checkout set --no-cone \
            '/gamepulse/fusion/*.py' \
            '/gamepulse/fusion/qa/analysis/igp_isolation_blowby/full121_conservative_v4/' \
            '/gamepulse/fusion/qa/igp_progress_20261030/igp_68_official_ten_scene_possession_ab_v3.json' \
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/index.json' \
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/post56_additive_20261028/index.json'
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_halfcourt_conservative_team_game_leaderboard_v1.py
          python3 -B gamepulse/fusion/igp_halfcourt_conservative_team_game_leaderboard_v1.py --root . --output "$RUNNER_TEMP/team_game_general_v3.json"
          git config user.name 'Integrated Pulse Research QA'
          git config user.email '41898282+igp-source@users.noreply.github.com'
          DEST='gamepulse/fusion/qa/analysis/igp_isolation_blowby/full121_conservative_v4/team_game_leaderboard_v1.json'
          cp "$RUNNER_TEMP/team_game_general_v3.json" "$DEST"
          git add --sparse -f "$DEST"
          if ! git diff --cached --quiet; then
            git commit -qm 'qa(private): Full121 121-game uniform conservative 18-Houston-equivalent blowby team-game record and screen grades [skip ci]'
            PUSH_OK=0
            for retry in 1 2 3 4 5 6; do
              git fetch -q origin "$PRIVATE_BRANCH"
              git rebase -q "origin/$PRIVATE_BRANCH"
              if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then PUSH_OK=1;break;fi
              sleep "$retry"
            done
            test "$PUSH_OK" -eq 1
          fi
