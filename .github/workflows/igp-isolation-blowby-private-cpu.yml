# Summarize Houston players from five previously completed conservative Full121
# shards. Original NBA source-derived data never enters public runner archives.
name: IGP isolation blowby private NBA pilot CPU
on:
  push:
    branches: [research/igp-strict-isolation-blowby-cpu-20261106]
    paths: ['.github/workflows/igp-isolation-blowby-private-cpu.yml']
permissions:
  contents: read
jobs:
  rockets-player-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/igp-blowby-full121-full666-20261106
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify confidentiality
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Private Full121 Houston player rankings and clips
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          git sparse-checkout set --no-cone \
            '/gamepulse/fusion/igp_rockets_conservative_blown_by_player_season_v1.py' \
            '/gamepulse/fusion/qa/analysis/igp_isolation_blowby/full121_conservative_v4/' \
            '/gamepulse/fusion/qa/analysis/igp_isolation_blowby/houston_0022600181_video_review_labels_20261106.json' \
            '/gamepulse/fusion/official_pbp_timing/games/'
          python3 -m py_compile gamepulse/fusion/igp_rockets_conservative_blown_by_player_season_v1.py
          python3 -B gamepulse/fusion/igp_rockets_conservative_blown_by_player_season_v1.py \
            --root . --output "$RUNNER_TEMP/houston_players.json"
          git config user.name 'Integrated Pulse Research QA'
          git config user.email '41898282+igp-source@users.noreply.github.com'
          DEST='gamepulse/fusion/qa/analysis/igp_isolation_blowby/full121_conservative_v4/rockets_player_leaderboard_with_clips_v1.json'
          cp "$RUNNER_TEMP/houston_players.json" "$DEST"
          git add --sparse -f "$DEST"
          if ! git diff --cached --quiet; then
            git commit -qm 'qa(private): NBA Full121 HOU conservative no-screen player leaderboard and video review clips [skip ci]'
            PUSH_OK=0
            for retry in 1 2 3 4 5 6; do
              git fetch -q origin "$PRIVATE_BRANCH"
              git rebase -q "origin/$PRIVATE_BRANCH"
              if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then PUSH_OK=1;break;fi
              sleep "$retry"
            done
            test "$PUSH_OK" -eq 1
          fi
          echo HOUSTON_PLAYER_LEADERBOARD_COMMITTED_TO_PRIVATE_REPO
