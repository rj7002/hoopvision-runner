name: IGP 2025-26 historical defender XYZ full-archive private materialization
'on':
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-historical-xyz-defender-full-archive
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Protect original NBA source and private output
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh release view igp-public-gamepulse-2025-26-20261105 --repo timeedmonds-maker/104 >/dev/null
          gh release view igp-2025-26-xfg-archive-20261105 --repo timeedmonds-maker/104 >/dev/null
          gh release view igp-2025-26-defender-xyz-proxy-20261105 --repo timeedmonds-maker/104 >/dev/null
          echo IGP_HISTORICAL_DEFENDER_PRIVATE_RELEASE_DESTINATIONS_READY
  materialize:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: ['001','002','003','004','005','006','007','008','009','010','011','012','013','014','015']
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Source quarantine and historical xFG readiness check
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/xfg" "$RUNNER_TEMP/derived"
          if ! gh release download igp-2025-26-xfg-archive-20261105 \
            --repo timeedmonds-maker/104 \
            --pattern "nba-xfg-nba-2025-26-shard-$SHARD.jsonl.gz" \
            --pattern "nba-xfg-nba-2025-26-shard-$SHARD-qa.json" \
            --dir "$RUNNER_TEMP/xfg"; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "HISTORICAL_DEFENDER_SHARD_XFG_NOT_YET_AVAILABLE $SHARD"
            exit 0
          fi
          if [ ! -s "$RUNNER_TEMP/xfg/nba-xfg-nba-2025-26-shard-$SHARD.jsonl.gz" ] ||
             [ ! -s "$RUNNER_TEMP/xfg/nba-xfg-nba-2025-26-shard-$SHARD-qa.json" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "HISTORICAL_DEFENDER_SHARD_XFG_INCOMPLETE $SHARD"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "HISTORICAL_DEFENDER_SHARD_XFG_READY $SHARD"
      - name: Verify source-index and private SHA-locked algorithm
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release download igp-public-gamepulse-2025-26-20261105 \
            --repo timeedmonds-maker/104 \
            --pattern nba-2025-26-source-index.json \
            --pattern "nba-2025-26-shard-$SHARD.zip" \
            --dir "$RUNNER_TEMP/source"
          git clone -q --depth=1 --filter=blob:none --sparse -b "$BRANCH" \
            https://x-access-token:$GH_TOKEN@github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          PYTHONPATH="$PWD" python3 -m unittest discover -q -s gamepulse/fusion/tests \
            -p 'test_igp_historical_defender_proxy_v1.py'
          PYTHONPATH="$PWD" python3 -m unittest discover -q -s gamepulse/fusion/tests \
            -p 'test_igp_historical_defender_client_db_v1.py'
          echo "HISTORICAL_DEFENDER_SHARD_ALGORITHM_TEST_PASS $SHARD"
      - name: Produce source-graded defender features for every shot in shard
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/private/gamepulse/fusion/igp_historical_defender_proxy_v1.py" \
            --index "$RUNNER_TEMP/source/nba-2025-26-source-index.json" \
            --shard "$RUNNER_TEMP/source/nba-2025-26-shard-$SHARD.zip" \
            --shots "$RUNNER_TEMP/xfg/nba-xfg-nba-2025-26-shard-$SHARD.jsonl.gz" \
            --shot-qa "$RUNNER_TEMP/xfg/nba-xfg-nba-2025-26-shard-$SHARD-qa.json" \
            --out "$RUNNER_TEMP/derived"
          python3 - <<'PY'
          import json,os,pathlib
          n=os.environ["SHARD"]
          d=pathlib.Path(os.environ["RUNNER_TEMP"])/"derived"
          s=pathlib.Path(os.environ["RUNNER_TEMP"])/"xfg"
          q=json.loads((d/f"defender-xyz-nba-2025-26-shard-{n}-qa.json").read_text())
          x=json.loads((s/f"nba-xfg-nba-2025-26-shard-{n}-qa.json").read_text())
          c=q["counts"]
          assert c["shot_rows"]>0 and c["shot_rows"]<=x["counts"]["public_shot_rows"]
          assert c["primary_proxy"]<=c["source_nearest_defender"]<=c["tracking_frame"]<=c["shot_rows"]
          assert q["source_shard_sha256"]==x["source_shard_sha256"]
          print("HISTORICAL_DEFENDER_SHARD_ACCEPTED_PRIVATE_SOURCE",n,json.dumps(c,sort_keys=True))
          PY
      - name: Upload private shot ledger and QA (never public artifact)
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release upload igp-2025-26-defender-xyz-proxy-20261105 \
            "$RUNNER_TEMP/derived/defender-xyz-nba-2025-26-shard-$SHARD.jsonl.gz" \
            "$RUNNER_TEMP/derived/defender-xyz-nba-2025-26-shard-$SHARD-qa.json" \
            "$RUNNER_TEMP/derived/defender-summary-nba-2025-26-shard-$SHARD.json" \
            --repo timeedmonds-maker/104 --clobber
          echo "HISTORICAL_DEFENDER_PRIVATE_SHARD_UPLOADED $SHARD"
  reduce:
    needs: materialize
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate all 15 original xFG/XYZ receipts before promoting application database
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          mkdir -p "$RUNNER_TEMP/derived" "$RUNNER_TEMP/xfg"
          gh release download igp-2025-26-defender-xyz-proxy-20261105 \
            --repo timeedmonds-maker/104 \
            --pattern 'defender-xyz-*-qa.json' --dir "$RUNNER_TEMP/derived"
          gh release download igp-2025-26-xfg-archive-20261105 \
            --repo timeedmonds-maker/104 \
            --pattern 'nba-xfg-*-qa.json' --dir "$RUNNER_TEMP/xfg"
          python3 - <<'PY'
          import json,os,pathlib
          d=pathlib.Path(os.environ["RUNNER_TEMP"])
          found=[];missing=[]
          for n in range(1,16):
              sh=f"nba-2025-26-shard-{n:03}"
              p=d/"derived"/f"defender-xyz-{sh}-qa.json"
              x=d/"xfg"/f"nba-xfg-{sh}-qa.json"
              if not p.exists() or not x.exists():
                  missing.append(sh);continue
              a=json.loads(p.read_text());b=json.loads(x.read_text())
              if a["shot_rows_sha256"]!=b["shot_rows_sha256"] or a["source_shard_sha256"]!=b["source_shard_sha256"]:
                  missing.append(sh);continue
              found.append(sh)
          print("HISTORICAL_DEFENDER_FULL_REDUCE",json.dumps({"accepted_shards":len(found),"missing_or_source_mismatched":missing},sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("ready="+("true" if len(found)==15 else "false")+"\n")
          PY
      - name: Produce queryable full-season coaching application SQLite
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release download igp-2025-26-defender-xyz-proxy-20261105 \
            --repo timeedmonds-maker/104 \
            --pattern 'defender-xyz-*.jsonl.gz' --dir "$RUNNER_TEMP/derived"
          git clone -q --depth=1 --filter=blob:none --sparse -b "$BRANCH" \
            https://x-access-token:$GH_TOKEN@github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          python3 "$RUNNER_TEMP/private/gamepulse/fusion/igp_historical_defender_client_db_v1.py" \
            --ledgers "$RUNNER_TEMP/derived/"defender-xyz-*.jsonl.gz \
            --out "$RUNNER_TEMP/derived/igp-2025-26-defender-client.sqlite"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"derived/igp-2025-26-defender-client.qa.json"
          x=json.loads(p.read_text())
          assert x["counts"]["all_shots"]>0 and x["counts"]["unique_games"]>=600
          assert x["counts"]["with_primary"]>0
          print("IGP_FULL_HISTORICAL_DEFENDER_CLIENT_ACCEPTED",json.dumps(x["counts"],sort_keys=True))
          PY
          gh release upload igp-2025-26-defender-xyz-proxy-20261105 \
            "$RUNNER_TEMP/derived/igp-2025-26-defender-client.sqlite" \
            "$RUNNER_TEMP/derived/igp-2025-26-defender-client.qa.json" \
            --repo timeedmonds-maker/104 --clobber
          echo IGP_HISTORICAL_2025_26_CLIENT_DATABASE_PRIVATE_COMPLETE
      - name: Explicit incomplete receipt, without false promotion
        if: steps.ready.outputs.ready != 'true'
        run: echo IGP_HISTORICAL_CLIENT_DATABASE_NOT_PROMOTED_UNTIL_15_SOURCE_MATCHING_SHARDS
