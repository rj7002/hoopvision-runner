# Public CPU execution, but all licensed NBA data, player/game reports, and diagnostics remain private.
name: IGP Full123 R13 Houston player-level frontcourt validation
on:
  push:
    branches: [feature/igp-full123-r13-public-cpu-20261107]
    paths: ['.github/workflows/igp-full123-r13-houston-player-frontcourt-validate-20261107.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: full123-r13-houston-fc-independent-player-qa
  cancel-in-progress: false
jobs:
  independent-player-frontcourt-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: feature/igp-full123-r13-touch-integration-20261107
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce licensed data boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Read only SHA-accepted private R13 reports for the exact nine Houston games
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/full123-r13-hou-fc"
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" "https://github.com/$PRIVATE_REPO.git" "$work"
          cd "$work"
          git sparse-checkout set --no-cone \
            '/gamepulse/fusion/*.py' \
            '/gamepulse/fusion/analysis/*.py' \
            '/gamepulse/fusion/qa/igp_progress_20261030/igp_full121_default_source_release_v1.json' \
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/index.json' \
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/post56_additive_20261028/index.json' \
            '/gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/full123_123_game_execution_decision.json' \
            '/gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/0022600009.json' \
            '/gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/0022600021.json' \
            '/gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/0022600091.json' \
            '/gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/0022600107.json' \
            '/gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/0022600125.json' \
            '/gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/0022600138.json' \
            '/gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/0022600153.json' \
            '/gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/0022600167.json' \
            '/gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/0022600181.json'
          export PYTHONPATH="$PWD"
          python3 -m py_compile gamepulse/fusion/analysis/igp_full123_r13_frontcourt_player_validation_20261107.py
          python3 gamepulse/fusion/analysis/igp_full123_r13_frontcourt_player_validation_20261107.py \
            --root . --private-persist
          echo FULL123_R13_NINE_HOUSTON_PLAYER_FRONTCOURT_QA_PRIVATE_SHA_COMPLETE
