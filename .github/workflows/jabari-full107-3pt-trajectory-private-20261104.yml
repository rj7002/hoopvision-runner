name: Full107 Jabari Smith Jr original 3PT trajectories deterministic
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/jabari-full107-3pt-trajectory-private-20261104.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: jabari-full107-3pt-private-20261104
  cancel-in-progress: false
jobs:
  original-source-analysis-and-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/full107-jabari-threepoint-tracker-20261104
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify public-private safety and source tree
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set --no-cone \
            /gamepulse/fusion/jabari_full107_3pt_trajectory_v1.py \
            /gamepulse/fusion/durant_ft_full107_original_3d_v1.py \
            /gamepulse/fusion/official_pbp_timing/games/0022600091.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600009.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600107.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600125.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600138.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600021.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600153.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600167.json \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600091/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600009/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600107/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600125/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600138/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600021/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600153/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600167/
          cd "$RUNNER_TEMP/private"
          python3 -m py_compile gamepulse/fusion/jabari_full107_3pt_trajectory_v1.py
      - name: Setup deterministic Python
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/jabari-venv"
          "$RUNNER_TEMP/jabari-venv/bin/pip" --disable-pip-version-check -q install numpy==2.2.6 matplotlib==3.10.3 Pillow==11.3.0
      - name: Reconcile scorer and SHA-original 3D shots, render twice
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          "$RUNNER_TEMP/jabari-venv/bin/python" gamepulse/fusion/jabari_full107_3pt_trajectory_v1.py \
            > "$RUNNER_TEMP/jabari-private.log" 2>&1 || {
              echo 'JABARI_PRIVATE_SHA_SOURCE_OR_RENDER_GATE_FAILED'
              tail -n 8 "$RUNNER_TEMP/jabari-private.log" | sed -E 's/[0-9]{10,}/[REDACTED]/g'
              exit 1
            }
          python3 - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('gamepulse/fusion/qa/jabari_full107_3pt')
          q=json.loads((p/'jabari_full107_3pt_render_qa.json').read_text())
          assert (q['attempts'],q['makes'],q['misses'])==(52,25,27)
          assert q['png_repeat_render_identical']
          assert q['source_matched_publishable']>0, 'NO_SOURCE_GRADED_3PT_FLIGHTS'
          b=(p/'jabari_full107_threepoint_trajectory.png').read_bytes()
          assert b[:8]==b'\x89PNG\r\n\x1a\n'
          assert hashlib.sha256(b).hexdigest()==q['sha256_png']
          print('JABARI_FULL107_DETERMINISTIC_QA',json.dumps({
            'attempts':52,'makes':25,'misses':27,
            'original_shot_trajectories':q['source_matched_publishable'],
            'unmatched_not_rendered':q['source_unmatched'],
            'double_render_identical':True,
            'png_sha256':q['sha256_png'],
            'independent_physical_truth':False
          },sort_keys=True))
          PY
      - name: Persist rendered figure and private shot ledger
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f gamepulse/fusion/qa/jabari_full107_3pt/
          git diff --cached --check
          if git diff --cached --quiet; then echo 'JABARI_QA_UNCHANGED'; exit 0; fi
          git commit -qm 'qa(private): SHA-native deterministic Jabari Full107 three-point arcs and render'
          for n in 1 2 3 4; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH"
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo 'PRIVATE_JABARI_DETERMINISTIC_RENDER_COMMITTED'
              exit 0
            fi
            sleep "$n"
          done
          exit 31

# Public guard allowlist verified. Private original ball XYZ never enters public logs.
