# Fresh first-party NBA Blueprint pages for delayed original advanced shot metadata.
# Do not replace any frozen original or publish per-shot NBA proprietary data.
name: IGP Full121 3-game fresh NBA Blueprint shot-source revision
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full121-fresh-blueprint-shot-recheck-20261106.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-full121-fresh-blueprint-recheck-20261106
  cancel-in-progress: false
jobs:
  private-recheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Fetch only official NBA original source and private SHA evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion scripts data/extensions/nba_blueprint_2026_27/games
          cd "$RUNNER_TEMP/private"
          python3 -m py_compile gamepulse/fusion/igp_full121_blueprint_nov04_revision_v1.py scripts/update_nba_blueprint_daily_2026_27.py
          python3 gamepulse/fusion/igp_full121_blueprint_nov04_revision_v1.py --root .
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("gamepulse/fusion/qa/igp_progress_20261030/full121_blueprint_nov04_revision_20261106.json")
          data=json.loads(p.read_bytes())
          assert data["games_checked"]==3
          assert data["original_source_preserved"] is True
          assert data["full121_source_release_modified"] is False
          assert data["tracking_default_changed"] is False
          print("FULL121_NOV04_OFFICIAL_BLUEPRINT_RECHECK_FINAL",
            "fresh_original_additional_exact",data["new_exact_source_shots"],
            "source_revisions",sum("accepted_revision_path" in r for r in data["per_game"].values()))
          PY
      - name: Persist separate immutable NBA publisher source-revision candidates
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_progress_20261030/full121_blueprint_nov04_revision_20261106.json
          for gid in 0022600175 0022600179 0022600186; do
            for f in data/extensions/nba_blueprint_2026_27/games/$gid/blueprint_report_revision_*.json; do
              test -f "$f" && git add -f "$f" || true
            done
          done
          git diff --cached --check
          if git diff --cached --quiet; then echo FULL121_BLUEPRINT_RECHECK_ALREADY_ACCEPTED; exit 0; fi
          git commit -q -m "qa(igp): preserve 3-game official NBA late shot source revision and exact identities"
          for n in $(seq 1 16); do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo FULL121_FRESH_BLUEPRINT_PRIVATE_SHA_QA_COMMITTED
              exit 0
            fi
            sleep "$((n*2))"
          done
          exit 85
