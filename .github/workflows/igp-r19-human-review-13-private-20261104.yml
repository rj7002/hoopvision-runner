# Source-locked prior human-review test (13 coarse player-action episodes).
# No private timestamp, player IDs, source XYZ, or per-play identifiers are public.
name: R19 v4 source-conflict-graded prior 13 human-reviewed action-run validation private
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/igp-r19-human-review-13-private-20261104.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-human-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: analysis/igp-r19-native-temporal-20261104
      PIN: 5479eefe066b09884cbb2fb602a3f2927751bb9b
      DEST: gamepulse/fusion/qa/analysis/igp_r19_native_rebuild_v4_20261104
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce licensed source boundary
        run: python3 tools/public_content_guard.py
      - name: Private prior-review source crosswalk
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          git sparse-checkout set gamepulse/fusion
          git fetch -q --depth=1 origin "$PIN"
          git checkout -q --detach "$PIN"
          test "$(git rev-parse HEAD)" = "$PIN"
          script=gamepulse/fusion/analysis/igp_r19_original_13_human_review_crosswalk_v4.py
          python3 -B "$script" --root . --out "$RUNNER_TEMP/full.json" > "$RUNNER_TEMP/stdout" 2> "$RUNNER_TEMP/stderr" || {
            echo R19_PRIVATE_ORIGINAL_USER_VIDEO_REVIEW_QA_FAILED_DETAILS_REDACTED
            exit 1
          }
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])
          data=json.loads((p/'full.json').read_bytes())
          assert data['all13_reference_labels_preserved'] is True
          assert len(data['private_review_per_run'])==13
          assert data['source_video_framewise_certified'] is False
          summary={k:v for k,v in data.items() if k!='private_review_per_run'}
          (p/'summary.json').write_text(json.dumps(summary,sort_keys=True,indent=2)+'\n')
          print('R19_REAL_HUMAN_REVIEW_13_SOURCE_QA_PASS',
                'reference_total',13,'results',data['summary'])
          PY
          git fetch -q origin "$PRIVATE_BRANCH"
          git checkout -q -B qa-private "origin/$PRIVATE_BRANCH"
          mkdir -p "$DEST"
          cp "$RUNNER_TEMP/full.json" "$DEST/human_13_run_review_full_private_v4.json"
          cp "$RUNNER_TEMP/summary.json" "$DEST/human_13_run_review_summary_v4.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$DEST/human_13_run_review_full_private_v4.json" "$DEST/human_13_run_review_summary_v4.json"
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -q -m 'qa(private): source-locked R19 versus 13 user-reviewed action runs [skip ci]'
            DONE=0
            for k in 1 2 3 4 5; do
              git fetch -q origin "$PRIVATE_BRANCH"
              git rebase -q "origin/$PRIVATE_BRANCH"
              if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then DONE=1; break; fi
              sleep "$k"
            done
            test "$DONE" = 1
          fi
