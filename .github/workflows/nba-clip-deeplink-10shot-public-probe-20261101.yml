name: NBA clip probe retired - public URL policy preserved
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  status:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify public guard
        run: python3 tools/public_content_guard.py
      - name: Report probe outcome
        run: echo "MEDIA_SOURCE_URL_PROBE_NOT_ALLOWED_PUBLIC_RUNNER"
