# Source-only official NBA Inside the Game season totals; all snapshots stay private.
# Runs after each scheduled game-ingestion cycle with an hourly retry path.
name: Integrated Pulse official Zone Defense season refresh
'on':
  workflow_run:
    workflows: ['Game Pulse public CPU season private Release worker']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:
  push:
    branches: [research/igp-zone-future-ingest-20261105]
    paths: ['.github/workflows/gamepulse-igp-official-zone-continuous.yml',
            'tools/public_content_guard.py']
permissions: {contents: read}
concurrency:
  group: igp-nba-official-zone-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: ${{ github.event_name == 'push' && 'research/igp-zone-continuous-season-refresh-20261105' || 'research/gamepulse-clock-boundary-integrity-20261025' }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify source boundary and private credential
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          echo OFFICIAL_NBA_ZONE_PRIVATE_SOURCE_CHECKOUT_OK
      - name: Verify source-conserving NBA zone refresh regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_zone_season_refresh_v1.py'
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_igp_full107_zone_team_v1.py'
          python3 -m unittest discover -q -s gamepulse/fusion/tests -p 'test_nba_zone_defense_official_ingest_v1.py'
          echo OFFICIAL_NBA_ZONE_REGRESSION_GATES_OK
      - name: Reconcile current official NBA team season totals against IGP
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 gamepulse/fusion/igp_zone_season_refresh_v1.py \
            --receipt "$RUNNER_TEMP/official-zone-refresh.json"
          python3 - <<'PY'
          import os,json,sqlite3
          from pathlib import Path
          t=json.loads((Path(os.environ['RUNNER_TEMP'])/'official-zone-refresh.json').read_text())
          assert t['status'] in ('refreshed','unchanged')
          assert t['official_nba_games_in_snapshot']>=107
          assert t['physical_zone_possession_labels']=='NOT_AVAILABLE'
          if t['status']=='refreshed':
              p='gamepulse/fusion/materialized/igp_full107_official_zone_v1/nba_official_zone_team.sqlite'
              with sqlite3.connect(p) as c:
                  assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
                  assert c.execute('select count(*) from zone_team_stats').fetchone()[0]>=168
              index=json.loads(Path('gamepulse/fusion/qa/igp_fullx/LATEST.json').read_text())
              assert index['nba_official_zone_defense']['official_nba_games_at_snapshot']==t['official_nba_games_in_snapshot']
              assert index['nba_official_zone_defense']['full107_exact_game_to_zone_label_join']=='NOT_AVAILABLE'
          print('NBA_ZONE_REFRESH_VERIFIED',t['status'],
                'OFFICIAL_GAMES',t['official_nba_games_in_snapshot'],
                'IGP_INDEX_GAMES',t['igp_indexed_games'],
                'SOURCE_GRADE',t['source_vs_igp'])
          PY
      - name: Commit any newly verified official snapshots and source QA privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git add -f \
            gamepulse/fusion/qa/nba_zone_official_20261105 \
            gamepulse/fusion/qa/igp_full107_official_zone_v1 \
            gamepulse/fusion/materialized/igp_full107_official_zone_v1 \
            gamepulse/fusion/qa/igp_fullx/LATEST.json
          git -c core.whitespace=cr-at-eol diff --cached --check >/dev/null
          if git diff --cached --quiet; then
            echo NBA_ZONE_SNAPSHOT_UNCHANGED_NO_COMMIT
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'data(igp): keep official NBA zone season aggregates current after ingestions'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo NBA_ZONE_REFRESH_ACCEPTED_PRIVATE_COMMIT
              exit 0
            fi
            sleep "$attempt"
          done
          exit 42
