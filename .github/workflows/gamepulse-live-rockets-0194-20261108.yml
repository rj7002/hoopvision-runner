name: Rockets Suns 0022600194 original Game Pulse live XYZ catch-up
# 2026-11-08: security allowlist reviewed; activate sequential catch-up for missing HOU-PHX source XYZ windows.
# Re-run with latest public allowlist confirmed on 2026-11-08 UTC for Rockets source-only private catch-up.
# Exact official game ID and NBA tipoff from schedule; reuse tested licensed SDK capture.
# Raw player-ball XYZ and hashes are written ONLY to private 104 Releases.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gamepulse-live-rockets-0194-20261108.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rockets-private-xyz-backfill:
    concurrency:
      group: gamepulse-live-2026-0022600194
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      GAMEPULSE_LIVE_ID: '0022600194'
      GAMEPULSE_LIVE_TIPOFF: '2026-11-08T02:00:00.000Z'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce public runner source boundary
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing licensed SDK without postinstall scripts
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Capture missing source minute windows sequentially, preserving private SHA receipts
        working-directory: tools/licensed_feed
        shell: bash
        run: |
          set -euo pipefail
          for cycle in 1 2 3 4 5 6; do
            echo "ROCKETS_PRIVATE_XYZ_RECOVERY_CYCLE_$cycle"
            node live_capture_cycle.mjs
          done
          echo "ROCKETS_PRIVATE_XYZ_RECOVERY_CYCLES_COMPLETE"

  halftime-private-git-rescue:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {shard: gap25, minutes: '25'}
          - {shard: tail, minutes: '68,69,70,71,72,73,74,75,76'}
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      GAMEPULSE_FINAL_FASTLANE: 'true'
      SHARD_NAME: ${{ matrix.shard }}
      SOURCE_MINUTES: ${{ matrix.minutes }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate private-only licensed source boundary
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Install authentic SDK
        working-directory: tools/licensed_feed
        run: |
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Original source-only SHA readback and direct private Git persistence
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth=1 --filter=blob:none --sparse -b main \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private104"
          git -C "$RUNNER_TEMP/private104" sparse-checkout set --no-cone 'gamepulse/live/halftime_sdk_0194/*'
          git -C "$RUNNER_TEMP/private104" switch -q -c "research/rockets-0194-half-$SHARD_NAME-20261108"
          python3 - <<'PY'
          import json,hashlib,os,shutil,subprocess,tempfile
          from pathlib import Path
          dest=Path(os.environ["RUNNER_TEMP"])/"private104"/"gamepulse/live/halftime_sdk_0194"/os.environ["SHARD_NAME"]
          dest.mkdir(parents=True,exist_ok=True)
          rows=[];missing=[]
          for minute in map(int,os.environ["SOURCE_MINUTES"].split(",")):
              stamp=1794103200000+minute*60000
              with tempfile.TemporaryDirectory(prefix="original-nba-") as td:
                  folder=Path(td)
                  job={"game_id":"0022600194","account_id":"nba",
                    "program_id":"companion-0022600194-positions",
                    "part":(stamp-1794102600000)//1500000,
                    "start_ms":stamp,"count":12}
                  req=folder/"job.json";req.write_text(json.dumps(job))
                  good=False
                  for attempt in range(3):
                      proc=subprocess.run(["node","capture.mjs",str(req),str(folder)],
                       cwd="tools/licensed_feed",stdout=subprocess.PIPE,
                       stderr=subprocess.PIPE,text=True,timeout=150)
                      if proc.returncode==0:good=True;break
                  if not good:
                      missing.append(minute)
                      print("ORIGINAL_SDK_RETRY_REQUIRED_MINUTE",minute)
                      continue
                  meta=json.loads((folder/"manifest.json").read_bytes())
                  assert meta["game_id"]=="0022600194" and meta["start_ms"]==stamp
                  assert meta["successful_windows"]==12 and meta["observed"] is True and meta["imputed"] is False
                  out=dest/("original-"+str(stamp)+".tar.gz")
                  shutil.copyfile(folder/"checkpoint.tar.gz",out)
                  digest=hashlib.sha256(out.read_bytes()).hexdigest()
                  rows.append({"minute":minute,"archive":out.name,"sha256":digest,
                    "native_keyframes":meta["unique_keyframes"],
                    "player_xyz_frames":meta["frames_with_players"],
                    "ball_xyz_frames":meta["frames_with_ball"]})
                  print("ORIGINAL_SDK_PRIVATE_GIT_VERIFIED_MINUTE",minute,
                    meta["unique_keyframes"],meta["frames_with_players"],meta["frames_with_ball"])
          receipt={"schema":"igp.rockets0194.private.original.sdk.halftime.v1",
            "game_id":"0022600194","source":"ORIGINAL_NBA_LICENSED_SDK",
            "source_rows":rows,"unresolved_minutes":missing,
            "source_complete_5s_only":True,"full_half_tracking_certified":False,
            "physical_possession_certified":False}
          (dest/"index.json").write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          print("HALFTIME_PRIVATE_GIT_CAPTURE",len(rows),"MISSING",len(missing))
          PY
          cd "$RUNNER_TEMP/private104"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "gamepulse/live/halftime_sdk_0194/$SHARD_NAME"
          git diff --cached --check
          git commit -q -m "data(igp): direct private Git SHA-original Rockets first-half source rescue"
          git push -q origin "HEAD:refs/heads/research/rockets-0194-half-$SHARD_NAME-20261108"
          echo "PRIVATE_ORIGINAL_HALFTIME_GIT_SHARD_PERSISTED"
