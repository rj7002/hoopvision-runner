# Bounded consumer-interface smoke only; no source coordinates leave private 104.
name: IGP Full121 graded 121-game query acceptance smoke
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full121-graded-query-smoke-20261106.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  graded-query-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate licensed-data boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Test Full121 graded facade against private release gates
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth=1 --filter=blob:none --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_full121_graded_tracking_access_v1.py gamepulse/fusion/igp_full121_source_default_v1.py gamepulse/fusion/igp_default_engine.py
          python3 -m unittest discover -v -s gamepulse/fusion/tests -p 'test_igp_full121_graded_tracking_access_v1.py'
          python3 - <<'PY'
          from pathlib import Path
          import json
          from igp_full121_source_default_v1 import load_release
          root=Path(".")
          rel, old, add=load_release(root)
          assert rel["indexed_official_nba_games"]==121
          assert len(old["per_game_model"])==56 and len(add["games"])==65
          g=json.loads((root/"gamepulse/fusion/qa/igp_progress_20261030/full121_guarded_production_release_gate_v2_20261106.json").read_bytes())
          assert g["games_evaluated_new"]==29
          assert g["full121_model_promotion_ready"] is False
          assert g["full92_rollback_preserved"] is True
          assert g["original_source_unchanged"] is True
          print("FULL121_GRADED_QUERY_SOURCE_TEST_PASS games=121 added=29 model_promotion=False")
          PY
