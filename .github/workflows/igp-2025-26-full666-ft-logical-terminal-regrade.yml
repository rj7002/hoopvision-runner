# Additive Full666 2025-26 v1.1 PBP FT logical terminal corrections, never certify physical custody.
name: IGP Full666 2025-26 full source final FT possession terminal regrade
'on':
  push:
    branches: [main]
    paths: [.github/workflows/igp-2025-26-full666-ft-logical-terminal-regrade.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-full666-2025-26-source-ft-regrade
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
  BRANCH: research/gamepulse-clock-boundary-integrity-20261025
  SOURCE_RELEASE: igp-2025-26-full666-pbp-possession-20261106
  TARGET_RELEASE: igp-full666-2025-26-possession-audit-20261106
jobs:
  shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ['001','002','003','004','005','006','007','008','009','010','011','012','013','014','015']
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Original archive privacy policy, read-only source SHA regrade engine
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone --quiet --depth=1 --filter=blob:none --sparse \
            -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set --no-cone \
            gamepulse/fusion/igp_2025_26_full666_ft_terminal_regrade_v1.py
          test "$(git -C "$RUNNER_TEMP/private" hash-object gamepulse/fusion/igp_2025_26_full666_ft_terminal_regrade_v1.py)" = 47f74012968e189d88ced55162119e34931ce129
          python3 -m py_compile "$RUNNER_TEMP/private/gamepulse/fusion/igp_2025_26_full666_ft_terminal_regrade_v1.py"
          mkdir -p "$RUNNER_TEMP/index" "$RUNNER_TEMP/qa"
      - name: Fetch immutable Full666 v1.0 source-index and metadata SHA receipt
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 18); do
            if gh release download "$SOURCE_RELEASE" --repo timeedmonds-maker/104 \
                --pattern "historical-full666-pbp-possession-nba-2025-26-shard-$SHARD*" \
                --dir "$RUNNER_TEMP/index" --clobber;then break;fi
            if test "$n" -eq 18;then exit 42;fi
            sleep 130
          done
          gzip -d "$RUNNER_TEMP/index/historical-full666-pbp-possession-nba-2025-26-shard-$SHARD.sqlite.gz"
      - name: Distinguish made-final-FT logical terminals from missed FT and review and-one overlaps
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/private/gamepulse/fusion/igp_2025_26_full666_ft_terminal_regrade_v1.py" \
            --index "$RUNNER_TEMP/index/historical-full666-pbp-possession-nba-2025-26-shard-$SHARD.sqlite" \
            --qa "$RUNNER_TEMP/index/historical-full666-pbp-possession-nba-2025-26-shard-$SHARD-qa.json" \
            --out "$RUNNER_TEMP/qa/full666-ft-source-regrade-shard-$SHARD.json"
      - name: Preserve logical PBP corrections only in protected Full666 private audit release
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 15);do
            if gh release upload "$TARGET_RELEASE" \
                "$RUNNER_TEMP/qa/full666-ft-source-regrade-shard-$SHARD.json" \
                --repo timeedmonds-maker/104 --clobber;then
              echo FULL666_FT_SOURCE_CORRECTION_PRIVATE_ACCEPTED_"$SHARD"
              exit 0
            fi
            sleep 140
          done
          exit 44
  reduce:
    needs: shard
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Reconcile 15 full historical source FT logical terminal corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          mkdir -p "$RUNNER_TEMP/qa"
          for n in $(seq 1 18);do
            if gh release download "$TARGET_RELEASE" --repo timeedmonds-maker/104 \
                --pattern 'full666-ft-source-regrade-shard-*.json' \
                --dir "$RUNNER_TEMP/qa" --clobber &&
              test "$(find "$RUNNER_TEMP/qa" -name 'full666-ft-source-regrade-shard-*.json' | wc -l)" -eq 15;then break;fi
            if test "$n" -eq 18;then exit 42;fi
            sleep 140
          done
          python3 - <<'PY'
          import collections,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'qa'
          files=sorted(root.glob('full666-ft-source-regrade-shard-*.json'))
          assert len(files)==15
          games=set();count=collections.Counter();shards=set()
          summary={}
          for f in files:
            doc=json.loads(f.read_text())
            assert doc['schema']=='igp.full666-2025-26-ft-terminal-source-regrade.v1'
            assert doc['physical_start_certified']==0 and doc['physical_end_certified']==0
            assert doc['source_original_PBP_mutated'] is False
            assert doc['source_original_tracking_mutated'] is False
            assert doc['logical_possession_renumbered'] is False
            assert doc['shard'] not in shards
            assert not (games & set(doc['per_game']))
            shards.add(doc['shard']);games.update(doc['per_game'])
            count.update(doc['counts'])
            summary[doc['shard']]={'games':doc['games'],
               'v1_source_index_sha256':doc['v1_full666_index_sha256'],
               'source_made_final_ft_end':doc['counts'].get('promotable_source_final_made_ft_logical_end',0),
               'missed_end_not_upgraded':doc['counts'].get('missed_final_ft_no_terminal_upgrade',0),
               'and_one_needs_review':doc['counts'].get('possible_and_one_FG_FT_pair_not_auto_merged',0)}
          assert len(games)==666 and len(shards)==15
          assert count['candidate_chains']==131306
          receipt={'schema':'igp.full666-2025-26-source-ft-logical-terminal-correction-all666.v1',
            'games':666,'shards':15,'candidate_chains_conserved':131306,
            'source_original_PBP_and_XYZ_unchanged':True,
            'original_logical_chain_ids_unchanged':True,
            'physical_possessions_certified':0,'status':'PBP_FINAL_MADE_FT_SOURCE_LOGICAL_CORRECTIONS_ONLY',
            'counts':dict(count),'per_shard':summary}
          (root/'full666-2025-26-final-made-ft-correction-all666-qa.json').write_text(
            json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('FULL666_2025_26_FT_LOGICAL_SOURCE_CORRECTIONS_FINAL',json.dumps({
            'games':666,'chains':131306,
            'made_final_ft_corrected':count['promotable_source_final_made_ft_logical_end'],
            'missed_final_ft_remain_unverified':count['missed_final_ft_no_terminal_upgrade'],
            'possible_and_one_requires_review':count['possible_and_one_FG_FT_pair_not_auto_merged'],
            'physical_certified':0},sort_keys=True),flush=True)
          PY
      - name: Retain finalized FT source corrections and identifiers privately
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 15);do
            if gh release upload "$TARGET_RELEASE" \
                "$RUNNER_TEMP/qa/full666-2025-26-final-made-ft-correction-all666-qa.json" \
                --repo timeedmonds-maker/104 --clobber;then
              echo FULL666_ALL666_FT_SOURCE_CORRECTIONS_PRIVATE_COMPLETE
              exit 0
            fi
            sleep 130
          done
          exit 43
