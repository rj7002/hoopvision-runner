name: Full92 dev-frozen owner-linear controlled ball hybrid unseen test
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full92-ball-control-hybrid-unseen-private-20261103.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  private-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/full92-ball-control-persistence-shadow-20261103
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Preserve public/private data boundary
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Unit test dev-only frozen policy
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -v -s gamepulse/fusion/tests -p 'test_igp_full92_ball_control_hybrid_shadow_v3.py'
      - name: Execute SHA original masked source across dev and unseen
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_full92_ball_control_hybrid_shadow_v3.py \
            --root . \
            --out gamepulse/fusion/qa/igp_fullx/full92_ball_control_hybrid_devfrozen_unseen_v3_20261103.json \
            > "$RUNNER_TEMP/full92-hybrid.log" 2>&1 || {
              echo FULL92_HYBRID_PRIVATE_FAILURE
              python3 - <<'PY'
          import os,re
          from pathlib import Path
          s=(Path(os.environ['RUNNER_TEMP'])/'full92-hybrid.log').read_text(errors='replace').splitlines()
          v=next((z for z in reversed(s) if re.match(r'^(ValueError|AssertionError|KeyError|TypeError|IndexError):',z)),None)
          if v:
              t,_,detail=v.partition(':');c=detail.strip().split(':')[0].split(' ')[0]
              print(t,c if re.fullmatch(r'[A-Z0-9_]{5,90}',c) else 'REDACTED')
          else:print('UNCLASSIFIED_PRIVATE_FAILURE')
          PY
              exit 41
            }
      - name: Verify frozen policy and aggregate with no private XYZ
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('gamepulse/fusion/qa/igp_fullx/full92_ball_control_hybrid_devfrozen_unseen_v3_20261103.json')
          d=json.loads(p.read_bytes())
          assert d['schema']=='igp.full92.causal-controlled-ball-fixed-blend.source-mask.v3'
          assert len(d['dev_game_ids'])==len(d['unseen_game_ids'])==3
          assert not (set(d['dev_game_ids'])&set(d['unseen_game_ids']))
          assert d['weight_selection_uses_unseen_source'] is False
          assert d['original_source_rewrite'] is False and d['physical_ball_custody_certified']==0
          for k,v in d['unseen_frozen_policy_vs_linear'].items():
              assert v['heldout_original_points']==v['frozen_hybrid']['n']==v['forward_linear_same_points']['n']
              assert d['frozen_weight_policy'][k] in [0,.25,.5,.75,1]
          print('FULL92_FROZEN_CONTROL_HYBRID_QA_PASS',json.dumps({
              'policy':d['frozen_weight_policy'],'unseen':d['unseen_frozen_policy_vs_linear'],
              'no_promotion':True},sort_keys=True))
          PY
      - name: Commit source-verified proprietary QA privately
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_fullx/full92_ball_control_hybrid_devfrozen_unseen_v3_20261103.json
          git diff --cached --check
          if git diff --cached --quiet; then echo ALREADY_PRIVATE; exit 0; fi
          git commit -qm 'qa(igp): Full92 dev-frozen causal player-ball hybrid unseen receipt'
          gh auth setup-git
          for n in 1 2 3 4; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || exit 43
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo FULL92_CONTROL_HYBRID_PRIVATE_RECEIPT_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 44
