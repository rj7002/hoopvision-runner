name: Full92 new18 capped ball correction private source QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full92-ball-control-1ft-capped-fresh18-private-20261103.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-source-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/full92-ball-control-persistence-shadow-20261103
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public content boundary and authenticated private source
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Verify fresh18 and bounded correction source-free
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -s gamepulse/fusion/tests -p 'test_igp_full92_ball_control_bounded_fresh18_v5.py' -v
      - name: Real original NBA Full92 fresh18 masked source evaluation
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_full92_ball_control_bounded_fresh18_v5.py \
            --root . --out gamepulse/fusion/qa/igp_fullx/full92_ball_control_new18_bounded_v5_20261103.json \
            >"$RUNNER_TEMP/bounded18.log" 2>&1 || {
              echo PRIVATE_BOUNDED18_RUN_FAILURE
              python3 - <<'PY'
          import os,re
          from pathlib import Path
          z=(Path(os.environ["RUNNER_TEMP"])/"bounded18.log").read_text(errors="replace").splitlines()
          e=next((t for t in reversed(z) if re.match(r"^(?:ValueError|AssertionError|TypeError|KeyError|IndexError):",t)),None)
          if e:
              typ,_,code=e.partition(":");s=code.strip().split(":")[0].split(" ")[0]
              print(typ,s if re.fullmatch(r"[A-Z0-9_]{5,90}",s) else "REDACTED")
          else:print("NO_ALLOWED_ERROR_CODE")
          PY
              exit 41
            }
      - name: Verify privacy, source masks, and publish bounded aggregate only
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("gamepulse/fusion/qa/igp_fullx/full92_ball_control_new18_bounded_v5_20261103.json").read_bytes())
          assert d["games"]==18 and len(set(d["ids"]))==18
          assert not set(d["ids"])&set(d["excluded_earlier_18"])
          assert d["correction_cap_frozen_before_new18_ft"]==1.0
          assert d["weights_frozen_before_new18"]=={"1":0,"3":.25,"5":0,"10":0}
          assert d["source_XYZ_and_accepted_default_unchanged"] and d["certified_physical_control"]==0
          for k,v in d["results"].items():
              assert v["same_masked_targets"]==v["capped_player"]["n"]==v["original_forward_linear"]["n"]
          print("FULL92_BOUNDED_FRESH18_QA_PASS",json.dumps({
              "games":d["games"],"results":d["results"],"physical_control_certified":0},sort_keys=True))
          PY
      - name: Commit original-source masked QA only to private repository
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_fullx/full92_ball_control_new18_bounded_v5_20261103.json gamepulse/fusion/qa/igp_fullx/full92_ball_native_natural92_census_v1_20261103.json gamepulse/fusion/qa/igp_fullx/full92_ball_native_10hz_3game_pilot_v6_20261103.json gamepulse/fusion/qa/igp_fullx/full92_ball_native_10hz_doublemask_v6_20261103.json
          git diff --cached --check
          if git diff --cached --quiet; then echo ALREADY_COMMITTED; exit 0; fi
          git commit -qm 'qa(igp): bounded player ball original-native source masked fresh18'
          gh auth setup-git
          for n in 1 2 3 4; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || exit 43
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo FULL92_FRESH18_BOUNDED_PRIVATE_QA_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 44
