# Private licensed NBA data only; public runner stores no original payloads.
name: IGP81 source-grade authorized positions companion variant probe
# Dedicated original-provider source fallback for five detail gaps and one control
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp81-companion-positions-variant-probe.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp81-original-positions-authorized-probe
  cancel-in-progress: false
jobs:
  probe-position-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - id: '0022600006'
            tipoff: '2026-10-22T23:00:00Z'
          - id: '0022600086'
            tipoff: '2026-10-21T23:00:00Z'
          - id: '0022600142'
            tipoff: '2026-10-29T01:30:00Z'
          - id: '0022600111'
            tipoff: '2026-10-25T02:00:00Z'
          - id: '0022600143'
            tipoff: '2026-10-29T02:30:00Z'
          - id: '0022600009'
            tipoff: '2026-10-22T00:00:00Z'
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      TARGET_BRANCH: research/igp81-all-layers-source-grade-20261101
      NBA_GAME_ID: ${{ matrix.id }}
      NBA_TIPOFF_UTC: ${{ matrix.tipoff }}
      IGP_SDK_SOURCE_VARIANT: positions
      IGP_SDK_INIT_TIMEOUT_MS: '45000'
      IGP_PRIVATE_CAPTURE_DIR: /tmp/igp-private-original-positions-variant
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: First-party SDK prerequisite and public boundary check
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          cd tools/licensed_feed
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Obtain authorized positions variant via SDK standard initialization only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$IGP_PRIVATE_CAPTURE_DIR"
          node tools/licensed_feed/companion_original_sdk_probe.mjs > "$RUNNER_TEMP/private-position-sdk-log"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["IGP_PRIVATE_CAPTURE_DIR"])
          r=json.loads((root/"companion_probe_receipt.json").read_bytes())
          assert r["game_id"]==os.environ["NBA_GAME_ID"]
          assert r["app_program_variant"]=="positions" and not r["authentication_bypass_attempted"]
          if r["status"]=="FULL_EVENT_RESPONSE_OBSERVED":
              data=(root/"companion_original_sdk_response.json").read_bytes()
              assert hashlib.sha256(data).hexdigest()==r["original_body_sha256"]
              assert len(json.loads(data))==r["original_body_event_count"]
          print("IGP81_POSITIONS_SDK_AUTHORIZED_STATUS",r["game_id"],r["status"],r.get("original_body_event_count",0),r.get("original_body_shot_details_count",0))
          PY
      - name: Certify response provenance and preserve raw response only privately
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$TARGET_BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set \
            gamepulse/fusion/evidence gamepulse/fusion/qa/igp_v32
          cd "$RUNNER_TEMP/private"
          python3 - <<'PY'
          import hashlib,json,os,shutil,collections
          from pathlib import Path
          gid=os.environ["NBA_GAME_ID"];root=Path(os.environ["IGP_PRIVATE_CAPTURE_DIR"])
          source=json.loads((root/"companion_probe_receipt.json").read_bytes())
          assert source["game_id"]==gid and source["app_program_variant"]=="positions"
          dest=Path("gamepulse/fusion/evidence")/("companion_positions_sdk_original_"+gid)
          dest.mkdir(parents=True,exist_ok=True)
          original=dest/"sdk_observed_original.json"
          originalreceipt=dest/"sdk_original_receipt.json"
          stats=collections.Counter()
          fields=collections.Counter()
          if source["status"]=="FULL_EVENT_RESPONSE_OBSERVED":
              raw=(root/"companion_original_sdk_response.json").read_bytes()
              assert hashlib.sha256(raw).hexdigest()==source["original_body_sha256"]
              events=json.loads(raw)
              assert isinstance(events,list) and len(events)==source["original_body_event_count"]
              for event in events:
                  for k in ("event","type","eventType","name"):
                      if isinstance(event,dict) and isinstance(event.get(k),str):
                          stats[event[k]]+=1
                  if isinstance(event,dict):
                      for k in event:
                          fields[str(k)]+=1
              if original.exists():
                  prev=json.loads(originalreceipt.read_bytes())
                  assert hashlib.sha256(original.read_bytes()).hexdigest()==prev["original_body_sha256"]
                  if raw!=original.read_bytes():
                      history=dest/"source_revision_history"
                      history.mkdir(exist_ok=True)
                      revision=history/(source["original_body_sha256"]+".json")
                      if revision.exists():assert revision.read_bytes()==raw
                      else:revision.write_bytes(raw)
                      (history/(source["original_body_sha256"]+".receipt.json")).write_text(json.dumps(source,indent=2,sort_keys=True)+"\n")
              else:
                  original.write_bytes(raw)
                  originalreceipt.write_text(json.dumps(source,indent=2,sort_keys=True)+"\n")
          else:
              if not originalreceipt.exists():
                  originalreceipt.write_text(json.dumps(source,indent=2,sort_keys=True)+"\n")
          # These are candidate schema counts, never evidence of certified 29-joint trajectories.
          audit={"schema":"igp81-authorized-companion-positions-source-variant.v1",
                 "game_id":gid,"program_variant":"positions",
                 "source_status":source["status"],
                 "source_original_body_sha256":source.get("original_body_sha256"),
                 "source_original_events":source.get("original_body_event_count",0),
                 "source_shotdetails":source.get("original_body_shot_details_count",0),
                 "event_type_counts":dict(stats),
                 "event_top_level_field_names":sorted(fields),
                 "raw_29joint_60Hz_pose_certified":False,
                 "physical_video_alignment_certified":False,
                 "original_payload_stored_only_in_private_repo":True,
                 "authentication_bypass_attempted":False}
          p=Path("gamepulse/fusion/qa/igp_v32")/("igp81_positions_variant_"+gid+".json")
          payload=(json.dumps(audit,sort_keys=True,indent=2)+"\n").encode()
          if not p.exists() or p.read_bytes()!=payload:p.write_bytes(payload)
          print("IGP81_POSITIONS_PRIVATE_RECEIPT",gid,audit["source_status"],audit["source_original_events"])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "gamepulse/fusion/evidence/companion_positions_sdk_original_$NBA_GAME_ID" \
            "gamepulse/fusion/qa/igp_v32/igp81_positions_variant_$NBA_GAME_ID.json"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo IGP81_POSITIONS_SOURCE_NOT_CHANGED
            exit 0
          fi
          git commit -q -m "qa(igp81): preserve first-party positions program source grade $NBA_GAME_ID"
          for n in $(seq 1 12); do
            git fetch -q origin "$TARGET_BRANCH"
            git rebase -q "origin/$TARGET_BRANCH"
            if git push -q origin "HEAD:refs/heads/$TARGET_BRANCH"; then
              echo IGP81_POSITIONS_VARIANT_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 24
