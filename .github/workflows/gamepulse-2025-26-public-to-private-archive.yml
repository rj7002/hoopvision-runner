name: IGP 2025-26 public original tracking archive to private release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gamepulse-2025-26-public-to-private-archive.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-public-2025-26-source-immutable-release
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Protect public policy and compile ingestion code
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          python3 -m py_compile tools/neilball_2025_26_public_archive_ingest.py
      - name: Synthetic source conservation test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, json, os, zipfile
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"synthetic.zip"
          row={"game_id":"0022500613","timestamp_ms":1750000000000,
               "home_players":[],"away_players":[],"ball":[0,0,3],
               "quality":{"all_ten_and_ball_observed":True}}
          with zipfile.ZipFile(p,"w") as z:
              z.writestr("games/0022500613/tracking.jsonl.gz",
                         gzip.compress((json.dumps(row)+"\n").encode()))
              z.writestr("manifest.json","{}")
          PY
          python3 tools/neilball_2025_26_public_archive_ingest.py \
              --archive "$RUNNER_TEMP/synthetic.zip" \
              --output "$RUNNER_TEMP/synthetic-shards" --max-shard-mib 50
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"synthetic-shards/nba-2025-26-source-index.json"
          x=json.loads(p.read_text())
          assert x["total_tracking_games_verified"]==1 and x["total_normalized_rows"]==1
          assert x["total_original_members_copied"]==2
          print("IGP_SOURCE_CONSERVATION_SYNTHETIC_PASS")
          PY
      - name: Download full verified source archive
        shell: bash
        run: |
          set -euo pipefail
          available=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2{print $4}')
          test "$available" -gt 7000000
          url='https://downloads.neilball.org/NBA-2025-26-Available-Tracking.zip'
          curl --fail --silent --show-error --location --retry 5 --retry-delay 10 \
              --retry-all-errors --connect-timeout 30 --max-time 4600 \
              --proto '=https' --proto-redir '=https' \
              --output "$RUNNER_TEMP/NBA-2025-26-Available-Tracking.zip" "$url"
          test "$(stat -c%s "$RUNNER_TEMP/NBA-2025-26-Available-Tracking.zip")" -eq 5170096251
          sha256sum "$RUNNER_TEMP/NBA-2025-26-Available-Tracking.zip"
          echo IGP_2025_26_ORIGINAL_ARCHIVE_BYTES_VERIFIED
      - name: Verify original ZIP member payload SHA and 2025-26 native record coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/neilball_2025_26_public_archive_ingest.py \
              --archive "$RUNNER_TEMP/NBA-2025-26-Available-Tracking.zip" \
              --output "$RUNNER_TEMP/igp-historical-shards" \
              --max-shard-mib 350 --expected-size 5170096251
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"igp-historical-shards/nba-2025-26-source-index.json"
          x=json.loads(p.read_text())
          assert x["total_tracking_games_verified"]>=600
          assert x["total_original_members_copied"]>=600
          assert len(x["shards"])>1
          print("IGP_2025_26_L0_SOURCE_MEMBERS_VERIFIED",
                x["total_tracking_games_verified"],x["total_normalized_rows"],len(x["shards"]))
          PY
      - name: Upload all verified shard assets exclusively to private 104 release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          TAG='igp-public-gamepulse-2025-26-20261105'
          REPO='timeedmonds-maker/104'
          root="$RUNNER_TEMP/igp-historical-shards"
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --target main --draft \
              --title 'NBA 2025-26 original public Game Pulse archive' \
              --notes 'Historical L0 source archive; original member bytes and SHA preserved. Normalized tracking remains at native 5 Hz cadence. Not certified full-lineup tracking, positions or physical custody. Separate from the 2026-27 Full107 database.'
          fi
          for asset in "$root"/nba-2025-26-shard-*.zip; do
            gh release upload "$TAG" "$asset" --repo "$REPO" --clobber
          done
          gh release upload "$TAG" "$root/nba-2025-26-source-index.json" \
             --repo "$REPO" --clobber
          gh release view "$TAG" --repo "$REPO" --json assets > "$RUNNER_TEMP/private-assets.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])
          index=json.loads((p/'igp-historical-shards/nba-2025-26-source-index.json').read_text())
          entries=json.loads((p/'private-assets.json').read_text())['assets']
          got={e['name']:e['size'] for e in entries}
          for asset in index['shards']:
              assert got.get(asset['name'])==asset['bytes'], "PRIVATE_SHARD_MISSING"
          assert got.get('nba-2025-26-source-index.json',0)>100
          print('IGP_2025_26_L0_PRIVATE_ALL_SHARDS_ACCEPTED',
                index['total_tracking_games_verified'],len(index['shards']))
          PY
          gh release edit "$TAG" --repo "$REPO" --draft=false
          echo IGP_2025_26_PRIVATE_L0_INGEST_ACCEPTED
