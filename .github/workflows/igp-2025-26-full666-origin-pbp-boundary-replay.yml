# Bypass GitHub private Release API download limits entirely:
# 5.17GB exact-SHA original publisher -> 666 games -> historical PBP candidates
# -> sampled native game clock and ball evidence, NOT certified physical custody.
name: IGP Full666 2025-26 direct-original possession boundary full replay
'on':
  push:
    branches: [main]
    paths: [.github/workflows/igp-2025-26-full666-origin-pbp-boundary-replay.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-full666-2025-26-original-publisher-possession-qa
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
  ENGINE_BRANCH: research/gamepulse-clock-boundary-integrity-20261025
  TARGET_RELEASE: igp-full666-2025-26-possession-audit-20261106
jobs:
  original:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify strict policy, private source branch and pinned original-origin boundary replayer
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$ENGINE_BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" hash-object gamepulse/fusion/igp_2025_26_full666_origin_possession_boundary_audit_v1.py)" = e526c5f997383eedcaa32b46966b5685efe978c8
          python3 -m py_compile "$RUNNER_TEMP/private/gamepulse/fusion/igp_2025_26_full666_origin_possession_boundary_audit_v1.py"
          export PYTHONPATH="$RUNNER_TEMP/private/gamepulse/fusion"
          cd "$RUNNER_TEMP/private"
          python3 -m unittest -q gamepulse.fusion.tests.test_igp_2025_26_full666_possession_boundary_audit_v1
          echo FULL666_ORIGINAL_DIRECT_PBP_BOUNDARY_SOURCE_CODE_AND_TESTS_PINNED
      - name: Download immutable 2025-26 original 5.17GB publisher source, not private Release assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2{print $4}')" -gt 7000000
          curl --fail --silent --show-error --location --retry 10 --retry-delay 10 \
            --retry-all-errors --connect-timeout 45 --max-time 5200 \
            --proto '=https' --proto-redir '=https' \
            --output "$RUNNER_TEMP/NBA-2025-26-Available-Tracking.zip" \
            'https://downloads.neilball.org/NBA-2025-26-Available-Tracking.zip'
          test "$(stat -c%s "$RUNNER_TEMP/NBA-2025-26-Available-Tracking.zip")" -eq 5170096251
          echo FULL666_ORIGINAL_DIRECT_PUBLISHER_ARCHIVE_BYTES_VERIFIED
      - name: Validate original zip game+stats source presence and historical parser before full replay
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/private/gamepulse/fusion"
          export HISTORICAL_ORIGINAL_ZIP="$RUNNER_TEMP/NBA-2025-26-Available-Tracking.zip"
          python3 - <<'PY'
          import json,os,zipfile
          from igp_2025_26_full666_origin_possession_boundary_audit_v1 import original_members
          from igp_full107_native_historical_2025_26_v1 import decode_gzip
          from igp_2025_26_full666_pbp_possession_index_v1 import parse_actions,build_chains,derive_player_team
          with zipfile.ZipFile(os.environ['HISTORICAL_ORIGINAL_ZIP']) as archive:
            matched=original_members(archive)
            withstats={gid:g for gid,g in matched.items() if 'stats.jsonl.gz' in g}
            assert len(withstats)>=660,('HISTORICAL_ORIGINAL_PUBLISHER_PBP_NOT_PRESENT',len(withstats))
            gid=next(iter(sorted(withstats)))
            raw=withstats[gid]
            frames=list(decode_gzip(archive.read(raw['tracking.jsonl.gz'])))
            rows=list(decode_gzip(archive.read(raw['stats.jsonl.gz'])))
            acts,rev,bad=parse_actions(rows)
            chains,mapa=build_chains(gid,acts,derive_player_team(frames))
            assert len(frames)>500 and len(acts)>100 and len(chains)>30,(gid,len(frames),len(acts),len(chains))
            print('FULL666_ORIGINAL_FIRST_GAME_PBP_AND_TRACKING_PREFLIGHT',
              json.dumps({'games_with_original_tracking':len(matched),
                'games_with_original_PBP_source':len(withstats),
                'sample_game_id':gid,'native_timestamps':len(frames),
                'PBP_actions':len(acts),'candidate_chains':len(chains),
                'original_2025_26_game_source_not_GitHub_Release':True},sort_keys=True),flush=True)
          PY
      - name: Replay entire original publisher and audit all historical source-provisional possession boundaries
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/private/gamepulse/fusion"
          mkdir -p "$RUNNER_TEMP/out"
          python3 -u "$RUNNER_TEMP/private/gamepulse/fusion/igp_2025_26_full666_origin_possession_boundary_audit_v1.py" \
            --source-zip "$RUNNER_TEMP/NBA-2025-26-Available-Tracking.zip" \
            --out "$RUNNER_TEMP/out" --workers 3
          test -s "$RUNNER_TEMP/out/full666-origin-possession-audit-all666-final.json"
          test "$(find "$RUNNER_TEMP/out" -name '*-qa.json' | wc -l)" -eq 15
          test "$(find "$RUNNER_TEMP/out" -name '*.sqlite.gz' | wc -l)" -eq 15
          echo FULL666_ORIGINAL_PUBLISHER_666_GAME_SOURCE_CLOCK_BOUNDARY_AUDIT_CONSERVED
      - name: Commit source-verified aggregate and game-by-game QA to private research branch via Git transport
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          dest="gamepulse/fusion/qa/historical/igp-full666-2025-26-original-publisher-possession-boundary-all666.json"
          mkdir -p "$(dirname "$dest")"
          cp "$RUNNER_TEMP/out/full666-origin-possession-audit-all666-final.json" "$dest"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dest"
          git diff --cached --check
          git commit -qm 'qa(Full666): original SHA-verified 666-game historical PBP-clock boundary audit, source uncertainty preserved'
          for attempt in $(seq 1 12);do
            git fetch -q origin "$ENGINE_BRANCH"
            git rebase -q "origin/$ENGINE_BRANCH"
            if git push -q origin "HEAD:refs/heads/$ENGINE_BRANCH";then
              echo FULL666_666_SOURCE_PBP_BOUNDARY_QA_PRIVATE_GIT_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 44
      - name: Store per-boundary private SQLite evidence on protected Full666 audit release when upload quotas permit
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 20);do
            if gh release upload "$TARGET_RELEASE" \
              "$RUNNER_TEMP/out/full666-origin-possession-audit-"*.sqlite.gz \
              "$RUNNER_TEMP/out/full666-origin-possession-audit-"*-qa.json \
              "$RUNNER_TEMP/out/full666-origin-possession-audit-all666-final.json" \
              --repo timeedmonds-maker/104 --clobber;then
              ok=1;break
            fi
            echo FULL666_ORIGINAL_PRIVATE_PER_BOUNDARY_UPLOAD_RETRY attempt="$attempt"
            sleep 140
          done
          test "$ok" -eq 1
          echo FULL666_FULL666_ORIGINAL_SOURCE_BOUNDARY_SQLITE_EVIDENCE_PRIVATELY_RETAINED
