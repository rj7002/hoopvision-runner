name: IGP81 recover missing original companion event programs
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/igp81-retry-missing-three-companion.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp81-authorized-missing-three-source-retry
  cancel-in-progress: false
jobs:
  sdk-try:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {id: '0022600006', tipoff: '2026-10-22T23:00:00Z'}
          - {id: '0022600086', tipoff: '2026-10-21T23:00:00Z'}
          - {id: '0022600142', tipoff: '2026-10-29T01:30:00Z'}
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      NBA_GAME_ID: ${{ matrix.id }}
      NBA_TIPOFF_UTC: ${{ matrix.tipoff }}
      IGP_PRIVATE_CAPTURE_DIR: /tmp/igp81-source-sdk-recovery
      BRANCH: research/igp81-all-layers-source-grade-20261101
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install authentic licensed SDK and verify public source guard
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python3 tools/public_content_guard.py
          mkdir -p "$IGP_PRIVATE_CAPTURE_DIR"
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          cd tools/licensed_feed
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Test authorized original companion events without bypass
        shell: bash
        run: |
          set -euo pipefail
          node tools/licensed_feed/companion_original_sdk_probe.mjs > "$RUNNER_TEMP/private-companion-original.log"
          python3 - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          d=Path(os.environ['IGP_PRIVATE_CAPTURE_DIR'])
          q=json.loads((d/'companion_probe_receipt.json').read_bytes())
          assert q['game_id']==os.environ['NBA_GAME_ID']
          assert q['authentication_bypass_attempted'] is False
          assert q['raw_29joint_pose_60hz_observed'] is False
          if q['status']=='FULL_EVENT_RESPONSE_OBSERVED':
              p=d/'companion_original_sdk_response.json'
              assert hashlib.sha256(p.read_bytes()).hexdigest()==q['original_body_sha256']
              assert len(p.read_bytes())==q['original_body_bytes']
              ev=json.loads(p.read_bytes())
              assert len(ev)==q['original_body_event_count']
          print('IGP81_AUTHORIZED_SOURCE_GAP_RETRY',q['game_id'],q['status'],
                q.get('original_body_shot_details_count',0),flush=True)
          PY
      - name: Preserve actual original event response only privately with immutable SHA
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set \
            gamepulse/fusion/evidence \
            gamepulse/fusion/qa/igp_v32
          cd "$RUNNER_TEMP/private"
          python3 - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          root=Path('gamepulse/fusion')
          gid=os.environ['NBA_GAME_ID']
          cap=Path(os.environ['IGP_PRIVATE_CAPTURE_DIR'])
          rec=json.loads((cap/'companion_probe_receipt.json').read_bytes())
          assert rec['game_id']==gid
          qa=root/'qa/igp_v32'/('igp81_original_companion_gap_retry_'+gid+'.json')
          qa.parent.mkdir(parents=True,exist_ok=True)
          if qa.exists():
              old=json.loads(qa.read_bytes())
              assert old['game_id']==gid
              if old.get('status')=='FULL_EVENT_RESPONSE_OBSERVED' and rec['status']!='FULL_EVENT_RESPONSE_OBSERVED':
                  print('IGP81_PRIOR_SOURCE_SUCCESS_RETAINED',gid)
                  raise SystemExit(0)
          qa.write_text(json.dumps(rec,sort_keys=True,indent=2)+'\n')
          if rec['status']=='FULL_EVENT_RESPONSE_OBSERVED':
              p=root/'evidence'/('companion_sdk_original_'+gid)
              p.mkdir(parents=True,exist_ok=True)
              dest=p/'sdk_observed_original.json'
              original=cap/'companion_original_sdk_response.json'
              assert hashlib.sha256(original.read_bytes()).hexdigest()==rec['original_body_sha256']
              if dest.exists():
                  assert hashlib.sha256(dest.read_bytes()).hexdigest()==rec['original_body_sha256'], 'PRIOR_COMPANION_SOURCE_SHA_CHANGED'
              else:dest.write_bytes(original.read_bytes())
              (p/'sdk_original_receipt.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
              print('IGP81_ORIGINAL_COMPANION_FULL_SHA_PRESERVED_PRIVATE',gid)
          else:
              print('IGP81_ORIGINAL_COMPANION_STILL_UNAVAILABLE',gid,rec['status'])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "gamepulse/fusion/qa/igp_v32/igp81_original_companion_gap_retry_$NBA_GAME_ID.json"
          if test -f "gamepulse/fusion/evidence/companion_sdk_original_$NBA_GAME_ID/sdk_observed_original.json"; then
            git add -f "gamepulse/fusion/evidence/companion_sdk_original_$NBA_GAME_ID"
          fi
          git diff --cached --check
          if git diff --cached --quiet; then
            echo IGP81_COMPANION_RETRY_NOTHING_NEW
            exit 0
          fi
          git commit -q -m "qa(igp): authorized original companion source retry $NBA_GAME_ID"
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo IGP81_COMPANION_RETRY_PRIVATE_SHA_COMMIT
              exit 0
            fi
            sleep "$n"
          done
          exit 36
