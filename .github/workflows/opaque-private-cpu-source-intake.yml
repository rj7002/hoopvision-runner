name: Opaque private-authorized CPU-only source intake
on:
  push:
    branches: ['cpu-animate-opaque-private-cpu-20261108']
    paths:
      - '.github/workflows/opaque-private-cpu-source-intake.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opaque-private-cpu-source-intake-f48f7c6d
  cancel-in-progress: false

jobs:
  private-authorized-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      REQUEST_ID: 'req-f48f7c6d5e103b9aa80f6d2147b3c9e2'
      CUDA_VISIBLE_DEVICES: '-1'
      NVIDIA_VISIBLE_DEVICES: 'none'
      OPENCV_OPENCL_RUNTIME: disabled
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify public runner has no private material
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "${GH_TOKEN:-}" || { echo PRIVATE_AUTH_NOT_AVAILABLE; exit 4; }
          test ! -e /dev/nvidia0
          test ! -e /dev/kfd
          echo PUBLIC_OPAQUE_CPU_SECURITY_GATE_PASS

      - name: Resolve one private authorization, pin code, test and ingest on CPU
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(mktemp -d)"
          chmod 700 "$ROOT"
          trap 'rm -rf "$ROOT"' EXIT

          # Only the opaque request ID traverses the public bridge.
          # A PRIVATE branch named by that ID holds the source authorization,
          # fixture identity and immutable reviewed code blob hashes.
          if ! gh auth setup-git > "$ROOT/auth.log" 2>&1; then
              echo PRIVATE_GIT_AUTH_HELPER_UNAVAILABLE
              exit 4
          fi
          if ! git clone -q --depth=1 --filter=blob:none --sparse \
               --branch "$REQUEST_ID" \
               https://github.com/timeedmonds-maker/104.git "$ROOT/private" \
               > "$ROOT/clone.log" 2>&1; then
              echo PRIVATE_OPAQUE_SOURCE_CHECKOUT_UNAVAILABLE
              exit 4
          fi
          if ! git -C "$ROOT/private" sparse-checkout set --no-cone \
               '/cpu_animate/' '/tests/' '/docs/cpu_animate/' \
               '/courtcoder/nba_event_angle_discovery.py' \
             > "$ROOT/sparse.log" 2>&1; then
              echo PRIVATE_SOURCE_SPARSE_CHECKOUT_FAILED
              exit 4
          fi
          cd "$ROOT/private"
          export CPU_ANIMATE_PRIVATE_SOURCE_GIT_ROOT="$PWD"
          python3 - "$REQUEST_ID" > "$ROOT/private-selection.txt" <<'PY'
          import json,re,subprocess,sys
          from pathlib import Path
          item=json.loads(Path('docs/cpu_animate/opaque_private_cpu_request.json').read_text())
          if (item.get('schema')!='cpu-animate.private-opaque-execution.v1'
              or item.get('request_id')!=sys.argv[1]
              or item.get('owner_approved') is not True
              or item.get('operation')!='private_sha_source_gate_and_cpu_angle_ingest'
              or item.get('storage')!='private_release_only'
              or item.get('gpu_allowed') is not False
              or item.get('gcp_allowed') is not False
              or item.get('public_video_release_allowed') is not False
              or item.get('max_cpu_minutes')!=22
              or item.get('angle_limit')!=3
              or item.get('source_gate_required') is not True):
              raise SystemExit(4)
          reviewed=item.get('approved_source_git_blob_sha1') or {}
          required={
             'cpu_animate/multi_angle_cpu_ingest.py',
             'cpu_animate/min_ato_0181_source_gate.py',
             'docs/cpu_animate/rockets_minnesota_0022600181_ato_manifest.json',
             'tests/test_cpu_animate_minnesota_ato_0181.py'
          }
          if set(reviewed)!=required:raise SystemExit(4)
          for path,expected in reviewed.items():
              if not re.fullmatch(r'[0-9a-f]{40}',expected):raise SystemExit(4)
              actual=subprocess.run(['git','hash-object',path],capture_output=True,
                                    text=True,check=True).stdout.strip()
              if actual!=expected:raise SystemExit(4)
          gid=item.get('game_id','')
          event=item.get('shot_event')
          if not re.fullmatch(r'00226[0-9]{5}',gid):raise SystemExit(4)
          if not isinstance(event,int) or event<1 or event>999999:raise SystemExit(4)
          print(gid)
          print(event)
          print(item['angle_limit'])
          PY
          mapfile -t CONTROL < "$ROOT/private-selection.txt"
          test "${#CONTROL[@]}" = 3 || { echo PRIVATE_AUTHORIZATION_INVALID; exit 4; }
          export CPU_ANIMATE_SOURCE_GAME_ID="${CONTROL[0]}"
          export CPU_ANIMATE_SOURCE_EVENT_NUM="${CONTROL[1]}"
          export CPU_ANIMATE_ANGLE_LIMIT="${CONTROL[2]}"
          export CPU_ANIMATE_HISTORICAL_REGISTRY_JSON="$PWD/docs/cpu_animate/frozen_reference/adams_jazz_game_camera_registry_v6.json"
          export CPU_ANIMATE_HISTORICAL_CHOOSER_JSON="$PWD/docs/cpu_animate/frozen_reference/event489_camera_options.json"
          echo PRIVATE_OPAQUE_REQUEST_AND_REVIEWED_SOURCE_BLOBS_VERIFIED
          # Read the original immutable NBA source through authenticated
          # sparse Git; REST contents endpoint was not accessible to runner.
          python3 - "$PWD/docs/cpu_animate/opaque_private_cpu_request.json" > "$ROOT/native-source-input.txt" <<'PY'
          import json,re,sys
          item=json.load(open(sys.argv[1]))
          ref=item['original_source_branch']
          p1=item['original_pbp_path']
          p2=item['original_xyz_index_path']
          if not re.fullmatch(r'research/[A-Za-z0-9._/-]{1,120}',ref):raise SystemExit(4)
          if (p1!='gamepulse/fusion/official_pbp_timing/games/0022600181.json'
              or p2!='gamepulse/fusion/materialized/igp_all_original_xyz/0022600181/index.json'):
              raise SystemExit(4)
          print(ref)
          print(p1)
          print(p2)
          PY
          mapfile -t NATIVE < "$ROOT/native-source-input.txt"
          test "${#NATIVE[@]}" = 3 || { echo PRIVATE_ORIGINAL_BRANCH_SOURCE_INVALID; exit 4; }
          if ! git clone -q --depth=1 --filter=blob:none --sparse \
               --branch "${NATIVE[0]}" \
               https://github.com/timeedmonds-maker/104.git "$ROOT/original" \
               > "$ROOT/native-clone.log" 2>&1; then
               echo PRIVATE_ORIGINAL_GIT_SOURCE_CHECKOUT_UNAVAILABLE
               exit 4
          fi
          if ! git -C "$ROOT/original" sparse-checkout set --no-cone \
               "${NATIVE[1]}" "${NATIVE[2]}" \
               > "$ROOT/native-sparse.log" 2>&1; then
               echo PRIVATE_ORIGINAL_GIT_SOURCE_SPARSE_CHECKOUT_FAILED
               exit 4
          fi
          export CPU_ANIMATE_SOURCE_GIT_ROOT="$ROOT/original"
          echo PRIVATE_ORIGINAL_GIT_SPARSE_SOURCE_READY
          if ! python3 -m unittest discover -s tests -p test_cpu_animate_minnesota_ato_0181.py \
             > "$ROOT/tests.log" 2>&1; then
             echo PRIVATE_SOURCE_REGRESSION_TEST_FAILED
             exit 4
          fi
          if ! python3 -m cpu_animate.min_ato_0181_source_gate \
             > "$ROOT/verified-source.log" 2>&1; then
             python3 - "$ROOT/verified-source.log" <<'PY'
          import re,sys
          contents=open(sys.argv[1]).read()
          failures=re.findall(r'(?m)^([A-Za-z_][A-Za-z0-9_.]*(?:Error|Exception)):',contents)
          print('PRIVATE_SOURCE_GATE_EXCEPTION_CLASS',failures[-1] if failures else 'UNKNOWN')
          if 'private_json' in contents:print('PRIVATE_GATE_STAGE_SOURCE_FETCH')
          elif 'verify_source' in contents:print('PRIVATE_GATE_STAGE_SOURCE_VALIDATION')
          else:print('PRIVATE_GATE_STAGE_UNKNOWN')
          PY
             echo PRIVATE_ORIGINAL_SOURCE_GATE_FAILED
             exit 4
          fi
          echo PRIVATE_ORIGINAL_GAME_SOURCE_SHA_PASS

          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
             sudo apt-get update -qq >/dev/null 2>&1
             sudo apt-get install -y -qq ffmpeg > "$ROOT/ffmpeg-install.log" 2>&1
          fi
          python3 -m pip install -q --disable-pip-version-check \
             numpy opencv-python-headless > "$ROOT/pip.log" 2>&1 || {
             echo PUBLIC_CPU_NUMERIC_DEPENDENCY_UNAVAILABLE
             exit 4
          }
          if ! python3 -m unittest discover -s tests -p test_cpu_animate_angle_taxonomy.py \
             > "$ROOT/taxonomy.log" 2>&1; then
             echo PRIVATE_CAMERA_TAXONOMY_GATE_FAILED
             exit 4
          fi
          echo PRIVATE_CPU_ANGLE_DISCOVERY_RUNNING
          if ! python3 -m cpu_animate.multi_angle_cpu_ingest \
             > "$ROOT/ingest.log" 2>&1; then
             python3 - "$ROOT/ingest.log" <<'PY'
          import re,sys
          trace=open(sys.argv[1]).read()
          kinds=re.findall(r'(?m)^([A-Za-z_][A-Za-z0-9_.]*(?:Error|Exception)):',trace)
          methods=re.findall(r'File "[^"]*/cpu_animate/multi_angle_cpu_ingest.py", line \\d+, in ([A-Za-z_][A-Za-z0-9_]*)',trace)
          print("PRIVATE_NBA_INGEST_EXCEPTION_CLASS", kinds[-1] if kinds else "UNKNOWN")
          print("PRIVATE_NBA_INGEST_METHOD_CHAIN", ",".join(methods[-4:]) if methods else "UNKNOWN")
          print("PRIVATE_NBA_ANGLE_DISCOVERY_STAGE", "YES" if "private_source_discovery" in trace else "NO")
          safe_codes={
            'NBA event cameras unavailable at provider':'NBA_HLS_PROVIDER_UNAVAILABLE',
            'ARCHIVED_FREEZE_SPIN_CAMERA_TAXONOMY_NOT_MOUNTED':'CAMERA_TAXONOMY_NOT_MOUNTED',
            'HISTORICAL_CAMERA_REGISTRY_BYTES_CHANGED':'CAMERA_REGISTRY_SHA_MISMATCH',
            'HISTORICAL_CAMERA_OPTIONS_BYTES_CHANGED':'CAMERA_OPTIONS_SHA_MISMATCH',
            'PRIVATE_AUTHORIZED_SOURCE_CHECKOUT_REQUIRED':'PRIVATE_SOURCE_CHECKOUT_MISSING',
            'PRIVATE_NBA_ANGLE_PARSER_GIT_FILE_ABSENT':'LOCAL_ANGLE_PARSER_MISSING',
            'PRIVATE_NBA_ANGLE_PARSER_GIT_SHA_CHANGED':'LOCAL_ANGLE_PARSER_SHA_MISMATCH',
            'PRIVATE_EXISTING_ANGLE_INVENTORY_UNAVAILABLE':'PRIVATE_RELEASE_INVENTORY_UNAVAILABLE',
            'No new physical-view-family camera feed could be ingested':'NO_USABLE_SOURCE_HLS',
            'Private GitHub release authentication missing':'PRIVATE_RELEASE_AUTH_MISSING',
            'Source media repository is not private':'PRIVATE_SOURCE_REPO_AUTH_FAIL'
          }
          lines=[x.strip() for x in trace.splitlines() if x.strip()]
          tail=lines[-1] if lines else ''
          detail=tail.split(': ',1)[-1]
          code=safe_codes.get(detail)
          if code is None and detail.startswith('PRIVATE_CPU_TOOL_FAILED_'):code='PRIVATE_GITHUB_OR_CPU_TOOL_FAILED'
          if code is None and detail.startswith('PRIVATE_SOURCE_RELEASE_DIGEST_READBACK_NOT_SETTLED_'):code='PRIVATE_RELEASE_SHA_NOT_SETTLED'
          print('PRIVATE_NBA_INGEST_SAFE_CAUSE',code or 'UNKNOWN')

          PY
             echo PRIVATE_VIDEO_INGEST_DID_NOT_COMPLETE
             exit 5
          fi
          echo PRIVATE_SHA_VERIFIED_VIDEO_ASSETS_STAGED
          echo PRIVATE_VIDEO_PTS_TO_UTC_AND_CAMERA_PIXEL_ACCEPTANCE_NOT_CLAIMED
