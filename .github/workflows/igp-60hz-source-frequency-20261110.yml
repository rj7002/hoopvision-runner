name: IGP original 60 Hz evidence gate 0153
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/igp-60hz-source-frequency-20261110.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-frequency:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify safe runner
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          echo ORIGINAL_60HZ_SAFE_RUNNER_AVAILABLE
