# Full121 official shot events are complete, advanced source sparse and strictly graded.
# Private 104 only; public logs contain no licensed coordinates or biomechanics.
name: IGP Full121 default source-graded 21331 FGA QA and release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full121-default-shots-qa-release-20261106.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-full121-graded-shot-release
  cancel-in-progress: false
jobs:
  validate-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: SHA validate current Full121 official shots and original feature absence
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion data/extensions/nba_blueprint_2026_27/games
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_fullx_rolling_shot_event_multiview_v2.py
          # Reconstruct the immutable Full121 ledger against the NOW COMPLETE 14/14
          # native source manifests. The prior frozen Full121 ledger predated 0184/0185.
          python3 gamepulse/fusion/igp_fullx_rolling_shot_event_multiview_v2.py --root .             --clips-game-key gameId --clips-schema GAME_ID_QUERY_UNVERIFIED_EVENT_NUM_PROBED             > "$RUNNER_TEMP/full121_fga_native_refresh_private.log" 2>&1 || {
              echo FULL121_SHA_FULLX_REFRESH_FAILED
              tail -c 600 "$RUNNER_TEMP/full121_fga_native_refresh_private.log" | sed -E 's/[^A-Za-z_0-9:.]/_/g'
              exit 73
            }
          python3 -m py_compile gamepulse/fusion/igp_full121_shot_default_v1.py
          python3 -m unittest discover -q -s gamepulse/fusion/tests \
              -p 'test_igp_full121_shot_default_v1.py'
          python3 - <<'PY'
          from igp_full121_shot_default_v1 import shot
          q=shot(".")
          assert q["indexed_games"]==121 and q["official_fga"]==21331
          assert q["no_missing_original_biomechanics_imputed"] is True
          assert not q["tracking_engine_changed"]
          s=shot(".","0022600186",725)
          assert s["companion_source_grade"]=="NOT_OBSERVED"
          assert s["biomechanics_30_features"] is None
          print("FULL121_GRADED_SHOTS_QA_PASSED",
                "games",q["indexed_games"],"official_fg_attempts",q["official_fga"],
                "companion_exact",q["original_companion_exact"],
                "unavailable_advanced",q["source_not_observed_for_other_fga"],
                "tracking_promoted",False)
          PY
      - name: Promote original-FGA shot query only; preserve Full92 reconstructed tracking default
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          from pathlib import Path
          from igp_full121_shot_default_v1 import shot, RELEASE, POINTER, SCHEMA
          import hashlib,json
          root=Path(".")
          info=shot(root)
          db=root/"gamepulse/fusion/igp_default_database.py"
          eng=root/"gamepulse/fusion/igp_default_engine.py"
          line="from igp_full121_shot_default_v1 import shot as shot_query\n"
          for p in (db,eng):
              a=p.read_text()
              if line not in a:p.write_text(a.rstrip()+"\n"+line)
          release=root/"gamepulse/fusion/qa/igp_progress_20261030/igp_full121_default_shot_release_v1.json"
          qa={"schema":"igp.full121.official-fga-graded-shot-default-release.v1",
              "default_shot_database":"FULL121","games":info["indexed_games"],
              "official_fga":info["official_fga"],
              "companion_original_exact":info["original_companion_exact"],
              "companion_original_unavailable":info["source_not_observed_for_other_fga"],
              "all_official_fga_rows_SHA_gated":True,
              "missing_original_xfg_biomechanics_not_imputed":True,
              "native_source_release_sha256":hashlib.sha256((root/RELEASE).read_bytes()).hexdigest(),
              "shot_pointer_sha256":hashlib.sha256((root/POINTER).read_bytes()).hexdigest(),
              "independent_physical_position_certified":False,
              "full121_10hz_tracking_default_promoted":False,
              "retained_tracking_default":"IGP_FULL92_V1_SOURCE_GRADED_NATURAL_SINGLE_20261103"}
          release.write_text(json.dumps(qa,sort_keys=True,indent=2)+"\n")
          import igp_default_database,igp_default_engine
          assert igp_default_database.shot_query(root)["official_fga"]==21331
          assert igp_default_engine.shot_query(root,"0022600186",725)["biomechanics_30_features"] is None
          assert igp_default_engine.DEFAULT_ENGINE=="IGP_FULL92_V1_SOURCE_GRADED_NATURAL_SINGLE_20261103"
          print("FULL121_SHOT_QUERY_READY_DEFAULT",qa["official_fga"],
                "previous_tracking_rollback_retained",True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Commit all newly materialized SHA-pinned official FGA row partitions
          # and pointer with the release, atomically.
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          base=Path("gamepulse/fusion")
          pointer=base/"qa/igp_fullx/shot_event_multiview_fullx_v2_latest.json"
          p=json.loads(pointer.read_bytes())
          idx=Path(p["index_path"]); q=json.loads(idx.read_bytes())
          gid="0022600186"; first=q["games"][gid]
          folder=Path(first["shots_path"]).parent.parent
          assert folder.name.startswith("FULL121_") and len(q["games"])==121
          for target in (pointer,idx,folder):
              subprocess.run(["git","add","-f",str(target)],check=True)
          PY
          git add -f gamepulse/fusion/igp_default_database.py \
            gamepulse/fusion/igp_default_engine.py \
            gamepulse/fusion/qa/igp_progress_20261030/igp_full121_default_shot_release_v1.json
          git diff --cached --check
          if git diff --cached --quiet; then echo FULL121_SHOT_DEFAULT_ALREADY_COMMITTED; exit 0; fi
          git commit -q -m "release(igp): default 121game original NBA FGA shot query, preserve unobserved advanced grades"
          for attempt in $(seq 1 16); do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo FULL121_SHOT_DEFAULT_PRIVATE_RELEASE_COMMITTED
              exit 0
            fi
            sleep "$((attempt*2))"
          done
          exit 87
