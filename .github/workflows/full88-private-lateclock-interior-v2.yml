# Registered with public_content_guard.py. Public repo contains no private data or methods.
name: Full88 private inter-event shotclock possession source verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/full88-private-lateclock-interior-v2.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: full88-private-lateclock-interior-v2
  cancel-in-progress: false
jobs:
  verified-private:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: analysis/full88-lateclock-event-clock-alllayers-20261102
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public content guard
        run: python3 tools/public_content_guard.py
      - name: Run source-free tests and frozen Full88 original data replay privately
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion data/extensions/nba_blueprint_2026_27/games
          cd "$RUNNER_TEMP/private"
          PYTHONPATH=gamepulse/fusion/analysis python3 -m py_compile gamepulse/fusion/analysis/full88_lateclock_interior_clock_possessions_v2.py
          PYTHONPATH=gamepulse/fusion/analysis python3 gamepulse/fusion/analysis/full88_lateclock_interior_clock_possessions_v2.py --self-test
          PYTHONPATH=gamepulse/fusion/analysis python3 gamepulse/fusion/analysis/full88_lateclock_interior_clock_possessions_v2.py --root . --out gamepulse/fusion/qa/analysis/full88_lateclock_event_clock_alllayers_20261102/interevent_clock_source_positive_v2.json > "$RUNNER_TEMP/private-execution-log" 2>&1 || {
            # The private failure traceback remains in 104, not public Actions logs.
            python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("gamepulse/fusion/qa/analysis/full88_lateclock_event_clock_alllayers_20261102/interevent_clock_failure_v2.json")
          p.write_text(json.dumps({"status":"FAILED","tail_private":pathlib.Path(__import__('os').environ["RUNNER_TEMP"]).joinpath("private-execution-log").read_text()[-10000:]},indent=2)+"\n")
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f gamepulse/fusion/qa/analysis/full88_lateclock_event_clock_alllayers_20261102/interevent_clock_failure_v2.json
            git commit -qm 'qa(private): Full88 interior clock run failure detail'
            git push -q origin "HEAD:refs/heads/$BRANCH" || true
            echo "PRIVATE_SOURCE_VERIFICATION_FAILED"
            exit 1
          }
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('gamepulse/fusion/qa/analysis/full88_lateclock_event_clock_alllayers_20261102/interevent_clock_source_positive_v2.json')
          d=json.loads(p.read_bytes())
          assert d['full88_games']==88 and d['official_actions']==53541
          assert len(d['league'])==30 and d['original_source_modified'] is False
          assert d['houston']['prior_source_positive']==91
          assert d['houston']['candidate_possessions']==755
          assert d['houston']['all_direct_source_positive']>=91
          print("FULL88_PRIVATE_CLOCK_REPLAY_SUCCEEDED")
          print("HOUSTON_NEW_SOURCE_POSITIVE_COUNT",d['houston']['new_direct_interior_possessions'])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/analysis/full88_lateclock_event_clock_alllayers_20261102/interevent_clock_source_positive_v2.json
          git diff --cached --check
          if git diff --cached --quiet; then echo "PRIVATE_QA_UNCHANGED"; exit 0; fi
          git commit -qm 'qa(private): Full88 original Time clock strict interevent 88-game evidence'
          for retry in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo "PRIVATE_SOURCE_POSITIVE_QA_COMMITTED"
              exit 0
            fi
            sleep "$retry"
          done
          echo "PRIVATE_QA_RECONCILIATION_PUSH_FAILED"
          exit 25

# Replay: prior Time#show runoff consistency required before crediting late clock.
