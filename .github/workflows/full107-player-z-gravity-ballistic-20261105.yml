# Reviewed source-private physical gravity criterion; per-player/shot licensed geometry never exported.
name: Full107 player Z original ballistic 15-game heldout source test
on:
  push:
    branches: [main]
    paths: ['.github/workflows/full107-player-z-gravity-ballistic-20261105.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: full107-player-z-gravity-20261105
  cancel-in-progress: false
jobs:
  native-ballistics:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/full107-player-z-airtime-calibration-20261105
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public licensed-source guard and SHA-original 15-game private checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set --no-cone \
            /gamepulse/fusion/analysis/igp_full107_player_z_airtime_calibration_pilot_20261105.py \
            /gamepulse/fusion/analysis/igp_full107_player_z_airtime_9game_shadow_v2_20261105.py \
            /gamepulse/fusion/analysis/igp_full107_player_z_6unseen_sealed_v4_20261105.py \
            /gamepulse/fusion/analysis/igp_full107_player_z_ballistic_15game_v6_20261105.py \
            /gamepulse/fusion/qa/analysis/full107_player_z_9game_shadow_v2_20261105.json \
            /gamepulse/fusion/qa/analysis/full107_player_z_6unseen_sealed_v4_20261105.json \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600136/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600137/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600138/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600139/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600147/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600148/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600153/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600154/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600158/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600163/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600167/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600168/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600170/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600171/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600172/
          echo "PRIVATE_GRAVITY_SOURCE_SHA_$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)"
      - name: Evaluate physics-shaped rises and falls against jump reference on excluded games
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 -B -m py_compile gamepulse/fusion/analysis/igp_full107_player_z_ballistic_15game_v6_20261105.py
          if test ! -f gamepulse/fusion/qa/analysis/full107_player_z_ballistic_15game_v6_20261105.json; then
            python3 -B gamepulse/fusion/analysis/igp_full107_player_z_ballistic_15game_v6_20261105.py > "$RUNNER_TEMP/private-gravity.log" 2>&1 || {
              echo PRIVATE_BALLISTIC_EVALUATION_NOT_ACCEPTED
              python3 - <<'PY'
          import os,pathlib,re
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'private-gravity.log'
          x=p.read_text().splitlines() if p.exists() else []
          s=next((v for v in reversed(x) if re.match(r'^[A-Za-z]+(?:Error|Exception|AssertionError):',v)),None)
          print('PRIVATE_FAILURE_CLASS',s.split(':',1)[0] if s else 'UNKNOWN')
          PY
              exit 1
            }
          fi
          python3 - <<'PY'
          import json,pathlib,hashlib
          p=pathlib.Path('gamepulse/fusion/qa/analysis/full107_player_z_ballistic_15game_v6_20261105.json')
          d=json.loads(p.read_bytes())
          assert len(d['dev_games'])==9 and len(d['sealed_holdout_games'])==6
          assert not d['independent_video_contact_verified'] and not d['airtime_in_seconds_certified']
          print('PLAYER_Z_GRAVITY_9DEV_6HELDOUT',json.dumps({
              'dev':d['dev_evaluation'],'sealed':d['sealed_evaluation'],
              'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
              'physical_foot_contact_ground_truth':False},sort_keys=True))
          PY
      - name: Persist gravity-fit shot evidence in original private repository only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f gamepulse/fusion/qa/analysis/full107_player_z_ballistic_15game_v6_20261105.json
          git diff --cached --check
          if git diff --cached --quiet; then echo GRAVITY_RESEARCH_ALREADY_PRESERVED; exit 0; fi
          git commit -qm 'qa(private): original 15-game NBA player Z gravity-shaped jump shadow'
          gh auth setup-git
          for i in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then echo GRAVITY_PRIVATE_QA_COMMITTED; exit 0; fi
            sleep "$i"
          done
          exit 27
