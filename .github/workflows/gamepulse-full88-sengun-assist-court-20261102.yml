name: FULL88 Sengun original-source assist location evidence
# Source-distance, correct attacking-basket lateral mirror, and exact xFG shot joins on frozen Full88.
# Privacy-reviewed in public_content_guard.py; exact player coordinates remain private.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-full88-sengun-assist-court-20261102.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-full88-sengun-assists-original-20261102
  cancel-in-progress: false
jobs:
  compute-private:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: analysis/full88-sengun-deterministic-assist-origins-20261102
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Keep public repository licensed-data-free
        run: python3 tools/public_content_guard.py
      - name: Run deterministic original NBA PBP plus original SDK contact audit privately
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          python3 -m pip install --quiet matplotlib==3.10.8
          python3 -m unittest discover -s gamepulse/fusion/tests -p 'test_igp_assist_explorer_v2.py' -v
          python3 gamepulse/fusion/igp_full88_sengun_original_assist_plot_data_v1.py
          python3 gamepulse/fusion/igp_full88_assist_explorer_v2.py
          python3 gamepulse/fusion/igp_sengun_assist_evidence_audit_v1.py
          python3 -m unittest discover -s gamepulse/fusion/tests -p 'test_igp_full88_assist_anchor_alignment_shadow_v1.py' -v
          python3 gamepulse/fusion/igp_full88_assist_anchor_alignment_shadow_v1.py
          python3 -m unittest discover -s gamepulse/fusion/tests -p 'test_igp_full88_assist_handoff_compatible_shadow_v1.py' -v
          python3 gamepulse/fusion/igp_full88_assist_handoff_compatible_shadow_v1.py
          python3 -m unittest discover -s gamepulse/fusion/tests -p 'test_igp_sengun37_independent_xyz_endpoints_shadow_v1.py' -v
          python3 gamepulse/fusion/igp_sengun37_independent_xyz_endpoints_shadow_v1.py
          python3 -m unittest discover -s gamepulse/fusion/tests -p 'test_igp_sengun37_reconciled_geography_v1.py' -v
          python3 gamepulse/fusion/igp_sengun37_reconciled_geography_v1.py
          python3 -m unittest discover -s gamepulse/fusion/tests -p 'test_igp_sengun37_xfg_shot_join_v1.py' -v
          python3 gamepulse/fusion/igp_sengun37_xfg_shot_join_v1.py
          python3 gamepulse/fusion/igp_sengun37_publication_court_v1.py
          python3 gamepulse/fusion/igp_sengun37_observed_ball_routes_v1.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('gamepulse/fusion/qa/igp_fullx/sengun37_observed_ball_routes_v1')
          q=json.loads((p/'sengun37_ball_informed_QA.json').read_bytes())
          assert q['events']==37 and q['ordered_pairs']==35 and q['unpaired_pairs']==2
          assert q['counts']['origins']==37 and q['counts']['receivers']==37 and q['counts']['shots']==37
          assert q['counts']['ordered_endpoint_chords']==35 and q['counts']['unpaired_endpoint_chords']==2
          assert q['no_interpolated_positions_added']
          assert (p/'sengun37_ball_informed_assist_geography.png').read_bytes().startswith(bytes.fromhex('89504e47'))
          assert b'<svg' in (p/'sengun37_ball_informed_assist_geography.svg').read_bytes()[:500]
          print('SENGUN37_NATIVE_BALL_PUBLIC_LOG_AGGREGATES_ONLY',q['events'],q['coherent_ball_trace_events'])
          PY
          python3 -m unittest discover -s gamepulse/fusion/tests -p 'test_igp_sengun37_xfg_explorer_http_v1.py' -v
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('gamepulse/fusion/qa/igp_fullx/sengun37_xfg_official_shot_locations_v1.json').read_bytes())
          c=d['counts']
          assert len(d['events'])==37
          assert len({e['key'] for e in d['events']})==37
          assert c['official_nba_shot_xy']==37 and c['published_blueprint_xfg']==37
          assert c['passer_ball_contact_xyz']==37 and c['receiver_ball_contact_xyz']==37
          assert all(e['shot_release']['shot_xy_from_official_nba'] for e in d['events'])
          assert all(e['official_shot_location']['distance_error_ft'] < .05 for e in d['events'])
          print('SENGUN37_XFG_JOIN_AGGREGATES_ONLY',c)
          PY
          python3 -m unittest discover -s gamepulse/fusion/tests -p 'test_igp_sengun37_reconciled_app_http_v1.py' -v
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'gamepulse/fusion')
          from igp_assist_explorer_app import select,summarize,render
          p=Path('gamepulse/fusion/qa/igp_fullx/sengun37_reconciled_source_and_official_geography_v1.json')
          d=json.loads(p.read_bytes())
          c=d['counts']
          assert len(d['events'])==37
          assert c['strict_pair']==17 and c['new_episode_pair']==18 and c['unlinked_contact_pair']==2
          assert c['official_made_shot_xy']==37 and c['source_passer_xy']==37 and c['source_scorer_contact_xy']==37
          assert all(e['shot_release'].get('shot_xy_from_official_nba') for e in d['events'])
          assert summarize(d['events'])['event_count']==37
          assert len(select(d['events'],{'assister':['1630578']}))==37
          out=Path('gamepulse/fusion/qa/igp_fullx/sengun37_reconciled_figures_v1')
          out.mkdir(parents=True,exist_ok=True)
          for view in (False,True):
              for fmt in ('png','svg'):
                  name='fullcourt' if view else 'halfcourt'
                  body=render(d['events'],'geometry',view,fmt)
                  assert (body.startswith(bytes.fromhex('89504e47')) if fmt=='png' else b'<svg' in body)
                  (out/('sengun37_original_contacts_plus_official_shots_'+name+'.'+fmt)).write_bytes(body)
          print('SENGUN37_RECONCILED_EXPLORER_PRIVATE_QA_AGGREGATE_ONLY',c)
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          from gamepulse.fusion.igp_assist_explorer_app import render
          p=Path('gamepulse/fusion/qa/igp_fullx/sengun_assist_explorer_full88_v2.json')
          d=json.loads(p.read_bytes())
          assert d['source_game_count']==88
          assert d['counts']['houston_games_in_full88']==7
          assert d['counts']['complete_official_census']==1
          assert d['counts']['games_reconciled']==7
          assert d['counts']['official_assists_reconciled']==37
          assert all(g['official_assists']==g['boxscore_assists'] for g in d['games'].values())
          assert d['counts']['official_event_rows']==len(d['events'])
          assert len({e['key'] for e in d['events']})==len(d['events'])
          assert render(d['events'],'geometry',True,'png').startswith(b'\x89PNG')
          print('FULL88_ASSIST_EXPLORER_PRIVATE_COUNTS', d['counts'])
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('gamepulse/fusion/qa/igp_fullx/sengun_assist_original_pass_origin_full88_20261102.json').read_bytes())
          assert d['source_games']==88 and d['player_id']==1630578
          assert d['counts']['official_sengun_assists']==len(d['events'])
          assert sum('court_x_ft' in r for r in d['events'])==d['counts'].get('observed_pass_contact_candidates',0)
          assert all(not ('court_x_ft' in e and e.get('grade')=='ABSTAIN') for e in d['events'])
          print('IGP_FULL88_SENGUN_PRIVATE_QA_SOURCE_COHORT_AND_EVENT_COUNTS', d['counts']['rockets_games'],d['counts']['official_sengun_assists'],d['counts'].get('observed_pass_contact_candidates',0))
          PY
      - name: Commit event-level proprietary QA data ONLY to the private repository
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_fullx/sengun_assist_original_pass_origin_full88_20261102.json gamepulse/fusion/qa/igp_fullx/sengun_assist_explorer_full88_v2.json gamepulse/fusion/qa/igp_fullx/sengun_assist_evidence_audit_v1.json gamepulse/fusion/qa/igp_fullx/sengun_assist_shot_anchor_shadow_v1.json gamepulse/fusion/qa/igp_fullx/sengun_assist_handoff_compatible_shadow_v1.json gamepulse/fusion/qa/igp_fullx/sengun_assist_independent_xyz_endpoints_shadow_v1.json gamepulse/fusion/qa/igp_fullx/sengun37_reconciled_source_and_official_geography_v1.json gamepulse/fusion/qa/igp_fullx/sengun37_reconciled_source_and_official_geography_v1_qa.json gamepulse/fusion/qa/igp_fullx/sengun37_reconciled_figures_v1 gamepulse/fusion/qa/igp_fullx/sengun37_publication_court_v1 gamepulse/fusion/qa/igp_fullx/sengun37_observed_ball_routes_v1 gamepulse/fusion/qa/igp_fullx/sengun37_xfg_official_shot_locations_v1.json gamepulse/fusion/qa/igp_fullx/assist_explorer_figures_v1/sengun37_blueprint_xfg_official_shot_geography.png gamepulse/fusion/qa/igp_fullx/assist_explorer_figures_v1/sengun37_blueprint_xfg_official_shot_geography.svg gamepulse/fusion/qa/igp_fullx/assist_official_raw
          # Matplotlib SVG paths contain harmless trailing spaces; preserve native vector output.
          git -c core.whitespace=-trailing-space diff --cached --check
          if git diff --cached --quiet; then echo IGP_FULL88_SENGUN_PRIVATE_RESULT_UNCHANGED; exit 0; fi
          git commit -q -m "qa(igp): private source-only Full88 Sengun credited assist origins"
          for n in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then echo IGP_FULL88_SENGUN_SOURCE_LOCATION_REPORT_PRIVATE_ONLY; exit 0; fi
            sleep "$n"
          done
          exit 24
