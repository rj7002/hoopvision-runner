# Security-reviewed and allowlisted. Original licensed NBA tracking stays private; only aggregate QA is printed.
name: Full107 original player Z vs NBA shot jump P0 calibration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/full107-original-player-z-airtime-p0-20261105.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: full107-original-player-z-airtime-p0-20261105
  cancel-in-progress: false
jobs:
  compare-z-to-shot-pose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/full107-player-z-airtime-calibration-20261105
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public workflow and clone SHA-authenticated licensed source privately
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set --no-cone \
            /gamepulse/fusion/analysis/igp_full107_player_z_airtime_calibration_pilot_20261105.py \
            /gamepulse/fusion/analysis/igp_full107_player_z_airtime_9game_shadow_v2_20261105.py \
            /gamepulse/fusion/analysis/igp_full107_player_z_sampling_alignment_v3_20261105.py \
            /gamepulse/fusion/analysis/igp_full107_player_z_sampling_alignment_v3_20261105.py \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600138/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600139/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600170/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600171/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600167/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600153/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600147/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600137/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600136/ \
            /gamepulse/fusion/evidence/companion_sdk_original_0022600138/sdk_observed_original.json \
            /gamepulse/fusion/evidence/companion_sdk_original_0022600138/shotdetails_official_action_crosswalk_v1.json \
            /gamepulse/fusion/evidence/companion_sdk_original_0022600139/sdk_observed_original.json \
            /gamepulse/fusion/evidence/companion_sdk_original_0022600139/shotdetails_official_action_crosswalk_v1.json \
            /gamepulse/fusion/evidence/companion_sdk_original_0022600170/sdk_observed_original.json \
            /gamepulse/fusion/evidence/companion_sdk_original_0022600170/shotdetails_official_action_crosswalk_v1.json \
            /gamepulse/fusion/evidence/companion_sdk_original_0022600171/sdk_observed_original.json \
            /gamepulse/fusion/evidence/companion_sdk_original_0022600171/shotdetails_official_action_crosswalk_v1.json \
            /gamepulse/fusion/evidence/companion_sdk_original_0022600167/sdk_observed_original.json \
            /gamepulse/fusion/evidence/companion_sdk_original_0022600167/shotdetails_official_action_crosswalk_v1.json \
            /gamepulse/fusion/evidence/companion_sdk_original_0022600153/sdk_observed_original.json \
            /gamepulse/fusion/evidence/companion_sdk_original_0022600153/shotdetails_official_action_crosswalk_v1.json \
            /gamepulse/fusion/evidence/companion_sdk_original_0022600147/sdk_observed_original.json \
            /gamepulse/fusion/evidence/companion_sdk_original_0022600147/shotdetails_official_action_crosswalk_v1.json \
            /gamepulse/fusion/evidence/companion_sdk_original_0022600137/sdk_observed_original.json \
            /gamepulse/fusion/evidence/companion_sdk_original_0022600137/shotdetails_official_action_crosswalk_v1.json \
            /gamepulse/fusion/evidence/companion_sdk_original_0022600136/sdk_observed_original.json \
            /gamepulse/fusion/evidence/companion_sdk_original_0022600136/shotdetails_official_action_crosswalk_v1.json
          echo "PRIVATE_SOURCE_CHECKOUT_SHA_$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)"
      - name: Execute exact official-shot source join and original Z calibration privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 -m py_compile gamepulse/fusion/analysis/igp_full107_player_z_airtime_calibration_pilot_20261105.py
          if test -f gamepulse/fusion/qa/analysis/full107_player_z_airtime_pilot_20261105.json; then
            echo "P0_PRIVATE_SHA_EXISTING_ACCEPTED"
          else
            python3 -B gamepulse/fusion/analysis/igp_full107_player_z_airtime_calibration_pilot_20261105.py > "$RUNNER_TEMP/private-calibration.log" 2>&1 || {
            echo 'PRIVATE_PLAYER_Z_POSE_CALIBRATION_FAILED; proprietary coordinates suppressed'
            exit 1
            }
          fi
          python3 - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('gamepulse/fusion/qa/analysis/full107_player_z_airtime_pilot_20261105.json')
          q=json.loads(p.read_bytes());s=q['shooter'];d=q['defender']
          assert q['population_games']==3 and s['n']>10 and d['n']>10
          assert not q['whole_game_airborne_seconds_validated'] and not q['independent_video_airtime_certified']
          print('PLAYER_Z_PRIVATE_ORIGINAL_SOURCE_VS_JUMP_RESULT',json.dumps({
             'games':3,'shooter_n':s['n'],'defender_n':d['n'],
             'shooter_spearman':s['spearman'],'defender_spearman':d['spearman'],
             'shooter_median_feature':s['median_feature'],
             'shooter_median_Z_excursion':s['median_Z_excursion'],
             'shooter_median_abs_delta':s['median_abs_Z_minus_feature'],
             'defender_median_feature':d['median_feature'],
             'defender_median_Z_excursion':d['median_Z_excursion'],
             'defender_median_abs_delta':d['median_abs_Z_minus_feature'],
             'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
             'physical_foot_contact_certified':False},sort_keys=True))
          PY
      - name: Run 9-game held-out shooter defender calibration plus continuous Z elevation shadow
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 -m py_compile gamepulse/fusion/analysis/igp_full107_player_z_airtime_9game_shadow_v2_20261105.py
          if test -f gamepulse/fusion/qa/analysis/full107_player_z_9game_shadow_v2_20261105.json; then
            echo NINE_GAME_RESEARCH_QA_EXISTING
          else
            python3 -B gamepulse/fusion/analysis/igp_full107_player_z_airtime_9game_shadow_v2_20261105.py > "$RUNNER_TEMP/ninegame-research-private.log" 2>&1 || {
              echo 'PRIVATE_NINE_GAME_Z_CONTINUOUS_RESEARCH_FAILED; licensed source withheld'
              tail -n 4 "$RUNNER_TEMP/ninegame-research-private.log" | grep -E '^[A-Za-z]+Error:|^[A-Za-z]+Exception:' || true
              exit 1
            }
          fi
          python3 - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('gamepulse/fusion/qa/analysis/full107_player_z_9game_shadow_v2_20261105.json')
          d=json.loads(p.read_bytes())
          assert d['population_games']==9 and not d['certified_player_airtime_leaderboard']
          assert d['continuous_Z_is_body_elevation_not_ground_contact']
          for actor in ['shooter','defender']:
            q=d['shots'][actor]
            assert q['n']>100 and q['leave_one_game_out_regression']['heldout_games']>=8
          print('FULL107_NINE_GAME_Z_CONTINUOUS_RESEARCH_SHADOW',json.dumps({
              'games':9,'shot_source_compares':{a:{'n':q['n'],
                 'Pearson_r':round(q['release_pearson'],4),
                 'heldout_p50_feature_error':round(q['leave_one_game_out_regression']['pooled_median_abs_error_feature_units'],3),
                 'heldout_games':q['leave_one_game_out_regression']['heldout_games'],
                 'source_high_recall':q['leave_one_game_out_high_low_classifier']['heldout_high_recall'],
                 'source_low_specificity':q['leave_one_game_out_high_low_classifier']['heldout_low_specificity']}
                 for a,q in d['shots'].items()},
              'continuous_event_anchor':d['shot_anchor_continuous'],
              'candidate_elevation_episode_counts':{k:v['episodes'] for k,v in d['continuous'].items()},
              'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
              'airtime_ground_truth':False},sort_keys=True))
          PY
      - name: Independently diagnose original cadence and shot-to-frame match across nine games
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 -m py_compile gamepulse/fusion/analysis/igp_full107_player_z_sampling_alignment_v3_20261105.py
          if test -f gamepulse/fusion/qa/analysis/full107_player_z_sampling_alignment_v3_20261105.json; then
            echo FULL107_NATIVE_CADENCE_QA_EXISTING
          else
            python3 -B gamepulse/fusion/analysis/igp_full107_player_z_sampling_alignment_v3_20261105.py > "$RUNNER_TEMP/native-cadence-private.log" 2>&1 || {
              echo 'NATIVE_CADENCE_AIRTIME_DIAGNOSTIC_FAILED; original source not logged'
              tail -n 3 "$RUNNER_TEMP/native-cadence-private.log" | grep -E '^[A-Za-z]+Error:|^[A-Za-z]+Exception:' || true
              exit 1
            }
          fi
          python3 - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('gamepulse/fusion/qa/analysis/full107_player_z_sampling_alignment_v3_20261105.json')
          q=json.loads(p.read_bytes());assert len(q['games'])==9 and q['game_airtime_not_validated']
          print('FULL107_Z_NATIVE_CADENCE_SOURCE_QA',json.dumps({
            'shooter':q['shooter'],'defender':q['defender'],
            'bounded_episodes':q['bounded_shot_episode_n'],
            'shooter_bound_lower_p50_s':q['bounded_shooter_duration_lower_p50_s'],
            'shooter_bound_upper_p50_s':q['bounded_shooter_duration_upper_p50_s'],
            'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
            'physical_airtime_certified':False},sort_keys=True))
          PY
      - name: Validate source cadence, release join and episode bounds (private V3)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 -B -m py_compile gamepulse/fusion/analysis/igp_full107_player_z_sampling_alignment_v3_20261105.py
          if test ! -f gamepulse/fusion/qa/analysis/full107_player_z_sampling_alignment_v3_20261105.json; then
            python3 -B gamepulse/fusion/analysis/igp_full107_player_z_sampling_alignment_v3_20261105.py > "$RUNNER_TEMP/private-v3.log" 2>&1 || {
              echo 'V3_PRIVATE_CADENCE_DIAGNOSTIC_FAILED'
              python3 - <<'PY'
import os,pathlib,re
p=pathlib.Path(os.environ['RUNNER_TEMP'])/'private-v3.log'
s=p.read_text().splitlines() if p.exists() else []
last=next((v for v in reversed(s) if re.match(r'^[A-Za-z]+(?:Error|Exception|AssertionError):',v)),None)
print('ERROR_CLASS',last.split(':',1)[0] if last else 'UNKNOWN')
PY
              exit 1
            }
          fi
          python3 - <<'PY'
import json,hashlib,pathlib
p=pathlib.Path('gamepulse/fusion/qa/analysis/full107_player_z_sampling_alignment_v3_20261105.json')
q=json.loads(p.read_bytes())
assert len(q['games'])==9 and q['shooter']['n']>500
assert q['game_airtime_not_validated'] and q['not_physical_foot_contact']
print('FULL107_Z_V3_SOURCE_CADENCE',json.dumps({
 'shot_pairs':{'shooter':q['shooter']['n'],'defender':q['defender']['n']},
 'shooter':q['shooter'],'defender':q['defender'],
 'bounded_shot_episodes':q['bounded_shot_episode_n'],
 'duration_bounds_shooter_p50_s':[q['bounded_shooter_duration_lower_p50_s'],q['bounded_shooter_duration_upper_p50_s']],
 'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
 'physical_airtime_certified':False},sort_keys=True))
PY
      - name: Persist per-shot research observations only in private GitHub
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f gamepulse/fusion/qa/analysis/full107_player_z_airtime_pilot_20261105.json
          git add --sparse -f gamepulse/fusion/qa/analysis/full107_player_z_9game_shadow_v2_20261105.json
          git add --sparse -f gamepulse/fusion/qa/analysis/full107_player_z_sampling_alignment_v3_20261105.json
          git add --sparse -f gamepulse/fusion/qa/analysis/full107_player_z_sampling_alignment_v3_20261105.json
          git diff --cached --check
          if git diff --cached --quiet; then echo 'PLAYER_Z_RESEARCH_QA_ALREADY_PRESERVED'; exit 0; fi
          git commit -qm 'qa(private): original NBA player Z vs shot engineered jump P0'
          gh auth setup-git
          for attempt in 1 2 3 4; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo 'PLAYER_Z_PRIVATE_SOURCE_QA_COMMITTED'
              exit 0
            fi
            sleep "$attempt"
          done
          exit 23
