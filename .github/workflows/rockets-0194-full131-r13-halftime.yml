name: Rockets 0194 Full131 R13 original first-half touch processing
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rockets-0194-full131-r13-halftime.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  full131-input-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate public/private boundary
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Inspect NBA SDK source lastTouch, clock and official R13 dependencies
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --depth=1 --sparse -b research/rockets-0194-half-firstA-20261108 \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/a"
          git -C "$RUNNER_TEMP/a" sparse-checkout set --no-cone 'gamepulse/live/halftime_sdk_0194/firstA/*'
          git clone -q --filter=blob:none --depth=1 --sparse -b analysis/full131-kd-frontcourt-passer-distance-20261108 \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set --no-cone 'gamepulse/fusion/analysis/igp_r13_touch_stats_v2.py'
          git -C "$RUNNER_TEMP/private" switch -q -c research/rockets0194-full131-input-probe-20261108
          python3 - <<'PY'
          import collections,gzip,hashlib,json,os,tarfile,urllib.request,urllib.error
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          directory=root/"a"/"gamepulse/live/halftime_sdk_0194/firstA"
          idx=json.loads((directory/"index.json").read_bytes())
          types=collections.Counter();keys=collections.Counter();frames=collections.Counter()
          lasttouch=timeshow=native=0
          for row in idx["source_rows"]:
              source=directory/row["archive"]
              assert hashlib.sha256(source.read_bytes()).hexdigest()==row["sha256"]
              with tarfile.open(source,"r:gz") as tar:
                  h=tar.extractfile("raw-slots.jsonl.gz")
                  for line in gzip.GzipFile(fileobj=h):
                      slot=json.loads(line)
                      for e in slot.get("events",[]):
                          types[str(e.get("event","NO_NAME"))]+=1
                          md=e.get("metadata") or {}
                          keys.update(md.keys())
                          for f in md.get("keyframes",[]):
                              native+=1;frames.update(f.keys())
                              lasttouch+=isinstance(f.get("lastTouch"),dict)
                          if e.get("event")=="Time#show":timeshow+=1
          outcomes={}
          for kind in ("playbyplay","boxscore"):
              url="https://cdn.nba.com/static/json/liveData/"+kind+"/"+kind+"_0022600194.json"
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36","Accept":"application/json, text/plain, */*","Referer":"https://www.nba.com/"})
              try:
                  with urllib.request.urlopen(req,timeout=22) as resp:
                      payload=resp.read(3000000)
                  doc=json.loads(payload)
                  assert str(doc["game"]["gameId"])=="0022600194"
                  outcomes[kind]={"state":"NBA_OFFICIAL_VALIDATED","bytes":len(payload),"sha256":hashlib.sha256(payload).hexdigest(),"actions":len(doc["game"].get("actions",[]))}
                  out=root/"private"/"gamepulse/fusion/qa/full131_0194"
                  out.mkdir(parents=True,exist_ok=True)
                  (out/(kind+".json")).write_bytes(payload)
              except (ValueError,KeyError,urllib.error.URLError,TimeoutError) as ex:
                  outcomes[kind]={"state":"NBA_OFFICIAL_UNAVAILABLE","kind":type(ex).__name__,"status":getattr(ex,"code",None)}
          output={"schema":"igp.rockets0194.full131-r13-firsthalf-input-qa.v1","game_id":"0022600194",
                  "source_firstA_sha_verified":True,"firstA_original_native_frames":native,
                  "source_original_lastTouch_frames":lasttouch,"original_sdk_TimeShow_events":timeshow,
                  "sdk_event_types":dict(types),"sdk_metadata_keys":dict(keys),"sdk_frame_keys":dict(frames),
                  "official_nba":outcomes,"full131_r13_engine_processed":False}
          dest=root/"private"/"gamepulse/fusion/qa/full131_0194"
          dest.mkdir(parents=True,exist_ok=True)
          (dest/"input_qa.json").write_text(json.dumps(output,sort_keys=True,indent=2)+"\n")
          print("FULL131_ORIGINAL_INPUT_AUDIT",native,lasttouch,timeshow)
          print("FULL131_NBA_PBP_STATUS",outcomes["playbyplay"]["state"])
          print("FULL131_NBA_BOX_STATUS",outcomes["boxscore"]["state"])
          PY
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f gamepulse/fusion/qa/full131_0194
          git diff --cached --check
          git commit -q -m 'qa(igp): original Rockets 0194 SDK inputs for Full131 R13'
          git push -q origin HEAD:refs/heads/research/rockets0194-full131-input-probe-20261108
          echo PRIVATE_FULL131_INPUT_QA_COMMITTED

  companion-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      NBA_GAME_ID: '0022600194'
      NBA_TIPOFF_UTC: '2026-11-08T02:00:00Z'
      IGP_PRIVATE_CAPTURE_DIR: /tmp/rockets0194_companion
      IGP_CAPTURE_ZERO_SHOT_FULL_EVENTS: 'true'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Collect companion event metadata with existing authorized SDK
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          mkdir -p "$IGP_PRIVATE_CAPTURE_DIR"
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          (cd tools/licensed_feed && npm install --ignore-scripts --no-audit --no-fund --silent)
          node tools/licensed_feed/companion_original_sdk_probe.mjs > "$RUNNER_TEMP/companion.log"
      - name: Save original companion response privately
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b analysis/full131-kd-frontcourt-passer-distance-20261108 \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/p"
          cd "$RUNNER_TEMP/p"
          git sparse-checkout set --no-cone '/gamepulse/fusion/qa/full131_0194/**'
          git switch -q -c research/rockets0194-full131-companion-clock-20261108
          mkdir -p gamepulse/fusion/qa/full131_0194
          cp "$IGP_PRIVATE_CAPTURE_DIR/companion_probe_receipt.json" gamepulse/fusion/qa/full131_0194/
          if test -f "$IGP_PRIVATE_CAPTURE_DIR/companion_original_sdk_response.json"; then
            cp "$IGP_PRIVATE_CAPTURE_DIR/companion_original_sdk_response.json" gamepulse/fusion/qa/full131_0194/
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f gamepulse/fusion/qa/full131_0194/
          git diff --cached --check
          git commit -q -m 'data(igp): original Rockets companion NBA clock source'
          git push -q origin HEAD:refs/heads/research/rockets0194-full131-companion-clock-20261108
          echo ROCKETS_COMPANION_ORIGINAL_PRIVATE_SOURCE_SAVED

  full131-r13-half-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Source confidentiality and authenticated private Git
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Retrieve unchanged Full131 R13 v2 source and all 77 SHA-original minutes
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --depth=1 --sparse -b analysis/full131-kd-frontcourt-passer-distance-20261108 \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/engine"
          git -C "$RUNNER_TEMP/engine" sparse-checkout set --no-cone \
            '/gamepulse/fusion/*.py' '/gamepulse/fusion/analysis/*.py' \
            '/gamepulse/fusion/qa/full131_0194/**'
          git -C "$RUNNER_TEMP/engine" switch -q -c research/rockets0194-full131-r13-halftime-20261108
          mkdir -p "$RUNNER_TEMP/halfsources"
          for shard in firstA firstB firstC; do
            git clone -q --depth=1 --filter=blob:none --sparse \
              -b "research/rockets-0194-half-$shard-20261108" \
              https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/halfsources/$shard"
            git -C "$RUNNER_TEMP/halfsources/$shard" sparse-checkout set --no-cone \
              "/gamepulse/live/halftime_sdk_0194/$shard/**"
          done
      - name: Fetch NBA official source when authorized and run real Full131 R13 first-half engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nba" "$RUNNER_TEMP/engine/gamepulse/fusion/qa/full131_0194"
          python3 - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"nba"
          for kind in ("playbyplay","boxscore"):
              url="https://cdn.nba.com/static/json/liveData/"+kind+"/"+kind+"_0022600194.json"
              req=urllib.request.Request(url,headers={
                "User-Agent":"Mozilla/5.0 (compatible; IntegratedPulse/1.0)",
                "Accept":"application/json","Referer":"https://www.nba.com/"})
              try:
                  with urllib.request.urlopen(req,timeout=18) as r: body=r.read(3000000)
                  doc=json.loads(body)
                  if str(doc.get("game",{}).get("gameId"))!="0022600194":
                      continue
                  (root/(kind+".json")).write_bytes(body)
                  print("NBA_OFFICIAL_R13_INPUT_READY",kind)
              except Exception as e:
                  print("NBA_OFFICIAL_R13_INPUT_NOT_YET_ACCESSIBLE",kind,type(e).__name__)
          PY
          cd "$RUNNER_TEMP/engine"
          python3 -B -m py_compile gamepulse/fusion/analysis/igp_0194_full131_r13_halftime_20261108.py
          set +e
          python3 -B gamepulse/fusion/analysis/igp_0194_full131_r13_halftime_20261108.py \
            --sources "$RUNNER_TEMP/halfsources" \
            --official "$RUNNER_TEMP/nba" \
            --out gamepulse/fusion/qa/full131_0194/firsthalf_r13_v2_source_report.json
          outcome=$?
          set -e
          python3 - <<'PY'
          import json
          p='gamepulse/fusion/qa/full131_0194/firsthalf_r13_v2_source_report.json'
          r=json.load(open(p))
          print("FULL131_R13_SOURCE_REPLAY_STATUS",r["status"])
          print("FULL131_R13_SOURCE_REPLAY_COMPLETED",r["full131_model_ran"])
          print("FULL131_R13_HOU_PLAYER_ROWS",
                sum(x["team"]=="HOU" for x in r.get("player_frontcourt_touch_table",[])))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f gamepulse/fusion/qa/full131_0194/firsthalf_r13_v2_source_report.json
          git diff --cached --check
          git commit -q -m 'qa(igp): actual Full131 R13 v2 replay first-half 0194, provenance-graded'
          git push -q origin HEAD:refs/heads/research/rockets0194-full131-r13-halftime-20261108
          echo FULL131_R13_REPLAY_PRIVATE_QA_COMMITTED
          if test "$outcome" -ne 0; then
            echo FULL131_NEEDS_VALID_OFFICIAL_INPUTS_NOT_PROMOTED
          fi

  full131-r13-companion-half:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Preserve NBA private-data boundary
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Mount exact Full131 R13 v2 engine and previous verified NBA roster names
        run: |
          set -euo pipefail
          git clone -q --depth=1 --filter=blob:none --sparse -b analysis/full131-kd-frontcourt-passer-distance-20261108 \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/full131"
          git -C "$RUNNER_TEMP/full131" sparse-checkout set --no-cone \
            '/gamepulse/fusion/*.py' '/gamepulse/fusion/analysis/*.py' \
            '/gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/0022600092.json' \
            '/gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/0022600181.json' \
            '/gamepulse/fusion/qa/full131_0194/**'
          git -C "$RUNNER_TEMP/full131" switch -q -c research/rockets0194-full131-r13-companion-half-20261108
      - name: Mount all 77 SHA-original first-half capture minutes
        run: |
          set -euo pipefail
          for s in firstA firstB firstC; do
            git clone -q --depth=1 --filter=blob:none --sparse -b "research/rockets-0194-half-$s-20261108" \
              https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/$s"
            git -C "$RUNNER_TEMP/$s" sparse-checkout set --no-cone \
              "/gamepulse/live/halftime_sdk_0194/$s/**"
          done
      - name: Mount licensed full companion NBA clock and on-court events
        run: |
          set -euo pipefail
          git clone -q --depth=1 --filter=blob:none --sparse \
            -b research/rockets0194-full131-companion-clock-20261108 \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/companion"
          git -C "$RUNNER_TEMP/companion" sparse-checkout set --no-cone \
            '/gamepulse/fusion/qa/full131_0194/**'
      - name: Execute actual Full131 R13 v2 contact and episode detector for Q1 plus Q2
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/full131"
          mkdir -p gamepulse/fusion/qa/full131_0194
          python3 -B -m py_compile gamepulse/fusion/analysis/igp_0194_full131_r13_companion_halftime_20261108.py
          python3 -B gamepulse/fusion/analysis/igp_0194_full131_r13_companion_halftime_20261108.py \
            --sources "$RUNNER_TEMP" \
            --companion "$RUNNER_TEMP/companion/gamepulse/fusion/qa/full131_0194" \
            --roster gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/0022600092.json \
                     gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/0022600181.json \
            --out gamepulse/fusion/qa/full131_0194/firsthalf_actual_r13_v2_frontcourt_by_player.json
          python3 - <<'PY'
          import json
          p='gamepulse/fusion/qa/full131_0194/firsthalf_actual_r13_v2_frontcourt_by_player.json'
          x=json.load(open(p))
          assert x['full131_R13_core_detector_executed'] is True
          assert x['status']=='CORE_FULL131_R13_V2_EXECUTED_ON_ORIGINAL_FIRSTHALF_XYZ'
          assert x['NBA_original_companion_live_clock_events']['1'] >= 10
          assert x['NBA_original_companion_live_clock_events']['2'] >= 10
          print("REAL_FULL131_R13_SOURCE_FRAMES",x['source_qa']['original_unique_native_xyz_timestamps'])
          print("REAL_FULL131_R13_ACCEPTED_TOUCHES",x['R13_accepted_touch_episodes'])
          print("REAL_FULL131_R13_PLAYERS",len(x['players']))
          print("REAL_FULL131_R13_Q1_AND_Q2_CLOCK_CERTIFIED",True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f gamepulse/fusion/qa/full131_0194/firsthalf_actual_r13_v2_frontcourt_by_player.json
          git diff --cached --check
          git commit -q -m 'data(igp): Rockets 0194 firsthalf verified companion clock Full131 original R13 touches'
          git push -q origin HEAD:refs/heads/research/rockets0194-full131-r13-companion-half-20261108
          echo ROCKETS_FIRST_HALF_FULL131_R13_ORIGINAL_PRIVATE_RESULTS_PERSISTED
