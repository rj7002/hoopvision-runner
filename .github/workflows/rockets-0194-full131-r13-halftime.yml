name: Rockets 0194 Full131 R13 original first-half touch processing
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rockets-0194-full131-r13-halftime.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  full131-input-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate public/private boundary
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Inspect NBA SDK source lastTouch, clock and official R13 dependencies
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --depth=1 --sparse -b research/rockets-0194-half-firstA-20261108 \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/a"
          git -C "$RUNNER_TEMP/a" sparse-checkout set --no-cone 'gamepulse/live/halftime_sdk_0194/firstA/*'
          git clone -q --filter=blob:none --depth=1 --sparse -b analysis/full131-kd-frontcourt-passer-distance-20261108 \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set --no-cone 'gamepulse/fusion/analysis/igp_r13_touch_stats_v2.py'
          git -C "$RUNNER_TEMP/private" switch -q -c research/rockets0194-full131-input-probe-20261108
          python3 - <<'PY'
          import collections,gzip,hashlib,json,os,tarfile,urllib.request,urllib.error
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          directory=root/"a"/"gamepulse/live/halftime_sdk_0194/firstA"
          idx=json.loads((directory/"index.json").read_bytes())
          types=collections.Counter();keys=collections.Counter();frames=collections.Counter()
          lasttouch=timeshow=native=0
          for row in idx["source_rows"]:
              source=directory/row["archive"]
              assert hashlib.sha256(source.read_bytes()).hexdigest()==row["sha256"]
              with tarfile.open(source,"r:gz") as tar:
                  h=tar.extractfile("raw-slots.jsonl.gz")
                  for line in gzip.GzipFile(fileobj=h):
                      slot=json.loads(line)
                      for e in slot.get("events",[]):
                          types[str(e.get("event","NO_NAME"))]+=1
                          md=e.get("metadata") or {}
                          keys.update(md.keys())
                          for f in md.get("keyframes",[]):
                              native+=1;frames.update(f.keys())
                              lasttouch+=isinstance(f.get("lastTouch"),dict)
                          if e.get("event")=="Time#show":timeshow+=1
          outcomes={}
          for kind in ("playbyplay","boxscore"):
              url="https://cdn.nba.com/static/json/liveData/"+kind+"/"+kind+"_0022600194.json"
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36","Accept":"application/json, text/plain, */*","Referer":"https://www.nba.com/"})
              try:
                  with urllib.request.urlopen(req,timeout=22) as resp:
                      payload=resp.read(3000000)
                  doc=json.loads(payload)
                  assert str(doc["game"]["gameId"])=="0022600194"
                  outcomes[kind]={"state":"NBA_OFFICIAL_VALIDATED","bytes":len(payload),"sha256":hashlib.sha256(payload).hexdigest(),"actions":len(doc["game"].get("actions",[]))}
                  out=root/"private"/"gamepulse/fusion/qa/full131_0194"
                  out.mkdir(parents=True,exist_ok=True)
                  (out/(kind+".json")).write_bytes(payload)
              except (ValueError,KeyError,urllib.error.URLError,TimeoutError) as ex:
                  outcomes[kind]={"state":"NBA_OFFICIAL_UNAVAILABLE","kind":type(ex).__name__,"status":getattr(ex,"code",None)}
          output={"schema":"igp.rockets0194.full131-r13-firsthalf-input-qa.v1","game_id":"0022600194",
                  "source_firstA_sha_verified":True,"firstA_original_native_frames":native,
                  "source_original_lastTouch_frames":lasttouch,"original_sdk_TimeShow_events":timeshow,
                  "sdk_event_types":dict(types),"sdk_metadata_keys":dict(keys),"sdk_frame_keys":dict(frames),
                  "official_nba":outcomes,"full131_r13_engine_processed":False}
          dest=root/"private"/"gamepulse/fusion/qa/full131_0194"
          dest.mkdir(parents=True,exist_ok=True)
          (dest/"input_qa.json").write_text(json.dumps(output,sort_keys=True,indent=2)+"\n")
          print("FULL131_ORIGINAL_INPUT_AUDIT",native,lasttouch,timeshow)
          print("FULL131_NBA_PBP_STATUS",outcomes["playbyplay"]["state"])
          print("FULL131_NBA_BOX_STATUS",outcomes["boxscore"]["state"])
          PY
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f gamepulse/fusion/qa/full131_0194
          git diff --cached --check
          git commit -q -m 'qa(igp): original Rockets 0194 SDK inputs for Full131 R13'
          git push -q origin HEAD:refs/heads/research/rockets0194-full131-input-probe-20261108
          echo PRIVATE_FULL131_INPUT_QA_COMMITTED
