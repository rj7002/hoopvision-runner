name: Protected private analytics reducer repair
# Public orchestration only; source, full positions, intermediate shards, and
# result artifacts stay inside the authenticated private GitHub repository.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/private-analysis-reduce-only.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: protected-private-analytics-reduce-only-2026
  cancel-in-progress: false
jobs:
  private-reduce-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      # Immutable, opaque reference to R10's exact private task selector.
      PRIVATE_SELECTOR_COMMIT: 4f4240f249ab2ed1f27bc1aec745e6701ae84df1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify protected boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Reduce immutable private shards using verified Git blob fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,sys,time
          repo="timeedmonds-maker/104"
          pin=os.environ["PRIVATE_SELECTOR_COMMIT"]
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"private-reduce"
          root.mkdir(parents=True,exist_ok=True)
          def api(url):
              return json.loads(subprocess.check_output(
                  ["gh","api",url],stderr=subprocess.DEVNULL))
          def git_sha(raw):
              pre=b"blob "+str(len(raw)).encode()+b"\\0"
              return hashlib.sha1(pre+raw).hexdigest()
          def fetch(path,ref):
              meta=api(f"repos/{repo}/contents/{path}?ref={ref}")
              assert meta.get("type")=="file"
              sha=meta["sha"]
              inline=meta.get("content")
              if inline and meta.get("encoding")=="base64":
                  data=base64.b64decode(inline)
              else:
                  blob=api(f"repos/{repo}/git/blobs/{sha}")
                  assert blob["encoding"]=="base64"
                  data=base64.b64decode(blob["content"])
              assert git_sha(data)==sha, "PRIVATE_GIT_BLOB_INTEGRITY"
              return data
          task=json.loads(fetch("analysis_execution/current_igp_task.json",pin))
          assert task["shards"]==9
          assert task["source_sha"]=="a80ed9d7ebf591d91eedfdffe696395a9b9a44d8"
          assert task["ref"].startswith("analysis/")
          assert task["out_dir"]=="gamepulse/fusion/qa/analysis/igp81_double_team_reboot_r10_secondary_gate_20261101"
          assert task["action_class"]=="RESEARCH_NO_ENGINE_PROMOTION"
          branch=task["ref"]
          for i in range(9):
              body=fetch(f'{task["out_dir"]}/shard_{i}.json',branch)
              x=json.loads(body)
              assert x["shard"]==i and x["shards"]==9
              assert x["original_source_modified"] is False
              (root/f"shard_{i}.json").write_bytes(body)
          code=fetch(task["reduce_script"],task["source_sha"])
          (root/"rank.py").write_bytes(code)
          outputs={
              "top20.json":root/"top20.json",
              "all_league_players.json":root/"all_league_players.json",
              "all_league_players.csv":root/"all_league_players.csv",
              "all_player_team_splits.csv":root/"all_player_team_splits.csv"}
          proc=subprocess.run([sys.executable,str(root/"rank.py"),
              "--dir",str(root),"--out",str(outputs["top20.json"]),
              "--league-json",str(outputs["all_league_players.json"]),
              "--league-csv",str(outputs["all_league_players.csv"]),
              "--team-csv",str(outputs["all_player_team_splits.csv"])],
              cwd=root,capture_output=True,text=True)
          if proc.returncode:
              # Traceback never goes to public logs or artifacts.
              detail={"state":"PRIVATE_REDUCER_FAILED","returncode":proc.returncode,
                      "stderr_tail_private":proc.stderr[-6000:]}
              data=json.dumps(detail).encode()
              path=f'{task["out_dir"]}/reducer_failure_private.json'
              target=f"repos/{repo}/contents/{path}"
              payload={"branch":branch,"message":"qa(private): reducer failure",
                      "content":base64.b64encode(data).decode()}
              old=subprocess.run(["gh","api",target+"?ref="+branch],
                                 capture_output=True,text=True)
              if old.returncode==0:payload["sha"]=json.loads(old.stdout)["sha"]
              subprocess.run(["gh","api","-X","PUT",target,"--input","-"],
                             input=json.dumps(payload),capture_output=True)
              print("PRIVATE_REDUCER_VALIDATION_FAILED")
              sys.exit(1)
          x=json.loads(outputs["all_league_players.json"].read_bytes())
          assert x["games_processed"]==81
          assert x["original_source_modified"] is False
          assert len(x["per_game_sources"])==81
          assert len(x["excluded_games"])==7
          assert "guarded" in x["profile_totals"]
          card={k:x[k] for k in
              ("games_processed","excluded_games","analysis_code_sha256",
               "original_source_modified","profile_totals",
               "prior_review_development_metrics","benchmark_comparison",
               "credibility_status","independent_event_accuracy","recovery_status")}
          outputs["profile_scorecard.json"]=root/"profile_scorecard.json"
          outputs["profile_scorecard.json"].write_text(json.dumps(card,indent=2,sort_keys=True)+"\\n")
          for name,file in outputs.items():
              target=f'repos/{repo}/contents/{task["out_dir"]}/{name}'
              data=file.read_bytes()
              payload={"branch":branch,"message":f"data(private): verified reduction {name}",
                       "content":base64.b64encode(data).decode()}
              for retry in range(12):
                  old=subprocess.run(["gh","api",target+"?ref="+branch],
                                    capture_output=True,text=True)
                  req=dict(payload)
                  if old.returncode==0:req["sha"]=json.loads(old.stdout)["sha"]
                  res=subprocess.run(["gh","api","-X","PUT",target,"--input","-"],
                                     input=json.dumps(req),capture_output=True)
                  if res.returncode==0:break
                  time.sleep(1+retry)
              else:
                  print("PRIVATE_REDUCER_WRITE_FAILED")
                  sys.exit(1)
          print("PRIVATE_REDUCTION_AND_SOURCE_QA_SUCCESS")
          PY
