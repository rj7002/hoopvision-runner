name: R13 five-game source replay vs official GitHub touch reference (private)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r13-github-official-touch-paired-private-20261104.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        game: ['0022600091','0022600125']
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: research/r13-token-boundary-physics-20261104
      PRIVATE_TASK_SOURCE_SHA: 2430538e9dc3fb1fb9762f7c1fcd4a4e4614de7d
      R13_GAME_ID: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify public content guard
        run: python3 tools/public_content_guard.py
      - name: Run unchanged R13 v2 on SHA-original player-ball source; private QA only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,sys,time
          repo=os.environ["PRIVATE_REPO"];pin=os.environ["PRIVATE_TASK_SOURCE_SHA"]
          branch=os.environ["PRIVATE_BRANCH"];gid=os.environ["R13_GAME_ID"]
          path="gamepulse/fusion/analysis/r13_token_boundary_houston_replay_v1.py"
          d=None
          for attempt in range(8):
              response=subprocess.run(
                  ["gh","api",f"repos/{repo}/contents/{path}?ref={pin}"],
                  capture_output=True,text=True)
              if response.returncode==0:
                  d=json.loads(response.stdout)
                  break
              time.sleep(min(1+attempt,8))
          assert d is not None,"PINNED_PRIVATE_SCRIPT_UNAVAILABLE"
          raw=base64.b64decode(d["content"])
          sha=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
          assert sha==d["sha"]
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/("r13-paired-"+gid)
          root.mkdir()
          script=root/"replay.py";script.write_bytes(raw)
          p=subprocess.run([sys.executable,str(script)],cwd=root,env=os.environ.copy(),
                           capture_output=True,text=True)
          if p.returncode:
              # Do not print private licensed actor/position diagnostics in a public job.
              endpoint=f"repos/{repo}/contents/gamepulse/fusion/qa/r13_github_official_touch_20261104/private_diagnostic_{gid}.json"
              body={"branch":branch,"message":"qa(private): R13 paired game diagnostic [skip ci]",
                    "content":base64.b64encode(json.dumps({
                      "game_id":gid,"returncode":p.returncode,
                      "stderr_tail":p.stderr[-20000:],"stdout_tail":p.stdout[-2000:],
                      "private_pin_sha":pin},sort_keys=True).encode()).decode()}
              old=subprocess.run(["gh","api",endpoint+"?ref="+branch],capture_output=True,text=True)
              if old.returncode==0:body["sha"]=json.loads(old.stdout)["sha"]
              subprocess.run(["gh","api","-X","PUT",endpoint,"--input","-"],
                             input=json.dumps(body),capture_output=True,text=True)
              print("R13_PAIRED_PRIVATE_REPLAY_REQUIRES_REVIEW")
              sys.exit(1)
          print("R13_PAIRED_PRIVATE_REPLAY_SAVED game="+gid)
          PY

  external_holdout:
    needs: replay
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        game: ['0022600001','0022600004']
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: research/r13-token-boundary-physics-20261104
      PRIVATE_TASK_SOURCE_SHA: 2430538e9dc3fb1fb9762f7c1fcd4a4e4614de7d
      R13_GAME_ID: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify public content guard
        run: python3 tools/public_content_guard.py
      - name: Run unchanged R13 v2 on SHA-original player-ball source; private QA only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,sys,time
          repo=os.environ["PRIVATE_REPO"];pin=os.environ["PRIVATE_TASK_SOURCE_SHA"]
          branch=os.environ["PRIVATE_BRANCH"];gid=os.environ["R13_GAME_ID"]
          path="gamepulse/fusion/analysis/r13_token_boundary_external_replay_v1.py"
          d=None
          for attempt in range(8):
              response=subprocess.run(
                  ["gh","api",f"repos/{repo}/contents/{path}?ref={pin}"],
                  capture_output=True,text=True)
              if response.returncode==0:
                  d=json.loads(response.stdout)
                  break
              time.sleep(min(1+attempt,8))
          assert d is not None,"PINNED_PRIVATE_SCRIPT_UNAVAILABLE"
          raw=base64.b64decode(d["content"])
          sha=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
          assert sha==d["sha"]
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/("r13-paired-"+gid)
          root.mkdir()
          script=root/"replay.py";script.write_bytes(raw)
          p=subprocess.run([sys.executable,str(script)],cwd=root,env=os.environ.copy(),
                           capture_output=True,text=True)
          if p.returncode:
              # Do not print private licensed actor/position diagnostics in a public job.
              endpoint=f"repos/{repo}/contents/gamepulse/fusion/qa/r13_external_holdout_20261104/private_diagnostic_{gid}.json"
              body={"branch":branch,"message":"qa(private): R13 paired game diagnostic [skip ci]",
                    "content":base64.b64encode(json.dumps({
                      "game_id":gid,"returncode":p.returncode,
                      "stderr_tail":p.stderr[-20000:],"stdout_tail":p.stdout[-2000:],
                      "private_pin_sha":pin},sort_keys=True).encode()).decode()}
              old=subprocess.run(["gh","api",endpoint+"?ref="+branch],capture_output=True,text=True)
              if old.returncode==0:body["sha"]=json.loads(old.stdout)["sha"]
              subprocess.run(["gh","api","-X","PUT",endpoint,"--input","-"],
                             input=json.dumps(body),capture_output=True,text=True)
              print("R13_EXTERNAL_PRIVATE_HOLDOUT_REQUIRES_REVIEW")
              sys.exit(1)
          print("R13_EXTERNAL_PRIVATE_HOLDOUT_SAVED game="+gid)
          PY
