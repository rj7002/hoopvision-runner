name: IGP 81 missed and-one source audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p2b-team-offrtg-81-same-grain-20261101.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-p2b-team-offrtg81-source-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-missed-and-one-81-credit-20261101
      PIN: 29f68a41c64dde70ed5a9605c12c6cbadd5118a1
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify public guard and pinned private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PIN"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PIN"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PIN"
      - name: Execute private source tests and all81 SHA audit
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest -q gamepulse/fusion/tests/test_igp_p2b_missed_and_one_credit_v1.py > "$RUNNER_TEMP/igp_test.log" 2>&1 || { echo IGP_SOURCE_TEST_FAILED; exit 61; }
          python3 gamepulse/fusion/audit_igp_p2b_missed_and_one_81_v1.py --root . --output "$RUNNER_TEMP/igp81.json" > "$RUNNER_TEMP/igp_audit.log" 2>&1 || { echo IGP_81_SOURCE_AUDIT_FAILED; exit 62; }
          python3 gamepulse/fusion/igp_p2b_81_residual_event_triage_v1.py --root . --output "$RUNNER_TEMP/igp81_triage.json" > "$RUNNER_TEMP/igp_triage.log" 2>&1 || { echo IGP_81_RESIDUAL_TRIAGE_FAILED; exit 64; }
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'igp81.json')))
          assert d['games']==81 and d['team_games']==162
          assert d['original_actions']==49435 and d['original_chains_retained']==16581
          assert d['missed_and_one_continuations']==97 and d['candidate_credits']==16484
          assert d['NBA_Advanced_POSS']==16508 and d['exact_team_games']==54
          assert d['absolute_team_game_residual']==156 and d['NBA_POSS_fitted'] is False
          print('IGP81_PRIVATE_SOURCE_AUDIT_PASS',json.dumps({k:d[k] for k in ('games','team_games','original_actions','original_chains_retained','missed_and_one_continuations','candidate_credits','NBA_Advanced_POSS','exact_team_games','absolute_team_game_residual')},sort_keys=True))
          t=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'igp81_triage.json')))
          assert t['games']==81 and t['team_games']==162 and t['baseline_candidate_credits']==16484
          assert t['baseline_absolute_residual']==156 and t['counterfactual_is_NBA_credit_rule'] is False
          print('IGP81_RESIDUAL_TRIAGE',json.dumps({k:t[k] for k in ('technical_FT_candidates','baseline_absolute_residual','technical_FT_exclusion_counterfactual_absolute_residual','baseline_exact_team_games','technical_FT_exclusion_counterfactual_exact_team_games','baseline_net','technical_FT_exclusion_counterfactual_net')},sort_keys=True))
          assert t['remaining_shared_onset_groups_after_and_one'] >= 1
          print('IGP81_REMAINING_SHARED_ONSETS',json.dumps(t['remaining_shared_onset_pattern_counts'],sort_keys=True))
          PY
      - name: Commit immutable full QA only on exact private head
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git fetch -q origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$PIN" || { echo IGP_PRIVATE_HEAD_MOVED; exit 63; }
          dest=gamepulse/fusion/qa/igp_v32/igp_p2b_81_shared_onset_event_triage_v1.json
          test ! -e "$dest"
          cp "$RUNNER_TEMP/igp81_triage.json" "$dest"
          git add "$dest"
          git -c user.name=igp-source-qa -c user.email=igp-source-qa@users.noreply.github.com commit -qm 'qa: execute IGP81 missed and-one original source audit [skip ci]'
          git push -q origin HEAD:"$BRANCH"
          echo IGP81_PRIVATE_RECEIPT_COMMITTED
