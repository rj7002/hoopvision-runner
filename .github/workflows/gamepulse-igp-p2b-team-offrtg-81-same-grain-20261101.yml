# Aggregate-only public orchestration. Raw NBA source and full QA stay private.
name: IGP P2B 81 NBA official PBP union and OffRtg QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p2b-team-offrtg-81-same-grain-20261101.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-p2b-team-offrtg81-source-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-v32-p2b-all-action-crosswalk-20261031
      PIN: 822351f9542bf2d91e6e352e46c8c878a2f5c0a7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify public guard and exact private source commit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PIN"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PIN"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PIN"
      - name: Replay all 81 PBP games, immutable ten-game raw source, and ratings
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest -q gamepulse/fusion/tests/test_igp_p2b_team_offrtg_same_grain_v1.py
          python3 -m py_compile gamepulse/fusion/igp_p2b_nba81_pbp_union_v1.py
          python3 gamepulse/fusion/igp_p2b_nba81_pbp_union_v1.py \
            --root . --out "$RUNNER_TEMP/igp_p2b_nba81_pbp_union_rate_v1.json" \
            > "$RUNNER_TEMP/igp_private_nba81_union.log" 2>&1 || {
              echo IGP_NBA81_UNION_SOURCE_QA_FAILED_CHECK_PRIVATE_LOG
              exit 61
            }
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          a=json.loads((Path(os.environ["RUNNER_TEMP"])/"igp_p2b_nba81_pbp_union_rate_v1.json").read_bytes())
          c=a["counts"]
          assert c["games"]==81 and c["team_rows"]==162
          assert c["original_native_game_contexts"]==71 and c["PBP_only_games"]==10
          assert c["source_PBP_actions"]==49435
          assert c["PBP_chain_candidates"]==16581 and c["NBA_team_POSS"]==16508
          assert c["official_PBP_points"]==18464
          assert c["unlinked_scoring_points"]==0
          assert a["physical_custody_boundaries_certified"]==0
          print("IGP_NBA81_ORIGINAL_PBP_AND_RATE_QA",json.dumps(c,sort_keys=True))
          PY
      - name: Commit full source QA receipt to private research branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git fetch -q origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$PIN" || {
            echo IGP_PRIVATE_BRANCH_ADVANCED_RECEIPT_NOT_COMMITTED
            exit 62
          }
          dest=gamepulse/fusion/qa/igp_v32/igp_p2b_nba81_original_PBP_union_team_rate_v1.json
          test ! -e "$dest"
          cp "$RUNNER_TEMP/igp_p2b_nba81_pbp_union_rate_v1.json" "$dest"
          git add "$dest"
          git -c user.name=igp-source-qa -c user.email=igp-source-qa@users.noreply.github.com \
            commit -qm "qa: freeze original81 PBP count and same-grain team rate"
          git push -q origin HEAD:"$BRANCH"
          echo IGP_NBA81_PRIVATE_PBP_QA_RECEIPT_COMMITTED
