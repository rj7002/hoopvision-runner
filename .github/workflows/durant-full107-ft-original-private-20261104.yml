# Public orchestration only; Durant original NBA XYZ and derived shot data never leave private 104.
name: Full107 Durant free throws original source private CPU QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/durant-full107-ft-original-private-20261104.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: full107-durant-private-61-ft-original
  cancel-in-progress: false
jobs:
  original-durant-ft:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/full107-durant-free-throw-3d-20261104
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Private-source guard and authenticated sparse checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set --no-cone \
            /gamepulse/fusion/durant_ft_full107_original_3d_v1.py \
            /gamepulse/fusion/official_pbp_timing/games/0022600091.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600009.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600107.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600125.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600138.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600021.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600153.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600167.json \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600091/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600009/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600107/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600125/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600138/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600021/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600153/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600167/
      - name: Read immutable source archives and match official Durant FTs
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 -m py_compile gamepulse/fusion/durant_ft_full107_original_3d_v1.py
          python3 gamepulse/fusion/durant_ft_full107_original_3d_v1.py > "$RUNNER_TEMP/durant-private-extract.log" 2>&1 || { echo 'DURANT_SHA_SOURCE_EXTRACT_FAILED__PRIVATE_RAW_LOGS_WITHHELD'; exit 1; }
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('gamepulse/fusion/qa/durant_ft_full107/durant_free_throw_original_tracking_20261104.json')
          q=json.loads(p.read_bytes());shots=[s for v in q['games'].values() for s in v['attempts']]
          assert len(q['games'])==8 and len(shots)==61 and sum(s['made'] for s in shots)==50
          assert len({(s['game_id'],str(s['action_number'])) for s in shots})==61
          print('DURANT_FULL107_SHA_VERIFIED_P0',json.dumps({'games':8,'attempts':61,'makes':50,'misses':11,'candidate_flights_matched':q['summary']['shot_flights_matched'],'unresolved':q['summary']['missing_or_unresolved'],'derived_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'physical_truth':'NOT_VIDEO_CERTIFIED'},sort_keys=True))
          PY
      - name: Commit original-source-derived QA exclusively into private repository
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f gamepulse/fusion/qa/durant_ft_full107/durant_free_throw_original_tracking_20261104.json
          git diff --cached --check
          if git diff --cached --quiet; then echo 'NO_PRIVATE_QA_CHANGE'; exit 0; fi
          git commit -qm 'qa(private): SHA source Durant official 61 free throws'
          gh auth setup-git
          for i in 1 2 3 4; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH"
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then echo 'DURANT_PRIVATE_SOURCE_QA_COMMITTED'; exit 0; fi
            sleep "$i"
          done
          exit 31
