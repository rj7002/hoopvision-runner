name: IGP 2025-26 archived games NBA xFG source backfill
on:
  push:
    branches: [main]
    paths: [.github/workflows/igp-2025-26-xfg-full-archive.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-2025-26-official-xfg-archive-full
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Confirm public source utility and private destination
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          python3 -m py_compile tools/igp_2025_26_public_xfg_backfill.py
          test -n "$GH_TOKEN"
          if ! gh release view igp-2025-26-xfg-archive-20261105 --repo timeedmonds-maker/104 >/dev/null 2>&1; then
            gh release create igp-2025-26-xfg-archive-20261105 --repo timeedmonds-maker/104 --target main --draft \
              --title 'NBA 2025-26 xFG shot records for archived tracking games' \
              --notes 'Official shotqualityvideologs public NBA game/player responses, source SHA and per-shard QA. Original 2025-26 tracking archive remains immutable; these shot rows do not assert defender identities or physical accuracy.'
          fi
          echo HISTORICAL_XFG_PRIVATE_DESTINATION_READY
  acquire:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ['001','002','003','004','005','006','007','008','009','010','011','012','013','014','015']
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Reuse immutable tracking source and fetch published NBA shot quality
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/derived"
          gh release download igp-public-gamepulse-2025-26-20261105 --repo timeedmonds-maker/104 \
            --pattern nba-2025-26-source-index.json \
            --pattern "nba-2025-26-shard-${{ matrix.shard }}.zip" --dir "$RUNNER_TEMP/source"
          python3 tools/igp_2025_26_public_xfg_backfill.py \
            --index "$RUNNER_TEMP/source/nba-2025-26-source-index.json" \
            --shard "$RUNNER_TEMP/source/nba-2025-26-shard-${{ matrix.shard }}.zip" \
            --out "$RUNNER_TEMP/derived" --workers 2
      - name: Retain source rows and per-game QA privately only
        shell: bash
        run: |
          set -euo pipefail
          gh release upload igp-2025-26-xfg-archive-20261105 \
            "$RUNNER_TEMP/derived/nba-xfg-nba-2025-26-shard-${{ matrix.shard }}.jsonl.gz" \
            "$RUNNER_TEMP/derived/nba-xfg-nba-2025-26-shard-${{ matrix.shard }}-qa.json" \
            --repo timeedmonds-maker/104 --clobber
          python3 - <<'PY'
          import json,os,pathlib
          n=os.environ['SHARD']
          q=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'derived'/f'nba-xfg-nba-2025-26-shard-{n}-qa.json').read_text())
          assert q['games']>0
          print('HISTORICAL_XFG_SHARD_PRIVATE_RECEIPT',n,q['games'],q['counts'].get('public_shot_rows',0),len(q['failed_player_games']))
          PY
        env:
          SHARD: ${{ matrix.shard }}
  reduce:
    needs: acquire
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Count uploaded private source receipts and preserve final QA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          mkdir -p "$RUNNER_TEMP/qa"
          gh release download igp-2025-26-xfg-archive-20261105 --repo timeedmonds-maker/104 \
            --pattern 'nba-xfg-*-qa.json' --dir "$RUNNER_TEMP/qa"
          python3 - <<'PY'
          import collections,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'qa'
          files=sorted(root.glob('nba-xfg-*-qa.json'))
          combined=collections.Counter();failed=0;games=set();with_shots=0
          for p in files:
              d=json.loads(p.read_text())
              combined.update(d['counts'])
              failed+=len(d['failed_player_games'])
              for gid,g in d['per_game'].items():
                  assert gid not in games
                  games.add(gid)
                  with_shots+=int(g.get('published_shot_rows',0)>0)
          print('HISTORICAL_XFG_2025_26_ARCHIVE_REDUCE',json.dumps({
            'shards':len(files),'games':len(games),'games_with_shots':with_shots,
            'public_shot_rows':combined['public_shot_rows'],
            'exact_archived_pbp_actor_action':combined['exact_archived_pbp_actor_action'],
            'nonnull_xfg':combined['nonnull_xfg'],
            'failed_player_games':failed},sort_keys=True))
          assert len(files)==15 and len(games)==666
          assert failed==0
          PY
          gh release edit igp-2025-26-xfg-archive-20261105 --repo timeedmonds-maker/104 --draft=false
          echo HISTORICAL_XFG_SOURCE_ALL_SHARDS_PRIVATE_ACCEPTED
