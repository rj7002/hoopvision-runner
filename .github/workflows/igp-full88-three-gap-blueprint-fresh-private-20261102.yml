# Opaque public workflow. Complete private source, raw reports and shot identities never appear publicly.
name: FULL88 three-game original Blueprint recovery probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full88-three-gap-blueprint-fresh-private-20261102.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: full88-three-gap-original-blueprint-20261102
  cancel-in-progress: false
jobs:
  private-original-recheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: analysis/igp-full88-three-gap-blueprint-recheck-20261102
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify public content guard and authenticate private access
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Clone only private original shot and Blueprint source for three games
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          git sparse-checkout set --no-cone \
            /scripts/update_nba_blueprint_daily_2026_27.py \
            /scripts/build_nba_blueprint_2026_27.py \
            /data/extensions/nba_blueprint_2026_27/games/0022600152/ \
            /data/extensions/nba_blueprint_2026_27/games/0022600004/ \
            /data/extensions/nba_blueprint_2026_27/games/0022600122/ \
            /gamepulse/fusion/igp_full88_default_engine_v1.py \
            /gamepulse/fusion/igp_full88_blueprint_three_gap_source_recheck_v2.py \
            /gamepulse/fusion/qa/igp_fullx/shot_event_multiview_full88_v1.json \
            /gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/shot_event_multiview_full88_v1/shots/0022600152.jsonl.gz \
            /gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/shot_event_multiview_full88_v1/shots/0022600004.jsonl.gz \
            /gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/shot_event_multiview_full88_v1/shots/0022600122.jsonl.gz
          python3 -m py_compile gamepulse/fusion/igp_full88_blueprint_three_gap_source_recheck_v2.py
          python3 gamepulse/fusion/igp_full88_blueprint_three_gap_source_recheck_v2.py --self-test
      - name: Re-fetch first-party published feature variants privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 gamepulse/fusion/igp_full88_blueprint_three_gap_source_recheck_v2.py > "$RUNNER_TEMP/private-source-results" 2>&1 || {
            echo "FULL88_THREE_ORIGINAL_BLUEPRINT_RECHECK_FAILED_PRIVATE_DIAGNOSTIC"
            exit 1
          }
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('gamepulse/fusion/qa/igp_fullx/blueprint_fresh_recheck_three_20261102/summary.json')
          x=json.loads(p.read_text())
          assert x['games_checked']==3 and len(x['statuses'])==3
          assert 0<=x['potential_exact_recoveries']<=99
          assert x['no_source_or_default_model_promotion']
          print('FULL88_PRIVATE_THREE_SOURCE_REVISION_CANDIDATE_COUNT', x['potential_exact_recoveries'])
          print('FULL88_PRIVATE_THREE_SOURCE_REVISION_STATUSES', sorted(x['statuses'].values()))
          PY
      - name: Commit detailed source revision evidence only to private repo
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f gamepulse/fusion/qa/igp_fullx/blueprint_fresh_recheck_three_20261102/
          for gid in 0022600152 0022600004 0022600122; do
            f="data/extensions/nba_blueprint_2026_27/games/$gid/blueprint_report_revision_three_20261102.json"
            if test -f "$f"; then git add --sparse -f "$f"; fi
          done
          git diff --cached --check
          if git diff --cached --quiet; then echo FULL88_THREE_SOURCE_QA_ALREADY_IDENTICAL; exit 0; fi
          git commit -qm 'qa(private): freeze independent three-game Blueprint revision evidence [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH"
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo FULL88_THREE_SOURCE_QA_COMMITTED_PRIVATE_ONLY
              exit 0
            fi
            sleep "$attempt"
          done
          exit 23
