name: IGP 2025-26 zero-scene 0650 source forensic
'on':
  push:
    branches: [main]
    paths: [.github/workflows/igp-2025-26-zero-scene-0650-forensic.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-2025-26-zero-scene-0650-forensic
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Private original-source readback and aggregate-only 0650 failure evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          mkdir -p "$RUNNER_TEMP/original" "$RUNNER_TEMP/qa"
          for try in 1 2 3 4 5 6; do
            if gh release download igp-public-gamepulse-2025-26-20261105 \
                --repo timeedmonds-maker/104 --clobber \
                --pattern nba-2025-26-source-index.json \
                --pattern nba-2025-26-shard-001.zip \
                --dir "$RUNNER_TEMP/original" && \
                test -s "$RUNNER_TEMP/original/nba-2025-26-shard-001.zip"; then break; fi
            if [ "$try" -eq 6 ]; then exit 1; fi
            sleep $((try * 4))
          done
          python3 - <<'PY'
          import collections,gzip,hashlib,io,json,os,pathlib,zipfile
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          idx=json.loads((root/"original/nba-2025-26-source-index.json").read_text())
          z=root/"original/nba-2025-26-shard-001.zip"
          expected=next(sh["sha256"] for sh in idx["shards"] if sh["name"]==z.name)
          digest=hashlib.sha256()
          with z.open("rb") as fd:
              for b in iter(lambda:fd.read(1048576),b""): digest.update(b)
          assert digest.hexdigest()==expected,"IMMUTABLE_2025_SOURCE_DRIFT"
          result={}
          for gid in ("0022500650","0022500649"):
              game=idx["games"][gid]
              member=next(m for m in game["members"] if m["path"].endswith("/tracking.jsonl.gz"))
              count=collections.Counter()
              lengths=collections.Counter()
              ball_max_gap=0
              ball_last=None
              frames_count=0
              with zipfile.ZipFile(z) as arch:
                  blob=arch.read(member["path"])
              assert hashlib.sha256(blob).hexdigest()==member["sha256"],"GAME_SOURCE_HASH_DRIFT"
              with gzip.GzipFile(fileobj=io.BytesIO(blob)) as fp:
                  for line in fp:
                      if not line.strip(): continue
                      f=json.loads(line);frames_count+=1
                      t=f.get("timestamp_ms")
                      roster=f.get("on_court") or {}
                      h=roster.get("home") or []
                      a=roster.get("away") or []
                      has_lineup=len(h)==5 and len(a)==5
                      hp=f.get("home_players") or []
                      ap=f.get("away_players") or []
                      op=f.get("other_players") or []
                      if has_lineup: count["has_five_and_five_roster"]+=1
                      if hp or ap or op: count["has_any_player_record"]+=1
                      lengths[f"actor_records_{min(11,len(hp)+len(ap)+len(op))}"]+=1
                      actor_ids={str(q.get("player_id")) for q in hp+ap if isinstance(q,dict) and isinstance(q.get("xyz"),list) and len(q["xyz"])>=3}
                      ball=f.get("ball")
                      has_ball=isinstance(ball,dict) and isinstance(ball.get("xyz"),list) and len(ball["xyz"])>=3
                      if has_ball:
                          count["has_original_ball_xyz"]+=1
                          if ball_last is not None and isinstance(t,int): ball_max_gap=max(ball_max_gap,t-ball_last)
                          ball_last=t
                      if has_lineup:
                          expected_ids={str(p.get("player_id") if isinstance(p,dict) else p) for p in h+a}
                          available=len(actor_ids & expected_ids)
                          count[f"expected_actor_count_{available}"]+=1
                          if available>=9: count["nine_plus_expected_actors"]+=1
                          if available==10: count["ten_expected_actors"]+=1
                          if available==10 and has_ball: count["ten_plus_ball_source_direct"]+=1
                      if (f.get("quality") or {}).get("source_interpolated"): count["upstream_interpolated_flag"]+=1
                      if (f.get("quality") or {}).get("all_ten_and_ball_observed"): count["source_quality_complete_flag"]+=1
                      if f.get("phase")=="live": count["phase_live_value"]+=1
              assert frames_count==game["tracking"]["rows"],"NORMALIZED_ROW_DRIFT"
              result[gid]={"frames":frames_count,"counts":dict(count),
                           "actor_record_distribution":dict(lengths),
                           "max_source_ball_time_gap_ms":ball_max_gap,
                           "source_tracking_sha256":member["sha256"]}
          out={"schema":"igp.historical-source-0650-forensic.v1","season":"2025-26",
               "immutable_source_shard_sha256":expected,
               "records":result,
               "interpretation":"SOURCE_ONLY_COUNTS_NOT_FULL107_PHYSICAL_ACCURACY"}
          (root/"qa/historical-source-0650-forensic.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("HISTORICAL_ZERO_SCENE_ORIGINAL_COUNTS",json.dumps(
             {g:{"frames":v["frames"],"counts":v["counts"],
                  "actor_record_distribution":v["actor_record_distribution"],
                  "max_source_ball_time_gap_ms":v["max_source_ball_time_gap_ms"]}
              for g,v in result.items()},sort_keys=True))
          PY
          gh release upload igp-2025-26-full107-native-20261105 \
            "$RUNNER_TEMP/qa/historical-source-0650-forensic.json" \
            --repo timeedmonds-maker/104 --clobber
          echo IGP_HISTORICAL_ZERO_SCENE_SOURCE_RECEIPT_PRIVATE
