# Frozen exact 146-game source-grade shot/event QA; original NBA source remains private.
name: IGP Full146 original source-graded analytical SHA acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full146-sourcegraded-qa-20261110.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-full146-sourcegraded-qa-20261110
  cancel-in-progress: false
jobs:
  verify-private-immutable-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify public-private guard
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
      - name: Execute original SHA-locked FULL146 PBP/shot source acceptance
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b research/gamepulse-clock-boundary-integrity-20261025 \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          git sparse-checkout set --no-cone \
            /gamepulse/fusion/igp_full146_sourcegraded_query_v1.py \
            /gamepulse/fusion/qa/igp_fullx/shot_event_multiview_FULL146_3a8912b1e6a7_v2.json \
            /gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/shot_event_multiview_fullx_v2/FULL146_3a8912b1e6a7/shots/0022600189.jsonl.gz \
            /gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/shot_event_multiview_fullx_v2/FULL146_3a8912b1e6a7/shots/0022600202.jsonl.gz \
            /gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/shot_event_multiview_fullx_v2/FULL146_3a8912b1e6a7/events/0022600202.jsonl.gz
          PYTHONPATH=gamepulse/fusion python3 - <<'PY'
          import hashlib,json,gzip
          from pathlib import Path
          from igp_full146_sourcegraded_query_v1 import query,read_index,RELEASE_SHA
          index=read_index('.')
          assert index['game_count']==146 and len(index['games'])==146
          assert index['original_first56_frozen'] is True and index['accepted_last7_frozen'] is True
          counts=index['counts']
          assert counts['official_fga']==25728 and counts['official_actions']==88260
          assert sum(g['counts']['official_fga'] for g in index['games'].values())==25728
          assert sum(g['counts']['any_shot_analytics'] for g in index['games'].values())==23640
          original={id for id,g in index['games'].items() if g['original_native_source_present']}
          assert len(original)==145 and set(index['games'])-original=={'0022600189'}
          assert counts['blueprint_exact']==23537 and counts['companion_exact']==22991
          p=Path('gamepulse/fusion/qa/igp_fullx/shot_event_multiview_FULL146_3a8912b1e6a7_v2.json')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==RELEASE_SHA
          summary=query('.')
          assert summary['games']==146 and summary['official_fga']==25728
          assert summary['official_actions']==88260
          assert summary['source_raw_xyz_complete_146'] is False
          missing=query('.',game_id='0022600189')
          assert not missing['original_native_source_present']
          assert missing['source_sha256']['NBA_BLUEPRINT'] is None
          assert missing['source_sha256']['ORIGINAL_NATIVE_MANIFEST'] is None
          assert missing['counts']['official_fga']==188
          for gid,kind in [('0022600189','shot'),('0022600202','shot'),('0022600202','event')]:
              g=index['games'][gid]
              path=Path(g['shots_path'] if kind=='shot' else g['events_path'])
              expected=g['shot_sha256'] if kind=='shot' else g['event_sha256']
              raw=path.read_bytes()
              assert hashlib.sha256(raw).hexdigest()==expected
              rows=[json.loads(line) for line in gzip.decompress(raw).splitlines() if line]
              assert len(rows)>0 and all(row['game_id']==gid for row in rows)
              aid=rows[0]['official_action_number']
              result=query('.',game_id=gid,kind=kind,action_number=aid)
              assert result['game_id']==gid and result['official_action_number']==aid
              if gid=='0022600189':
                  assert all(row.get('blueprint_original_shot') is None and row.get('blueprint_published_xfg') is None for row in rows)
          print('FULL146_ORIGINAL_SHA_INDEX_AND_QUERY_PASS',
                146,len(original),counts['official_actions'],counts['official_fga'],
                'no_original_shot_analytics',counts['official_fga']-counts['any_shot_analytics'])
          PY
          echo FULL146_SOURCE_GRADED_IMMUTABLE_ACCEPTANCE_PASS
