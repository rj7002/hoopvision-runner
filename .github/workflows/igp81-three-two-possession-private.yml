name: IGP81 two-possession three-point value (private source)
# Public opaque executor only. All algorithms, licensed shots/PBP, and output private.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp81-three-two-possession-private.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: igp81-shot-next-defense-private-v1
  cancel-in-progress: false
jobs:
  source-graded-81:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: analysis/igp81-two-possession-three-value-20261101
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Guard public/private boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          gh auth setup-git
      - name: Read SHA-pinned private 81 game official PBP and shot-coordinate layers
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set --no-cone \
            'gamepulse/fusion/analysis/igp81_threepoint_net_two_possessions_v1.py' \
            'gamepulse/fusion/universal_possession_alignment_2026.py' \
            'gamepulse/fusion/official_pbp_timing/games/*.json' \
            'gamepulse/fusion/official_pbp_timing/pbp_only_oct21_10/games/*.json' \
            'gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/shot_biomechanics_all81_v1/index.json' \
            'data/extensions/nba_blueprint_2026_27/games/*/shot_tracking_32_fields.csv'
          test -f "$RUNNER_TEMP/private/gamepulse/fusion/analysis/igp81_threepoint_net_two_possessions_v1.py"
          test -f "$RUNNER_TEMP/private/data/extensions/nba_blueprint_2026_27/games/0022600001/shot_tracking_32_fields.csv"
          test -f "$RUNNER_TEMP/private/gamepulse/fusion/official_pbp_timing/games/0022600001.json"
          cd "$RUNNER_TEMP/private"
          python3 -m py_compile gamepulse/fusion/analysis/igp81_threepoint_net_two_possessions_v1.py
          PYTHONPATH="$PWD/gamepulse/fusion" python3 - <<'PY'
          from gamepulse.fusion.analysis.igp81_threepoint_net_two_possessions_v1 import locate
          assert locate(246,15)=="corner"
          assert locate(-24,258)=="top_above_break"
          assert locate(-162,211)=="wing_above_break"
          print("PRIVATE_SHOT_LOCATION_GEOMETRY_REGRESSION_PASS")
          PY
      - name: Execute private official shot/PBP net-possession analysis
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          PYTHONPATH="$PWD/gamepulse/fusion" python3 gamepulse/fusion/analysis/igp81_threepoint_net_two_possessions_v1.py \
            --root . --out "$RUNNER_TEMP/igp81_shot_net_private.json" > "$RUNNER_TEMP/private_analysis.log" 2>&1 || { echo PRIVATE_81_SOURCE_ANALYSIS_FAILED; exit 21; }
          python3 - <<'PY'
          import json,os
          p=os.path.join(os.environ['RUNNER_TEMP'],'igp81_shot_net_private.json')
          a=json.load(open(p))
          assert a['games']==81 and set(a['regions'])=={'corner','wing_above_break','top_above_break'}
          assert sum(a['regions'][r]['n'] for r in a['regions'])>0
          print('IGP81_SOURCE_GRADED_3PT_NEXT_DEF_ANALYSIS_COMPLETED')
          PY
      - name: Store fully measured output privately
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess,time
          repo='timeedmonds-maker/104'
          dest='gamepulse/fusion/qa/analysis/igp81_two_possession_three_value_20261101_v1.json'
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'igp81_shot_net_private.json'
          ref=os.environ['PRIVATE_BRANCH']
          payload={'branch':ref,
                   'message':'data(private): complete source-graded 81-game 3PA two-possession net analysis',
                   'content':base64.b64encode(path.read_bytes()).decode()}
          cmd=['gh','api',f'repos/{repo}/contents/{dest}']
          for attempt in range(8):
              before=subprocess.run(cmd,capture_output=True,text=True)
              body=dict(payload)
              if before.returncode==0: body['sha']=json.loads(before.stdout)['sha']
              put=subprocess.run(['gh','api','-X','PUT',f'repos/{repo}/contents/{dest}','--input','-'],
                                 input=json.dumps(body),capture_output=True,text=True)
              if put.returncode==0:
                  print('IGP81_PRIVATE_81GAME_SHOT_NET_RESULTS_COMMITTED')
                  break
              time.sleep(attempt+1)
          else: raise RuntimeError('PRIVATE_RESULT_WRITE_FAILED')
          PY

# rerun with current allowlisted public guard
