name: IGP 2025-26 Full666 indexed PBP native actor possession query smoke
'on':
  push:
    branches: [main]
    paths: [.github/workflows/igp-2025-26-full666-query-smoke.yml]
  workflow_dispatch:
permissions: {contents: read}
env:
  GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
  RELEASE: igp-2025-26-full666-pbp-possession-20261106
  BRANCH: research/gamepulse-clock-boundary-integrity-20261025
jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Clone protected historical Full666 read-only query source
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          python3 -m py_compile "$RUNNER_TEMP/private/gamepulse/fusion/igp_2025_26_full666_pbp_possession_query_v1.py"
          mkdir -p "$RUNNER_TEMP/smoke"
      - name: Read immutable pilot SQLite and QA only from private release
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 16);do
            if gh release download "$RELEASE" --repo timeedmonds-maker/104 \
              --pattern 'historical-full666-pbp-possession-nba-2025-26-shard-001-qa.json' \
              --pattern 'historical-full666-pbp-possession-nba-2025-26-shard-001.sqlite.gz' \
              --dir "$RUNNER_TEMP/smoke" --clobber;then ok=1;break;fi
            sleep 170
          done
          test "$ok" -eq 1
      - name: Bounded search by game, action, native time, actor and candidate possession
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/private/gamepulse/fusion"
          python3 - <<'PY'
          import gzip,hashlib,json,os,pathlib,sqlite3,zlib
          from igp_2025_26_full666_pbp_possession_query_v1 import read_conn,rows
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'smoke'
          qa=json.loads(next(root.glob('*-qa.json')).read_text())
          source=next(root.glob('*.sqlite.gz'))
          target=root/source.name.removesuffix('.gz')
          with gzip.open(source,'rb') as f,target.open('wb') as out:
            for b in iter(lambda:f.read(1048576),b''):out.write(b)
          h=hashlib.sha256()
          with target.open('rb') as f:
            for b in iter(lambda:f.read(1048576),b''):h.update(b)
          assert h.hexdigest()==qa['index_sha256']
          db=read_conn(target)
          assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert db.execute('select count(*) from games').fetchone()[0]==50
          assert db.execute('select count(*) from frames').fetchone()[0]==1501064
          assert db.execute('select count(*) from actions').fetchone()[0]==28802
          assert db.execute('select count(*) from logical_chains').fetchone()[0]==9887
          assert db.execute('select count(*) from frames where candidate_possession_id is not null').fetchone()[0]==919167
          # Source-zero PBP game remains accessible and source actions abstain.
          zero='0022500644'
          assert db.execute('select count(*) from frames where game_id=?',(zero,)).fetchone()[0]==27436
          assert len(rows(db,zero,'actions',20)['rows'])==0
          assert len(rows(db,zero,'chains',20)['rows'])==0
          assert rows(db,zero,'frames',20)['rows']
          # Pick a real player from original-source actor postings and a real source-anchored possession.
          other=db.execute('select game_id,actor_id,count from actor_postings where count>=100 limit 1').fetchone()
          assert other is not None
          actor_query=rows(db,other['game_id'],'actor',20,actor=other['actor_id'])
          assert actor_query['frames'] and actor_query['original_native_observations']>=100
          candidate=db.execute('select game_id,candidate_possession_id from frames where candidate_possession_id is not null limit 1').fetchone()
          assert candidate is not None
          possession_query=rows(db,candidate['game_id'],'frames',20,possession=candidate['candidate_possession_id'])
          assert possession_query['rows'] and all(
            q['candidate_possession_id']==candidate['candidate_possession_id'] for q in possession_query['rows'])
          action_game=db.execute('select game_id from actions limit 1').fetchone()[0]
          assert rows(db,action_game,'actions',20)['rows']
          db.close()
          print('HISTORICAL_FULL666_PBP_PILOT_REAL_PRIVATE_SQLITE_QUERY_VERIFIED',json.dumps({
            'games':50,'frames':1501064,'source_actions':28802,
            'candidate_logical_chains':9887,'frames_with_candidate_possession':919167,
            'zero_pbp_game_preserved':True,
            'actor_ordinal_postings_queryable':True,
            'game_possession_event_and_timestamps_queryable':True,
            'native_original_coordinates_not_exported':True,
            'physical_custody_certified':False
          },sort_keys=True))
          PY
