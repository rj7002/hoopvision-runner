              assert s["rows"][0]["physical_possession_certified"] is False
              assert s["rows"][0]["play_state_proxy"]==LIVE
          print("IGP81_ORIGINAL_SOURCE_SCENE_AND_STATISTICAL_POSS_READBACK_PASSED")
          PY
            cp "$RUNNER_TEMP/igp81-final-smoke.log" gamepulse/fusion/qa/igp_v32/igp81_final_private_source_scene_error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f gamepulse/fusion/qa/igp_v32/igp81_final_private_source_scene_error.txt
            git commit -q -m "qa(igp81): retain private final native source query traceback"
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH"
            git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"
            echo IGP81_PRIVATE_SCENE_READBACK_REQUIRES_REPAIR
