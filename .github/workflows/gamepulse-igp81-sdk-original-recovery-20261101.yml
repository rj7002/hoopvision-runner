                  box=json.loads(raw["boxscore_"+gid+".json"])
                  windows,_,_=paired_windows(pb,box)
              segments=clip_to_official_windows(
                  official_event_pair_segments(pb["actions"])[0],windows)
              samples=[((lo+99)//100)*100 for lo,hi,state,*_ in segments
                       if state==LIVE and ((lo+99)//100)*100<=hi]
              assert samples
