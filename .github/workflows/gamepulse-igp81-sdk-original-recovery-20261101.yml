# 2026-11-01: rerun after public content guard allowlist registration.
# Approved scope: private original NBA source recovery; public job logs aggregate status only.
name: IGP81 private native SDK source recovery and hybrid gate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp81-sdk-original-recovery-20261101.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp81-original-sdk-recovery-private
  cancel-in-progress: false
jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: release/igp32-p2b-nba81-unified-default-20261101
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check reviewed guard and private-only checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Test exact 71+10 source-and-rate reconciliation on private data
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/query_igp81_original_native_guarded_scene_v1.py gamepulse/fusion/igp81_sdk_original_5game_recovery_v1.py gamepulse/fusion/igp81_new10_guarded_p2b_shadow_audit_v1.py gamepulse/fusion/igp81_full_native_source_acceptance_gate_v1.py gamepulse/fusion/igp81_full_native_source_guarded_default_v1.py
          python3 -m unittest -q gamepulse/fusion/tests/test_igp81_newten_source_masks_and_release_gate_v1.py gamepulse/fusion/tests/test_igp81_full_native_source_guarded_default_v1.py gamepulse/fusion/tests/test_query_igp81_original_native_guarded_scene_v1.py
          if ! python3 -m unittest -q gamepulse/fusion/tests/test_igp81_default_team_offrtg.py gamepulse/fusion/tests/test_igp_v32_p2b_nba81_unified_default_v1.py > "$RUNNER_TEMP/private-gate.log" 2>&1; then
            mkdir -p gamepulse/fusion/qa/igp_v32
            cp "$RUNNER_TEMP/private-gate.log" gamepulse/fusion/qa/igp_v32/igp81_unified_private_ci_failure_20261101.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f gamepulse/fusion/qa/igp_v32/igp81_unified_private_ci_failure_20261101.txt
            git commit -q -m "qa(igp81): retain private combined-source failed test evidence"
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH"
            git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"
            echo IGP81_PRIVATE_HYBRID_TEST_GATE_FAILED_RECEIPT_PRIVATE
            exit 2
          fi
          python3 gamepulse/fusion/igp_v32_p2b_nba81_unified_default_v1.py --summary-only > "$RUNNER_TEMP/private-hybrid.json"
          python3 - <<'PY'
          import json,os
          x=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"private-hybrid.json")))
          assert x["full_frozen_NBA_PBP_games"]==81
          assert x["accepted_original_SDK_plus_guarded_P2B_games"]==71
          assert x["additional_NBA_PBP_only_tracking_unadmitted_games"]==10
          assert x["guarded_71game_complete_ten_plus_ball"]==1015072
          assert x["all81_tracking_coverage_pct"] is None
          print("IGP81_PRIVATE_HYBRID_SOURCE_GRADE_TEST_PASSED")
          PY
  recover-five:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        game: ['0022600015','0022600016','0022600017','0022600018','0022600019','0022600020','0022600021','0022600022','0022600023','0022600024']
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: release/igp32-p2b-nba81-unified-default-20261101
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Secure ephemeral private checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: SHA-validate all 13 originals and materialize native-only XYZ privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          OUT="gamepulse/fusion/qa/igp_v32/igp81_native_sdk_source_${{ matrix.game }}.json"
          if test -s "gamepulse/fusion/materialized/igp_all_original_xyz/${{ matrix.game }}/index.json"; then
            echo PRIVATE_EXISTING_NATIVE_GAME_SKIP
            exit 0
          fi
          if ! python3 gamepulse/fusion/igp81_sdk_original_5game_recovery_v1.py --root . --games "${{ matrix.game }}" --output "$OUT" > "$RUNNER_TEMP/private-recovery.log" 2>&1; then
            diag="gamepulse/fusion/qa/igp_v32/igp81_native_sdk_failure_${{ matrix.game }}.txt"
            cp "$RUNNER_TEMP/private-recovery.log" "$diag"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f "$diag"
            git commit -q -m "qa(igp81): record private SDK extraction failure diagnostic"
            for attempt in 1 2 3 4 5 6; do
              git fetch -q origin "$PRIVATE_BRANCH"
              git rebase -q "origin/$PRIVATE_BRANCH"
              if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then break; fi
              sleep "$attempt"
            done
            echo IGP81_PRIVATE_NATIVE_SOURCE_RECOVERY_FAILED_RECEIPT_PRIVATE
            exit 3
          fi
          python3 - "$OUT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["games_recovered_to_native_source_only"]==1
          assert d["new10_accepted_guarded_p2b_games"]==0
          assert len(d["source_records"][0]["original_parts_sha256"])==13
          assert d["source_records"][0]["original_native_timestamps"]>0
          print("IGP81_NATIVE_13PART_SHA_SOURCE_EXTRACTED")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "gamepulse/fusion/materialized/igp_all_original_xyz/${{ matrix.game }}" "$OUT"
          git diff --cached --check
          git commit -q -m "data(igp81): recover privately SHA original game source"
          published=0
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$PRIVATE_BRANCH"
            if git rebase -q "origin/$PRIVATE_BRANCH" && git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              published=1
              break
            fi
            sleep "$attempt"
          done
          test "$published" -eq 1
          echo IGP81_PRIVATE_NATIVE_SOURCE_COMMITTED

  evaluate-new-native:
    needs: recover-five
    if: always()
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        game: ['0022600015','0022600016','0022600017','0022600018','0022600019','0022600020','0022600021','0022600022','0022600023','0022600024']
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: release/igp32-p2b-nba81-unified-default-20261101
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Private-only checkout and approved public safety gate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Run 10Hz original-SDK official-ten guarded P2B shadow admission QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          out="gamepulse/fusion/qa/igp_v32/igp81_new10_guarded_shadow_${{ matrix.game }}.json"
          if test -s "$out"; then
            echo IGP81_NATIVE_SHADOW_ALREADY_MATERIALIZED
            exit 0
          fi
          if ! python3 gamepulse/fusion/igp81_new10_guarded_p2b_shadow_audit_v1.py --root . --games "${{ matrix.game }}" --out "$out" > "$RUNNER_TEMP/igp81-newsource-qa.log" 2>&1; then
            cp "$RUNNER_TEMP/igp81-newsource-qa.log" "$out.failure.txt"
            out="$out.failure.txt"
            status=5
          else
            status=0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$out"
          git commit -q -m "qa(igp81): private original NBA ten 10Hz P2B shadow or diagnostic"
          published=0
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH"
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              published=1
              break
            fi
            sleep "$attempt"
          done
          test "$published" -eq 1
          if test "$status" -ne 0; then
            echo IGP81_PRIVATE_P2B_SHADOW_QA_DIAGNOSTIC_COMMITTED
            exit 5
          fi
          echo IGP81_PRIVATE_P2B_SHADOW_QA_COMMITTED


  grade-full81:
    needs: evaluate-new-native
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: release/igp32-p2b-nba81-unified-default-20261101
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Private-only approval context
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Save exact 81-game source acceptance decision privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          dest="gamepulse/fusion/qa/igp_v32/igp81_full_native_source_promotion_gate_v1.json"
          if test -s "$dest"; then
            echo IGP81_FULL_NATIVE_DECISION_ALREADY_PRESERVED
            exit 0
          fi
          python3 gamepulse/fusion/igp81_full_native_source_acceptance_gate_v1.py --root . --out "$dest" > "$RUNNER_TEMP/private-grade.log" 2>&1 || {
            echo IGP81_PRIVATE_FINAL_GATE_SCRIPT_ERROR
            exit 6
          }
          python3 - "$dest" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['statistical_NBA_POSS_cohort_games']==81
          assert x['frozen_original71_tracking_games']==71
          assert x['source_grade_not_independently_video_certified']
          assert x['existing_engine_promoted_to_81'] is False
          print('IGP81_FINAL_SOURCE_GRADE_RECEIPT_VALID')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dest"
          git commit -q -m "qa(igp81): persist fail-closed full 81 guarded SDK source release decision"
          saved=0
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH"
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              saved=1
              break
            fi
            sleep "$attempt"
          done
          test "$saved" -eq 1
          echo IGP81_SOURCE_GRADE_DECISION_PRIVATE_SAVED
