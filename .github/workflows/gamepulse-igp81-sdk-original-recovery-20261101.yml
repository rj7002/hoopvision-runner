          assert hybrid["team_nba_published_POSS"]==16508
          assert hybrid["physical_custody_boundaries_certified"]==0
          ids=["0022600001","0022600022"]
          for gid in ids:
              if gid=="0022600001":
                  index=source_index(".")
                  context,_=load_context(".",gid,entries=index["per_game"])
                  pb=json.loads((Path("gamepulse/fusion/official_pbp_timing/games")/(gid+".json")).read_bytes())
