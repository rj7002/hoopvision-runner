name: Protected private analysis CPU shard
# Approved by the public content guard; protected analysis reads current private method version.
# Public control surface only. Private algorithm, dataset, revisions, results,
# and detailed failures remain in the authenticated private repository.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/private-analysis-cpu-shard.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: protected-private-analytics-2026
  cancel-in-progress: false
jobs:
  # Freeze an opaque main-commit selector for this one workflow run.
  # Otherwise a concurrent private request can retarget its reducer midway.
  pin-task:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    outputs:
      selector_commit: ${{ steps.pin.outputs.selector_commit }}
    steps:
      - name: Pin private selector revision without reading private methods into logs
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          ref="$(gh api repos/timeedmonds-maker/104/commits/main --jq .sha)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "selector_commit=$ref" >> "$GITHUB_OUTPUT"
  private-shard:
    needs: [pin-task]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0,1,2,3,4,5,6,7,8]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      TASK_SELECTOR_REF: ${{ needs.pin-task.outputs.selector_commit }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public boundary and authenticated private read
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Run private task and retain aggregate evidence only in private source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess,sys,time
          def cmd(argv, **kw):
              kw.setdefault("stdout",subprocess.DEVNULL)
              kw.setdefault("stderr",subprocess.DEVNULL)
              return subprocess.run(argv,check=True,**kw)
          repo="timeedmonds-maker/104"
          item=json.loads(base64.b64decode(subprocess.check_output(
              ["gh","api",f"repos/{repo}/contents/analysis_execution/current_igp_task.json?ref={os.environ['TASK_SELECTOR_REF']}",
               "--jq",".content"])))
          assert type(item["shards"]) is int and item["shards"]==9
          assert item["script"].startswith("gamepulse/fusion/analysis/")
          assert item["out_dir"].startswith("gamepulse/fusion/qa/analysis/")
          ref=item["ref"]
          expected=item.get("source_sha")
          assert ref.startswith("analysis/") and all(c.isalnum() or c in "-_/." for c in ref)
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"private-src"
          cmd(["gh","auth","setup-git"],stdout=subprocess.DEVNULL)
          cmd(["git","clone","-q","--depth=1","--filter=blob:none","--sparse",
               "-b",ref,f"https://github.com/{repo}.git",str(root)])
          cmd(["git","-C",str(root),"sparse-checkout","set","gamepulse/fusion"],
              stdout=subprocess.DEVNULL)
          if expected:
              cmd(["git","-C",str(root),"fetch","-q","--depth=1","origin",expected],stdout=subprocess.DEVNULL)
              cmd(["git","-C",str(root),"checkout","-q","--detach",expected],stdout=subprocess.DEVNULL)
              assert subprocess.check_output(["git","-C",str(root),"rev-parse","HEAD"],text=True).strip()==expected
          task=root/item["script"]
          assert task.is_file()
          cmd([sys.executable,"-m","py_compile",str(task)])
          test_path=item.get("test_script","gamepulse/fusion/analysis/test_igp81_halfcourt_league_rank_source_free_v1.py")
          assert test_path.startswith("gamepulse/fusion/analysis/") and ".." not in test_path
          test=root/test_path
          assert test.is_file()
          probe=subprocess.run([sys.executable,str(test)],
                               cwd=root,capture_output=True,text=True,
                               env={**os.environ,
                                    "PYTHONPATH":str(root/"gamepulse/fusion/analysis")})
          if probe.returncode:
              # Never disclose private test names or traces in public logs.
              # Persist the diagnostic only to the authenticated private repo.
              shard=int(os.environ["SHARD"])
              rel=f'{item["out_dir"]}/shard_{shard}_source_free_failure.json'
              dest=f"repos/{repo}/contents/{rel}"
              rec={"state":"PRIVATE_SOURCE_FREE_REGRESSION_FAILED",
                   "shard":shard,"source_sha":expected,
                   "stderr_tail_private":probe.stderr[-10000:],
                   "stdout_tail_private":probe.stdout[-3000:]}
              payload={"branch":ref,"message":f"qa(private): R9 source-free shard {shard} test failure",
                       "content":base64.b64encode(json.dumps(rec).encode()).decode()}
              for retry in range(5):
                  previous=subprocess.run(["gh","api",dest+"?ref="+ref],capture_output=True,text=True)
                  req=dict(payload)
                  if previous.returncode==0:req["sha"]=json.loads(previous.stdout)["sha"]
                  saved=subprocess.run(["gh","api","-X","PUT",dest,"--input","-"],
                                       input=json.dumps(req),capture_output=True,text=True)
                  if saved.returncode==0:break
                  time.sleep(1+retry)
              print("PRIVATE_ANALYSIS_SOURCE_FREE_REGRESSION_FAILED")
              sys.exit(1)
          shard=int(os.environ["SHARD"])
          output=pathlib.Path(os.environ["RUNNER_TEMP"])/"private-summary.json"
          p=subprocess.run([sys.executable,str(task),"--root",str(root),
                            "--shard",str(shard),"--shards",str(item["shards"]),
                            "--out",str(output)],cwd=root,capture_output=True,text=True,
                            env={**os.environ,"PYTHONPATH":str(root/"gamepulse/fusion")})
          if p.returncode:
              # Store diagnostic only in the private repository. Public logs
              # never receive tracebacks, private paths, coordinates or actors.
              path=f'{item["out_dir"]}/shard_{shard}_failure.json'
              target=f"repos/{repo}/contents/{path}"
              diagnosis={"state":"PRIVATE_ANALYSIS_FAILED",
                         "shard":shard,"returncode":p.returncode,
                         "stderr_tail_private":p.stderr[-3000:]}
              payload={"branch":ref,
                       "message":f"qa(private): protected shard {shard} failed",
                       "content":base64.b64encode(json.dumps(diagnosis).encode()).decode()}
              previous=subprocess.run(["gh","api",target+"?ref="+ref],capture_output=True,text=True)
              if previous.returncode==0:payload["sha"]=json.loads(previous.stdout)["sha"]
              subprocess.run(["gh","api","-X","PUT",target,"--input","-"],
                             input=json.dumps(payload),capture_output=True)
              print("PRIVATE_ANALYSIS_SOURCE_EXECUTION_FAILED")
              sys.exit(1)
          data=output.read_bytes()
          result=json.loads(data)
          assert result["shard"]==shard and result["shards"]==9
          assert result["engine_id"]==item["engine"] and result["original_source_modified"] is False
          path=f'{item["out_dir"]}/shard_{shard}.json'
          target=f"repos/{repo}/contents/{path}"
          payload={"branch":ref,"message":f"data(private): IGP analytics protected shard {shard}",
                   "content":base64.b64encode(data).decode()}
          for attempt in range(12):
              prev=subprocess.run(["gh","api",target+"?ref="+ref],capture_output=True,text=True)
              content=dict(payload)
              if prev.returncode==0:content["sha"]=json.loads(prev.stdout)["sha"]
              r=subprocess.run(["gh","api","-X","PUT",target,"--input","-"],
                               input=json.dumps(content),capture_output=True,text=True)
              if r.returncode==0:break
              time.sleep(2+attempt)
          else:
              print("PRIVATE_ANALYSIS_RECEIPT_WRITE_FAILED")
              sys.exit(1)
          print("PRIVATE_ANALYSIS_SHARD_COMMITTED")
          PY

  private-ranking:
    needs: [pin-task, private-shard]
    if: success()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      TASK_SELECTOR_REF: ${{ needs.pin-task.outputs.selector_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source-free boundary validation
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Pool private shard summaries and write validated private-only leaderboard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess,sys,time
          repo="timeedmonds-maker/104"
          def fetch(path,ref):
              raw=subprocess.check_output(
                  ["gh","api",f"repos/{repo}/contents/{path}?ref={ref}",
                   "--jq",".content"])
              return base64.b64decode(raw)
          task=json.loads(fetch("analysis_execution/current_igp_task.json",os.environ["TASK_SELECTOR_REF"]))
          assert task["shards"]==9
          ref=task["ref"]
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"source-shard-summary"
          root.mkdir(parents=True)
          for i in range(9):
              name=f"shard_{i}.json"
              (root/name).write_bytes(fetch(f'{task["out_dir"]}/{name}',ref))
          script=root/"rank.py"
          script.write_bytes(fetch(
              task.get("reduce_script","gamepulse/fusion/analysis/igp81_halfcourt_nearest_defender_rank_v1.py"),task.get("source_sha") or ref))
          outputs={
              "top20.json":root/"top20.json",
              "all_league_players.json":root/"all_league_players.json",
              "all_league_players.csv":root/"all_league_players.csv",
              "all_player_team_splits.csv":root/"all_player_team_splits.csv"}
          subprocess.run([sys.executable,"-m","py_compile",str(script)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          proc=subprocess.run([sys.executable,str(script),"--dir",str(root),
                               "--out",str(outputs["top20.json"]),
                               "--league-json",str(outputs["all_league_players.json"]),
                               "--league-csv",str(outputs["all_league_players.csv"]),
                               "--team-csv",str(outputs["all_player_team_splits.csv"])],
                              capture_output=True,text=True)
          if proc.returncode:
              print("PRIVATE_RANKING_VALIDATION_FAILED")
              sys.exit(1)
          top=json.loads(outputs["top20.json"].read_bytes())
          league=json.loads(outputs["all_league_players.json"].read_bytes())
          assert top["games_processed"]==81 and league["games_processed"]==81
          assert top["original_source_modified"] is False
          assert league["original_source_modified"] is False
          if "total_players_with_samples" in league:
              assert league["total_players_with_samples"]==len(league["all_league_players"])
              assert league["total_player_team_rows"]==len(league["all_player_team_splits"])
          assert top["analysis_code_sha256"]==league["analysis_code_sha256"]
          for name,out in outputs.items():
              target=f'repos/{repo}/contents/{task["out_dir"]}/{name}'
              payload={"branch":ref,
                       "message":f"data(private): IGP81 proximity verified {name}",
                       "content":base64.b64encode(out.read_bytes()).decode()}
              for attempt in range(12):
                  old=subprocess.run(["gh","api",target+"?ref="+ref],capture_output=True,text=True)
                  req=dict(payload)
                  if old.returncode==0:req["sha"]=json.loads(old.stdout)["sha"]
                  r=subprocess.run(["gh","api","-X","PUT",target,"--input","-"],
                                   input=json.dumps(req),capture_output=True,text=True)
                  if r.returncode==0:break
                  time.sleep(2+attempt)
              else:
                  print("PRIVATE_RANKING_RECEIPT_WRITE_FAILED")
                  sys.exit(1)
          print("PRIVATE_AGGREGATE_LEAGUE_AND_TEAM_TABLES_READY")
          PY


