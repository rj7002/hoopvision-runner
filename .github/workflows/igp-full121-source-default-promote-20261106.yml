          python3 - <<'PY'
          from igp_full92_frozen_rollback_view_v1 import rollback_view
          from igp_full92_tracking_source_census_v1 import indexes
          from igp_full92_all_event_rebound_tracking_v1 import original_release
          from igp_full92_source_grade_default_v1 import query as old_query
          from igp_full121_source_default_v1 import query as full121_query
          p,index,sha,add=rollback_view('.')
          assert p['game_count']==92 and len(index['games'])==92 and len(add['games'])==36
          old,roll,view=indexes('.')
          assert len(old['games'])==88 and len(roll['games'])==92 and len(view['games'])==36
          led,ledsha,additive=original_release('.')
          assert ledsha==sha and len(additive['games'])==36
          for gid in ('0022600156','0022600157'):
              out=old_query('.',game_id=gid,kind='shots',offset=0,limit=1)
              assert out['engine_id']=='IGP_FULL92_V1_SOURCE_GRADED_NATURAL_SINGLE_20261103'
              assert len(out['rows'])==1
          summary=full121_query('.')
          assert summary['indexed_games']==121 and summary['default_database']=='FULL121'
          print("FULL92_ROLLBACK_SOURCE_SHA_AND_QUERY_VALID",len(index['games']),
