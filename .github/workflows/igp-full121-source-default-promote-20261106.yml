          python3 gamepulse/fusion/igp_full121_nov04_ball_two_sided_source_mask_v1.py --root . --out "$twosided_path"
          paired_path="gamepulse/fusion/qa/igp_progress_20261030/full121_nov04_ball_actual_C0B_vs_twosided_paired_20261106.json"
