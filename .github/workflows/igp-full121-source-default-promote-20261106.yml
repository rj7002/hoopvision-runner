      - name: Prevent original NBA coordinate leakage
        run: python3 tools/public_content_guard.py
      - name: Read Full92 original immutable source, SHA-revised older Blueprint and real default
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
