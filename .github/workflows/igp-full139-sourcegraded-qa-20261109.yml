name: IGP Full139 source-graded shot QA and immutable Full121 query regression
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full139-sourcegraded-qa-20261109.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-full139-sourcegraded-qa-20261109
  cancel-in-progress: false
jobs:
  verify-private-source-graded-queries:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify public/private source isolation
        run: python3 tools/public_content_guard.py
      - name: Read immutable Full121 and latest Full139 QA sources inside private GitHub clone
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse \
            -b research/gamepulse-clock-boundary-integrity-20261025 \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          git sparse-checkout set --no-cone \
            /gamepulse/fusion/igp_full121_shot_default_v1.py \
            /gamepulse/fusion/qa/igp_progress_20261030/igp_full121_default_source_release_v1.json \
            /gamepulse/fusion/qa/igp_progress_20261030/igp_full121_default_shot_release_v1.json \
            /gamepulse/fusion/qa/igp_fullx/shot_event_multiview_FULL121_10062426c559_v2.json \
            /gamepulse/fusion/qa/igp_fullx/shot_event_multiview_fullx_v2_latest.json \
            /gamepulse/fusion/qa/igp_fullx/shot_event_multiview_FULL139_\* \
            /gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/post56_additive_20261028/index.json \
            /gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/shot_event_multiview_fullx_v2/FULL121_10062426c559/shots/0022600173.jsonl.gz \
            /gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/shot_event_multiview_fullx_v2/FULL139_\*/shots/0022600189.jsonl.gz
          PYTHONPATH=gamepulse/fusion python3 - <<'PY'
          import gzip,hashlib,json
          from pathlib import Path
          from igp_full121_shot_default_v1 import shot
          base=Path('gamepulse/fusion')
          summary=shot('.')
          assert summary['indexed_games']==121
          assert summary['official_fga']==21331
          gid='0022600173'
          g=shot('.',game_id=gid)
          assert g['official_fga']==169
          p=base/'materialized/igp_2026_27_unified_season_v3/shot_event_multiview_fullx_v2/FULL121_10062426c559/shots/0022600173.jsonl.gz'
          aid=json.loads(gzip.decompress(p.read_bytes()).splitlines()[0])['official_action_number']
          actual=shot('.',game_id=gid,action_number=aid)
          assert actual['official_FGA_present'] and actual['official_action_number']==aid
          assert actual['default_shot_database']=='FULL121'
          print('FULL121_IMMUTABLE_SHOT_QUERY_PASSED',summary['indexed_games'],summary['official_fga'])
          pointer=json.loads((base/'qa/igp_fullx/shot_event_multiview_fullx_v2_latest.json').read_bytes())
          assert pointer['game_count']==139, 'FULL139_ROLLING_SHOT_INDEX_NOT_YET_RELEASED'
          indexfile=Path(pointer['index_path'])
          raw=indexfile.read_bytes()
          assert hashlib.sha256(raw).hexdigest()==pointer['index_sha256']
          index=json.loads(raw)
          assert index['game_count']==139 and len(index['games'])==139
          q=index['games']['0022600189']
          assert q['counts']['official_fga']==188
          assert q['counts']['blueprint_exact']==0
          assert q['source_sha256']['NBA_BLUEPRINT'] is None
          assert not q['original_native_source_present']
          shotfile=Path(q['shots_path'])
          payload=shotfile.read_bytes()
          assert hashlib.sha256(payload).hexdigest()==q['shot_sha256']
          shots=[json.loads(l) for l in gzip.decompress(payload).splitlines() if l]
          assert len(shots)==188
          assert all(x.get('blueprint_original_shot') is None and
                     x.get('blueprint_published_xfg') is None for x in shots)
          print('FULL139_GRADED_SHOT_SOURCE_PASSED',index['game_count'],
                index['counts']['official_fga'],
                'missing_game_0189_xfg_explicit_null')
          PY
          echo IGP_FULL139_AND_FULL121_REGRESSION_ACCEPTED
