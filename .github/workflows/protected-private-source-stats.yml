name: Protected private source statistics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/protected-private-source-stats.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: protected-private-source-statistics
  cancel-in-progress: false
jobs:
  private-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public boundary
        run: python3 tools/public_content_guard.py
      - name: Execute pinned private source task with private diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess,sys
          repo="timeedmonds-maker/104"
          def get(path,ref):
              d=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/contents/{path}?ref={ref}"],stderr=subprocess.DEVNULL))
              if d.get("content"):return base64.b64decode(d["content"])
              b=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/git/blobs/{d['sha']}"],stderr=subprocess.DEVNULL))
              return base64.b64decode(b["content"])
          pin=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/commits/main"],stderr=subprocess.DEVNULL))["sha"]
          task=json.loads(get("analysis_execution/current_touch_stats_task.json",pin))
          assert task["action_class"]=="RESEARCH" and task["gpu"] is False and task["gcp"] is False
          assert len(task["source_sha"])==40 and task["script"].startswith("gamepulse/fusion/analysis/")
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"private-statistics"
          root.mkdir()
          script=root/"task.py";script.write_bytes(get(task["script"],task["source_sha"]))
          proc=subprocess.run([sys.executable,str(script)],cwd=root,capture_output=True,text=True,env={**os.environ,"PRIVATE_TASK_SOURCE_SHA":task["source_sha"]})
          if proc.returncode:
              body={"branch":task["ref"],"message":"qa(private): protected source task diagnostic [skip ci]",
                    "content":base64.b64encode(json.dumps({"returncode":proc.returncode,"stderr":proc.stderr[-12000:],"stdout":proc.stdout[-1500:],"source_sha":task["source_sha"]}).encode()).decode()}
              path="gamepulse/fusion/qa/r13_touch_stats_hou_bos_20261104/private_job_diagnostic.json"
              endpoint=f"repos/{repo}/contents/{path}"
              old=subprocess.run(["gh","api",endpoint+"?ref="+task["ref"]],capture_output=True,text=True)
              if old.returncode==0:body["sha"]=json.loads(old.stdout)["sha"]
              subprocess.run(["gh","api","-X","PUT",endpoint,"--input","-"],input=json.dumps(body),capture_output=True,text=True)
              print("PRIVATE_SOURCE_TASK_REQUIRES_REVIEW")
              sys.exit(1)
          print("PRIVATE_SOURCE_TASK_COMPLETE")
          PY

# Replay the pinned private task; retain all details privately.
