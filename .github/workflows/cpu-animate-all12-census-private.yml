name: CPU Animate independent all-12 source video CPU census

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cpu-animate-all12-census-private.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-animate-all12-census-private
  cancel-in-progress: false

jobs:
  rehash-and-decode-all-original-views:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      CUDA_VISIBLE_DEVICES: '-1'
      NVIDIA_VISIBLE_DEVICES: 'none'
      OPENCV_OPENCL_RUNTIME: disabled
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reject public source leaks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from tools.public_content_guard import scan
          assert not scan(['.github/workflows/cpu-animate-all12-census-private.yml'])
          print('CPU_ANIMATE_ALL12_CENSUS_PRIVATE_BOUNDARY_VERIFIED')
          PY

      - name: Check source-private CPU environment and run all12 exact-source verification
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo PRIVATE_AUTH_UNAVAILABLE; exit 3; }
          if ! gh api repos/timeedmonds-maker/104 --jq .private | grep -qx true; then
            echo SOURCE_REPO_NOT_PRIVATE; exit 3
          fi
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          python3 -m pip install -q --disable-pip-version-check numpy opencv-python-headless
          ROOT="$(mktemp -d)"
          chmod 700 "$ROOT"
          trap 'rm -rf "$ROOT"' EXIT
          mkdir -p "$ROOT/cpu_animate" "$ROOT/tests"
          REF='cpu-animate%2Fm0-m1-validation-core-20261107'
          for file in camera_feed_taxonomy.py multi_angle_source_census_cpu.py; do
            gh api "repos/timeedmonds-maker/104/contents/cpu_animate/$file?ref=$REF" --jq .content | base64 -d > "$ROOT/cpu_animate/$file"
          done
          gh api "repos/timeedmonds-maker/104/contents/tests/test_cpu_animate_source_census.py?ref=$REF" --jq .content | base64 -d > "$ROOT/tests/test_cpu_animate_source_census.py"
          (
            cd "$ROOT"
            python3 -m unittest discover -s tests -p 'test_cpu_animate_source_census.py' -v
            python3 -m cpu_animate.multi_angle_source_census_cpu
          )
          echo CPU_ANIMATE_PRIVATE_ALL12_CENSUS_END_TO_END_PASSED

      - name: Report security boundary
        if: always()
        run: |
          echo 'No NBA footage, private tracking, source signed HLS URLs or position arrays published.'
          echo 'Actual frame decoding was FFmpeg CPU software only.'
          echo 'Distinct media SHA does not prove distinct physical camera centres or frame synchronisation.'
