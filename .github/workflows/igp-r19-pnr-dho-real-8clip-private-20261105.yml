name: R19 real NBA 10Hz PNR versus DHO action-first eight-case validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-r19-pnr-dho-real-8clip-private-20261105.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  nba-real-pnr-dho:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: analysis/igp-r19-native-temporal-20261104
      PIN: e5cf205a23f47bceb120f0e89ee42decf87e1b78
      SRC: gamepulse/fusion/qa/analysis/igp_r19_pnr_halfcourt_real_xy_review_20261105
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Prevent private NBA XYZ exposure
        run: python3 tools/public_content_guard.py
      - name: Reconcile original 8 NBA 10Hz clips and score PNR versus DHO
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          git sparse-checkout set gamepulse/fusion/analysis "$SRC"
          git fetch -q --depth=1 origin "$PIN"
          git checkout -q --detach "$PIN"
          test "$(git rev-parse HEAD)" = "$PIN"
          export PYTHONPATH=gamepulse/fusion/analysis
          python3 -B -m unittest -q test_igp_r19_pnr_dho_screen_sequence_v1 2> "$RUNNER_TEMP/tests_private.log" || {
            echo PNR_DHO_SOURCE_FREE_TEST_FAILED_REDACTED
            exit 1
          }
          if python3 -B gamepulse/fusion/analysis/igp_r19_pnr_real_8clip_validation_v1.py --root . --out "$RUNNER_TEMP/output.json" > "$RUNNER_TEMP/qa-private.log" 2> "$RUNNER_TEMP/error_private.log"; then
            python3 - <<'PY'
          import pathlib,json,os
          p=pathlib.Path(os.environ["RUNNER_TEMP"])
          d=json.loads((p/"output.json").read_bytes())
          assert d["aggregate"]["source_review_cases"]==8
          assert d["aggregate"]["frames"]==408
          assert d["aggregate"]["source_complete_ten_plus_ball"]==375
          assert d["video_truth_not_present"] is True
          assert d["no_production_promotion"] is True
          print("R19_PNR_DHO_ACTUAL_10HZ_NBA_PRIVATE_REPLAY_PASS",d["aggregate"])
          PY
          else
            python3 - <<'PY'
          import pathlib,json,os
          p=pathlib.Path(os.environ["RUNNER_TEMP"])
          (p/"output.json").write_text(json.dumps({
            "status":"R19_8CLIP_SOURCE_ACTUAL_10HZ_FAILURE",
            "private_traceback":(p/"error_private.log").read_text()[-18000:]})+"\n")
          PY
            echo PNR_DHO_QA_FAILURE_RECORDED_PRIVATELY
            FAILED=1
          fi
          git fetch -q origin "$PRIVATE_BRANCH"
          git checkout -q -B qa-private "origin/$PRIVATE_BRANCH"
          cp "$RUNNER_TEMP/output.json" "$SRC/real_eight_clip_PNR_vs_DHO_action_model_v1.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$SRC/real_eight_clip_PNR_vs_DHO_action_model_v1.json"
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -q -m 'qa(private): R19 genuine 10Hz PNR vs DHO 8-case source replay [skip ci]'
            saved=0
            for k in 1 2 3 4 5; do
              git fetch -q origin "$PRIVATE_BRANCH"
              git rebase -q "origin/$PRIVATE_BRANCH"
              if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then saved=1;break;fi
              sleep "$k"
            done
            test "$saved" = 1
          fi
          test "${FAILED:-0}" = 0
