# Reviewed original-NBA-source-only identity QA; never expose source XYZ or per-event details.
name: Full107 V3 four-game late26 official-ten PNR research pilot
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gamepulse-full107-pnr-v3-lineup-pilot-20261104.yml
      - tools/public_content_guard.py
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: full107-pnr-v3-lineup-pilot-20261104
  cancel-in-progress: true
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PIN: 1b2db7b7b2ad5b5ad5e756ede13c6aad9960c5f0
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 tools/public_content_guard.py
      - name: Verify pinned private source and V2 source-free tests
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone --quiet --filter=blob:none --depth=1 --sparse -b research/full107-pick-pair-detector-20261104 \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PIN"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PIN"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion/analysis
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PIN"
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion/analysis
          python3 -B -m unittest -q \
            gamepulse/fusion/analysis/test_igp_full107_pnr_detector_v1.py \
            gamepulse/fusion/analysis/test_igp_full107_pnr_detector_v2.py \
            gamepulse/fusion/analysis/test_igp_full107_pnr_outcomes_v2.py
          python3 -B -m py_compile \
            gamepulse/fusion/analysis/igp_full107_pnr_late26_official_lineup_pilot_v3.py
          echo FULL107_V3_LINEUP_SHADOW_SOURCE_FREE_CONTROLS_PASS
  source-pilot:
    needs: [controls]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        game: ['0022600147','0022600158','0022600165','0022600170']
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PIN: 1b2db7b7b2ad5b5ad5e756ede13c6aad9960c5f0
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: research/full107-pick-pair-detector-20261104
      DEST: gamepulse/fusion/qa/analysis/full107_pnr_v3_lineup_pilot_20261104
      GAME: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 tools/public_content_guard.py
      - name: Re-run identical original XYZ with official NBA ten and no-window controls
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone --quiet --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PIN"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PIN"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PIN"
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion/analysis:gamepulse/fusion
          python3 -B gamepulse/fusion/analysis/igp_full107_pnr_late26_official_lineup_pilot_v3.py \
            --root . --game "$GAME" --out "$RUNNER_TEMP/pilot.json" \
            > "$RUNNER_TEMP/PRIVATE_LOCAL_DONOTUPLOAD.log"
          python3 - <<'PY'
          import json,os,pathlib
          gid=os.environ['GAME'];r=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'pilot.json').read_bytes())
          assert set(r)=={gid}
          x=r[gid]
          assert x['original_timestamps']>1000
          assert x['source_XYZ_modified'] is False and x['publication_approved'] is False
          assert x['old_touch_count']>0 and x['original_sha256']
          print('PRIVATE_V3_LINEUP_NATIVE_SOURCE_PAIRED',gid,
                'windows',x['strict_official_ten_windows'],
                'v2_old',x['old_v2_candidates'],'v2_new',x['with_official_windows_v2_candidates'])
          PY
      - name: Preserve full diagnostic privately only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,base64,subprocess,time,pathlib
          path=f"repos/{os.environ['PRIVATE_REPO']}/contents/{os.environ['DEST']}/game_{os.environ['GAME']}.json"
          body={'branch':os.environ['PRIVATE_BRANCH'],'message':'qa(private): Full107 original-ten PNR pilot '+os.environ['GAME']+' [skip ci]',
                'content':base64.b64encode(pathlib.Path(os.environ['RUNNER_TEMP'],'pilot.json').read_bytes()).decode()}
          for i in range(18):
              old=subprocess.run(['gh','api',path+'?ref='+os.environ['PRIVATE_BRANCH']],capture_output=True,text=True)
              data=dict(body)
              if old.returncode==0:data['sha']=json.loads(old.stdout)['sha']
              ans=subprocess.run(['gh','api','-X','PUT',path,'--input','-'],input=json.dumps(data),capture_output=True,text=True)
              if ans.returncode==0:
                  print('PRIVATE_LINEUP_SHADOW_PERSISTED',os.environ['GAME'])
                  break
              time.sleep(2+i)
          else:raise RuntimeError('PRIVATE_V3_PILOT_PERSIST_FAILED')
          PY
  reduce:
    needs: [controls, source-pilot]
    if: success()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/full107-pick-pair-detector-20261104
      PRIVATE_REPO: timeedmonds-maker/104
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 tools/public_content_guard.py
      - name: Exact four-game source and identity context QA, no promotion
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone --quiet --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set \
            gamepulse/fusion/qa/analysis/full107_pnr_v3_lineup_pilot_20261104
          cd "$RUNNER_TEMP/private"
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('gamepulse/fusion/qa/analysis/full107_pnr_v3_lineup_pilot_20261104')
          ids=['0022600147','0022600158','0022600165','0022600170']
          rows={k:json.loads((root/f'game_{k}.json').read_bytes())[k] for k in ids}
          assert len({v['original_sha256'] for v in rows.values()})==4
          assert all(not x['source_XYZ_modified'] and not x['publication_approved'] for x in rows.values())
          print('FULL107_V3_SOURCE_GRADED_LATE26_PAIRED_FOUR','games',4,
                'official_windows',sum(x['strict_official_ten_windows'] for x in rows.values()),
                'frames_covered',sum(x['strict_window_native_frames'] for x in rows.values()),
                'v2_control',sum(x['old_v2_candidates'] for x in rows.values()),
                'v3_windows',sum(x['with_official_windows_v2_candidates'] for x in rows.values()),
                'independent_video_accuracy','UNKNOWN')
          PY
