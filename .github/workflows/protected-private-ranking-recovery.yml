name: Protected private ranking recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/protected-private-ranking-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-ranking-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify authenticated private boundary
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Reduce existing private shards with private-only diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,sys,time
          repo="timeedmonds-maker/104"
          def api_get(path):
              raw=subprocess.check_output(["gh","api",f"repos/{repo}/contents/{path}","--jq",".content"],
                                          stderr=subprocess.DEVNULL)
              return base64.b64decode(raw)
          def request(payload,path,branch):
              target=f"repos/{repo}/contents/{path}"
              for attempt in range(7):
                  older=subprocess.run(["gh","api",target+"?ref="+branch],
                                       capture_output=True,text=True)
                  data={"branch":branch,"message":"qa(private): protected aggregate diagnostic",
                        "content":base64.b64encode(json.dumps(payload).encode()).decode()}
                  if older.returncode==0:
                      data["sha"]=json.loads(older.stdout)["sha"]
                  r=subprocess.run(["gh","api","-X","PUT",target,"--input","-"],
                                   input=json.dumps(data),capture_output=True,text=True)
                  if r.returncode==0:return
                  time.sleep(1+attempt)
              raise RuntimeError("PRIVATE_WRITE_FAILED")
          head=subprocess.check_output(["gh","api",f"repos/{repo}/commits/main","--jq",".sha"],
                                       text=True).strip()
          task=json.loads(base64.b64decode(subprocess.check_output(
              ["gh","api",f"repos/{repo}/contents/analysis_execution/current_igp_task.json?ref={head}",
               "--jq",".content"],stderr=subprocess.DEVNULL)))
          branch=task["ref"];outdir=task["out_dir"];src=task["source_sha"]
          assert branch.startswith("analysis/") and outdir.startswith("gamepulse/fusion/qa/analysis/")
          assert task["shards"]==9 and len(src)==40
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"private-ranking-source"
          subprocess.run(["gh","auth","setup-git"],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          subprocess.run(["git","clone","-q","--depth=1","--filter=blob:none","--sparse",
                          "-b",branch,f"https://github.com/{repo}.git",str(root)],
                         check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          subprocess.run(["git","-C",str(root),"sparse-checkout","set",outdir],
                         check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          d=root/outdir
          for i in range(9):
              assert (d/f"shard_{i}.json").is_file()
          # Fetch the reducer from the immutable private source commit.
          reducer=pathlib.Path(os.environ["RUNNER_TEMP"])/"reduce.py"
          raw=subprocess.check_output(["gh","api",
              f"repos/{repo}/contents/{task['reduce_script']}?ref={src}","--jq",".content"],
              stderr=subprocess.DEVNULL)
          reducer.write_bytes(base64.b64decode(raw))
          loc=pathlib.Path(os.environ["RUNNER_TEMP"])
          paths={k:loc/k for k in ("top20.json","all_league_players.json",
                                   "all_league_players.csv","all_player_team_splits.csv")}
          p=subprocess.run([sys.executable,str(reducer),"--dir",str(d),
                            "--out",str(paths["top20.json"]),
                            "--league-json",str(paths["all_league_players.json"]),
                            "--league-csv",str(paths["all_league_players.csv"]),
                            "--team-csv",str(paths["all_player_team_splits.csv"])],
                           capture_output=True,text=True)
          if p.returncode:
              request({"state":"PRIVATE_RANKING_REDUCER_FAILED",
                       "returncode":p.returncode,"stderr_private":p.stderr[-12000:],
                       "stdout_private":p.stdout[-4000:],"source_sha":src},
                      outdir+"/ranking_reducer_diagnostic.json",branch)
              print("PRIVATE_RANKING_REDUCER_FAILED_DIAGNOSTIC_SAVED")
              sys.exit(1)
          data=json.loads(paths["all_league_players.json"].read_bytes())
          assert data["games_processed"]==81 and data["original_source_modified"] is False
          assert data["analysis_code_sha256"]==json.loads((d/"shard_0.json").read_text())["code_sha256"]
          compact={k:data.get(k) for k in ("games_processed","profile_totals",
                    "prior_review_development_metrics","credibility_status",
                    "original_source_modified","analysis_code_sha256")}
          compact["private_league_json_sha256"]=hashlib.sha256(paths["all_league_players.json"].read_bytes()).hexdigest()
          compact["source_games"]=len(data["per_game_sources"])
          request(compact,outdir+"/compact_verified.json",branch)
          print("PRIVATE_RANKING_COMPACT_VERIFIED")
          PY
