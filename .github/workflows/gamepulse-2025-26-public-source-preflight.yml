name: IGP 2025-26 public archive network preflight
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-2025-26-public-source-preflight.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  public-archive-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 tools/public_content_guard.py
      - name: Verify official public archive URL, size and signature
        shell: bash
        run: |
          set -euo pipefail
          url='https://downloads.neilball.org/NBA-2025-26-Available-Tracking.zip'
          curl --silent --show-error --location --head --retry 2 --connect-timeout 15 --max-time 90 \
              --proto '=https' --proto-redir '=https' "$url" > "$RUNNER_TEMP/source-head"
          python3 - <<'PY'
          from pathlib import Path
          import os
          for line in (Path(os.environ['RUNNER_TEMP'])/'source-head').read_text(errors='replace').splitlines():
              if line.lower().startswith(('http/','content-length:','content-type:','accept-ranges:','last-modified:','etag:')):
                  print('SOURCE_RESPONSE',line[:250])
          PY
          curl --fail --silent --show-error --location --retry 2 --max-time 90 --max-filesize 1048576 \
              --proto '=https' --proto-redir '=https' --range 0-15 \
              --output "$RUNNER_TEMP/archive-header" "$url"
          hex=$(head -c 4 "$RUNNER_TEMP/archive-header" | od -An -tx1 | tr -d ' \n')
          test "$hex" = '504b0304'
          echo "IGP_2025_26_SOURCE_VALID_ZIP_SIGNATURE"
