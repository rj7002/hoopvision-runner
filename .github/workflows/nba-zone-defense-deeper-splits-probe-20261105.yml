name: NBA zone official splits and season-depth boundary probe
'on':
  push:
    branches: [research/inside-game-zone-api-discovery-20261105]
    paths: ['.github/workflows/nba-zone-defense-deeper-splits-probe-20261105.yml']
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Test public zone endpoint for game/date/team and playoffs/cup splitting
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.parse,urllib.request,urllib.error,hashlib,concurrent.futures
          base={"LeagueID":"00","Season":"2026-27","SeasonType":"Regular Season","type":"defense"}
          cases=[
            ("baseline",{}),
            ("gameid",{"GameID":"0022600009"}),
            ("teamid",{"TeamID":"1610612745"}),
            ("lastngames",{"LastNGames":"1"}),
            ("datewindow",{"DateFrom":"10/20/2026","DateTo":"10/22/2026"}),
            ("period",{"Period":"1"}),
            ("opponent",{"OpponentTeamID":"1610612759"}),
            ("month",{"Month":"1"}),
            ("playoffs_defense",{"Season":"2025-26","SeasonType":"Playoffs","type":"defense"}),
            ("playoffs_offense",{"Season":"2025-26","SeasonType":"Playoffs","type":"offense"}),
            ("ist_defense",{"Season":"2025-26","SeasonType":"IST","type":"defense"}),
            ("ist_offense",{"Season":"2025-26","SeasonType":"IST","type":"offense"})
          ]
          def run(item):
            label,extra=item;params=dict(base,**extra)
            url='https://stats.gleague.nba.com/stats/zonedefenseteamleaders?'+urllib.parse.urlencode(params)
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36","Accept":"application/json","Origin":"https://www.nba.com","Referer":"https://www.nba.com/"})
            try:
              with urllib.request.urlopen(req,timeout=20) as resp:
                raw=resp.read(5000000); status=resp.status
              d=json.loads(raw);rows=d.get("teamZoneDefense")
              if not isinstance(rows,list):return {"test":label,"status":status,"keys":list(d)[:10],"not_zone_json":True}
              def s(k):return sum(int(r.get(k) or 0) for r in rows)
              return {"test":label,"status":status,"season":d.get("seasonYear"),"seasonType":d.get("seasonType"),"side":d.get("typeGrouping"),"teams":len(rows),"total_POSS":s("POSS"),"total_POSS_ZONE":s("POSS_ZONE"),"total_POSS_ZONE_PTS":s("POSS_ZONE_PTS"),"json_sha256":hashlib.sha256(raw).hexdigest()}
            except Exception as e:return {"test":label,"error":type(e).__name__,"detail":str(e)[:80]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
            for out in pool.map(run,cases):print("ZONE_SPLIT_PROBE",json.dumps(out),flush=True)
          PY
