name: FULL88 Jabari vs Durant five-shot private similarity 20261101
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/igp-full88-jabari-durant-shotmatch-20261101.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-full88-shot-match:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: release/igp-full88-sourcegraded-default-20261101
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify opaque public-private boundary
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Rank verified private NBA shots without printing licensed rows
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          git sparse-checkout set --cone \
            gamepulse/fusion/qa/igp_fullx \
            gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/shot_event_multiview_full88_v1/shots
          python3 -m py_compile gamepulse/fusion/igp_full88_jabari_durant_top5_20261101.py
          python3 gamepulse/fusion/igp_full88_jabari_durant_top5_20261101.py --root .
          test -s gamepulse/fusion/qa/igp_fullx/jabari_durant_full88_top5_20261101.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_fullx/jabari_durant_full88_top5_20261101.json
          git diff --cached --check
          git diff --cached --quiet && { echo "FULL88_5PAIRS_ALREADY_PRESENT"; exit 0; }
          git commit -q -m "data(igp): immutable private FULL88 Jabari Durant five shot matches and clips IDs"
          for n in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH"
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo "FULL88_FIVE_MATCHES_PRIVATE_RESULT_COMMITTED"
              exit 0
            fi
            sleep "$n"
          done
          exit 22
