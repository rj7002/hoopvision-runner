name: Protected Full92 ball positional tail v10 independent source holdout
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full92-ball-tail-v10-private-20261103.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-nba-native-tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/full92-ball-control-persistence-shadow-20261103
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify opaque public bridge and private source pin
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse \
            -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          git -C "$RUNNER_TEMP/private" rev-parse HEAD
          test -f "$RUNNER_TEMP/private/gamepulse/fusion/igp_full92_ball_position_tail_guard_v10.py"
          test -f "$RUNNER_TEMP/private/gamepulse/fusion/tests/test_igp_full92_ball_position_tail_guard_v10.py"
          echo FULL92_TAIL_V10_EXACT_PRIVATE_SOURCE_PRESENT
      - name: Run independent source-free physics, tail and leak tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p 'test_igp_full92_ball_position_tail_guard_v10.py'
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p 'test_igp_full92_ball_position_tail_bracket_v9.py'
          echo FULL92_TAIL_SOURCE_FREE_PASS
      - name: Verify original release identity and exact dev/fresh separation
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          from igp_full92_all_event_rebound_tracking_v1 import original_release
          from igp_full92_ball_position_tail_guard_v10 import TRAIN_GAMES,FRESH_GAMES
          d,sha,_=original_release(".")
          assert len(d["games"])==92 and len(TRAIN_GAMES)==6
          assert len(FRESH_GAMES)==18 and not set(TRAIN_GAMES)&set(FRESH_GAMES)
          print("FULL92_TAIL_FROZEN_92_SOURCE_SHA",sha)
          PY
      - name: Run same-original-target 24-game masked player-and-ball source QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_full92_ball_position_tail_guard_v10.py \
            --root . --out gamepulse/fusion/qa/igp_fullx/full92_ball_position_tail_guard_v10_20261103.json \
            > "$RUNNER_TEMP/private-v10-result.log" 2>&1 || {
              echo FULL92_V10_PRIVATE_SOURCE_EVALUATION_FAILED
              python3 - <<'PY'
          import os,re
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"private-v10-result.log"
          xs=p.read_text(errors="replace").splitlines() if p.exists() else []
          err=next((x for x in reversed(xs) if re.match(
                r"^(?:ValueError|AssertionError|TypeError|KeyError|FileNotFoundError|IndexError):",x)),None)
          if err:
              ty,_,tail=err.partition(":")
              code=tail.strip().split(" ",1)[0]
              print(ty,code if re.fullmatch(r"[A-Z0-9_]{5,100}",code) else "REDACTED")
          else:print("PRIVATE_SOURCE_ERROR_REDACTED")
          PY
              exit 42
            }
      - name: Check frozen holdout and print only aggregate decision
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("gamepulse/fusion/qa/igp_fullx/full92_ball_position_tail_guard_v10_20261103.json")
          q=json.loads(p.read_bytes())
          assert q["source_ball_and_player_at_hidden_target_never_used"]
          assert q["original_NBA_sources_unchanged"]
          assert q["accepted_complete_scene_increment"]==0
          assert len(q["development_game_ids"])==6
          assert len(q["fresh_game_ids"])==18
          base=q["fresh_unseen"]["by_policy"]["causal"]
          chosen=q["fresh_unseen"]["by_policy"][q["dev_only_frozen_policy"]]
          assert base["n"]==chosen["n"]
          print("IGP_FULL92_BALL_V10_ORIGINAL_SOURCE_GRADED_RESULT",
            json.dumps({"policy":q["dev_only_frozen_policy"],
              "dev_points":q["train"]["by_policy"]["causal"]["n"],
              "fresh_points":base["n"],"fresh_baseline":base,
              "fresh_candidate":chosen,"strict_tail_nonregression":q["fresh_strict_tail_pass"],
              "accepted_scene_delta":0},sort_keys=True))
          PY
      - name: Verify fixed 20-game out-of-sample 3mm equivalence safety rule
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -s gamepulse/fusion/tests -p 'test_igp_full92_ball_position_tail_new20_v11.py' -v
          python3 gamepulse/fusion/igp_full92_ball_position_tail_new20_v11.py \
            --root . --out gamepulse/fusion/qa/igp_fullx/full92_ball_position_tail_new20_v11_20261103.json \
            >"$RUNNER_TEMP/source-v11-results.log" 2>&1 || {
              echo SOURCE_GRADED_NEW20_PRIVATE_VALIDATION_FAILED
              exit 46
            }
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('gamepulse/fusion/qa/igp_fullx/full92_ball_position_tail_new20_v11_20261103.json').read_bytes())
          assert len(d['new_games'])==20 and d['no_training_or_weight_tuning_on_this_new20']
          assert d['source_masked_original_ball_and_player_at_target']
          assert d['original_NBA_tracking_and_PBP_unchanged']
          assert d['accepted_scene_increase']==0
          a=d['same_original_target_metrics']['by_policy']
          assert a['causal']['n']==a[d['frozen_policy']]['n']
          print('IGP_FULL92_BALL_NEW20_PREDECLARED_TAIL_SOURCE',json.dumps({
            'n':a['causal']['n'],
            'baseline':a['causal'],
            'candidate':a[d['frozen_policy']],
            'game_cluster_mean_improvement_ft':d['paired_game_cluster_bootstrap'],
            'strict_max_gate_pass':d['strict_zero_max_nonregression'],
            'predeclared_3mm_max_gate_pass':d['practical_3mm_max_nonregression'],
            'source_only_accepted':d['source_masked_promotable_given_preregistered_equivalence'],
            'scene_count_promoted':0},sort_keys=True))
          PY
      - name: Prove accepted v11 actual missing native ball and original-first rollback
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p 'test_igp_full92_ball_position_source_accepted_v11.py'
          echo FULL92_V11_ORIGINAL_SOURCE_TAIL_READER_PASS
      - name: Save SHA-backed original-source QA privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_fullx/full92_ball_position_tail_guard_v10_20261103.json gamepulse/fusion/qa/igp_fullx/full92_ball_position_tail_new20_v11_20261103.json
          git diff --cached --check
          if git diff --cached --quiet; then echo V10_SOURCE_QA_ALREADY_PRIVATE; exit 0; fi
          git commit -qm 'qa(igp): source-safe Full92 original ball-tail 18-game independent confirmation'
          gh auth setup-git
          for n in 1 2 3 4; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || exit 44
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo FULL92_TAIL_V10_ORIGINAL_SOURCE_QA_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$n"
          done
          exit 45
