# GitHub's cron is unreliable (this fork's */5 schedule fired once in the 8 hours after it was enabled), so this job
# starts the capture workflow itself, but only around game times: every 2 minutes from 15 minutes before each tip-off
# to 10 minutes after, every 20 minutes while a game is on (restarts a runner that died), and not at all otherwise.
# If it cannot read the NBA schedule it falls back to every 5 minutes. See .github/keeper.sh.
# Before its 6-hour job limit it starts a fresh keeper, which waits in the concurrency queue until this one ends.
# The 15-minute cron below only restarts the chain if it ever dies; an extra keeper just waits its turn.
name: Keeper (starts the live capture workflow around game times)
on:
  workflow_dispatch:
    inputs:
      plan_only:
        description: 'Print the schedule the keeper sees and its dispatch plan, then stop (testing)'
        type: boolean
        default: false
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  actions: write
  contents: read
concurrency:
  group: ${{ inputs.plan_only && 'keeper-plan' || 'keeper' }}
  cancel-in-progress: false
jobs:
  keep:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Start the capture workflow around game times
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEPER_PLAN_ONLY: ${{ inputs.plan_only && '1' || '' }}
        run: bash .github/keeper.sh
