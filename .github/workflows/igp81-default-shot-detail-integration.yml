# Source-free opaque public runner. Original NBA licensed data stays private.
name: IGP81 default engine all-game detailed shot integration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp81-default-shot-detail-integration.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp81-default-shot-detail-private-release
  cancel-in-progress: false
jobs:
  integrate-and-certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      TARGET_BRANCH: release/igp32-p2b-nba81-unified-default-20261101
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Security QA on public source-free code
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          python3 -m py_compile tools/licensed_feed/igp81_default_shot_detail_query.py tools/licensed_feed/igp81_wire_default_shots.py tools/licensed_feed/igp81_test_default_shot_route.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Checkout original 81-game private SHA source
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --depth=1 --sparse -b "$TARGET_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set --no-cone 'gamepulse/fusion/*.py' gamepulse/fusion/qa/igp_v32/igp81_unified_native_possession_tracking_registry_run_41231284682.json gamepulse/fusion/qa/igp_v32/igp81_official_pbp_blueprint_semantic_reconciliation_v1.json gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/shot_biomechanics_all81_v1 gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/shot_biomechanics_all56_v2
          test -f "$RUNNER_TEMP/private/gamepulse/fusion/igp81_default_engine_v1.py"
          test -f "$RUNNER_TEMP/private/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/shot_biomechanics_all81_v1/index.json"
      - name: Wire 81-game source grade FGA detail query
        shell: bash
        run: |
          set -euo pipefail
          cp tools/licensed_feed/igp81_default_shot_detail_query.py "$RUNNER_TEMP/private/gamepulse/fusion/query_igp81_full_shot_detail_v1.py"
          python3 tools/licensed_feed/igp81_wire_default_shots.py --root "$RUNNER_TEMP/private"
          python3 -m py_compile "$RUNNER_TEMP/private/gamepulse/fusion/igp81_default_engine_v1.py" "$RUNNER_TEMP/private/gamepulse/fusion/query_igp81_full_shot_detail_v1.py"
      - name: Validate 81 immutable original FGA ledgers and default query route
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH="$PWD/gamepulse/fusion"
          python3 gamepulse/fusion/query_igp81_full_shot_detail_v1.py --root . --audit > "$RUNNER_TEMP/igp81-original-private-audit.log"
          tail -n 1 "$RUNNER_TEMP/igp81-original-private-audit.log"
          python3 "$GITHUB_WORKSPACE/tools/licensed_feed/igp81_test_default_shot_route.py"
          echo IGP81_ALL81_SHOT_SOURCE_GRADE_AND_DEFAULT_ROUTE_TESTS_PASS
      - name: Commit only accepted additive code and QA privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f gamepulse/fusion/igp81_default_engine_v1.py gamepulse/fusion/query_igp81_full_shot_detail_v1.py gamepulse/fusion/qa/igp_v32/igp81_shot_detail_default_route_81game_qa_v1.json
          git diff --cached --check
          if git diff --cached --quiet; then echo IGP81_SHOT_ROUTE_ALREADY_RELEASED; exit 0; fi
          git commit -q -m 'feat(igp81): default release now queries all81 source-graded biomechanics and Blueprint'
          for n in $(seq 1 12); do
            git fetch -q origin "$TARGET_BRANCH"
            git rebase -q "origin/$TARGET_BRANCH"
            if git push -q origin "HEAD:refs/heads/$TARGET_BRANCH"; then
              echo IGP81_DEFAULT81_FULL_SHOT_SOURCE_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 29
