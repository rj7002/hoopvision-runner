name: IGP Full123 R13 private original-source season shards
on:
  push:
    branches: [feature/igp-full123-r13-public-cpu-20261107]
    paths: ['.github/workflows/igp-full123-r13-season-shards-private-20261107.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: igp-full123-r13-season-shards-20261107, cancel-in-progress: false}
jobs:
  source-shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0,1,2,3,4,5,6,7,8]
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: feature/igp-full123-r13-touch-integration-20261107
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public privacy guard and private authentication
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Load only the 123 original NBA game partitions selected for this shard
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/r13-full123"
          echo "PRIVATE_ROOT=$work" >> "$GITHUB_ENV"
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" "https://github.com/$PRIVATE_REPO.git" "$work"
          cd "$work"
          patterns=(
            '/gamepulse/fusion/*.py'
            '/gamepulse/fusion/analysis/*.py'
            '/gamepulse/fusion/qa/igp_progress_20261030/igp_full121_default_source_release_v1.json'
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/index.json'
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/post56_additive_20261028/index.json'
            '/gamepulse/fusion/materialized/igp_all_original_xyz/*/index.json'
          )
          git sparse-checkout set --no-cone "${patterns[@]}"
          SHARD="$SHARD" RUNNER_TEMP="$RUNNER_TEMP" python3 - <<'PY'
          import json,os
          from pathlib import Path
          base=Path("gamepulse/fusion/materialized/igp_2026_27_unified_season_v3")
          top=json.loads((base/"index.json").read_bytes())
          add=json.loads((base/"post56_additive_20261028/index.json").read_bytes())
          ids=sorted(set(top["per_game_model"])|set(add["games"])|{"0022600187","0022600188"})
          assert len(ids)==123
          selected=[x for i,x in enumerate(ids) if i%9==int(os.environ["SHARD"])]
          (Path(os.environ["RUNNER_TEMP"])/"r13-ids.txt").write_text("\n".join(selected)+"\n")
          PY
          mapfile -t selected < "$RUNNER_TEMP/r13-ids.txt"
          for gid in "${selected[@]}"; do
            patterns+=(
              "/gamepulse/fusion/materialized/igp_all_original_xyz/$gid/**"
              "/gamepulse/fusion/materialized/igp_all_original_xyz_0131_eight_part/$gid/**"
              "/gamepulse/fusion/qa/r13_full123_original_labels_20261107/$gid.*"
              "/gamepulse/fusion/official_pbp_timing/games/$gid.json"
              "/gamepulse/fusion/official_pbp_timing/original_nba_*/$gid/boxscore.json"
              "/gamepulse/fusion/qa/r13_full123_original_boxes_20261107/$gid.*"
              "/gamepulse/fusion/evidence/companion_sdk_original_$gid/sdk_observed_original.json"
            )
          done
          git sparse-checkout set --no-cone "${patterns[@]}"
      - name: Source-backed R13 v2 reconstruction and conservative unknown status
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          export PYTHONPATH="$PRIVATE_ROOT:$PRIVATE_ROOT/gamepulse/fusion:$PRIVATE_ROOT/gamepulse/fusion/analysis"
          python3 -m py_compile gamepulse/fusion/analysis/igp_full123_r13_batch_sourcefirst_v1.py
          python3 gamepulse/fusion/analysis/igp_full123_r13_batch_sourcefirst_v1.py \
            --root . --shard "$SHARD" --shards 9 \
            --output "$RUNNER_TEMP/r13-shard-$SHARD.json" \
            > "$RUNNER_TEMP/r13-shard-$SHARD.log" 2>&1
      - name: Persist exact original-source R13 results in authenticated private repo
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          PRIVATE_REPO="$PRIVATE_REPO" PRIVATE_BRANCH="$PRIVATE_BRANCH" SHARD="$SHARD" RUNNER_TEMP="$RUNNER_TEMP" python3 - <<'PY'
          import base64,hashlib,json,os,subprocess,time
          from pathlib import Path
          repo=os.environ["PRIVATE_REPO"]; branch=os.environ["PRIVATE_BRANCH"]; k=int(os.environ["SHARD"])
          report=json.loads((Path(os.environ["RUNNER_TEMP"])/f"r13-shard-{k}.json").read_bytes())
          assert report["schema"]=="igp.full123.r13-source-shard-execution.v1"
          assert report["exact_cohort_game_count"]==123 and report["original_source_modified"] is False
          assert len(report["per_game"])==report["processed_game_count"]
          out=Path("gamepulse/fusion/qa/r13_full123_touch_overlay_20261107")
          labs=Path("gamepulse/fusion/qa/r13_full123_original_labels_20261107")
          def save(path,blob):
              url=f"repos/{repo}/contents/{path}"
              target=hashlib.sha1(b"blob "+str(len(blob)).encode()+b"\x00"+blob).hexdigest()
              for n in range(15):
                  old=subprocess.run(["gh","api",url+"?ref="+branch],capture_output=True,text=True)
                  req={"branch":branch,"message":f"data(private): SHA-original Full123 R13 shard {k} [skip ci]",
                       "content":base64.b64encode(blob).decode()}
                  if old.returncode==0:
                      old_sha=json.loads(old.stdout).get("sha")
                      if old_sha==target:return
                      req["sha"]=old_sha
                  x=subprocess.run(["gh","api","-X","PUT",url,"--input","-"],
                                   input=json.dumps(req),capture_output=True,text=True)
                  if x.returncode==0:return
                  time.sleep(1+n//3)
              raise RuntimeError("PRIVATE_R13_RESULT_SAVE_FAILED")
          for rec in report["per_game"]:
              gid=rec["game_id"]
              for p in (labs/(gid+".json.gz"),labs/(gid+".receipt.json")):
                  if p.is_file():save(p,p.read_bytes())
              if rec["status"]=="R13_PASSED_SOURCE_GRADED":
                  p=out/(gid+".json")
                  blob=p.read_bytes()
                  assert hashlib.sha256(blob).hexdigest()==rec["result_sha256"]
                  save(p,blob)
          save(out/f"shard_{k}.json",(json.dumps(report,indent=2,sort_keys=True)+"\n").encode())
          print("FULL123_PRIVATE_R13_SHARD_PERSISTED",k,report["processed_game_count"],report["status_counts"]["R13_PASSED_SOURCE_GRADED"])
          PY
