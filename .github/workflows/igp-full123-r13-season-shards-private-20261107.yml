name: IGP Full123 R13 private original-source season shards
on:
  push:
    branches: [feature/igp-full123-r13-public-cpu-20261107]
    paths: ['.github/workflows/igp-full123-r13-season-shards-private-20261107.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: igp-full123-r13-season-shards-20261107-v2, cancel-in-progress: false}
jobs:
  source-shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0,1,2,3,4,5,6,7,8]
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: feature/igp-full123-r13-touch-integration-20261107
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public privacy guard and private authentication
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Load only the 123 original NBA game partitions selected for this shard
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/r13-full123"
          echo "PRIVATE_ROOT=$work" >> "$GITHUB_ENV"
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" "https://github.com/$PRIVATE_REPO.git" "$work"
          cd "$work"
          patterns=(
            '/gamepulse/fusion/*.py'
            '/gamepulse/fusion/analysis/*.py'
            '/gamepulse/fusion/qa/igp_progress_20261030/igp_full121_default_source_release_v1.json'
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/index.json'
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/post56_additive_20261028/index.json'
            '/gamepulse/fusion/materialized/igp_all_original_xyz/*/index.json'
          )
          git sparse-checkout set --no-cone "${patterns[@]}"
          SHARD="$SHARD" RUNNER_TEMP="$RUNNER_TEMP" python3 - <<'PY'
          import json,os
          from pathlib import Path
          base=Path("gamepulse/fusion/materialized/igp_2026_27_unified_season_v3")
          top=json.loads((base/"index.json").read_bytes())
          add=json.loads((base/"post56_additive_20261028/index.json").read_bytes())
          ids=sorted(set(top["per_game_model"])|set(add["games"])|{"0022600187","0022600188"})
          assert len(ids)==123
          selected=[x for i,x in enumerate(ids) if i%9==int(os.environ["SHARD"])]
          (Path(os.environ["RUNNER_TEMP"])/"r13-ids.txt").write_text("\n".join(selected)+"\n")
          PY
          mapfile -t selected < "$RUNNER_TEMP/r13-ids.txt"
          for gid in "${selected[@]}"; do
            patterns+=(
              "/gamepulse/fusion/materialized/igp_all_original_xyz/$gid/**"
              "/gamepulse/fusion/materialized/igp_all_original_xyz_0131_eight_part/$gid/**"
              "/gamepulse/fusion/qa/r13_full123_original_labels_20261107/$gid.*"
              "/gamepulse/fusion/official_pbp_timing/games/$gid.json"
              "/gamepulse/fusion/official_pbp_timing/original_nba_*/$gid/boxscore.json"
              "/gamepulse/fusion/qa/r13_full123_original_boxes_20261107/$gid.*"
              "/gamepulse/fusion/evidence/companion_sdk_original_$gid/sdk_observed_original.json"
            )
          done
          git sparse-checkout set --no-cone "${patterns[@]}"
      - name: Source-backed R13 v2 reconstruction and conservative unknown status
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          export PYTHONPATH="$PRIVATE_ROOT:$PRIVATE_ROOT/gamepulse/fusion:$PRIVATE_ROOT/gamepulse/fusion/analysis"
          python3 -m py_compile gamepulse/fusion/analysis/igp_full123_r13_batch_sourcefirst_v1.py
          python3 gamepulse/fusion/analysis/igp_full123_r13_batch_sourcefirst_v1.py \
            --root . --shard "$SHARD" --shards 9 \
            --output "$RUNNER_TEMP/r13-shard-$SHARD.json" \
            > "$RUNNER_TEMP/r13-shard-$SHARD.log" 2>&1
      - name: Persist exact original-source R13 results in authenticated private repo
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVATE_ROOT"
          # One private Git commit per shard is reproducible and avoids REST rate limits.
          out="gamepulse/fusion/qa/r13_full123_touch_overlay_20261107"
          labels="gamepulse/fusion/qa/r13_full123_original_labels_20261107"
          cp "$RUNNER_TEMP/r13-shard-$SHARD.json" "$out/shard_$SHARD.json"
          git sparse-checkout add "/$out/**" "/$labels/**"
          git add --sparse -f "$out" "$labels"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "PRIVATE_R13_SHARD_REUSED_UNCHANGED"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "data(private): source-graded Full123 R13 shard $SHARD [skip ci]"
          for attempt in $(seq 1 18); do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH"
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo "FULL123_PRIVATE_R13_SHARD_GIT_PERSISTED"
              exit 0
            fi
            sleep "$attempt"
          done
          exit 35

# Re-run after SHA-pinned legacy-format label correction in private 104.
