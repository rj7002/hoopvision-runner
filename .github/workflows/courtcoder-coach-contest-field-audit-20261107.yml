name: Coach original contest field audit (aggregate only)
on:
  push:
    branches: [main]
    paths: [.github/workflows/courtcoder-coach-contest-field-audit-20261107.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: coach-original-contest-field-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_SHA: 30b06ae04f866ae33b75204378c86e678d863183
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Audit SHA-verified original shot metadata privately
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          root="$RUNNER_TEMP/coach-original-contest"
          mkdir -p "$root/history"
          for pair in "courtcoder/coach/qa/audit_historical_release_contest_v1.py audit.py" "gamepulse/coach_event_proxy_release_20261107/source-event-pressure-qa.json source-qa.json"; do
            read -r source destination <<< "$pair"
            gh api "repos/$PRIVATE_REPO/contents/$source?ref=$PRIVATE_SHA" --jq .content | base64 -d > "$root/$destination"
            test -s "$root/$destination"
          done
          gh release download igp-2025-26-defender-xyz-proxy-20261105 --repo "$PRIVATE_REPO" \
            --dir "$root/history" --pattern 'defender-xyz-nba-2025-26-shard-*.jsonl.gz' \
            > "$root/download.log" 2>&1
          test "$(find "$root/history" -name 'defender-xyz-*.jsonl.gz' | wc -l)" -eq 15
          python3 "$root/audit.py" --historical "$root/history" --source-receipt "$root/source-qa.json" \
            > "$root/aggregate.json"
          # Source rows, player IDs, game IDs, event IDs and XYZ never leave this
          # ephemeral workspace. Only aggregate statistics are printed.
          python3 - "$root/aggregate.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))
          assert a["source_sha_verified_shards"]==15
          print("COACH_ORIGINAL_CONTEST_AGGREGATE",json.dumps(a,sort_keys=True))
          PY
      - name: Compare published current contest to original event centre
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/coach-current-contest"
          mkdir -p "$root"
          gh api "repos/$PRIVATE_REPO/contents/courtcoder/coach/qa/audit_current_contest_join_v1.py?ref=$PRIVATE_SHA" \
            --jq .content | base64 -d > "$root/audit.py"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/coach_event_proxy_release_20261107/source-event-pressure-qa.json?ref=$PRIVATE_SHA" \
            --jq .content | base64 -d > "$root/source-qa.json"
          gh release download igp-coach-pps-two-season-readiness-20261107 \
            --repo "$PRIVATE_REPO" --dir "$root" \
            --pattern source-event-pressure-fga.jsonl.gz \
            --pattern source-event-pressure-qa.json \
            > "$root/release-download.log" 2>&1
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse \
            -b research/gamepulse-clock-boundary-integrity-20261025 \
            "https://github.com/$PRIVATE_REPO.git" "$root/private-canonical"
          git -C "$root/private-canonical" sparse-checkout set --no-cone \
            /gamepulse/fusion/materialized/igp_full107_client_shot_defense_v1/full107_shots.sqlite \
            /gamepulse/fusion/materialized/igp_full107_client_shot_defense_v1/full107_shots.qa.json
          dbroot="$root/private-canonical/gamepulse/fusion/materialized/igp_full107_client_shot_defense_v1"
          test -s "$dbroot/full107_shots.sqlite"
          python3 "$root/audit.py" --db "$dbroot/full107_shots.sqlite" \
            --qa "$dbroot/full107_shots.qa.json" \
            --ledger "$root/source-event-pressure-fga.jsonl.gz" \
            --ledger-qa "$root/source-event-pressure-qa.json" > "$root/current-aggregate.json"
          python3 - "$root/current-aggregate.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))
          assert a["source_sha_verified"] and a["client_shots"]>=15000
          print("COACH_CURRENT_CONTEST_PAIRED_AGGREGATE",json.dumps(a,sort_keys=True))
          PY

      - name: Validate published contest model against unseen games
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/coach-current-contest"
          gh api "repos/$PRIVATE_REPO/contents/courtcoder/coach/contest_pps_v1.py?ref=$PRIVATE_SHA" \
            --jq .content | base64 -d > "$root/contest_pps_v1.py"
          python3 - "$root" <<'PY'
          import importlib.util,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          spec=importlib.util.spec_from_file_location("contest_pps",root/"contest_pps_v1.py")
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          dbroot=root/"private-canonical/gamepulse/fusion/materialized/igp_full107_client_shot_defense_v1"
          rows=list(mod.source_rows(dbroot/"full107_shots.sqlite",dbroot/"full107_shots.qa.json"))
          hist=list(mod.historical_rows(root.parent/'coach-original-contest/history',root.parent/'coach-original-contest/source-qa.json'))
          qa=mod.evaluate(rows,hist)
          model=mod.fit(rows,hist)
          assert model['historical_shots_with_xfg']>100000
          assert len(rows)>17000 and model["source_games"]==107
          print("COACH_PUBLISHED_CONTEST_MODEL_QA",json.dumps(qa,sort_keys=True))
          print("COACH_PUBLISHED_CONTEST_RESPONSE",json.dumps({
            z:[mod.predict(model,"201939",z,p)["league_points_per_shot"] for p in (1.,12.)]
            for z in ("above_break_three","corner_three","midrange_two")},sort_keys=True))
          assert qa["status"]=="PASS", "PUBLISHED_CONTEST_MODEL_NOT_ACCEPTED"
          source_current_sha=__import__("hashlib").sha256((dbroot/"full107_shots.sqlite").read_bytes()).hexdigest()
          source_history_sha=__import__("hashlib").sha256((root.parent/"coach-original-contest/source-qa.json").read_bytes()).hexdigest()
          model["source_current_sha256"]=source_current_sha
          model["source_historical_receipt_sha256"]=source_history_sha
          model_raw=(json.dumps(model,sort_keys=True,separators=(",",":"))+"\\n").encode()
          (root/"contest-model.json").write_bytes(model_raw)
          qa["source_current_sha256"]=source_current_sha
          qa["source_historical_receipt_sha256"]=source_history_sha
          qa["model_sha256"]=__import__("hashlib").sha256(model_raw).hexdigest()
          (root/"contest-heldout.json").write_text(json.dumps(qa,sort_keys=True,separators=(",",":"))+"\\n")
          PY
      - name: Commit accepted model and receipt only to the private feature branch
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/coach-current-contest"
          for name in contest-model.json contest-heldout.json; do
            python3 - "$root/$name" "$root/private-body.json" <<'PY'
          import base64,json,sys
          from pathlib import Path
          data=Path(sys.argv[1]).read_bytes()
          Path(sys.argv[2]).write_text(json.dumps({
            "message":"Stage accepted two-season Coach contest model and source receipt",
            "content":base64.b64encode(data).decode(),
            "branch":"feature/courtcoder-coach-web-20261106"}))
          PY
            gh api --method PUT "repos/$PRIVATE_REPO/contents/gamepulse/coach_contest_release_20261107/$name" \
              --input "$root/private-body.json" --silent
          done
          echo COACH_ACCEPTED_CONTEST_ASSETS_COMMITTED_PRIVATE_BRANCH

