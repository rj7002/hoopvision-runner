# Opaque public-to-private original 17-game shortgap P2B guard challenge.
# Raw NBA XYZ, private box/PBP, individual errors and private masks stay private.
name: Full88 extra17 original-source P2B shortgap independent cohort
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full88-new17-p2b-shortgap-private-20261102.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: full88-new17-original-p2b-shortgap-20261102
  cancel-in-progress: false
jobs:
  original-source-separate17:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/igp-full88-unguarded-p2b-marginal-20261102
      PRIVATE_SHA: 8115f4ce587d5057d77ed149e95dd4cba4bbfa9e
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify opaque public runner bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Clone SHA pinned private NBA original source and test new heldout method
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          test "$(git rev-parse HEAD)" = "$PRIVATE_SHA" || { echo NEW17_PRIVATE_HEAD_MOVED_FAIL_CLOSED; exit 17; }
          git sparse-checkout set gamepulse/fusion
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_full88_new17_shortgap_source_challenge_v1.py
          for suite in test_igp_full88_new17_shortgap_source_challenge_v1.py test_igp_full88_unguarded_p2b_research_v1.py; do
            python3 -m unittest discover -s gamepulse/fusion/tests -p "$suite" -q > "$RUNNER_TEMP/$suite.log" 2>&1 || {
              echo NEW17_SOURCE_FREE_MODEL_TEST_FAILED
              exit 18
            }
          done
          echo FULL88_NEW17_SHA_PRIVATE_CODE_AND_SOURCE_FREE_QA_PASS
      - name: Replay source-masked player 500 and 1000 ms tests across 17 non71 original games
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          target=gamepulse/fusion/qa/igp_fullx/full88_new17_p2b_shortgap_source_challenge_20261102.json
          python3 gamepulse/fusion/igp_full88_new17_shortgap_source_challenge_v1.py \
            --root . --out "$target" > "$RUNNER_TEMP/new17_private.log" 2>&1 || {
              python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'new17_private.log').read_text(errors='replace').splitlines()
          error=next((line for line in reversed(lines) if re.match(r'^(ValueError|TypeError|KeyError|FileNotFoundError|AssertionError):',line)),None)
          print('NEW17_MASKED_SOURCE_FAILURE_TYPE',re.sub(r'[0-9]{4,}','[ID]',error or 'UNKNOWN')[:180])
          PY
              exit 19
            }
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('gamepulse/fusion/qa/igp_fullx/full88_new17_p2b_shortgap_source_challenge_20261102.json').read_text())
          assert q['holdout_games']==17
          assert q['source_tested_by_class']['single_r500']==1632
          assert q['source_tested_by_class']['two_r500']==544
          assert q['source_coordinates_never_enter_selector'] is True
          assert q['automatic_default_promotions']==0
          print('FULL88_NEW17_MASKED_SOURCE_DISJOINT_71_COHORT_VALIDATED')
          print('FULL88_NEW17_SHORTGAP_SOURCE_SCREEN',q['candidate_source_screen_all_pass'])
          PY
      - name: Preserve original-source error strata and candidate-grade audit private only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          target=gamepulse/fusion/qa/igp_fullx/full88_new17_p2b_shortgap_source_challenge_20261102.json
          git add -f "$target"
          git diff --cached --check
          git commit -qm 'qa(private): original source 17-game separate P2B guard screen [skip ci]'
          for n in 1 2 3 4 5; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH" || exit 27
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo FULL88_NEW17_PRIVATE_SOURCE_QA_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 28
