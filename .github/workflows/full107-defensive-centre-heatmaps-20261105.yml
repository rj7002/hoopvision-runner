# Full107 NBA source-derived center spatial heatmaps: private 2ft aggregate only.
name: Full107 defensive centre original XY heat maps
on:
  push:
    branches: [main]
    paths: ['.github/workflows/full107-defensive-centre-heatmaps-20261105.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: full107-defensive-centre-heatmaps-20261105
  cancel-in-progress: false
jobs:
  shards:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0,1,2,3,4,5,6,7,8]
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: analysis/full107-center-defensive-paint-20261105
      PIN: 47c6221a4135ab8537b4259ba407abd42679fe31
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public-data guard
        run: python3 -m py_compile tools/public_content_guard.py && python3 tools/public_content_guard.py
      - name: Source-private original-native histogram with exact prior-shard parity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone --quiet --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PIN"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PIN"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PIN"
          cd "$RUNNER_TEMP/private"
          PYTHONPATH=gamepulse/fusion/analysis:gamepulse/fusion python3 -B -m py_compile gamepulse/fusion/analysis/igp_full107_center_defensive_heatmaps_v1.py
          PYTHONPATH=gamepulse/fusion/analysis:gamepulse/fusion python3 -B gamepulse/fusion/analysis/igp_full107_center_defensive_heatmaps_v1.py --shard "$SHARD" --out "$RUNNER_TEMP/heatmap_$SHARD.json" > "$RUNNER_TEMP/full107_center_heatmap_source.log"
          python3 - <<'PY'
          import json,os,pathlib
          v=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],f"heatmap_{os.environ['SHARD']}.json").read_text())
          assert v['source_games']==107 and v['processed_games']==len(v['selected_games'])
          assert v['same_denominator_as_full107_leaderboard'] and not v['original_xyz_in_output']
          assert all(sum(row['grid_ms'])==row['defensive_end_ms'] for row in v['rows'])
          print('FULL107_CENTER_SPATIAL_AGGREGATE_SOURCE_PARITY_VERIFIED',v['shard'],v['processed_games'],len(v['rows']))
          PY
      - name: Privately commit exact source-time bin counts by authenticated git
        shell: bash
        run: |
          set -euo pipefail
          rel="gamepulse/fusion/qa/analysis/full107_center_defensive_heatmaps_v1_20261105/shard_$SHARD.json"
          repo="$RUNNER_TEMP/private"
          git -C "$repo" checkout -q -B source-shard-write "origin/$PRIVATE_BRANCH"
          git -C "$repo" config user.name "Integrated Pulse Source QA"
          git -C "$repo" config user.email "41882018272+igp-source@users.noreply.github.com"
          mkdir -p "$repo/$(dirname "$rel")"
          cp "$RUNNER_TEMP/heatmap_$SHARD.json" "$repo/$rel"
          git -C "$repo" add "$rel"
          if ! git -C "$repo" diff --cached --quiet; then
            git -C "$repo" commit -qm "qa: source-verified Full107 centre defensive-grid shard $SHARD"
          fi
          success=0
          for i in $(seq 1 20); do
            git -C "$repo" fetch -q origin "$PRIVATE_BRANCH"
            if ! git -C "$repo" rebase "origin/$PRIVATE_BRANCH"; then
              git -C "$repo" rebase --abort || true
              echo "SOURCE_SHARD_REBASE_CONFLICT"
              exit 3
            fi
            if git -C "$repo" push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              success=1
              break
            fi
            sleep $((2+i))
          done
          test "$success" = 1
          git -C "$repo" fetch -q origin "$PRIVATE_BRANCH"
          actual="$(git -C "$repo" show "origin/$PRIVATE_BRANCH:$rel" | sha256sum | cut -d' ' -f1)"
          expected="$(sha256sum "$RUNNER_TEMP/heatmap_$SHARD.json" | cut -d' ' -f1)"
          test "$actual" = "$expected"
          echo "FULL107_PRIVATE_SOURCE_GRID_SHA_READBACK_VALID shard=$SHARD sha=$expected"

  reduce:
    needs: [shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: analysis/full107-center-defensive-paint-20261105
      PIN: 47c6221a4135ab8537b4259ba407abd42679fe31
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 tools/public_content_guard.py
      - name: Pool 107 source games; select leading official starting C in all 30 teams
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone --quiet --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion/official_pbp_timing/original_nba_20261029 gamepulse/fusion/qa/analysis/full107_center_defensive_heatmaps_v1_20261105 gamepulse/fusion/qa/analysis/full107_center_defensive_paint_expanded_v2_20261105
          cd "$RUNNER_TEMP/private"
          python3 - <<'PY'
          import base64,collections,hashlib,json,os,pathlib,struct,subprocess,time,zlib
          private=os.environ['PRIVATE_BRANCH']
          base='gamepulse/fusion/qa/analysis/full107_center_defensive_heatmaps_v1_20261105'
          leaderpath='gamepulse/fusion/qa/analysis/full107_center_defensive_paint_expanded_v2_20261105/leaderboard.json'
          def get(path):
              return json.loads(pathlib.Path(path).read_bytes())
          docs=[get(f'{base}/shard_{i}.json') for i in range(9)]
          old=get(leaderpath)
          assert len(old['selected_games'])==107 and old['all107_games_processed']
          assert all(d['source_games']==107 and d['shard']==i and d['shards']==9 and
                     d['same_denominator_as_full107_leaderboard'] for i,d in enumerate(docs))
          selected=sum((d['selected_games'] for d in docs),[])
          assert len(selected)==len(set(selected))==107 and set(selected)==set(old['selected_games'])
          pooled={}
          for d in docs:
              assert d['xbins']==25 and d['ybins']==24 and d['bin_width_ft']==2.0
              for p in d['rows']:
                  k=p['id']
                  o=pooled.setdefault(k,{'id':k,'name':p['name'],'teams':set(),'games':set(),
                                         'grid_ms':[0]*600,'paint_ms':0,'defensive_end_ms':0})
                  o['teams'].update(p['teams']);o['games'].update(p['games'])
                  o['paint_ms']+=p['paint_ms'];o['defensive_end_ms']+=p['defensive_end_ms']
                  for i,v in enumerate(p['grid_ms']):o['grid_ms'][i]+=v
          lookup={p['id']:p for p in old['players']}
          for k,p in pooled.items():
              if (p['defensive_end_ms']!=lookup[k]['defensive_half_qualifying_ms'] or
                  p['paint_ms']!=lookup[k]['defensive_paint_ms'] or
                  sum(p['grid_ms'])!=p['defensive_end_ms']):
                  raise ValueError('FULL107_HEATMAP_AGGREGATE_NOT_EXACT:'+k)
          boxroot=pathlib.Path('gamepulse/fusion/official_pbp_timing/original_nba_20261029')
          starts=collections.defaultdict(lambda:collections.Counter())
          names={};official_games=0;team_boxgames=collections.Counter()
          for game in old['selected_games']:
              file=boxroot/game/'boxscore.json'
              if not file.is_file():continue
              b=json.loads(file.read_bytes())['game'];official_games+=1
              for side in ['homeTeam','awayTeam']:
                  obj=b[side];team=obj['teamTricode'];team_boxgames[team]+=1
                  cs=[x for x in obj['players'] if x.get('position')=='C']
                  if len(cs)>1:raise ValueError('AMBIGUOUS_TWO_STARTING_C:'+game+':'+team)
                  if cs:
                      p=cs[0];pid=str(p['personId'])
                      starts[team][pid]+=1
                      names[pid]=p.get('name') or (' '.join([p.get('firstName',''),p.get('familyName','')])).strip()
          assert official_games==71, ('BOXGAME_COUNT',official_games)
          teams=['ATL','BOS','BKN','CHA','CHI','CLE','DAL','DEN','DET','GSW','HOU','IND','LAC','LAL','MEM','MIA','MIL','MIN','NOP','NYK','OKC','ORL','PHI','PHX','POR','SAC','SAS','TOR','UTA','WAS']
          rows=[]
          for team in teams:
              if not starts[team]:raise ValueError('MISSING_C_STARTS:'+team)
              candidates=sorted(starts[team].items(),key=lambda e:(-e[1],-pooled.get(e[0],{}).get('defensive_end_ms',0),e[0]))
              pid,n=candidates[0];p=pooled.get(pid)
              if not p:raise ValueError('STARTER_TRACKING_MISSING:'+team+':'+pid)
              oldrow=lookup[pid]
              if not oldrow['qualified_high_coverage']:raise ValueError('STARTER_INSUFFICIENT_EXPOSURE:'+team)
              b=struct.pack('<600I',*p['grid_ms'])
              rows.append({'team':team,'player':names[pid],'player_id':pid,
                  'official_starting_C_games':n,'official_games_with_team_boxscore':team_boxgames[team],
                  'starting_center_tie':sum(v==n for v in starts[team].values())>1,
                  'other_starting_centers':[
                      {'name':names[alt],'starts':m} for alt,m in candidates[1:]],
                  'games_in_tracking':oldrow['games'],
                  'defensive_end_seconds':round(p['defensive_end_ms']/1000,3),
                  'paint_seconds':round(p['paint_ms']/1000,3),
                  'paint_pct':oldrow['paint_pct_defensive_half'],
                  'grid_ms_uint32_le_zlib_b64':base64.b64encode(zlib.compress(b,9)).decode()})
          rows.sort(key=lambda r:(-r['paint_pct'],r['team']))
          assert len(rows)==len({r['team'] for r in rows})==30
          assert rows[0]['player']=='Donovan Clingan' and rows[-1]['player']=='Bam Adebayo'
          res={'schema':'igp.full107.defensive-centre.position-density.v1',
            'all_107_games_source_verified':True,'original_xyz_exported':False,
            'boxscore_games_for_starter_identification':official_games,
            'selection':'one player/team with most recorded official starting position C; tied by observed defensive-end time',
            'definition':'native clock-running observed player-and-ball same defensive half in originally accepted v2 Full107 source',
            'bins':'25 x 24 grid, 2ft square, flattened row-major [depth y, lateral x]; native direct-source ms, no imputation',
            'court_x_bounds_ft':[-25,25],'court_y_bounds_ft':[0,48],
            'layout':'x=-25..25 lateral across court, y=0..48 feet from defended basket baseline, basket centered at x=0 y=5.25; paint x=-8..8 y=0..19',
            'source_shards_sha256':[hashlib.sha256((json.dumps(d,sort_keys=True,separators=(',',':'))+'\n').encode()).hexdigest() for d in docs],
            'teams':rows}
          raw=(json.dumps(res,sort_keys=True,separators=(',',':'))+'\n').encode()
          pathlib.Path(base,'starting_centres_30team_heatmaps.json').write_bytes(raw)
          print('FULL107_HEATMAP_ALL30_PRIVATE_SHA_VERIFIED',hashlib.sha256(raw).hexdigest(),
               'boxscore_games',official_games,'games',len(selected),
               'players',len(rows),'source_not_leaked',True)
          print('FULL107_HEATMAP_COMPARISON',json.dumps([
             {k:v for k,v in p.items() if k!='grid_ms_uint32_le_zlib_b64'}
             for p in (rows[0],rows[-1])],sort_keys=True))
          PY
          git config user.name "Integrated Pulse Source QA"
          git config user.email "41882018272+igp-source@users.noreply.github.com"
          rel="gamepulse/fusion/qa/analysis/full107_center_defensive_heatmaps_v1_20261105/starting_centres_30team_heatmaps.json"
          git add "$rel"
          git commit -qm "qa: Full107 source-certified all30 defensive-center heatmaps"
          success=0
          for i in $(seq 1 20); do
            git fetch -q origin "$PRIVATE_BRANCH"
            if ! git rebase "origin/$PRIVATE_BRANCH"; then
              git rebase --abort || true
              exit 3
            fi
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              success=1
              break
            fi
            sleep $((2+i))
          done
          test "$success" = 1
          git fetch -q origin "$PRIVATE_BRANCH"
          actual="$(git show "origin/$PRIVATE_BRANCH:$rel" | sha256sum | cut -d' ' -f1)"
          expected="$(sha256sum "$rel" | cut -d' ' -f1)"
          test "$actual" = "$expected"
          echo "FULL107_30CENTRE_SPATIAL_SOURCE_SHA_READBACK_OK $actual"
