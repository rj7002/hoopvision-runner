# Reviewed public CPU bridge: private original NBA SDK and accepted-model data
# remain in private 104. No per-touch positions, events or timestamps public.
name: Full81 R18 accepted 10Hz paired source replay (private)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/full107-first81-r18-rootcause-private-source-20261104.yml', 'tools/public_content_guard.py']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  paired-replay:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        gid: ['0022600021', '0022600091', '0022600125', '0022600138']
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      REPO: timeedmonds-maker/104
      BRANCH: analysis/igp81-r18-unknown-rootcause-v1-20261104
      PIN: 370e703e29d92264ac3ef170f759cd4c11c1acd6
      GID: ${{ matrix.gid }}
      DEST: gamepulse/fusion/qa/analysis/igp81_r18_paired_accepted10hz_20261104
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public licensed source confidentiality boundary
        run: python3 tools/public_content_guard.py
      - name: Private source QA and accepted 10 Hz exact-touch paired replay
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$BRANCH" "https://github.com/$REPO.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PIN"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PIN"
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PIN"
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion/analysis:gamepulse/fusion
          script=gamepulse/fusion/analysis/igp81_r18_paired_accepted10hz_replay_v1.py
          if python3 -B "$script" --selftest > "$RUNNER_TEMP/test-stdout" 2> "$RUNNER_TEMP/test-stderr" &&
             python3 -B "$script" --root . --game-id "$GID" --out "$RUNNER_TEMP/pairs.json" > "$RUNNER_TEMP/qa-stdout" 2> "$RUNNER_TEMP/qa-stderr"; then
            FILE="game_$GID.json"
            python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          d=json.loads((root/"pairs.json").read_bytes())
          assert d["source_game_id"]==os.environ["GID"]
          assert d["run_changed_default"] is False
          assert d["independent_accuracy_certified"] is False
          assert d["summary"]["all_source_touch_ids_unique"]
          assert d["summary"]["all_original_source_classifications_retained"]
          assert d["summary"]["eligible_touches"] in (465,510,537,479)
          print("R18_ACCEPTED10HZ_PAIRED_PRIVATE_PASS",
                d["source_game_id"],
                "touches",d["summary"]["eligible_touches"],
                "unknowns",d["summary"]["original_native_unresolved_tracking_or_control"],
                "candidate_double",d["summary"]["original_native_unresolved_new_candidate_double"],
                "candidate_negative",d["summary"]["original_native_unresolved_new_candidate_negative"],
                "native_doubles_lost",d["summary"]["native_source_double_removed_in_replay"])
          PY
            cp "$RUNNER_TEMP/pairs.json" "$RUNNER_TEMP/private-result.json"
          else
            FILE="failure_$GID.json"
            python3 - <<'PY'
          import os,pathlib,json
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          errors={}
          for name in ("test-stderr","qa-stderr"):
              path=root/name
              if path.is_file():errors[name]=path.read_text()[-16000:]
          (root/"private-result.json").write_text(json.dumps({
              "game_id":os.environ["GID"],
              "status":"ACCEPTED10HZ_PRIVATE_PAIRED_REPLAY_FAILED",
              "private_error_details":errors
          },sort_keys=True)+"\n")
          PY
            echo R18_ACCEPTED10HZ_FAILURE_DIAGNOSTIC_PRIVATE_ONLY
          fi
          git fetch -q origin "$BRANCH"
          git checkout -q -B qa-publish "origin/$BRANCH"
          mkdir -p "$DEST"
          cp "$RUNNER_TEMP/private-result.json" "$DEST/$FILE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$DEST/$FILE"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo R18_PRIVATE_RESULT_ALREADY_PERSISTED
          else
            git commit -q -m "qa(private): R18 paired accepted10Hz $GID [skip ci]"
            complete=0
            for n in 1 2 3 4 5; do
              git fetch -q origin "$BRANCH"
              git rebase -q "origin/$BRANCH"
              if git push -q origin "HEAD:refs/heads/$BRANCH"; then
                complete=1
                echo R18_ACCEPTED10HZ_PRIVATE_RESULT_SAVED "$GID"
                break
              fi
              sleep "$n"
            done
            test "$complete" -eq 1
          fi
          test "$FILE" = "game_$GID.json"
