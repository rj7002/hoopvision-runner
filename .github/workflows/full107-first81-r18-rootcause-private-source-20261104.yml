# R18 private source-preserving reduction: exact 1991 original-source touches,
# accepted Full92 10Hz replay, conservative review gates; public counts only.
name: Full81 R18 source-preserving paired accepted10Hz reducer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/full107-first81-r18-rootcause-private-source-20261104.yml', 'tools/public_content_guard.py']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  private-reduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      REPO: timeedmonds-maker/104
      BRANCH: analysis/igp81-r18-unknown-rootcause-v1-20261104
      PIN: 5d3dd6ff061d0f018d174935983eaa5849d2fcb5
      DEST: gamepulse/fusion/qa/analysis/igp81_r18_paired_accepted10hz_20261104/reduced_source_preserving_v1.json
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Reviewed public source confidentiality boundary
        run: python3 tools/public_content_guard.py
      - name: Exact private source-locked 1991 touch reduction and test
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$BRANCH" "https://github.com/$REPO.git" "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PIN"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PIN"
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PIN"
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion/analysis:gamepulse/fusion
          script=gamepulse/fusion/analysis/igp81_r18_source_preserving_accepted10hz_reduce_v1.py
          if python3 -B "$script" --selftest > "$RUNNER_TEMP/selftest" 2> "$RUNNER_TEMP/selferr" &&
             python3 -B "$script" --root . --out "$RUNNER_TEMP/result.json" > "$RUNNER_TEMP/qaout" 2> "$RUNNER_TEMP/qaerr"; then
            python3 - <<'PY'
          import json,os,pathlib
          d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"result.json").read_bytes())
          assert d["eligible_touches"]==1991
          assert d["source_touch_denominator_changed"] is False
          assert d["original_native_double_episodes_erased"]==0
          assert d["promoted_double_team_change_count"]==0
          assert d["publication_allowed"] is False
          print("R18_1991_SOURCE_PRESERVING_REDUCE_PASS",
                d["all_touch_status_counts"].get("R18_NEW_DOUBLE_REVIEW_CANDIDATE_ONLY",0),
                d["all_touch_status_counts"].get("R18_NEW_NEGATIVE_REVIEW_CANDIDATE_ONLY",0))
          PY
          else
            python3 - <<'PY'
          import json,pathlib,os
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          errors={}
          for name in ("qaerr","selferr"):
              p=root/name
              if p.is_file():errors[name]=p.read_text()[-16000:]
          (root/"result.json").write_text(json.dumps({
              "status":"PRIVATE_SOURCE_PAIRED_REDUCE_FAILED",
              "private_diagnostics":errors})+"\n")
          PY
            echo R18_REDUCER_FAILED_DIAGNOSTIC_PRIVATE
            FAILED=1
          fi
          git fetch -q origin "$BRANCH"
          git checkout -q -B qa-publish "origin/$BRANCH"
          mkdir -p "$(dirname "$DEST")"
          cp "$RUNNER_TEMP/result.json" "$DEST"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$DEST"
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -q -m "qa(private): exact 1991-touch R18 source-preserving reducer [skip ci]"
            done=0
            for n in 1 2 3 4 5; do
              git fetch -q origin "$BRANCH"
              git rebase -q "origin/$BRANCH"
              if git push -q origin "HEAD:refs/heads/$BRANCH"; then
                done=1
                echo R18_1991_PRIVATE_REDUCE_PERSISTED
                break
              fi
              sleep "$n"
            done
            test "$done" = 1
          fi
          test "${FAILED:-0}" = 0
