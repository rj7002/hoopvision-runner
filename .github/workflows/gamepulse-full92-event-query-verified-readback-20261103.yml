name: Full92 private official event-to-native pointer and rebound query readback
# PUBLIC ORCHESTRATION ONLY. Source NBA XYZ never enters public logs.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-full92-event-query-verified-readback-20261103.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-authenticated-query:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/full92-all-event-rebound-tracking-20261103
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Keep public content opaque, clone private original records
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Source-free filtering and raw XYZ access tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -v -s gamepulse/fusion/tests \
            -p 'test_query_igp_full92_pbp_event_tracking_v1.py'
      - name: Run original SHA pointer event readback for game 0001
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 - <<'PY'
          from query_igp_full92_pbp_event_tracking_v1 import search
          from igp_full92_all_event_rebound_tracking_v1 import query
          d=search(".", game_id="0022600001",event_type="rebound",limit=100)
          assert d["total_matches"]==104
          assert all(x["event_type"]=="rebound" for x in d["records"])
          p=[x for x in d["records"] if x["official_player_id"] is not None]
          assert len(p)==88
          selected=next(x for x in p if x["closest_native_frame_pointer"] is not None)
          raw=query(".", "0022600001",selected["action_number"],include_original_xyz=True)
          assert len(raw["original_observed_snapshots"])>=1
          assert raw["official_player_id"]==selected["official_player_id"]
          assert raw["nba_event_key"]==selected["nba_event_key"]
          assert not raw["event_time_physical_contact_certified"]
          assert not raw["rebound"]["physical_control_certified"]
          for frame in raw["original_observed_snapshots"]:
              assert frame["pointer"]["utc_ms"]>0
              assert isinstance(frame["positions_native_units"],dict)
          subset=search(".", game_id="0022600001",event_type="rebound",
                        proximity_only=True,limit=100)
          assert subset["total_matches"]==84
          source_all=search(".",game_id="0022600001",limit=100)
          assert source_all["total_matches"]==593
          print("FULL92_EVENT_PRIVATE_NATIVE_SHA_POINTER_READBACK_PASS",
                "official_events",source_all["total_matches"],
                "player_rebounds",len(p),
                "proximity_candidates",subset["total_matches"],
                "verified_original_xyz_pointers",len(raw["original_observed_snapshots"]))
          PY
