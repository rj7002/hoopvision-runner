# Control plane public only; complete NBA PBP, teams and original chains stay private.
name: FULL88 original NBA PBP all88 logical chain source reconciliation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full88-all88-original-pbp-chain-private-20261102.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: full88-original-nba-pbp-all88-chain-census-20261102
  cancel-in-progress: false
jobs:
  private-source-pbp-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: analysis/igp-full88-all88-original-pbp-chains-20261102
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check public private boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Checkout full88 immutable original PBP and accepted official Advanced stats
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          git sparse-checkout set --no-cone \
            /gamepulse/fusion/igp_full88_original_pbp_chain_census_v1.py \
            /gamepulse/fusion/igp_full88_default_engine_v1.py \
            /gamepulse/fusion/igp_full88_team_statistical_reporting_v1.py \
            /gamepulse/fusion/igp81_default_team_offrtg.py \
            /gamepulse/fusion/universal_possession_alignment_2026.py \
            /gamepulse/fusion/qa/igp81_nba_team_offrtg_reporting_default_v1.json \
            /gamepulse/fusion/qa/igp_fullx/full88_advanced_team_poss_and_official_score_v1.json \
            /gamepulse/fusion/qa/igp_fullx/shot_event_multiview_full88_v1.json \
            /gamepulse/fusion/official_pbp_timing/games/
          python3 -m py_compile gamepulse/fusion/igp_full88_original_pbp_chain_census_v1.py
          python3 gamepulse/fusion/igp_full88_original_pbp_chain_census_v1.py --self-test
      - name: Replay all 88 original basketball PBP chains and verify all 176 published possessions separately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 gamepulse/fusion/igp_full88_original_pbp_chain_census_v1.py > "$RUNNER_TEMP/private-original-pbp-log" 2>&1 || {
            python3 - <<'PY'
          import os,json
          from pathlib import Path
          log=(Path(os.environ['RUNNER_TEMP'])/'private-original-pbp-log').read_text()
          p=Path('gamepulse/fusion/qa/igp_fullx/full88_original_pbp_chain_private_failure_20261102.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({'status':'FAILED','private_traceback':log[-10000:]},sort_keys=True,indent=2)+'\n')
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add --sparse -f gamepulse/fusion/qa/igp_fullx/full88_original_pbp_chain_private_failure_20261102.json
            git commit -qm 'qa(private): preserve all88 NBA original chain replay failure [skip ci]'
            git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH" || true
            echo "FULL88_SOURCE_ORIGINAL_CHAIN_CENSUS_FAILED_PRIVATE_RECEIPT"
            exit 1
          }
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('gamepulse/fusion/qa/igp_fullx/full88_original_pbp_all88_chain_census_20261102.json')
          x=json.loads(p.read_bytes())
          assert x['games']==88 and x['team_games']==176
          assert x['raw_PBP_totals']['official_actions']==53541
          assert x['raw_PBP_totals']['official_fga']==15584
          assert x['source_original_old81_chain_count']==16581
          assert x['official_NBA_published_POSS']==17914
          assert x['official_NBA_points']==20036
          assert x['new7_corrected_candidate_chains'] is None
          assert x['full88_corrected_candidate_chains'] is None
          print('FULL88_SOURCE_ORIGINAL_NBA_PBP_CHAIN_CENSUS_AGGREGATE',
                x['source_original_all88_chain_count'],x['source_original_new7_chain_count'],
                x['new7_original_chain_minus_published_NBA_POSS'],
                x['original_chain_terminal_uncertainty'])
          PY
      - name: Commit all88 original PBP chain provenance private only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f gamepulse/fusion/qa/igp_fullx/full88_original_pbp_all88_chain_census_20261102.json
          git diff --cached --check
          if git diff --cached --quiet; then echo PRIVATE_ALL88_PBP_CHAIN_QA_ALREADY_IDENTICAL; exit 0; fi
          git commit -qm 'qa(private): preserve FULL88 official source original chain replay [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH"
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo FULL88_ORIGINAL_PBP_CHAIN_PRIVATE_RECEIPT_COMMITTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 28
