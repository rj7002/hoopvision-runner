# Research only: sealed original NCAA worker-model archive stays in temp private
# workspace; public logs numeric aggregate only. Does NOT deploy CourtCoder.
name: CourtCoder NCAA source-model risk triage private CPU
on:
  push:
    branches: ['research/courtcoder-ncaa-motion-cpu-20261107']
    paths: ['.github/workflows/courtcoder-ncaa-risk-triage-private-cpu-20261107.yml']
permissions: {contents: read}
concurrency:
  group: cc-ncaa-risk-source-20261107
  cancel-in-progress: false
jobs:
  source-model-risk:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: research/courtcoder-ncaa-transfer-gates-20261107
      PINNED_PRIVATE_SHA: f74c8b389f976cc912942dcac88ffc06cc73f95f
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Authorize exact private source and public content guard
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 -b "$PRIVATE_BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/private"
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_PRIVATE_SHA"
          gh api "repos/$PRIVATE_REPO/actions/artifacts/13113878628/zip" > "$RUNNER_TEMP/private-worker.zip"
          python3 - <<'PY'
          import json,os,zipfile
          p=os.path.join(os.environ["RUNNER_TEMP"],"private-worker.zip")
          assert zipfile.is_zipfile(p)
          with zipfile.ZipFile(p) as z:
              m=json.loads(z.read("receipt.json"))
              assert m["source_sha256"]=="17b9687d59fe380bf7aa6ae8dc654f713b20b19dd654230d82aec816f06af81f"
              assert m["exact_original_frame_box_cohort"]==15614
          print("SHA_PINNED_PRIVATE_VIDEO_WORKER_ARCHIVE_ACCEPTED")
          PY
      - name: Install CPU-only pinned risk training wheels
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip -q install numpy==2.2.6 scikit-learn==1.8.0 lightgbm==4.6.0
      - name: Run source-free regression suite and original NCAA source model training
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 -m unittest -q \
            tools.diagnostics.test_courtcoder_ncaa_risk_triage_train_v1 \
            screen_tracker_nextgen.test_uncertainty_recheck_policy_v1
          python3 tools/diagnostics/courtcoder_ncaa_risk_triage_train_v1.py \
            --private-original-worker-zip "$RUNNER_TEMP/private-worker.zip" \
            --private-report "$RUNNER_TEMP/ncaa_risk_report_private.json" \
            --private-model-dir "$RUNNER_TEMP/ncaa_risk_models_private"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"ncaa_risk_report_private.json").read_text())
          assert d["schema"]=="courtcoder.ncaa-original-worker-risk-triage.v1"
          assert d["original_video_sha256"]=="17b9687d59fe380bf7aa6ae8dc654f713b20b19dd654230d82aec816f06af81f"
          assert d["source_model_box_truth_not_human"] and not d["production_promoted"]
          lines=["## CourtCoder NCAA second-pass risk triage — original worker-model source",
            "",f"Frozen model-box source samples: {d['source_original_nCAA_worker_rows']}",
            f"Eligible 7-frame masked windows: {d['eligible_seven_frame_windows']}",
            f"Train / tune / held-out windows: {d['train_windows']} / {d['tune_windows']} / {d['heldout_windows']}",
            "| Hidden-box linear midpoint error | Flagged fraction | Model catch rate | Acceleration catch rate | Velocity catch rate |",
            "|---|---:|---:|---:|---:|"]
          for cutoff in ("10","20"):
            r=d["risk"][cutoff]
            lines.append("| >"+cutoff+" px | 20% | "+
              str(r["model_top20"]["bad_recall"])+" | "+
              str(r["acceleration_top20"]["bad_recall"])+" | "+
              str(r["velocity_top20"]["bad_recall"])+" |")
          lines+=["","**One NCAA game; actor-tracklet-disjoint, not new-game transfer. Labels are source model boxes, not independent human truth. Not promoted.**"]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:f.write("\n".join(lines)+"\n")
          print("NCAA_MODEL_SOURCE_RISK_TRAIN_COMPLETE_NUMERIC_ONLY")
          PY
      - name: Preserve trained risk weights and numeric report in private 104 ONLY
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          gh auth setup-git
          git fetch -q origin "$PRIVATE_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$PINNED_PRIVATE_SHA"
          git checkout -q -B risk-qa "$PINNED_PRIVATE_SHA"
          dest=docs/courtcoder_ncaa_private_training/risk_triage_v1
          mkdir -p "$dest"
          cp "$RUNNER_TEMP/ncaa_risk_report_private.json" "$dest/score.json"
          cp "$RUNNER_TEMP/ncaa_risk_models_private/"*.txt "$dest/"
          git add "$dest"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "qa(cv): preserve original NCAA source-model risk triage weights (research only)"
          git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"
          echo NCAA_RISK_PRIVATE_MODEL_COMMITTED_NO_PRODUCTION_PROMOTION
