# Original licensed NBA data never published. Only aggregated center counts stored in private 104.
name: Full107 original-native center defensive paint percent
on:
  push:
    branches: [main]
    paths: ['.github/workflows/full107-center-defensive-paint-private-20261105.yml', 'tools/public_content_guard.py']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: full107-center-defensive-paint-20261105
  cancel-in-progress: true
jobs:
  shards:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0,1,2,3,4,5,6,7,8]
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      SHARD: ${{ matrix.shard }}
      PRIVATE_BRANCH: analysis/full107-center-defensive-paint-20261105
      PIN: da5c634cf2ae0ee52e814e5dfdeb92f8a7afe98a
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public-data safety guard
        run: python3 tools/public_content_guard.py
      - name: Authenticated pinned private-source native reader
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          gh auth setup-git
          git clone --quiet --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PIN"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PIN"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PIN"
          cd "$RUNNER_TEMP/private"
          PYTHONPATH=gamepulse/fusion/analysis:gamepulse/fusion python3 -B -m py_compile gamepulse/fusion/analysis/igp_full107_center_defensive_paint_v1.py
          PYTHONPATH=gamepulse/fusion/analysis:gamepulse/fusion python3 -B gamepulse/fusion/analysis/igp_full107_center_defensive_paint_v1.py --root . --shard "$SHARD" --shards 9 --out "$RUNNER_TEMP/result.json" > "$RUNNER_TEMP/private_full107_center_paint.log"
          python3 - <<'PY'
          import json,os,pathlib
          obj=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'result.json').read_text())
          assert obj['shard']==int(os.environ['SHARD']) and obj['shards']==9
          assert obj['processed_games']==len(obj['selected_games']) and obj['processed_games']>=11
          assert obj['original_source_changed'] is False and obj['publication_of_source_xyz'] is False
          print('FULL107_CENTER_PAINT_SOURCE_SHARD_VERIFIED',obj['shard'],obj['processed_games'],'games',len(obj['players']),'centers')
          PY
      - name: Publish aggregated source-audited shard to private research branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,time
          shard=int(os.environ['SHARD']);private=os.environ['PRIVATE_BRANCH']
          raw=pathlib.Path(os.environ['RUNNER_TEMP'],'result.json').read_bytes()
          target=f'repos/timeedmonds-maker/104/contents/gamepulse/fusion/qa/analysis/full107_center_defensive_paint_20261105/shard_{shard}.json'
          for trial in range(15):
              existing=subprocess.run(['gh','api',target+'?ref='+private],text=True,capture_output=True)
              p={'branch':private,'message':f'data: Full107 NBA source-direct defensive center paint shard {shard}',
                 'content':base64.b64encode(raw).decode()}
              if existing.returncode==0:p['sha']=json.loads(existing.stdout)['sha']
              elif '404' not in existing.stderr and 'Not Found' not in existing.stderr:raise RuntimeError(existing.stderr[:250])
              result=subprocess.run(['gh','api','-X','PUT',target,'--input','-'],text=True,input=json.dumps(p),capture_output=True,timeout=100)
              if result.returncode==0:break
              if not any(x in result.stderr for x in ('409','422','429','500','502','503')):raise RuntimeError(result.stderr[:400])
              time.sleep(min(3+trial,15))
          else:raise RuntimeError('PRIVATE_SHARD_WRITE_RETRIES_EXHAUSTED')
          receipt=subprocess.check_output(['gh','api',target+'?ref='+private,'--jq','.content'],timeout=60)
          got=base64.b64decode(receipt)
          assert hashlib.sha256(raw).hexdigest()==hashlib.sha256(got).hexdigest()
          print('PRIVATE_SOURCE_CENTRE_PAINT_SHARD_SHA_READBACK_VERIFIED',shard)
          PY
  reduce:
    needs: [shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: analysis/full107-center-defensive-paint-20261105
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 tools/public_content_guard.py
      - name: Strict 107-game source-preserving pooled numerator/denominator aggregation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python3 - <<'PY'
          import base64,collections,hashlib,json,os,pathlib,subprocess,time
          private=os.environ['PRIVATE_BRANCH']
          docs=[]
          for shard in range(9):
              target=f'repos/timeedmonds-maker/104/contents/gamepulse/fusion/qa/analysis/full107_center_defensive_paint_20261105/shard_{shard}.json'
              c=subprocess.check_output(['gh','api',target+'?ref='+private,'--jq','.content'],timeout=90)
              obj=json.loads(base64.b64decode(c))
              assert obj['shard']==shard and obj['shards']==9 and obj['processed_games']==len(obj['selected_games'])
              docs.append(obj)
          cohort=docs[0]['cohort_game_ids']
          assert len(cohort)==107 and all(x['cohort_game_ids']==cohort for x in docs)
          selected=sum((x['selected_games'] for x in docs),[])
          assert len(selected)==107 and len(set(selected))==107 and set(selected)==set(cohort)
          keys=('strict_defensive_possession_available_ms','source_sample_good_ms','defensive_half_ms','paint_ms',
                'other_half_ms','eligible_frames','source_observed_frames','paint_frames')
          totals={}
          for shard,obj in enumerate(docs):
              for p in obj['players']:
                  key=p['id']
                  row=totals.setdefault(key,{'id':key,'name':p['name'],'teams':set(),'games':set(),**{k:0 for k in keys}})
                  assert row['name']==p['name'] or row['name'] and p['name']
                  row['teams'].update(p['teams']);row['games'].update(p['games'])
                  for k in keys:row[k]+=p[k]
          players=[]
          for pid,p in totals.items():
              a=p['defensive_half_ms'];b=p['source_sample_good_ms'];c=p['strict_defensive_possession_available_ms']
              players.append({'id':pid,'name':p['name'],'teams':sorted(p['teams']),'games':len(p['games']),
                  **{k:p[k] for k in keys},
                  'defensive_half_minutes':round(a/60000,2),'paint_minutes':round(p['paint_ms']/60000,2),
                  'paint_pct_defensive_half':round(100*p['paint_ms']/a,3) if a else None,
                  'paint_pct_all_defensive_possession_time':round(100*p['paint_ms']/b,3) if b else None,
                  'observed_source_presence_pct':round(100*b/c,2) if c else None,
                  'eligible_for_min10min_2games':a>=600000 and len(p['games'])>=2,
                  'qualified_high_coverage':a>=600000 and len(p['games'])>=2 and b/c>=0.7 if c else False})
          players.sort(key=lambda p:(-(p['paint_pct_defensive_half'] or 0),-p['defensive_half_ms'],p['id']))
          leaderboard={'schema':'igp.full107.centers.paint.ranked-aggregates.v1',
              'n_full107_games':107,'role_basis':'Player listed as starting C in >=1 official Full107 NBA boxscore, 71 available boxscore games',
              'primary':'paint % of observed live opponent-possession time on own defensive half',
              'original_native_only':True,'source_proxy_no_independent_video_P1':True,
              'strict_nba_lineup_clock_running':True,
              'opponent_possession':'both scorer event-group possession owners agree',
              'eligibility':'at least 10 observed minutes own defensive half across >=2 games, source presence >=70%',
              'qualified_high_coverage':sum(p['qualified_high_coverage'] for p in players),
              'selected_games':cohort,'source_shards_sha256':[hashlib.sha256(json.dumps(d,sort_keys=True,separators=(',',':')).encode()+b'\\n').hexdigest() for d in docs],
              'players':players,'all_original_XYZ_preserved':True,'all107_games_processed':True}
          qualified=[p for p in players if p['qualified_high_coverage']]
          print('FULL107_CENTER_PAINT_TOP10_AGGREGATE',json.dumps([
              {'name':p['name'],'team':p['teams'],'paint_pct':p['paint_pct_defensive_half'],
               'defensive_half_min':p['defensive_half_minutes'],'games':p['games'],'source_presence_pct':p['observed_source_presence_pct']}
              for p in qualified[:10]],sort_keys=True))
          assert qualified, 'NO_QUALIFYING_CENTER_OR_UNRELIABLE_SOURCE_DENOMINATOR'
          raw=(json.dumps(leaderboard,sort_keys=True,separators=(',',':'))+'\n').encode()
          target='repos/timeedmonds-maker/104/contents/gamepulse/fusion/qa/analysis/full107_center_defensive_paint_20261105/leaderboard.json'
          for trial in range(15):
              old=subprocess.run(['gh','api',target+'?ref='+private],text=True,capture_output=True)
              payload={'branch':private,'message':'qa: publish reproducible Full107 defensive-center paint leaderboard','content':base64.b64encode(raw).decode()}
              if old.returncode==0:payload['sha']=json.loads(old.stdout)['sha']
              elif '404' not in old.stderr and 'Not Found' not in old.stderr:raise RuntimeError(old.stderr)
              updated=subprocess.run(['gh','api','-X','PUT',target,'--input','-'],input=json.dumps(payload),text=True,capture_output=True,timeout=100)
              if updated.returncode==0:break
              if not any(e in updated.stderr for e in ('409','422','429','500','502','503')):raise RuntimeError(updated.stderr[:400])
              time.sleep(min(3+trial,15))
          else:raise RuntimeError('LEADERBOARD_PUBLISH_RETRY_EXHAUSTED')
          downloaded=base64.b64decode(subprocess.check_output(['gh','api',target+'?ref='+private,'--jq','.content'],timeout=60))
          assert hashlib.sha256(downloaded).hexdigest()==hashlib.sha256(raw).hexdigest()
          print('FULL107_CENTER_PAINT_FINAL_SOURCE_HASH_VERIFIED',hashlib.sha256(raw).hexdigest(),'qualified',len(qualified))
          PY
