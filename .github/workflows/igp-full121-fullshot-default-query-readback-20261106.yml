# Validate canonical Full121 source FGA query. Original event and XYZ payloads private only.
name: IGP Full121 canonical source-grade exact full-shot query private readback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full121-fullshot-default-query-readback-20261106.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: \${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify Full121 default source and official FGA completeness
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          export GH_TOKEN="$(python3 -c 'import os;print(os.environ["GH_TOKEN"].lstrip(chr(92)))')"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion data/extensions/nba_blueprint_2026_27/games
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_full121_official_fga_sourcegraded_query_v1.py gamepulse/fusion/igp_default_database.py
          python3 -m unittest -q gamepulse.fusion.tests.test_igp_full121_official_fga_sourcegraded_query_v1
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from igp_default_database import shot_query,DEFAULT_DATABASE,load_release
          assert DEFAULT_DATABASE=="FULL121"
          r,base,add=load_release(".")
          ids=[f"0022600{i:03d}" for i in range(173,187)]
          total=0;readbacks=0;missing_advanced=0
          for game in ids:
              info=add["games"][game]
              p=Path(info["official_pbp_path"])
              raw=p.read_bytes()
              assert hashlib.sha256(raw).hexdigest()==info["official_pbp_sha256"]
              acts=[a for a in json.loads(raw)["actions"] if a["action_type"] in ("2pt","3pt")]
              assert len(acts)==info["source_capture_grades"]["official_field_goal_attempts"]
              total+=len(acts)
              for a in (acts[0],acts[-1]):
                  x=shot_query(".",game,a["nba_action_number"])
                  assert x["official_fga"]["nba_action_number"]==a["nba_action_number"]
                  assert x["official_fga"]["person_id"]==a["person_id"]
                  assert x["official_fga_census_basis"]=="NBA_PBP_NOT_SDK_SHOTDETAILS"
                  assert not x["independent_video_accuracy_certified"]
                  readbacks+=1
                  missing_advanced+=x["companion_advanced_missing_is_unknown"]
          assert total==2482 and readbacks==28
          game="0022600186"
          info=add["games"][game]
          actions=json.loads(Path(info["official_pbp_path"]).read_bytes())["actions"]
          ot=[a for a in actions if a["period"]==5 and a["action_type"] in ("2pt","3pt")]
          assert len(ot)==14
          for a in ot:
              s=shot_query(".",game,a["nba_action_number"])
              assert s["companion_advanced_missing_is_unknown"] is True
              assert s["companion_published_xfg"] is None
          print("FULL121_SOURCE_GRADED_DEFAULT_SHOT_READBACK_SUCCESS",
                "database_games",121,"nov04_official_fga",total,
                "pergame_real_source_readbacks",readbacks,
                "unobserved_ot_advanced_shots",len(ot),
                "physical_tracking_promoted",False)
          PY
