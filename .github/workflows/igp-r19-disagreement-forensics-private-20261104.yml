# Independently compare source-graded R19 and frozen R13/R18 on 1,991 touches.
# All original timestamps, touch identifiers and event evidence stay private.
name: R19 original-source disagreement forensic four-game
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/igp-r19-disagreement-forensics-private-20261104.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: analysis/igp-r19-native-temporal-20261104
      PIN: f663490db826ff5f3f48b06ecc85c15b15ae3205
      DEST: gamepulse/fusion/qa/analysis/igp_r19_native_rebuild_20261104
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public confidentiality boundary
        run: python3 tools/public_content_guard.py
      - name: Private SHA-locked original-source diagnostic, private output only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          git sparse-checkout set gamepulse/fusion
          git fetch -q --depth=1 origin "$PIN"
          git checkout -q --detach "$PIN"
          test "$(git rev-parse HEAD)" = "$PIN"
          script=gamepulse/fusion/analysis/igp_r19_private_disagreement_forensics_v1.py
          python3 -B "$script" --root . --out "$RUNNER_TEMP/private-full.json" > "$RUNNER_TEMP/stdout" 2> "$RUNNER_TEMP/stderr" || {
            echo R19_PRIVATE_DISAGREEMENT_RUN_FAILED_DETAILS_REDACTED
            exit 1
          }
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          d=json.loads((root/'private-full.json').read_bytes())
          assert d['source_original_touches']==1991
          assert d['original_r13_not_reproduced']==67
          assert d['r19_new_double_candidates_not_r13']==93
          assert d['production_promotion'] is False
          public={k:v for k,v in d.items() if k!='private_touch_disagreement_cases'}
          (root/'private-summary.json').write_text(json.dumps(public,sort_keys=True,indent=2)+'\n')
          relevant={k:v for k,v in d['aggregate_diagnostic_counters'].items()
                    if 'NATIVE_REASON_' in k or 'MODEL_REASON_' in k or
                    k.endswith('HAS_MODEL_TICK') or k.endswith('SAME_PAIR_AND_TIME')}
          print('R19_PRIVATE_1991_DISAGREEMENT_QA_PASS',
                'source_touches',d['source_original_touches'],
                'r13_pos_not_r19',d['original_r13_not_reproduced'],
                'r19_new_candidates',d['r19_new_double_candidates_not_r13'],
                'diagnostic_reasons',relevant)
          PY
          git fetch -q origin "$PRIVATE_BRANCH"
          git checkout -q -B qa-private "origin/$PRIVATE_BRANCH"
          mkdir -p "$DEST"
          cp "$RUNNER_TEMP/private-full.json" "$DEST/disagreement_forensic_full_private_v1.json"
          cp "$RUNNER_TEMP/private-summary.json" "$DEST/disagreement_forensic_summary_v1.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$DEST/disagreement_forensic_full_private_v1.json" "$DEST/disagreement_forensic_summary_v1.json"
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -q -m 'qa(private): exact R19 1991 touch disagreement cause forensic [skip ci]'
            DONE=0
            for k in 1 2 3 4 5; do
              git fetch -q origin "$PRIVATE_BRANCH"
              git rebase -q "origin/$PRIVATE_BRANCH"
              if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then DONE=1; break; fi
              sleep "$k"
            done
            test "$DONE" = 1
          fi
          # Follow-up shadow: accepted-model-only positives must be checked
          # against original native screen/hedge evidence, not promoted.
          script=gamepulse/fusion/analysis/igp_r19_model_only_source_conflict_shadow_v1.py
          python3 -B "$script" --selftest > "$RUNNER_TEMP/modeltest.out" 2> "$RUNNER_TEMP/modeltest.err" || {
            echo R19_SOURCE_CONFLICT_SHADOW_SELFTEST_FAILED_PRIVATE
            exit 1
          }
          python3 -B "$script" --root . --out "$RUNNER_TEMP/modelonly.json" > "$RUNNER_TEMP/modelqa.out" 2> "$RUNNER_TEMP/modelqa.err" || {
            echo R19_SOURCE_CONFLICT_SHADOW_PRIVATE_FAILED
            exit 1
          }
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])
          d=json.loads((p/'modelonly.json').read_bytes())
          s=d['source_graded_summary']
          assert s['all_double_candidates']==207
          assert s['model_only_double_candidates']==31
          assert d['tactical_guard_not_promoted'] is True
          summary={k:v for k,v in d.items()
                   if k not in ('private_model_only_cases','private_previous_user_label_check')}
          (p/'modelonly-summary.json').write_text(json.dumps(summary,sort_keys=True,indent=2)+'\n')
          print('R19_NATIVE_MODEL_DISAGREEMENT_SHADOW_PASS',
                'model_only_doubles',s['model_only_double_candidates'],
                'source_tactical_conflicts',s['model_only_with_observed_source_conflict'],
                'human_review_notdouble_conflicts',s.get('human_review_model_only_notdouble_conflict',0))
          PY
          git fetch -q origin "$PRIVATE_BRANCH"
          git checkout -q -B qa-shadow "origin/$PRIVATE_BRANCH"
          cp "$RUNNER_TEMP/modelonly.json" "$DEST/model_only_counterevidence_shadow_v1.json"
          cp "$RUNNER_TEMP/modelonly-summary.json" "$DEST/model_only_counterevidence_summary_v1.json"
          git add -f "$DEST/model_only_counterevidence_shadow_v1.json" "$DEST/model_only_counterevidence_summary_v1.json"
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -q -m 'qa(private): R19 original-native screen/hedge guard shadow [skip ci]'
            DONE=0
            for k in 1 2 3 4 5; do
              git fetch -q origin "$PRIVATE_BRANCH"
              git rebase -q "origin/$PRIVATE_BRANCH"
              if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then DONE=1; break; fi
              sleep "$k"
            done
            test "$DONE" = 1
          fi

  pressure-atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: analysis/igp-r19-native-temporal-20261104
      PIN: 61e35b9a63bc0e4f31b87222964d125fb518f38d
      DEST: gamepulse/fusion/qa/analysis/igp_r19_native_rebuild_v4_20261104
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public source confidentiality guard
        run: python3 tools/public_content_guard.py
      - name: Private evidence-graded physical two-defender pressure atlas
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          git sparse-checkout set gamepulse/fusion
          git fetch -q --depth=1 origin "$PIN"
          git checkout -q --detach "$PIN"
          test "$(git rev-parse HEAD)" = "$PIN"
          script=gamepulse/fusion/analysis/igp_r19_two_defender_pressure_atlas_v1.py
          python3 -B "$script" --root . --out "$RUNNER_TEMP/atlas.json" > "$RUNNER_TEMP/output" 2> "$RUNNER_TEMP/error" || {
            echo R19_PRIVATE_PRESSURE_ATLAS_FAILED_DIAGNOSTICS_REDACTED
            exit 1
          }
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])
          data=json.loads((p/"atlas.json").read_bytes())
          c=data["counts"]
          assert c["all_touches"]==1991
          assert c["r19_DOUBLE_CANDIDATE"]==179
          assert c["r13_double_not_reproduced"]==75
          assert c["new_r19_double_vs_r13"]==73
          assert data["production_promotion_allowed"] is False
          assert data["all_source_touch_boundaries_and_sha_reconciled"] is True
          agg={k:v for k,v in data.items()
               if k not in ("private_disagreement_review_queue","private_source_sha256")}
          (p/"atlas-summary.json").write_text(json.dumps(agg,sort_keys=True,indent=2)+"\n")
          public_keys=("all_touches","any_two_defender_pressure",
                       "any_native_two_defender_pressure",
                       "tactically_ambiguous_but_pressure_observed",
                       "r13_double_not_reproduced_native_pressure",
                       "r13_double_not_reproduced_neither_pressure",
                       "r19_double_native_blitz","r19_double_model_only_blitz")
          print("R19_TWO_DEFENDER_PRESSURE_ATLAS_SOURCE_QA_PASS",
                {k:c[k] for k in public_keys})
          PY
          git fetch -q origin "$PRIVATE_BRANCH"
          git checkout -q -B qa-pressure-atlas "origin/$PRIVATE_BRANCH"
          mkdir -p "$DEST"
          cp "$RUNNER_TEMP/atlas.json" "$DEST/two_defender_pressure_atlas_full_private_v1.json"
          cp "$RUNNER_TEMP/atlas-summary.json" "$DEST/two_defender_pressure_atlas_summary_v1.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$DEST/two_defender_pressure_atlas_full_private_v1.json" "$DEST/two_defender_pressure_atlas_summary_v1.json"
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -q -m 'qa(private): R19 two-defender pressure vs tactical classification source atlas [skip ci]'
            DONE=0
            for k in 1 2 3 4 5; do
              git fetch -q origin "$PRIVATE_BRANCH"
              git rebase -q "origin/$PRIVATE_BRANCH"
              if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then DONE=1; break; fi
              sleep "$k"
            done
            test "$DONE" = 1
          fi
