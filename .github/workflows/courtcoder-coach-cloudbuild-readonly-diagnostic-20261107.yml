# Read-only Cloud Build diagnosis: no deployment, source copy or credential output. Reviewed guard allowlist confirmed.
# Uses existing 104 WIF if policy allows this protected bridge runner.
name: CourtCoder Coach Cloud Build read-only failure diagnosis
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/courtcoder-coach-cloudbuild-readonly-diagnostic-20261107.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  build-diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce public repository confidentiality
        run: python3 tools/public_content_guard.py
      - name: Resolve existing private WIF settings without public source disclosure
        id: private_wif
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,pathlib,re,subprocess
          raw=subprocess.run(
             ["gh","api","repos/timeedmonds-maker/104/contents/.github/workflows/hoopvision-dev-control-plane.yml?ref=hoopvision-production"],
             capture_output=True,text=True,check=True)
          d=json.loads(raw.stdout)
          private=base64.b64decode(d["content"]).decode()
          fields={}
          for key in ("PROJECT_ID","WIF_PROVIDER","CONTROL_SA"):
              m=re.search(r"(?m)^  "+key+r": ([^\n]+)$",private)
              if not m:raise SystemExit("PRIVATE_WIF_CONFIG_MISSING")
              fields[key]=m.group(1)
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              for k,v in fields.items():out.write(k.lower()+"="+v+"\n")
          print("COACH_EXISTING_WIF_CONFIG_READ_FROM_PRIVATE_104")
          PY
      - name: Attempt read-only existing WIF authentication
        id: google_auth
        uses: google-github-actions/auth@v2
        continue-on-error: true
        with:
          workload_identity_provider: ${{ steps.private_wif.outputs.wif_provider }}
          service_account: ${{ steps.private_wif.outputs.control_sa }}
      - name: Query ONLY aggregate Cloud Build step statuses and build error classes
        env:
          PROJECT_ID: ${{ steps.private_wif.outputs.project_id }}
        if: steps.google_auth.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q google-auth google-api-python-client
          python3 - <<'PY'
          import google.auth
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError
          project=os.environ["PROJECT_ID"]
          client=build("cloudbuild","v1",cache_discovery=False)
          try:
              result=client.projects().locations().builds().list(
                  parent="projects/"+project+"/locations/asia-southeast1",pageSize=50
              ).execute()
          except HttpError as exc:
              print("COACH_GCP_BUILD_READ_DENIED",exc.resp.status)
              raise SystemExit(0)
          matching=[r for r in result.get("builds",[])
                    if str(r.get("id","")).startswith(("3217bff1","b7d48335"))
                    or (r.get("substitutions",{}).get("TRIGGER_NAME")=="integrated-pulse-coach-preview"
                        and r.get("substitutions",{}).get("BRANCH_NAME")=="feature/courtcoder-coach-web-20261106")]
          for b in matching[:5]:
              steps=b.get("steps",[])
              print("COACH_BUILD_READONLY_SUMMARY",
                    "id="+str(b.get("id",""))[:8],
                    "status="+str(b.get("status")),
                    "commit="+str(b.get("substitutions",{}).get("COMMIT_SHA",""))[:8],
                    "step_count="+str(len(steps)))
              for step in steps:
                  print("COACH_BUILD_PHASE",
                        str(step.get("id","UNKNOWN")),
                        str(step.get("status","UNKNOWN")))
              detail=(b.get("statusDetail") or "")
              if detail:
                  # No raw failure logs, secret payload or private GCS content.
                  summary=detail.splitlines()[0][:250]
                  print("COACH_BUILD_STATUS_DETAIL_CLASS",summary)
          if not matching:
              print("COACH_BUILD_READONLY_QUERY_RETURNED_NO_MATCH")
          PY
      - name: State WIF limitation explicitly
        if: steps.google_auth.outcome != 'success'
        run: echo "COACH_GCP_WIF_NOT_AUTHORIZED_FOR_PUBLIC_RUNNER_NO_CLOUD_DETAILS_OBTAINED"
