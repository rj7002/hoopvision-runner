name: Rockets Suns SHA original first-half tracking and official-PBP private QA
# Event-gated, source-first original NBA XYZ halftime post-analysis readiness.
# Never publish licensed actor, ball or other private per-observation data in public artifacts/logs.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gamepulse-rockets-0194-halftime-private-qa.yml
  workflow_dispatch:
  workflow_run:
    workflows:
      - Rockets Suns first-half fast parallel original XYZ capture
      - Rockets Suns 0022600194 original Game Pulse live XYZ catch-up
    types: [completed]
permissions: {contents: read}
concurrency:
  group: rockets-suns-0194-private-halftime-qa
  cancel-in-progress: false
jobs:
  source-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Confirm private licensed-source boundary
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
      - name: SHA-original source archives and NBA official PBP halftime check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rockets-halftime"
          gh release download gamepulse-live-sdk-0022600194 \
            --repo timeedmonds-maker/104 --pattern 'live-*' --dir "$RUNNER_TEMP/rockets-halftime"
          curl --fail --silent --show-error --retry 2 --max-time 20 \
            https://cdn.nba.com/static/json/liveData/playbyplay/playbyplay_0022600194.json \
            -o "$RUNNER_TEMP/rockets-halftime/pbp.json" || true
          python3 - <<'PY'
          import base64,collections,datetime,gzip,hashlib,json,math,os,subprocess,tarfile,time
          from pathlib import Path
          game="0022600194"
          root=Path(os.environ["RUNNER_TEMP"])/"rockets-halftime"
          sources=sorted(root.glob("live-*.tar.gz"))
          assert sources,"original_nba_xyz_archive_absent"
          count=collections.Counter()
          by_minute={}
          source_frames={}
          hashes={}
          for file in sources:
              side=file.with_name(file.name.replace(".tar.gz",".json"))
              assert side.is_file(),"missing_sha_sidecar"
              original=file.read_bytes()
              sha=hashlib.sha256(original).hexdigest()
              note=json.loads(side.read_text())
              assert note["archive_sha256"]==sha
              with tarfile.open(file,"r:gz") as t:
                  man=json.loads(t.extractfile("manifest.json").read())
                  assert man["game_id"]==game and man["observed"] is True and man["imputed"] is False
                  assert man["successful_windows"]==12
                  assert man["start_ms"]==note["start_ms"]
                  stream=t.extractfile("frames.jsonl.gz")
                  assert stream is not None
                  rows=[json.loads(x) for x in gzip.GzipFile(fileobj=stream) if x.strip()]
                  assert len(rows)==man["unique_keyframes"]
              minute=man["start_ms"]
              by_minute[str(minute)]={"source_sha256":sha,"five_second_windows":man["successful_windows"],
                  "keyframes":man["unique_keyframes"],"player_frames":man["frames_with_players"],
                  "ball_frames":man["frames_with_ball"],"empty_windows":man["empty_windows"]}
              hashes[file.name]=sha
              for r in rows:
                  ts=r.get("timestamp")
                  pos=r.get("positions") or {}
                  if type(ts)!=int or not isinstance(pos,dict):continue
                  n=sum(k!="ball" and isinstance(v,list) and len(v)>=3 and all(type(z) in (int,float) and math.isfinite(z) for z in v[:3]) for k,v in pos.items())
                  b=isinstance(pos.get("ball"),list) and len(pos["ball"])>=3 and all(type(z) in (int,float) and math.isfinite(z) for z in pos["ball"][:3])
                  if ts not in source_frames or n+int(b)>source_frames[ts][0]+int(source_frames[ts][1]):
                      source_frames[ts]=(n,b,r.get("interpolated"))
          assert source_frames,"native_xyz_missing"
          times=sorted(source_frames)
          count["source_unique_timestamps"]=len(times)
          count["source_frames_any_player"]=sum(v[0]>0 for v in source_frames.values())
          count["source_frames_ball"]=sum(v[1] for v in source_frames.values())
          count["source_frames_exact_ten_ball"]=sum(v[0]==10 and v[1] for v in source_frames.values())
          count["source_frames_at_least_ten_ball"]=sum(v[0]>=10 and v[1] for v in source_frames.values())
          count["sdk_total_5s_windows"]=sum(m["five_second_windows"] for m in by_minute.values())
          pbp_path=root/"pbp.json"
          pbp=None
          if pbp_path.is_file():
              try:pbp=json.loads(pbp_path.read_bytes())
              except (ValueError,UnicodeDecodeError):pass
          actions=(pbp or {}).get("game",{}).get("actions",[])
          def period(a):
              p=a.get("period")
              return p.get("number") if isinstance(p,dict) else p
          def millis(s):
              if not isinstance(s,str):return None
              try:return int(datetime.datetime.fromisoformat(s.replace("Z","+00:00")).timestamp()*1000)
              except (ValueError,TypeError):return None
          firsthalf=[a for a in actions if period(a) in (1,2)]
          timeactions=[millis(a.get("timeActual")) for a in firsthalf]
          timeactions=[t for t in timeactions if t is not None]
          second=[a for a in firsthalf if period(a)==2]
          halftime_confirmed=any(a.get("clock") in ("PT00M00.00S","PT00M00S","PT0S") or
              (str(a.get("actionType","")).lower()=="period" and "end" in str(a.get("subType","")).lower())
              for a in second)
          # Never equate SDK elapsed walltime with official clock or physical ball control.
          start=min(timeactions) if timeactions else None
          end=max(timeactions) if (timeactions and halftime_confirmed) else None
          required=[]
          if start is not None and end is not None and end>=start:
              a=start//60000*60000;b=end//60000*60000
              required=list(range(a,b+60000,60000))
          missing=[x for x in required if str(x) not in by_minute]
          empty_player=[x for x in required if str(x) in by_minute and by_minute[str(x)]["player_frames"]==0]
          empty_ball=[x for x in required if str(x) in by_minute and by_minute[str(x)]["ball_frames"]==0]
          by_period={}
          for period_number in (1,2):
              acts=[a for a in firsthalf if period(a)==period_number]
              by_period[str(period_number)]={
                  "official_pbp_actions":len(acts),
                  "field_goal_attempts":sum(str(a.get("actionType","")).lower() in ("2pt","3pt") for a in acts),
                  "made_field_goals":sum(str(a.get("actionType","")).lower() in ("2pt","3pt") and str(a.get("shotResult","")).lower()=="made" for a in acts),
                  "turnover_actions":sum(str(a.get("actionType","")).lower()=="turnover" for a in acts),
                  "rebounds":sum(str(a.get("actionType","")).lower()=="rebound" for a in acts),
              }
          doc={
              "schema":"igp.rockets-suns.halftime-private-original-source-readiness.v1",
              "game_id":game,
              "generated_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "source":"ORIGINAL_NBA_SDK_PLAYER_BALL_XYZ_PRIVATE_SHA",
              "official_pbp":"NBA_CDN_LIVEDATA_PBP" if isinstance(actions,list) and actions else "UNAVAILABLE",
              "official_pbp_original_sha256":hashlib.sha256(pbp_path.read_bytes()).hexdigest() if pbp_path.is_file() else None,
              "q2_terminal_event_confirmed":halftime_confirmed,
              "firsthalf_pbp_wallclock_interval_utc_ms":[start,end],
              "source_coverage":dict(count),
              "earliest_native_utc_ms":times[0],
              "latest_native_utc_ms":times[-1],
              "captured_minutes":len(by_minute),
              "captured_minutes_evidence":by_minute,
              "firsthalf_required_source_minutes_by_official_action_wallclock":len(required) if required else None,
              "missing_required_source_minutes":missing if required else None,
              "captured_minutes_without_player_xyz":empty_player if required else None,
              "captured_minutes_without_ball_xyz":empty_ball if required else None,
              "official_pbp_firsthalf":by_period,
              "full_firsthalf_sdk_source_windows_captured":bool(required) and not missing,
              "firsthalf_tracking_complete_certified":False,
              "official_exact_ten_and_physical_possession_certified":False,
              "original_archive_shas":hashes,
              "notes":"All source XYZ remain in private 104 release. Original SDK frames preserved without filtering; PBP action UTC bounds are approximate wallclock scope and do not certify exact live-play possession boundaries. Missing actor/ball positions remain missing. A full set of 5s responses does not mean complete player-ball tracking."
          }
          payload=(json.dumps(doc,sort_keys=True,separators=(",",":"))+"\n").encode()
          assert len(payload)<950000,"report_too_large"
          endpoint="repos/timeedmonds-maker/104/contents/gamepulse/live/halftime/0022600194.json"
          for attempt in range(12):
              old=subprocess.run(["gh","api",endpoint],capture_output=True,text=True)
              body={"branch":"main","message":"data(igp): SHA-private first-half Rockets Suns original SDK + official PBP QA [skip ci]",
                    "content":base64.b64encode(payload).decode()}
              if old.returncode==0:body["sha"]=json.loads(old.stdout)["sha"]
              p=subprocess.run(["gh","api","-X","PUT",endpoint,"--input","-"],input=json.dumps(body),capture_output=True,text=True)
              if p.returncode==0:break
              time.sleep(2+attempt)
          else:raise RuntimeError("private_halftime_qa_commit_failed")
          check=json.loads(subprocess.check_output(["gh","api",endpoint]))
          assert base64.b64decode(check["content"])==payload
          print("PRIVATE_ROCKETS_HALFTIME_QA_PERSISTED")
          print("OFFICIAL_HALFTIME_CONFIRMED",halftime_confirmed)
          print("ORIGINAL_SOURCE_MINUTES",len(by_minute))
          print("ORIGINAL_UNIQUE_NATIVE_TIMESTAMPS",len(times))
          print("SOURCE_TENPLUS_BALL_UNVERIFIED_IDENTITIES",count["source_frames_at_least_ten_ball"])
          print("FIRSTHALF_PBP_REQUIRED_MINUTES",len(required) if required else "UNKNOWN")
          print("FIRSTHALF_MISSING_SOURCE_MINUTES",len(missing) if required else "UNKNOWN")
          PY
