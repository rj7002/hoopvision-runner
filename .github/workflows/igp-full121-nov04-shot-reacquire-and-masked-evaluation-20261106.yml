# SHA-gated licensed SDK re-observation; private 104 only. No raw XY or biomechanics public.
name: IGP Full121 missing NBA shot source recovery and 14-game masked QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full121-nov04-shot-reacquire-and-masked-evaluation-20261106.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-full121-nov04-shot-qa
  cancel-in-progress: false
jobs:
  companion-shot-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {gid: '0022600186', tipoff: '2026-11-05T03:30:00Z'}
          - {gid: '0022600175', tipoff: '2026-11-05T00:30:00Z'}
          - {gid: '0022600179', tipoff: '2026-11-05T01:00:00Z'}
    env:
      GH_TOKEN: \${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      NBA_GAME_ID: \${{ matrix.gid }}
      NBA_TIPOFF_UTC: \${{ matrix.tipoff }}
      IGP_PRIVATE_CAPTURE_DIR: /tmp/full121-companion-reobserve
      IGP_SDK_INIT_TIMEOUT_MS: '26000'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Authorized SDK source reacquisition and SHA readback
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          (cd tools/licensed_feed && npm install --ignore-scripts --no-audit --no-fund --silent)
          mkdir -p "$IGP_PRIVATE_CAPTURE_DIR"
          for attempt in 1 2 3; do
            rm -f "$IGP_PRIVATE_CAPTURE_DIR/companion_original_sdk_response.json"
            if node tools/licensed_feed/companion_original_sdk_probe.mjs > "$RUNNER_TEMP/companion-private.log" 2>&1; then
              state="$(python3 - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ["IGP_PRIVATE_CAPTURE_DIR"])/"companion_probe_receipt.json"
          print(json.loads(p.read_bytes())["status"])
          PY
              )"
              echo "FULL121_SDK_REOBSERVE_STATUS $NBA_GAME_ID $state"
              if test "$state" = FULL_EVENT_RESPONSE_OBSERVED; then break; fi
            fi
            test "$attempt" -lt 3 || exit 71
            sleep "$((5*attempt))"
          done
      - name: Exact-shooter SDK source comparison and private immutable commit
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_full121_companion_reacquire_v1.py
          python3 gamepulse/fusion/igp_full121_companion_reacquire_v1.py \
             --root . --game-id "$NBA_GAME_ID" \
             --candidate "$IGP_PRIVATE_CAPTURE_DIR/companion_original_sdk_response.json" \
             --receipt "$IGP_PRIVATE_CAPTURE_DIR/companion_probe_receipt.json"
          folder="gamepulse/fusion/evidence/companion_sdk_original_$NBA_GAME_ID"
          qa="gamepulse/fusion/qa/igp_progress_20261030/full121_companion_reacquisition_$NBA_GAME_ID"_20261106.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$folder/sdk_reobserved_20261106.json" "$folder/sdk_supplemental_exact_20261106.json" "$qa"
          git diff --cached --check
          if git diff --cached --quiet; then echo FULL121_REOBSERVATION_ALREADY_COMMITTED; exit 0; fi
          git commit -q -m "data(igp): exact-source companion SDK recovery $NBA_GAME_ID"
          for attempt in $(seq 1 15); do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo "FULL121_COMPANION_SOURCE_PRIVATE_COMMITTED $NBA_GAME_ID"
              exit 0
            fi
            sleep "$((2*attempt))"
          done
          exit 79
  tracking-source-masked-evaluation:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: \${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Mask original observed actor before model and compare all 14 games
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_full121_nov04_masked_tracking_qa_20261106.py
          if ! python3 gamepulse/fusion/igp_full121_nov04_masked_tracking_qa_20261106.py \
            --root . --out "$RUNNER_TEMP/full121_masked_source_qa.json" > "$RUNNER_TEMP/private_masked.log" 2>&1; then
            echo FULL121_MASKED_REPLAY_FAILED
            tail -c 300 "$RUNNER_TEMP/private_masked.log" | sed -E 's/[^A-Za-z_0-9:.\n]/_/g'
            exit 77
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"full121_masked_source_qa.json").read_bytes())
          assert x["games"]==14 and len(x["per_game"])==14
          assert x["target_player_masked_before_model_and_anchor_selection"]
          assert x["independent_video_position_accuracy_certified"] is False
          print("FULL121_14GAME_MASKED_SOURCE_PROXY_REPLAY",
                x["source_proxy_player_xy_gate_pass"],len(x["failed_proxy_games"]))
          PY
      - name: Persist source-only holdout and retain Full92 as rollback
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          out=gamepulse/fusion/qa/igp_progress_20261030/full121_nov04_masked_tracking_qa_20261106.json
          cp "$RUNNER_TEMP/full121_masked_source_qa.json" "$out"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$out"
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "qa(igp): original player heldout Full121 new14 no premature 10Hz promotion"
          for i in $(seq 1 15); do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo FULL121_14GAME_MASKED_QA_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$((2*i))"
          done
          exit 79
