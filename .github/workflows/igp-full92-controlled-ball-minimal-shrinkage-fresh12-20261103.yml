name: Full92 controlled ball 25pct minimal correction fresh 12 game holdout
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full92-controlled-ball-minimal-shrinkage-fresh12-20261103.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  private-fresh12:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/full92-ball-control-persistence-shadow-20261103
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify public boundary and clone original private
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Test fresh12 cohort and game-cluster bootstrap
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m unittest discover -s gamepulse/fusion/tests -p 'test_igp_full92_ball_control_minimal_shrinkage_fresh12_v4.py' -v
      - name: Privately source-mask original NBA ball on exactly twelve new games
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_full92_ball_control_minimal_shrinkage_fresh12_v4.py \
            --root . --out gamepulse/fusion/qa/igp_fullx/full92_ball_control_fresh12_minimal_correction_20261103.json \
            >"$RUNNER_TEMP/full92-fresh12.log" 2>&1 || {
              echo FRESH12_PRIVATE_EVALUATION_FAILURE
              python3 - <<'PY'
          import os,re
          from pathlib import Path
          x=(Path(os.environ['RUNNER_TEMP'])/'full92-fresh12.log').read_text(errors='replace').splitlines()
          e=next((z for z in reversed(x) if re.match(r'^(?:ValueError|AssertionError|KeyError|TypeError|IndexError):',z)),None)
          if e:
              t,_,s=e.partition(':');v=s.strip().split(':')[0].split(' ')[0]
              print(t,v if re.fullmatch(r'[A-Z0-9_]{5,90}',v) else 'REDACTED')
          else: print('UNCLASSIFIED_PRIVATE_FAILURE')
          PY
              exit 41
            }
      - name: Verify frozen candidate provenance and emit aggregates only
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('gamepulse/fusion/qa/igp_fullx/full92_ball_control_fresh12_minimal_correction_20261103.json').read_bytes())
          assert d['games']==12 and len(d['ids'])==12
          assert len(set(d['prior6_excluded'])&set(d['ids']))==0
          assert d['frozen_candidate_weights']=={'1':0,'3':0.25,'5':0,'10':0}
          assert d['physical_control_certified']==0
          assert d['original_ball_source_target_excluded_from_estimator']
          for k,v in d['results'].items():
              assert v['candidate']['n']==v['exact_same_target_forward_linear']['n']
              assert v['source_masked_original_points']==v['candidate']['n']
          print('FULL92_FRESH12_NEW_UNSEEN_PRIVATE_QA_OK',json.dumps({
              'games':d['games'],'results':d['results'],
              'physical_ball_custody_certified':0},sort_keys=True))
          PY
      - name: Commit SHA verified source QA privately
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gamepulse/fusion/qa/igp_fullx/full92_ball_control_fresh12_minimal_correction_20261103.json
          git diff --cached --check
          if git diff --cached --quiet; then echo ALREADY_PRIVATE; exit 0; fi
          git commit -qm 'qa(igp): fresh12 original-NBA masked ball 25pct player-correction and cluster CI'
          gh auth setup-git
          for n in 1 2 3 4; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH" || exit 43
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo FULL92_FRESH12_CONTROL_MASK_QA_COMMITTED_PRIVATE
              exit 0
            fi
            sleep "$n"
          done
          exit 44
