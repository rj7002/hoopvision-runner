# Generic statistical-possession estimators compared to *published NBA Team POSS*;
# all original PBP and team-game QA private, public only aggregate accuracy.
name: FULL81 original PBP statistical POSS definition sensitivity
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full81-nba-poss-definition-private-20261102.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: full81-nba-poss-definition-source-audit-20261102
  cancel-in-progress: false
jobs:
  private-official-POSS-definition:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: analysis/igp-full81-statistical-possession-definition-20261102
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify public bridge and authenticate private repo
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Checkout immutable private source PBP, official NBA POSS, and accepted P2 QA
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          git sparse-checkout set --no-cone \
            /gamepulse/fusion/igp81_default_team_offrtg.py \
            /gamepulse/fusion/igp_full88_default_engine_v1.py \
            /gamepulse/fusion/universal_possession_alignment_2026.py \
            /gamepulse/fusion/igp_full81_published_nba_poss_definition_sensitivity_v1.py \
            /gamepulse/fusion/qa/igp81_nba_team_offrtg_reporting_default_v1.json \
            /gamepulse/fusion/qa/igp_fullx/shot_event_multiview_full88_v1.json \
            /gamepulse/fusion/qa/igp_fullx/full81_possession_terminal_sourcegraded_v2_20261102.json \
            /gamepulse/fusion/official_pbp_timing/games/
          python3 -m py_compile gamepulse/fusion/igp_full81_published_nba_poss_definition_sensitivity_v1.py
          python3 gamepulse/fusion/igp_full81_published_nba_poss_definition_sensitivity_v1.py --self-test
      - name: Compare two *generic*, not NBA-claimed, possession estimation formulae privately
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 gamepulse/fusion/igp_full81_published_nba_poss_definition_sensitivity_v1.py > "$RUNNER_TEMP/private-possession-diagnostic" 2>&1 || {
            python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('gamepulse/fusion/qa/igp_fullx/full81_published_poss_formula_private_failure_20261102.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          raw=(Path(os.environ['RUNNER_TEMP'])/'private-possession-diagnostic').read_text()
          p.write_text(json.dumps({'status':'FAILED','private_traceback':raw[-10000:]},sort_keys=True,indent=2)+'\\n')
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add --sparse -f gamepulse/fusion/qa/igp_fullx/full81_published_poss_formula_private_failure_20261102.json
            git commit -qm 'qa(private): preserve PBP possession sensitivity failure [skip ci]'
            git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH" || true
            echo "FULL81_GENERIC_POSS_SENSITIVITY_FAILED_DIAGNOSIS_PRIVATE"
            exit 1
          }
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('gamepulse/fusion/qa/igp_fullx/full81_published_nba_poss_definition_sensitivity_20261102.json')
          x=json.loads(p.read_bytes())
          assert x['game_count']==81 and x['team_games']==162
          assert x['source_verified_fga_total']>10000
          assert x['does_not_establish_NBA_POSS_provider_formula']
          assert x['does_not_mutate_NBA_published_POSS']
          print('FULL81_GENERIC_POSS_SOURCE_SENSITIVITY_RECONCILED',
                x['game_count'],x['team_games'],x['source_verified_fga_total'])
          for k,v in x['comparisons'].items():
            print('FULL81_GENERIC_POSS_PRIVATE_AGGREGATE',k,v['mean_absolute_difference'],v['rounded_matches_NBA_POSS'])
          PY
      - name: Commit source-grade per-team diagnostic only to private 104
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f gamepulse/fusion/qa/igp_fullx/full81_published_nba_poss_definition_sensitivity_20261102.json
          git diff --cached --check
          if git diff --cached --quiet; then echo P2_PRIVATE_HEURISTIC_QA_ALREADY_IDENTICAL; exit 0; fi
          git commit -qm 'qa(private): preserve NBA POSS versus generic estimate diagnostic, no promotion [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH"
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo P2_SOURCE_PRIVATE_STATISTICAL_FORMULA_RECEIPT
              exit 0
            fi
            sleep "$attempt"
          done
          exit 25
