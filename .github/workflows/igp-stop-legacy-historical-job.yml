name: Stop incorrectly selected historical legacy reconstruction
'on':
  push:
    branches: [main]
    paths: [.github/workflows/igp-stop-legacy-historical-job.yml]
  workflow_dispatch:
permissions: {contents: read, actions: write}
jobs:
  stop:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Stop exactly the incorrectly selected legacy historical reconstruction
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh run cancel 41978606456 --repo timeedmonds-maker/hoopvision-runner
          gh api repos/timeedmonds-maker/hoopvision-runner/actions/runs/41978606456 --jq '{status: .status, conclusion: .conclusion, name: .name}'
          echo LEGACY_HISTORICAL_RUN_CANCELLATION_REQUESTED
