# Metadata-only public orchestration. NBA XYZ/events/player rows and derived detailed QA remain in private 104.
name: IGP Full123 R13 final 123-game SHA and Houston9 private QA
on:
  push:
    branches: [feature/igp-full123-r13-public-cpu-20261107]
    paths: ['.github/workflows/igp-full123-r13-final-source-qa-20261107.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: full123-r13-123-private-replay-20261107
  cancel-in-progress: false
jobs:
  private-final-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: feature/igp-full123-r13-touch-integration-20261107
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce reviewed public/private source boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Sparse clone immutable catalogs and all 123 private R13 receipts
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/full123-final-original-source"
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" "https://github.com/$PRIVATE_REPO.git" "$work"
          cd "$work"
          git sparse-checkout set --no-cone \
            '/gamepulse/fusion/*.py' \
            '/gamepulse/fusion/analysis/*.py' \
            '/gamepulse/fusion/tests/test_igp_full123_r13_touch_overlay_v1.py' \
            '/gamepulse/fusion/qa/igp_progress_20261030/igp_full121_default_source_release_v1.json' \
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/index.json' \
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/post56_additive_20261028/index.json' \
            '/gamepulse/fusion/qa/igp_progress_20261107/full123_post121_source_acceptance.json' \
            '/gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/002260*.json' \
            '/gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/shards/*.json' \
            '/gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/verified_5game/*.json'
          export PYTHONPATH="$work:$work/gamepulse/fusion:$work/gamepulse/fusion/analysis"
          python3 -m unittest -q \
            gamepulse.fusion.analysis.test_igp_r13_touch_stats_v2 \
            gamepulse.fusion.analysis.test_igp_full123_r13_touch_overlay_v1 \
            gamepulse.fusion.tests.test_igp_full123_r13_touch_overlay_v1
          echo FULL123_R13_DETERMINISTIC_SOURCE_FREE_REGRESSIONS_PASSED
      - name: Reconcile every immutable game SHA and run nine-game Houston benchmark
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/full123-final-original-source"
          cd "$work"
          export PYTHONPATH="$work:$work/gamepulse/fusion:$work/gamepulse/fusion/analysis"
          python3 gamepulse/fusion/analysis/igp_full123_r13_private_reduce_v1.py --root .
          python3 - <<'PY'
          import collections,hashlib,json
          from pathlib import Path
          from gamepulse.fusion import igp_full123_r13_touch_overlay_v1 as model
          from gamepulse.fusion.analysis import igp_full123_r13_prior_verified_v1 as prior
          from gamepulse.fusion.analysis.igp_full123_r13_houston_nine_game_screenshot_qa_20261107 import summarize
          from gamepulse.fusion.analysis.igp_full123_r13_private_persist_v1 import OUT,gh_put
          root=Path('.')
          ids=model.original_cohort(root)
          dec=json.loads((root/OUT/'full123_123_game_execution_decision.json').read_bytes())
          assert len(ids)==123 and dec['passing_source_replay_games']==123
          assert dec['technical_123_game_replay_complete'] is True
          assert dec['missing_or_abstained_games']==0 and dec['missing_shards']==[]
          assert len(dec['result_sha256_by_game'])==123
          assert dec['production_global_promotion_allowed'] is False
          counts=collections.Counter()
          totals=collections.Counter()
          for gid in ids:
              p=root/OUT/(gid+'.json')
              raw=p.read_bytes()
              assert hashlib.sha256(raw).hexdigest()==dec['result_sha256_by_game'][gid]
              data=json.loads(raw)
              assert data['game_id']==gid and data['source_original_modified'] is False
              assert data['default_R13_pressure_detector_changed'] is False
              assert sum(z['touches'] for z in data['player_stats'].values())==data['accepted_touch_episodes']
              counts[data['clock_source_grade']]+=1
              totals['touches']+=data['accepted_touch_episodes']
              totals['frontcourt_touches']+=sum(z['frontcourt_touches'] for z in data['player_stats'].values())
          assert sum(counts.values())==123
          baseline=prior.summary(root)
          assert baseline['validated_R13_game_ids'] is not None
          assert baseline['validated_R13_player_game_count_games']==5
          hou=summarize(root)
          assert hou['selected_game_count']==9 and hou['status']=='NINE_GAME_COHORT_IDENTIFIED_AND_RECONCILED'
          assert hou['official_screenshot_player_count']==14
          assert hou['reference_is_exact_unrounded_source'] is False
          qa={
              'schema':'igp.full123.r13-123-original-source-grade-census.v1',
              'cohort':'FULL123','source_replay_passed_games':123,
              'original_game_receipts_sha_reconciled':123,
              'clock_source_grades':dict(counts),
              'touches_all_games':totals['touches'],
              'frontcourt_touches_all_games':totals['frontcourt_touches'],
              'nine_game_houston_comparison_reconciled':True,
              'five_game_houston_regression_preserved':True,
              'original_nba_tracking_modified':False,
              'full121_release_modified':False,
              'independently_NBA_touch_accuracy_certified':False,
              'global_R13_default_promoted':False,
          }
          gh_put(str(OUT/'full123_123_game_source_grade_census.json'),
                 (json.dumps(qa,indent=2,sort_keys=True)+'\n').encode())
          print('FULL123_R13_EXACT_GAME_SHA_CENSUS_PASSED',123)
          print('FULL123_R13_CLOCK_SOURCE_GRADE_COUNTS',dict(counts))
          print('FULL123_R13_HOUSTON_NINE_GAME_COHORT_RECONCILED',hou['selected_game_count'])
          PY
          python3 gamepulse/fusion/analysis/igp_full123_r13_houston_nine_game_screenshot_qa_20261107.py
          echo FULL123_R13_123_GAMES_FINAL_PRIVATE_TECHNICAL_ACCEPTANCE_PASSED
