name: CPU Animate Amen732 six original NBA videos and all native XYZ CPU join

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cpu-animate-amen732-direct6-original-native-cpu-join.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-animate-amen732-direct-original-6-pts-native
  cancel-in-progress: false

jobs:
  direct-nba-hls-original-xyz-source-join:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      CUDA_VISIBLE_DEVICES: '-1'
      NVIDIA_VISIBLE_DEVICES: none
      OPENCV_OPENCL_RUNTIME: disabled
      OPENBLAS_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
      OMP_NUM_THREADS: '3'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public repository leak prevention
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from tools.public_content_guard import scan
          if scan(['.github/workflows/cpu-animate-amen732-direct6-original-native-cpu-join.yml']):
            raise SystemExit('PRIVATE_BASKETBALL_SOURCE_PUBLIC_GUARD_FAILED')
          print('AMEN732_CPU_ONLY_PUBLIC_PRIVATE_SECURITY_GUARD_OK')
          PY

      - name: Native NBA source and six official clips CPU-only pairing
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo 'PRIVATE_GIT_TRANSPORT_AUTH_MISSING'; exit 4; }
          if compgen -G '/dev/nvidia*' >/dev/null; then
            echo 'GPU_HARDWARE_UNEXPECTED'; exit 5
          fi
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          python3 -m pip install -q --disable-pip-version-check numpy scipy opencv-python-headless
          ROOT="$(mktemp -d)"
          chmod 700 "$ROOT"
          trap 'rm -rf "$ROOT"' EXIT
          gh auth setup-git
          REPO='https://github.com/timeedmonds-maker/104.git'
          git clone -q --filter=blob:none --depth=1 --sparse \
            -b 'research/gamepulse-clock-boundary-integrity-20261025' \
            "$REPO" "$ROOT/private"
          if test "$(git -C "$ROOT/private" rev-parse HEAD)" != \
            'e457df5aa4c421a2cf61afa6f1c1624939d377d2'; then
            echo 'ORIGINAL_NATIVE_SOURCE_COMMIT_CHANGED_NO_RECONCILIATION'; exit 4
          fi
          git -C "$ROOT/private" sparse-checkout set --no-cone \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600009/ \
            /gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/companion_app_packages_all56_v1/0022600009/ \
            /gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/shot_biomechanics_all56_v2/0022600009.jsonl.gz \
            /gamepulse/fusion/official_pbp_timing/games/0022600009.json \
            /data/extensions/nba_blueprint_2026_27/games/0022600009/blueprint_report_raw.json
          git clone -q --filter=blob:none --depth=1 --sparse \
            -b 'cpu-animate/m0-m1-validation-core-20261107' \
            "$REPO" "$ROOT/engine"
          git -C "$ROOT/engine" sparse-checkout set --no-cone \
            /cpu_animate/amen732_native_video_cpu_alignment.py
          mkdir -p "$ROOT/video"
          echo 'AMEN732_CPU_DIRECT_NBA_SOURCE_ACQUISITION_STARTED'
          python3 tools/amen732_official_sixvideo_acquire.py \
            --root "$ROOT/video" --ffmpeg ffmpeg --ffprobe ffprobe
          for movie in "$ROOT/video"/*.mp4; do
            ffmpeg -nostdin -hide_banner -v error \
              -threads 3 -hwaccel none -i "$movie" \
              -map 0:v:0 -an -sn -f null -
          done
          python3 tools/amen732_sixview_audio_alignment_v2.py \
            --source "$ROOT/video" --ffmpeg ffmpeg \
            --broadcast-seed 9.4 --out "$ROOT/video/audio_CPU_candidate.json"
          python3 "$ROOT/engine/cpu_animate/amen732_native_video_cpu_alignment.py" \
            --private-root "$ROOT/private" \
            --video-root "$ROOT/video" \
            --out "$ROOT/engine/docs/cpu_animate/qa/amen732_native_sixvideo_CPU_original_utc_candidate.json"
          cd "$ROOT/engine"
          test -f docs/cpu_animate/qa/amen732_native_sixvideo_CPU_original_utc_candidate.json
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('docs/cpu_animate/qa/amen732_native_sixvideo_CPU_original_utc_candidate.json')
          x=json.loads(p.read_text())
          assert x['source_game']=='0022600009'
          assert x['strict_CPU_only'] is True
          assert len(x['source_authentic_sixview_video']['views'])==6
          assert not x['video_pts_to_native_original_UTC_physically_accepted']
          assert not x['original_video_in_broadcast_AR_render_accepted']
          assert x['source_original_tracking']['verified_full_game_original_native_timestamps']==34979
          print('AMEN732_SOURCE_JOIN_PRIVATE_QA_SCHEMA_AND_SIX_VIEWS_PASS')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs/cpu_animate/qa/amen732_native_sixvideo_CPU_original_utc_candidate.json
          git diff --cached --check
          git commit -qm 'evidence(cpu-animate): exact Amen block source-native data vs six direct HLS video PTS and audio, CPU candidate only'
          for retry in 1 2 3 4 5 6; do
            git fetch -q origin 'cpu-animate/m0-m1-validation-core-20261107'
            git rebase -q 'origin/cpu-animate/m0-m1-validation-core-20261107'
            if git push -q origin 'HEAD:refs/heads/cpu-animate/m0-m1-validation-core-20261107'; then
              echo 'AMEN732_CPU_NATIVE_VIDEO_ORIGINAL_PRIVATE_QA_COMMITTED'
              exit 0
            fi
            sleep "$retry"
          done
          echo 'AMEN732_ORIGINAL_QA_GIT_PUSH_UNRESOLVED'
          exit 9

      - name: Public privacy and scope
        if: always()
        shell: bash
        run: |
          echo 'Original NBA player/ball 3D and all video/audio are private and ephemeral.'
          echo 'Only source-safe count/QA results appear in public logs.'
          echo 'CPU software-only, no GPU, no synthetic footage; contact frame and PTS-to-UTC remain provisional until visual physical holdout.'
