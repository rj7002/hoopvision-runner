name: CourtCoder Coach Full666 plus Full123 original source census
on:
  push:
    branches: [main]
    paths: [.github/workflows/courtcoder-coach-two-season-pps-source-inventory-20261107.yml, tools/public_content_guard.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Read SHA-verified PRIVATE Full666 and Full123 original NBA sources
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          mkdir -p "$RUNNER_TEMP/coach-source"
          gh release download igp-2025-26-source-feature-census-20261105 --repo timeedmonds-maker/104 --pattern historical-source-feature-census.json --dir "$RUNNER_TEMP/coach-source"
          gh api 'repos/timeedmonds-maker/104/contents/gamepulse/fusion/qa/igp_fullx/shot_event_multiview_fullx_v2_latest.json?ref=research/gamepulse-clock-boundary-integrity-20261025' --jq .content | base64 -d > "$RUNNER_TEMP/coach-source/pointer.json"
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,subprocess
          d=pathlib.Path(os.environ["RUNNER_TEMP"])/"coach-source"
          hist=json.loads((d/"historical-source-feature-census.json").read_bytes())
          ptr=json.loads((d/"pointer.json").read_bytes())
          assert hist["schema"]=="igp.historical-source-feature-census.v1" and hist["source_tracking_games"]==666
          assert ptr["game_count"]==123 and ptr["schema"]=="igp.fullx.multiview-latest-pointer.v2"
          def get(path):
              url="repos/timeedmonds-maker/104/contents/"+path+"?ref=research/gamepulse-clock-boundary-integrity-20261025"
              obj=json.loads(subprocess.run(["gh","api",url],capture_output=True,check=True).stdout)
              assert obj["encoding"]=="base64"
              return base64.b64decode(obj["content"])
          assert ptr["index_path"].startswith("gamepulse/fusion/qa/igp_fullx/shot_event_multiview_FULL123_")
          raw=get(ptr["index_path"])
          assert hashlib.sha256(raw).hexdigest()==ptr["index_sha256"]
          idx=json.loads(raw)
          assert idx["game_count"]==123 and len(idx["games"])==123
          counts=idx["counts"];assert counts["official_fga"]>=21000
          verified=0
          for game in sorted(idx["games"])[-2:]:
              item=idx["games"][game]
              blob=get(item["shots_path"])
              assert hashlib.sha256(blob).hexdigest()==item["shot_sha256"]
              rows=[json.loads(x) for x in gzip.decompress(blob).splitlines() if x]
              assert len(rows)==item["counts"]["official_fga"]
              if game==sorted(idx["games"])[-1]:
                  record=rows[0]
                  print("COACH_CURRENT_FGA_SOURCE_FIELD_NAMES",",".join(sorted(record)))
                  for key in ("official_nba_shot_event","companion_original_shot_metadata",
                              "blueprint_original_shot","original_native_nearest_release_frame",
                              "original_native_nearest_official_event_frame"):
                      val=next((row.get(key) for row in rows if isinstance(row.get(key),dict)),None)
                      if isinstance(val,dict):
                          print("COACH_CURRENT_FGA_NESTED_FIELDS",key,",".join(sorted(val)))
                  from collections import Counter
                  shottypes=Counter(str(r.get("official_nba_shot_event",{}).get("action_subtype"))
                                    for r in rows)
                  print("COACH_CURRENT_FGA_ACTION_SUBTYPE_TOP",
                        json.dumps(shottypes.most_common(18)))
                  frames=[r.get("original_native_nearest_official_event_frame")
                          for r in rows if isinstance(r.get("original_native_nearest_official_event_frame"),dict)]
                  print("COACH_CURRENT_FGA_EVENT_NATIVE_FRAME_COVERAGE",
                        len(frames),"of",len(rows))
                  from collections import Counter
                  grades=Counter(str(p.get("original_frame_source_grade")) for p in frames)
                  offset=Counter("<=100" if isinstance(p.get("delta_from_anchor_ms"),(int,float)) and abs(p["delta_from_anchor_ms"])<=100 else
                                "<=250" if isinstance(p.get("delta_from_anchor_ms"),(int,float)) and abs(p["delta_from_anchor_ms"])<=250 else ">250" for p in frames)
                  native=Counter(str(p.get("native_player_count")) for p in frames)
                  print("COACH_CURRENT_EVENT_SOURCE_FRAME_GRADES",json.dumps(dict(grades),sort_keys=True))
                  print("COACH_CURRENT_EVENT_SOURCE_CLOCK_DELTA",json.dumps(dict(offset),sort_keys=True))
                  print("COACH_CURRENT_EVENT_SOURCE_PLAYER_COUNTS",json.dumps(dict(native),sort_keys=True))
                  print("COACH_CURRENT_NATIVE_CHUNK_POINTER_KIND",
                        type(frames[0].get("native_chunk")).__name__,
                        "chunk_id_or_path_form",str(frames[0].get("native_chunk")).split("/")[-1][:38])
                  for fld in ("x","y"):
                      vals=[(r.get("blueprint_original_shot") or {}).get(fld) for r in rows]
                      vals=[v for v in vals if isinstance(v,(int,float))]
                      print("COACH_CURRENT_BLUEPRINT_POSITION_RANGE",fld,len(vals),
                            round(min(vals),2) if vals else None,round(max(vals),2) if vals else None)
                  src=rows[0].get("blueprint_original_shot")
                  print("COACH_CURRENT_BLUEPRINT_SUCCESS_TYPES",
                        json.dumps(dict(Counter(type((r.get("blueprint_original_shot") or {}).get("success")).__name__ for r in rows))))
              verified+=len(rows)
          receipt={"schema":"igp.coach.real-two-season-source-census.v1",
                   "full666_original_games":666,
                   "full666_shotdetail_events":hist.get("companion_event_counts",{}).get("ShotDetails#show",0),
                   "full123_games":123,"full123_official_fga":counts["official_fga"],
                   "full123_native_250ms":counts.get("native_official_event_250ms"),
                   "full123_source_release_time":counts.get("source_release_time"),
                   "full123_companion_exact":counts.get("companion_exact"),
                   "full123_exact_FGA_sample_rows_sha_verified":verified,
                   "full123_index_sha256":ptr["index_sha256"],
                   "full666_census_sha256":hashlib.sha256((d/"historical-source-feature-census.json").read_bytes()).hexdigest(),
                   "seven_actions_normalized_for_both_seasons":False,
                   "identical_defender_pressure_verified_at_shot_release":False,
                   "independent_model_game_holdout_passed":False,
                   "model_promoted":False}
          (d/"readiness.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print("COACH_REAL_TWO_SEASON_ORIGINAL_SOURCE_CENSUS_PASS",
                "Full666_games",666,
                "historical_shotdetails_events",receipt["full666_shotdetail_events"],
                "Full123_games",123,"current_FGA",counts["official_fga"],
                "exact_current_FGA_rows_checked",verified)
          PY
      - name: Audit real historical xFG and shot-level defender data, private only
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/coach-source/historical-shot-sample"
          mkdir -p "$dir"
          if ! gh release download igp-2025-26-xfg-archive-20261105 \
              --repo timeedmonds-maker/104 \
              --pattern 'nba-xfg-nba-2025-26-shard-001*' --dir "$dir" \
              > "$RUNNER_TEMP/hist-xfg-download.log" 2>&1; then
            echo COACH_2025_XFG_DRAFT_SOURCE_NOT_ACCESSIBLE_TO_RUNNER
            exit 0
          fi
          if ! gh release download igp-2025-26-defender-xyz-proxy-20261105 \
              --repo timeedmonds-maker/104 \
              --pattern 'defender-xyz-nba-2025-26-shard-001*' \
              --pattern 'defender-summary-nba-2025-26-shard-001.json' \
              --dir "$dir" > "$RUNNER_TEMP/hist-defender-download.log" 2>&1; then
            echo COACH_2025_DEFENDER_DRAFT_SOURCE_NOT_ACCESSIBLE_TO_RUNNER
            exit 0
          fi
          python3 - <<'PY'
          import collections,gzip,json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"coach-source/historical-shot-sample"
          names=["nba-xfg-nba-2025-26-shard-001",
                 "defender-xyz-nba-2025-26-shard-001"]
          for name in names:
              path=root/(name+".jsonl.gz")
              qa=json.loads((root/(name+"-qa.json")).read_bytes())
              assert path.is_file()
              rows=[json.loads(line) for line in gzip.decompress(path.read_bytes()).splitlines() if line]
              assert rows
              shapes=collections.Counter(tuple(sorted(r)) for r in rows if isinstance(r,dict))
              identifiers=collections.Counter(k for r in rows if isinstance(r,dict) for k,v in r.items()
                                            if any(term in k.lower() for term in ("shot","release","defend","cont","xfg","dist","xyz")))
              print("COACH_REAL_HIST_SOURCE_SHARD_ACCESS_PASS",
                    "type",name.split("-nba-")[0],"rows",len(rows),
                    "schema_variants",len(shapes),"shot_evidence_keys",
                    ",".join(sorted(identifiers)[:25]),
                    "qa_schema",str(qa.get("schema"))[:95])
          summary=json.loads((root/"defender-summary-nba-2025-26-shard-001.json").read_bytes())
          print("COACH_HIST_DEFENDER_AGGREGATE_SUMMARY_FIELDS",
                ",".join(sorted(summary.keys())[:25]))
          import collections
          source_rows=[json.loads(l) for l in gzip.decompress((root/"defender-xyz-nba-2025-26-shard-001.jsonl.gz").read_bytes()).splitlines() if l]
          print("COACH_HIST_DEFENDER_ROW_FIELD_NAMES",",".join(sorted(source_rows[0].keys())))
          shots=collections.Counter()
          for r in source_rows:
              for field in ("release_time_source_grade","primary_contest_confidence","primary_contest_is_blueprint_label"):
                  shots[str(field)+"="+str(r.get(field))]+=1
              shots["shooter_xyz_present"]+=int(r.get("shooter_xyz_ft") is not None)
              shots["defenders_count_ge5"]+=int(isinstance(r.get("defenders"),list) and len(r["defenders"])>=5)
              shots["NBA_shot_record_present"]+=int(isinstance(r.get("source_nba_shot_record"),dict))
          print("COACH_HIST_SOURCE_PRESSURE_GRADE_COUNTS",json.dumps(dict(shots),sort_keys=True))
          histtypes=collections.Counter(str((r.get("source_nba_shot_record") or {}).get("shotType")) for r in source_rows)
          events=collections.Counter(str((r.get("source_nba_shot_record") or {}).get("actionType")) for r in source_rows)
          offsets=collections.Counter("0-100ms" if abs(r.get("event_frame_delta_ms") or 99999)<=100
                                else "101-250ms" if abs(r.get("event_frame_delta_ms") or 99999)<=250
                                else "over250ms" for r in source_rows)
          print("COACH_HIST_SHOT_TYPE_COUNTS_TOP",json.dumps(histtypes.most_common(20)))
          print("COACH_HIST_ACTION_TYPE_COUNTS_TOP",json.dumps(events.most_common(15)))
          print("COACH_HIST_EVENT_FRAME_OFFSET_BINS",json.dumps(dict(offsets),sort_keys=True))
          fields=source_rows[0].get("shooter_xyz_ft")
          print("COACH_HIST_SHOOTER_POSITION_FIELDS",",".join(sorted(fields)) if isinstance(fields,dict) else type(fields).__name__)
          defender=next((d for r in source_rows for d in (r.get("defenders") or []) if isinstance(d,dict)),{})
          print("COACH_HIST_DEFENDER_POSITION_FIELDS",",".join(sorted(defender)))
          for fld in ("locX","locY"):
              vals=[(r.get("source_nba_shot_record") or {}).get(fld) for r in source_rows]
              vals=[v for v in vals if isinstance(v,(int,float))]
              print("COACH_HIST_ORIGINAL_SHOT_POSITION_RANGE",fld,len(vals),
                    round(min(vals),2) if vals else None,round(max(vals),2) if vals else None)
          print("COACH_HIST_ORIGINAL_SUCCESS_TYPES",
                json.dumps(dict(collections.Counter(type((r.get("source_nba_shot_record") or {}).get("success")).__name__
                                                for r in source_rows))))
          for name in ("source_nba_shot_record","release_proxy_evidence","source_shot_quality_xfg"):
              sample=next((r.get(name) for r in source_rows if isinstance(r.get(name),dict)),{})
              print("COACH_HIST_NESTED_FIELD_NAMES",name,",".join(sorted(sample)))

          PY
      - name: Execute actual two-season native 5v5 event-time pressure pilot (PRIVATE)
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/coach-source"
          gh api 'repos/timeedmonds-maker/104/contents/courtcoder/coach/qa/two_season_native_event_pressure_v1.py?ref=feature/courtcoder-coach-web-20261106' \
            --jq .content | base64 -d > "$root/two_season_native_event_pressure_v1.py"
          python3 - <<'PY'
          import base64,hashlib,importlib.util,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"coach-source"
          spec=importlib.util.spec_from_file_location("real_coach",root/"two_season_native_event_pressure_v1.py")
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          def get(path,ref="research/gamepulse-clock-boundary-integrity-20261025"):
              resource="repos/timeedmonds-maker/104/contents/"+path+"?ref="+ref
              obj=json.loads(subprocess.run(["gh","api",resource],capture_output=True,check=True).stdout)
              assert obj["encoding"]=="base64","PRIVATE_SOURCE_BLOB_NOT_AVAILABLE"
              return base64.b64decode(obj["content"])
          historic=root/"historical-shot-sample"
          blob=(historic/"defender-xyz-nba-2025-26-shard-001.jsonl.gz").read_bytes()
          qa=(historic/"defender-xyz-nba-2025-26-shard-001-qa.json").read_bytes()
          old,oldcounts=module.historical_rows(blob,qa)
          ptr=json.loads((root/"pointer.json").read_bytes())
          idxraw=get(ptr["index_path"])
          assert hashlib.sha256(idxraw).hexdigest()==ptr["index_sha256"]
          idx=json.loads(idxraw)
          game="0022600188"
          row=idx["games"][game]
          source=get(row["shots_path"])
          assert hashlib.sha256(source).hexdigest()==row["shot_sha256"]
          native_base="gamepulse/fusion/materialized/igp_all_original_xyz/"+game+"/"
          native=get(native_base+"index.json")
          official_box=get("gamepulse/fusion/official_pbp_timing/original_nba_20261029/"+game+"/boxscore.json")
          imported=[]
          def read_chunk(name):
              assert name.startswith("original-native-") and name.endswith(".jsonl.gz") and "/" not in name
              imported.append(name)
              return get(native_base+name)
          now,newcounts,chunks=module.current_rows(source,native,official_box,read_chunk)
          assert len(old)>0 and len(now)>0,"NO_REAL_CROSS_SEASON_FGA_SOURCE_SCENES"
          receipt=module.qa_result(old,now,oldcounts,newcounts,
              {"Full666_historical_shard_sha256":hashlib.sha256(blob).hexdigest(),
               "Full123_shot_sha256":row["shot_sha256"],
               "Full123_original_native_manifest_sha256":hashlib.sha256(native).hexdigest()})
          output=root/"pilot"
          module.write(output,old+now,receipt)
          assert receipt["promoted_to_live_coach"] is False
          print("COACH_REAL_ORIGINAL_XY_PRESSURE_PILOT_PASS",
              "Full666_qualified_FGA",len(old),"Full123_qualified_FGA",len(now),
              "Full123_original_chunks_SHA",chunks,
              "Full666_source_rejections",json.dumps(oldcounts,sort_keys=True),
              "Full123_source_rejections",json.dumps(newcounts,sort_keys=True))
          print("COACH_PRESSURE_GRADE",receipt["grade"],"NBA_release_time_certified",False,
                "shot_actions_certified",False)
          PY
      - name: Publish SOURCE-ONLY aggregate readiness to private GitHub release
        shell: bash
        run: |
          set -euo pipefail
          TAG=igp-coach-pps-two-season-readiness-20261107
          REPO=timeedmonds-maker/104
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --target research/gamepulse-clock-boundary-integrity-20261025 --title 'Private Full666 and Full123 Coach source readiness' --notes 'SHA-verified source inventory, NOT accepted PPS model'
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/coach-source/readiness.json" --repo "$REPO" --clobber
          gh release upload "$TAG" "$RUNNER_TEMP/coach-source/pilot/source-event-pressure-fga.jsonl.gz" "$RUNNER_TEMP/coach-source/pilot/source-event-pressure-qa.json" --repo "$REPO" --clobber
          echo COACH_PRIVATE_TWO_SEASON_SOURCE_READINESS_PUBLISHED
