name: CPU Animate V22 original Broadcast possession handoff contact review
on:
  push:
    branches: ['cpu-animate-v22-ground-lock-control-20261110']
    paths: ['.github/workflows/opaque-private-cpu-durant-sengun-sequential-replays.yml']
permissions:
  contents: read
jobs:
  original-video-source-contact:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      CUDA_VISIBLE_DEVICES: '-1'
      NVIDIA_VISIBLE_DEVICES: none
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public safety and CPU boundary
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN" && test ! -e /dev/nvidia0 && test ! -e /dev/kfd
      - name: Exact original NBA video PTS contact sheet for ball control
        run: |
          set -euo pipefail
          ROOT="$(mktemp -d)"; chmod 700 "$ROOT"
          trap 'rm -rf "$ROOT"' EXIT
          gh auth setup-git >/dev/null 2>&1
          git clone -q --depth=1 --filter=blob:none --sparse \
            --branch cpu-animate/min0181-v22-floor-and-possession-20261110 \
            https://github.com/timeedmonds-maker/104.git "$ROOT/private"
          git -C "$ROOT/private" sparse-checkout set --no-cone '/cpu_animate/'
          mkdir -p "$ROOT/media" "$ROOT/out"
          gh release download cpu-animate-min-ato-0022600181-653-original-cpu \
            --repo timeedmonds-maker/104 --dir "$ROOT/media" \
            --pattern 'angle-broadcast.mp4' --pattern 'angle-broadcast.json'
          python3 -m pip install -q numpy opencv-python-headless
          cd "$ROOT/private"
          env -u GH_TOKEN -u GITHUB_TOKEN python3 -m cpu_animate.min0181_possession_video_review_v22 \
            --media "$ROOT/media" --out "$ROOT/out"
          python3 - "$ROOT/out" <<'PY'
          import base64,json,subprocess,sys
          from pathlib import Path
          folder=Path(sys.argv[1])
          branch='cpu-animate/min0181-v22-floor-and-possession-20261110'
          for p in sorted(folder.glob('v22_original_ball_handoff_pts_*.jpg')):
              # Base64-preserved original source JPEG, no public runner artifacts
              data=base64.b64encode(p.read_bytes()).decode()+'\n'
              target='repos/timeedmonds-maker/104/contents/docs/cpu_animate/'+p.name+'.b64.txt'
              payload={'message':'qa(cpu animate v22): privately review exact NBA original Broadcast ball handoff',
                  'branch':branch,'content':base64.b64encode(data.encode()).decode()}
              old=subprocess.run(['gh','api',target+'?ref='+branch],capture_output=True,text=True)
              if old.returncode==0:payload['sha']=json.loads(old.stdout)['sha']
              response=subprocess.run(['gh','api','-X','PUT',target,'--input','-'],
                                    input=json.dumps(payload),capture_output=True,text=True)
              if response.returncode:raise RuntimeError('PRIVATE_ORIGINAL_HANDOFF_FRAME_SAVE_FAILED')
          print('V22_SOURCE_VIDEO_FRAME_HANDOFF_CONTACT_SHEETS_COMPLETE')
          PY
