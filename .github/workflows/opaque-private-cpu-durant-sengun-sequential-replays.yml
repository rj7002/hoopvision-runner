name: CPU Animate V9 source-verified stable floor and green, SHA-pinned segmentation
# Original pixel-anchor KD seed fix: source-video identity diagnostic V6 rerun
on:
  push:
    branches: ['cpu-animate-opaque-private-cpu-20261108']
    paths: ['.github/workflows/opaque-private-cpu-durant-sengun-sequential-replays.yml']
permissions:
  contents: read
concurrency:
  group: cpu-animate-0181-durant-sengun-sequential-v1
  cancel-in-progress: false
jobs:
  authentic-single-view-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      CUDA_VISIBLE_DEVICES: '-1'
      NVIDIA_VISIBLE_DEVICES: none
      OPENCV_OPENCL_RUNTIME: disabled
      OMP_NUM_THREADS: '3'
      OPENBLAS_NUM_THREADS: '3'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate private-source execution boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test ! -e /dev/nvidia0 && test ! -e /dev/kfd
          echo ORIGINAL_NBA_PRIVATE_CPU_ONLY_SECURITY_PASS
      - name: Render frozen HoopVision rings over Broadcast then Left Above Rim then Right Above Rim
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(mktemp -d)"
          trap 'rm -rf "$ROOT"' EXIT
          gh auth setup-git >/dev/null 2>&1
          git clone -q --depth=1 --filter=blob:none --sparse \
            --branch cpu-animate/min0181-v9-stabilized-floor-possession-20261108 \
            https://github.com/timeedmonds-maker/104.git "$ROOT/private" \
            > "$ROOT/clone.log" 2>&1 || { echo PRIVATE_CPU_ANIMATE_SOURCE_CLONE_FAILED; exit 4; }
          git -C "$ROOT/private" sparse-checkout set --no-cone \
            '/cpu_animate/' '/tools/locked_broadcast_screen_v5_rings.py' \
            > "$ROOT/sparse.log" 2>&1 || { echo PRIVATE_CPU_ANIMATE_SPARSE_CHECKOUT_FAILED; exit 4; }
          cd "$ROOT/private"
          python3 -m pip install -q --disable-pip-version-check numpy opencv-python-headless pillow ultralytics \
            > "$ROOT/pip.log" 2>&1 || { echo VIDEO_CPU_DEPENDENCY_FAILED; exit 4; }
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq > "$ROOT/apt.log" 2>&1
            sudo apt-get install -y -qq ffmpeg > "$ROOT/ffmpeg.log" 2>&1
          fi
          # Fetch official, version-pinned Ultralytics YOLO11-seg weights from
          # their own Hugging Face model repository; SHA verified before any
          # unpickling/inference. Avoid runtime latest-release auto-download 504.
          MODEL_SHA=55ed65c56c91713d23e8402371c6c49a6fd84f257f7dce452e8d70e41dcbe152
          MODEL_URL=https://huggingface.co/Ultralytics/YOLO11/resolve/1fad642026e935ebf53c4d878b6fd844ad08de3f/yolo11n-seg.pt
          for attempt in 1 2 3; do
            if curl -fL --retry 2 --retry-all-errors \
                 --connect-timeout 12 --max-time 90 -sS \
                 "$MODEL_URL" -o yolo11n-seg.pt && \
               echo "$MODEL_SHA  yolo11n-seg.pt" | sha256sum -c - >/dev/null; then
              echo FROZEN_ORIGINAL_YOLO11_SEGMENTATION_WEIGHT_SHA256_PASS
              break
            fi
            rm -f yolo11n-seg.pt
            if [ "$attempt" = 3 ]; then
              echo PRIVATE_CPU_SEGMENTATION_MODEL_SHA_RETRIEVAL_FAILED
              exit 4
            fi
            sleep 2
          done
          python3 -m py_compile cpu_animate/min_ato_0181_bidirectional_player_lock_v6.py
          python3 -m cpu_animate.v9_stable_floor_paths
          python3 - <<'PY'
          from pathlib import Path
          from cpu_animate.core import git_blob_sha
          from cpu_animate.min_ato_0181_bidirectional_player_lock_v6 import _ring_radii,REPLAY_ORDER,VIDEO_S,OUTPUT,seed_features,optical_step
          import cv2,numpy as np
          assert git_blob_sha(Path('tools/locked_broadcast_screen_v5_rings.py')) == '9fac8a8915b90bbd9bd1235532c297c35da77ca2'
          assert REPLAY_ORDER == ('Broadcast','Left Above Rim','Right Above Rim')
          assert VIDEO_S == 19.75 and OUTPUT == (1280,720)
          assert _ring_radii(340)[0] >= 60
          x=np.zeros((100,100),np.uint8)
          cv2.rectangle(x,(25,26),(65,75),255,2)
          x[32:70:7,32:65:7]=135
          pts=seed_features(x,[45,45,140,150])
          assert pts is not None and len(pts)>=4
          y=np.roll(x,3,axis=1)
          flow,px=optical_step(x,y,pts)
          assert flow is not None and abs(flow[0]-6)<3.5
          PY
          echo ORIGINAL_HOOPVISION_PRODUCTION_RING_BLOB_AND_FULLSIZE_POLICY_PASS
          mkdir -p "$ROOT/media" "$ROOT/scout" "$ROOT/motion" "$ROOT/out"
          gh release download cpu-animate-min-ato-0022600181-653-original-cpu \
            --repo timeedmonds-maker/104 --dir "$ROOT/media" \
            --pattern 'angle-*.mp4' --pattern 'angle-*.json' \
            > "$ROOT/source-media.log" 2>&1 || { echo PRIVATE_ORIGINAL_THREE_VIDEO_DOWNLOAD_FAILED; exit 4; }
          gh release download cpu-animate-min-ato-0181-durant-sengun-identity-scout \
            --repo timeedmonds-maker/104 --dir "$ROOT/scout" \
            --pattern 'identity-tracks-*.json' \
            > "$ROOT/identity-scout.log" 2>&1 || { echo PRIVATE_IDENTITY_SCOUT_DOWNLOAD_FAILED; exit 4; }
          gh release download cpu-animate-0181-durant-sengun-native10-coach40 \
            --repo timeedmonds-maker/104 --dir "$ROOT/motion" \
            --pattern 'durant_sengun_native10hz_coach40hz.json' \
            --pattern 'durant_sengun_native_motion_qa.json' \
            > "$ROOT/source-motion.log" 2>&1 || { echo PRIVATE_SOURCE_40HZ_DERIVATION_DOWNLOAD_FAILED; exit 4; }
          python3 - "$ROOT/motion" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          d=Path(sys.argv[1])
          receipt=json.loads((d/'durant_sengun_native_motion_qa.json').read_text())
          source=(d/'durant_sengun_native10hz_coach40hz.json').read_bytes()
          assert receipt['game_id']=='0022600181'
          assert hashlib.sha256(source).hexdigest()==receipt['private_motion_json_sha256']
          assert set(receipt['per_player'])=={'Durant','Sengun'}
          PY
          echo NBA_SOURCE_VIDEO_IDENTITY_AND_DERIVED_40HZ_SHA_PASS
          if ! python3 -m cpu_animate.min_ato_0181_bidirectional_player_lock_v6 \
              --private "$ROOT/private" --media "$ROOT/media" \
              --scout "$ROOT/scout" \
              --motion "$ROOT/motion/durant_sengun_native10hz_coach40hz.json" \
              --out "$ROOT/out" > "$ROOT/render.log" 2>&1; then
            tail -c 3000 "$ROOT/render.log" | sed -E 's#https?://[^ ]+#REDACTED_URL#g'
            echo SEQUENTIAL_ORIGINAL_VIDEO_RENDER_FAILED
            exit 5
          fi
          tail -c 14500 "$ROOT/render.log"
          tail -c 2500 "$ROOT/render.log"
          python3 - "$ROOT/out" <<'PY'
          import json,sys
          from pathlib import Path
          out=Path(sys.argv[1])
          q=json.loads((out/'v9_stable_floor_green_ball_control_private_qa.json').read_text())
          assert q['replay_order']==['Broadcast','Left Above Rim','Right Above Rim']
          assert q['frames']>=1770 and len(q['review_stills'])==21
          assert q['dimensions']==[1280,720]
          assert q['frozen_ring_artwork_git_blob_sha1']=='9fac8a8915b90bbd9bd1235532c297c35da77ca2'
          assert not q['rings_from_provisional_tracking_to_video_utc']
          assert q['status']=='PRIVATE_VISUAL_RESEARCH_ONLY_IDENTITY_NEEDS_INDEPENDENT_HELDOUT_QA'
          assert all(q['camera_metrics'][c]['counters'].get('Durant_ring_present',0)>=40 for c in q['replay_order'])
          assert all(q['camera_metrics'][c]['counters']['previous_missing_ring_camera_gate_passed']==1 for c in q['replay_order'])
          assert q['team_ring_bgr']['Durant']==[65,17,206]
          assert q['team_ring_bgr']['Sengun']==[65,17,206]
          assert abs(q['ring_size_input_output_pixel_radii'][0]-35*1280/908)<.01
          assert abs(q['ring_size_input_output_pixel_radii'][1]-13*720/512)<.01
          assert q['continuous_shot_bounded_floor_stabilization'] is True
          for c in q['replay_order']:
              assert q['camera_metrics'][c]['counters']['Sengun_v9_green_frames']>=20, c
              assert q['camera_metrics'][c]['counters'].get('Durant_v9_green_frames',0)==0
              for who in ('Durant','Sengun'):
                  k=q['camera_metrics'][c]['stabilized_floor_qa'][who]
                  assert k['max_step_native_px']<35, (c,who,k)
          print('V9_FLOOR_CONTINUITY_AND_VERIFIED_REPLAY_BALL_CONTROL_QA_PASS')
          assert q['ring_original_local_ellipse_unwarped'] is True
          assert q['frozen_rotating_sector_count']==3
          assert q['frozen_rotation_deg_per_second']==72.0
          assert q['frozen_normal_pulse_period_seconds']==2.0
          assert 'NOT a horseshoe' in q['frozen_visual_type']
          assert q['floor_anchor_output_px_offset_y']==-4.0
          assert not q['source_video_dynamic_camera_court_homography_certified']
          print('HOOPVISION_ORIGINAL_TEAM_COLOUR_AND_PROJECTED_FLOOR_QA_PASS')
          assert all(q['camera_metrics'][c]['counters'].get('Sengun_ring_present',0)>=40 for c in q['replay_order'])
          assert (out/q['output_file']).stat().st_size>1000000
          print('REPLAY_V6_PLAYER_OPTICAL_QA_PASS',q['frames'],round(q['duration_s'],2),{c:{w:q['camera_metrics'][c]['counters'][w+'_ring_present'] for w in ('Durant','Sengun')} for c in q['replay_order']})
          PY
          TAG=cpu-animate-min-ato-0181-stable-floor-green-v9
          gh release view "$TAG" --repo timeedmonds-maker/104 >/dev/null 2>&1 || \
            gh release create "$TAG" --repo timeedmonds-maker/104 \
              --title 'Durant and Sengun V9 smoothed floor tracking and visibly supported green Sengun ball-control rings' \
              --notes 'V9 private research: preserves V7 source-video identity and frozen HoopVision three-sector rotating annulus, Houston red, fixed 35x13 design at 908x512 reference. Shot-bounded offline video-floor smoothing repairs gaps and frame jitter; official original source video contact sheets independently show Sengun controlling the live ball in the opening interval; ONLY Sengun pulses green for bounded replay-specific reviewed intervals. Actual hand-contact edges, floor homography and holdout foot precision are not certified.' \
              --latest=false >/dev/null || { echo PRIVATE_REPLAY_RELEASE_CREATE_FAILED; exit 5; }
          gh release upload "$TAG" \
            "$ROOT/out/MIN_HOU_0181_HOOPVISION_V9_STABLE_FLOOR_GREEN_CONTROL_3REPLAYS.mp4" \
            "$ROOT/out/v9_stable_floor_green_ball_control_private_qa.json" \
            "$ROOT/out"/v9_*_stable_floor_green_review.jpg \
            --repo timeedmonds-maker/104 --clobber > "$ROOT/upload.log" 2>&1 || {
            echo PRIVATE_REPLAY_VIDEO_ASSET_UPLOAD_FAILED; exit 5; }
          gh release view "$TAG" --repo timeedmonds-maker/104 --json assets \
            --jq '.assets[]| [.name,.size]|@tsv'
          python3 - "$ROOT/out" <<'PY'
          import base64,io,json,subprocess,sys
          from pathlib import Path
          from PIL import Image
          out=Path(sys.argv[1])
          # Publish only reduced, still-PRIVATE review JPEGs to the source branch.
          # No raw source video, signed URLs, tracking arrays or public artifacts.
          for index,sec in ((1,3),(1,4),(1,12),(2,3),(2,4),(2,12),(3,3),(3,4),(3,12)):
              source=out/f'v9_{index}_t{sec:02}_stable_floor_green_review.jpg'
              im=Image.open(source);im.thumbnail((960,540))
              buff=io.BytesIO()
              im.save(buff,format='JPEG',quality=75,optimize=True)
              data=base64.b64encode(buff.getvalue())+b'\n'
              target=(f'repos/timeedmonds-maker/104/contents/docs/cpu_animate/'
                f'private_min0181_hoopvision_stable_floor_green_v9_angle{index}_t{sec:02}.jpg.b64.txt')
              msg={'message':'qa(cpu-animate): private-only original-video foot/occlusion review frame',
                   'content':base64.b64encode(data).decode(),
                   'branch':'cpu-animate/min0181-v9-stabilized-floor-possession-20261108'}
              q=subprocess.run(['gh','api',target+'?ref='+msg['branch']],
                        capture_output=True,text=True)
              if q.returncode==0:msg['sha']=json.loads(q.stdout)['sha']
              p=subprocess.run(['gh','api','-X','PUT',target,'--input','-'],
                         input=json.dumps(msg),capture_output=True,text=True)
              if p.returncode:raise RuntimeError('PRIVATE_STILL_REVIEW_TRANSFER_FAILED')
          print('PRIVATE_ORIGINAL_VIDEO_REVIEW_STILLS_SHA_READY')
          PY
          echo CPU_ANIMATE_DURANT_SENGUN_STABLE_FLOOR_GREEN_V9_COMPLETE
