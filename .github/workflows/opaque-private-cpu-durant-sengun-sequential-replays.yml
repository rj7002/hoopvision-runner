name: CourtCoder V19B clock-rebased native XYZ KD + Sengun V12
# Original pixel-anchor KD seed fix: source-video identity diagnostic V6 rerun
on:
  push:
    branches: ['cpu-animate-v19-native-xyz-cpu-20261110']
    paths: ['.github/workflows/opaque-private-cpu-durant-sengun-sequential-replays.yml']
permissions:
  contents: read
concurrency:
  group: cpu-animate-0181-durant-sengun-sequential-v1
  cancel-in-progress: false
jobs:
  authentic-single-view-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      CUDA_VISIBLE_DEVICES: '-1'
      NVIDIA_VISIBLE_DEVICES: none
      OPENCV_OPENCL_RUNTIME: disabled
      OMP_NUM_THREADS: '3'
      OPENBLAS_NUM_THREADS: '3'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate private-source execution boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test ! -e /dev/nvidia0 && test ! -e /dev/kfd
          echo ORIGINAL_NBA_PRIVATE_CPU_ONLY_SECURITY_PASS
      - name: Render frozen HoopVision rings over Broadcast then Left Above Rim then Right Above Rim
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(mktemp -d)"
          trap 'rm -rf "$ROOT"' EXIT
          gh auth setup-git >/dev/null 2>&1
          git clone -q --depth=1 --filter=blob:none --sparse \
            --branch cpu-animate/min0181-native-xyz-alignment-v19-20261110 \
            https://github.com/timeedmonds-maker/104.git "$ROOT/private" \
            > "$ROOT/clone.log" 2>&1 || { echo PRIVATE_CPU_ANIMATE_SOURCE_CLONE_FAILED; exit 4; }
          git -C "$ROOT/private" sparse-checkout set --no-cone \
            '/cpu_animate/' '/tools/locked_broadcast_screen_v5_rings.py' \
            > "$ROOT/sparse.log" 2>&1 || { echo PRIVATE_CPU_ANIMATE_SPARSE_CHECKOUT_FAILED; exit 4; }
          cd "$ROOT/private"
          mkdir -p "$ROOT/media" "$ROOT/scout" "$ROOT/out" "$ROOT/motion"
          python3 -m pip install -q --disable-pip-version-check numpy opencv-python-headless pillow ultralytics \
            > "$ROOT/pip.log" 2>&1 || { tail -c 1500 "$ROOT/pip.log"; echo ORIGINAL_VIDEO_CPU_DEPENDENCY_INSTALL_FAILED; exit 4; }
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq > "$ROOT/apt.log" 2>&1
            sudo apt-get install -y -qq ffmpeg > "$ROOT/ffmpeg.log" 2>&1
          fi
          python3 -m cpu_animate.test_floor_lock_v12
          python3 -m cpu_animate.test_appearance_identity_v12
          python3 -m cpu_animate.test_bidirectional_video_reid_v14
          python3 -m cpu_animate.test_body_floor_anchor_v16
          python3 -m cpu_animate.test_source_anchor_floor_fusion_v17
          python3 -m cpu_animate.test_native_video_bridge_v19
          echo V12_CPU_APPEARANCE_KIT_SWAP_AND_REACQUISITION_PASS
          echo CPU_ANIMATE_UNIVERSAL_FLOOR_LOCK_V12_SYNTHETIC_REGRESSION_COMPLETE
          python3 -m py_compile cpu_animate/body_floor_anchor_v16.py
          python3 -m py_compile cpu_animate/source_anchor_floor_fusion_v17.py
          python3 -m py_compile cpu_animate/floor_lock_v12.py \
             cpu_animate/shoe_evidence_v12.py \
             cpu_animate/min0181_v12_universal_floor_real_video.py
          COURT_SHA=68e5faf5fb5388cf83477238abe22e9824a69fb33a4cf34f79ab61858f410064
          POSE_SHA=869e83fcdffdc7371fa4e34cd8e51c838cc729571d1635e5141e3075e9319dc0
          SEG_SHA=55ed65c56c91713d23e8402371c6c49a6fd84f257f7dce452e8d70e41dcbe152
          function verified_weight {
            url="$1"; dest="$2"; expected="$3"
            for trial in 1 2 3; do
              if curl -fL -sS --retry 2 --retry-all-errors \
                 --connect-timeout 15 --max-time 120 \
                 "$url" -o "$dest" && \
                echo "$expected  $dest" | sha256sum -c - >/dev/null; then
                echo SHA_VERIFIED_CPU_BASKETBALL_WEIGHT "$dest"
                return 0
              fi
              rm -f "$dest"; sleep 2
            done
            echo MODEL_SHA_VERIFIED_DOWNLOAD_FAILED "$dest"
            return 1
          }
          verified_weight \
            https://huggingface.co/koppolusameer/yolo11n-basketball-court-keypoints/resolve/6cb899251439982067a81baa225b33f45f335981/best.pt \
            "$ROOT/private/basketball_court_best.pt" "$COURT_SHA"
          verified_weight \
            https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo11n-pose.pt \
            "$ROOT/private/yolo11n-pose.pt" "$POSE_SHA"
          verified_weight \
            https://huggingface.co/Ultralytics/YOLO11/resolve/1fad642026e935ebf53c4d878b6fd844ad08de3f/yolo11n-seg.pt \
            "$ROOT/private/yolo11n-seg.pt" "$SEG_SHA"
          gh release download cpu-animate-min-ato-0022600181-653-original-cpu \
             --repo timeedmonds-maker/104 --dir "$ROOT/media" \
             --pattern 'angle-*.mp4' --pattern 'angle-*.json' \
             > "$ROOT/source-media.log" 2>&1 || { echo ORIGINAL_NBA_ANGLE_DOWNLOAD_FAILED; exit 4; }
          gh release download cpu-animate-min-ato-0181-durant-sengun-identity-scout \
             --repo timeedmonds-maker/104 --dir "$ROOT/scout" \
             --pattern 'identity-tracks-*.json' \
             > "$ROOT/source-scout.log" 2>&1 || { echo ORIGINAL_VIDEO_IDENTITY_SCOUT_DOWNLOAD_FAILED; exit 4; }
          gh release download cpu-animate-0181-durant-sengun-native10-coach40 \
             --repo timeedmonds-maker/104 --dir "$ROOT/motion" \
             --pattern 'durant_sengun_native10hz_coach40hz.json' \
             --pattern 'durant_sengun_native_motion_qa.json' \
             > "$ROOT/source-native.log" 2>&1 || { echo ORIGINAL_NBA_NATIVE_40HZ_SOURCE_RECOVERY_FAILED; exit 4; }
          env -u GH_TOKEN -u GITHUB_TOKEN -u GIT_ASKPASS \
            python3 -m cpu_animate.min0181_v12_universal_floor_real_video \
               --private "$ROOT/private" --media "$ROOT/media" \
               --scout "$ROOT/scout" \
               --motion "$ROOT/motion/durant_sengun_native10hz_coach40hz.json" \
               --motion_qa "$ROOT/motion/durant_sengun_native_motion_qa.json" \
               --modelcourt "$ROOT/private/basketball_court_best.pt" \
               --modelpose "$ROOT/private/yolo11n-pose.pt" \
               --modelseg "$ROOT/private/yolo11n-seg.pt" \
               --out "$ROOT/out" > "$ROOT/render.log" 2>&1 || {
                  tail -c 11000 "$ROOT/render.log"
                  echo V12_UNIVERSAL_COURT_FLOOR_CPU_PREVIEW_REJECTED
                  exit 5
               }
          tail -c 10000 "$ROOT/render.log"
          python3 - "$ROOT/out" <<'PY'
          import json,sys
          from pathlib import Path
          q=json.loads((Path(sys.argv[1])/'v18_kd_body_sengun_v12_split_qa.json').read_text())
          assert q['frames']>=235
          assert q['original_NBA_source_mutated'] is False
          assert q['camera_cuts_are_hard_resets'] is True
          assert q['fixed_frozen_ring_size'] is True
          assert q['camera_registration_frame_count']>=int(.70*q['frames'])
          assert q['court_keypoint_model_sha256']=='68e5faf5fb5388cf83477238abe22e9824a69fb33a4cf34f79ab61858f410064'
          assert q['topdown_pose_model_sha256']=='869e83fcdffdc7371fa4e34cd8e51c838cc729571d1635e5141e3075e9319dc0'
          assert set(q['source_video_identity_appearance_qa'])=={'Durant','Sengun'}
          assert all(q['original_video_reference_jersey_signatures'][who] is not None for who in ('Durant','Sengun'))
          assert q['team_roster_kit_calibration_active'] is True
          assert all(q['original_video_reference_jersey_signatures'][w][0]>.35
                     for w in ('Durant','Sengun'))
          assert all(q['original_video_reference_jersey_signatures'][w][2]<.40
                     for w in ('Durant','Sengun'))
          assert q['source_video_identity_appearance_qa']['Durant'].get(
                      'team_kit_repaired_from_verified_teammate',0)==1
          assert q['offline_bidirectional_player_reid_qa']['returned_real_person_boxes']>=80
          assert q['fresh_original_video_person_detector_qa']['frames_with_fresh_person_candidates']>=180
          assert q['fresh_original_video_person_detector_qa']['fresh_source_person_candidates']>=500
          assert q['offline_bidirectional_player_reid_qa'].get(
                     'fresh_video_compatible_player_candidate',0)>=70
          assert q['fresh_source_video_player_candidates_identity_unassigned_before_reid'] is True
          assert q['existing_sengun_identity_tracking_preserved'] is True
          assert len(q['original_video_reviewed_two_sided_identity_anchors'])>=4
          assert q['kd_ring_requires_verified_source_body_or_short_two_sided_gap'] is True
          assert q['sengun_original_v12_source_video_identity_preserved'] is True
          assert q['sengun_original_v12_unmodified_court_filter'] is True
          assert q['sengun_added_body_position_snap_disabled'] is True
          assert q['kd_v17_verified_body_anchor_fusion_preserved'] is True
          assert q['kd_verified_body_ring_consistency_frames']>=65
          assert q['kd_body_tether_original_video_qa']['body_tethered_renderable_frames']>=80
          assert q['kd_body_tether_original_video_qa']['max_accepted_body_envelope_error_px']<=3.5
          assert q['kd_fused_floor_intervals_have_two_sided_camera_shot_support'] is True
          assert q['kd_fused_original_camera_source_qa']['accepted_floor_frames']>=145
          assert q['v19_native_xyz_video_qa']['kd_native_projected_video_body_accepted']>=50
          assert q['v19_native_xyz_video_qa']['sengun_original_v12_path_modified'] is False
          assert len(q['kd_video_source_manual_anchor_evidence'])>=4
          assert q['ring_output_qa'].get('Durant_visible_ring_frames',0)>=50
          assert q['ring_output_qa'].get('Sengun_visible_ring_frames',0)>=125
          assert q['ring_output_qa'].get('Sengun_green_reviewed_frames',0)>60
          assert (Path(sys.argv[1])/q['video_file']).stat().st_size>1000000
          print('V12_UNIVERSAL_COURT_SHOE_IDENTITY_VISIBILITY_ACCEPTANCE_PASS',
                {'frames':q['frames'],'appearance':q['source_video_identity_appearance_qa'],
                 'source':q['model_foot_sources_qa'],
                 'floor':q['floor_filter_qa'],
                 'ring':q['ring_frame_dynamics']})
          PY
          TAG=cpu-animate-min0181-native-xyz-kd-sengun-v19
          gh release view "$TAG" --repo timeedmonds-maker/104 >/dev/null 2>&1 || \
            gh release create "$TAG" --repo timeedmonds-maker/104 \
              --title 'CPU Animate V19: immutable NBA native XYZ to original video KD ring, Sengun V12 preserved' \
              --notes 'V19 experimental: Durant native NBA source XY projected to video via robust source-to-reference camera fit and video body gate; Sengun accepted V12 path unchanged. Neither two physical timing anchors nor independent landmarks/feet yet certified. Research preview, fail closed. No original NBA source mutation.' \
              --latest=false >/dev/null
          gh release upload "$TAG" \
             "$ROOT/out/MIN0181_V19_NATIVE_XYZ_VIDEO_REGISTERED_KD_SENGUN_V12_8S.mp4" \
             "$ROOT/out/v18_kd_body_sengun_v12_split_qa.json" \
             "$ROOT/out/v19_native_xyz_alignment_diagnostic_qa.json" \
             "$ROOT/out"/v18_floor_review_t*.jpg \
             "$ROOT/out"/v18_kd_body_foot_debug_t*.jpg \
             --repo timeedmonds-maker/104 --clobber
          python3 - "$ROOT/out" <<'PY'
          import base64,json,subprocess,sys
          from pathlib import Path
          out=Path(sys.argv[1])
          branch='cpu-animate/min0181-kd-body-plus-sengun-v12-v18-20261110'
          for sec in (2,3,4,5,6):
              p=out/f'v18_floor_review_t{sec:02}.jpg'
              if not p.is_file():continue
              data=base64.b64encode(p.read_bytes())+b'\n'
              dest=f'repos/timeedmonds-maker/104/contents/docs/cpu_animate/v18_kd_body_sengun_v12_t{sec:02}.jpg.b64.txt'
              item={'message':'qa(V12): original NBA source real frame floor ring for technical review',
                    'branch':branch,'content':base64.b64encode(data).decode()}
              old=subprocess.run(['gh','api',dest+'?ref='+branch],capture_output=True,text=True)
              if old.returncode==0:item['sha']=json.loads(old.stdout)['sha']
              result=subprocess.run(['gh','api','-X','PUT',dest,'--input','-'],
                            input=json.dumps(item),capture_output=True,text=True)
              if result.returncode:raise RuntimeError('V12_PRIVATE_REAL_VIDEO_FRAME_ARCHIVAL_FAILED')
              dimg=out/f'v18_kd_body_foot_debug_t{sec:02}.jpg'
              if dimg.is_file():
                  raw=base64.b64encode(dimg.read_bytes())+b'\n'
                  target=f'repos/timeedmonds-maker/104/contents/docs/cpu_animate/v18_kd_body_debug_t{sec:02}.jpg.b64.txt'
                  item2={'message':'QA V16: verified source KD body bbox and foot-anchor ring',
                         'branch':branch,'content':base64.b64encode(raw).decode()}
                  prior=subprocess.run(['gh','api',target+'?ref='+branch],
                                      capture_output=True,text=True)
                  if prior.returncode==0:item2['sha']=json.loads(prior.stdout)['sha']
                  status=subprocess.run(['gh','api','-X','PUT',target,'--input','-'],
                         input=json.dumps(item2),capture_output=True,text=True)
                  if status.returncode:raise RuntimeError('V16_KD_BODY_QA_FRAME_SAVE_FAILED')
          print('V17_ORIGINAL_NBA_REAL_FRAMES_ARCHIVED')
          PY
          echo V18_KD_BODY_SENGUN_V12_SOURCE_REPLAY_COMPLETE
          exit 0
          gh release download cpu-animate-min-ato-0181-durant-sengun-identity-scout \
             --repo timeedmonds-maker/104 --dir "$ROOT/scout" \
             --pattern 'identity-tracks-*.json' \
             > "$ROOT/source-scout.log" 2>&1 || { echo ORIGINAL_VIDEO_IDENTITY_SCOUT_DOWNLOAD_FAILED; exit 4; }
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('basketball_court_best.pt')
          d={'model':'koppolusameer/yolo11n-basketball-court-keypoints',
             'snapshot_commit_sha1':'6cb899251439982067a81baa225b33f45f335981',
             'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
             'license':'AGPL-3.0, evaluation only'}
          Path('v11b_court_model_provenance.json').write_text(json.dumps(d,indent=2))
          PY
          env -u GH_TOKEN -u GITHUB_TOKEN -u GIT_ASKPASS \
            python3 -m cpu_animate.min0181_v11b_broadcast_court_locked_preview \
               --private "$ROOT/private" --media "$ROOT/media" \
               --scout "$ROOT/scout" \
               --modelcourt "$ROOT/private/basketball_court_best.pt" \
               --modelpose "$ROOT/private/yolo11n-pose.pt" \
               --manifest "$ROOT/private/v11b_court_model_provenance.json" \
               --out "$ROOT/out" > "$ROOT/render.log" 2>&1 || {
                  tail -c 12000 "$ROOT/render.log"
                  echo V11B_BROADCAST_COURT_FLOOR_PREVIEW_REJECTED
                  exit 5
               }
          tail -c 12000 "$ROOT/render.log"
          python3 - "$ROOT/out" <<'PY'
          import json,sys
          from pathlib import Path
          q=json.loads((Path(sys.argv[1])/'v11b_broadcast_court_floor_preview_receipt.json').read_text())
          assert q['camera']=='Broadcast'
          assert q['source_motion_fit_requires_no_NBA_XYZ']
          assert q['cpu_basketball_court_model_sha256']=='68e5faf5fb5388cf83477238abe22e9824a69fb33a4cf34f79ab61858f410064'
          assert q['pose_model_sha256']=='869e83fcdffdc7371fa4e34cd8e51c838cc729571d1635e5141e3075e9319dc0'
          assert q['camera_model_accepted_sampled_frames']/q['camera_model_total_sampled_frames']>=.65
          assert q['camera_homography_available_video_frames']>=int(.70*q['frames'])
          for who in ('Durant','Sengun'):
              assert q['ring_frame_counts'].get(who+'_visible_ring_frames',0)>=35
          assert q['ring_frame_counts']['Sengun_green_source_replay_frames']>15
          print('V11B_ORIGINAL_NBA_SOURCE_COURT_REGISTERED_SHOE_RING_PREVIEW_QA_PASS',
                {'frames':q['frames'],'camera_samples':q['camera_model_accepted_sampled_frames'],
                 'pose':q['video_pose_pixels_included'],'rings':q['ring_frame_counts']})
          PY
          TAG=cpu-animate-min0181-broadcast-court-referenced-v11b
          gh release view "$TAG" --repo timeedmonds-maker/104 >/dev/null 2>&1 || \
            gh release create "$TAG" --repo timeedmonds-maker/104 \
              --title 'MIN 0181 Broadcast V11B: 48-landmark NBA court registered KD/Sengun floor rings - research preview' \
              --notes 'Source original NBA 8-second Broadcast clip. Basketball 48-keypoint CPU registration, preserved V7 KD/Sengun original-video identities, V11n pose shoe measurements and frozen HoopVision rotating/pulsing team-red/ball-control-green rings, original person occlusion. Research-only; exact court landmark/foot p95 ground truth not independently accepted, AGPL checkpoint not redistributed.' \
              --latest=false >/dev/null
          gh release upload "$TAG" \
             "$ROOT/out/MIN0181_DURANT_SENGUN_V11B_BROADCAST_COURT_REFERENCED_8SECONDS.mp4" \
             "$ROOT/out/v11b_broadcast_court_floor_preview_receipt.json" \
             "$ROOT/out"/v11b_broadcast_floor_ring_*.jpg \
             --repo timeedmonds-maker/104 --clobber
          python3 - "$ROOT/out" <<'PY'
          import base64,json,subprocess,sys
          from pathlib import Path
          d=Path(sys.argv[1])
          branch='cpu-animate/min0181-v10-ground-plane-diagnostic-20261108'
          for sec in (2,3,4,5,6):
              p=d/f'v11b_broadcast_floor_ring_t{sec:02}.jpg'
              if not p.is_file():continue
              data=(base64.b64encode(p.read_bytes())+b'\n')
              dest=f'repos/timeedmonds-maker/104/contents/docs/cpu_animate/v11b_broadcast_floor_ring_t{sec:02}.jpg.b64.txt'
              payload={'message':'QA v11b original NBA broadcast court-referenced ring frame',
                       'branch':branch,'content':base64.b64encode(data).decode()}
              existing=subprocess.run(['gh','api',dest+'?ref='+branch],
                       capture_output=True,text=True)
              if existing.returncode==0:payload['sha']=json.loads(existing.stdout)['sha']
              result=subprocess.run(['gh','api','-X','PUT',dest,'--input','-'],
                       input=json.dumps(payload),capture_output=True,text=True)
              if result.returncode:raise RuntimeError('PRIVATE_BROADCAST_FRAME_QA_UPLOAD_FAILED')
          print('V11B_PRIVATE_BROADCAST_VISUAL_QA_FRAMES_VERIFIED')
          PY
          echo V11B_REAL_SOURCE_COURT_REGISTERED_BROADCAST_REVIEW_RELEASED
          exit 0
          gh release download cpu-animate-min-ato-0181-durant-sengun-identity-scout \
            --repo timeedmonds-maker/104 --dir "$ROOT/scout" \
            --pattern 'identity-tracks-*.json' \
            > "$ROOT/identity-scout.log" 2>&1 || { echo PRIVATE_IDENTITY_SCOUT_DOWNLOAD_FAILED; exit 4; }
          gh release download cpu-animate-0181-durant-sengun-native10-coach40 \
            --repo timeedmonds-maker/104 --dir "$ROOT/motion" \
            --pattern 'durant_sengun_native10hz_coach40hz.json' \
            --pattern 'durant_sengun_native_motion_qa.json' \
            > "$ROOT/source-motion.log" 2>&1 || { echo PRIVATE_SOURCE_40HZ_DERIVATION_DOWNLOAD_FAILED; exit 4; }
          python3 - "$ROOT/motion" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          d=Path(sys.argv[1])
          receipt=json.loads((d/'durant_sengun_native_motion_qa.json').read_text())
          source=(d/'durant_sengun_native10hz_coach40hz.json').read_bytes()
          assert receipt['game_id']=='0022600181'
          assert hashlib.sha256(source).hexdigest()==receipt['private_motion_json_sha256']
          assert set(receipt['per_player'])=={'Durant','Sengun'}
          PY
          echo NBA_SOURCE_VIDEO_IDENTITY_AND_DERIVED_40HZ_SHA_PASS
          if ! python3 -m cpu_animate.min_ato_0181_bidirectional_player_lock_v6 \
              --private "$ROOT/private" --media "$ROOT/media" \
              --scout "$ROOT/scout" \
              --motion "$ROOT/motion/durant_sengun_native10hz_coach40hz.json" \
              --out "$ROOT/out" > "$ROOT/render.log" 2>&1; then
            tail -c 3000 "$ROOT/render.log" | sed -E 's#https?://[^ ]+#REDACTED_URL#g'
            echo SEQUENTIAL_ORIGINAL_VIDEO_RENDER_FAILED
            exit 5
          fi
          tail -c 14500 "$ROOT/render.log"
          tail -c 2500 "$ROOT/render.log"
          python3 - "$ROOT/out" <<'PY'
          import json,sys
          from pathlib import Path
          out=Path(sys.argv[1])
          q=json.loads((out/'v9_stable_floor_green_ball_control_private_qa.json').read_text())
          assert q['replay_order']==['Broadcast','Left Above Rim','Right Above Rim']
          assert q['frames']>=1770 and len(q['review_stills'])==21
          assert q['dimensions']==[1280,720]
          assert q['frozen_ring_artwork_git_blob_sha1']=='9fac8a8915b90bbd9bd1235532c297c35da77ca2'
          assert not q['rings_from_provisional_tracking_to_video_utc']
          assert q['status']=='PRIVATE_VISUAL_RESEARCH_ONLY_IDENTITY_NEEDS_INDEPENDENT_HELDOUT_QA'
          assert all(q['camera_metrics'][c]['counters'].get('Durant_ring_present',0)>=40 for c in q['replay_order'])
          assert all(q['camera_metrics'][c]['counters']['previous_missing_ring_camera_gate_passed']==1 for c in q['replay_order'])
          assert q['team_ring_bgr']['Durant']==[65,17,206]
          assert q['team_ring_bgr']['Sengun']==[65,17,206]
          assert abs(q['ring_size_input_output_pixel_radii'][0]-35*1280/908)<.01
          assert abs(q['ring_size_input_output_pixel_radii'][1]-13*720/512)<.01
          assert q['continuous_shot_bounded_floor_stabilization'] is True
          for c in q['replay_order']:
              assert q['camera_metrics'][c]['counters']['Sengun_v9_green_frames']>=20, c
              assert q['camera_metrics'][c]['counters'].get('Durant_v9_green_frames',0)==0
              for who in ('Durant','Sengun'):
                  k=q['camera_metrics'][c]['stabilized_floor_qa'][who]
                  assert k['max_step_native_px']<35, (c,who,k)
          print('V9_FLOOR_CONTINUITY_AND_VERIFIED_REPLAY_BALL_CONTROL_QA_PASS')
          assert q['ring_original_local_ellipse_unwarped'] is True
          assert q['frozen_rotating_sector_count']==3
          assert q['frozen_rotation_deg_per_second']==72.0
          assert q['frozen_normal_pulse_period_seconds']==2.0
          assert 'NOT a horseshoe' in q['frozen_visual_type']
          assert q['floor_anchor_output_px_offset_y']==-4.0
