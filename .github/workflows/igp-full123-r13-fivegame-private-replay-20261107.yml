# Public runner executes five-game R13 original NBA replay, but writes only private-104 results.
name: IGP Full123 R13 original-source five-game replay
on:
  push:
    branches: [feature/igp-full123-r13-public-cpu-20261107]
    paths: ['.github/workflows/igp-full123-r13-fivegame-private-replay-20261107.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-full123-r13-five-original-20261107
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        game: ['0022600021','0022600091','0022600125','0022600138','0022600153']
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: feature/igp-full123-r13-touch-integration-20261107
      GAME: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check public boundary
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Replay immutable original native R13 touch data into private sidecar
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/r13-$GAME"
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" \
            "https://github.com/$PRIVATE_REPO.git" "$work"
          cd "$work"
          git sparse-checkout set --no-cone \
            '/gamepulse/fusion/*.py' \
            '/gamepulse/fusion/analysis/*.py' \
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/index.json' \
            '/gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/post56_additive_20261028/index.json' \
            '/gamepulse/fusion/qa/igp_progress_20261030/igp_full121_default_source_release_v1.json' \
            '/gamepulse/fusion/qa/igp_progress_20261030/full121_original_native_sha_admission/*.json' \
            '/gamepulse/fusion/materialized/igp_all_original_xyz/*/index.json' \
            "/gamepulse/fusion/materialized/igp_all_original_xyz/$GAME/*" \
            '/gamepulse/fusion/official_pbp_timing/games/*.json' \
            '/gamepulse/fusion/official_pbp_timing/original_nba_20261029/*/boxscore.json' \
            '/gamepulse/fusion/evidence/companion_sdk_original_*/sdk_observed_original.json' \
            '/gamepulse/fusion/qa/r13_full123_original_labels_20261107/*.json.gz' \
            '/gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/verified_5game/*'
          export PYTHONPATH="$work:$work/gamepulse/fusion:$work/gamepulse/fusion/analysis"
          result="gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/$GAME.json"
          mkdir -p "$(dirname "$result")"
          set +e
          python3 gamepulse/fusion/igp_full123_r13_touch_overlay_v1.py --root . --game-id "$GAME" \
            > "$RUNNER_TEMP/r13-$GAME.private.log" 2>&1
          status=$?
          set -e
          if test "$status" -ne 0; then
            python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          gid=os.environ['GAME']; repo=os.environ['PRIVATE_REPO'];branch=os.environ['PRIVATE_BRANCH']
          path='gamepulse/fusion/qa/r13_full123_touch_overlay_20261107/private_error_'+gid+'.json'
          log=(Path(os.environ['RUNNER_TEMP'])/('r13-'+gid+'.private.log')).read_text()[-10000:]
          body={'branch':branch,'message':'qa(private): R13 Full123 actual NBA replay error [skip ci]',
                'content':base64.b64encode(json.dumps({'game_id':gid,'traceback':log}).encode()).decode()}
          endpoint='repos/'+repo+'/contents/'+path
          old=subprocess.run(['gh','api',endpoint+'?ref='+branch],capture_output=True,text=True)
          if old.returncode==0:body['sha']=json.loads(old.stdout)['sha']
          subprocess.run(['gh','api','-X','PUT',endpoint,'--input','-'],
                         input=json.dumps(body),capture_output=True,text=True)
          PY
            echo "R13_FULL123_ORIGINAL_REPLAY_PRIVATE_DIAGNOSTIC" 
            exit "$status"
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          gid=os.environ['GAME']
          p=Path('gamepulse/fusion/qa/r13_full123_touch_overlay_20261107')/(gid+'.json')
          x=json.loads(p.read_bytes())
          assert x['game_id']==gid and x['source_original_modified'] is False
          assert x['accepted_touch_episodes']>300
          assert sum(r['touches'] for r in x['player_stats'].values())==x['accepted_touch_episodes']
          assert x['nba_frontcourt_metric_parity_certified'] is False
          print('R13_FULL123_ORIGINAL_GAME_SOURCE_REPLAY_VALID')
          PY
          git config user.name 'R13 private NBA source replay'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f "$result"
          git diff --cached --check
          git commit -qm "data(private): Full123 original R13 touch episodes $GAME [skip ci]"
          for attempt in $(seq 1 14); do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH"
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo "R13_FULL123_GAME_REPLAY_SAVED_PRIVATE"
              exit 0
            fi
            sleep "$attempt"
          done
          exit 39
