# Full666 v1.1 research: source PBP terminal vs original native gameclock QA.
# NO physical control/custody or official NBA scorer time certified by this audit.
name: IGP 2025-26 Full666 original NBA possession boundary audit v1.1
'on':
  push:
    branches: [main]
    paths: [.github/workflows/igp-2025-26-full666-possession-boundary-audit.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-full666-historical-original-possession-boundary-audit
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
  BRANCH: research/gamepulse-clock-boundary-integrity-20261025
  SOURCE_RELEASE: igp-2025-26-full666-pbp-possession-20261106
  TARGET_RELEASE: igp-full666-2025-26-possession-audit-20261106
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify source safety and run independent boundary/exception regression tests
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone --quiet --depth=1 --filter=blob:none --sparse \
            -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" hash-object gamepulse/fusion/igp_2025_26_full666_possession_boundary_audit_v1.py)" = e6269e3189530dc84ef96f7959010ecced7d5b87
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH="$PWD:$PWD/gamepulse/fusion"
          python3 -m py_compile gamepulse/fusion/igp_2025_26_full666_possession_boundary_audit_v1.py
          python3 -m unittest -v gamepulse.fusion.tests.test_igp_2025_26_full666_possession_boundary_audit_v1
          echo FULL666_BOUNDARY_SOURCE_TESTS_PASS
      - name: Create protected research audit release and fetch 50-game original SHA-verified v1.0 SQLite
        run: |
          set -euo pipefail
          if ! gh release view "$TARGET_RELEASE" --repo timeedmonds-maker/104 >/dev/null 2>&1; then
            gh release create "$TARGET_RELEASE" --repo timeedmonds-maker/104 \
              --target "$BRANCH" --draft \
              --title 'Full666 2025-26 v1.1 PBP/native-clock possession boundary research QA' \
              --notes 'Audit-only additive overlay. Source PBP terminal events versus archived original gameclock, observed ball availability, and logical chain exceptions. No independent physical custody, official ten, scorer-to-video frame timing, or exact physical boundary certification.'
          fi
          mkdir -p "$RUNNER_TEMP/input" "$RUNNER_TEMP/out"
          for n in $(seq 1 18); do
            if gh release download "$SOURCE_RELEASE" --repo timeedmonds-maker/104 \
                --pattern 'historical-full666-pbp-possession-nba-2025-26-shard-001*' \
                --dir "$RUNNER_TEMP/input" --clobber;then break;fi
            if test "$n" -eq 18;then exit 42;fi
            echo FULL666_BOUNDARY_PILOT_FETCH_RETRY_"$n"
            sleep 120
          done
          gzip -d "$RUNNER_TEMP/input/historical-full666-pbp-possession-nba-2025-26-shard-001.sqlite.gz"
      - name: Verify pilot original PBP terminal and clock evidence on every 50-game boundary
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/private/gamepulse/fusion"
          python3 "$RUNNER_TEMP/private/gamepulse/fusion/igp_2025_26_full666_possession_boundary_audit_v1.py" \
            --index "$RUNNER_TEMP/input/historical-full666-pbp-possession-nba-2025-26-shard-001.sqlite" \
            --qa "$RUNNER_TEMP/input/historical-full666-pbp-possession-nba-2025-26-shard-001-qa.json" \
            --out "$RUNNER_TEMP/out"
          python3 - <<'PY'
          import gzip,os,pathlib
          p=next((pathlib.Path(os.environ['RUNNER_TEMP'])/'out').glob('*.sqlite'))
          with p.open('rb') as inp,gzip.open(str(p)+'.gz','wb',compresslevel=6) as out:
            for b in iter(lambda:inp.read(1048576),b''):out.write(b)
          p.unlink()
          PY
      - name: Publish 50-game boundary QA and private index before other shards
        run: |
          set -euo pipefail
          for n in $(seq 1 15); do
            if gh release upload "$TARGET_RELEASE" "$RUNNER_TEMP/out/"* \
                  --repo timeedmonds-maker/104 --clobber;then
              echo FULL666_BOUNDARY_PILOT_ACCEPTED
              exit 0
            fi
            sleep 120
          done
          exit 43
  remaining:
    needs: pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ['002','003','004','005','006','007','008','009','010','011','012','013','014','015']
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify immutable source audit and clone private canonical engine
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          gh auth setup-git
          git clone --quiet --depth=1 --filter=blob:none --sparse \
            -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set --no-cone \
            gamepulse/fusion/igp_2025_26_full666_possession_boundary_audit_v1.py \
            gamepulse/fusion/igp_2025_26_full666_pbp_possession_index_v1.py \
            gamepulse/fusion/igp_full107_native_historical_2025_26_v1.py \
            gamepulse/fusion/igp_native_scene_model_v2.py \
            gamepulse/fusion/igp_tracking_model_a_holdout_2026.py \
            gamepulse/fusion/igp_tracking_model_b_holdout_2026.py \
            gamepulse/fusion/igp_tracking_model_c0_endpoint_velocity_bridge_2026.py \
            gamepulse/fusion/igp_historical_defender_proxy_v1.py
          test "$(git -C "$RUNNER_TEMP/private" hash-object gamepulse/fusion/igp_2025_26_full666_possession_boundary_audit_v1.py)" = e6269e3189530dc84ef96f7959010ecced7d5b87
          mkdir -p "$RUNNER_TEMP/input" "$RUNNER_TEMP/out"
      - name: Fetch private v1.0 Full666 SQLite shard, not tracking XYZ
        run: |
          set -euo pipefail
          for n in $(seq 1 18); do
            if gh release download "$SOURCE_RELEASE" --repo timeedmonds-maker/104 \
                --pattern "historical-full666-pbp-possession-nba-2025-26-shard-$SHARD*" \
                --dir "$RUNNER_TEMP/input" --clobber;then break;fi
            if test "$n" -eq 18;then exit 42;fi
            echo FULL666_BOUNDARY_SHARD_FETCH_RETRY_"$SHARD"_"$n"
            sleep 120
          done
          gzip -d "$RUNNER_TEMP/input/historical-full666-pbp-possession-nba-2025-26-shard-$SHARD.sqlite.gz"
      - name: Audit every candidate start/end PBP terminal with independent-in-source gameclock
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/private/gamepulse/fusion"
          python3 "$RUNNER_TEMP/private/gamepulse/fusion/igp_2025_26_full666_possession_boundary_audit_v1.py" \
            --index "$RUNNER_TEMP/input/historical-full666-pbp-possession-nba-2025-26-shard-$SHARD.sqlite" \
            --qa "$RUNNER_TEMP/input/historical-full666-pbp-possession-nba-2025-26-shard-$SHARD-qa.json" \
            --out "$RUNNER_TEMP/out"
          python3 - <<'PY'
          import gzip,os,pathlib
          p=next((pathlib.Path(os.environ['RUNNER_TEMP'])/'out').glob('*.sqlite'))
          with p.open('rb') as inp,gzip.open(str(p)+'.gz','wb',compresslevel=6) as out:
            for b in iter(lambda:inp.read(1048576),b''):out.write(b)
          p.unlink()
          PY
      - name: Retain audited boundary uncertainty and counts in private 104 only
        run: |
          set -euo pipefail
          for n in $(seq 1 15); do
            if gh release upload "$TARGET_RELEASE" "$RUNNER_TEMP/out/"* \
                  --repo timeedmonds-maker/104 --clobber;then
              echo FULL666_BOUNDARY_SHARD_QA_PRIVATE_ACCEPTED_"$SHARD"
              exit 0
            fi
            sleep 120
          done
          exit 43
  reduce:
    needs: [pilot,remaining]
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Retrieve and reconcile 15 source-hash-preserved boundary QA receipts
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          mkdir -p "$RUNNER_TEMP/qa"
          for n in $(seq 1 18); do
            if gh release download "$TARGET_RELEASE" --repo timeedmonds-maker/104 \
                  --pattern 'full666-possession-boundary-audit-nba-2025-26-shard-*-qa.json' \
                  --dir "$RUNNER_TEMP/qa" --clobber && \
                test "$(find "$RUNNER_TEMP/qa" -name '*-qa.json' | wc -l)" -eq 15;then break;fi
            if test "$n" -eq 18;then exit 42;fi
            sleep 120
          done
          python3 - <<'PY'
          import collections,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'qa'
          files=sorted(root.glob('*-qa.json'))
          assert len(files)==15
          total=collections.Counter();games=set();shards=set();pergame={}
          for f in files:
            d=json.loads(f.read_text())
            assert d['schema']=='igp.historical-2025-26-full666-possession-boundary-audit.v1'
            assert d['physical_start_boundaries_certified']==0
            assert d['physical_end_boundaries_certified']==0
            assert d['original_clock_not_independently_video_certified'] is True
            assert d['shard'] not in shards
            shards.add(d['shard'])
            assert not (games&set(d['per_game']))
            games.update(d['per_game'])
            pergame.update({k:{'counts':v['counts'],'examples':v['important_review_examples']}
              for k,v in d['per_game'].items()})
            total.update(d['counts'])
          assert len(games)==666 and len(shards)==15
          assert total['original_native_frame_count']==19440900
          assert total['source_action_count']==380977
          assert total['candidate_boundaries']==131306
          assert total['native_frame_candidate_possession_count']==11604366
          assert total['full107_complete_count']==9392952
          assert total['original_source_direct_complete_count']==5895277
          assert sum(v for k,v in total.items() if k.startswith('grade_'))==131306
          receipt={
            'schema':'igp.full666-2025-26-possession-boundary-audited-season.v1',
            'status':'SOURCE_PBP_NATIVE_CLOCK_AUDITED_NOT_PHYSICAL_CERTIFIED',
            'version':'IGP Full666 (2025-26) v1.1 Possession-Audited',
            'games':len(games),'shards':len(shards),
            'all_native_original_frames_conserved':19440900,
            'source_pbp_actions_conserved':380977,
            'logical_boundary_candidates_conserved':131306,
            'v1_source_index_unchanged':True,
            'official_nba_pbp_fully_independently_reconciled':False,
            'independent_video_clock_reference':False,
            'physical_possession_start_certified':0,
            'physical_possession_end_certified':0,
            'counts':dict(total),'per_game':pergame}
          (root/'igp-full666-2025-26-possession-boundary-all666-qa.json').write_text(
            json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('FULL666_ALL666_BOUNDARY_AUDIT_SOURCE_GRADED_FINAL',json.dumps({
            'games':666,'shards':15,'source_action_count':380977,
            'logical_boundaries':131306,
            'source_semantic_matches':total['source_terminal_semantic_match'],
            'native_clock_and_ball':total['grade_PBP_TERMINAL_NATIVE_CLOCK_AND_BALL_PRESENT_NOT_PHYSICAL'],
            'native_clock_no_ball':total['grade_PBP_TERMINAL_NATIVE_CLOCK_CORROBORATED_NOT_PHYSICAL'],
            'source_terminal_only':total['grade_PBP_SOURCE_TERMINAL_ONLY_NOT_PHYSICAL'],
            'hard_conflicted':total['grade_SOURCE_TERMINAL_CONFLICT_REQUIRES_REVIEW'],
            'logical_exceptions':total['grade_PBP_TERMINAL_EXCEPTION_REQUIRES_LOGICAL_MERGE_REVIEW'],
            'unverified':total['grade_UNVERIFIED_LOGICAL_CHAIN_TERMINAL'],
            'and_one_possible':total['and_one_possible'],
            'free_throw_close_missing':total['FT_terminal_not_closed_in_v1'],
            'physical_certified':0,'version':'Full666 v1.1 Possession-Audited'
          },sort_keys=True),flush=True)
          PY
      - name: Retain complete all666 private source-grade receipt and publish audited status
        run: |
          set -euo pipefail
          for n in $(seq 1 15); do
            if gh release upload "$TARGET_RELEASE" \
                "$RUNNER_TEMP/qa/igp-full666-2025-26-possession-boundary-all666-qa.json" \
                --repo timeedmonds-maker/104 --clobber;then
              gh release edit "$TARGET_RELEASE" --repo timeedmonds-maker/104 --draft=false
              echo FULL666_V11_SOURCE_BOUNDARY_AUDIT_ALL666_PRIVATE_COMPLETED
              exit 0
            fi
            sleep 120
          done
          exit 43
