name: IGP 2025-26 xFG one-game archive crosswalk pilot
on:
  push:
    branches: [main]
    paths: [.github/workflows/gamepulse-2025-26-xfg-archive-overlap.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-2025-26-public-xfg-source-overlap
  cancel-in-progress: false
jobs:
  overlap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Read one source shard and recover NBA xFG shot identities
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          python3 -m py_compile tools/igp_2025_26_public_xfg_backfill.py
          test -n "$GH_TOKEN"
          mkdir -p "$RUNNER_TEMP/source"
          gh release download igp-public-gamepulse-2025-26-20261105 --repo timeedmonds-maker/104 \
            --pattern nba-2025-26-source-index.json --pattern nba-2025-26-shard-001.zip \
            --dir "$RUNNER_TEMP/source"
          python3 tools/igp_2025_26_public_xfg_backfill.py \
            --index "$RUNNER_TEMP/source/nba-2025-26-source-index.json" \
            --shard "$RUNNER_TEMP/source/nba-2025-26-shard-001.zip" \
            --out "$RUNNER_TEMP/derived" --workers 2 --max-games 1
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"derived/nba-xfg-nba-2025-26-shard-001-qa.json"
          x=json.loads(p.read_text())
          assert x["games"]==1 and x["counts"]["public_shot_rows"]>0
          assert x["counts"].get("exact_archived_pbp_actor_action",0)>0
          print("HISTORICAL_XFG_ARCHIVE_ONE_GAME_JOIN_PASS",json.dumps({
            "shots":x["counts"]["public_shot_rows"],
            "exact_pbp_actor_action":x["counts"]["exact_archived_pbp_actor_action"],
            "requests":x["player_game_requests"],
            "failed":len(x["failed_player_games"])},sort_keys=True))
          PY
