name: IGP 2025-26 official xFG access pilot
on:
  push:
    branches: [main]
    paths: [.github/workflows/gamepulse-2025-26-xfg-archive-overlap.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-2025-26-public-xfg-source-overlap
  cancel-in-progress: false
jobs:
  overlap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Probe existing 2025-26 NBA official xFG source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          python3 - <<'PY'
          import json,urllib.parse,urllib.request
          p={"GameID":"0022501206","PlayerID":"1626171"}
          url="https://stats.gleague.nba.com/stats/shotqualityvideologs?"+urllib.parse.urlencode(p)
          headers={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36","Referer":"https://www.nba.com/","Origin":"https://www.nba.com","Accept":"application/json, text/plain, */*"}
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=40) as f:
              data=json.load(f)
          assert isinstance(data,dict) and str(data.get("gameId")).zfill(10)==p["GameID"]
          assert str(data.get("playerId"))==p["PlayerID"]
          print("HISTORICAL_2025_26_XFG_API_PROBE",json.dumps({"game_id":p["GameID"],"shotList_rows":len(data.get("shotList") or []),"published_fga":data.get("shots"),"source_field_names":sorted(data.keys())},sort_keys=True))
          PY
