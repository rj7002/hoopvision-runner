# Opaque public/private bridge. Full original provider payload and detailed QA remain in private 104.
name: FULL88 game0004 original Blueprint changed-feature audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full88-0004-original-feature-revision-private-20261102.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: full88-game0004-original-feature-revision-20261102
  cancel-in-progress: false
jobs:
  private-shot-source-semantic-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: analysis/igp-full88-three-gap-blueprint-recheck-20261102
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify public/private separation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Load minimum SHA-pinned original source and private diff code
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          git sparse-checkout set --no-cone \
            /scripts/update_nba_blueprint_daily_2026_27.py \
            /scripts/build_nba_blueprint_2026_27.py \
            /data/extensions/nba_blueprint_2026_27/games/0022600004/ \
            /gamepulse/fusion/igp_full88_default_engine_v1.py \
            /gamepulse/fusion/igp_full88_blueprint_three_gap_source_recheck_v2.py \
            /gamepulse/fusion/igp_full88_blueprint_feature_revision_probe_v1.py \
            /gamepulse/fusion/igp_full88_blueprint_all_section_revision_v2.py \
            /gamepulse/fusion/qa/igp_fullx/shot_event_multiview_full88_v1.json
          python3 -m py_compile gamepulse/fusion/igp_full88_blueprint_feature_revision_probe_v1.py
          python3 gamepulse/fusion/igp_full88_blueprint_feature_revision_probe_v1.py --self-test
          python3 gamepulse/fusion/igp_full88_blueprint_all_section_revision_v2.py --self-test
      - name: Compare original first-party Blueprint feature fields
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 gamepulse/fusion/igp_full88_blueprint_all_section_revision_v2.py > "$RUNNER_TEMP/private-probe" 2>&1 || {
            echo FULL88_GAME0004_PRIVATE_ORIGINAL_FEATURE_PROBE_FAILED
            exit 1
          }
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('gamepulse/fusion/qa/igp_fullx/blueprint_game0004_changed_all_sections_20261102/summary.json')
          d=json.loads(p.read_bytes())
          assert d['game_id']=='0022600004'
          assert d['published_shot_rows']==145 and d['shot_row_field_revisions']==0
          assert d['default_full88_original_or_published_shot_unchanged'] and d['other_section_changes_not_promoted_as_per_shot_features']
          print('FULL88_GAME0004_ORIGINAL_FEATURE_REVISIONS_AGGREGATE_ONLY',
                d['published_shot_rows'], d['shot_row_field_revisions'],len(d['changed_sections']))
          PY
      - name: Commit only to private source branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f gamepulse/fusion/qa/igp_fullx/blueprint_game0004_changed_all_sections_20261102/
          git diff --cached --check
          if git diff --cached --quiet; then echo ORIGINAL_FEATURE_PROBE_QA_UNCHANGED; exit 0; fi
          git commit -qm 'qa(private): verify exact Blueprint source shot-feature revision [skip ci]'
          for i in 1 2 3 4 5; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH"
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo FULL88_GAME0004_FEATURE_QA_PRIVATE_ONLY
              exit 0
            fi
            sleep "$i"
          done
          exit 26
