name: Rockets Suns 0194 current live original XYZ Full131 R13 all available periods
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-rockets-0194-full131-live-r13-20261108.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: rockets0194-full131-live-r13
  cancel-in-progress: false
jobs:
  source-backed-current-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      NBA_GAME_ID: '0022600194'
      NBA_TIPOFF_UTC: '2026-11-08T02:00:00Z'
      IGP_PRIVATE_CAPTURE_DIR: /tmp/rockets0194-live-companion
      IGP_CAPTURE_ZERO_SHOT_FULL_EVENTS: 'true'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Read SHA-original NBA live tracking and execute unchanged Full131 R13 engine
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          mkdir -p "$RUNNER_TEMP/rockets0194-live-original" "$IGP_PRIVATE_CAPTURE_DIR"
          gh release download gamepulse-live-sdk-0022600194 --repo timeedmonds-maker/104 --pattern 'live-*' --dir "$RUNNER_TEMP/rockets0194-live-original"
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          (cd tools/licensed_feed && npm install --ignore-scripts --no-audit --no-fund --silent)
          node tools/licensed_feed/companion_original_sdk_probe.mjs > "$RUNNER_TEMP/rockets0194-companion-sdk.log"
          git clone -q --depth=1 --filter=blob:none --sparse -b analysis/full131-kd-frontcourt-passer-distance-20261108 https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/rockets0194-engine"
          git -C "$RUNNER_TEMP/rockets0194-engine" sparse-checkout set --no-cone '/gamepulse/fusion/*.py' '/gamepulse/fusion/analysis/*.py' '/gamepulse/fusion/qa/full131_0194/**'
          git -C "$RUNNER_TEMP/rockets0194-engine" switch -q -c "research/rockets0194-full131-live-$GITHUB_RUN_ID"
          cat > "$RUNNER_TEMP/rockets0194_live_full131.py" <<'PY'
          from __future__ import annotations
          import collections, gzip, hashlib, json, math, os, tarfile, urllib.request
          from pathlib import Path
          from gamepulse.fusion.analysis import igp_r13_touch_stats_v2 as r13
          from gamepulse.fusion.official_pbp_timestamps_2026 import official_utc_ms
          
          GAME = "0022600194"
          root = Path(os.environ["RUNNER_TEMP"])
          folder = root / "rockets0194-live-original"
          companion = Path(os.environ["IGP_PRIVATE_CAPTURE_DIR"])
          out = Path("gamepulse/fusion/qa/full131_0194/live_full131_r13_" + os.environ["GITHUB_RUN_ID"] + ".json")
          require = lambda yes,why: None if yes else (_ for _ in ()).throw(ValueError(why))
          sha = lambda b: hashlib.sha256(b).hexdigest()
          source = sorted(folder.glob("live-*.tar.gz"))
          require(len(source)>=1, "NO_ORIGINAL_NBA_SOURCE_ARCHIVES")
          variants = collections.defaultdict(list)
          labels = collections.defaultdict(set)
          minute_meta = []
          for archive in source:
              note = archive.with_name(archive.name.replace(".tar.gz",".json"))
              require(note.is_file(), "MISSING_ORIGINAL_SHA_SIDECAR")
              data = archive.read_bytes()
              actual = sha(data)
              info = json.loads(note.read_bytes())
              require(info.get("archive_sha256")==actual, "ORIGINAL_SOURCE_SHA_MISMATCH")
              with tarfile.open(archive,"r:gz") as tar:
                  man = json.load(tar.extractfile("manifest.json"))
                  require(man["game_id"]==GAME and man["observed"] is True and man["imputed"] is False, "SOURCE_NOT_DIRECT")
                  require(man["successful_windows"]==12 and man["start_ms"]==info["start_ms"], "SOURCE_SLOT_INCOMPLETE")
                  stream = tar.extractfile("raw-slots.jsonl.gz")
                  require(stream is not None, "NO_ORIGINAL_RAW_SLOTS")
                  for line in gzip.GzipFile(fileobj=stream):
                      if not line.strip():continue
                      slot = json.loads(line)
                      for event in slot.get("events",[]):
                          for f in (event.get("metadata") or {}).get("keyframes",[]):
                              t=f.get("timestamp")
                              pos=f.get("positions")
                              if type(t)!=int or not isinstance(pos,dict):continue
                              valid = {str(k):v for k,v in pos.items() if isinstance(v,list)
                                       and len(v)==3 and all(type(z) in (int,float) and math.isfinite(z) for z in v)}
                              variants[t].append((valid,f.get("interpolated") is True))
                              touch=f.get("lastTouch") or {}
                              pid=touch.get("playerId")
                              utc=official_utc_ms(touch.get("startTimeUTC"))
                              if type(pid) is int and utc is not None:
                                  labels[t].add((str(pid),utc))
              minute_meta.append({"utc_ms":man["start_ms"],"sha256":actual,
                "native_keyframes":man["unique_keyframes"],"frames_with_player":man["frames_with_players"],
                "frames_with_ball":man["frames_with_ball"]})
          minute_meta.sort(key=lambda x:x["utc_ms"])
          require(len(set(x["utc_ms"] for x in minute_meta))==len(minute_meta),"DUPLICATE_MINUTE_ARCHIVES")
          require(variants,"NO_ORIGINAL_NATIVE_XYZ")
          native=[]; source_interp=0; tenball=0; players=0; balls=0
          for t,values in sorted(variants.items()):
              best=max(values,key=lambda x:(len(x[0]),not x[1]))
              v,interpolated=best
              native.append((t,v))
              source_interp+=int(interpolated)
              pn=sum(k!="ball" for k in v)
              players+=int(pn>0)
              balls+=int("ball" in v)
              tenball+=int(pn>=10 and "ball" in v)
          original_labels={"original_source_modified":False,"game_id":GAME,
            "rows":[[t,[[pid,utc] for pid,utc in sorted(pair)]] for t,pair in sorted(labels.items())]}
          label_map,conflicts=r13.source_labels(original_labels)
          receipt=json.loads((companion/"companion_probe_receipt.json").read_bytes())
          response=companion/"companion_original_sdk_response.json"
          require(receipt.get("game_id")==GAME and receipt.get("full_original_events_endpoint_observed") is True,
                  "NBA_ORIGINAL_COMPANION_NOT_AVAILABLE")
          require(sha(response.read_bytes())==receipt["original_body_sha256"],"COMPANION_SHA_MISMATCH")
          events=json.loads(response.read_bytes())
          clock=sorted([e for e in events if e.get("event")=="Time#show" and type(e.get("timestamp")) is int],key=lambda x:x["timestamp"])
          running=collections.Counter(e.get("metadata",{}).get("period") for e in clock
                 if e.get("metadata",{}).get("gameClockRunning") is True)
          require(running[1]>=10 and running[2]>=10,"NBA_FIRSTHALF_COMPANION_CLOCK_NOT_VERIFIED")
          court=[e.get("metadata",{}) for e in events if e.get("event")=="CourtMeta#show"]
          require(len(court)==1 and court[0].get("attackingPositiveXFirstHalf") in ("home","away"),
                  "ORIGINAL_COURT_ATTACK_DIRECTION_UNKNOWN")
          positive=court[0]["attackingPositiveXFirstHalf"]
          lineups=[e for e in events if e.get("event")=="OnCourt#show"]
          roster={};conflicted=[]
          for event in lineups:
              md=event.get("metadata") or {}
              for side,team in (("home","PHX"),("away","HOU")):
                  ids=md.get(side) or []
                  if len(ids)!=5 or len(set(ids))!=5:continue
                  for pid in ids:
                      pid=str(pid)
                      if pid in roster and roster[pid]!=team:conflicted.append(pid)
                      roster[pid]=team
          require(not conflicted and len(roster)>=15, "ORIGINAL_ONCOURT_IDS_AMBIGUOUS")
          home=1 if positive=="home" else -1
          dirs={"PHX":{1:home,2:home,3:-home,4:-home},
                "HOU":{1:-home,2:-home,3:home,4:home}}
          candidates=r13.contacts(native,label_map,clock,roster,dirs)
          episodes,rejected=r13.select_episodes(candidates)
          require(all(e["player_id"] in roster and e["period"] in (1,2,3,4) for e in episodes),
                  "UNEXPECTED_ID_OR_PERIOD_IN_R13_OUTPUT")
          names={}
          try:
              url="https://cdn.nba.com/static/json/liveData/boxscore/boxscore_"+GAME+".json"
              request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"})
              with urllib.request.urlopen(request,timeout=18) as r: box=json.loads(r.read(3500000))
              require(str(box["game"]["gameId"])==GAME,"OFFICIAL_BOX_GAME_ID_MISMATCH")
              for side in ("homeTeam","awayTeam"):
                  for p in box["game"][side].get("players",[]):
                      names[str(p["personId"])]=p.get("name") or "NBA player "+str(p["personId"])
              nba_box_grade="OFFICIAL_NBA_LIVE_BOXSCORE_VERIFIED"
          except Exception:
              nba_box_grade="NAMES_FROM_NBA_SOURCE_NOT_AVAILABLE"
          per=collections.defaultdict(list)
          for ep in episodes:per[ep["player_id"]].append(ep)
          rows=[]
          for pid,eps in per.items():
              rows.append({"player_id":pid,"name":names.get(pid,"NBA player "+pid),
                "team":roster[pid],"R13_touches":len(eps),
                "R13_frontcourt_touches":sum(e["frontcourt_at_reception"] is True for e in eps),
                "R13_frontcourt_unknown":sum(e["frontcourt_at_reception"] is None for e in eps),
                "by_period":{str(q):{"touches":sum(e["period"]==q for e in eps),
                  "frontcourt_touches":sum(e["period"]==q and e["frontcourt_at_reception"] is True for e in eps)}
                  for q in (1,2,3,4)} })
          rows.sort(key=lambda x:(x["team"],-x["R13_frontcourt_touches"],-x["R13_touches"],x["player_id"]))
          summary={
           "schema":"igp.0194.full131-r13-all-available-source.v1",
           "game_id":GAME,"engine":r13.VERSION,"full131_R13_core_detector_executed":True,
           "run_id":os.environ["GITHUB_RUN_ID"],"source_original_modified":False,
           "original_native_source":{"source_minute_archives":len(source),
             "source_last_archive_utc_ms":minute_meta[-1]["utc_ms"],
             "original_unique_native_timestamps":len(native),
             "original_frames_with_player_xyz":players,"original_frames_with_ball_xyz":balls,
             "source_actor_id_tenplus_ball_frames_not_officially_certified":tenball,
             "source_provider_interpolated_selected_frames":source_interp,
             "source_sha256_by_minute":{str(x["utc_ms"]):x["sha256"] for x in minute_meta}},
           "companion":{"original_events_sha256":sha(response.read_bytes()),
             "events":len(events),"clock_running_events_by_period":dict(running),
             "original_oncourt_events":len(lineups),"first_half_attacking_positive_x":positive},
           "source_lastTouch_label_times":len(label_map),"source_lastTouch_conflicts":conflicts,
           "R13_candidate_episodes":len(candidates),"R13_accepted_episodes":len(episodes),
           "R13_rejected_brief_episodes":len(rejected),
           "R13_accepted_by_period":{str(q):sum(e["period"]==q for e in episodes) for q in (1,2,3,4)},
           "player_stats":rows,"nba_box_grade":nba_box_grade,
           "grade":"ACTUAL_FULL131_R13_SOURCE_GRADED_CAPTURED_LIVE_PERIODS",
           "whole_game_tracking_certified":False,"official_NBA_touch_parity_certified":False,
           "physical_touch_precision_recall_certified":False,
           "note":"Full131 original R13 v2 contact/episode functions are imported unchanged. Original SDK SHA and source lastTouch, NBA original companion clocks and on-court/attacking-end data determine observed qualifying periods. No invented XYZ, NBA touch equivalence, 10Hz model acceptance or full-game physical coverage claim."}
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print("FULL131_R13_LIVE_0194_ACCEPTED",len(episodes))
          print("ORIGINAL_NATIVE_TIMESTAMPS",len(native))
          print("ORIGINAL_SOURCE_MINUTES",len(source))
          print("R13_ACCEPTED_Q1_Q2_Q3_Q4",*[summary["R13_accepted_by_period"][str(q)] for q in (1,2,3,4)])
          print("R13_NBA_COMPANION_RUNNING_CLOCK",*[running.get(q,0) for q in (1,2,3,4)])
          print("PRIVATE_QA_OUTPUT",out)
          
          PY
          python3 -m py_compile "$RUNNER_TEMP/rockets0194_live_full131.py"
          (cd "$RUNNER_TEMP/rockets0194-engine" && PYTHONPATH=. python3 -B "$RUNNER_TEMP/rockets0194_live_full131.py")
          cd "$RUNNER_TEMP/rockets0194-engine"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f "gamepulse/fusion/qa/full131_0194/live_full131_r13_$GITHUB_RUN_ID.json"
          git diff --cached --check
          git commit -q -m "data(igp): exact Full131 R13 source-graded Rockets live 0194"
          git push -q origin "HEAD:refs/heads/research/rockets0194-full131-live-$GITHUB_RUN_ID"
          echo "PRIVATE_FULL131_R13_LIVE_0194_RESULT_COMMITTED"
          