name: Full92 private original-SDK touch ledger SHA-integrity QA
# Privacy guard requires the vetted public-to-private API bridge; no private checkout.
# Initial 20 SDK backfills preserved; exact 70 remaining SHA-13part games are source-recovered with guarded CPU fanout.
# Only source-free code and aggregate QA may enter this PUBLIC runner.
# All licensed source archives, timestamps, coordinates and touch ledgers stay PRIVATE.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/full92-private-unique-touch-ledger-v1.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  PRIVATE_REPO: timeedmonds-maker/104
  PRIVATE_BRANCH: research/full92-unique-touch-ledger-v1-20261103

jobs:
  full92-backfill-missing-original:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'touch-backfill70-only:')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        game:
          - '0022600008'
          - '0022600009'
          - '0022600015'
          - '0022600016'
          - '0022600017'
          - '0022600018'
          - '0022600019'
          - '0022600020'
          - '0022600021'
          - '0022600022'
          - '0022600023'
          - '0022600024'
          - '0022600094'
          - '0022600095'
          - '0022600096'
          - '0022600097'
          - '0022600098'
          - '0022600099'
          - '0022600100'
          - '0022600101'
          - '0022600102'
          - '0022600103'
          - '0022600104'
          - '0022600105'
          - '0022600106'
          - '0022600107'
          - '0022600108'
          - '0022600109'
          - '0022600110'
          - '0022600111'
          - '0022600112'
          - '0022600113'
          - '0022600114'
          - '0022600115'
          - '0022600116'
          - '0022600117'
          - '0022600118'
          - '0022600119'
          - '0022600120'
          - '0022600121'
          - '0022600122'
          - '0022600123'
          - '0022600124'
          - '0022600125'
          - '0022600126'
          - '0022600127'
          - '0022600128'
          - '0022600129'
          - '0022600130'
          - '0022600131'
          - '0022600132'
          - '0022600133'
          - '0022600134'
          - '0022600135'
          - '0022600136'
          - '0022600141'
          - '0022600142'
          - '0022600143'
          - '0022600144'
          - '0022600145'
          - '0022600146'
          - '0022600147'
          - '0022600148'
          - '0022600149'
          - '0022600150'
          - '0022600151'
          - '0022600152'
          - '0022600153'
          - '0022600154'
          - '0022600155'
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      GAME_ID: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Protect the public/private boundary
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Recover all original SDK parts and verify original release SHA
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/full92-touch-$GAME_ID"
          mkdir -p "$ROOT/sdk"
          gh api "repos/$PRIVATE_REPO/releases/tags/gamepulse-sdk-$GAME_ID" > "$ROOT/release.json"
          gh release download "gamepulse-sdk-$GAME_ID" --repo "$PRIVATE_REPO" --pattern 'sdk-part-??.tar.gz' --dir "$ROOT/sdk"
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/("full92-touch-"+os.environ["GAME_ID"])
          assets=json.loads((p/"release.json").read_text())["assets"]
          expected={a["name"]:a.get("digest") for a in assets if re.fullmatch(r"sdk-part-\d{2}\.tar\.gz",a["name"])}
          files=sorted((p/"sdk").glob("sdk-part-??.tar.gz"))
          if len(expected)!=13 or len(files)!=13:
              raise ValueError("FULL92_ORIGINAL_COMPLETE_13_PART_SOURCE_NOT_AVAILABLE")
          if {x.name for x in files}!=set(expected):
              raise ValueError("ORIGINAL_SDK_SOURCE_PART_INVENTORY_MISMATCH")
          for f in files:
              digest="sha256:"+hashlib.sha256(f.read_bytes()).hexdigest()
              if expected[f.name]!=digest:
                  raise ValueError("ORIGINAL_SDK_RELEASE_SHA_MISMATCH")
          print("PRIVATE_ORIGINAL_SDK_SHA_VERIFIED_13_OF_13")
          PY
      - name: Rebuild native handler starts and independent XYZ touch candidates
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/full92-touch-$GAME_ID"
          for n in gamepulse_ball_dynamics gamepulse_ball_control; do
            gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/$n.py?ref=main" --jq .content | base64 -d > "$ROOT/$n.py"
          done
          for n in full_original_handler_touch_index tracking_touch_reconstruction; do
            gh api "repos/$PRIVATE_REPO/contents/gamepulse/live/$n.py?ref=main" --jq .content | base64 -d > "$ROOT/$n.py"
          done
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/catalog/2026-27.json?ref=main" --jq .content | base64 -d > "$ROOT/catalog.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/("full92-touch-"+os.environ["GAME_ID"])
          cat=json.loads((p/"catalog.json").read_text())
          g=cat.get("games",{}).get(os.environ["GAME_ID"],{})
          rows=g.get("players",[])
          roster={str(z["player_id"]):z["team"] for z in rows
                  if z.get("team_assignment")=="NBA_OFFICIAL_BOX_SCORE"}
          (p/"roster.json").write_text(json.dumps(roster))
          PY
          PYTHONPATH="$ROOT" python3 "$ROOT/full_original_handler_touch_index.py" \
            --game "$GAME_ID" --sdk-dir "$ROOT/sdk" --teams "$ROOT/roster.json" --output "$ROOT/full_handler.json"
          python3 "$ROOT/tracking_touch_reconstruction.py" \
            --game "$GAME_ID" --input "$ROOT/sdk" --roster "$ROOT/roster.json" --output "$ROOT/tracking.json"
      - name: Publish source-backed derived indexes to private research branch only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,subprocess,time
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/("full92-touch-"+os.environ["GAME_ID"])
          game=os.environ["GAME_ID"]
          native=json.loads((p/"full_handler.json").read_text())
          tracking=json.loads((p/"tracking.json").read_text())
          assert native["game_id"]==tracking["game_id"]==game
          assert native["full_13_sdk_parts_present"] is True
          assert native["touch_count"]==len(native["touch_events"])
          assert tracking["counts"]["touch_episodes"]==len(tracking["touch_events"])
          for src,dest in (
            ("full_handler.json","gamepulse/live/original_sdk_handler_touches/"+game+".json"),
            ("tracking.json","gamepulse/live/tracking_touches/"+game+".json")):
              raw=(p/src).read_bytes()
              if len(raw)>950000:
                  import gzip
                  raw=gzip.compress(raw,compresslevel=9,mtime=0)
                  dest=dest+".gz"
                  if len(raw)>950000:
                      raise ValueError("PRIVATE_GZIP_TOUCH_FILE_REQUIRES_CHUNKING")
              endpoint="repos/"+os.environ["PRIVATE_REPO"]+"/contents/"+dest
              for retry in range(20):
                  old=subprocess.run(["gh","api",endpoint+"?ref="+os.environ["PRIVATE_BRANCH"]],
                                     capture_output=True,text=True)
                  write={"branch":os.environ["PRIVATE_BRANCH"],
                         "message":"data: private SHA-original Full92 touch source recovery",
                         "content":base64.b64encode(raw).decode()}
                  if old.returncode==0:write["sha"]=json.loads(old.stdout)["sha"]
                  run=subprocess.run(["gh","api","-X","PUT",endpoint,"--input","-"],
                                      input=json.dumps(write),capture_output=True,text=True)
                  if run.returncode==0:break
                  time.sleep(min(10,1+retry*.65))
              else:raise RuntimeError("PRIVATE_BACKFILL_COMMIT_CONFLICT")
              check=json.loads(subprocess.check_output(["gh","api",endpoint+"?ref="+os.environ["PRIVATE_BRANCH"]]))
              if base64.b64decode(check["content"])!=raw:
                  raise ValueError("PRIVATE_SOURCE_BACKFILL_READBACK_MISMATCH")
          print("FULL92_PRIVATE_SOURCE_BACKFILL_SHA_VERIFIED_AND_COMMITTED")
          PY

  full92-ledger:
    needs: [full92-backfill-missing-original]
    if: always() && (github.event_name == 'workflow_dispatch' || (!contains(github.event.head_commit.message, 'nba-probe-only:') && !contains(github.event.head_commit.message, 'touch-summary-only:'))) && (needs.full92-backfill-missing-original.result == 'success' || needs.full92-backfill-missing-original.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check public/private boundary
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
      - name: Retrieve exact frozen 92-game private event spine and 92 touch source pairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,subprocess,urllib.parse
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"private-full92-ledger"
          branch=os.environ["PRIVATE_BRANCH"]
          repo=os.environ["PRIVATE_REPO"]
          def fetch_with_retry(url):
              import time
              for attempt in range(8):
                  r=subprocess.run(["gh","api",url],capture_output=True,text=True)
                  if r.returncode == 0:return r
                  err=r.stderr.lower()
                  if any(x in err for x in ("rate limit","http 403","http 429","http 500","http 502","http 503","http 504")):
                      time.sleep(min(55,4*(attempt+1)))
                      continue
                  return r
              return r
          def get(path, required=True):
              url="repos/"+repo+"/contents/"+path+"?ref="+urllib.parse.quote(branch,safe="")
              r=fetch_with_retry(url)
              if r.returncode and not required and ("404" in r.stderr or "Not Found" in r.stderr):
                  # The canonical Full92 branch has fewer historical live
                  # sidecars than private main. Fall back ONLY within the
                  # exact frozen source manifest game-id membership.
                  alt="repos/"+repo+"/contents/"+path+"?ref=main"
                  r=fetch_with_retry(alt)
              if r.returncode:
                  if not required and ("404" in r.stderr or "Not Found" in r.stderr):
                      return None
                  raise RuntimeError("PRIVATE_SOURCE_FETCH_FAILED_"+path+"_API_FETCH_RETRY_EXHAUSTED")
              doc=json.loads(r.stdout)
              data=base64.b64decode(doc["content"])
              dest=root/path
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(data)
              return data
          manifest="gamepulse/fusion/materialized/igp_full92_pbp_event_tracking_v1/index.json"
          idx=json.loads(get(manifest))
          if idx.get("cohort")!="FULL92" or len(idx.get("by_game",{}))!=92 or idx.get("games")!=92:
              raise ValueError("FULL92_SOURCE_COHORT_DRIFT")
          get("gamepulse/fusion/full92_unique_touch_ledger_v1.py")
          get("gamepulse/fusion/tests/test_full92_unique_touch_ledger_v1.py")
          for gid,record in sorted(idx["by_game"].items()):
              get(record["path"])
              for sub in ("touches","tracking_touches","original_sdk_handler_touches"):
                  base="gamepulse/live/"+sub+"/"+gid+".json"
                  # Never request an absent compressed alternative when the
                  # uncompressed source has already been SHA-read and saved.
                  if get(base,required=False) is None:
                      get(base+".gz",required=False)
          print("PRIVATE_FULL92_SOURCE_EVENT_AND_TOUCH_FETCH_FINISHED")
          PY
      - name: Run private source-free tests and SHA-conserved Full92 ledger
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/private-full92-ledger"
          python3 -m unittest discover -s "$ROOT/gamepulse/fusion/tests" -p test_full92_unique_touch_ledger_v1.py
          python3 "$ROOT/gamepulse/fusion/full92_unique_touch_ledger_v1.py" --root "$ROOT"
      - name: Commit compressed Full92 evidence ledgers only to private research branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,subprocess,time
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"private-full92-ledger"
          source=root/"gamepulse/fusion/materialized/igp_full92_unique_touch_v1"
          index=json.loads(gzip.decompress((source/"index.json.gz").read_bytes()))
          if index["games"]!=92 or index["games_with_both_touch_sources"]!=92:
              raise ValueError("FULL92_92_GAME_TOUCH_BACKFILL_NOT_COMPLETE")
          files=sorted(source.rglob("*.gz"))
          if len(files)!=93:
              raise ValueError("FULL92_PRIVATE_LEDGER_EXPECT_92_GAMES_PLUS_INDEX")
          import urllib.parse
          branch=os.environ["PRIVATE_BRANCH"]
          repo=os.environ["PRIVATE_REPO"]
          shas=[]
          for f in files:
              raw=f.read_bytes()
              if len(raw)>950000:
                  raise ValueError("COMPRESSED_FULL92_PRIVATE_GAME_LEDGER_TOO_LARGE")
              path=str(f.relative_to(root))
              endpoint="repos/"+repo+"/contents/"+path
              query=endpoint+"?ref="+urllib.parse.quote(branch,safe="")
              sha256=hashlib.sha256(raw).hexdigest()
              git_sha=hashlib.sha1(
                  b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
              old=subprocess.run(["gh","api",query],capture_output=True,text=True)
              prior=json.loads(old.stdout) if old.returncode==0 else {}
              if prior.get("sha")==git_sha:
                  shas.append(sha256)
                  continue
              for retry in range(25):
                  body={"branch":branch,
                        "message":"qa: privately preserve Full92 SHA touch evidence ledger",
                        "content":base64.b64encode(raw).decode()}
                  if prior.get("sha"):
                      body["sha"]=prior["sha"]
                  done=subprocess.run(["gh","api","-X","PUT",endpoint,"--input","-"],
                                       input=json.dumps(body),capture_output=True,text=True)
                  if done.returncode==0:
                      receipt=json.loads(done.stdout)
                      if receipt.get("content",{}).get("sha")!=git_sha:
                          raise ValueError("FULL92_PRIVATE_GIT_BLOB_HASH_MISMATCH")
                      break
                  time.sleep(min(12,2+retry*.5))
                  old=subprocess.run(["gh","api",query],capture_output=True,text=True)
                  if old.returncode==0: prior=json.loads(old.stdout)
              else:
                  raise RuntimeError("FULL92_PRIVATE_LEDGER_COMMIT_FAILED_"+path)
              shas.append(sha256)
          # Per-game source SHA-256 was validated during the build; each
          # accepted Git Contents write now also verifies the exact canonical
          # Git blob hash from the server-side PUT response. Avoid the immediate
          # GET of a newly created file: GitHub's Contents reads can lag writes
          # and return a false 404 even after a successful commit.
          print("FULL92_PRIVATE_TOUCH_LEDGER_SHA_ACCEPTED",
                "GAMES",index["games"],
                "BOTH",index["games_with_both_touch_sources"],
                "OFFICIAL_EVENTS",index["counts"]["official_actions"],
                "INDEX_SHA256",hashlib.sha256((source/"index.json.gz").read_bytes()).hexdigest(),
                "VERIFIED_LEDGER_OBJECTS",len(shas))
          PY
      - name: Assert public outputs contain no licensed touch payload
        if: always()
        run: |
          test ! -d artifacts
          echo "Private-source Full92 touch QA only; no player-level or original tracking data published." >> "$GITHUB_STEP_SUMMARY"

  official-nba-touch-probe:
    if: github.event_name == 'workflow_dispatch' || (!contains(github.event.head_commit.message, 'touch-summary-only:') && !contains(github.event.head_commit.message, 'touch-backfill70-only:'))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: research/full92-unique-touch-ledger-v1-20261103
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard public-to-private boundary before source-restricted probe
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
      - name: Retrieve SHA-frozen cohort manifest and source-free NBA parser from PRIVATE
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/private-nba-reference-probe"
          mkdir -p "$ROOT/gamepulse/fusion/tests" "$ROOT/gamepulse/fusion/materialized/igp_full92_pbp_event_tracking_v1"
          gh api "repos/$PRIVATE_REPO/contents/gamepulse/fusion/materialized/igp_full92_pbp_event_tracking_v1/index.json?ref=$PRIVATE_BRANCH" \
            --jq .content | base64 -d > "$ROOT/gamepulse/fusion/materialized/igp_full92_pbp_event_tracking_v1/index.json"
          for item in \
             gamepulse/fusion/nba_official_full92_player_touches_source.py \
             gamepulse/fusion/tests/test_nba_official_full92_player_touches_source.py; do
            gh api "repos/$PRIVATE_REPO/contents/$item?ref=$PRIVATE_BRANCH" --jq .content | \
              base64 -d > "$ROOT/$item"
          done
          python3 -m unittest discover -s "$ROOT/gamepulse/fusion/tests" -p 'test_nba_official_full92_player_touches_source.py' -v
          echo "PRIVATE_NBA_TOUCH_SOURCE_PARSER_TESTS_PASS"
      - name: Probe official NBA per-game touch reference without inventing missing results
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/private-nba-reference-probe"
          set +e
          python3 "$ROOT/gamepulse/fusion/nba_official_full92_player_touches_source.py" \
            --root "$ROOT" --probe 0022600009 0022600138 --timeout 16 --sleep 1.2
          probe_rc=$?
          set -e
          test "$probe_rc" -eq 0 -o "$probe_rc" -eq 3
          test -f "$ROOT/gamepulse/fusion/materialized/nba_official_touches_full92_v1/status.json"
          echo "PRIVATE_NBA_TOUCH_PROBE_EXECUTED status_code=$probe_rc"
      - name: Preserve only independent NBA reference response hashes and probe results in PRIVATE
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess,time,urllib.parse
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"private-nba-reference-probe"
          folder=root/"gamepulse/fusion/materialized/nba_official_touches_full92_v1"
          files=[folder/"status.json"]+sorted((folder/"games").rglob("*")) if (folder/"games").exists() else [folder/"status.json"]
          files=[x for x in files if x.is_file()]
          branch=os.environ["PRIVATE_BRANCH"]
          repo=os.environ["PRIVATE_REPO"]
          for f in files:
              raw=f.read_bytes()
              blob_sha=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
              dest=str(f.relative_to(root))
              endpoint="repos/"+repo+"/contents/"+dest
              qry=endpoint+"?ref="+urllib.parse.quote(branch,safe="")
              for retry in range(7):
                  old=subprocess.run(["gh","api",qry],capture_output=True,text=True)
                  prior=json.loads(old.stdout) if old.returncode==0 else {}
                  if prior.get("sha")==blob_sha:break
                  body={"branch":branch,
                        "message":"qa: private independent official NBA tracking touches probe",
                        "content":base64.b64encode(raw).decode()}
                  if prior.get("sha"):body["sha"]=prior["sha"]
                  put=subprocess.run(["gh","api","-X","PUT",endpoint,"--input","-"],
                                     input=json.dumps(body),capture_output=True,text=True)
                  if put.returncode==0:
                      if json.loads(put.stdout).get("content",{}).get("sha")!=blob_sha:
                          raise ValueError("PRIVATE_NBA_REFERENCE_GIT_BLOB_MISMATCH")
                      break
                  time.sleep(2+retry)
              else:raise RuntimeError("PRIVATE_NBA_REFERENCE_STATUS_PUBLISH_FAILED")
          s=json.loads((folder/"status.json").read_text())
          print("PRIVATE_NBA_OFFICIAL_PROBE_RECEIPT",
                "REQUESTED",s["requested"],
                "AVAILABLE",s["requested_available"],
                "ERROR_GAMES",len(s["errors"]),
                "FULL92_REFERENCE_COMPLETE",s["official_reference_complete"],
                "STATUS_SHA256",hashlib.sha256((folder/"status.json").read_bytes()).hexdigest())
          PY
      - name: Confirm no protected tracking data in public artifacts
        if: always()
        run: |
          set -euo pipefail
          test ! -d artifacts
          echo "Official NBA reference probe only; any player-level responses and raw data were saved privately." >> "$GITHUB_STEP_SUMMARY"

  full92-player-touch-source-summary:
    needs: [full92-ledger]
    if: always() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'touch-summary-only:') || contains(github.event.head_commit.message, 'touch-backfill70-only:')) && (needs.full92-ledger.result == 'success' || needs.full92-ledger.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_BRANCH: research/full92-unique-touch-ledger-v1-20261103
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public content guard, no direct private repository checkout
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
      - name: Fetch all 92 private SHA-graded touch ledgers and generate player source totals
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/private-touch-player-summary"
          mkdir -p "$ROOT/gamepulse/fusion/materialized/igp_full92_unique_touch_v1/games" \
                   "$ROOT/gamepulse/catalog"
          source_repo="repos/$PRIVATE_REPO/contents"
          gh api "$source_repo/gamepulse/fusion/full92_touch_player_source_summary_v1.py?ref=$PRIVATE_BRANCH" --jq .content | \
            base64 -d > "$ROOT/full92_touch_player_source_summary_v1.py"
          gh api "$source_repo/gamepulse/fusion/materialized/igp_full92_unique_touch_v1/index.json.gz?ref=$PRIVATE_BRANCH" --jq .content | \
            base64 -d > "$ROOT/gamepulse/fusion/materialized/igp_full92_unique_touch_v1/index.json.gz"
          gh api "$source_repo/gamepulse/catalog/2026-27-integrated-current.json?ref=$PRIVATE_BRANCH" --jq .content | \
            base64 -d > "$ROOT/gamepulse/catalog/2026-27-integrated-current.json"
          export ROOT
          python3 - <<'PY'
          import gzip,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ["ROOT"])
          blob=root/"gamepulse/fusion/materialized/igp_full92_unique_touch_v1/index.json.gz"
          index=json.loads(gzip.decompress(blob.read_bytes()))
          assert index["cohort"]=="FULL92" and index["games"]==92
          assert index["games_with_both_touch_sources"]==92
          for gid,r in sorted(index["by_game"].items()):
              path=r["path"]
              out=root/path
              out.parent.mkdir(parents=True,exist_ok=True)
              q="repos/"+os.environ["PRIVATE_REPO"]+"/contents/"+path+"?ref="+os.environ["PRIVATE_BRANCH"]
              with out.open("wb") as fh:
                  p=subprocess.run(["gh","api",q,"--jq",".content"],capture_output=True,text=True,check=True)
                  import base64
                  fh.write(base64.b64decode(p.stdout))
          print("FULL92_PRIVATE_SOURCE_READ",len(index["by_game"]))
          PY
          ( cd "$ROOT" && python3 full92_touch_player_source_summary_v1.py )
      - name: Commit individual player totals to private QA only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess,time
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"private-touch-player-summary"
          rel="gamepulse/fusion/qa/igp_fullx/full92_touch_player_source_baseline_20261103.json"
          raw=(root/rel).read_bytes()
          assert len(raw)<950000
          expected=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
          endpoint="repos/"+os.environ["PRIVATE_REPO"]+"/contents/"+rel
          for trial in range(12):
              old=subprocess.run(["gh","api",endpoint+"?ref="+os.environ["PRIVATE_BRANCH"]],
                                 capture_output=True,text=True)
              prior=json.loads(old.stdout) if old.returncode==0 else {}
              if prior.get("sha")==expected:break
              doc={"branch":os.environ["PRIVATE_BRANCH"],
                   "message":"qa: private all-player Full92 source touch counts",
                   "content":base64.b64encode(raw).decode()}
              if prior.get("sha"):doc["sha"]=prior["sha"]
              x=subprocess.run(["gh","api","-X","PUT",endpoint,"--input","-"],
                              input=json.dumps(doc),text=True,capture_output=True)
              if x.returncode==0:
                  assert json.loads(x.stdout)["content"]["sha"]==expected
                  break
              time.sleep(3+trial)
          else:raise RuntimeError("PRIVATE_SOURCE_PLAYER_SUMMARY_PUBLISH_FAILURE")
          receipt=json.loads(raw)
          print("FULL92_PLAYER_SOURCE_PRIVATE_QA_SAVED",
                "GAMES",receipt["games"],
                "PLAYERS",receipt["players_with_touch_evidence"],
                "GRADES",json.dumps(receipt["source_handler_grades"],sort_keys=True),
                "QA_SHA256",hashlib.sha256(raw).hexdigest())
          PY
      - name: No public player-level touch outputs
        if: always()
        run: |
          test ! -d artifacts
          echo "Full92 player-level source counts reside only in private GitHub; public log aggregate only." >> "$GITHUB_STEP_SUMMARY"
