name: Full92 private original-SDK touch backfill and unique-ledger QA
# PUBLIC runner contains source-free code only; original NBA tracking remains private.
# Checkout uses private token only for private/104. Never upload private payload.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/full92-private-unique-touch-ledger-v1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full92-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout public guard (no private payload)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public/private boundary preflight without REST rate-limit dependency
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test ! -d artifacts

      - name: Sparse checkout frozen Full92 research and official PBP
        uses: actions/checkout@v4
        with:
          repository: timeedmonds-maker/104
          ref: research/full92-unique-touch-ledger-v1-20261103
          token: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          persist-credentials: true
          fetch-depth: 1
          path: private-full92
          sparse-checkout: |
            gamepulse/fusion/full92_unique_touch_ledger_v1.py
            gamepulse/fusion/full92_touch_count_acceptance_v1.py
            gamepulse/fusion/tests/test_full92_unique_touch_ledger_v1.py
            gamepulse/fusion/tests/test_full92_touch_count_acceptance_v1.py
            gamepulse/fusion/materialized/igp_full92_pbp_event_tracking_v1
            gamepulse/live/touches
            gamepulse/live/tracking_touches
            gamepulse/live/original_sdk_handler_touches

      - name: Sparse checkout older Full92 live sidecars from private main
        uses: actions/checkout@v4
        with:
          repository: timeedmonds-maker/104
          ref: main
          token: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-main
          sparse-checkout: |
            gamepulse/live/touches
            gamepulse/live/tracking_touches
            gamepulse/live/original_sdk_handler_touches

      - name: Assemble SHA-frozen exact Full92 sources locally; no network API fanout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path
          research=Path("private-full92")
          main=Path("private-main")
          event=json.loads((research/"gamepulse/fusion/materialized/igp_full92_pbp_event_tracking_v1/index.json").read_text())
          ids=sorted(event["by_game"])
          if event.get("games")!=92 or event.get("cohort")!="FULL92" or len(ids)!=92:
              raise ValueError("FROZEN_EXACT_92_GAME_SET_DRIFT")
          copied=0
          for gid in ids:
              for sub in ("touches","tracking_touches","original_sdk_handler_touches"):
                  stem=Path("gamepulse/live")/sub/(gid+".json")
                  if any((research/Path(str(stem)+suffix)).exists() for suffix in ("",".gz")):
                      continue
                  for suffix in ("",".gz"):
                      src=main/Path(str(stem)+suffix)
                      if src.is_file():
                          dest=research/Path(str(stem)+suffix)
                          dest.parent.mkdir(parents=True,exist_ok=True)
                          shutil.copyfile(src,dest)
                          copied+=1
                          break
          print("PRIVATE_FULL92_SPARSE_SOURCE_READY",
                "GAMES",len(ids),"LEGACY_SOURCE_SIDECARS_COPIED",copied)
          PY

      - name: Run source-free unit tests and frozen private Full92 integration
        shell: bash
        run: |
          set -euo pipefail
          cd private-full92
          python3 -m unittest discover -s gamepulse/fusion/tests -p 'test_full92_unique_touch_ledger_v1.py' -v
          python3 -m unittest discover -s gamepulse/fusion/tests -p 'test_full92_touch_count_acceptance_v1.py' -v
          python3 gamepulse/fusion/full92_unique_touch_ledger_v1.py --root .

      - name: Independently verify compressed source parity and commit 92 ledgers once
        shell: bash
        run: |
          set -euo pipefail
          cd private-full92
          python3 - <<'PY'
          import gzip,json,hashlib
          from pathlib import Path
          source=Path("gamepulse/fusion/materialized/igp_full92_unique_touch_v1")
          blob=(source/"index.json.gz").read_bytes()
          idx=json.loads(gzip.decompress(blob))
          if idx.get("games")!=92 or idx.get("games_with_both_touch_sources")!=92:
              raise ValueError("FULL92_TOUCH_SIDECAR_COMPLETENESS_FAIL_CLOSED")
          if set(idx["by_game"])!=set(json.loads(Path("gamepulse/fusion/materialized/igp_full92_pbp_event_tracking_v1/index.json").read_text())["by_game"]):
              raise ValueError("FROZEN_FULL92_GAME_SET_DIFFERENCE")
          counts={}
          for gid,r in idx["by_game"].items():
              raw=Path(r["path"]).read_bytes()
              if hashlib.sha256(raw).hexdigest()!=r["sha256"]:
                  raise ValueError("ORIGINAL_PER_GAME_TOUCH_LEDGER_SHA_MISMATCH")
              g=json.loads(gzip.decompress(raw))
              if g["game_id"]!=gid:
                  raise ValueError("FULL92_GAME_TOUCH_ID_MISMATCH")
              counts[g["native_handler_source_grade"]]=counts.get(g["native_handler_source_grade"],0)+1
          print("PRIVATE_FULL92_LEDGER_VERIFIED","GAMES",len(idx["by_game"]),
                "BOTH_SOURCES",idx["games_with_both_touch_sources"],
                "ORIGINAL_HANDLER_GRADES",json.dumps(counts,sort_keys=True),
                "OFFICIAL_ACTIONS",idx["counts"]["official_actions"],
                "INDEX_SHA256",hashlib.sha256(blob).hexdigest())
          PY
          git config user.name "IGP Private Evidence Runner"
          git config user.email "igp-source-runner@users.noreply.github.com"
          git add -f gamepulse/fusion/materialized/igp_full92_unique_touch_v1/
          if git diff --cached --quiet; then
            echo "FULL92_PRIVATE_TOUCH_LEDGER_ALREADY_CURRENT"
          else
            git commit -m "qa: SHA-readback Full92 92-game original touch evidence ledger"
            git push origin HEAD:refs/heads/research/full92-unique-touch-ledger-v1-20261103
          fi
          echo "Private-only Full92 game-index readback complete." >> "$GITHUB_STEP_SUMMARY"

      - name: Assert no licensed payload in PUBLIC job outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test ! -d artifacts
          echo "All private source, original timestamps and player touch ledgers remain in the private repository checkout. No public artifacts." >> "$GITHUB_STEP_SUMMARY"
