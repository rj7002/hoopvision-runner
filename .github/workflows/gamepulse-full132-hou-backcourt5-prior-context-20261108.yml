# Source-first official-PBP context split for the frozen 518-row Full132 Houston ledger.
# No NBA native coordinates, per-possession rows or licensed materials in public outputs.
name: Full132 Rockets backcourt5 prior-event context
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gamepulse-full132-hou-backcourt5-prior-context-20261108.yml
      - tools/public_content_guard.py
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: full132-rockets-backcourt5-prior-context-20261108
  cancel-in-progress: false
jobs:
  prior-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/full132-rockets-backcourt5-possession-outcomes-20261108
      REPO: timeedmonds-maker/104
      OUT: gamepulse/fusion/qa/analysis/full132_hou_backcourt5_prior_context_20261108.json
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify public source policy and authenticated access
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Classify the unchanged frozen 518-row candidate ledger using nine original official NBA PBP files
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 --filter=blob:none --sparse -b "$BRANCH" "https://github.com/$REPO.git" "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          git sparse-checkout set --no-cone \
            'gamepulse/fusion/igp_full132_hou_backcourt5_prior_context_v1.py' \
            'gamepulse/fusion/universal_possession_alignment_2026.py' \
            'gamepulse/fusion/qa/analysis/full132_hou_backcourt5_first_five_20261108.json' \
            'gamepulse/fusion/official_pbp_timing/games/0022600009.json' \
            'gamepulse/fusion/official_pbp_timing/games/0022600021.json' \
            'gamepulse/fusion/official_pbp_timing/games/0022600091.json' \
            'gamepulse/fusion/official_pbp_timing/games/0022600107.json' \
            'gamepulse/fusion/official_pbp_timing/games/0022600125.json' \
            'gamepulse/fusion/official_pbp_timing/games/0022600138.json' \
            'gamepulse/fusion/official_pbp_timing/games/0022600153.json' \
            'gamepulse/fusion/official_pbp_timing/games/0022600167.json' \
            'gamepulse/fusion/official_pbp_timing/games/0022600181.json'
          export PYTHONPATH=gamepulse/fusion
          python3 -B gamepulse/fusion/igp_full132_hou_backcourt5_prior_context_v1.py \
            --input gamepulse/fusion/qa/analysis/full132_hou_backcourt5_first_five_20261108.json \
            --out "$RUNNER_TEMP/prior-context-private.json"
      - name: Persist detailed per-player and per-action segmentation to private repo only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,base64,os,subprocess,time
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'prior-context-private.json'
          report=json.loads(path.read_text())
          assert report['schema']=='igp.full132.hou.backcourt5.prior_context.outcomes.v1'
          assert len(report['private_candidate_rows'])==518
          assert sum(v['n'] for v in report['aggregate'].values())==518
          assert sum(v['points'] for v in report['aggregate'].values())==634
          endpoint='repos/'+os.environ['REPO']+'/contents/'+os.environ['OUT']
          base={'branch':os.environ['BRANCH'],
            'message':'qa(igp): official PBP three-entry contexts for Full132 Houston 518 sequences [skip ci]',
            'content':base64.b64encode(path.read_bytes()).decode()}
          for attempt in range(12):
            old=subprocess.run(['gh','api',endpoint+'?ref='+os.environ['BRANCH']],capture_output=True,text=True)
            req=dict(base)
            if old.returncode==0:req['sha']=json.loads(old.stdout)['sha']
            result=subprocess.run(['gh','api','-X','PUT',endpoint,'--input','-'],
              input=json.dumps(req),capture_output=True,text=True)
            if result.returncode==0:
              print('PRIVATE_FULL132_ENTRY_CONTEXT_RESULT_PERSISTED')
              break
            time.sleep(2+attempt)
          else: raise RuntimeError('PRIVATE_CONTEXT_PERSISTENCE_FAILED')
          PY
