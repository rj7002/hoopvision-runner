# Public only orchestrates pinned private exact 88-game source overlap.
# Licensed NBA player/ball positions, private ledgers and detailed audits remain private.
name: Full88 exact unguarded versus guarded private source overlap
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full88-exact-unguarded-marginal88-private-20261102.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-full88-exact-unguarded-marginal-source-20261102
  cancel-in-progress: false
jobs:
  exact-private-overlap:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/igp-full88-unguarded-p2b-marginal-20261102
      PRIVATE_SHA: b6433069ae766805a57186baef78ec8b42a35fcd
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Confidential public runner boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Exact pinned private source and code verification
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --depth=1 --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          test "$(git rev-parse HEAD)" = "$PRIVATE_SHA" || { echo FULL88_EXACT_RESEARCH_HEAD_DRIFT; exit 17; }
          git sparse-checkout set gamepulse/fusion
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_full88_p2b_exact_marginal88_census_v1.py
          for suite in test_igp_full88_unguarded_p2b_research_v1.py test_igp_full88_p2b_marginal_holdout_audit_v1.py test_igp_full88_new17_shortgap_source_challenge_v1.py test_igp_full88_default_engine_v3.py; do
            python3 -m unittest discover -s gamepulse/fusion/tests -p "$suite" -q > "$RUNNER_TEMP/$suite.log" 2>&1 || {
              echo FULL88_EXACT_PRIVATE_UNIT_SOURCE_RELEASE_FAILED
              exit 18
            }
          done
          echo FULL88_EXACT_PRIVATE_FROZEN_ENGINE_AND_SOURCE_TEST_PASS
      - name: Replay exact guarded and unguarded 10Hz scene sets all88
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          target=gamepulse/fusion/qa/igp_fullx/full88_exact_unguarded_marginal88_source_20261102.json
          python3 gamepulse/fusion/igp_full88_p2b_exact_marginal88_census_v1.py --root . --out "$target" > "$RUNNER_TEMP/exact-marginal-private.log" 2>&1 || {
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'exact-marginal-private.log').read_text(errors='replace').splitlines()
          err=next((line for line in reversed(lines) if re.match(r'^(ValueError|TypeError|KeyError|FileNotFoundError|AssertionError|IndexError|AttributeError):',line)),None)
          print('FULL88_EXACT_PRIVATE_SOURCE_ERROR',re.sub(r'[0-9]{4,}','[ID]',err or 'UNKNOWN')[:200])
          PY
            echo FULL88_EXACT_PRIVATE_RECONCILIATION_FAILED
            exit 19
          }
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('gamepulse/fusion/qa/igp_fullx/full88_exact_unguarded_marginal88_source_20261102.json')
          q=json.loads(p.read_text())
          c=q["counts"]
          assert q["games"]==88 and len(q["per_game"])==88
          assert c["strict_S1_10hz"]==1467234
          assert c["accepted_guarded_complete"]==1280963
          assert q["bycohort"]["frozen71"]["unguarded_research_complete"]==1035995
          assert c["unguarded_only_exact"]-c["guarded_only"]==c["unguarded_research_complete"]-c["accepted_guarded_complete"]
          assert q["default_engine_changed"] is False
          assert q["independent_video_correct_coordinates_certified"] is False
          print("FULL88_EXACT_PRIVATE_MARGINAL88_RECONCILIATION_PASS",json.dumps({
              "strict_S1":c["strict_S1_10hz"],"guarded":c["accepted_guarded_complete"],
              "unguarded":c["unguarded_research_complete"],
              "unguarded_only":c["unguarded_only_exact"],
              "guarded_only":c["guarded_only"],
              "both":c["both_complete"],
              "neither":c["neither_complete"]},sort_keys=True))
          PY
      - name: Commit detailed exact matched scene evidence privately only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          target=gamepulse/fusion/qa/igp_fullx/full88_exact_unguarded_marginal88_source_20261102.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$target"
          git diff --cached --check
          if git diff --cached --quiet; then echo FULL88_EXACT_QA_ALREADY_EXISTS_IDENTICALLY; exit 0; fi
          git commit -qm 'qa(private): exact source SHA 88 game guarded and unguarded marginal scene overlap [skip ci]'
          for n in 1 2 3 4 5; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH" || exit 27
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo FULL88_EXACT_MARGINAL88_PRIVATE_SOURCE_EVIDENCE_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 28
