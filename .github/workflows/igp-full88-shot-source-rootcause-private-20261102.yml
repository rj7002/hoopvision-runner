# Public runner is an opaque job definition only. Source and per-shot QA remain private.
name: FULL88 original Blueprint shot rootcause exact-identity audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full88-shot-source-rootcause-private-20261102.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: full88-shot-analytics-source-rootcause-private-20261102
  cancel-in-progress: false
jobs:
  original-source-rootcause:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: analysis/igp-full88-shot-missingness-rootcause-20261102
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify opaque-runner public source guard
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Clone only private original Blueprint and frozen official ledgers
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set --no-cone \
            /gamepulse/fusion/igp_full88_default_engine_v1.py \
            /gamepulse/fusion/igp_full88_event_spine_integrity_v1.py \
            /gamepulse/fusion/igp_full88_shot_analytics_rootcause_v1.py \
            /gamepulse/fusion/qa/igp_fullx/shot_event_multiview_full88_v1.json \
            /gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/shot_event_multiview_full88_v1/shots/ \
            /gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/shot_event_multiview_full88_v1/events/ \
            /data/extensions/nba_blueprint_2026_27/games/
          cd "$RUNNER_TEMP/private"
          python3 -m py_compile gamepulse/fusion/igp_full88_shot_analytics_rootcause_v1.py
          python3 gamepulse/fusion/igp_full88_shot_analytics_rootcause_v1.py --self-test
      - name: Exact original-source versus stored-ledger reconciliation all 88 games
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 gamepulse/fusion/igp_full88_shot_analytics_rootcause_v1.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          f=Path('gamepulse/fusion/qa/igp_fullx/full88_shot_analytics_rootcause_20261102.json')
          d=json.loads(f.read_text())
          assert d['games']==88
          t=d['totals']
          assert t['official_fga']==15584 and t['no_analytics_shots']==1168
          assert t['blueprint_accepted_frozen']==14346
          assert d['frozen_official_shot_and_default_engine_unchanged']
          print('FULL88_ORIGINAL_BLUEPRINT_PRIVATE_QA_PASS', d['games'], t['official_fga'],t['no_analytics_shots'])
          PY
      - name: Commit source diagnostics to private branch only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f gamepulse/fusion/qa/igp_fullx/full88_shot_analytics_rootcause_20261102.json
          git diff --cached --check
          if git diff --cached --quiet; then echo PRIVATE_FULL88_ROOTCAUSE_QA_ALREADY_IDENTICAL; exit 0; fi
          git commit -qm 'qa(private): freeze Full88 source-vs-ledger shot-feature rootcause [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$PRIVATE_BRANCH"
            git rebase -q "origin/$PRIVATE_BRANCH"
            if git push -q origin "HEAD:refs/heads/$PRIVATE_BRANCH"; then
              echo FULL88_ROOTCAUSE_QA_COMMITTED_PRIVATE_ONLY
              exit 0
            fi
            sleep "$attempt"
          done
          exit 29
