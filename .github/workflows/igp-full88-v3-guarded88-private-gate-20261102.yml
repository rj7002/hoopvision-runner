# Opaque public-to-private Full88 v3 source/scene release validation.
# No licensed coordinates, private files or player-level outputs enter public logs.
# Reviewed allowlist gate: only aggregate acceptance status may enter public logs.
# Release retest: official assist + NCEA canonical action crosswalk 2026-11-02.
name: Full88 v3 guarded 88-game original-source release candidate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/igp-full88-v3-guarded88-private-gate-20261102.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: full88-v3-guarded88-source-release-20261102
  cancel-in-progress: false
jobs:
  private-source-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: research/gamepulse-clock-boundary-integrity-20261025
      PRIVATE_SHA: d9bd6458ffa07aa24a3c19baa112e9bdf18e4d39
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Confidential bridge guard
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Clone pinned private source and run Full88 v3 source-free and real SHA gates
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          cd "$RUNNER_TEMP/private"
          test "$(git rev-parse HEAD)" = "$PRIVATE_SHA" || { echo "FULL88_V3_PRIVATE_SOURCE_HEAD_MOVED_FAIL_CLOSED"; exit 17; }
          git sparse-checkout set --no-cone \
            '/gamepulse/fusion/*.py' \
            /gamepulse/fusion/tests/test_igp_full88_default_engine_v1.py \
            /gamepulse/fusion/tests/test_igp_full88_default_engine_v2.py \
            /gamepulse/fusion/tests/test_igp_full88_default_engine_v3.py \
            /gamepulse/fusion/qa/igp_fullx/shot_event_multiview_full88_v1.json \
            /gamepulse/fusion/qa/igp_fullx/full88_new7_guarded_p2b_shadow_20261102.json \
            /gamepulse/fusion/qa/igp_fullx/full88_original_pbp_all88_chain_census_20261102.json \
            /gamepulse/fusion/qa/igp_fullx/full88_advanced_team_poss_and_official_score_v1.json \
            /gamepulse/fusion/qa/igp81_nba_team_offrtg_reporting_default_v1.json \
            /gamepulse/fusion/qa/igp_fullx/official_assist_census_full88_v1.json \
            /gamepulse/fusion/qa/igp_fullx/official_assist_events_full88_v1.jsonl \
            /gamepulse/fusion/qa/igp_fullx/ncea_full88_multi_event_shadow_v3.json \
            /gamepulse/fusion/qa/igp_fullx/ncea_full88_multi_event_shadow_v3.jsonl \
            /gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/shot_event_multiview_full88_v1/events/ \
            /gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/shot_event_multiview_full88_v1/shots/0022600153.jsonl.gz \
            /gamepulse/fusion/tests/test_igp_full88_v3_event_evidence.py \
            /gamepulse/fusion/tests/test_igp_full88_default_engine_v1.py \
            /gamepulse/fusion/tests/test_igp_full88_default_engine_v2.py \
            /gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/shot_event_multiview_full88_v1/shots/0022600153.jsonl.gz \
            /gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/post56_additive_20261028/index.json \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600147/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600148/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600149/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600150/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600151/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600152/ \
            /gamepulse/fusion/materialized/igp_all_original_xyz/0022600153/ \
            /gamepulse/fusion/official_pbp_timing/games/0022600147.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600148.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600149.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600150.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600151.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600152.json \
            /gamepulse/fusion/official_pbp_timing/games/0022600153.json \
            /gamepulse/fusion/official_pbp_timing/original_nba_20261029/0022600147/boxscore.json \
            /gamepulse/fusion/official_pbp_timing/original_nba_20261029/0022600148/boxscore.json \
            /gamepulse/fusion/official_pbp_timing/original_nba_20261029/0022600149/boxscore.json \
            /gamepulse/fusion/official_pbp_timing/original_nba_20261029/0022600150/boxscore.json \
            /gamepulse/fusion/official_pbp_timing/original_nba_20261029/0022600151/boxscore.json \
            /gamepulse/fusion/official_pbp_timing/original_nba_20261029/0022600152/boxscore.json \
            /gamepulse/fusion/official_pbp_timing/original_nba_20261029/0022600153/boxscore.json
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_full88_v3_source_gate.py gamepulse/fusion/igp_full88_new7_guarded_scene_v3.py gamepulse/fusion/igp_full88_default_engine_v3.py
          for suite in test_igp_full88_default_engine_v1.py test_igp_full88_default_engine_v2.py; do
            python3 -m unittest discover -s gamepulse/fusion/tests -p "$suite" -q > "$RUNNER_TEMP/$suite.private.log" 2>&1 || { echo "FULL88_V3_LEGACY_RELEASE_REGRESSION_FAILED"; exit 1; }
          done
          python3 -m unittest discover -s gamepulse/fusion/tests -p 'test_igp_full88_default_engine_v1.py' -q > "$RUNNER_TEMP/v1compat.private.log" 2>&1 || { echo "FULL88_V3_V1_ROLLBACK_REGRESSION_FAILURE"; exit 1; }
          python3 -m unittest discover -s gamepulse/fusion/tests -p 'test_igp_full88_default_engine_v2.py' -q > "$RUNNER_TEMP/v2compat.private.log" 2>&1 || { echo "FULL88_V3_V2_ROLLBACK_REGRESSION_FAILURE"; exit 1; }
          python3 -m unittest discover -s gamepulse/fusion/tests -p 'test_igp_full88_v3_event_evidence.py' -q > "$RUNNER_TEMP/v3events.private.log" 2>&1 || {
            echo "FULL88_V3_PRIVATE_EVENT_SOURCE_CROSSWALK_TEST_FAILURE"
            exit 1
          }
          python3 -m unittest discover -s gamepulse/fusion/tests -p 'test_igp_full88_default_engine_v3.py' -q > "$RUNNER_TEMP/v3tests.private.log" 2>&1 || {
            echo "FULL88_V3_PRIVATE_UNIT_TEST_FAILURE"
            exit 1
          }
          python3 - <<'PY' > "$RUNNER_TEMP/v3source.private.log" 2>&1
          import json
          from pathlib import Path
          from igp_full88_v3_source_gate import NEW7,validate
          from igp_full88_default_engine_v1 import _load_index
          from igp_native_scene_season_68_benchmark_v1 import load_game
          from igp_full88_default_engine_v3 import query,scene
          r=validate(".")
          index=_load_index(".")
          for gid in sorted(NEW7):
              native,meta,sha=load_game(Path("."),gid)
              assert sha==index["games"][gid]["source_sha256"]["ORIGINAL_NATIVE_MANIFEST"]
              assert len(native)==meta["original_frame_counts"]["unique_original_native_timestamps"]
              assert meta["capture_archive_all_13_parts_verified"] is True
              assert meta["original_archive_part_count_verified"]==13
          x=query(".",game_id="0022600153",team="HOU",include_game_grades=False)
          assert x["accepted_guarded_P2B_10hz_games"]==88
          assert x["full88_published_team_statistical_and_OffRtg"]["team_possession_denominator"]==94
          assert x["original_pbp_logical_chains"]["original_pbp_logical_chains"]==17989
          native,_,_=load_game(Path("."),"0022600153")
          t=native[len(native)//2][0]
          s=scene(".","0022600153",t,t+200,mode="guarded_10hz",limit=5)
          assert s["guarded_source_grade_admitted"] is True and len(s["rows"])>=1
          assert s["physical_possession_boundaries_certified"]==0
          print("FULL88_V3_PRIVATE_PASS",r["tracking_games"],r["full88_complete"],r["full88_total"])
          PY
          python3 gamepulse/fusion/igp_default_engine.py --root . --evidence-family assists --player-id 1630578 --limit 1 > "$RUNNER_TEMP/assists-query.private.json"
          python3 gamepulse/fusion/igp_default_engine.py --root . --evidence-family ncea --event-type REBOUND --limit 1 > "$RUNNER_TEMP/ncea-query.private.json"
          python3 - <<'PY' > "$RUNNER_TEMP/v3-cli.private.log"
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])
          a=json.loads((p/"assists-query.private.json").read_text())
          b=json.loads((p/"ncea-query.private.json").read_text())
          assert a["reporting_engine_id"]=="IGP_FULL88_V3_GUARDED_88_AND_OFFICIAL_EVENTS_20261102"
          assert a["total_matches"]==37
          assert len(a["rows"])==1 and a["rows"][0]["physical_pass_endpoints_certified"] is False
          assert b["total_matches"]==9523
          assert len(b["rows"])==1 and b["rows"][0]["certified_physical_contact"] is False
          print("FULL88_V3_PRIVATE_CLI_EVIDENCE_QUERY_OK")
          PY
          if grep -q FULL88_V3_PRIVATE_PASS "$RUNNER_TEMP/v3source.private.log"; then
            echo FULL88_V3_PRIVATE_SOURCE_AND_SCENE_RELEASE_GATE_PASS
          else
            echo FULL88_V3_PRIVATE_SOURCE_OR_SCENE_RELEASE_GATE_FAILED
            exit 1
          fi
