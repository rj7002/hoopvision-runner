name: NBA official zone defense G League host discovery
'on':
  push:
    branches: [research/inside-game-zone-api-discovery-20261105]
    paths: ['.github/workflows/nba-zone-defense-gleague-host-probe-20261105.yml']
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compare previously successful NBA G League Stats relay and new zone resource
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, json, urllib.parse, urllib.request, hashlib, time
          base="https://stats.gleague.nba.com/stats/"
          cases=[
            ("zone_def_2627","zonedefenseteamleaders","2026-27","defense"),
            ("zone_off_2627","zonedefenseteamleaders","2026-27","offense"),
            ("zone_def_2526","zonedefenseteamleaders","2025-26","defense"),
            ("gravity_control","gravityleaders","2026-27",None),
          ]
          def check(p):
            title,resource,season,side=p
            pars={"LeagueID":"00","Season":season,"SeasonType":"Regular Season"}
            if side is not None: pars["type"]=side
            url=base+resource+"?"+urllib.parse.urlencode(pars)
            req=urllib.request.Request(url,headers={
              "User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36",
              "Origin":"https://www.nba.com","Referer":"https://www.nba.com/",
              "Accept":"application/json","Accept-Language":"en-US,en;q=0.9"
            })
            try:
              with urllib.request.urlopen(req,timeout=24) as r:
                raw=r.read(10000000);status=r.status;ct=r.headers.get("Content-Type")
              v=json.loads(raw)
              return dict(name=title,status=status,ct=ct,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),top_keys=list(v)[:20] if isinstance(v,dict) else ["ARRAY"],zone_rows=len(v.get("teamZoneDefense",[])) if isinstance(v,dict) and isinstance(v.get("teamZoneDefense"),list) else None,first_row_fields=list(v["teamZoneDefense"][0])[:50] if isinstance(v,dict) and v.get("teamZoneDefense") else [],gravity_rows=len(v.get("leaders",[])) if isinstance(v,dict) and isinstance(v.get("leaders"),list) else None)
            except Exception as e:
              return dict(name=title,error=type(e).__name__,detail=str(e)[:200])
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
            for result in pool.map(check,cases):print("GLEAGUE_OFFICIAL_API",json.dumps(result),flush=True)
          PY
