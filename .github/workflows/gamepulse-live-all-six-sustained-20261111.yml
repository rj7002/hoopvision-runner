name: IGP live original XYZ all six Nov10 NBA games sustained
# CPU-only source capture US Nov 10 2026 six exact NBA game IDs.
# Retigger verified Git-based private archive fallback to correct earlier release API storage failures.
# Original SDK responses go only to private 104 gamepulse-live-sdk-<game> release.
# No post-final replay dependency, no imputed source observations, and no GPU.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-live-all-six-sustained-20261111.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-nov11-six-original-live-verified-fallback
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify source boundary and realtime collector syntax
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          node --check tools/licensed_feed/live_realtime_20261111.mjs
          node --test tools/licensed_feed/live_discovery.test.mjs tools/licensed_feed/live_capture_cycle.test.mjs
          echo IGP_SIX_LIVE_SOURCE_PREFLIGHT_PASSED
  early-games:
    needs: preflight
    if: needs.preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {id: '0022600211', tipoff: '2026-11-11T00:30:00.000Z'}
          - {id: '0022600212', tipoff: '2026-11-11T01:00:00.000Z'}
    concurrency:
      group: igp-nov11-sustained-verified-${{ matrix.id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install licensed SDK without install scripts
        working-directory: tools/licensed_feed
        run: |
          set -euo pipefail
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Preserve live original player and ball positions with private SHA readback
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_LIVE_ID: ${{ matrix.id }}
          GAMEPULSE_LIVE_TIPOFF: ${{ matrix.tipoff }}
          IGP_REALTIME_CAPTURE_MS: '15300000'
          IGP_REALTIME_PRETIPOFF_WAIT_MS: '3600000'
          IGP_REALTIME_FLUSH_MS: '90000'
        run: |
          set -euo pipefail
          node live_realtime_20261111.mjs
  delay-middle:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Hold until just before 02:00 UTC games without depending on GitHub cron
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,time
          start=datetime.datetime.fromisoformat('2026-11-11T01:52:00+00:00').timestamp()
          remaining=max(0,start-time.time())
          print('IGP_MIDDLE_SOURCE_CAPTURE_WINDOW',int(remaining))
          time.sleep(remaining)
          PY
  middle-games:
    needs: [preflight,delay-middle]
    if: needs.preflight.result == 'success' && needs.delay-middle.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {id: '0022600213', tipoff: '2026-11-11T02:00:00.000Z'}
          - {id: '0022600214', tipoff: '2026-11-11T02:00:00.000Z'}
          - {id: '0022600215', tipoff: '2026-11-11T03:00:00.000Z'}
    concurrency:
      group: igp-nov11-sustained-verified-${{ matrix.id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install licensed SDK without install scripts
        working-directory: tools/licensed_feed
        run: |
          set -euo pipefail
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Preserve live original player and ball positions with private SHA readback
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_LIVE_ID: ${{ matrix.id }}
          GAMEPULSE_LIVE_TIPOFF: ${{ matrix.tipoff }}
          IGP_REALTIME_CAPTURE_MS: '15300000'
          IGP_REALTIME_PRETIPOFF_WAIT_MS: '5400000'
          IGP_REALTIME_FLUSH_MS: '90000'
        run: |
          set -euo pipefail
          node live_realtime_20261111.mjs
  delay-late:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 205
    steps:
      - name: Hold until just before 04:00 UTC tipoff independently of cron
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,time
          start=datetime.datetime.fromisoformat('2026-11-11T03:52:00+00:00').timestamp()
          remaining=max(0,start-time.time())
          print('IGP_LATE_SOURCE_CAPTURE_WINDOW',int(remaining))
          time.sleep(remaining)
          PY
  late-game:
    needs: [preflight,delay-late]
    if: needs.preflight.result == 'success' && needs.delay-late.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: '0022600216', tipoff: '2026-11-11T04:00:00.000Z'}
    concurrency:
      group: igp-nov11-sustained-verified-${{ matrix.id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install licensed SDK without install scripts
        working-directory: tools/licensed_feed
        run: |
          set -euo pipefail
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
      - name: Preserve live original player and ball positions with private SHA readback
        working-directory: tools/licensed_feed
        env:
          GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
          GAMEPULSE_LIVE_ID: ${{ matrix.id }}
          GAMEPULSE_LIVE_TIPOFF: ${{ matrix.tipoff }}
          IGP_REALTIME_CAPTURE_MS: '15300000'
          IGP_REALTIME_PRETIPOFF_WAIT_MS: '3600000'
          IGP_REALTIME_FLUSH_MS: '90000'
        run: |
          set -euo pipefail
          node live_realtime_20261111.mjs

  postfinal-window-cohort-test:
    # Genuine postgame availability experiment. The official game identity and
    # status=3 are mandatory before any attempted source read. The same browser
    # SDK client must acquire each original slot: never replay credentials, forge
    # a signed URL, or continue when the app explicitly disables retrieval.
    # Original XYZ and timing receipts remain SHA checked in private 104 Git.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {id: '0022600213', tipoff: '2026-11-11T02:00:00.000Z'}
          - {id: '0022600214', tipoff: '2026-11-11T02:00:00.000Z'}
          - {id: '0022600215', tipoff: '2026-11-11T03:00:00.000Z'}
          - {id: '0022600216', tipoff: '2026-11-11T04:00:00.000Z'}
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      GAMEPULSE_LIVE_ID: ${{ matrix.id }}
      GAMEPULSE_LIVE_TIPOFF: ${{ matrix.tipoff }}
      IGP_REALTIME_CAPTURE_MS: '2400000'
      IGP_REALTIME_LIVE_STOP_MS: '18000000'
      IGP_REALTIME_PRETIPOFF_WAIT_MS: '0'
      IGP_REALTIME_FLUSH_MS: '20000'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Source/security/CI validation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          node --check tools/licensed_feed/live_realtime_all_games.mjs
          node --test tools/licensed_feed/live_evergreen_discovery.test.mjs
      - name: Require this exact NBA game officially FINAL at execution time
        id: official
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          const id=process.env.GAMEPULSE_LIVE_ID, now=new Date().toISOString();
          let status=null, grade='UNKNOWN';
          const base={headers:{Accept:'application/json',Referer:'https://www.nba.com/'},
            signal:AbortSignal.timeout(12000)};
          try {
            const response=await fetch('https://cdn.nba.com/static/json/liveData/boxscore/boxscore_'+id+'.json',base);
            if(response.ok){
              const g=(await response.json())?.game;
              if(String(g?.gameId)===id){
                status=Number(g.gameStatus);
                grade='OFFICIAL_BOXSCORE';
              }
            }
          }catch{}
          if(status!==3){
            try{
              const r=await fetch('https://cdn.nba.com/static/json/staticData/scheduleLeagueV2.json',base);
              if(r.ok){
                const body=await r.json(),games=(body?.leagueSchedule?.gameDates||[]).flatMap(d=>d.games||[]);
                const g=games.find(g=>String(g.gameId)===id);
                if(g&&grade==='UNKNOWN'){status=Number(g.gameStatus);grade='OFFICIAL_SCHEDULE';}
                else if(g&&Number(g.gameStatus)===3){status=3;grade='OFFICIAL_SCHEDULE';}
              }
            }catch{}
          }
          const final=status===3;
          console.log('IGP_POSTFINAL_EXACT_GAME_OFFICIAL_CHECK',JSON.stringify({
            game_id:id,observation_at_utc:now,official_status:status,grade,
            final_verified:final
          }));
          appendFileSync(process.env.GITHUB_OUTPUT,'final='+String(final)+'\n');
          JS
      - name: Open authorised original SDK while this game's postfinal window remains
        if: steps.official.outputs.final == 'true'
        working-directory: tools/licensed_feed
        shell: bash
        run: |
          set -euo pipefail
          npm config set @ease-live:registry https://easelive.jfrog.io/artifactory/api/npm/npm-public/
          npm install --ignore-scripts --no-audit --no-fund --silent
          node live_realtime_all_games.mjs
          echo IGP_POSTFINAL_ORIGINAL_PLAYER_BALL_SOURCE_WINDOW_PROBED
      - name: Report evidence grade without publishing licensed native XYZ
        if: always()
        run: |
          echo 'This source test is successful only when authenticated original SDK player+ball response(s) are saved with SHA and official gameStatus 3 was verified before opening the SDK. A disabled SDK is an explicit negative test, not a retrieval success.' >> "$GITHUB_STEP_SUMMARY"
