name: IGP 2025-26 public source metadata census
on:
  push:
    branches: [main]
    paths: [.github/workflows/gamepulse-2025-26-public-source-audit.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate public policy and source provenance
        run: |
          python3 tools/public_content_guard.py
          python3 -m py_compile tools/neilball_2025_26_public_archive_ingest.py
      - name: Re-read immutable public 2025-26 archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 4 --retry-delay 8 \
            --output "$RUNNER_TEMP/original.zip" \
            https://downloads.neilball.org/NBA-2025-26-Available-Tracking.zip
          test "$(stat -c%s "$RUNNER_TEMP/original.zip")" -eq 5170096251
          test "$(sha256sum "$RUNNER_TEMP/original.zip" | cut -d' ' -f1)" = '2450b2fafb66698b39a89592c6ac3767c7ba0c3e4581b1a65042041e0f7ea0b0'
          echo ORIGINAL_SOURCE_SHA_2025_26_RECONFIRMED
      - name: Source-only independent 134-game masked XY baseline, aggregate output only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import bisect,collections,gzip,json,math,os,zipfile
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'original.zip'
          z=zipfile.ZipFile(p)
          allgames=sorted(n for n in z.namelist() if n.endswith('/tracking.jsonl.gz'))
          assert len(allgames)==666
          selected=[n for i,n in enumerate(allgames) if i%5==0]
          D=(1000,2000,5000,10000)
          stats={d:{'windows':0,'points':0,'linear':collections.Counter(),
                    'hold':collections.Counter(),'cubic_half':collections.Counter()} for d in D}
          actor_gaps=collections.Counter()
          shapes=collections.Counter()
          total=collections.Counter()
          def xy_actors(row):
              positions={}
              for side in ('home_players','away_players'):
                  entities=row.get(side)
                  if isinstance(entities,dict):items=entities.items()
                  elif isinstance(entities,list):items=enumerate(entities)
                  else:continue
                  for key,entry in items:
                      if not isinstance(entry,dict) and not isinstance(entry,(tuple,list)):
                          shapes[type(entry).__name__]+=1
                          continue
                      ident=None
                      if isinstance(entry,dict):
                          ident=entry.get('player_id',entry.get('playerId',entry.get('personId',entry.get('id'))))
                          value=entry.get('position',entry.get('xyz',entry.get('pos',entry)))
                          if entry.get('interpolated') is True:continue
                      else:value=entry
                      if ident is None and isinstance(entities,dict):ident=key
                      if ident is None:shapes['player_id_unavailable']+=1;continue
                      if isinstance(value,dict):
                          pair=[value.get('x'),value.get('y')]
                      elif isinstance(value,(list,tuple)):
                          pair=list(value[:2])
                      else:pair=[]
                      if len(pair)<2 or not all(isinstance(v,(int,float)) and math.isfinite(v) for v in pair):
                          shapes['xy_unavailable']+=1
                          continue
                      x,y=map(float,pair)
                      if abs(x)>60 or abs(y)>40:
                          shapes['outside_court_guard']+=1
                          continue
                      positions[(side,str(ident))]=(x,y)
              return positions
          def quantile(counter,q):
              n=sum(counter.values())
              if not n:return None
              threshold=math.ceil(q*n);cum=0
              for k,v in sorted(counter.items()):
                  cum+=v
                  if cum>=threshold:return round(k/10,1)
          for name in selected:
              trajectories=collections.defaultdict(list)
              with z.open(name) as outer,gzip.GzipFile(fileobj=outer) as stream:
                  for raw in stream:
                      if not raw.strip():continue
                      row=json.loads(raw)
                      total['rows']+=1
                      quality=row.get('quality') or {}
                      if quality.get('source_interpolated') is True:
                          total['source_interpolated_skipped']+=1
                          continue
                      if quality.get('lineup_known') is not True:
                          total['unknown_lineup_skipped']+=1
                          continue
                      t=row['timestamp_ms']
                      obs=xy_actors(row)
                      total['usable_player_xy']+=len(obs)
                      for key,(x,y) in obs.items():trajectories[key].append((t,x,y))
              for key,seq in trajectories.items():
                  if len(seq)<10:continue
                  seq.sort()
                  ts=[a[0] for a in seq]
                  for k in range(1,len(ts)):
                      delta=ts[k]-ts[k-1]
                      if 450<delta<=30000:
                          for limit in (1000,2000,5000,10000,30001):
                              if delta<limit:
                                  actor_gaps['lt'+str(limit)]+=1
                                  break
                  for i in range(1,len(seq)-8,230):
                      a=seq[i]
                      if not (0<ts[i]-ts[i-1]<=600):continue
                      for duration in D:
                          j=bisect.bisect_left(ts,ts[i]+duration,lo=i+2)
                          if j+1>=len(seq) or abs(ts[j]-ts[i]-duration)>300:continue
                          if not (0<ts[j+1]-ts[j]<=600):continue
                          if any(not 0<ts[k]-ts[k-1]<=600 for k in range(i+1,j+1)):continue
                          b=seq[j]
                          pre=seq[i-1];after=seq[j+1]
                          va=((a[1]-pre[1])*1000/(a[0]-pre[0]),(a[2]-pre[2])*1000/(a[0]-pre[0]))
                          vb=((after[1]-b[1])*1000/(after[0]-b[0]),(after[2]-b[2])*1000/(after[0]-b[0]))
                          def cap(vector,limit=25):
                              s=math.hypot(*vector)
                              return tuple(x*min(1,limit/max(s,1e-9)) for x in vector)
                          va=cap(va);vb=cap(vb)
                          v=stats[duration]
                          v['windows']+=1
                          for obs in seq[i+1:j]:
                              f=(obs[0]-a[0])/(b[0]-a[0])
                              px=a[1]+f*(b[1]-a[1])
                              py=a[2]+f*(b[2]-a[2])
                              le=math.hypot(px-obs[1],py-obs[2])
                              he=math.hypot(a[1]-obs[1],a[2]-obs[2])
                              h00=2*f**3-3*f**2+1
                              h10=f**3-2*f**2+f
                              h01=-2*f**3+3*f**2
                              h11=f**3-f**2
                              span=(b[0]-a[0])/1000
                              cx=h00*a[1]+h10*va[0]*span*.5+h01*b[1]+h11*vb[0]*span*.5
                              cy=h00*a[2]+h10*va[1]*span*.5+h01*b[2]+h11*vb[1]*span*.5
                              ce=math.hypot(cx-obs[1],cy-obs[2])
                              v['linear'][min(100000,int(round(le*10)))]+=1
                              v['hold'][min(100000,int(round(he*10)))]+=1
                              v['cubic_half'][min(100000,int(round(ce*10)))]+=1
                              v['points']+=1
          print('HISTORICAL_MASKED_SOURCE_SAMPLE_GAMES',len(selected),'of',len(allgames))
          print('HISTORICAL_MASKED_SOURCE_SAMPLE_ROWS',dict(total))
          print('HISTORICAL_MASKED_SOURCE_PARSER_WARNINGS',dict(shapes))
          print('HISTORICAL_NATURAL_ACTOR_OBSERVATION_GAPS',dict(actor_gaps))
          for d in D:
              v=stats[d]
              print('HISTORICAL_MASKED_XY_FEET',d,'windows',v['windows'],
                    'points',v['points'],'linear_p50',quantile(v['linear'],.5),
                    'linear_p95',quantile(v['linear'],.95),
                    'hold_p50',quantile(v['hold'],.5),
                    'hold_p95',quantile(v['hold'],.95),
                    'cubic_half_p50',quantile(v['cubic_half'],.5),
                    'cubic_half_p95',quantile(v['cubic_half'],.95))
          assert sum(v['windows'] for v in stats.values())>0
          print('HISTORICAL_MASKED_SOURCE_BASELINE_PASS')
          PY
