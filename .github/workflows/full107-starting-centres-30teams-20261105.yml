# Official boxscore starting-C selection; derived stats stay in private 104.
name: Full107 one starting centre per team
on:
  push:
    branches: [main]
    paths: ['.github/workflows/full107-starting-centres-30teams-20261105.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: full107-center-30teams-20261105
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: analysis/full107-center-defensive-paint-20261105
      PIN: b6574aa75a34f9abb4d2766e71cb5273975458b1
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify public-source guard
        run: python3 tools/public_content_guard.py
      - name: Calculate 30-team official-starter selection against frozen Full107 metric
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          gh auth setup-git
          git clone --quiet --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PIN"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PIN"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PIN"
          cd "$RUNNER_TEMP/private"
          PYTHONPATH=gamepulse/fusion/analysis:gamepulse/fusion python3 - <<'PY'
          import base64,collections,hashlib,json,os,pathlib,subprocess,time
          from igp_full107_pnr_source_run_v1 import full107_games
          games=full107_games('.')
          assert len(games)==107
          cpath='gamepulse/fusion/official_pbp_timing/original_nba_20261029'
          tally=collections.defaultdict(lambda:collections.defaultdict(lambda:{'name':None,'starts':0,'games':[]}))
          team_games=collections.Counter()
          box_count=0;missing_center_games=[]
          for gid in games:
              p=pathlib.Path(cpath,gid,'boxscore.json')
              if not p.is_file():continue
              j=json.loads(p.read_bytes())['game']
              box_count+=1
              for side in ('homeTeam','awayTeam'):
                  team=j[side]['teamTricode']
                  team_games[team]+=1
                  cs=[p for p in j[side]['players'] if p.get('position')=='C']
                  if len(cs)>1:raise ValueError('MULTIPLE_OFFICIAL_START_C:'+gid+':'+team)
                  if not cs:
                      missing_center_games.append({'game':gid,'team':team})
                      continue
                  p=cs[0];pid=str(p['personId'])
                  x=tally[team][pid]
                  x['name']=p.get('name') or (p.get('firstName','')+' '+p.get('familyName','')).strip()
                  x['starts']+=1;x['games'].append(gid)
          target='gamepulse/fusion/qa/analysis/full107_center_defensive_paint_expanded_v2_20261105'
          api='repos/timeedmonds-maker/104/contents/'+target+'/leaderboard.json'
          content=subprocess.check_output(['gh','api',api+'?ref='+os.environ['PRIVATE_BRANCH'],'--jq','.content'],timeout=90)
          leader=json.loads(base64.b64decode(content))
          assert leader['n_full107_games']==107 and leader['all107_games_processed']
          byid={p['id']:p for p in leader['players']}
          teams=['ATL','BOS','BKN','CHA','CHI','CLE','DAL','DEN','DET','GSW','HOU','IND','LAC','LAL','MEM','MIA','MIL','MIN','NOP','NYK','OKC','ORL','PHI','PHX','POR','SAC','SAS','TOR','UTA','WAS']
          rows=[]
          for team in teams:
              if not tally[team]:raise ValueError('NO_OFFICIAL_STARTING_C_FOR_TEAM:'+team)
              candidates=[dict(id=pid,**v) for pid,v in tally[team].items()]
              candidates.sort(key=lambda c:(-c['starts'],-(byid.get(c['id']) or {}).get('defensive_half_qualifying_ms',0),c['id']))
              selected=candidates[0]
              m=byid.get(selected['id'])
              rows.append({'team':team,'player_id':selected['id'],'player':selected['name'],
                           'official_C_starts':selected['starts'],'team_boxscore_games':team_games[team],
                           'tied_for_most_official_C_starts':sum(c['starts']==selected['starts'] for c in candidates)>1,
                           'alternate_official_starting_centers':[{'name':c['name'],'starts':c['starts']} for c in candidates[1:]],
                           'defensive_paint_pct':m['paint_pct_defensive_half'] if m else None,
                           'defensive_end_minutes':m['defensive_half_minutes'] if m else None,
                           'paint_minutes':m['paint_minutes'] if m else None,
                           'observed_games':m['games'] if m else 0,
                           'qualifies_10min_2games':bool(m and m['qualified_high_coverage']),
                           'ball_and_player_original_source_presence_pct':m['observed_source_presence_pct'] if m else None})
          rows.sort(key=lambda r:(-(r['defensive_paint_pct'] if r['defensive_paint_pct'] is not None else -1),r['team']))
          out={'schema':'igp.full107.paint.main-official-starting-C-per-team.v1',
               'full107_source_games':107,'official_position_C_boxscore_games':box_count,
               'team_count':len(rows),'all_30_teams_represented':len(rows)==30,
               'selection':'Most starts at official boxscore position C in available games; tied by original-source defensive-end sample; all-source observed metric not restricted to starts',
               'metric':'100 * original-player paint duration / original-player-and-ball same opponent attack-half time in running-clock windows',
               'metric_is_certified_possession':False,
               'missing_starting_C_team_game_entries':missing_center_games,
               'ranked_teams':rows}
          print('STARTER30_JSON',json.dumps({'games':box_count,'team_count':len(rows),'missing_games':len(missing_center_games),'rows':rows},sort_keys=True))
          raw=(json.dumps(out,sort_keys=True,separators=(',',':'))+'\n').encode()
          dest='repos/timeedmonds-maker/104/contents/'+target+'/starting_centres_30teams.json'
          for trial in range(12):
              old=subprocess.run(['gh','api',dest+'?ref='+os.environ['PRIVATE_BRANCH']],text=True,capture_output=True)
              payload={'branch':os.environ['PRIVATE_BRANCH'],'message':'qa: rank main official starting centres for all 30 teams in Full107','content':base64.b64encode(raw).decode()}
              if old.returncode==0:payload['sha']=json.loads(old.stdout)['sha']
              elif '404' not in old.stderr and 'Not Found' not in old.stderr:raise RuntimeError(old.stderr[:400])
              r=subprocess.run(['gh','api','-X','PUT',dest,'--input','-'],input=json.dumps(payload),text=True,capture_output=True,timeout=100)
              if r.returncode==0:break
              if not any(e in r.stderr for e in ('409','422','429','500','502','503')):raise RuntimeError(r.stderr[:400])
              time.sleep(min(4+trial,15))
          else:raise RuntimeError('PRIVATE_WRITE_FAILED')
          got=base64.b64decode(subprocess.check_output(['gh','api',dest+'?ref='+os.environ['PRIVATE_BRANCH'],'--jq','.content'],timeout=90))
          assert hashlib.sha256(got).digest()==hashlib.sha256(raw).digest()
          print('FULL107_MAIN_STARTING_C_30TEAMS_PRIVATE_SHA_READBACK_VERIFIED',hashlib.sha256(raw).hexdigest())
          PY
