name: IGP 2025-26 defender proxy independent 2026-27 Blueprint agreement
'on':
  push:
    branches: [main]
    paths: [.github/workflows/igp-2025-26-defender-blueprint-compare.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-historical-defender-blueprint-independent-compare
  cancel-in-progress: false
jobs:
  original-xyz-blueprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/gamepulse-clock-boundary-integrity-20261025
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public/Private source isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
      - name: Read only private, SHA-locked current-year original XYZ and published Blueprint
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth=1 --filter=blob:none --sparse -b "$BRANCH" \
            https://x-access-token:$GH_TOKEN@github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion \
            data/extensions/nba_blueprint_2026_27/games/0022600001 \
            data/extensions/nba_blueprint_2026_27/games/0022600002 \
            data/extensions/nba_blueprint_2026_27/games/0022600003 \
            data/extensions/nba_blueprint_2026_27/games/0022600009
          cd "$RUNNER_TEMP/private"
          python3 -m py_compile gamepulse/fusion/igp_historical_defender_blueprint_validation_v1.py
          PYTHONPATH="$PWD/gamepulse/fusion" python3 \
            gamepulse/fusion/igp_historical_defender_blueprint_validation_v1.py \
            --root . --games 0022600001 0022600002 0022600003 0022600009 \
            --output "$RUNNER_TEMP/private-blueprint-2026-agreement.json"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"private-blueprint-2026-agreement.json"
          a=json.loads(p.read_text())
          assert len(a["per_game"])==4
          assert a["overall"]["verified_sample_evaluated"]>=50
          assert a["overall"]["nearest_eligible"]>=20
          print("IGP_DEFENDER_BLUEPRINT_INDEPENDENT_SOURCE_ACCEPTED",
                a["overall"]["verified_sample_evaluated"],
                a["nearest_agreement_given_eligible"],
                a["primary_agreement_given_eligible"])
          PY
      - name: Retain validation report private, never publish shot rows
        shell: bash
        run: |
          set -euo pipefail
          gh release upload igp-2025-26-defender-xyz-proxy-20261105 \
            "$RUNNER_TEMP/private-blueprint-2026-agreement.json" \
            --repo timeedmonds-maker/104 --clobber
          echo IGP_2026_BLUEPRINT_DEFENDER_VALIDATION_PRESERVED_PRIVATE
