name: R13 original NBA shot-touch archived eight - Git transport
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r13-fc-original-contact-ladder-private-20261104.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        game: ['0022600125','0022600138','0022600021','0022600153','0022600017','0022600018','0022600019','0022600020']
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      R13_GAME_ID: ${{ matrix.game }}
      PRIVATE_TASK_SOURCE_SHA: 5bdb2649f480ebf671e4c1a5f1afdb1420feaf3c
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public-to-private boundary
        run: python3 tools/public_content_guard.py
      - name: Run exact Git-blob pinned original SDK R13 candidate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          root="$RUNNER_TEMP/r13-archived-source"
          git clone -q --filter=blob:none --depth=1 --no-checkout -b research/r13-source-onset-frontcourt-v3-20261104 https://github.com/timeedmonds-maker/104.git "$root"
          for sha in 622de5c2d754f97193acfbdddac6bd886a206637 231448fa9065c380504d13627fba022861e59b8b 5bdb2649f480ebf671e4c1a5f1afdb1420feaf3c 20c11501a2a7ecb2563f75bfe43784cbada850d8; do
            git -C "$root" fetch -q --filter=blob:none --depth=1 origin "$sha"
          done
          path="gamepulse/fusion/analysis/r13_shot_terminal_archived8_git_transport_v1.py"
          expected="8abfc31367e3081fb340a0efb31d1e0d0ddebbb3"
          test "$(git -C "$root" rev-parse "20c11501a2a7ecb2563f75bfe43784cbada850d8:$path")" = "$expected"
          git -C "$root" show "20c11501a2a7ecb2563f75bfe43784cbada850d8:$path" > "$RUNNER_TEMP/r13_archived8.py"
          export R13_PRIVATE_GIT_ROOT="$root"
          cd "$RUNNER_TEMP"
          python3 -m py_compile ./r13_archived8.py
          python3 ./r13_archived8.py
          echo "R13_ARCHIVED8_PRIVATE_REPLICATION_DONE game=$R13_GAME_ID"
