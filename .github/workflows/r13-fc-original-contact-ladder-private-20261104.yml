name: R13 v2 source-consensus six-variant development on exposed NBA four
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r13-fc-original-contact-ladder-private-20261104.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        game: ['0022600112','0022600113','0022600114','0022600115']
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      R13_GAME_ID: ${{ matrix.game }}
      PRIVATE_TASK_SOURCE_SHA: 6f84c4531c4a962402b3bf78ba21e7a9bc73e5fd
      R13_V2_MODULE_BLOB: 3342b5a72c2136d81b4c820a53f2a3e5e6fbd94d
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public-to-private data boundary
        run: python3 tools/public_content_guard.py
      - name: Verify immutable original sources and evaluate shadow candidates
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          root="$RUNNER_TEMP/r13-v2-private-research"
          git clone -q --filter=blob:none --depth=1 --no-checkout -b research/r13-shot-terminal-source-consensus-v2-20261104 https://github.com/timeedmonds-maker/104.git "$root"
          for sha in 622de5c2d754f97193acfbdddac6bd886a206637 231448fa9065c380504d13627fba022861e59b8b 6f84c4531c4a962402b3bf78ba21e7a9bc73e5fd; do
            git -C "$root" fetch -q --filter=blob:none --depth=1 origin "$sha"
          done
          p="gamepulse/fusion/analysis/r13_shot_source_consensus_dev4_git_replay_v1.py"
          test "$(git -C "$root" rev-parse "6f84c4531c4a962402b3bf78ba21e7a9bc73e5fd:$p")" = "dd301205db50f8c00f1d6461045a6a40cb65a17d"
          git -C "$root" show "6f84c4531c4a962402b3bf78ba21e7a9bc73e5fd:$p" > "$RUNNER_TEMP/r13_v2_dev.py"
          export R13_PRIVATE_GIT_ROOT="$root"
          cd "$RUNNER_TEMP"
          python3 -m py_compile ./r13_v2_dev.py
          python3 ./r13_v2_dev.py
          echo "R13_V2_NATIVE_SOURCE_DEVELOPMENT_COMPLETE game=$R13_GAME_ID"
