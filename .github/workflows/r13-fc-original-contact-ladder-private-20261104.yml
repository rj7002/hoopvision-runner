name: R13 shot-touch candidate second cohort NBA game-disjoint four - Git transport
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r13-fc-original-contact-ladder-private-20261104.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        game: ['0022600001','0022600003','0022600004','0022600005']
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      R13_GAME_ID: ${{ matrix.game }}
      PRIVATE_TASK_SOURCE_SHA: 5bdb2649f480ebf671e4c1a5f1afdb1420feaf3c
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public-to-private boundary
        run: python3 tools/public_content_guard.py
      - name: Run exact Git-blob pinned original SDK R13 candidate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          root="$RUNNER_TEMP/r13-archived-source"
          git clone -q --filter=blob:none --depth=1 --no-checkout -b research/r13-source-onset-frontcourt-v3-20261104 https://github.com/timeedmonds-maker/104.git "$root"
          for sha in 622de5c2d754f97193acfbdddac6bd886a206637 231448fa9065c380504d13627fba022861e59b8b 5bdb2649f480ebf671e4c1a5f1afdb1420feaf3c 0b8bf4805de02dcec736f472b8cff45e4fbbdd34; do
            git -C "$root" fetch -q --filter=blob:none --depth=1 origin "$sha"
          done
          path="gamepulse/fusion/analysis/r13_shot_terminal_second_panel_git_transport_v1.py"
          expected="0a1f97a2a6ef8d816c6a9fbade0da63c7ede4621"
          test "$(git -C "$root" rev-parse "0b8bf4805de02dcec736f472b8cff45e4fbbdd34:$path")" = "$expected"
          git -C "$root" show "0b8bf4805de02dcec736f472b8cff45e4fbbdd34:$path" > "$RUNNER_TEMP/r13_second_panel.py"
          export R13_PRIVATE_GIT_ROOT="$root"
          cd "$RUNNER_TEMP"
          python3 -m py_compile ./r13_second_panel.py
          python3 ./r13_second_panel.py
          echo "R13_SECOND_PANEL_PRIVATE_REPLICATION_DONE game=$R13_GAME_ID"
