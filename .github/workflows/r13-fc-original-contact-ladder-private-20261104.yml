name: R13 original SDK asset access limited private-auth probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r13-fc-original-contact-ladder-private-20261104.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        game: ['0022600112']
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      R13_GAME_ID: ${{ matrix.game }}
      PRIVATE_TASK_SOURCE_SHA: 5bdb2649f480ebf671e4c1a5f1afdb1420feaf3c
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public-to-private boundary
        run: python3 tools/public_content_guard.py
      - name: Run exact Git-blob pinned original SDK R13 candidate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          python3 - <<'PY'
          import json, subprocess, datetime
          for kind,path in (
             ("R13_PRIVATE_RATE","rate_limit"),
             ("R13_PRIVATE_RELEASE","repos/timeedmonds-maker/104/releases/tags/gamepulse-sdk-0022600112")):
              p=subprocess.run(["gh","api",path],capture_output=True,text=True)
              if p.returncode:
                  err=p.stderr.lower()
                  cls="RATE_LIMIT" if "rate limit" in err else "403" if "403" in err else "404" if "404" in err else "OTHER"
                  print(kind+"_ERROR_CLASS="+cls)
                  continue
              data=json.loads(p.stdout)
              if kind=="R13_PRIVATE_RATE":
                  c=data["resources"]["core"]
                  print("R13_PRIVATE_REMAINING="+str(c["remaining"]))
                  print("R13_PRIVATE_RESET_UTC="+datetime.datetime.fromtimestamp(c["reset"],datetime.timezone.utc).isoformat())
              else:
                  assets=[a for a in data.get("assets",[]) if a.get("name","").startswith("sdk-part-") and a.get("name","").endswith(".tar.gz")]
                  print("R13_PRIVATE_ORIGINAL_RELEASE_13PARTS="+str(len(assets)))
                  print("R13_PRIVATE_ORIGINAL_PARTS_SHA256="+str(sum(str(a.get("digest","")).startswith("sha256:") for a in assets)))
          PY
