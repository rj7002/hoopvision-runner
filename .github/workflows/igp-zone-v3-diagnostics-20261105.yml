# Preserve preexisting V3 Full107 source shards; diagnose which independent
# tactical gates suppress real NBA tracking candidates. Private research only.
name: Integrated Pulse zone V3 original-source gate diagnostics
'on':
  push:
    branches: [research/igp-zone-motion-pilot-20261105]
    paths: ['.github/workflows/igp-zone-v3-diagnostics-20261105.yml','tools/public_content_guard.py']
permissions: {contents: read}
concurrency:
  group: igp-zone-v3-private-diagnostics
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-full107-zone-motion-v1-20261105
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Confirm public/private boundary and accepted source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
      - name: Assess real Full107 zone V3 gate rejection distributions
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH="$PWD:$PWD/gamepulse/fusion"
          python3 gamepulse/fusion/igp_zone_v3_gate_diagnostic_v1.py \
            --shards \
              gamepulse/fusion/qa/igp_zone_motion_research_v1/shard_00_22_source_v3.json \
              gamepulse/fusion/qa/igp_zone_motion_research_v1/shard_22_44_source_v3.json \
              gamepulse/fusion/qa/igp_zone_motion_research_v1/shard_44_66_source_v3.json \
              gamepulse/fusion/qa/igp_zone_motion_research_v1/shard_66_88_source_v3.json \
              gamepulse/fusion/qa/igp_zone_motion_research_v1/shard_88_107_source_v3.json \
            --output gamepulse/fusion/qa/igp_zone_motion_research_v1/full107_v3_gate_diagnostic.json
          python3 - <<'PY'
          import json
          p='gamepulse/fusion/qa/igp_zone_motion_research_v1/full107_v3_gate_diagnostic.json'
          d=json.load(open(p))
          assert d['source_games_checked']==107
          assert d['production_accepted'] is False
          assert d['labelled_possession_precision_recall_unknown'] is True
          print('NBA_ZONE_FULL107_V3_GATE_PROVENANCE_VALID',d['counts']['candidate_chains'])
          PY
      - name: 5-fold heldout-team weak-proportion skill test against NBA zone totals
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 -m venv "$RUNNER_TEMP/zone-venv"
          "$RUNNER_TEMP/zone-venv/bin/pip" install --quiet 'numpy>=1.26,<3'
          export PYTHONPATH="$PWD:$PWD/gamepulse/fusion"
          "$RUNNER_TEMP/zone-venv/bin/python" -m unittest discover -q \
            -s gamepulse/fusion/tests -p 'test_igp_zone_weak_team_proportions_v1.py'
          "$RUNNER_TEMP/zone-venv/bin/python" \
            gamepulse/fusion/igp_zone_weak_team_proportions_v1.py \
            --shards \
              gamepulse/fusion/qa/igp_zone_motion_research_v1/shard_00_22_source_v3.json \
              gamepulse/fusion/qa/igp_zone_motion_research_v1/shard_22_44_source_v3.json \
              gamepulse/fusion/qa/igp_zone_motion_research_v1/shard_44_66_source_v3.json \
              gamepulse/fusion/qa/igp_zone_motion_research_v1/shard_66_88_source_v3.json \
              gamepulse/fusion/qa/igp_zone_motion_research_v1/shard_88_107_source_v3.json \
            --epochs 550 \
            --output gamepulse/fusion/qa/igp_zone_motion_research_v1/full107_weak_team_fivefold_cv_v1.json
          "$RUNNER_TEMP/zone-venv/bin/python" - <<'PY'
          import json
          p='gamepulse/fusion/qa/igp_zone_motion_research_v1/full107_weak_team_fivefold_cv_v1.json'
          x=json.load(open(p))
          assert x['source_games']==107 and x['tracking_logical_chains']==7715
          assert x['model_fits_team_rate_not_possession_truth'] is True
          assert x['production_accepted'] is False
          print('IGP_ZONE_WEAK_TEAM_LABELED_ECOLOGICAL_ONLY')
          PY
      - name: Render SHA-original NBA tracking blind-review source strips (Pillow only)
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          "$RUNNER_TEMP/zone-venv/bin/pip" install --quiet 'Pillow>=10,<12'
          export PYTHONPATH="$PWD:$PWD/gamepulse/fusion"
          "$RUNNER_TEMP/zone-venv/bin/python" \
            gamepulse/fusion/igp_zone_blind_source_review_v1.py \
            --shards \
              gamepulse/fusion/qa/igp_zone_motion_research_v1/shard_00_22_source_v3.json \
              gamepulse/fusion/qa/igp_zone_motion_research_v1/shard_22_44_source_v3.json \
              gamepulse/fusion/qa/igp_zone_motion_research_v1/shard_44_66_source_v3.json \
              gamepulse/fusion/qa/igp_zone_motion_research_v1/shard_66_88_source_v3.json \
              gamepulse/fusion/qa/igp_zone_motion_research_v1/shard_88_107_source_v3.json \
            --out-dir gamepulse/fusion/qa/igp_zone_motion_research_v1/blind_review_original_xyz_v1
          "$RUNNER_TEMP/zone-venv/bin/python" - <<'PY'
          import json
          from pathlib import Path
          p=Path('gamepulse/fusion/qa/igp_zone_motion_research_v1/blind_review_original_xyz_v1/review_manifest_private.json')
          d=json.loads(p.read_text())
          assert d['review_count']>=10
          assert d['independently_reviewed_zone_possessions']==0
          assert d['original_tracking_modified'] is False
          print('IGP_ZONE_BLIND_CONTACT_SHEETS_PRIVATE',d['review_count'],
                'SHA_ORIGINAL_RENDERED',d['rendered'],
                'NOT_VIDEO_GROUND_TRUTH')
          PY
      - name: Persist full diagnostic exclusively in private research
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git add -f gamepulse/fusion/qa/igp_zone_motion_research_v1/blind_review_original_xyz_v1 \
                     gamepulse/fusion/qa/igp_zone_motion_research_v1/full107_v3_gate_diagnostic.json \
                     gamepulse/fusion/qa/igp_zone_motion_research_v1/full107_weak_team_fivefold_cv_v1.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): Full107 zone V3 diagnostic and fivefold weak learner and original NBA blind-review source PNGs, no labels'
          for n in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo NBA_ZONE_V3_DIAGNOSTIC_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 42
