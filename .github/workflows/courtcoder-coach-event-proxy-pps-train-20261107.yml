name: CourtCoder Coach real Full666 Full123 event-time PPS build
on:
  push:
    branches: [main]
    paths: [.github/workflows/courtcoder-coach-event-proxy-pps-train-20261107.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: coach-two-season-original-event-proxy-training
  cancel-in-progress: false
jobs:
  original-source-train:
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_REPO: timeedmonds-maker/104
      PRIVATE_SHA: e2ea22408288010d834fb58ce4d7c0545a493b43
      SAMPLE_GAMES: '25'
      HIST_SHARDS: '15'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Enforce public confidentiality and verified ephemeral private code
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          mkdir -p "$RUNNER_TEMP/coach-private" "$RUNNER_TEMP/coach-history" "$RUNNER_TEMP/coach-release"
          # Share the current authenticated GitHub REST budget with NBA source
          # ingestion. Wait boundedly for the real hourly reset on 403 rate limit.
          # A permissions denial (also 403) fails immediately; no trust changes.
          private_api_file() {
            local path="$1" dest="$2" attempt err
            for attempt in $(seq 1 20); do
              err="$RUNNER_TEMP/coach-private/api-fetch.err"
              if gh api "repos/$PRIVATE_REPO/contents/$path?ref=$PRIVATE_SHA" \
                   --jq .content > "$RUNNER_TEMP/coach-private/payload.b64" 2>"$err"; then
                base64 -d "$RUNNER_TEMP/coach-private/payload.b64" > "$dest"
                test -s "$dest"
                return 0
              fi
              if grep -Eqi 'rate limit exceeded|secondary rate limit' "$err"; then
                echo COACH_PRIVATE_SOURCE_API_RATE_RESET_PENDING_ATTEMPT_$attempt
                sleep 195
              else
                echo COACH_PRIVATE_SOURCE_API_ACCESS_DENIED_NOT_RATE_LIMIT
                return 1
              fi
            done
            echo COACH_PRIVATE_SOURCE_API_RETRY_WINDOW_EXHAUSTED
            return 1
          }
          for name in two_season_native_event_pressure_v1.py run_event_proxy_source_release_v1.py; do
            private_api_file "courtcoder/coach/qa/$name" "$RUNNER_TEMP/coach-private/$name"
          done
          private_api_file courtcoder/coach/event_proxy_pps_v1.py \
            "$RUNNER_TEMP/coach-private/event_proxy_pps_v1.py"
          rm -f "$RUNNER_TEMP/coach-private/payload.b64" "$RUNNER_TEMP/coach-private/api-fetch.err"
          python3 -m py_compile "$RUNNER_TEMP/coach-private/"*.py
          echo COACH_PRIVATE_SOURCE_CODE_SHA_PINNED_AND_COMPILED
      - name: Recover original historical 15-shard NBA defender positions
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            if gh release download igp-2025-26-defender-xyz-proxy-20261105 \
              --repo "$PRIVATE_REPO" --dir "$RUNNER_TEMP/coach-history" \
              --pattern 'defender-xyz-nba-2025-26-shard-*.jsonl.gz' \
              --pattern 'defender-xyz-nba-2025-26-shard-*-qa.json' \
              > "$RUNNER_TEMP/history-download.log" 2>&1; then
              break
            fi
            if grep -qi 'rate limit exceeded' "$RUNNER_TEMP/history-download.log"; then
              echo COACH_HISTORICAL_SOURCE_RATE_LIMIT_WAIT
              sleep 180
            else
              echo COACH_HISTORICAL_SOURCE_ARCHIVE_DOWNLOAD_ERROR
              exit 42
            fi
          done
          test "$(find "$RUNNER_TEMP/coach-history" -name 'defender-xyz-*.jsonl.gz' | wc -l)" -eq 15
          test "$(find "$RUNNER_TEMP/coach-history" -name 'defender-xyz-*-qa.json' | wc -l)" -eq 15
          echo COACH_PRIVATE_HIST_15_ORIGINAL_SHARDS_READY
      - name: Train and evaluate REAL source-backed two-season event-pressure model
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$RUNNER_TEMP/coach-private" python3 \
            "$RUNNER_TEMP/coach-private/run_event_proxy_source_release_v1.py" \
            --historical "$RUNNER_TEMP/coach-history" \
            --out "$RUNNER_TEMP/coach-release" \
            --max-current-games "$SAMPLE_GAMES" \
            --max-hist-shards "$HIST_SHARDS" \
            --workers 5
          test -s "$RUNNER_TEMP/coach-release/source-event-pressure-qa.json"
          test -s "$RUNNER_TEMP/coach-release/event-proxy-heldout.json"
      - name: Stage only accepted SHA-receipted model in PRIVATE feature branch
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/coach-release"
          test -s "$root/event-proxy-heldout.json"
          accepted="$(python3 - "$root/event-proxy-heldout.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          print(d.get("status","RESEARCH_NOT_ACCEPTED"))
          PY
          )"
          if [[ "$accepted" != PASS ]]; then
            echo COACH_PROXY_UNACCEPTED_NO_PRIVATE_BRANCH_STAGING
            exit 0
          fi
          gh auth setup-git
          if ! git clone -q --depth=1 --filter=blob:none --sparse \
               --branch feature/courtcoder-coach-web-20261106 \
               "https://github.com/$PRIVATE_REPO.git" "$RUNNER_TEMP/private-stage" \
               >"$RUNNER_TEMP/private-stage-clone.log" 2>&1; then
            echo COACH_ACCEPTED_MODEL_PRIVATE_GIT_STAGE_CLONE_DENIED
            exit 0
          fi
          cd "$RUNNER_TEMP/private-stage"
          git sparse-checkout set gamepulse/coach_event_proxy_release_20261107
          mkdir -p gamepulse/coach_event_proxy_release_20261107
          for name in event-proxy-model.json event-proxy-heldout.json source-event-pressure-qa.json; do
            cp "$root/$name" "gamepulse/coach_event_proxy_release_20261107/$name"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gamepulse/coach_event_proxy_release_20261107
          git diff --cached --check
          if git diff --cached --quiet; then
            echo COACH_PRIVATE_ACCEPTED_PROXY_SOURCE_ALREADY_STAGED
            exit 0
          fi
          git commit -q -m "release(coach): original-NBA event-time proxy PPS with game-holdout QA"
          if git push -q origin HEAD:refs/heads/feature/courtcoder-coach-web-20261106 \
               >"$RUNNER_TEMP/coach-private-push.log" 2>&1; then
            echo COACH_PRIVATE_SOURCE_BOUND_PROXY_MODEL_STAGED
          else
            echo COACH_ACCEPTED_MODEL_PRIVATE_GIT_PUSH_NOT_AUTHORISED
          fi
      - name: Publish trained evidence and any accepted model to PRIVATE release only
        shell: bash
        run: |
          set -euo pipefail
          # The pre-existing restricted PRIVATE release already stores source
          # readiness and historical audit receipts. Do not create an unauthorised
          # public release or move any licensed data outside private 104.
          TAG=igp-coach-pps-two-season-readiness-20261107
          gh release view "$TAG" --repo "$PRIVATE_REPO" --json tagName --jq .tagName \
            | grep -Fx "$TAG"
          # Publishing an already accepted model is optional for successful
          # run completion if branch staging succeeded. An existing tag may be
          # immutable under scoped PAT permissions; never mislabel a failed
          # optional mirror as a failed held-out training result.
          if gh release upload "$TAG" "$RUNNER_TEMP/coach-release/"* \
               --repo "$PRIVATE_REPO" --clobber \
               >"$RUNNER_TEMP/coach-private-mirror.log" 2>&1; then
            echo COACH_EXISTING_PRIVATE_RELEASE_MIRROR_PUBLISHED
          else
            echo COACH_EXISTING_PRIVATE_RELEASE_MIRROR_NOT_AUTHORIZED
          fi
          echo COACH_REAL_DATA_EVALUATION_RECEIPTS_RELEASED_PRIVATE_ONLY

