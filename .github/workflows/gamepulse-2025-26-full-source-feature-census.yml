name: IGP 2025-26 complete historical source feature census
on:
  push:
    branches: [main]
    paths: [.github/workflows/gamepulse-2025-26-full-source-feature-census.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-historical-2025-26-all-source-feature-census
  cancel-in-progress: false
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify source index and reuse all immutable 2025-26 shards
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          mkdir -p "$RUNNER_TEMP/source"
          gh release download igp-public-gamepulse-2025-26-20261105 --repo timeedmonds-maker/104             --pattern 'nba-2025-26-source-index.json' --pattern 'nba-2025-26-shard-*.zip' --dir "$RUNNER_TEMP/source"
          test "$(find "$RUNNER_TEMP/source" -name 'nba-2025-26-shard-*.zip' | wc -l)" -eq 15
      - name: Reconcile event and shot feature presence across all source games
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections,gzip,hashlib,json,os,pathlib,zipfile
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"source"
          d=json.loads((root/"nba-2025-26-source-index.json").read_text())
          assert d["source_zip_sha256"]=="2450b2fafb66698b39a89592c6ac3767c7ba0c3e4581b1a65042041e0f7ea0b0"
          assert d["total_tracking_games_verified"]==666 and len(d["shards"])==15
          events=collections.Counter()
          metadata_fields=collections.Counter()
          nonnull_shot_fields=collections.Counter()
          source_game_counts={}
          stats_fields=collections.Counter()
          for shard in d["shards"]:
              path=root/shard["name"]
              assert path.stat().st_size==shard["bytes"]
              sha=hashlib.sha256()
              with path.open("rb") as fp:
                  for block in iter(lambda:fp.read(4*1024*1024),b""):sha.update(block)
              assert sha.hexdigest()==shard["sha256"]
              with zipfile.ZipFile(path) as archive:
                  for gid in shard["game_ids"]:
                      game=d["games"][gid]
                      assert game["shard"]==shard["name"]
                      counts=collections.Counter()
                      for member in game["members"]:
                          basename=member["path"].rsplit("/",1)[-1]
                          if basename not in ("companion.jsonl.gz","stats.jsonl.gz"):continue
                          with archive.open(member["path"]) as raw, gzip.GzipFile(fileobj=raw) as stream:
                              for line in stream:
                                  if not line.strip():continue
                                  record=json.loads(line)
                                  event=str(record.get("event",""))
                                  counts[event]+=1
                                  if basename=="companion.jsonl.gz":
                                      events[event]+=1
                                      if event=="ShotDetails#show":
                                          md=record.get("metadata") or {}
                                          assert isinstance(md,dict)
                                          metadata_fields.update(md.keys())
                                          nonnull_shot_fields.update(k for k,v in md.items() if v is not None)
                                  elif event=="PlayByPlay#show":
                                      md=record.get("metadata") or {}
                                      stats_fields.update(k for k,v in md.items() if v is not None)
                      source_game_counts[gid]={
                          "has_tracking":bool(game["tracking"]),
                          "tracking_rows":game["tracking"]["rows"] if game["tracking"] else 0,
                          "shot_detail_events":counts["ShotDetails#show"],
                          "stats_playbyplay_events":counts["PlayByPlay#show"],
                          "companion_events":sum(counts[e] for e in counts if e in events),
                      }
              print("HISTORICAL_SOURCE_SHARD_SHA_PASS",shard["name"],len(shard["game_ids"]))
          assert len(source_game_counts)==677
          receipt={
              "schema":"igp.historical-source-feature-census.v1",
              "source_index_sha256":hashlib.sha256((root/"nba-2025-26-source-index.json").read_bytes()).hexdigest(),
              "source_zip_sha256":d["source_zip_sha256"],
              "source_tracking_games":d["total_tracking_games_verified"],
              "indexed_games":len(source_game_counts),
              "native_rows":d["total_normalized_rows"],
              "native_provider_ten_ball_rows":d["total_provider_ten_ball_rows"],
              "game_counts":source_game_counts,
              "companion_event_counts":dict(events),
              "shot_detail_metadata_field_occurrences":dict(metadata_fields),
              "shot_detail_nonnull_field_occurrences":dict(nonnull_shot_fields),
              "stats_pbp_nonnull_field_occurrences":dict(stats_fields),
              "grade":"SOURCE_CENSUS_ONLY_NOT_FULL107_ENGINE",
          }
          out=root/"historical-source-feature-census.json"
          out.write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          print("HISTORICAL_SOURCE_ALL_GAMES_CENSUS",json.dumps({
              "tracking_games":receipt["source_tracking_games"],
              "indexed_games":receipt["indexed_games"],
              "shot_detail_games":sum(x["shot_detail_events"]>0 for x in source_game_counts.values()),
              "shot_detail_events":events["ShotDetails#show"],
              "stats_pbp_games":sum(x["stats_playbyplay_events"]>0 for x in source_game_counts.values()),
              "companion_event_types":dict(events),
              "shot_detail_metadata_fields":dict(metadata_fields),
              "shot_detail_nonnull_fields":dict(nonnull_shot_fields),
          },sort_keys=True))
          PY
      - name: Retain per-game census exclusively in private 104
        shell: bash
        run: |
          set -euo pipefail
          TAG='igp-2025-26-source-feature-census-20261105'
          REPO='timeedmonds-maker/104'
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --target main --draft               --title 'IGP 2025-26 source feature availability'               --notes 'SHA-verified original public-source event feature census. This is source inventory, not Full107 engine output or certified defender impact.'
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/source/historical-source-feature-census.json" --repo "$REPO" --clobber
          gh release edit "$TAG" --repo "$REPO" --draft=false
          echo HISTORICAL_SOURCE_FEATURE_RECEIPT_PRIVATE_ONLY
