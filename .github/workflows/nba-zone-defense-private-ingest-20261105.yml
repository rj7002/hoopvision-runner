# Research-only full source-graded season refresh; no per-game zone labels.
name: IGP Zone Defense continuous refresh research
'on':
  push:
    branches: [research/inside-game-zone-api-discovery-20261105]
    paths: ['.github/workflows/nba-zone-defense-private-ingest-20261105.yml']
permissions: {contents: read}
concurrency:
  group: igp-zone-research-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-zone-continuous-season-refresh-20261105
      PINNED_SHA: ed59cf4c5f061abd75bd093ba4df38414f785258
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Pin source and validate access
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 -b "$BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PINNED_SHA"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PINNED_SHA"
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PINNED_SHA"
          echo ZONE_REFRESH_PRIVATE_SHA_PIN_PASSED
      - name: Run original-source source-free regression tests
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 -m unittest discover -v -s gamepulse/fusion/tests -p 'test_igp_zone_season_refresh_v1.py'
          python3 -m unittest discover -v -s gamepulse/fusion/tests -p 'test_igp_full107_zone_team_v1.py'
          python3 -m unittest discover -v -s gamepulse/fusion/tests -p 'test_nba_zone_defense_official_ingest_v1.py'
      - name: Refresh season-to-date NBA zone source only when changed
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          python3 gamepulse/fusion/igp_zone_season_refresh_v1.py \
            --receipt gamepulse/fusion/qa/igp_full107_official_zone_v1/season_refresh_status.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('gamepulse/fusion/qa/igp_full107_official_zone_v1/season_refresh_status.json')
          d=json.loads(p.read_text())
          assert d['status'] in ('unchanged','refreshed')
          assert d['official_nba_games_in_snapshot']>=107
          assert d['physical_zone_possession_labels']=='NOT_AVAILABLE'
          print('OFFICIAL_ZONE_REFRESH_ACCEPTED',d['status'],
                'OFFICIAL_GAME_COUNT',d['official_nba_games_in_snapshot'],
                'IGP_INDEXED',d['igp_indexed_games'],
                'GRAIN',d['source_vs_igp'])
          PY
      - name: Preserve accepted source snapshots and materialized SQLite privately
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          git fetch -q origin "$BRANCH"
          git checkout -q -B accepted-refreshed "origin/$BRANCH"
          git add -f gamepulse/fusion/qa/nba_zone_official_20261105 \
            gamepulse/fusion/qa/igp_full107_official_zone_v1 \
            gamepulse/fusion/materialized/igp_full107_official_zone_v1 \
            gamepulse/fusion/qa/igp_fullx/LATEST.json
          git -c core.whitespace=cr-at-eol diff --cached --check > /dev/null
          if git diff --cached --quiet; then echo ZONE_UNCHANGED_NO_PRIVATE_REWRITE; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'data(igp): refresh source-graded NBA zone season snapshots after finals'
          for n in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/$BRANCH"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo NBA_ZONE_SEASON_REFRESH_PRIVATE_COMMITTED
              exit 0
            fi
            sleep "$n"
          done
          exit 42
