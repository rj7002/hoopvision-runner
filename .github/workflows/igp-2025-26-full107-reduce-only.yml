# Repair 2025-26 Full107-native final tally without rerunning 666 games.
# Previous reducer included stale all666-qa.json in a wildcard and failed its schema check.
name: IGP 2025-26 Full107-native 666-game QA-only reducer
'on':
  push:
    branches: [main]
    paths: [.github/workflows/igp-2025-26-full107-reduce-only.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-2025-26-full107-reduce-only
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
  SOURCE_RELEASE: igp-public-gamepulse-2025-26-20261105
  RELEASE: igp-2025-26-full107-native-20261105
jobs:
  reduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 145
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Inspect source provenance and prepare only private QA receipts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/qa"
          # The historical archive token is user-scoped and can exhaust its
          # hourly API bucket during parallel workflows. Wait for quota reset;
          # never restart the successful 15 expensive original reconstruction jobs.
          private_release_download() {
            local purpose="$1"; shift
            local attempt=0 now reset sleep_seconds
            until "$@"; do
              attempt=$((attempt+1))
              if [ "$attempt" -ge 24 ]; then
                echo "PRIVATE_HISTORICAL_QA_DOWNLOAD_EXHAUSTED purpose=$purpose attempts=$attempt" >&2
                return 31
              fi
              now=$(date +%s)
              reset=$(gh api rate_limit --jq '.resources.core.reset' 2>/dev/null || :)
              if [[ "$reset" =~ ^[0-9]+$ ]] && [ "$reset" -gt "$now" ]; then
                sleep_seconds=$((reset-now+15))
                if [ "$sleep_seconds" -gt 630 ]; then sleep_seconds=630; fi
              else
                sleep_seconds=$((attempt*45))
                if [ "$sleep_seconds" -gt 450 ]; then sleep_seconds=450; fi
              fi
              echo "PRIVATE_HISTORICAL_QA_RETRY purpose=$purpose attempt=$attempt sleep_seconds=$sleep_seconds"
              sleep "$sleep_seconds"
            done
          }
          private_release_download source-index gh release download "$SOURCE_RELEASE" --repo timeedmonds-maker/104 \
            --pattern nba-2025-26-source-index.json --clobber --dir "$RUNNER_TEMP/source"
          test -s "$RUNNER_TEMP/source/nba-2025-26-source-index.json"
          private_release_download native-shard-qa gh release download "$RELEASE" --repo timeedmonds-maker/104 \
            --pattern 'full107-native-nba-2025-26-shard-*-qa.json' --clobber --dir "$RUNNER_TEMP/qa"
      - name: Independently reconcile source hashes, all original timestamps, and all games
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import Counter
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          idx=json.loads((root/'source/nba-2025-26-source-index.json').read_text())
          files=sorted((root/'qa').glob('full107-native-nba-2025-26-shard-*-qa.json'))
          assert len(files)==15,('REQUIRE_ALL_15_SHARD_QA',len(files))
          expected={gid:g for gid,g in idx['games'].items() if g.get('tracking')}
          assert len(expected)==666,('HISTORICAL_GAME_POPULATION_DRIFT',len(expected))
          shards={s['name']:s for s in idx['shards']}
          assert len(shards)==15
          totals=Counter();seen=set();seen_shards=set()
          # The historical engine included per-game single-native-timestamp
          # source-masked diagnostics. Pool only additive counts, never
          # average per-segment p95 values as if they were raw error samples.
          p0=Counter();p0_segment_p95=[];p0_games_with_matches=0
          scene_zero_games=0;zero_scene_cases=[];game_coverage=[]
          for f in files:
            suffix=f.name.removeprefix('full107-native-').removesuffix('-qa.json')
            srcname=suffix+'.zip'
            assert srcname in shards,('UNEXPECTED_SHARD',srcname)
            assert srcname not in seen_shards,('DUPLICATE_SHARD',srcname)
            seen_shards.add(srcname)
            q=json.loads(f.read_text())
            assert q['schema']=='igp.full107-native-scene-historical-2025-26.v1'
            assert q['model_module']=='igp_native_scene_model_v2'
            assert q['original_source_immutable'] is True
            assert q['source_sha256']==idx['source_zip_sha256']
            assert q['source_shard_sha256']==shards[srcname]['sha256']
            assert q['qa_grade']=='HISTORICAL_NATIVE_FULL107_RESEARCH_SOURCE_PROVISIONAL'
            assert q['not_full88_or_full92_dataset_or_default'] is True
            assert len(q['per_game'])==q['games']
            assert set(q['per_game']) <= (set(shards[srcname]['game_ids']) & set(expected))
            assert not seen.intersection(q['per_game']),'DUPLICATE_GAME'
            shard_count=Counter()
            for gid,gameqa in q['per_game'].items():
              source_record=expected[gid]
              member=next(m for m in source_record['members'] if m['path'].endswith('/tracking.jsonl.gz'))
              assert gameqa['source_original_sha256']==member['sha256'],('GAME_SOURCE_HASH_DRIFT',gid)
              assert gameqa['source_lineup_grade']=='SOURCE_PROVISIONAL_NOT_INDEPENDENT_OFFICIAL_TEN'
              assert gameqa['counts']['source_native_frames']==source_record['tracking']['rows'],('ROW_DRIFT',gid)
              assert gameqa['native_source_denominator']==source_record['tracking']['rows']
              shard_count.update(gameqa['counts'])
              gc=gameqa['counts']; denominator=gc['source_native_frames']
              numerator=gc.get('native_engine_complete_ten_ball',0)
              original=gc.get('source_direct_complete_ten_ball',0)
              assert denominator>0 and 0<=original<=numerator<=denominator,('INVALID_PER_GAME_COVERAGE',gid)
              game_coverage.append({'game_id':gid,'complete':numerator,
                'original_complete':original,'reconstructed_complete':numerator-original,
                'source_native_frames':denominator,'coverage':numerator/denominator})
              h=gameqa.get('masked_player_xy') or {}
              for key in ('attempts','matched','over_2ft'):
                p0[key]+=int(h.get(key,0))
              p0_games_with_matches+=int(h.get('matched',0)>0)
              is_zero=gameqa['counts'].get('native_engine_complete_ten_ball',0)==0
              scene_zero_games+=int(is_zero)
              if is_zero:
                gc=gameqa['counts']
                zero_scene_cases.append({
                  'game_id':gid,'original_native_frames':gc['source_native_frames'],
                  'provisional_lineup_frames':gc.get('provisional_source_lineup_frames',0),
                  'unknown_lineup_frames':gc.get('unusable_unknown_source_lineup_frames',0),
                  'source_direct_complete_scenes':gc.get('source_direct_complete_ten_ball',0),
                  'modeled_player_entries':gc.get('filled_player_positions',0),
                  'modeled_ball_entries':gc.get('filled_ball_positions',0)})
              for segment in h.get('per_segment_sample') or []:
                if isinstance(segment,(list,tuple)) and len(segment)==3 and segment[1] is not None and segment[2]>0:
                  p0_segment_p95.append(float(segment[1]))
            assert dict(shard_count)==dict(q['counts']),('SHARD_COUNT_CONFLICT',srcname)
            totals.update(q['counts'])
            seen.update(q['per_game'])
          assert seen==set(expected),('MISSING_OR_EXTRA_GAMES',len(seen),len(expected))
          assert totals['source_native_frames']==19440900,('NATIVE_FRAME_DRIFT',totals['source_native_frames'])
          assert totals['source_direct_complete_ten_ball']+totals['native_engine_completed_incomplete_source_frames']==totals['native_engine_complete_ten_ball'],'SOURCE_MODEL_COMPLETE_COUNT_DRIFT'
          assert totals['native_engine_complete_ten_ball']<=totals['source_native_frames']
          assert len(game_coverage)==666
          game_coverage.sort(key=lambda r:(-r['coverage'],r['game_id']))
          bins=collections.Counter()
          for record in game_coverage:
            lower=min(90,int(record['coverage']*10)*10)
            bins[f"{lower:02d}-{lower+10:03d}"]+=1
          def eligible(fraction_ppm):
            return [r for r in game_coverage
                    if r['complete']*1000000 >= fraction_ppm*r['source_native_frames']]
          # 88%, frozen 2026-27 88.3273%, 90%, 95%. All native,
          # not a historically validated clock-running-only selector.
          threshold_games={
            '88_0000_pct_all_native':eligible(880000),
            '88_3273_pct_all_native':eligible(883273),
            '90_0000_pct_all_native':eligible(900000),
            '95_0000_pct_all_native':eligible(950000)}
          threshold_summary={name:{
            'count':len(rows),
            'games':[{'game_id':r['game_id'],'coverage_pct':round(r['coverage']*100,4),
                       'complete':r['complete'],'source_native_frames':r['source_native_frames']}
                     for r in rows]}
            for name,rows in threshold_games.items()}
          print('FULL107_HISTORICAL_PER_GAME_COVERAGE_THRESHOLDS',json.dumps(threshold_summary,sort_keys=True))
          print('FULL107_HISTORICAL_PER_GAME_COVERAGE_DECILES',json.dumps(dict(sorted(bins.items())),sort_keys=True))
          p0_summary={
            'grade':'P0_WITHHELD_ORIGINAL_SOURCE_TIMESTAMP_PROXY_ONLY',
            'physical_accuracy_certified':False,
            'not_game_disjoint_not_interval_blackout_validated':True,
            'upstream_original_interpolation_strata_unresolved':True,
            'attempted_single_timestamp_player_probes':p0['attempts'],
            'matched_player_probes':p0['matched'],
            'abstained_player_probes':p0['attempts']-p0['matched'],
            'matched_fraction_of_attempts':p0['matched']/p0['attempts'] if p0['attempts'] else None,
            'matched_over_2ft':p0['over_2ft'],
            'matched_over_2ft_fraction':p0['over_2ft']/p0['matched'] if p0['matched'] else None,
            'games_with_at_least_one_matched_probe':p0_games_with_matches,
            'segments_with_nonempty_error':len(p0_segment_p95),
            'max_of_segment_p95_xy_ft_not_pooled_p95':max(p0_segment_p95) if p0_segment_p95 else None}
          assert 0<=p0['over_2ft']<=p0['matched']<=p0['attempts']
          receipt={
            'schema':'igp.historical-full107-native-666game-run-receipt.v2',
            'status':'SOURCE_POPULATION_COMPLETE_RESEARCH_ONLY',
            'season':'2025-26','games':len(seen),'shards':len(seen_shards),
            'source_sha256':idx['source_zip_sha256'],'counts':dict(sorted(totals.items())),
            'native_source_denominator':totals['source_native_frames'],
            'full107_native_xyz_complete':totals['native_engine_complete_ten_ball'],
            'full107_native_complete_fraction':totals['native_engine_complete_ten_ball']/totals['source_native_frames'],
            'source_lineup_grade':'PROVISIONAL_NOT_INDEPENDENTLY_VERIFIED',
            'original_source_unchanged':True,'production_accepted':False,
            'physical_accuracy_certified':False,
            'original_shard_QA_verified':True,
            'missing_2026_27_blueprint_fields_not_inferred':True,
            'next_validation':['Independent player XY/ball 3D source-masked holdouts',
                'official-ten lineup and shot-clock reconciliation','defender and xFG shot-source attribution'],
            'original_full107_run':41986224953,
            'source_masked_player_xy_existing_diagnostics':p0_summary,
            'games_with_zero_structurally_complete_native_scenes':scene_zero_games,
            'zero_scene_case_diagnostic_population':sorted(zero_scene_cases,key=lambda r:r['game_id']),
            'all_native_per_game_thresholds':threshold_summary,
            'all_native_per_game_deciles':dict(sorted(bins.items())),
            'all_native_game_coverages':game_coverage,
            'threshold_denominator_note':'SOURCE_NATIVE_FRAMES_EACH_GAME_NOT_VERIFIED_LIVE_ONLY'
          }
          out=root/'qa/full107-native-2025-26-all666-qa.json'
          out.write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('FULL107_HISTORICAL_ZERO_SCENE_GAME_IDS',json.dumps(
            [r['game_id'] for r in sorted(zero_scene_cases,key=lambda r:r['game_id'])]))
          print('FULL107_NATIVE_HISTORICAL_ALL666_RESULT',json.dumps({
            'status':receipt['status'],'games':receipt['games'],'shards':receipt['shards'],
            'native_source_frames':totals['source_native_frames'],
            'direct_ten_ball':totals['source_direct_complete_ten_ball'],
            'modeled_additional_ten_ball':totals['native_engine_completed_incomplete_source_frames'],
            'complete_ten_ball':totals['native_engine_complete_ten_ball'],
            'filled_player_positions':totals['filled_player_positions'],
            'filled_ball_positions':totals['filled_ball_positions'],
            'coverage_fraction':receipt['full107_native_complete_fraction'],
            'production_accepted':False,
            'existing_source_masked_p0':p0_summary,
            'zero_complete_source_games':scene_zero_games},sort_keys=True))
          PY
      - name: Save fixed 666-game research receipt in original private derived release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE" "$RUNNER_TEMP/qa/full107-native-2025-26-all666-qa.json" \
            --repo timeedmonds-maker/104 --clobber
          echo FULL107_HISTORICAL_REDUCER_V2_PRIVATE_COMPLETE
