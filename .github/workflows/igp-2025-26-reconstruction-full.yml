# Public actions execute only privately checked out models. No source coordinates in public logs.
name: IGP 2025-26 full historical Model B/A XYZ reconstruction
'on':
  push:
    branches: [main]
    paths: [.github/workflows/igp-2025-26-reconstruction-full.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp-2025-26-native-model-b-a-all
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
  PRIVATE_BRANCH: research/gamepulse-clock-boundary-integrity-20261025
  RELEASE: igp-2025-26-reconstruction-v1-20261105
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Test protected source boundary, original models, historical adapter
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set --no-cone \
            gamepulse/fusion/igp_historical_2025_26_reconstruct_v1.py \
            gamepulse/fusion/igp_historical_defender_proxy_v1.py \
            gamepulse/fusion/igp_tracking_model_a_holdout_2026.py \
            gamepulse/fusion/igp_tracking_model_b_holdout_2026.py \
            gamepulse/fusion/tests/test_igp_historical_2025_26_reconstruct_v1.py \
            gamepulse/fusion/tests/test_igp_historical_defender_proxy_v1.py
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH="$PWD:$PWD/gamepulse/fusion"
          python3 -m py_compile gamepulse/fusion/igp_historical_2025_26_reconstruct_v1.py
          python3 -m unittest -q gamepulse.fusion.tests.test_igp_historical_2025_26_reconstruct_v1
          python3 -m unittest -q gamepulse.fusion.tests.test_igp_historical_defender_proxy_v1
          echo HISTORICAL_3D_MODEL_TESTS_PASS
      - name: Create private derived release and execute original-source shard 001
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE" --repo timeedmonds-maker/104 >/dev/null 2>&1; then
            gh release create "$RELEASE" --repo timeedmonds-maker/104 \
              --target "$PRIVATE_BRANCH" --draft \
              --title 'Historical 2025-26 reconstructed XYZ, provisional' \
              --notes 'Source-original SHA-preserved and private. Model B/A derived XYZ only, not independent physical truth. No 2026-27 Full107 original mutated.'
          fi
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/derived"
          gh release download igp-public-gamepulse-2025-26-20261105 \
            --repo timeedmonds-maker/104 --pattern nba-2025-26-source-index.json \
            --pattern nba-2025-26-shard-001.zip --dir "$RUNNER_TEMP/source"
          export PYTHONPATH="$RUNNER_TEMP/private/gamepulse/fusion"
          python3 "$RUNNER_TEMP/private/gamepulse/fusion/igp_historical_2025_26_reconstruct_v1.py" \
            --index "$RUNNER_TEMP/source/nba-2025-26-source-index.json" \
            --shard "$RUNNER_TEMP/source/nba-2025-26-shard-001.zip" \
            --out "$RUNNER_TEMP/derived"
          gh release upload "$RELEASE" "$RUNNER_TEMP/derived/"* \
            --repo timeedmonds-maker/104 --clobber
          echo HISTORICAL_MODEL_B_A_FIRST_PRIVATE_SHARD_COMPLETE
  entire_archive:
    needs: pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ['002','003','004','005','006','007','008','009','010','011','012','013','014','015']
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Checkout private unchanged Full88 models and fetch immutable historical shard
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          gh auth setup-git
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" \
            https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set --no-cone \
            gamepulse/fusion/igp_historical_2025_26_reconstruct_v1.py \
            gamepulse/fusion/igp_historical_defender_proxy_v1.py \
            gamepulse/fusion/igp_tracking_model_a_holdout_2026.py \
            gamepulse/fusion/igp_tracking_model_b_holdout_2026.py
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/derived"
          gh release download igp-public-gamepulse-2025-26-20261105 \
            --repo timeedmonds-maker/104 --pattern nba-2025-26-source-index.json \
            --pattern "nba-2025-26-shard-$SHARD.zip" --dir "$RUNNER_TEMP/source"
      - name: Execute original Full88 Model B player and Model A ball on historical native frames
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/private/gamepulse/fusion"
          python3 "$RUNNER_TEMP/private/gamepulse/fusion/igp_historical_2025_26_reconstruct_v1.py" \
            --index "$RUNNER_TEMP/source/nba-2025-26-source-index.json" \
            --shard "$RUNNER_TEMP/source/nba-2025-26-shard-$SHARD.zip" \
            --out "$RUNNER_TEMP/derived"
          gh release upload "$RELEASE" "$RUNNER_TEMP/derived/"* \
            --repo timeedmonds-maker/104 --clobber
          echo HISTORICAL_MODEL_B_A_PRIVATE_SHARD_VERIFIED_"$SHARD"
  final_reconciliation:
    needs: [pilot, entire_archive]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Summarize exact derived 666-game population and retain QA privately
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          mkdir -p "$RUNNER_TEMP/qa"
          gh release download "$RELEASE" --repo timeedmonds-maker/104 \
            --pattern 'native-reconstructed-*-qa.json' --dir "$RUNNER_TEMP/qa"
          python3 - <<'PY'
          import collections,json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"qa"
          files=sorted(root.glob("native-reconstructed-*-qa.json"))
          total=collections.Counter();games=set();attempted=matched=0
          for file in files:
              j=json.loads(file.read_text())
              assert j["schema"]=="igp.historical-2025-26-model-b-source-graded-overlay.v1"
              assert j["original_source_immutable"] is True
              assert not (games&set(j["per_game"]))
              games.update(j["per_game"]);total.update(j["counts"])
              for g in j["per_game"].values():
                  attempted+=g["model_holdout"]["player_source_masked_attempts"]
                  matched+=g["model_holdout"]["matched"]
          status="COMPLETE_666" if len(files)==15 and len(games)==666 and total["frames"]==19440900 else "INCOMPLETE"
          receipt={"status":status,"shards":len(files),"tracking_games":len(games),
            "source_native_frames":total["frames"],"source_direct_complete":total["direct_ten_ball"],
            "model_derived_complete":total["reconstructed_ten_ball"],
            "reconstructed_native_fraction":total["reconstructed_ten_ball"]/total["frames"] if total["frames"] else None,
            "player_positions_recovered":total["fills_player"],
            "ball_positions_recovered":total["fills_ball"],"holdout_attempts":attempted,
            "holdout_matched":matched,"source_immutable":True}
          (root/"historical-2025-26-reconstruction-final-qa.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print("HISTORICAL_666_GAME_NATIVE_ENGINE_FINAL",json.dumps(receipt,sort_keys=True))
          PY
          gh release upload "$RELEASE" \
            "$RUNNER_TEMP/qa/historical-2025-26-reconstruction-final-qa.json" \
            --repo timeedmonds-maker/104 --clobber
