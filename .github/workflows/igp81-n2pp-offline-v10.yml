name: IGP81 N2PP V17 81game residual and scoring action audit
on:
  push:
    branches: [analysis/n2pp-source-verified-runner-20261101]
    paths: ['.github/workflows/igp81-n2pp-offline-v10.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: analysis/igp81-two-possession-three-value-20261101
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Privacy guard
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          gh auth setup-git
      - name: Audit pinned original NBA PBP possessions privately
        run: |
          set -euo pipefail
          git clone -q --depth=1 --filter=blob:none --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set --no-cone \
            'gamepulse/fusion/analysis/igp81_n2pp_possession_differential_v11.py' \
            'gamepulse/fusion/analysis/igp81_n2pp_boundary_probe_v12.py' \
            'gamepulse/fusion/analysis/igp81_n2pp_episode_classification_v13.py' \
            'gamepulse/fusion/analysis/igp81_n2pp_field_episode_eligibility_v14.py' \
            'gamepulse/fusion/analysis/igp81_n2pp_source_ledger_v15.py' \
            'gamepulse/fusion/analysis/igp81_n2pp_source_ledger_scoring_v16.py' \
            'gamepulse/fusion/analysis/igp81_n2pp_residual_score_audit_v17.py' \
            'gamepulse/fusion/analysis/igp81_n2pp_native_zone_bootstrap_v6.py' \
            'gamepulse/fusion/analysis/igp81_n2pp_original_nba_pbp_zone_v8.py' \
            'gamepulse/fusion/qa/analysis/igp81_n2pp_original_native_v5.json' \
            'gamepulse/fusion/qa/analysis/igp81_n2pp_original_nba_zone_v8.json' \
            'gamepulse/fusion/analysis/igp81_n2pp_official_first_audit_v3.py' \
            'gamepulse/fusion/analysis/igp81_threepoint_net_two_possessions_v1.py' \
            'gamepulse/fusion/analysis/igp81_threepoint_methodology_expert_audit_v2.py' \
            'gamepulse/fusion/universal_possession_alignment_2026.py' \
            'gamepulse/fusion/igp_p2b_missed_and_one_credit_v1.py' \
            'gamepulse/fusion/audit_igp_p2b_missed_and_one_81_v1.py' \
            'gamepulse/fusion/materialized/igp_2026_27_unified_season_v3/shot_biomechanics_all81_v1/index.json' \
            'gamepulse/fusion/official_pbp_timing/games/*.json' \
            'gamepulse/fusion/official_pbp_timing/pbp_only_oct21_10/source_receipt.json' \
            'gamepulse/fusion/qa/igp_v32/igp_v32_p2b_nba71_published_team_POSS_bridge_v1.json'
          cd "$RUNNER_TEMP/private"
          PYTHONPATH=gamepulse/fusion:gamepulse/fusion/analysis python3 gamepulse/fusion/analysis/igp81_n2pp_residual_score_audit_v17.py --root . --output "$RUNNER_TEMP/v17.json" > "$RUNNER_TEMP/v17.log" 2>&1 || { echo PRIVATE_POSSESSION_V17_FAILED; exit 43; }
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"v17.json")))
          assert d["game_count"]==81 and d["unmatched_team_games"]==28
          assert d["counts"]["out_of_credited_own_episode_points"]==20
          assert d["statistical_possessions_certified"] is False
          print("N2PP_V17_NBA_TEAM_RESIDUAL_ADMIN_SCORE_AUDIT",json.dumps({
            "team_games_unmatched":d["unmatched_team_games"],
            "score_and_residual_counts":d["counts"],
            "official_score_conserved":d["source_score_conservation_verified"],
            "certified":False},sort_keys=True))
          PY
      - name: Commit private QA evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess
          file=pathlib.Path(os.environ["RUNNER_TEMP"])/"v17.json"
          dest="repos/timeedmonds-maker/104/contents/gamepulse/fusion/qa/analysis/igp81_n2pp_residual_score_audit_v17.json"
          body={"branch":os.environ["BRANCH"],"message":"qa(private): original NBA 162-team source field boundary probes v12 [skip ci]","content":base64.b64encode(file.read_bytes()).decode()}
          check=subprocess.run(["gh","api",dest+"?ref="+os.environ["BRANCH"]],capture_output=True,text=True)
          if check.returncode==0:raise RuntimeError("REFUSE_V17_QA_OVERWRITE")
          out=subprocess.run(["gh","api","-X","PUT",dest,"--input","-"],input=json.dumps(body),capture_output=True,text=True)
          if out.returncode:raise RuntimeError("V17_PRIVATE_QA_WRITE_FAILED")
          print("N2PP_V17_PRIVATE_QA_COMMIT",json.loads(out.stdout)["commit"]["sha"])
          PY
      - name: Store private diagnostics
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/v17.log" ]; then
            python3 - <<'PY'
          import base64,json,os,pathlib,subprocess
          dest="repos/timeedmonds-maker/104/contents/gamepulse/fusion/qa/analysis/igp81_n2pp_v17_failure.json"
          body={"branch":os.environ["BRANCH"],"message":"qa(private): N2PP V17 failure trace [skip ci]","content":base64.b64encode(json.dumps({"trace":(pathlib.Path(os.environ["RUNNER_TEMP"])/"v17.log").read_text()[-5000:]}).encode()).decode()}
          q=subprocess.run(["gh","api",dest+"?ref="+os.environ["BRANCH"]],capture_output=True,text=True)
          if q.returncode==0:body["sha"]=json.loads(q.stdout)["sha"]
          r=subprocess.run(["gh","api","-X","PUT",dest,"--input","-"],input=json.dumps(body),capture_output=True,text=True)
          if r.returncode:raise RuntimeError("PRIVATE_FAILURE_WRITE_FAILED")
          print("V17_PRIVATE_DIAGNOSTIC_RECORDED")
          PY
          fi
