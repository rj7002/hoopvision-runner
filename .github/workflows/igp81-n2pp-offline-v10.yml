name: IGP N2PP 2025-26 NBA historical PBP source feasibility
on:
  push:
    branches: [analysis/n2pp-source-verified-runner-20261101]
    paths: ['.github/workflows/igp81-n2pp-offline-v10.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      PRIVATE_BRANCH: analysis/igp81-two-possession-three-value-20261101
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Public confidentiality guard and private GitHub permission
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          test "$(gh api repos/timeedmonds-maker/104 --jq .private)" = true
          gh auth setup-git
      - name: Source read and private evidence probe
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth=1 --filter=blob:none --sparse -b "$PRIVATE_BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set --no-cone \
            'gamepulse/fusion/analysis/igp2025_26_n2pp_source_feasibility_v1.py'
          cd "$RUNNER_TEMP/private"
          python3 gamepulse/fusion/analysis/igp2025_26_n2pp_source_feasibility_v1.py --out "$RUNNER_TEMP/season2025-source-audit.json" > "$RUNNER_TEMP/private-probe.log" 2>&1
          python3 - <<'PY'
          import json,os
          p=os.path.join(os.environ["RUNNER_TEMP"],"season2025-source-audit.json")
          data=json.load(open(p))
          assert data["season"]=="2025-26" and data["totals"]["tested"]==6
          print("IGP2025_26_HISTORICAL_SOURCE_AVAILABILITY",json.dumps({
            "totals":data["totals"],
            "games":[{"gid":x["game_id"],"pbp":x.get("playbyplay_access"),
                      "box":x.get("boxscore_access"),"3PA":x.get("official_3pa"),
                      "legacy_xy":x.get("official_3pa_with_legacy_xy")}
                     for x in data["game_sources"]]},sort_keys=True))
          PY
      - name: Save SHA-backed historical source feasibility privately
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess
          raw=(pathlib.Path(os.environ["RUNNER_TEMP"])/"season2025-source-audit.json").read_bytes()
          route="repos/timeedmonds-maker/104/contents/gamepulse/fusion/qa/analysis/igp2025_26_n2pp_source_feasibility_v1.json"
          body={"branch":os.environ["PRIVATE_BRANCH"],
                "message":"qa(private): 2025-26 six-game official NBA PBP source availability probe [skip ci]",
                "content":base64.b64encode(raw).decode()}
          cur=subprocess.run(["gh","api",route+"?ref="+os.environ["PRIVATE_BRANCH"]],capture_output=True,text=True)
          if cur.returncode==0:raise SystemExit("REFUSE_2025_SOURCE_PROBE_QA_OVERWRITE")
          call=subprocess.run(["gh","api","-X","PUT",route,"--input","-"],input=json.dumps(body),capture_output=True,text=True)
          if call.returncode:raise RuntimeError("2025_PRIVATE_FEASIBILITY_QA_WRITE_FAILED")
          print("IGP2025_26_PRIVATE_QA_COMMIT",json.loads(call.stdout)["commit"]["sha"])
          PY
