name: Official NBA defensive matchup HTTP and identity diagnostics
on:
  push:
    branches: [research/nba-matchup-gleague-probe-20261111]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe exact official matchup feed for four selected games
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.parse,urllib.request,urllib.error
          headers={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36",
                   "Referer":"https://www.nba.com/","Origin":"https://www.nba.com",
                   "Accept":"application/json, text/plain, */*",
                   "x-nba-stats-origin":"stats","x-nba-stats-token":"true"}
          for gid in ("0022600116","0022600186","0022600208","0022600210"):
            url="https://stats.gleague.nba.com/stats/boxscorematchupsv3?GameID="+gid
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=15) as r:
                raw=r.read(1000000); status=r.status
              j=json.loads(raw)["boxScoreMatchups"]
              print("PROBE_OK",gid,"HTTP",status,"SIZE",len(raw),"ROOT_TEAMS",
                    j.get("homeTeamId"),j.get("awayTeamId"),
                    "NESTED_TEAMS",j.get("homeTeam",{}).get("teamId"),j.get("awayTeam",{}).get("teamId"),
                    "PLAYERS",len(j.get("homeTeam",{}).get("players",[])),len(j.get("awayTeam",{}).get("players",[])))
            except urllib.error.HTTPError as e:
              print("PROBE_HTTP_ERROR",gid,e.code,e.reason)
            except Exception as e:
              print("PROBE_ERROR",gid,type(e).__name__,str(e)[:140])
          PY
