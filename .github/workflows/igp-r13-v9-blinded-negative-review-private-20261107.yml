          cd "$RUNNER_TEMP/private"
          gh api 'repos/timeedmonds-maker/104/contents/courtcoder/nba_event_angle_discovery.py?ref=courtcoder%2Fintegration' \
               --jq .content | base64 --decode > nba_event_angle_discovery.py
          test -s nba_event_angle_discovery.py
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq >/dev/null 2>&1
            sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1
          fi
          command -v ffmpeg >/dev/null
          echo R13_V8C_EPHEMERAL_VIDEO_DECODER_READY
