# Public orchestration of private original NBA PBP. No licensed XYZ or raw PBP in public logs.
name: IGP NBA71 advanced-style OREB continuation possession audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gamepulse-igp-p2b-nba-style-oreb71-v1.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: igp71-nba-style-oreb-source-audit
  cancel-in-progress: false
jobs:
  nba-style-oreb-71:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GAMEPULSE_PRIVATE_RELEASE_TOKEN }}
      BRANCH: research/igp-v32-p2b-all-action-crosswalk-20261031
      PIN: d3098e4872102d88a345210e5ac6a9e2d3a7a06c
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify private immutable source checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/public_content_guard.py
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone -q --filter=blob:none --depth=1 --sparse -b "$BRANCH" https://github.com/timeedmonds-maker/104.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" fetch -q --depth=1 origin "$PIN"
          git -C "$RUNNER_TEMP/private" checkout -q --detach "$PIN"
          git -C "$RUNNER_TEMP/private" sparse-checkout set gamepulse/fusion
          test "$(git -C "$RUNNER_TEMP/private" rev-parse HEAD)" = "$PIN"
          echo NBA71_ORIGINAL_PRIVATE_SOURCE_PIN_VERIFIED
      - name: Source-free OREB and attack-phase rules
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 -m py_compile gamepulse/fusion/igp_v32_p2b_advanced_possession_overlay_v1.py gamepulse/fusion/igp_v32_p2b_advanced_possession_71_source_qa_v1.py
          python3 -m unittest -v gamepulse/fusion/tests/test_igp_v32_p2b_advanced_possession_overlay_v1.py
      - name: All 71 original PBP and Advanced team POSS audit
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          export PYTHONPATH=gamepulse/fusion
          python3 gamepulse/fusion/igp_v32_p2b_advanced_possession_71_source_qa_v1.py \
            --root . --out "$RUNNER_TEMP/igp_nba_style_71game_oreb_qa_v1.json" \
            > "$RUNNER_TEMP/igp_nba_style_private_source.log" 2>&1 || {
              echo NBA_STYLE_71_GAME_SOURCE_QA_FAILED
              python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ["RUNNER_TEMP"])/"igp_nba_style_private_source.log").read_text(errors="replace").splitlines()
          for line in reversed(lines):
              if re.match(r"^(?:ValueError|TypeError|KeyError|AssertionError):",line):
                  kind,_,detail=line.partition(":")
                  code=detail.strip().split(":")[0].split()[0]
                  print("SOURCE_QA_FAILURE_CLASS",kind,
                    code if re.fullmatch(r"[A-Z_]{5,90}",code) else "REDACTED")
                  break
          else:print("SOURCE_QA_FAILURE_CLASS UNCLASSIFIED")
          PY
              exit 53
            }
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          a=json.loads((Path(os.environ["RUNNER_TEMP"])/"igp_nba_style_71game_oreb_qa_v1.json").read_bytes())
          n=a["counts"]
          assert n["games"]==71 and n["original_PBP_actions"]==43419
          assert n["original_PBP_chains"]==14612
          assert n["NBA_published_POSS"]==14552 and n["team_game_rows"]==142
          assert n["total_attack_phases_in_original_chains"]==n["original_PBP_chains"]+n["OREB_continuation_phases_in_original_chains"]
          assert a["OREB_produces_additional_possession_credit"] is False
          assert a["physical_custody_boundaries_certified"]==0
          print("NBA71_ADVANCED_STYLE_OREB_POSSESSION_PASS",json.dumps(n,sort_keys=True))
          PY
      - name: Preserve full original 71-game QA receipt ONLY in private research branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private"
          gh auth setup-git
          git fetch -q origin "$BRANCH"
          git checkout -q -B nba-style-oreb "origin/$BRANCH"
          receipt=gamepulse/fusion/qa/igp_v32/igp_v32_p2b_nba_advanced_style_oreb_71_SOURCE_v1.json
          if [ -f "$receipt" ]; then echo NBA_STYLE_OREB_RECEIPT_ALREADY_PRESERVED; exit 0; fi
          cp "$RUNNER_TEMP/igp_nba_style_71game_oreb_qa_v1.json" "$receipt"
          git add -f "$receipt"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'qa(igp): preserve 71-game NBA style OREB possession phase census'
          for n in 1 2 3 4 5; do
              git fetch -q origin "$BRANCH"
              git rebase -q "origin/$BRANCH"
              if git push -q origin "HEAD:refs/heads/$BRANCH"; then
                  echo NBA71_OREB_POSSESSION_QA_RECEIPT_COMMITTED_PRIVATE
                  exit 0
              fi
              sleep "$n"
          done
          exit 54
