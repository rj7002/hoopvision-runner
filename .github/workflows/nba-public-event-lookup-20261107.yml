name: NBA public play-by-play exact event lookup 20261107
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nba-public-event-lookup-20261107.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  nba-public-event-lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Find exact Shai Gilgeous-Alexander Q2 03:33 free throw event
        env:
          GAME_ID: '0022600180'
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request, time
          game_id=os.environ['GAME_ID']
          url=f"https://cdn.nba.com/static/json/liveData/playbyplay/playbyplay_{game_id}.json"
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json','Referer':'https://www.nba.com/'})
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(req,timeout=20) as resp:
                      d=json.load(resp)
                  break
              except Exception:
                  if attempt==2: raise
                  time.sleep(3)
          a=d['game']['actions']
          found=[]
          for x in a:
              if int(x.get('period',0))!=2: continue
              clock=x.get('clock') or ''
              if not re.search(r'PT0?3M33(?:[.]\\d+)?S',clock): continue
              out={'gameId':game_id,'actionNumber':x.get('actionNumber'),'period':x.get('period'),'clock':clock,'actionType':x.get('actionType'),'subType':x.get('subType'),'description':x.get('description'),'scoreHome':x.get('scoreHome'),'scoreAway':x.get('scoreAway')}
              found.append(out)
              print('OFFICIAL_PBP_EVENT',json.dumps(out,sort_keys=True))
          assert len(found)>0, 'NO_Q2_3_33_EVENT'
          relevant=[x for x in found if 'Gilgeous-Alexander' in str(x['description']) and ('free throw' in str(x['description']).lower() or str(x['actionType']).lower()=='freethrow')]
          assert relevant, 'NO_SHai_FT_EVENT'
          for x in relevant:
              print('DIRECT_CLIP',f"https://clips.nba.com/?gameNo={game_id}&eventNum={x['actionNumber']}&source=grs",x['description'])
          PY
